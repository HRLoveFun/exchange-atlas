    - {id: stock_level, label_zh: 个股级, label_en: Stock-level}
    - {id: both, label_zh: 指数级+个股级, label_en: Both}

matching_principle:
  # 连续交易时段订单簿的成交优先级模型。绝大多数订单驱动市场是纯「价格优先、
  # 时间优先」；下面另外三档是对它的结构性偏离——显示单优先于隐藏单 / 经纪商
  # 自成交优先 / 逐合约在时间优先与按比例分配间切换。开收盘集合竞价由做市商
  # 主持（NYSE DMM、ASX/SIX 集合竞价算法等）记在 opening_mechanism / closing_mechanism，
  # 不进本词表——本词表只描述盘中连续撮合。粒度取舍见 DECISIONS.md [ADR-038]。
  values:
    - {id: price_time, label_zh: 价格-时间优先, label_en: Price-Time Priority}
    - {id: price_display_time, label_zh: 价格-显示-时间优先, label_en: Price-Display-Time Priority}
    - {id: price_time_broker_priority, label_zh: 价格-时间优先+经纪商优先, label_en: "Price-Time + Broker Priority"}
    - {id: price_time_or_pro_rata, label_zh: 价格-时间优先/按比例分配（逐合约）, label_en: "Price-Time or Pro-Rata (per contract)"}

execution_model:
  # 市场组织的基本形态（Harris《Trading and Exchanges》的分类）。matching_principle
  # 是「订单驱动」模型内部的成交优先级细化，与本词表是两个层次，不重复。口头竞价 vs
  # 电子撮合的差异写进字段 detail——本项目 20 家样本已基本全电子，不单开枚举维度。
  values:
    - {id: order_driven, label_zh: 订单驱动, label_en: Order-driven}
    - {id: quote_driven, label_zh: 报价驱动（交易商/做市商）, label_en: "Quote-driven (Dealer)"}
    - {id: hybrid, label_zh: 混合（订单簿+做市商）, label_en: "Hybrid (Book + Market Makers)"}
    - {id: brokered, label_zh: 经纪撮合, label_en: Brokered}

yes_no:
  # id 和 label_en 都必须加引号：裸写的 yes/no/Yes/No 会被 YAML 1.1 解析成布尔值
  # 而不是字符串（大小写不敏感，"No" 一样会中招）。id 不加引号会导致数据文件里
  # `enum: "no"`（字符串）永远匹配不上这里的 False（布尔）；label_en 不加引号则是
  # 前端第一次真正读取 label_en（而不是硬编码只读 label_zh）时才会暴露——之前一直
  # 是死代码路径，没人发现 label_en 其实是布尔值 false 不是字符串 "No"。
  values:
    - {id: "yes", label_zh: 有, label_en: "Yes"}
    - {id: "no", label_zh: 无, label_en: "No"}
    - {id: partial, label_zh: 部分/有限, label_en: Partial}
