    - {id: covered_only, label_zh: 仅限备兑（禁裸卖空、无报升无名单）, label_en: Covered-only (naked banned, no uptick/list)}
    - {id: restricted_uptick, label_zh: 报升规则限制, label_en: Uptick-rule Restricted}
