# 受控词表 — 唯一裁决
#
# 职责边界（见 CLAUDE.md）：本文件是枚举值集合与其双语标签的唯一权威。
# taxonomy.yml 的字段通过 enum_ref 引用这里的 key；不要在别处再定义枚举值。
