# glossary.yml — 术语译法唯一裁决
#
# 职责边界（见 CLAUDE.md）：本文件是「同一机制在不同交易所应该怎么统一称呼」的
# 唯一权威。data/exchanges/*.yml 里的 detail 文本、matrix 短标签遇到这些概念时，
# 中文一律使用这里的 zh；PROJECT/GLOSSARY.md 由本文件生成，不要手改那份。
#
# 加新术语的时机：填交易所数据时遇到一个尚未收录、且未来可能在别的交易所
# 再次出现的机制/概念，就在这里加一条（对应 add-exchange 流程的「回写」步骤）。
# 只出现一次、不跨交易所比较的专有名词不必收录——收录成本要小于它节省的
# 未来重查/统一成本才值得。
#
# 字段：
#   id      kebab-case 唯一键
#   zh      标准中文译法（矩阵与 detail 文本统一使用）
#   en      标准英文对照
#   natives 该概念在各交易所官方语言中的原文，{语言代码: 原文}
#   note    简短说明，帮助判断该词与近义词的边界

terms:
  - id: circuit-breaker-index
    zh: 指数熔断
    en: Market-wide Circuit Breaker
    note: 大盘指数触发阈值后全市场暂停交易的机制，区别于个股级的波动性中断

  - id: volatility-control-mechanism
    zh: 波动性中断机制
    en: Volatility Control Mechanism (VCM)
    natives: {en: "Volatility Control Mechanism (VCM)"}
    note: 港交所个股级机制，触发后进入冷静期，非全市场停牌

  - id: eurex-volatility-interruption
    zh: 波动性中断
    en: Volatility Interruption
    natives: {en: "Volatility Interruption"}
    note: Deutsche Börse Group（Eurex与Xetra/FWB）共用机制，预期成交价超出动态/静态价格区间即触发，以集合竞价恢复交易；官方英文名与港交所VCM不同，且身兼波动性中断与"涨跌停执行方式"双重角色，不与volatility-control-mechanism合并一条。Xetra（de-xetra）另设"自动扩展区间"（automated price range extension）模型用于ETF/ETN/ETC，是de-eurex没有的变体

  - id: designated-sponsor
    zh: 指定发起人
    en: Designated Sponsor
    natives: {en: "Designated Sponsor"}
    note: Xetra特有做市参与者角色，为流动性较低证券提供双边约束报价，须遵守最大点差/最小报价量/最小报价时长等质量标准，原则上亦受MiFID II/MiFIR监管做市商规则约束；与纽交所"指定做市商"（DMM）功能相近但制度渊源不同（欧盟MiFID II框架 vs 美国交易所规则），不合并为一条

  - id: eu-regulated-market
    zh: 受监管市场
    en: "EU Regulated Market"
    note: 欧盟MiFID II法律意义上的"受监管市场"（如法兰克福的Prime Standard/General Standard），区别于多边交易设施（MTF）性质的"公开市场"；预计随fr-euronext等其他欧盟交易所建档时复用

  - id: eu-open-market-mtf
    zh: 公开市场（多边交易设施）
    en: "Open Market (MTF)"
    natives: {de: Freiverkehr}
    note: 德国交易所法意义上的"Regulierter Freiverkehr"，性质是多边交易设施（MTF）而非受监管市场；法兰克福的Scale板块即设于此，适用的监管义务比受监管市场更轻

  - id: sgx-circuit-breaker-cooling-off
    zh: 熔断冷静期机制
    en: Circuit Breaker / Cooling-Off Period
    natives: {en: "Circuit Breaker and Cooling-Off Period"}
    note: SGX机制，个股/期货合约级别，以滚动参考价（一般为5分钟前成交价）为基准±10%价格带，超出即触发5分钟冷静期（非停牌，价格带内仍可继续交易），官方原文明确"not intended to halt price movement"、区别于固定每日涨跌停模式；与港交所VCM、Eurex波动性中断概念相近但触发机制/冷静期时长/覆盖范围（限STI/MSCI Singapore Free Index成分股及价格≥0.50的产品）均不同，不合并条目

  - id: limit-up-limit-down
    zh: 涨跌限价机制
    en: Limit Up-Limit Down (LULD)
    natives: {en: "Limit Up-Limit Down (LULD)"}
    note: 美国证券市场的个股价格带机制，以过去5分钟均价为基准动态计算

  - id: price-limit-percentage-band
    zh: 涨跌幅限制
    en: Price Limit (Percentage Band)
    note: 以前收盘价为基准的百分比涨跌幅限制，如上交所主板 ±10%

  - id: price-limit-absolute-tiered
    zh: 值幅限制
    en: Price Limit (Absolute Tiered)
    natives: {ja: 値幅制限}
    note: 按价格区间分档规定绝对值幅（非百分比），日本市场典型做法；基准价称「基準値段」

  - id: reference-price
    zh: 基准价
    en: Reference Price
    natives: {ja: 基準値段}

  - id: intraday-reversal-t0
    zh: 当日回转交易
    en: "Intraday Reversal Trading (T+0)"
    note: 当日买入的证券当日可卖出

  - id: intraday-reversal-t1
    zh: 不可当日回转
    en: "No Intraday Reversal (T+1)"
    note: 当日买入的证券须次一交易日起才可卖出

  - id: registration-based-ipo
    zh: 注册制
    en: Registration-based (IPO Review)

  - id: approval-based-ipo
    zh: 核准制
    en: Approval-based (IPO Review)

  - id: central-counterparty
    zh: 中央对手方
    en: Central Counterparty (CCP)

  - id: central-securities-depository
    zh: 中央证券存管机构
    en: Central Securities Depository (CSD)

  - id: market-maker-scheme
    zh: 做市商制度
    en: Market Maker Scheme

  - id: designated-market-maker
    zh: 指定做市商
    en: Designated Market Maker (DMM)
    natives: {en: "Designated Market Maker (DMM)"}
    note: 纽交所特有的场内做市商角色，负责维持特定股票的公平有序市场

  - id: sgx-designated-market-maker
    zh: 指定做市商
    en: Designated Market-Maker
    natives: {en: "Designated Market-Maker"}
    note: SGX机制（规则手册Chapter 6），须就获批品种在交易系统持续提供有约束力的双边报价，与纽交所DMM同名但不是同一制度——纽交所DMM是场内实体角色，SGX这是电子市场下的做市义务注册资格，不与designated-market-maker合并一条

  - id: stock-connect
    zh: 互联互通机制
    en: Stock Connect
    note: 内地与香港市场间的跨境交易安排，如沪港通/深港通

  - id: closing-auction
    zh: 收盘集合竞价
    en: Closing Auction

  - id: opening-auction
    zh: 开盘集合竞价
    en: Opening Auction

  - id: block-trade
    zh: 大宗交易
    en: Block Trade

  - id: odd-lot
    zh: 碎股
    en: Odd Lot

  - id: board-lot
    zh: 一手/整手
    en: Board Lot

  - id: short-selling-uptick-rule
    zh: 报升规则
    en: Uptick Rule
    note: 卖空价格不得低于最近成交价的限制性规则

  - id: naked-short-selling
    zh: 裸卖空
    en: Naked Short Selling

  - id: portfolio-margining
    zh: 组合保证金
    en: Portfolio Margining
    note: 欧洲期货交易所 Prisma 等采用的基于全组合风险计算保证金的方法，区别于逐笔保证金

  - id: dividend-withholding-tax
    zh: 股息预扣税
    en: Dividend Withholding Tax

  - id: stamp-duty
    zh: 印花税
    en: Stamp Duty

  - id: special-quote
    zh: 特别气配
    en: Special Quote
    natives: {ja: 特別気配}
    note: 东证机制，申报价超出值幅制限时不成交、改为显示指示性价格，是值幅制限的执行方式而非独立于价格限制之外的冷静期，与港交所VCM那种独立机制不同类

  - id: t0-settlement-pilot
    zh: T+0结算（试点）
    en: "T+0 Settlement (Pilot)"
    note: 印度NSE 2024年起对部分股票试点的可选同日资金证券交收机制，与常规T+1结算并行、非强制；与"当日回转交易"（intraday-reversal-t0，指当日买入的证券当日可卖出，属交易层面）是两个不同维度的概念——一个是结算周期，一个是能否当日反向交易，不要混用

  - id: foreign-portfolio-investor
    zh: 合格境外投资者（FPI）
    en: Foreign Portfolio Investor (FPI)
    note: 印度SEBI对境外投资者参与本地二级市场的注册分类框架，与QFII等其他新兴市场的外资准入分类属同类概念，比较时注意具体持股比例上限、审批流程等细节因市场而异

  - id: securities-transaction-tax
    zh: 证券交易税（STT）
    en: Securities Transaction Tax (STT)
    note: 印度对证券及其衍生品交易征收的交易税，按买卖方向与交易品类分别设定税率，与印花税（stamp-duty）是并行但不同的税目，不要合并成一条

  - id: risk-warning-board
    zh: 风险警示板
    en: Risk Warning Board
    note: 沪深交易所对被实施风险警示的股票（ST/*ST）及处于退市整理期的股票设立的独立交易板块，交易信息与揭示单独处理，且往往搭配专门的投资者适当性门槛（如深交所退市整理股票要求个人投资者两年交易经验+50万元资产）

  - id: lse-price-monitoring
    zh: 价格监控机制
    en: Price Monitoring (Static/Dynamic)
    natives: {en: "Static Price Monitoring / Dynamic Price Monitoring"}
    note: 伦敦证券交易所逐证券（非全市场）的价格监控机制，静态阈值相对上一次集合竞价价、动态阈值相对最近成交价，触发后转入波动性拍卖重新形成价格而非直接停牌；与美股LULD、港交所VCM、Eurex波动性中断同属"触发后转拍卖"一类，但阈值设计（按流动性分层的静态/动态双轨）是LSE特有

  - id: recognised-investment-exchange
    zh: 认可投资交易所
    en: Recognised Investment Exchange (RIE)
    note: 英国法律地位，交易所自身作为一线监管方对市场准入交易与市场运作负责，与FCA依UKLR对官方名册（Official List）的监管职能并行，是"交易所自身兼一线监管"与"纯外部机构监管"之外的第三种组合

  - id: sponsor-uklr
    zh: 保荐人
    en: Sponsor
    note: UKLR框架下，官方名册发行人在特定触发事件（如须发布招股说明书、反向收购通函等）下须委任的保荐人角色，向FCA确认申请人/发行人符合相关上市规则要求；与AIM的Nominated Adviser不同——Sponsor只在触发事件发生时需要，不要求持续委任

  - id: nominated-adviser
    zh: 认可保荐人
    en: Nominated Adviser (Nomad)
    note: AIM市场特有的持续把关角色，AIM公司须始终委任一名，负责持续评估公司对AIM监管框架的适当性；与UKLR的Sponsor角色（仅特定触发事件下需要）不同，不要合并

  - id: shares-in-public-hands
    zh: 公众持股比例
    en: Shares in Public Hands (Free Float)
    note: UKLR项下官方名册的自由流通量要求，最低10%，跌破且未在合理期限内恢复可触发取消上市；概念上对应中文语境的"公众持股量"

  - id: stamp-duty-reserve-tax
    zh: 印花税储备税
    en: Stamp Duty Reserve Tax (SDRT)
    note: 英国对电子（无纸化）证券交易征收的税种，税率0.5%，经CREST系统自动代收并划付HMRC；与适用于纸质转让文书的传统印花税（Stamp Duty，见stamp-duty条）并行，两者税率相同但适用场景（电子/纸质）不同，不是同一税种的两种叫法

