# glossary.yml — 术语译法唯一裁决
#
# 职责边界（见 CLAUDE.md）：本文件是「同一机制在不同交易所应该怎么统一称呼」的
# 唯一权威。data/exchanges/*.yml 里的 detail 文本、matrix 短标签遇到这些概念时，
# 中文一律使用这里的 zh；PROJECT/GLOSSARY.md 由本文件生成，不要手改那份。
#
# 加新术语的时机：填交易所数据时遇到一个尚未收录、且未来可能在别的交易所
# 再次出现的机制/概念，就在这里加一条（对应 add-exchange 流程的「回写」步骤）。
# 只出现一次、不跨交易所比较的专有名词不必收录——收录成本要小于它节省的
# 未来重查/统一成本才值得。
#
# 字段：
#   id      kebab-case 唯一键
#   zh      标准中文译法（矩阵与 detail 文本统一使用）
#   en      标准英文对照
#   natives 该概念在各交易所官方语言中的原文，{语言代码: 原文}
#   note    简短说明，帮助判断该词与近义词的边界

terms:
  - id: circuit-breaker-index
    zh: 指数熔断
    en: Market-wide Circuit Breaker
    note: 大盘指数触发阈值后全市场暂停交易的机制，区别于个股级的波动性中断

  - id: volatility-control-mechanism
    zh: 波动性中断机制
    en: Volatility Control Mechanism (VCM)
    natives: {en: "Volatility Control Mechanism (VCM)"}
    note: 港交所个股级机制，触发后进入冷静期，非全市场停牌

  - id: eurex-volatility-interruption
    zh: 波动性中断
    en: Volatility Interruption
    natives: {en: "Volatility Interruption"}
    note: Deutsche Börse Group（Eurex与Xetra/FWB）共用机制，预期成交价超出动态/静态价格区间即触发，以集合竞价恢复交易；官方英文名与港交所VCM不同，且身兼波动性中断与"涨跌停执行方式"双重角色，不与volatility-control-mechanism合并一条。Xetra（de-xetra）另设"自动扩展区间"（automated price range extension）模型用于ETF/ETN/ETC，是de-eurex没有的变体

  - id: designated-sponsor
    zh: 指定发起人
    en: Designated Sponsor
    natives: {en: "Designated Sponsor"}
    note: Xetra特有做市参与者角色，为流动性较低证券提供双边约束报价，须遵守最大点差/最小报价量/最小报价时长等质量标准，原则上亦受MiFID II/MiFIR监管做市商规则约束；与纽交所"指定做市商"（DMM）功能相近但制度渊源不同（欧盟MiFID II框架 vs 美国交易所规则），不合并为一条

  - id: eu-regulated-market
    zh: 受监管市场
    en: "EU Regulated Market"
    note: 欧盟MiFID II法律意义上的"受监管市场"（如法兰克福的Prime Standard/General Standard），区别于多边交易设施（MTF）性质的"公开市场"；预计随fr-euronext等其他欧盟交易所建档时复用

  - id: eu-open-market-mtf
    zh: 公开市场（多边交易设施）
    en: "Open Market (MTF)"
    natives: {de: Freiverkehr}
    note: 德国交易所法意义上的"Regulierter Freiverkehr"，性质是多边交易设施（MTF）而非受监管市场；法兰克福的Scale板块即设于此，适用的监管义务比受监管市场更轻

  - id: sgx-circuit-breaker-cooling-off
    zh: 熔断冷静期机制
    en: Circuit Breaker / Cooling-Off Period
    natives: {en: "Circuit Breaker and Cooling-Off Period"}
    note: SGX机制，个股/期货合约级别，以滚动参考价（一般为5分钟前成交价）为基准±10%价格带，超出即触发5分钟冷静期（非停牌，价格带内仍可继续交易），官方原文明确"not intended to halt price movement"、区别于固定每日涨跌停模式；与港交所VCM、Eurex波动性中断概念相近但触发机制/冷静期时长/覆盖范围（限STI/MSCI Singapore Free Index成分股及价格≥0.50的产品）均不同，不合并条目

  - id: limit-up-limit-down
    zh: 涨跌限价机制
    en: Limit Up-Limit Down (LULD)
    natives: {en: "Limit Up-Limit Down (LULD)"}
    note: 美国证券市场的个股价格带机制，以过去5分钟均价为基准动态计算

  - id: price-limit-percentage-band
    zh: 涨跌幅限制
    en: Price Limit (Percentage Band)
    note: 以前收盘价为基准的百分比涨跌幅限制，如上交所主板 ±10%

  - id: price-limit-absolute-tiered
    zh: 值幅限制
    en: Price Limit (Absolute Tiered)
    natives: {ja: 値幅制限}
    note: 按价格区间分档规定绝对值幅（非百分比），日本市场典型做法；基准价称「基準値段」

  - id: reference-price
    zh: 基准价
    en: Reference Price
    natives: {ja: 基準値段}

  - id: intraday-reversal-t0
    zh: 当日回转交易
    en: "Intraday Reversal Trading (T+0)"
    note: 当日买入的证券当日可卖出

  - id: intraday-reversal-t1
    zh: 不可当日回转
    en: "No Intraday Reversal (T+1)"
    note: 当日买入的证券须次一交易日起才可卖出

  - id: registration-based-ipo
    zh: 注册制
    en: Registration-based (IPO Review)

  - id: approval-based-ipo
    zh: 核准制
    en: Approval-based (IPO Review)

  - id: central-counterparty
    zh: 中央对手方
    en: Central Counterparty (CCP)

  - id: central-securities-depository
    zh: 中央证券存管机构
    en: Central Securities Depository (CSD)

  - id: market-maker-scheme
    zh: 做市商制度
    en: Market Maker Scheme

  - id: designated-market-maker
    zh: 指定做市商
    en: Designated Market Maker (DMM)
    natives: {en: "Designated Market Maker (DMM)"}
    note: 纽交所特有的场内做市商角色，负责维持特定股票的公平有序市场

  - id: sgx-designated-market-maker
    zh: 指定做市商
    en: Designated Market-Maker
    natives: {en: "Designated Market-Maker"}
    note: SGX机制（规则手册Chapter 6），须就获批品种在交易系统持续提供有约束力的双边报价，与纽交所DMM同名但不是同一制度——纽交所DMM是场内实体角色，SGX这是电子市场下的做市义务注册资格，不与designated-market-maker合并一条

  - id: stock-connect
    zh: 互联互通机制
    en: Stock Connect
    note: 内地与香港市场间的跨境交易安排，如沪港通/深港通

  - id: closing-auction
    zh: 收盘集合竞价
    en: Closing Auction

  - id: opening-auction
    zh: 开盘集合竞价
    en: Opening Auction

  - id: block-trade
    zh: 大宗交易
    en: Block Trade

  - id: odd-lot
    zh: 碎股
    en: Odd Lot

  - id: board-lot
    zh: 一手/整手
    en: Board Lot

  - id: short-selling-uptick-rule
    zh: 报升规则
    en: Uptick Rule
    note: 卖空价格不得低于最近成交价的限制性规则

  - id: naked-short-selling
    zh: 裸卖空
    en: Naked Short Selling

  - id: portfolio-margining
    zh: 组合保证金
    en: Portfolio Margining
    note: 欧洲期货交易所 Prisma 等采用的基于全组合风险计算保证金的方法，区别于逐笔保证金

  - id: dividend-withholding-tax
    zh: 股息预扣税
    en: Dividend Withholding Tax

  - id: stamp-duty
    zh: 印花税
    en: Stamp Duty

  - id: special-quote
    zh: 特别气配
    en: Special Quote
    natives: {ja: 特別気配}
    note: 东证机制，申报价超出值幅制限时不成交、改为显示指示性价格，是值幅制限的执行方式而非独立于价格限制之外的冷静期，与港交所VCM那种独立机制不同类

  - id: t0-settlement-pilot
    zh: T+0结算（试点）
    en: "T+0 Settlement (Pilot)"
    note: 印度NSE 2024年起对部分股票试点的可选同日资金证券交收机制，与常规T+1结算并行、非强制；与"当日回转交易"（intraday-reversal-t0，指当日买入的证券当日可卖出，属交易层面）是两个不同维度的概念——一个是结算周期，一个是能否当日反向交易，不要混用

  - id: foreign-portfolio-investor
    zh: 合格境外投资者（FPI）
    en: Foreign Portfolio Investor (FPI)
    note: 印度SEBI对境外投资者参与本地二级市场的注册分类框架，与QFII等其他新兴市场的外资准入分类属同类概念，比较时注意具体持股比例上限、审批流程等细节因市场而异

  - id: securities-transaction-tax
    zh: 证券交易税（STT）
    en: Securities Transaction Tax (STT)
    note: 印度对证券及其衍生品交易征收的交易税，按买卖方向与交易品类分别设定税率，与印花税（stamp-duty）是并行但不同的税目，不要合并成一条

  - id: risk-warning-board
    zh: 风险警示板
    en: Risk Warning Board
    note: 沪深交易所对被实施风险警示的股票（ST/*ST）及处于退市整理期的股票设立的独立交易板块，交易信息与揭示单独处理，且往往搭配专门的投资者适当性门槛（如深交所退市整理股票要求个人投资者两年交易经验+50万元资产）

  - id: lse-price-monitoring
    zh: 价格监控机制
    en: Price Monitoring (Static/Dynamic)
    natives: {en: "Static Price Monitoring / Dynamic Price Monitoring"}
    note: 伦敦证券交易所逐证券（非全市场）的价格监控机制，静态阈值相对上一次集合竞价价、动态阈值相对最近成交价，触发后转入波动性拍卖重新形成价格而非直接停牌；与美股LULD、港交所VCM、Eurex波动性中断同属"触发后转拍卖"一类，但阈值设计（按流动性分层的静态/动态双轨）是LSE特有

  - id: recognised-investment-exchange
    zh: 认可投资交易所
    en: Recognised Investment Exchange (RIE)
    note: 英国法律地位，交易所自身作为一线监管方对市场准入交易与市场运作负责，与FCA依UKLR对官方名册（Official List）的监管职能并行，是"交易所自身兼一线监管"与"纯外部机构监管"之外的第三种组合

  - id: sponsor-uklr
    zh: 保荐人
    en: Sponsor
    note: UKLR框架下，官方名册发行人在特定触发事件（如须发布招股说明书、反向收购通函等）下须委任的保荐人角色，向FCA确认申请人/发行人符合相关上市规则要求；与AIM的Nominated Adviser不同——Sponsor只在触发事件发生时需要，不要求持续委任

  - id: nominated-adviser
    zh: 认可保荐人
    en: Nominated Adviser (Nomad)
    note: AIM市场特有的持续把关角色，AIM公司须始终委任一名，负责持续评估公司对AIM监管框架的适当性；与UKLR的Sponsor角色（仅特定触发事件下需要）不同，不要合并

  - id: shares-in-public-hands
    zh: 公众持股比例
    en: Shares in Public Hands (Free Float)
    note: UKLR项下官方名册的自由流通量要求，最低10%，跌破且未在合理期限内恢复可触发取消上市；概念上对应中文语境的"公众持股量"

  - id: stamp-duty-reserve-tax
    zh: 印花税储备税
    en: Stamp Duty Reserve Tax (SDRT)
    note: 英国对电子（无纸化）证券交易征收的税种，税率0.5%，经CREST系统自动代收并划付HMRC；与适用于纸质转让文书的传统印花税（Stamp Duty，见stamp-duty条）并行，两者税率相同但适用场景（电子/纸质）不同，不是同一税种的两种叫法

  - id: anomalous-order-threshold
    zh: 异常订单阈值机制
    en: "Anomalous Order Threshold (AOT)"
    natives: {en: "Anomalous Order Threshold (AOT)"}
    note: ASX等澳大利亚市场使用的订单级价格校验机制，每分钟更新基准价，拒绝偏离基准价±10%以上的激进订单；是ASIC统一市场诚信规则(MIR)的一部分，功能定位介于逐笔价格校验与传统涨跌停之间，官方立场是"替代熔断机制"而非熔断机制本身

  - id: extreme-trade-range
    zh: 极端成交区间机制
    en: "Extreme Trade Range (ETR)"
    natives: {en: "Extreme Trade Range (ETR)"}
    note: ASX个股级机制，成交价触及每只股票各自设定的区间即暂停该股交易2分钟，与AOT搭配构成ASX应对价格异常波动的组合机制，功能上对应其他交易所的波动性中断，但官方明确区别于circuit breaker

  - id: continuous-disclosure
    zh: 持续披露义务
    en: Continuous Disclosure
    note: 上市实体一旦知悉可能对证券价格或价值产生重大影响的信息即须立即向市场披露的义务；澳大利亚由ASX Listing Rule 3.1规定，并经《公司法》第674条赋予法定效力，触发标准是"合理人预期有重大价格影响"而非固定周期披露

  - id: sa-tadawul-volatility-auction
    zh: 波动性拍卖
    en: Volatility Auction
    natives: {en: "Volatility Auction"}
    note: 沙特交易所机制，个股静态限制（Static Limit，±10%，随每次拍卖滚动重设）触发后进入5分钟集合竞价冷静期，非全面停牌；与港交所VCM、Eurex Volatility Interruption同属"个股级冷静阀"机制家族，但基准价（静态价）随拍卖滚动重设是其区别于前两者的设计特点

  - id: qualified-investor-parallel-market
    zh: 平行市场合格投资者
    en: Qualified Investor (Parallel Market)
    note: 沙特Nomu平行市场准入限制——只有合格投资者可交易该板块证券，一般公众不可直接参与；与主板面向公众的开放准入形成对比，未来遇到其他市场的"合格投资者专属板块"设计可比对沿用此译法

  - id: maker-taker-pricing
    zh: 做市商-吃单者定价模式
    en: Maker-Taker Pricing
    note: 为市场提供流动性的报单（maker）获返佣，吃走流动性的一方（taker）付费的交易所收费结构；NYSE、Nasdaq 等美国电子化市场的主流费率模式，回填自 us-nyse（首次出现时未收录，us-nasdaq 建档时补录）

  - id: competing-market-maker
    zh: 竞争性做市商制度
    en: Competing Market Maker
    natives: {en: "Market Maker"}
    note: Nasdaq 传统做市商模式——同一证券允许多家会员机构同时登记为做市商、彼此竞争报价，不同于 NYSE 的单一指定做市商（DMM）在同一证券上独占价格发现职责；与 designated-market-maker 是同一大类（做市商制度）下两种结构不同的具体实现，不合并
  - id: krx-volatility-interruption
    zh: 波动性中断
    en: Volatility Interruption (VI)
    natives: {en: "Volatility Interruption"}
    note: 韩国交易所机制，分动态VI（以直前成交价为基准）与静态VI（以固定周期内的单一价格为基准）两种，触发后转为2分钟单一价格集合竞价；官方英文名与Eurex的Volatility Interruption相同，但触发比例与两段式动态/静态设计不同，不与eurex-volatility-interruption合并一条

  - id: sidecar
    zh: 备兑停止制度（Sidecar）
    en: Sidecar
    natives: {en: Sidecar}
    note: 韩国交易所机制，KOSPI200或KOSDAQ150期货价格单方向剧烈变动达阈值时，暂停程序化交易挂单5分钟（每日单方向仅触发一次），与个股级的volatility-interruption、指数级的circuit-breaker-index是三套并行的稳定机制
  - id: euronext-dynamic-static-collar
    zh: 动态/静态价格区间机制
    en: Dynamic/Static Collars
    natives: {en: "Dynamic Collars / Static Collars"}
    note: Euronext机制，两层阈值——动态区间基于逐笔更新的最新成交价，静态区间基于当日开盘价/前日收盘参考价；触及阈值触发预约期（reservation period），不是直接拒单的固定百分比涨跌停，与eurex-volatility-interruption、volatility-control-mechanism均不同类（三者机制细节各异，不合并）

  - id: euronext-market-undertaking
    zh: 交易所运营实体
    en: Market Undertaking
    note: Euronext集团术语，指集团旗下各国分别注册、分别受本国法律与本国监管机构管辖的交易所法人实体（如Euronext Paris S.A.、Euronext Amsterdam N.V.），统一适用同一部Harmonised Rulebook；与NYSE Group/JPX Group那种"同一国家内多个独立法人"的集团结构不同，是"同一部规则、多个法域法人"的结构，见fr-euronext.yml顶部说明与OPEN-QUESTIONS框架性问题第1条
  - id: volatility-auction-call
    zh: 波动性拍卖冷静期
    en: Volatility Auction (Call Session)
    natives: {en: "Volatility Auction Call Session"}
    note: 价格触及静态/动态参考价容忍阈值后，暂停连续交易转入集合竞价撮合的冷静机制；沙特Tadawul（Volatility Auction）与JSE（Volatility Auction Call Session）均使用这一表述，与港交所VCM、Eurex波动性中断属同一功能类别但各自命名与触发基准不同

  - id: static-dynamic-reference-price
    zh: 静态/动态参考价
    en: Static / Dynamic Reference Price
    note: 熔断与价格容忍阈值判定所依据的两类基准价——静态参考价一般为前收盘价（全天固定或按集合竞价更新），动态参考价随最新成交价滚动更新；JSE与sa-tadawul的Static/Static Limit、Eurex的dynamic/static price range均属此概念的不同实现
  - id: b3-trading-tunnel
    zh: 交易隧道
    en: Trading Tunnel
    natives: {pt: "Túnel de negociação"}
    note: B3机制，以最新成交价/最优报价动态计算基准价（PBT）、再加减法或乘除法算出带宽，
      用于拒绝申报（rejection tunnel）、自动转入集合竞价（auction tunnel）与拍卖保护
      （protection tunnel）三种用途；区别于固定百分比涨跌停（价涨跌幅限制）、日本式阶梯
      绝对值幅，也不同于美股LULD以过去5分钟均价为基准

  - id: core-methodology
    zh: 平仓风险评估法
    en: Closeout Risk Evaluation (CORE)
    natives: {pt: "CORE"}
    note: B3计算担保品/保证金需求的风险方法论，模拟违约后平仓过程中的现金流评估风险，
      与Eurex Prisma同属"按方法论命名的保证金计算体系"，但计算逻辑不同，不与
      portfolio-margining一条合并
  - id: single-stock-circuit-breaker
    zh: 个股熔断机制
    en: Single-Stock Circuit Breaker (SSCB)
    natives: {en: "Single-Stock Circuit Breaker (SSCB)"}
    note: 加拿大 CIRO 统一实施的个股级机制，价格在5分钟内波动达到固定阈值（如10%）即触发全市场范围内该股票的5分钟停牌，触发价外5%以上的成交事后撤销；与LULD的「持续价格带+触及后转停牌」结构不同，也与港交所VCM/东证特别气配的「不成交、显示指示性价格」结构不同，是第四种个股波动应对机制样本
  - id: instantaneous-price-stabilization
    zh: 瞬间价格稳定措施
    en: Instantaneous Price Stabilization Measures
    natives: {zh-Hant: 瞬間價格穩定措施}
    note: 台湾证券交易所个股级机制，逐笔交易时段内任一试算成交价超出「前5分钟滚动加权平均价」±3.5%即暂缓该证券撮合2分钟，2分钟后以集合竞价恢复成交，随后恢复逐笔交易；不同于港交所VCM（触发后进入5分钟冷静期）与东证特别气配（不成交只挂指示价），是「延后撮合+以集合竞价出清」这一第三种触发效果，与eurex-volatility-interruption（预期成交价超出动态/静态价格区间即触发，以集合竞价恢复）机制结构最接近但触发基准（滚动均价 vs 静态/动态参考价）与所属市场类型（现货 vs 衍生品）不同，故不合并条目
  - id: highest-executable-volume
    zh: 最大可执行数量原则
    en: Principle of Highest Executable Volume
    note: SIX瑞士交易所集合竞价定价原则——按能撮合出最大成交量的单一价格确定开/收盘价；与Eurex"Netting"流程（同样以最大撮合量定价）是同一类集合竞价定价逻辑在不同交易所的对应表述，比较时可互相参照

  - id: remote-member
    zh: 远程会员
    en: Remote Member
    note: 境外证券商无需在本地设立实体、经监管机构授权即可直接成为交易所交易参与者的会员类别；SIX瑞士交易所（FINMA授权）是本项目首个明确记录该制度的样本，日后遇到其他交易所的同类"跨境直接会员"安排应统一使用这一译法比较

  - id: remote-supervisory-authority
    zh: 属地监管机关
    en: Competent State Authority
    note: 德国/瑞士等联邦制国家里，交易所设立与运作的监管职能可能落在邦/州一级（如Eurex的黑森州监管机关），而非全国性金融监管总局；与"金融业务行为监管"（如BaFin/FINMA）是两个不同层面的监管，比较跨国交易所监管框架时注意区分

  - id: span-margining
    zh: SPAN组合保证金算法
    en: Standard Portfolio Analysis of Risk (SPAN)
    natives: {en: "Standard Portfolio Analysis of Risk (SPAN)"}
    note: 芝加哥商业交易所（CME）研发并授权他方使用的具名组合保证金算法——以16档标准风险情景（价格扫描区间×波动率扫描区间）估算组合单日最大潜在亏损；与更泛化的"组合保证金"（见 portfolio-margining）是属种关系，SPAN是其中一种具体、可被不同交易所直接引用或做"兼容"改造的实现（in-nse 的 NSCCL SPAN 直接使用该算法；hk-hkex 的 PRiME 系统自称"SPAN兼容"但并非同一系统），比较不同交易所保证金方法论时注意区分"直接用SPAN"与"仅兼容SPAN"

  - id: derivatives-operating-range
    zh: （衍生品）操作区间
    en: Operating Range
    natives: {en: "Operating Range"}
    note: in-nse 衍生品分部特有概念——不是严格意义的每日涨跌停（无硬性上下限），而是防止错价申报的订单过滤区间，超出区间的委托会被判定为"价格冻结"（price freeze）而非直接拒绝，区间本身可在盘中被放宽；与 static-dynamic-reference-price（熔断判定基准价）概念相关但用途不同——后者用于触发熔断，前者用于筛掉单笔错价委托，两者不合并

  - id: delisting-remedial-period
    zh: 退市补救期限
    en: Remedial Period
    natives: {en: "Remedial Period"}
    note: 港交所强制退市前给予发行人补救问题并恢复交易的窗口期——分「订明补救期限」（prescribed remedial period，自停牌之日起18个月，Rule 6.01A(1)）与「特定补救期限」（specific remedial period，交易所按个案在6.10条下酌情订立、可短于18个月）两类，期满未补救即可能被除牌；与本项目既有的 delisting-transition-period（若已收录，指退市生效后的整理期）是不同阶段——本字段发生在"停牌后、退市决定作出前"，不要混淆

  - id: default-waterfall
    zh: 违约处置瀑布（亦见"违约损失分摊阶梯"）
    en: Default Waterfall
    natives: {en: "Default Waterfall"}
    note: CCP处置结算参与者违约损失时依次动用各类资源的先后顺序——典型排序为：违约方自身保证金/结算基金出资在先，其次是CCP自有资本注资（Skin in the Game），最后才动用非违约参与者按比例分摊的结算基金出资。本条系 v1.1 Batch 1 并行补全时被两个子代理各自独立造词后合并：hk-hkex 子代理按 HKCC 规则第706条的8步排序造了"违约损失分摊阶梯"（id曾为ccp-default-waterfall，已并入本条），uk-lse 子代理按 LCH Ltd 官方瀑布图造了"违约处置瀑布"（id default-waterfall，本条保留），彼此不知情，合并时才发现重名概念的两种译法。两家 `data/exchanges/*.yml` 的 `zh` 字段正文均已写入各自当时的措辞（未回改，因内容已过 quote/confidence 抽检，不作事后编辑），故当前两种中文表述在库内并存；**日后新增交易所填写该概念时统一使用"违约处置瀑布"**，ca-tsx（CDS Participant Rules）、in-nse（Core SGF & Default Waterfall）此前已用英文原词但未核实细节、也未统一中文译法，可参照此译法补齐

  - id: delisting-transition-period
    zh: 退市整理期
    en: Delisting Transition Period
    note: 退市决定作出之后、正式除牌生效之前，发行人证券被特殊标记但仍可继续交易的过渡窗口——与 delisting-remedial-period（补救期限，发生在"停牌后、退市决定作出前"，目的是给发行人机会恢复合规）是不同阶段，不要混淆。JPX 的做法是先设「监理股份」（Securities Under Supervision，退市决定前的预警标记）、决定退市后再设「整理股份」（Securities to be Delisted，直至退市日前一天），两阶段合计原则上共六个月（见 jp-jpx.yml listing.delisting_transition_period）；沪深交易所的"退市整理期"概念名称与此完全对应，但具体交易日数与投资者适当性门槛按各所规则单独核实，不假定数值一致，仅统一术语译法

