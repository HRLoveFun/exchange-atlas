# schema/spec.yml — 结构化 spec 层的形状定义（权威）
#
# 见 PROJECT/DECISIONS.md [ADR-035] B 节。`spec` 是事实信封的一个键，存该字段
# 量化机制的机器可读形式，驱动 v2.0 的「交易日平面图」等图形。
#
#   - `spec` 是量化事实的机器形式；`zh`/`detail` 是同一事实的人读渲染 + 语境
#     （同构于既有的 `enum` + `zh` 关系）。驱动图的量化值只在 `spec` 手写。
#   - `quote` 仍是 verbatim 底稿；`spec` 是"从 quote 提取、被 quote 反查"的派生值。
#     validate.py 校验 5b（[ADR-033]）：confidence:high 字段 spec 里每个数值都必须
#     能在 quote 里逐字找到。→ spec 只能放当次 quote 撑得住的数值，撑不住的留给
#     Phase 1b 补更完整的 quote 后再加。
#   - 三态：spec 里某键为 null（+ note）= 机制存在数值查不到；spec 里 type=none
#     = 机制确实不存在；spec 键整个缺省 = 尚未填。前端必须区分（[ADR-035] D 节）。
#   - validate.py（Phase 1）校验：spec 必须是 dict；spec 里每个键必须在下面对应
#     字段的 keys 里声明过（挡拼写错）。更深的形态合法性暂不强校验。
#
# 进度：Phase 1a 填了第五章 core 字段的形状 + 5 家示范数据（cn-sse / us-nyse /
# jp-jpx / de-eurex / in-nse）。Phase 1b（[ADR-039]）补齐其余 15 家 + 全 20 家
# volatility_interruption / short_selling / market_maker_scheme 的 spec + JPX
# 值幅制限完整 34 档 ladder（Rule 2 Paragraph 1，此前误记为 37 档）。
# [ADR-042]（2026-08-30）加了 execution_model / error_trade_rule / order_types /
# tick_size 四个 spec 形状（对齐资深交易员清单里「可查证」的维度），short_selling
# 加 margin_note 键——数据回填并入 Phase 3。其余章节 Phase 3。

fields:

  # ── 交易时段：每个时段叶子字段一份 spec ──
  market_structure.trading_sessions.pre_market: &session
    doc: "一个交易时段的当地时刻与性质。start/end 是当地时间 HH:MM（24 小时制）。形态：start/end/kind 三键，或 kind=none（该时段不存在）。"
    keys:
      start: "HH:MM，当地时间"
      end: "HH:MM，当地时间；跨零点的时段 end < start 表示次日"
      kind: "pre_open_queue（挂单排队不成交）/ opening_auction / continuous / closing_auction / fixed_price / lunch_recess / after_hours_continuous / night / none"
      randomised_seconds: "int，可选——结束时刻在此秒数内随机触发（如 ASX）"
      note: "string，可选"
  market_structure.trading_sessions.continuous_am: *session
  market_structure.trading_sessions.lunch_break: *session
  market_structure.trading_sessions.continuous_pm: *session
  market_structure.trading_sessions.after_market: *session
  market_structure.trading_sessions.night_session: *session

  market_structure.opening_mechanism:
    doc: "开盘价的形成方式。"
    keys:
      type: "call_auction / continuous_direct（直接连续竞价）/ dmm_auction（做市商主持）"
      auction_start: "HH:MM，可选"
      auction_end: "HH:MM，可选——集合竞价出清 / 开盘时刻"
      randomised_seconds: "int，可选——出清时刻在此秒数内随机触发（如 ASX 15s）"
      note: "string，可选"

  market_structure.closing_mechanism:
    doc: "收盘价的形成方式。"
    keys:
      type: "call_auction / last_price（末笔成交价）/ vwap_window（尾盘 VWAP）/ dmm_auction"
      auction_start: "HH:MM，可选"
      auction_end: "HH:MM，可选"
      randomised_seconds: "int，可选——出清时刻在此秒数内随机触发（如 ASX 30s）"
      random_close_window_min: "int，可选——出清时刻在一个分钟级窗口内随机（如 HKEX 4:08–4:10 → 2）"
      trade_at_close_end: "HH:MM，可选——收盘后按收盘价撮合的延长窗口结束时刻"
      note: "string，可选"

  market_structure.price_limits.main_board:
    doc: >
      主板 / 主力合约的每日价格限制。y 轴的墙。形态之一：
      (1) 百分比 limit_pct + reference + symmetric，非对称用 limit_pct_up / limit_pct_down；
      (2) 无 type=none；
      (3) 动态参考价 type=dynamic + band_pct（未公布则 null）+ reference_window_min（LULD / Eurex 式）；
      (4) 阶梯绝对值幅 type=stepwise + reference + ladder（每项 base_min / base_max / band_abs）；
      (5) 存在未公布 limit_pct=null + note。
    keys:
      limit_pct: "number 或 null——单边百分比（10 = ±10%）"
      limit_pct_up: "number，可选（非对称时）"
      limit_pct_down: "number，可选（非对称时）"
      reference: "prev_close / prev_settlement——y 轴基准（[ADR-035] E）"
      symmetric: "bool"
      type: "none / dynamic / stepwise"
      band_pct: "number 或 null——type=dynamic 的价格带半宽（未公布则 null）"
      reference_window_min: "number——type=dynamic 的滚动参考价窗口分钟数"
      ladder: "list——type=stepwise 的档位表，每项 base_min / base_max / band_abs"
      full_table_note: "string——ladder 只含 quote 撑得住的锚点时，说明完整表在哪"
      note: "string"

  market_structure.circuit_breaker:
    doc: >
      全市场 / 指数级 / 合约级熔断。形态：type=none，或 type=index_level + reference + levels，
      或 type=stock_level / contract_level + note。
    keys:
      type: "none / index_level / stock_level / contract_level"
      reference: "list——触发依据的指数，每项 index（名称）+ exchange（self 或其它交易所 id）。跨交易所联动（如 in-nse 看 Nifty 50 或 BSE Sensex）用多项表达（[ADR-036] #6）"
      levels: "list——每项 threshold_pct + halt_minutes（number 或 null）+ day_end（bool）"
      note: "string——stock_level / contract_level 无标准档位时的机制说明"

  market_structure.volatility_interruption:
    doc: "个股 / 合约级的波动性中断（价格出走廊触发短暂集合竞价）。形态 type=none 或走廊参数。"
    keys:
      type: "none，可选（确认无时）"
      static_pct: "number 或 null——静态价格区间半宽"
      dynamic_pct: "number 或 null——动态价格区间半宽"
      auction_minutes: "number 或 null——触发后的集合竞价时长"
      halt_minutes: "number 或 null——若为停牌而非集合竞价"
      note: "string"

  market_structure.short_selling:
    doc: "卖空机制的结构化补充（分类见 enum short_selling_stance）。"
    keys:
      naked_allowed: "bool"
      uptick_rule: "bool"
      borrow_required: "bool"
      margin_note: "string，可选——卖空 / 融券保证金要求（维持保证金比例、专项保证金规定等），由交易所 / 清算所 / 监管强制"
      note: "string"

  market_structure.market_maker_scheme:
    doc: "做市商制度的结构化补充。"
    keys:
      present: "bool"
      quote_obligation: "bool——是否有持续双边报价义务"
      max_spread_pct: "number 或 null——报价价差上限"
      note: "string"

  # ── 交易员心智模型对齐补充（[ADR-042]，2026-08-30）──
  # 数据回填并入 Phase 3 各章节的「小型 spec 补充」节奏，不单开 Wave。

  market_structure.execution_model:
    doc: >
      市场组织基本形态的结构化补充（分类见 enum execution_model）。多数键是布尔位，
      缺省表示「原文未提及」，不等于「无」。
    keys:
      electronic: "bool——电子撮合（本 sample 已基本全为 true；口头 / 公开喊价的例外写 note）"
      dealer_intermediated: "bool——是否有交易商 / 做市商作为对手方介入（quote_driven / hybrid）"
      note: "string"

  market_structure.error_trade_rule:
    doc: >
      「明显错误」/ 误发注成交事后处置的结构化补充。resolution 说明处置方式；
      review_window_min / deviation_threshold_pct 给可量化门槛，查不到留 null + note。
    keys:
      bust_allowed: "bool——已成交是否可被作废（日本现货实务上近乎不可作废）"
      review_window_min: "number 或 null——申请复核 / 作废的时限（分钟）"
      deviation_threshold_pct: "number 或 null——构成「明显错误」的成交价偏离参考价幅度"
      resolution: "cancel（作废）/ price_adjust（调整成交价）/ cancel_or_adjust / no_bust（不作废，仅事后监管）"
      note: "string"

  market_structure.order_types:
    doc: >
      交易所标准化订单类型与有效期指令的结构化补充（散文清单见 zh/en）。布尔位缺省表示
      「原文未提及」，不等于「不支持」——不确定就不写该键。
    keys:
      market: "bool——市价单"
      limit: "bool——限价单"
      stop: "bool——止损 / 触价单"
      stop_limit: "bool——止损限价单"
      iceberg: "bool——冰山 / 部分披露"
      hidden: "bool——全隐藏限价单"
      pegged: "bool——盯住 / 挂钩订单"
      tif: "list——有效期指令子集，取值 day / gtc / gtd / fok / ioc"
      note: "string"

  market_structure.tick_size:
    doc: >
      最小报价单位的结构化补充。regime 说明分档方式；min_tick 给最小一档；ladder（可选）
      列锚点档位，完整表用 full_table_note 指向。数值须逐字在 quote 里（校验 5b）。
    keys:
      regime: "uniform（全市场单一）/ tiered_by_price（按价格分档）/ tiered_by_price_and_liquidity（MiFID II 式，价格 × 流动性）/ per_instrument"
      min_tick: "number 或 null——最小一档的绝对报价单位"
      currency: "string，可选——min_tick / ladder 的计价货币"
      ladder: "list，可选——每项 price_min / price_max / tick"
      full_table_note: "string——ladder 只含锚点时说明完整表在哪"
      note: "string"
