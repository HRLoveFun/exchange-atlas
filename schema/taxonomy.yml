# taxonomy.yml — 项目宪法
#
# 职责边界（见 CLAUDE.md 第一节）：本文件唯一负责字段结构、双语标签、矩阵列归属、
# 时效等级、原文要求。具体数据值一律不出现在这里，去 data/exchanges/*.yml。
#
# 本文件是数据结构的唯一权威 —— 不存在独立的 exchange.schema.json，
# tools/sync.py 在构建时从本文件生成校验用的 JSON Schema。
#
# ── 与原始十三章大纲的对应关系 ──
# 原大纲第一章（研究范围与对象界定）和第十三章（研究方法与维护机制）描述的是
# 「如何研究」而非「某交易所的事实」，不适合做逐交易所字段：
#   - 第一章的可执行部分（覆盖范围、集团归属、地区）落地为下面的
#     exchange_identity（交易所身份元数据），不算一个「章」。
#   - 第十三章本身就是这个仓库的工程机制，已经是 CLAUDE.md / SOURCES.md /
#     tools/ 的实现，不需要在数据里再造一份。
# 因此 chapters 收录原大纲第二至十二章，共十一个数据章节，chapter_no 保留
# 原编号以便对照大纲，但不必连续。
#
# ── 字段语法（递归） ──
# 一个 field 要么是「叶子」（type 隐含为 envelope：数据文件里对应一条事实信封
# {zh, en, enum, detail, quote, sources, verified, confidence}，见
# data/exchanges/cn-sse.yml 的写法），要么是「分组」（带 fields:，纯用于组织
# 层级，不代表事实本身，如 price_limits 下面挂 main_board/st_stocks/chinext）。
#
# zh/en 两个语言字段哪个是「原文锚点」、哪个是「翻译展示」，由交易所身份层的
# source_lang 决定（见下 exchange_identity），不是逐字段声明——见 DECISIONS.md
# [ADR-013]。
#
# 叶子字段属性：
#   id             字段键名
#   label_zh / label_en   双语标签（UI 恒双语显示，见 CLAUDE.md 语言体系）
#   volatility     stable(24个月) | moderate(12个月) | volatile(6个月) —— 复核阈值可调初值
#   en_required    是否要求填 en（英文原文或英文对照）；仅对机制名/板块名/法规名/
#                  订单类型名/机构名这类专有名词要求，数字百分比日期不要求
#   enum_ref       引用 enums.yml 的词表 key；矩阵短标签与着色用
#   in_matrix      false，或对比矩阵的维度组 id（见文末 dimension_groups）
#
# 章节属性：
#   kind: object   扁平字段章节（大多数）
#   kind: list     列表型章节（四/产品体系、七/指数体系）；用 item_schema 定义
#                  每个列表项的形状 —— 列表项是「轻量字段」，不是完整事实信封
#                  （没有逐项 quote/confidence，只在 _meta 层面共享一次），
#                  否则几十个期货品种 × 完整信封会把 v0.1 直接压垮。
#                  这是刻意的简化，见 PROJECT/OPEN-QUESTIONS.md「schema 会不会
#                  被列表型章节撑破」。

meta:
  version: 1

# ══════════════════════════════════════════════════════════════
# 交易所身份元数据 —— 每个 data/exchanges/*.yml 顶层必填，不是 chapter
# ══════════════════════════════════════════════════════════════
exchange_identity:
  fields:
    - id: id
      label_zh: 标识符
      label_en: ID
      note: "格式 <ISO3166-1 alpha-2 小写>-<简称>，如 cn-sse, hk-hkex"
    - id: name_zh
      label_zh: 中文名
      label_en: Name (Chinese)
    - id: name_native
      label_zh: 官方原文名
      label_en: Native Name
      note: "对象 {语言代码: 名称}，可多语言，如港交所 {zh-Hant: 香港交易及結算所, en: HKEX}"
    - id: official_languages
      label_zh: 官方语言
      label_en: Official Languages
      note: "BCP47 数组，如 [zh-Hans]；[zh-Hant, en]。仅描述该所本身的官方语言，与 source_lang 是两回事"
    - id: source_lang
      label_zh: 原文语言
      label_en: Source Language
      enum_ref: source_lang
      note: "zh 或 en，必填。决定该所数据的 quote/sources/confidence 锚定哪种语言的原文；
        另一种语言字段视为对源语言的翻译展示。取源规则：有可核实的官方中文原文就填 zh，
        没有就填 en，中英文都没有可靠原文的悬置，不填任何值硬凑（见 DECISIONS.md [ADR-013]）"
    - id: group_id
      label_zh: 所属集团
      label_en: Exchange Group
      note: "如 cme-group；无集团归属则省略此字段。矩阵可按此折叠"
    - id: region
      label_zh: 地区
      label_en: Region
      enum_ref: region

# ══════════════════════════════════════════════════════════════
# 十一个数据章节
# ══════════════════════════════════════════════════════════════
# 单所档案页默认打开的章节（见 app.js renderExchange）。不用 chapters[0]（那是
# overview，背景资料，非交易决策入口）——见 DECISIONS.md ADR-022。chapter_no /
# 导航顺序不变，只是默认选中项不同。
default_chapter: market_structure

chapters:

  # ── 二｜基本信息 ──
  - id: overview
    chapter_no: 2
    label_zh: 基本信息
    label_en: Overview
    kind: object
    fields:
      - id: timezone
        label_zh: 时区
        label_en: Timezone
        volatility: stable
      - id: dst_rule
        label_zh: 夏令时规则
        label_en: DST Rule
        volatility: stable
      - id: founded_year
        label_zh: 成立年份
        label_en: Founded
        volatility: stable
      - id: history
        label_zh: 历史沿革
        label_en: History
        volatility: stable
        note: "重大合并、改制事件，写在 detail 里，字段本身可留短摘要"
      - id: organization_form
        label_zh: 组织形式
        label_en: Organization Form
        volatility: moderate
        enum_ref: organization_form
        in_matrix: overview
      - id: self_listed
        label_zh: 自身是否上市
        label_en: Self-listed
        volatility: moderate
        enum_ref: yes_no
        in_matrix: overview
      - id: market_cap_usd_bn
        label_zh: 总市值（十亿美元）
        label_en: Market Cap (USD bn)
        volatility: volatile
      - id: listed_companies_count
        label_zh: 上市公司数量
        label_en: Listed Companies
        volatility: volatile
      - id: annual_turnover_usd_bn
        label_zh: 年成交额（十亿美元）
        label_en: Annual Turnover (USD bn)
        volatility: volatile
      - id: global_ranking
        label_zh: 全球排名
        label_en: Global Ranking
        volatility: volatile
        note: "如「全球股票市值第X」，写在 detail，字段填简短摘要"
      - id: trading_currency
        label_zh: 交易货币
        label_en: Trading Currency(ies)
        volatility: stable
        in_matrix: overview
      - id: settlement_currency
        label_zh: 结算货币
        label_en: Settlement Currency(ies)
        volatility: stable
        in_matrix: overview

  # ── 三｜监管与法律环境 ──
  - id: regulation
    chapter_no: 3
    label_zh: 监管与法律环境
    label_en: Regulation & Legal Environment
    kind: object
    fields:
      - id: regulator
        label_zh: 政府监管机构
        label_en: Government Regulator
        volatility: stable
        en_required: true
        in_matrix: regulation
      - id: self_regulatory_org
        label_zh: 自律组织
        label_en: Self-regulatory Organization
        volatility: stable
        en_required: true
        in_matrix: regulation
      - id: clearing_regulator
        label_zh: 清算监管机构
        label_en: Clearing Regulator
        volatility: stable
        en_required: true
      - id: core_laws
        label_zh: 核心法律法规体系
        label_en: Core Laws & Regulations
        volatility: moderate
        en_required: true
        note: "法规名清单写 detail，字段填最核心一部的名称"
        in_matrix: regulation
      - id: foreign_ownership_limit
        label_zh: 外资准入与持股比例限制
        label_en: Foreign Ownership Limit
        volatility: moderate
      - id: capital_controls
        label_zh: 资本管制与外汇管制
        label_en: Capital & FX Controls
        volatility: moderate
      - id: disclosure_requirements
        label_zh: 信息披露制度
        label_en: Disclosure Requirements
        volatility: moderate
        note: "语言、频率、渠道"
      - id: investor_protection
        label_zh: 投资者保护机制
        label_en: Investor Protection
        volatility: moderate

  # ── 四｜产品体系（列表型）──
  - id: products
    chapter_no: 4
    label_zh: 产品体系
    label_en: Product Universe
    kind: list
    item_schema:
      - {id: id, label_zh: 标识符, label_en: ID}
      - {id: category, label_zh: 大类, label_en: Category, enum_ref: product_category}
      - {id: name_zh, label_zh: 中文名, label_en: Name (Chinese)}
      - {id: name_native, label_zh: 原文名, label_en: Native Name}
      - {id: board, label_zh: 所属板块, label_en: Board}
      - {id: derivative_of, label_zh: 标的引用, label_en: Underlying Ref, note: "跨实体引用，指向本所或指数章节的 id"}
      - {id: description, label_zh: 说明, label_en: Description}

  # ── 五｜市场结构与交易机制（本项目重点章节，字段最密）──
  - id: market_structure
    chapter_no: 5
    label_zh: 市场结构与交易机制
    label_en: Market Structure & Trading Mechanism
    kind: object
    fields:
      - id: trading_sessions
        label_zh: 交易时段
        label_en: Trading Sessions
        fields:
          - {id: pre_market, label_zh: 盘前, label_en: Pre-market, volatility: moderate}
          - {id: continuous_am, label_zh: 上午连续竞价, label_en: Morning Continuous, volatility: moderate}
          - {id: lunch_break, label_zh: 午休, label_en: Lunch Break, volatility: moderate}
          - {id: continuous_pm, label_zh: 下午连续竞价, label_en: Afternoon Continuous, volatility: moderate}
          - {id: after_market, label_zh: 盘后, label_en: After-market, volatility: moderate}
          - {id: night_session, label_zh: 夜盘, label_en: Night Session, volatility: moderate}
      - id: holidays_note
        label_zh: 节假日与特殊休市
        label_en: Holidays & Special Closures
        volatility: stable
      - id: opening_mechanism
        label_zh: 开盘机制
        label_en: Opening Mechanism
        volatility: moderate
        en_required: true
        in_matrix: trading_mechanism
      - id: closing_mechanism
        label_zh: 收盘机制
        label_en: Closing Mechanism
        volatility: moderate
        en_required: true
        in_matrix: trading_mechanism
      - id: execution_model
        label_zh: 执行模型
        label_en: Execution Model
        volatility: stable
        en_required: true
        enum_ref: execution_model
        in_matrix: trading_mechanism
        note: >
          市场组织的基本形态——订单驱动 / 报价驱动 / 混合 / 经纪撮合（见 enums.yml
          execution_model 的说明）。`matching_principle` 是订单驱动模型内部的成交优先级
          细化，与本字段是两个层次，不重复。口头竞价 vs 电子撮合的差异写进 `detail`。
          Phase 3（[ADR-043]）20/20 回填完成、覆盖率达 ADR-022 门槛后进 `trading_mechanism`
          组（10 家 order_driven + 10 家 hybrid，无 quote_driven / brokered）。
      - id: matching_principle
        label_zh: 撮合原则
        label_en: Matching Principle
        volatility: stable
        in_matrix: trading_mechanism
        en_required: true
        enum_ref: matching_principle
      - id: order_types
        label_zh: 订单类型
        label_en: Order Types
        volatility: moderate
        en_required: true
        in_matrix: trading_mechanism
      - id: tick_size
        label_zh: 最小报价单位
        label_en: Tick Size
        volatility: moderate
      - id: board_lot_size
        label_zh: 最小交易单位
        label_en: Board Lot Size
        volatility: moderate
      - id: odd_lot_handling
        label_zh: 碎股处理
        label_en: Odd Lot Handling
        volatility: moderate
      - id: price_limits
        label_zh: 涨跌停/价格限制
        label_en: Price Limits
        fields:
          - id: type
            label_zh: 类型
            label_en: Type
            volatility: moderate
            enum_ref: price_limit_type
            in_matrix: trading_mechanism
          - id: main_board
            label_zh: 主板幅度
            label_en: Main Board Band
            volatility: moderate
            in_matrix: trading_mechanism
          - id: other_boards
            label_zh: 其他板块幅度
            label_en: Other Boards' Bands
            volatility: moderate
      - id: circuit_breaker
        label_zh: 熔断机制
        label_en: Circuit Breaker
        volatility: moderate
        en_required: true
        enum_ref: circuit_breaker_type
        in_matrix: trading_mechanism
      - id: volatility_interruption
        label_zh: 波动性中断
        label_en: Volatility Interruption
        volatility: moderate
        en_required: true
        in_matrix: trading_mechanism
      - id: trading_halt_mechanism
        label_zh: 临时停牌与恢复
        label_en: Trading Halt & Resumption
        volatility: moderate
        in_matrix: trading_mechanism
      - id: error_trade_rule
        label_zh: 错误交易处理规则
        label_en: Erroneous Trade / Mistrade Rule
        volatility: moderate
        note: >
          「明显错误」/ 误发注 / clearly-erroneous 成交的事后处置：可否申请作废、复核
          时限、构成明显错误的价格偏离阈值、作废还是调整成交价。日本以「成交不可作废」
          著称，是这个维度差异最大的一端。与 `trading_halt_mechanism`（盘中停牌 / 复牌）
          视角不同，不合并。结构化补充见 `schema/spec.yml`。
      - id: intraday_reversal
        label_zh: 回转交易制度
        label_en: Intraday Reversal (T+N)
        volatility: moderate
        enum_ref: reversal
        in_matrix: trading_mechanism
      - id: short_selling
        label_zh: 做空机制
        label_en: Short Selling
        volatility: moderate
        en_required: true
        enum_ref: short_selling_stance
        in_matrix: trading_mechanism
      - id: block_trade
        label_zh: 大宗交易
        label_en: Block Trade
        volatility: moderate
      - id: order_book_transparency
        label_zh: 订单簿透明度
        label_en: Order Book Transparency
        volatility: moderate
        note: >
          盘前透明度（订单簿对公众公开的程度、是否支持冰山 / 隐藏限价单）+ 盘后成交
          披露与延迟安排。本字段管「本所订单簿内部的（非）展示流动性」；与本所并列的
          独立暗池 / MTF 实体见 `dark_pool`，行情数据的层级 / 收费见第十章
          `market_data_levels` / `data_pricing_model`，三者互相指向、不重复手写。
      - id: dark_pool
        label_zh: 暗池与场外交易
        label_en: Dark Pool / OTC
        volatility: moderate
        note: "仅记与本所并列的独立暗池 / MTF / 场外机制；本所订单簿内部的非展示订单（冰山 / 隐藏限价单）记入 order_book_transparency"
      - id: market_maker_scheme
        label_zh: 做市商制度
        label_en: Market Maker Scheme
        volatility: moderate
        en_required: true
        in_matrix: trading_mechanism
      - id: connect_schemes
        label_zh: 互联互通/跨境安排
        label_en: Connect / Cross-border Schemes
        volatility: moderate
      - id: derivatives
        label_zh: 衍生品市场机制（如适用）
        label_en: Derivatives Market Mechanics (if applicable)
        kind: object
        optional: true
        note: >
          仅当该交易所实体自身运营重要的期货/期权等衍生品业务线时才填（判断标准：第四章「产品体系」
          是否已列出 future/option 类产品）。字段结构复用本章顶层字段集合，表达同一法人实体下现货与
          衍生品两条产品线的不同交易机制——顶层字段继续默认描述现货/主板市场，不因新增本字段而改变
          含义。纯衍生品交易所（如 de-eurex）不用本字段，直接把衍生品机制写在本章顶层字段即可（因为
          它没有现货业务，顶层字段本身就是在描述衍生品）。见 `PROJECT/DECISIONS.md` [ADR-019]。
          `optional: true`：本组字段完全未填时不计入 `chapter_status()` 的完成度分母（见
          `tools/sync.py` `count_chapter_leaves()`）——否则 11/20 家没有衍生品业务的现货交易所，
          哪怕把所有适用字段填满，`market_structure` 章节也会因为这组永远填不了的字段被永久卡在 🟡，
          把"设计上就不适用"误呈现成"没填完"。一旦组内有任意一个字段被填（说明该所确实用到这条
          产品线），则整组正常计入分母，要求填完整。
        fields:
          - id: trading_sessions
            label_zh: 交易时段
            label_en: Trading Sessions
            fields:
              - {id: pre_market, label_zh: 盘前, label_en: Pre-market, volatility: moderate}
              - {id: continuous_am, label_zh: 上午连续竞价, label_en: Morning Continuous, volatility: moderate}
              - {id: lunch_break, label_zh: 午休, label_en: Lunch Break, volatility: moderate}
              - {id: continuous_pm, label_zh: 下午连续竞价, label_en: Afternoon Continuous, volatility: moderate}
              - {id: after_market, label_zh: 盘后, label_en: After-market, volatility: moderate}
              - {id: night_session, label_zh: 夜盘, label_en: Night Session, volatility: moderate}
          - id: holidays_note
            label_zh: 节假日与特殊休市
            label_en: Holidays & Special Closures
            volatility: stable
          - id: opening_mechanism
            label_zh: 开盘机制
            label_en: Opening Mechanism
            volatility: moderate
            en_required: true
          - id: closing_mechanism
            label_zh: 收盘机制
            label_en: Closing Mechanism
            volatility: moderate
            en_required: true
          - id: matching_principle
            label_zh: 撮合原则
            label_en: Matching Principle
            volatility: stable
            en_required: true
            enum_ref: matching_principle
          - id: order_types
            label_zh: 订单类型
            label_en: Order Types
            volatility: moderate
            en_required: true
          - id: tick_size
            label_zh: 最小报价单位
            label_en: Tick Size
            volatility: moderate
          - id: contract_specs_note
            label_zh: 合约规格摘要
            label_en: Contract Specifications
            volatility: moderate
            note: "合约乘数/到期月份序列等——衍生品特有，无现货对应字段，不与 board_lot_size 合并"
          - id: price_limits
            label_zh: 涨跌停/价格限制
            label_en: Price Limits
            fields:
              - {id: type, label_zh: 类型, label_en: Type, volatility: moderate, enum_ref: price_limit_type}
              - {id: main_board, label_zh: 主力合约幅度, label_en: Main Contract Band, volatility: moderate}
              - {id: other_boards, label_zh: 其他合约幅度, label_en: Other Contracts' Bands, volatility: moderate}
          - id: circuit_breaker
            label_zh: 熔断机制
            label_en: Circuit Breaker
            volatility: moderate
            en_required: true
            enum_ref: circuit_breaker_type
          - id: volatility_interruption
            label_zh: 波动性中断
            label_en: Volatility Interruption
            volatility: moderate
            en_required: true
          - id: trading_halt_mechanism
            label_zh: 临时停牌与恢复
            label_en: Trading Halt & Resumption
            volatility: moderate
          - id: block_trade
            label_zh: 大宗交易
            label_en: Block Trade
            volatility: moderate
          - id: market_maker_scheme
            label_zh: 做市商制度
            label_en: Market Maker Scheme
            volatility: moderate
            en_required: true
          - id: margin_practice_note
            label_zh: 保证金制度摘要
            label_en: Margin Practice
            volatility: moderate
            note: "初始/维持保证金计算方法论概要（如 SPAN/Prisma/CORE）——衍生品特有，与 clearing.derivatives.initial_margin_practice 字段呼应但视角不同（本字段是交易端的保证金要求，clearing 那条是清算端 CCP 保证金方法论），不合并，见 PROJECT/DECISIONS.md [ADR-030]"
          - id: connect_schemes
            label_zh: 互联互通/跨境安排
            label_en: Connect / Cross-border Schemes
            volatility: moderate

  # ── 六｜上市、持续监管与退市 ──
  - id: listing
    chapter_no: 6
    label_zh: 上市、持续监管与退市
    label_en: Listing, Continuing Obligations & Delisting
    kind: object
    fields:
