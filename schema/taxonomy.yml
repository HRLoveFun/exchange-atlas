# ══════════════════════════════════════════════════════════════
# 对比矩阵维度组 —— 只定义组的身份、顺序与所属章节
# 组内具体列不在此手写：sync.py 扫描上面所有 in_matrix 字段生成，
# 避免矩阵列表与字段定义两处维护（见 CLAUDE.md 6.1 原则）
#
# 顺序即矩阵视图 tab 顺序，首项是矩阵默认打开的组（见 app.js groups[0]）。
# 按「交易员决策路径」排序，而非机构介绍顺序（见 DECISIONS.md ADR-022）：
# 怎么交易 → 怎么清算交收 → 多少钱 → 谁监管 → 上市退市规则 → 背景资料。
#
# `chapter:` 声明该组唯一对应哪个章节，供 tools/validate.py 校验组内每个字段
# 的 `in_matrix` 取值与字段自身所在章节一致，防止 membership_structure 那类
# 错配（字段定义在第九章却被标进 overview 组）再次静默发生。
#
# 一个字段选入矩阵需同时满足：①覆盖率 ≥16/20 家 ②横向对比才看得出差异的
# 机制性事实，而非背景资料 ③所属章节与目标组匹配。覆盖率低于此线的字段
# （如佣金结构、投资者结构）不是"没选对列"，是数据缺口，见 ADR-022。
# ══════════════════════════════════════════════════════════════
