    zh: "国家证券委员会（SSC，越南语 Ủy ban Chứng khoán Nhà nước / UBCKNN），隶属财政部"
    en: "State Securities Commission (SSC; Ủy ban Chứng khoán Nhà nước / UBCKNN), attached to the Ministry of Finance"
    detail: |
      SSC 依《证券法》第9条对证券与证券市场行使国家管理职能：拟订法规、直接管理与监督
      市场活动、发放与吊销牌照、审批 VNX 与 VSDC 的规则、批准新的交易方式、查处行政违法、
      处理投诉举报。SSC 主任、副主任由财政部管理。
    sources:
      - title: "Law on Securities No. 54/2019/QH14 英译（Art 9：国家证券委员会）"
