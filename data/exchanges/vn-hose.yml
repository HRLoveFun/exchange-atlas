  founded_year:
    zh: "2000（作为「胡志明市证券交易中心」开业，7月28日首场交易）；2007年升格为「胡志明市证券交易所」"
    en: "2000 (opened as the Ho Chi Minh City Securities Trading Center, first trading session 28 July); upgraded to the Ho Chi Minh Stock Exchange in 2007"
    detail: |
      交易中心依总理 127/1998/QĐ-TTg（1998-07-11）设立，2000-07-20 挂牌、2000-07-28
      首场交易。2007 年依总理 599/2007/QĐ-TTg 升格为「胡志明市证券交易所」（Sở Giao dịch
      Chứng khoán Thành phố Hồ Chí Minh），组织形式转为国有一人有限责任公司。2021 年起并入
      越南交易所（VNX）体系，成为其子公司（见 history）。
    sources:
      - title: "Ho Chi Minh Stock Exchange — Overview（Baker McKenzie 跨境上市指南，2026-02-01 更新）"
        url: https://resourcehub.bakermckenzie.com/en/resources/cross-border-listings-guide/asia-pacific/ho-chi-minh-stock-exchange/topics/overview-of-exchange
        accessed: 2026-09-07
      - title: "Ho Chi Minh City Stock Exchange（Wikipedia，沿革交叉印证）"
        url: https://en.wikipedia.org/wiki/Ho_Chi_Minh_City_Stock_Exchange
        accessed: 2026-09-07
    quote: "Originally, the HOSE was officially opened as a securities trading center in 2000 and then upgraded to a stock exchange in 2007."
    verified: 2026-09-07
    confidence: medium

  history:
    zh: "2021年越南「一个集中交易所」改革：依《证券法》54/2019/QH14 与总理 37/2020/QĐ-TTg 设立越南交易所（VNX）作母公司，HOSE 与河内证券交易所（HNX）成为其两家独立法人子公司；VNX 于2021年12月11日正式挂牌"
    en: "The 2021 \"one concentrated stock exchange\" reform: under the Law on Securities No. 54/2019/QH14 and PM Decision No. 37/2020/QD-TTg, the Vietnam Exchange (VNX) was set up as the parent, with HOSE and the Hanoi Stock Exchange (HNX) becoming its two separately-incorporated subsidiaries; VNX was officially launched on 11 December 2021"
    detail: |
      改革前 HOSE（胡志明，主板股票）与 HNX（河内，早期为主板 + 后来的 UPCoM、政府债券、
      衍生品）各自独立。VNX 为国家 100% 持股的一人有限责任公司、注册资本 3 万亿越南盾、
      总部设河内，统一设计与升级两所 IT 系统、颁布上市 / 交易 / 披露 / 会员规则、监督两所。
      两所仍是不同法人（different legal status）、各自运营。VNX 之上是国家证券委员会（SSC）。
    sources:
      - title: "Ho Chi Minh Stock Exchange — Overview（Baker McKenzie 跨境上市指南）"
        url: https://resourcehub.bakermckenzie.com/en/resources/cross-border-listings-guide/asia-pacific/ho-chi-minh-stock-exchange/topics/overview-of-exchange
        accessed: 2026-09-07
      - title: "Law on Securities No. 54/2019/QH14 英译（Art 42–43：交易市场组织、VNX 设立与运行）"
        url: https://www.economica.vn/Content/files/LAW%20%26%20REG/Securities%20Law%202019%20ENG%281%29.pdf
        accessed: 2026-09-07
    quote: "On 11 December 2021, the VNX was officially launched. The VNX and its subsidiaries (the Hanoi Stock Exchange and the Ho Chi Minh Stock Exchange) perform the function of organizing the securities market in Vietnam and operate under the management and supervision of the State Securities Commission (SSC)."
    verified: 2026-09-07
    confidence: medium

  organization_form:
