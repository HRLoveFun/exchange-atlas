risks:
  _meta:
    verified: 2026-08-27
    confidence: medium

  fx_risk_note:
    zh: "印度卢比非完全自由兑换货币，资本项目存在一定管制，实行有管理浮动汇率制度；对境外投资者而言汇率波动构成额外风险层——本次未找到官方原文逐条核实具体管制细则，以上为一般性认知，未采纳为高置信度断言"
    en: "The Indian Rupee is not fully convertible; capital account transactions are subject to certain controls under a managed float regime. FX volatility is an additional risk layer for foreign investors — the above is general market knowledge, not verified against detailed official source text this session, hence not asserted at high confidence"
    confidence: low

  political_risk_note:
    zh: "印度为议会制民主国家、政体总体稳定，对外资持相对开放态度；政治风险主要体现为政策/监管变动（如 2026 年预算上调 STT、2025 年修订退市条例）与偶发地缘政治外溢，而非政权更迭类风险。属定性评估，medium"
    en: "India is a parliamentary democracy with generally stable institutions and a relatively open stance toward foreign capital; political risk mainly manifests as policy/regulatory shifts (e.g. the 2026 Budget raising STT, the 2025 delisting-regulation amendments) and occasional geopolitical spillover, rather than regime-change risk. Qualitative assessment, medium"
    detail: "与 capital_controls / regulatory_change_risk_note 互为呼应：资本项目管制与监管高频修订是印度市场的结构性特征。"
    sources:
      - title: SEBI Turnover Fees, STT and Other levies（NSE 官网，STT 2026 税率）
        url: https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies
        accessed: 2026-08-27
    confidence: medium

  liquidity_risk_note:
    zh: "NSE 旗舰指数与 Nifty 衍生品为全球流动性最高的市场之一，买卖价差极窄、市场冲击成本低；但中小市值股票与 EMERGE（SME）板块、以及部分低成交个股流动性明显较弱，存在价差扩大与冲击成本上升的流动性风险。属定性评估，medium"
    en: "NSE's flagship indices and Nifty derivatives are among the world's most liquid markets with very tight spreads and low impact cost; however, mid/small-cap stocks, the EMERGE (SME) segment and certain low-turnover names are materially less liquid, carrying wider spreads and higher impact-cost liquidity risk. Qualitative assessment, medium"
    detail: "流动性分层是印度市场的结构性特征；隐性成本（implicit_costs_note）亦与此相关。"
    sources:
      - title: NSE Overview（NSE 官网，衍生品成交量领先）
        url: https://www.nseindia.com
        accessed: 2026-08-14
      - title: Real Time Data Subscription（NSE 官网，行情深度）
        url: https://www.nseindia.com/static/market-data/real-time-data-subscription
        accessed: 2026-08-27
    confidence: medium

  regulatory_change_risk_note:
    zh: "SEBI 与财政部持续修订规则，监管变动频率较高是显著特征：退市条例 2021（2025 年修订）、FPI 条例 2019（多次修订）、STT 经《2026 年财政法》上调等均在近期发生。投资者须持续跟踪规则变化，否则可能措手不及。属定性评估，medium"
    en: "SEBI and the Finance Ministry revise rules continuously; a relatively high frequency of regulatory change is a salient feature: the Delisting Regulations 2021 (amended 2025), the FPI Regulations 2019 (amended multiple times), and the STT hike via the Finance Act 2026 all occurred recently. Investors must track rule changes continuously. Qualitative assessment, medium"
    detail: "高频监管修订既保护投资者，也构成合规与策略层面的不确定性风险；与 political_risk_note 互补。"
    sources:
      - title: SEBI Delisting FAQs（SEBI 官网 PDF，反映 2025 修订后规则）
        url: https://www.sebi.gov.in/sebi_data/faqfiles/apr-2025/1745563039986.pdf
        accessed: 2026-08-27
      - title: SEBI Turnover Fees, STT and Other levies（NSE 官网，STT 2026 税率）
        url: https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies
        accessed: 2026-08-27
    confidence: medium

  enforcement_note:
    zh: "设有市场监察（Market Surveillance）、除牌会员名单（Debarred Entities）、对会员的处分行动（Action against Members）等执法建制；具体执法流程与处罚力度本次未逐条核实"
