    contract_specs_note:
      zh: |
        股票/股指衍生品（代表样本 Nifty 50）：期货最长3个月交易周期（近月/次近月/远月同时挂牌），
        到期月最后一个周二为最后交易日；上市首日合约价值不低于1500万卢比；期权为欧式，除4档周度
        合约外另有3个月度、3个季度（3/6/9/12月）及8个半年度（6/12月）合约并存，任意时点保证
        至少5年期权可交易；行权价间距按指数点位分档（如全档位统一50点间距，覆盖35档实值-1档
        平值-35档虚值）。个股期货期权：上市首日合约价值不低于500万卢比，交易周期与到期日规则
        与指数期货相同；个股期权为欧式且官网原文明确"physically settled"（实物交割，即到期以标的
        股票现货交割，而非现金结算）。
        ⚠️ 结算方式说明：本条个股期权"实物交割"表述引自 Individual Securities F&O 页（更新于
        2025-10-28），与印度2018-2019年SEBI个股衍生品逐步实物交割新规方向一致；但官网另有
        Settlement Mechanism 页（更新于2023-01-03，更新时间更早）写"期权行权结算为现金结算"
        且未按标的区分指数/个股，与前者直接冲突——本次判断个股期权实物交割的表述更可信（专门
        针对个股期权、更新更晚），指数期权（Nifty 50）本身官网原文虽也写"physical settled"，
        但与"指数无法实物交割"的常识及金融业界公开资料矛盾，怀疑是网页模板从个股期权段落
        误复制，未采信指数期权"实物交割"这一具体表述，指数期权结算方式本条不做断言，留待
        人工核实，已记入 OPEN-QUESTIONS。
      en: |
        Equity/index derivatives (representative sample: Nifty 50): futures have a maximum 3-month
        trading cycle (near/next/far month simultaneously listed), expiring on the last Tuesday of
        the contract month; minimum contract value of Rs. 15 lakh on first-day listing. Options are
        European-style; besides 4 weekly contracts, 3 monthly, 3 quarterly (Mar/Jun/Sep/Dec) and 8
        semi-annual (Jun/Dec) contracts co-exist, guaranteeing at least 5 years of tradable option
        tenure at any time; strike intervals are tiered by index level (e.g. a flat 50-point interval
        across all levels, covering 35 ITM/1 ATM/35 OTM strikes). Individual-securities futures/options:
        minimum contract value of Rs. 5 lakh on first-day listing, same trading-cycle and expiry rules
        as index futures; stock options are European-style and the official page explicitly states
        "physically settled" (delivery of the underlying shares at expiry, not cash settlement).
        Caveat on settlement style: this "physically settled" claim for individual-securities options
        is sourced from the Individual Securities F&O page (updated 2025-10-28) and is consistent with
        India's 2018-2019 SEBI mandate phasing in physical settlement for stock derivatives; but a
        separate official Settlement Mechanism page (updated 2023-01-03, i.e. earlier) states "exercise
        settlement is cash settled" without distinguishing index vs. individual-securities options,
        directly conflicting with the former. This session judges the individual-securities "physically
        settled" wording as more credible (product-specific, more recently updated); the Nifty 50 page
        itself also literally states index options are "physical settled", which contradicts both common
        practice (an index cannot be physically delivered) and public industry sources — suspected to be
        a copy-paste template error from the stock-options section, so this field does not assert a
        settlement method for index options; left for manual verification, logged to OPEN-QUESTIONS.
      sources:
        - title: NIFTY 50 F&O（官网）
          url: https://www.nseindia.com/static/products-services/equity-derivatives-nifty50
          accessed: 2026-08-18
        - title: Individual Securities F&O（官网）
          url: https://www.nseindia.com/static/products-services/equity-derivatives-individual-securities
          accessed: 2026-08-18
        - title: ⚠️ Equity Derivatives Settlement Mechanism（官网，与上两份来源在个股期权结算方式表述上冲突，见 zh/en 说明）
          url: https://www.nseindia.com/static/products-services/equity-derivatives-settlement-mechanism
          accessed: 2026-08-18
      quote: "Nifty 50 futures contracts have a maximum of 3-month trading cycle - the near month (one), the next month (two) and the far month (three). ／ value of the futures contracts on Nifty 50 may not be less than Rs. 15 lakhs at the time of introduction. ／ Nifty 50 futures contracts expire on the last Tuesday of the expiry month. ／ Nifty 50 index options contracts have 4 weekly expiry contracts, 3 consecutive monthly contracts, additionally 3 quarterly months of the cycle March / June / September / December and 8 following semi-annual months of the cycle June / December would be available, so that at any point in time there would be options contracts with atleast 5 year tenure available. ／ value of the futures contracts on individual securities may not be less than Rs. 5 lakhs at the time of introduction for the first time at any exchange. ／ Options contracts are European style and physically settled and are available on more than 200 securities stipulated by the Securities & Exchange Board of India (SEBI). ／ Exercise settlement is cash settled by debiting/ crediting of the clearing accounts of the relevant Clearing Members with the respective Clearing Bank."
      confidence: medium

