      en: "Time conditions: DAY (valid for the trading day, auto-cancelled if unmatched at close) and IOC (Immediate or Cancel, unmatched portion cancelled immediately); price conditions: Limit Price/Order, Market Price/Order, and Stop Loss (SL) Price/Order (activated once the trigger price is reached, then enters the regular order book as a limit order); at the contract level, Regular lot order, Stop Loss Order, Immediate-or-Cancel, and Spread order are also supported"
