        accessed: 2026-08-27
    quote: "Initial margin requirements are based on 99% value at risk over a one day time horizon. However, in the case of futures contracts (on index or individual securities), where it may not be possible to collect mark to market settlement value, before the commencement of trading on the next day, the initial margin is computed over a two-day time horizon, applying the appropriate statistical formula."
    verified: 2026-08-27
