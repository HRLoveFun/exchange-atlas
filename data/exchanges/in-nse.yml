  delisting_process:
    zh: "退市分两类：自愿退市（反向收购 RBB，发起人以独立评估价/股东批准价收购公众股份）与强制退市（SEBI《退市条例 2021》（2025年修订）下由退市委员会决定，发起人须按独立评估师价收购公众股份）。退市后发起人须继续提供股份过户便利"
    en: "Delisting is of two kinds: voluntary (reverse-book-building, promoters acquire public shares at an independent-valuation / shareholder-approved price) and compulsory (under SEBI's Delisting Regulations 2021, amended 2025, decided by a Delisting Committee, where promoters must acquire public shares at the independent-valuer price). Post-delisting, promoters must continue to provide a share-transfer facility"
    detail: |
      强制退市的"独立评估师定价 + 发起人必须收购"机制是 SEBI Delisting Regulations 2021 的核心；
      2025 年修订版进一步收紧了流程。具体条款以 SEBI 条例原文为准。
    sources:
      - title: SEBI Delisting FAQs（SEBI 官网 PDF）
        url: https://www.sebi.gov.in/sebi_data/faqfiles/apr-2025/1745563039986.pdf
        accessed: 2026-08-27
    quote: "The promoter(s) ... shall acquire the delisted equity shares from the public shareholders by paying them the value determined by the independent valuer, within three months of the date of delisting from the recognised stock exchange, subject to the option of the public shareholders to retain their shares."
    verified: 2026-08-27
    confidence: medium

  delisting_transition_period:
    zh: "强制退市下，发起人须于公司自认可交易所退市之日起 3 个月内，按独立评估师确定的价格向公众股东收购被退市股份（公众股东亦可选择保留股份）；自愿退市走反向收购定价（RBB）流程，从首次公告到完成收购的具体时长未在抓取页中量化"
    en: "Under compulsory delisting, the promoter must acquire the delisted equity shares from public shareholders at the independent-valuer-determined price within three months of the date of delisting from the recognised stock exchange (public shareholders may opt to retain shares); voluntary delisting follows a reverse-book-building (RBB) pricing process whose exact end-to-end duration is not quantified on the pages fetched"
    detail: "3 个月为强制退市下发起人完成公众股份收购的法定窗口；自愿退市的 RBB 流程时长取决于股东批准与市场反馈，本次抓取页未给出明确天数。"
