  maintenance_margin_practice:
    zh: "NSE Clearing 不设独立的'维持保证金率'字段；会员须在交易日持续维持初始保证金（SPAN+敞口）并以逐日盯市（MTM）补足浮动盈亏，实质维持水平即等于初始保证金要求本身（每日重算）"
    en: "NSE Clearing does not define a separate 'maintenance margin rate'; members must continuously maintain the SPAN-based initial margin plus exposure margin and top up variation (mark-to-market) losses daily, so the effective maintenance level equals the (daily-recomputed) initial margin requirement itself"
