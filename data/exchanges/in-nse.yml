  initial_margin_practice:
    zh: "NSE Clearing 对所有清算会员实行 SPAN 基的初始保证金制度：初始保证金要求基于 99% 置信度、单日风险价值（VaR）计算；其中期货合约的初始保证金按两日风险 horizon 计算（现货/期权等为单日）。另叠加敞口保证金（Exposure Margin）等附加边际"
    en: "NSE Clearing applies a SPAN-based initial margin regime to all clearing members: initial margin requirements are based on 99% value-at-risk over a one-day horizon; for futures contracts the initial margin is computed over a two-day horizon (cash/options use one-day). Additional Exposure Margin is also levied"
