  execution_model:
    enum: order_driven
    spec:
      electronic: true
      dealer_intermediated: false
      note: "NEAT / NNF 全电子中央订单簿、价格-时间优先连续撮合；主板股票无场内做市商。衍生品设流动性激励计划（Liquidity Enhancement Scheme），SME 平台（NSE Emerge）另设做市商制度——均为订单驱动之上的补充"
    zh: "订单驱动：NSE 交易系统（NEAT / NNF）为全电子中央订单簿，按价格优先、时间优先连续撮合；主板股票不设场内做市商。衍生品有流动性激励计划、SME 平台另设做市商制度"
    en: "Order-driven: the NSE trading system (NEAT / NNF) is a fully electronic central order book matching continuously on price-then-time priority; main-board equities have no on-exchange market makers. There is a Liquidity Enhancement Scheme for derivatives and a separate market-maker regime for the SME (NSE Emerge) platform"
    detail: "enum 依据 matching_principle（Price-Time priority）与既有 market_maker_scheme detail（LES / SME 做市，非主板股票）综合判定为 order_driven。quote 引自 NSE『Equity Derivatives Trading System』页——该页明确 NSE 交易架构『supports an order driven market』并按价格-时间优先撮合；NEAT / NNF 平台与撮合逻辑现货与 F&O 共用，故现货主板同为订单驱动。整体 confidence: medium（引自 F&O 分段页面，非现货专页）。"
    sources:
      - title: "Equity Derivatives Trading System（NSE 官网，NEAT 撮合架构：order driven + price-time priority）"
        url: https://www.nseindia.com/static/products-services/equity-derivatives-trading-system
        accessed: 2026-08-30
    quote: "The system supports an order driven market and provides complete transparency of trading operations. ... Orders are stored in price-time priority in various books"
    confidence: medium

  matching_principle:
    enum: price_time
    zh: "价格优先、时间优先：订单进入系统后先加时间戳，随即尝试撮合，未成交的按价格-时间优先存入订单簿；最优买单（价高者）与最优卖单（价低者）撮合"
    en: "Price-then-time priority: incoming orders are time-stamped and immediately processed for a match; unmatched orders are stored in price-time priority, and the best buy order (highest price) matches the best sell order (lowest price)"
    detail: "此前留空。本次以 NSE『Equity Derivatives Trading System』页核实——NEAT / NNF 平台现货与 F&O 共用同一撮合逻辑。来源为 F&O 分段页面，confidence: medium。"
    sources:
      - title: "Equity Derivatives Trading System（NSE 官网，Order Matching Rules）"
        url: https://www.nseindia.com/static/products-services/equity-derivatives-trading-system
        accessed: 2026-08-30
    quote: "Orders, as and when they are received, are first time stamped and then immediately processed for potential match. If a match is not found, then the orders are stored in different 'books'. Orders are stored in price-time priority ... Order Matching Rules The best buy order will match with the best sell order. ... the best buy order is the one with highest price and the best sell order is the one with lowest price."
    confidence: medium

  order_types:
    spec:
      market: true
      limit: true
      stop: true
      tif: [day, ioc]
      note: "价格条件：限价单（Limit）、市价单（Market，按录入时可得最优价成交）、止损单（Stop Loss / SL，触及触发价才激活入市）。时间条件：DAY（当日有效）、IOC（即时成交否则撤销）。NSE 另有披露数量单（Disclosed Quantity，仅披露部分数量）——本次未从 NSE 一手页面核实其现货参数，不入 spec（见 order_book_transparency / OPEN-QUESTIONS）"
    zh: "价格条件：限价单（Limit Order）、市价单（Market Order，按录入时可得最优价成交）、止损单（Stop Loss / SL Order，市场价触及或穿越阈值价时才激活）。时间条件：DAY（当日有效）、IOC（即时成交否则撤销，可部分成交、余量即撤）"
    en: "Price conditions: Limit orders, Market orders (filled at the best price obtainable when entered), and Stop Loss (SL) orders (activated only when the market price reaches or crosses a threshold). Time conditions: DAY (valid for the day) and IOC (Immediate-or-Cancel — partial fills allowed, the unmatched portion cancelled immediately)"
    detail: "此前留空。本次以 NSE『Equity Derivatives Trading System』页的 Time / Price Conditions 核实——NEAT / NNF 平台现货共用。NSE 现货另支持披露数量单（Disclosed Quantity），其现货最低披露比例等参数本次未从一手页面核实，记入 OPEN-QUESTIONS。confidence: medium（引自 F&O 分段页面）。"
    sources:
      - title: "Equity Derivatives Trading System（NSE 官网，Time Conditions / Price Conditions）"
        url: https://www.nseindia.com/static/products-services/equity-derivatives-trading-system
        accessed: 2026-08-30
    quote: "Time Conditions DAY - A Day order ... is an order which is valid for the day on which it is entered. ... IOC - An Immediate or Cancel (IOC) order ... Price Conditions Limit Price/Order - An order that allows the price to be specified while entering the order into the system. Market Price/Order - An order to buy or sell securities at the best price obtainable at the time of entering the order. Stop Loss (SL) Price/Order - The one that allows the Trading Member to place an order which gets activated only when the market price of the relevant security reaches or crosses a threshold price."
    confidence: medium

