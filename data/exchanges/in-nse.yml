    opening_mechanism:
      zh: "开盘前集合竞价（Pre-open session）09:00-09:08收集订单，09:08-09:12为订单确认/取消窗口，09:12-09:15为价格发现与向连续交易过渡的窗口；期间会披露指示性均衡价（Indicative equilibrium price）、买卖挂单量及涨跌幅；集合竞价确定的均衡价即为当日开盘价，若未能形成价格则以Normal Market首笔成交价作为开盘价"
      en: "Pre-open session: 09:00-09:08 order collection, 09:08-09:12 order confirmation/cancellation window, 09:12-09:15 price discovery and transition to continuous trading; the indicative equilibrium price, aggregate buy/sell quantity and % change are disseminated during the session; the equilibrium price determined becomes the day's open price, or if no price is discovered, the first trade in the Normal Market becomes the open price"
