    matching_principle:
      enum: price_time
      zh: "期货期权交易系统（Futures and Options Trading System）为全自动屏幕交易系统，订单按价格-时间优先顺序（先比价格，同价比时间）存入订单簿撮合；被动订单（先挂单）与主动订单（后到达并触发成交）区分，成交价格以被动订单价格为准"
      en: "The Futures and Options Trading System is a fully automated screen-based trading system; orders are stored and matched in price-time priority (best price first, then earliest time at that price); orders are classified as passive (resting) or active (newly arrived, triggering a match), and trades are always executed at the passive order's price"
      sources:
        - title: Equity Derivatives Trading System（官网）
          url: https://www.nseindia.com/static/products-services/equity-derivatives-trading-system
          accessed: 2026-08-18
      quote: "The Futures and Options Trading System provides a fully automated trading environment for screen-based, floor-less trading on a nationwide basis and an online monitoring and surveillance mechanism. The system supports an order driven market and provides complete transparency of trading operations. / Orders are stored in price-time priority in various books in the following sequence: Best Price / Within Price, by time priority. / Orders are always matched at the passive order price."
      confidence: high

    order_types:
      zh: "时间条件：DAY（当日有效，收盘未成交自动撤销）、IOC（立即成交剩余部分自动撤销）；价格条件：限价单（Limit）、市价单（Market）、止损单（Stop Loss，触及触发价后转为限价单挂入常规订单簿）；另在具体合约层面支持整手单（Regular lot order）、止损单（Stop Loss Order）、IOC 单与价差单（Spread order）"
      en: "Time conditions: DAY (valid for the trading day, auto-cancelled if unmatched at close) and IOC (Immediate or Cancel, unmatched portion cancelled immediately); price conditions: Limit Price/Order, Market Price/Order, and Stop Loss (SL) Price/Order (activated once the trigger price is reached, then enters the regular order book as a limit order); at the contract level, Regular lot order, Stop Loss Order, Immediate-or-Cancel, and Spread order are also supported"
      sources:
        - title: Equity Derivatives Trading System（官网）
          url: https://www.nseindia.com/static/products-services/equity-derivatives-trading-system
          accessed: 2026-08-18
        - title: NIFTY 50 F&O（官网，Order Type 节）
          url: https://www.nseindia.com/static/products-services/equity-derivatives-nifty50
          accessed: 2026-08-18
      quote: "DAY - A Day order, as the name suggests, is an order which is valid for the day on which it is entered. If the order is not matched during the day, the order gets cancelled automatically at the end of the trading day. / IOC - An Immediate or Cancel (IOC) order allows a Trading Member to buy or sell a security as soon as the order is released into the market, failing which the order will be removed from the market. / Stop Loss (SL) Price/Order - The one that allows the Trading Member to place an order which gets activated only when the market price of the relevant security reaches or crosses a threshold price. ／ Regular lot order ／ Stop Loss Order ／ Immediate or cancel ／ Spread order"
      confidence: high

    tick_size:
      zh: "以Nifty 50指数期权为例，最小报价单位（price step）为0.05卢比；期货的最小变动单位按指数点位分档设定，未见统一单一数值；国债利率期货最小报价单位为0.0025卢比；货币衍生品（INR货币对）最小变动0.25 paise（即0.0025卢比）"
      en: "Example (Nifty 50 index options): price step of Re. 0.05; futures tick sizes are tiered by index level with no single uniform value; government-securities interest rate futures tick size is Rs. 0.0025; currency derivatives (INR pairs) tick size is 0.25 paise (i.e. INR 0.0025)"
      sources:
