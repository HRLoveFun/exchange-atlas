  history:
    zh: |
      1992年注册成立，1993年经SEBI认定为证券交易所，1994年开始运营（先上线批发债券
      市场，随后是现货市场），同年即实现电子/屏幕化交易，是印度首家采用电子交易系统
      的交易所。1996年开始与中央证券存管机构对接实现无纸化（dematerialised）证券结算。
      2000年上线股指期货，2001年上线股指期权；2007-2008年度成为印度首家提供货币期货
      交易的交易所。近年在衍生品合约成交量上按期货业协会（FIA）统计连续多个自然年
      （2019、2022-2024）位列全球第一。集团架构上，NSE 通过全资子公司 NSE IFSC Limited
      在古吉拉特邦GIFT City国际金融服务中心运营独立的国际交易所实体（受IFSCA监管），
      并与新加坡交易所（SGX）合作推出"NSE IFSC-SGX Connect"（2022年启用）。
    en: |
      Incorporated in 1992, recognised as a stock exchange by SEBI in 1993, and commenced
      operations in 1994 (wholesale debt market first, followed by the cash market segment);
      NSE pioneered electronic/screen-based trading in India from the same year. Moved to
      dematerialised securities settlement via depositories from 1996. Launched index futures
      in 2000 and index options in 2001; became the first exchange in India to offer currency
      futures trading in 2007-2008. In recent years NSE has repeatedly ranked as the world's
      largest exchange by derivatives contract volume per Futures Industry Association (FIA)
      statistics (calendar years 2019, 2022-2024). At the group level, NSE operates an
      independent international exchange entity — NSE IFSC Limited, regulated by the IFSCA
      rather than SEBI — at the GIFT City international financial services centre in Gujarat,
      including the "NSE IFSC-SGX Connect" launched in partnership with the Singapore
      Exchange (2022).
    detail: "各里程碑年份来自 History & Milestones 页的年表条目，逐条对应见下方 quote 与 sources。"
    sources:
      - title: History & Milestones（官网）
        url: https://www.nseindia.com/static/national-stock-exchange/history-milestones
        accessed: 2026-08-14
      - title: NSE Group（官网）
        url: https://www.nseindia.com/national-stock-exchange/our-group
        accessed: 2026-08-14
    quote: "Commenced electronic or screen-based trading / Became the first exchange in India to offer trading in Currency Futures / Largest volume of derivatives contracts traded in the world in the calendar year 2024 based on Futures Industry Association statistics / NSE IFSC-SGX Connect Inaugurated by Hon'ble Prime Minister of India Shri Narendra Modi"
    confidence: high

  organization_form:
    zh: ""
    confidence: low
    detail: |
