  regulatory_fees:
    zh: "SEBI 交易征费（SEBI Turnover Fee）：除债务证券外，所有证券的买卖交易按成交价格的 0.0001%（即每 crore 10 卢比）计收；债务证券交易按 0.000025%（每 crore 2.5 卢比）。由交易所代 SEBI 向会员收取、再转嫁客户"
    en: "SEBI Turnover Fee: all sale and purchase transactions in securities other than debt securities are charged at 0.0001% of the price (Rs. 10 per crore); debt securities at 0.000025% (Rs. 2.5 per crore). Collected by the Exchange on behalf of SEBI from members and passed to clients"
    detail: "该征费为监管费（SEBI 依其章程征收），与 STT、印花税并列于 contract note；另含 IPFT（投资者保护教育基金）征费。"
    sources:
      - title: SEBI Turnover Fees, STT and Other levies（NSE 官网）
        url: https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies
        accessed: 2026-08-27
    quote: "All sale and purchase transactions in securities other than debt securities 0.0001 per cent of the price at which the securities are purchased or sold (Rs.10 per crore) / All sale and purchase transactions in debt securities 0.000025 per cent of the price at which the securities are purchased or sold (Rs.2.5 per crore)"
    verified: 2026-08-27
    confidence: high

  stamp_duty:
    zh: "印度自（官网原文 with effect from July 1, 2020）起通过证券交易所交易证券须缴印花税（Stamp Duty），由清算公司（经交易所授权）代征代缴：实物交割的股票转让 0.015%（买方）、非实物交割 0.003%（买方）、股票期货 0.002%（买方）、股票期权 0.003%（买方）。注意印度对证券交易同时征收印花税与证券交易税(STT)，二者为不同税目；其余品种（货币/利率衍生品、公司债、回购、政府证券等）税率见 detail"
    en: "From (per the official text, with effect from July 1, 2020) stamp duty on securities transactions through a stock exchange is levied and collected by Clearing Corporations authorised by the Exchange: delivery-based equity transfer 0.015% (buyer), non-delivery 0.003% (buyer), equity futures 0.002% (buyer), equity options 0.003% (buyer). Note India levies both stamp duty and STT on securities trades — distinct tax heads; rates for other instruments (currency/IR derivatives, corporate bonds, repo, government securities) are in detail"
    detail: "税率与征收机制来自《2019年财政法》对《1899年印度印花税法》的修订；原字段误以为印度对证券交易无印花税，现以官方税率表更正。完整税率：货币/利率衍生品 0.0001%、公司债/证券化债务 0.0001%、回购 0.00001%、政府证券 0%。"
    sources:
      - title: SEBI Turnover Fees, STT and Other levies（NSE 官网，含 Stamp Duty 税率表）
        url: https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies
        accessed: 2026-08-27
      - title: Stamp Duty, Charges & Taxes（NSE 官网）
        url: https://www.nseindia.com/static/invest/first-time-investor-stamp-duty-charges-taxes
        accessed: 2026-08-27
    quote: "The Finance Act, 2019 (No. 7 of 2019) has introduced amendment in The Indian Stamp Act, 1899, with respect to levy and collection of stamp duty for transaction in securities made through stock exchange and accordingly with effect from July 1, 2020, being the notified date, stamp duty is levied and collected by Clearing Corporations authorised by Stock Exchanges. / Transfer of Security other than debenture on delivery basis 0.015% Buyer / Transfer of Security other than debenture on non-delivery basis 0.003% Buyer / Derivatives – Equity Futures 0.002% Buyer / Derivatives – Equity Options 0.003% Buyer"
    verified: 2026-08-27
    confidence: high

  financial_transaction_tax:
    zh: "证券交易税（STT）针对股票类证券交易征收（官网税率表标注 RATES W.E.F. APRIL 1, 2026）：现货股票实物交割的买入与卖出均 0.100%、非实物交割卖出 0.025%；股票期权卖出 0.15%（另行权 0.15%）、股票期货卖出 0.05%。STT 与印花税(stamp_duty)为不同税目"
    en: "Securities Transaction Tax (STT) is levied on equity securities transactions (the official rate table is headed RATES W.E.F. APRIL 1, 2026): delivery-based equity purchase and sale 0.100% each; non-delivery equity sale 0.025%; sale of an option 0.15% (and 0.15% on exercise); sale of a futures contract 0.05%. STT is distinct from stamp duty"
    detail: |
      本次以 NSE 'SEBI Turnover Fees, STT and Other levies' 完整税率表为官方原文，覆盖现货与
      衍生品两类 STT（原字段仅覆盖 F&O）。修订前（截至 2026-03-31）费率为：期权卖出 0.10%、
      期权行权 0.125%、期货卖出 0.02%；现货部分维持 0.100%/0.025% 不变。术语已加入
      schema/glossary.yml，与印花税明确区分。
    sources:
      - title: SEBI Turnover Fees, STT and Other levies（NSE 官网，含完整 STT 税率表）
        url: https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies
        accessed: 2026-08-27
    quote: "RATES W.E.F. APRIL 1, 2026 / Purchase of an equity share in a company or a unit of a business trust, where such contract is settled by the actual delivery or transfer of such share or unit. 0.100 per cent 0.100 per cent Purchaser / 0.025 per cent Seller / Sale of an option in securities 0.15 per cent 0.10 per cent Seller / Sale of an option in securities, where option is exercised 0.15 per cent 0.125 per cent Purchaser / Sale of a futures in securities 0.05 per cent 0.02 per cent Seller"
    verified: 2026-08-27
    confidence: high

  capital_gains_tax:
    zh: "印度资本利得税（非交易所征收，由投资者向所得税部门申报）：自 2024 年 7 月 23 日起，股票等证券投资持有 ≤12 个月为短期（STCG）按 20% 征收；持有 >12 个月为长期（LTCG），对超过 12.5 万卢比免税额以上的部分按 12.5% 征收。税率/免税额的确切数字来自 2024 年预算（Finance Act 2024），本次未能成功抓取所得税部门官网原文逐字核实，故以 medium 标注"
    en: "Indian capital gains tax (not levied by the Exchange, declared by the investor to the Income Tax Department): since 23 July 2024, equity/listed-security gains held ≤12 months are short-term (STCG) taxed at 20%; held >12 months are long-term (LTCG) taxed at 12.5% on the amount exceeding a ₹125,000 exemption. The exact rates/exemption derive from the Finance Act 2024; the Income Tax Department source could not be fetched verbatim this session, hence medium confidence"
    detail: |
