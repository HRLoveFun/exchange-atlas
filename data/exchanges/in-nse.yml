  commission_structure:
    zh: "券商佣金（brokerage）由券商与客户自行约定（可按笔或按成交金额比例），不在交易所统一费率之内；但 SEBI 的'True to Label'规则要求券商向客户收取的交易相关费用（交易所/清算所/监管征费）须与实际向 MII 支付的金额一致、不得加价。故投资者可见的'成本'=券商佣金 + 交易所/清算所/监管各项征费（逐项列示于 contract note）"
    en: "Brokerage is negotiated between the broker and the client (per-trade or ad-valorem) and is outside the Exchange's uniform fee schedule; however SEBI's 'True to Label' rule requires that the trading-related charges a broker recovers from clients (exchange/clearing-corporation/regulatory levies) equal the amount actually paid to the MIIs, with no markup. Thus an investor's visible cost = brokerage + the itemised exchange/clearing/regulatory levies on the contract note"
    detail: |
      'True to Label' 要求源自 NSE 关于交易费用归集的通告；佣金本身市场化、各券商差异大，
      故本字段以 medium 定性，含可逐字引用的 True-to-Label 原文。
    sources:
      - title: Transaction Charges circular FA64232（NSE archives PDF）
        url: https://archives.nseindia.com/content/circulars/FA64232.pdf
        accessed: 2026-08-27
    quote: "the amount recovered from end clients is the same as amount paid by the trading members to the MIIs"
    verified: 2026-08-27
    confidence: medium

  exchange_fees:
