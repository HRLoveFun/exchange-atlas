    en: "Post-listing continuing obligations are governed by SEBI's Listing Obligations and Disclosure Requirements (LODR) Regulations, 2021, covering periodic financial reporting, material-event disclosure, corporate governance (board composition, audit committee, etc.) and compliance tracking; NSE's eligibility page lists 'compliance track record (including LODR, ICDR, PIT, SAST)' as a review factor"
    detail: "持续义务的细则（披露频率、具体治理门槛）由 SEBI 的 LODR 条例规定，交易所层面未见独立的量化清单，本次未逐条核实 LODR 全文。"
