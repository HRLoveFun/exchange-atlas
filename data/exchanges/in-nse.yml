      503，故无法以高置信度逐字引用官方条文；上述税率来自通行监管摘要（Finance Act 2024），
      数字与现行制度一致但属第三方/常识级，未达 high 标准，已转 OPEN-QUESTIONS 待人工核实。
    sources:
