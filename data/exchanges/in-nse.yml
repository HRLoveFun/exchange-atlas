        enum: dynamic_reference
        zh: "衍生品分部无每日固定涨跌停，改以「操作区间」（Operating Range）机制防止错价申报：超出区间的委托单会被交易所判定为「价格冻结」（price freeze）而拒收；区间本身可在盘中动态调整（个股期货按趋势方向每次放宽5%，跨机构协同），借用「动态参考价区间」枚举值仅取其「非固定硬性涨跌停」之近似含义，不代表与港交所式参考价联动机制完全等价"
        en: "The derivatives segment has no fixed daily price limit; instead an \"Operating Range\" mechanism screens out erroneous orders — orders priced beyond the range are rejected by the Exchange as a \"price freeze\". The range itself can be relaxed intraday (for stock futures, by 5% at a time in the direction of the market trend, coordinated across exchanges); the \"dynamic reference price\" enum value is borrowed only for its \"not a fixed hard limit\" sense, and does not imply an HKEX-style moving-reference-price mechanism"
        sources:
          - title: Equity Derivatives Price Bands（官网）
            url: https://www.nseindia.com/static/products-services/equity-derivatives-price-bands
            accessed: 2026-08-18
        quote: "There are no day minimum/maximum price ranges applicable in the derivatives segment. However, in order to prevent erroneous order entry, operating ranges and day minimum/maximum ranges are kept as below: ... In view of this, orders placed at prices which are beyond the operating ranges would reach the Exchange as a price freeze."
        confidence: high
      main_board:
        zh: "指数期货：操作区间为基准价（前一交易日结算价，首日为理论期货价）±10%；个股期货：无固定百分比，动态区间可按市场趋势方向每次放宽5%（与其他交易所协同）；指数期权/个股期权：按各合约delta值逐日计算区间，非固定百分比"
        en: "Index futures: operating range is ±10% of the base price (prior day's settlement price, or theoretical futures price on the first day); stock futures: no fixed percentage — the dynamic band can be relaxed by 5% at a time in the direction of the market trend (coordinated with other exchanges); index/stock options: a contract-specific range computed daily from each contract's delta value, not a fixed percentage"
        sources:
          - title: Equity Derivatives Price Bands（官网）
            url: https://www.nseindia.com/static/products-services/equity-derivatives-price-bands
            accessed: 2026-08-18
          - title: Individual Securities F&O（官网）
            url: https://www.nseindia.com/static/products-services/equity-derivatives-individual-securities
            accessed: 2026-08-18
        quote: "For Index Futures: at 10% of the base price ／ For Index and Stock Options: A contract specific price range based on its delta value is computed and updated on a daily basis. ／ There shall be no fixed price band applicable for stock futures contracts. ... a dynamic price band for a futures contract shall be kept at a certain percentage of the base price as defined by Exchange from time to time. In the event of a market trend in either direction, the dynamic price band shall be relaxed by 5% at a time in the direction of the price movement during the day in co-ordination with the other Exchanges"
