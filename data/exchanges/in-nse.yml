# 印度国家证券交易所 National Stock Exchange of India (NSE)
# 抓取来源见 PROJECT/SOURCES.md `in-nse` 一节；原始页缓存于 .cache/in-nse/
# source_lang: en——NSE 官网没有官方中文版（网站自带12种印度本土语言，唯独没有中文/
# 无官方中文原文可核实），按 ADR-013「无中选英」，英文是溯源锚点，zh 是翻译展示。
# official_languages: [en, hi]——取印度宪法意义上"联盟官方语言"（英语+印地语）这个口径，
# 不是网站界面提供的12种地方语言（那是投资者教育面向大众的可访问性翻译，不代表机构本身
# 的"官方语言"）。这个字段在多官方语言/多地方语言并存的法域怎么定，值得记入
# OPEN-QUESTIONS 供未来样本参照。
# region: apac——印度在全球主要指数/研究机构的地区分类惯例中几乎无例外归入亚太
# （MSCI Asia ex Japan、FTSE Asia Pacific 等），本文件枚举只有四档且已含 mena_africa
# 这种跨大洲合并组，判断没有实质性歧义，未转 OPEN-QUESTIONS。
# group_id: nse-group——NSE 集团下另有 NSE Clearing Limited（原 National Securities
# Clearing Corporation Limited/NSCCL，清算，全资子公司）、NSE Indices Limited（原
# India Index Services & Products/IISL，指数编制）、NSE IFSC Limited（GIFT City 国际
# 金融中心内独立注册的交易所实体，受 IFSCA 而非 SEBI 监管）等。NSE IFSC 是本项目目前
# "同集团下另一独立交易所实体"最贴近的案例，按判断标准标 group_id；listing.boards 不
# 收录 NSE IFSC 自己的规则，只收录 NSE 本身的主板与 SME（Emerge）平台。

id: in-nse
name_zh: 印度国家证券交易所
name_native: {en: "National Stock Exchange of India (NSE)"}
official_languages: [en, hi]
source_lang: en
group_id: nse-group
region: apac
tier: extended

