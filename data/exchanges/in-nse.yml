    circuit_breaker:
      enum: index_level
      zh: "衍生品分部本身未见独立熔断机制；与现货市场共用同一套全市场指数熔断（10%/15%/20%三级，以Nifty 50或BSE Sensex先触发者为准），触发后同时暂停「所有股票现货及股票衍生品市场」（coordinated trading halt in all equity and equity derivative markets nationwide）"
      en: "No independent circuit breaker specific to the derivatives segment was found; it shares the same market-wide index-based circuit breaker as the cash market (three tiers at 10%/15%/20%, triggered by whichever of the Nifty 50 or BSE Sensex breaches first), which upon triggering halts \"all equity and equity derivative markets nationwide\" simultaneously"
      detail: "与顶层 market_structure.circuit_breaker 字段引用同一机制、同一来源，此处从「衍生品视角」重复确认其覆盖范围包含衍生品市场，避免读者误以为衍生品分部只受现货熔断的间接影响。"
      sources:
        - title: Equity Market Circuit Breakers（官网）
          url: https://www.nseindia.com/products-services/equity-market-circuit-breakers
          accessed: 2026-08-18
      quote: "The index-based market-wide circuit breaker system applies at 3 stages of the index movement, either way viz. at 10%, 15% and 20%. These circuit breakers when triggered bring about a coordinated trading halt in all equity and equity derivative markets nationwide. The market-wide circuit breakers are triggered by movement of either the BSE Sensex or the Nifty 50, whichever is breached earlier."
