      flagship: "yes"
      description: |
        NSE集团旗舰指数，50只蓝筹股，覆盖约66%的NSE自由流通调整市值。由NSE Indices
        Limited（原India Index Services & Products/IISL，NSE Strategic Investment
        Corporation旗下子公司）编制管理——鉴于该公司是NSE集团内部子公司（NSE对其的
        持股方向是"NSE→子公司"而非反向），归为 compiler: self 而非 other，这与
        us-nyse.yml 里"NYSE Composite由母公司ICE旗下ICE Data Indices编制"（持股方向
        相反，归为other）是刻意的区分对照，供未来样本参照。1996年4月开始交易；2009年
        6月26日起改用自由流通调整市值加权法（此前为全市值加权）。具体基日/基点数值
        本次未在方法论文档中找到 Nifty 50 本身专属的明确表述（文档对其余多数子指数
        逐一标注了基日/基点，唯独旗舰指数 Nifty 50 本身的这段落未见），故 base_date/
        base_point 两个字段留空未填，不采纳"约定俗成"的印象数值。

