    en: "NSE charges transaction charges on both sides: Cash Market Rs. 2.97 per lakh of traded value per side; Equity Futures Rs. 1.73 per lakh per side; Equity Options Rs. 35.03 per lakh of premium value per side; Currency Futures Rs. 0.35 per lakh per side; Currency and Interest Rate Options Rs. 31.10 per lakh of premium value per side; see detail for effective dates and later revisions"
    detail: |
      2024 版官方通告含完整分产品费率（另含 Currency Futures Rs. 0.35、Currency/IR Options
      Rs. 31.10 每边每十万卢比）。2026 年 3 月修订后的按 crore 费率（约 Cash ₹306.99 /
      股票期货 ₹182.99 / 股票期权 ₹3,552 每 crore）来自第三方镜像，未在本次抓取到的 NSE 官方
      通告中逐字确认，故不纳入高置信度原文。
    sources:
      - title: Transaction Charges circular FA64232（NSE archives PDF）
        url: https://archives.nseindia.com/content/circulars/FA64232.pdf
        accessed: 2026-08-27
    quote: "Cash Market: Rs. 2.97 each side per lakh of traded value / Equity Futures: Rs. 1.73 each side per lakh of traded value / Equity Options: Rs. 35.03 each side per lakh of premium value / Currency Futures: Rs. 0.35 each side per lakh of traded value / Currency Options and Interest Rate Options: Rs. 31.10 each side per lakh of premium value"
    verified: 2026-08-27
    confidence: high

  clearing_fees:
    zh: "NSE Clearing 作为中央对手方，对清算会员按业务线计收清算费（clearing fees），并入整体交易成本、由券商向客户逐笔转嫁；该清算费的具体逐产品费率表本次未在抓取页中核实，故仅作定性说明"
    en: "As the central counterparty, NSE Clearing levies per-segment clearing fees on clearing members, which flow into the overall transaction cost and are passed through to clients by brokers; the exact per-product clearing-fee schedule was not verified on the pages fetched, so this is a qualitative note"
    detail: "清算费与上文交易所交易费、监管费并行，均列示于 contract note；具体数字以 NSE Clearing 的 tariff 为准，本次未抓取该 tariff 原文。"
    sources:
      - title: Clearing & Settlement（官网）
        url: https://www.nseindia.com/nsccl-nse-clearing/clearing-settlement
