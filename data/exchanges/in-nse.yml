    quote: "The promoter(s) ... shall acquire the delisted equity shares from the public shareholders by paying them the value determined by the independent valuer, within three months of the date of delisting from the recognised stock exchange, subject to the option of the public shareholders to retain their shares."
    verified: 2026-08-27
    confidence: medium

  post_delisting_venue:
    zh: "一旦公司从 NSE 退市，其证券将不再于该交易所交易；退市后无法在场内重新买卖，只能转为场外（OTC）或私下协商转让，由公司继续提供股份过户便利"
    en: "Once a company is delisted from NSE, its securities would no longer be traded at that stock exchange; post-delisting they cannot be traded on-exchange and can only be transferred OTC / by private arrangement, with the company continuing to provide a share-transfer facility"
    detail: "退市后股份虽不再上市交易，但公司仍须维持过户便利，公众股东可据此向发起人主张收购或转让。"
