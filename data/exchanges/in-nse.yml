  dividend_withholding_tax:
    zh: "印度自 2020 年起废除股息发放税（DDT，由公司向政府缴纳），改为股东收到股息时在自身所得中计税；公司向居民股东支付股息时按《所得税法》第 194 条预扣税（TDS）10%（特定情形下可更高）。股息预扣细则的官方原文本次未能抓取核实，以 medium 标注"
    en: "Since 2020 India abolished the Dividend Distribution Tax (DDT, paid by the company) and instead taxes dividends in the hands of the recipient; companies deduct TDS at 10% under section 194 of the Income Tax Act when paying dividends to resident shareholders (higher in certain cases). The exact withholding provisions could not be fetched verbatim this session, hence medium confidence"
    detail: "与 capital_gains_tax 同理，所得税部门官网抓取被拒（403），具体 TDS 条款未在本次抓取页中逐字确认；上述为通行制度描述，转 OPEN-QUESTIONS 待核实。"
