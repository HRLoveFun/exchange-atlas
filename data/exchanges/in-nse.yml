    zh: "1992（具体月日官网未标注）注册成立；1993年4月经SEBI认定为证券交易所；1994年开始运营"
    en: "Incorporated in 1992 (exact day not stated on the official page); recognised as a stock exchange by SEBI in April 1993; commenced operations in 1994"
    detail: |
      History & Milestones 页正文只写"incorporated in 1992"，未标具体月日——本节
      SOURCES.md 草稿此前曾记"1992年11月27日"，本轮核实后确认该具体日期没有原文支持，
