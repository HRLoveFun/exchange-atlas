  implicit_costs_note:
    zh: "除显性的交易所/清算/监管税费外，交易成本还含隐性成本：买卖价差（bid-ask spread）与市场冲击成本（impact cost），在流动性较差的 SME（EMERGE）/ 低成交个股上尤为显著。NSE 旗舰指数与 Nifty 衍生品为全球最高流动性之一，价差极窄；交易所逐笔（tick-by-tick）全订单簿行情（见 market_data_levels）有助于做市与套利者压缩价差。隐性成本不属交易所费率，而是由市场深度决定"
    en: "Beyond explicit exchange/clearing/regulatory levies, trading bears implicit costs: bid-ask spread and market-impact (impact) cost, most pronounced in less-liquid SME (EMERGE) / low-turnover names. NSE's flagship indices and Nifty derivatives are among the world's most liquid, with very tight spreads; exchange-provided tick-by-tick full-order-book data (see market_data_levels) helps market-makers/arbitrageurs compress spreads. Implicit cost is determined by market depth, not by Exchange fee schedules"
    detail: "NSE 作为全球衍生品成交量领先交易所，旗舰产品流动性充裕、隐性成本低；隐性成本差异主要体现在中小市值标的。本条为定性说明（无单一官方'隐性成本'费率），以 medium 标注。"
    sources:
      - title: Real Time Data Subscription（NSE 官网，行情深度）
        url: https://www.nseindia.com/static/market-data/real-time-data-subscription
        accessed: 2026-08-27
      - title: NSE Overview（NSE 官网，衍生品成交量领先）
        url: https://www.nseindia.com
        accessed: 2026-08-14
    confidence: medium

