  circuit_breaker:
    enum: index_level
    spec:
      type: index_level
      reference:
        - {index: "Nifty 50", exchange: self}
        - {index: "BSE Sensex", exchange: "bse"}
      levels:
        - {threshold_pct: 10}
        - {threshold_pct: 15}
        - {threshold_pct: 20}
      note: "跨交易所联动：Nifty 50（NSE 自身）或 BSE Sensex 先触发者为准（[ADR-036] #6 / OPEN-QUESTIONS #19）。各档停牌时长与恢复方式见 detail（逐时段不同，10%/15% 停牌 + 15 分钟集合竞价恢复、20% 当日休市），未逐字入 spec，Phase 1b 补 halt_minutes"
    zh: "全市场指数熔断（index-based market-wide circuit breaker），三级阈值10%/15%/20%，以印度国家证券交易所Nifty 50或竞争对手孟买证券交易所（BSE）Sensex两个指数中先触发者为准"
    en: "Index-based market-wide circuit breaker, three-tier thresholds at 10%/15%/20%, triggered by whichever of the Nifty 50 (NSE) or the BSE Sensex breaches first"
    detail: |
      2001年7月2日起实施（依SEBI Circular No. SMDRPD/Policy/Cir-37/2001），2013年经
      SEBI Circular no. CIR/MRD/DP/25/2013部分修订。触发后市场以开盘集合竞价方式恢复：
      10%——1:00pm前触发暂停45分钟+15分钟集合竞价恢复；1:00-2:30pm触发暂停15分钟+15分钟
      集合竞价；2:30pm后触发不暂停。15%——1:00pm前触发暂停1小时45分钟+15分钟集合竞价；
      1:00-2:00pm触发暂停45分钟+15分钟集合竞价；2:00pm后触发当日不再开市。20%——任意
      时段触发均直接休市至当日结束。**跨交易所协同熔断**（联动竞争对手BSE的指数）是本
      项目目前样本中的第一例，与其余交易所"熔断只看自己市场指数"的设计不同，值得记入
      OPEN-QUESTIONS。
      Nifty 50 收盘价（2026-08-13）24,395.85，官网据此换算的次日（2026-08-14）三档
      绝对点位分别为±2,439.60/±3,659.35/±4,879.15——这是逐日滚动计算值，非固定阈值，
      未作为长期数据填入其他字段。
    sources:
      - title: Equity Market Circuit Breakers（官网）
        url: https://www.nseindia.com/products-services/equity-market-circuit-breakers
        accessed: 2026-08-14
    quote: "The index-based market-wide circuit breaker system applies at 3 stages of the index movement, either way viz. at 10%, 15% and 20%. These circuit breakers when triggered bring about a coordinated trading halt in all equity and equity derivative markets nationwide. The market-wide circuit breakers are triggered by movement of either the BSE Sensex or the Nifty 50, whichever is breached earlier."
    confidence: high

