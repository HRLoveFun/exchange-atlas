    en: "NSE may impose a trading suspension or resume trading for companies failing continuing listing obligations (e.g. LODR compliance-track issues, late filings/financials); the exact technical suspension/resumption criteria and process were not verified line-by-line, but the Exchange holds suspension powers over non-compliant issuers"
