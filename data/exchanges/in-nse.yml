# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-14
    confidence: medium

  regulator:
    zh: "印度证券交易委员会 (SEBI)"
    en: "Securities and Exchange Board of India (SEBI)"
    detail: "SEBI 于1988年以非法定机构形式设立，1992年经《SEBI法》授权成为法定监管机构。"
    sources:
      - title: About SEBI（sebi.gov.in 官网）
        url: https://www.sebi.gov.in/about-sebi.html
        accessed: 2026-08-14
    quote: "The Securities and Exchange Board of India was established as a statutory body in the year 1992 and the provisions of the Securities and Exchange Board of India Act, 1992 (15 of 1992) came into force on January 30, 1992."
    confidence: high

  self_regulatory_org:
    zh: "未见独立于SEBI/交易所之外的第三方自律组织；一线监管职能由NSE自身'Regulation'条线（含会员合规、市场监察、信息披露监督等）承担"
    en: "No separate third-party SRO distinct from SEBI/the Exchange identified; front-line regulatory functions are carried out within NSE's own Regulation division (member compliance, market surveillance, disclosure oversight)"
    detail: |
      证据来自官网导航结构本身（"Regulation"大类下设 Exchange/Market Rules & Regulations/
      Market Surveillance/Exchange Disclosures，以及 Member/Member Compliance/Action
      against Members 等子项），而非一段专门介绍自律监管体制的说明文字，故 confidence
      定 medium 而非 high。与美股 NYSE Regulation + FINRA 的"交易所自身+委托第三方"
      组合、港交所"交易所自身兼一线监管"、上交所"交易所+中国证券业协会"均不完全相同，
      是这方面又一个真实样本。
    sources:
      - title: History & Milestones（官网，站内导航含 Regulation 大类）
        url: https://www.nseindia.com/static/national-stock-exchange/history-milestones
        accessed: 2026-08-14
    quote: "Market Rules & Regulations / Market Surveillance / Exchange Disclosures / Defaulting Clients"
    confidence: medium

  clearing_regulator:
    zh: "印度证券交易委员会 (SEBI)"
    en: "SEBI"
    detail: "与市场监管为同一机构；NSE Clearing Limited 作为清算机构本身是否受专门条例（如独立的《Clearing Corporation Regulations》）规管，本次未逐条核实。"
    confidence: medium

  core_laws:
    zh: "《1956年证券合同（监管）法》(SCRA) 与《1992年印度证券交易委员会法》(SEBI Act)"
    en: "Securities Contracts (Regulation) Act, 1956 (SCRA); Securities and Exchange Board of India Act, 1992 (SEBI Act)"
    detail: |
      SCRA 1956 是印度证券合同与交易所监管的基础法律，SEBI Act 1992 则确立 SEBI 作为
      法定监管机构的地位与权力。两部法律均在 sebi.gov.in 官网确认了法律名称与年份，
      具体条款细则本次未逐条核实。
    sources:
      - title: Securities Contracts (Regulation) Act, 1956（sebi.gov.in 法律条目页，仅用于确认法律名称与年份，未读取全文条款）
        url: https://www.sebi.gov.in/legal/acts/feb-1957/securities-contracts-regulation-act-1956-as-amended-by-the-international-financial-services-centres-authority-act-2019-w-e-f-october-01-2020-_4.html
        accessed: 2026-08-14
      - title: About SEBI（sebi.gov.in 官网）
        url: https://www.sebi.gov.in/about-sebi.html
        accessed: 2026-08-14
    quote: "Securities Contracts (Regulation) Act, 1956 (As amended by the International Financial Services Centres Authority Act, 2019 w.e.f. October 01, 2020) / The Securities and Exchange Board of India Act, 1992 (15 of 1992) came into force on January 30, 1992."
    confidence: high

  foreign_ownership_limit:
    zh: "外资通过 FPI（外国证券投资者，原 FII）渠道投资印度上市公司股票，受 RBI/SEBI 双重监管：单一 FPI（含其投资群体 investor group）对单一公司的持股不得超过该公司完全稀释后实收股本的 10%；全体 FPI 合计持股的法定上限为该公司实收股本的 24%，可经董事会与股东大会特别决议批准上调至该行业的 FDI 行业上限（sectoral cap），公营银行（含 SBI）上限为 20%"
    en: "Foreign investment in Indian listed equities is channelled through the FPI (Foreign Portfolio Investor, formerly FII) regime, regulated jointly by the RBI and SEBI: a single FPI (including its investor group) may hold below 10% of a company's total paid-up equity capital on a fully diluted basis; the aggregate FPI ceiling is 24% of paid-up capital, which can be raised up to the sectoral FDI cap by board and special-resolution shareholder approval, while public-sector banks (incl. SBI) are capped at 20%"
    detail: |
      外资持股上限是印度资本项目管制的核心工具之一（与 RBI 逐日监控机制配套）。NSE 自身
      不设定该上限，而是由 RBI 依《外汇管理法》(FEMA) 与 SEBI《FPI 条例 2019》设定并执行。
      24% 为默认聚合上限，行业上限（如保险 74%、银行业 74% 等）可经公司特别决议突破。
    sources:
      - title: Investment in Indian Companies by FIIs/NRIs（RBI 官网）
        url: https://rbi.org.in/Scripts/BS_FiiUSer.aspx
        accessed: 2026-08-27
      - title: SEBI (Foreign Portfolio Investors) Regulations, 2019（NSDL FPI 门户归档 PDF）
        url: https://www.fpi.nsdl.co.in/web/HomePage/files/Documents/SEBI%20FPI%20Regulations,%202019%20-%20updated%20December%2019,%202019.pdf
        accessed: 2026-08-27
    quote: "The ceiling for overall investment for FIIs is 24 per cent of the paid up capital of the Indian company and 10 per centfor NRIs/PIOs. The limit is 20 per cent of the paid up capital in the case of public sector banks, including the State Bank of India. / The ceiling of 24 per cent for FII investment can be raised up to sectoral cap/statutory ceiling, subject to the approval of the board and the general body of the company passing a special resolution to that effect. / The purchase of equity shares of each company by a single foreign portfolio investor including its investor group shall be below ten per cent of the total paid-up equity capital on a fully diluted basis of the company:"
    confidence: high

  capital_controls:
    zh: "印度对跨境证券投资实施资本项目管理：RBI 通过投资组合投资计划（PIS）设定并逐日监控外资持股上限——外资对单一公司持股触达上限前 2 个百分点即触发'警示'(caution)与'停止买入'(stop purchase)机制；且印度卢比在资本项目下未完全可兑换。上述外资持股上限是这一管制框架的具体体现"
    en: "India operates capital-account management on cross-border portfolio investment: the RBI sets and monitors foreign shareholding ceilings daily — triggering 'caution' and 'stop-purchase' mechanisms two percentage points below the cap — and the Indian Rupee is not fully convertible on the capital account. The FPI/FII shareholding ceilings above are a concrete expression of this control framework"
    detail: |
      除持股上限外，外资还需通过 RBI 授权的指定银行分支（Designated Bank Branches）经 PIS 通道
      交易，且 FPI 须通过指定存管参与者（DDP）托管。该管制属国家层面（RBI/SEBI），非 NSE 自建。
    sources:
      - title: Investment in Indian Companies by FIIs/NRIs（RBI 官网）
        url: https://rbi.org.in/Scripts/BS_FiiUSer.aspx
        accessed: 2026-08-27
    quote: "The Reserve Bank of India monitors the ceilings on FII/NRI/PIO investments in Indian companies on a daily basis. / The ceiling for overall investment for FIIs is 24 per cent of the paid up capital of the Indian company and 10 per centfor NRIs/PIOs."
    confidence: high

  disclosure_requirements:
    zh: "上市公司持续披露义务受SEBI《上市义务与披露要求条例》(LODR) 等一组条例规管（另有ICDR/PIT/SAST等）；具体披露频率与渠道细则本次未逐条核实"
    en: "Continuing disclosure obligations for listed companies are governed by SEBI's Listing Obligations and Disclosure Requirements (LODR) Regulations, among others (ICDR/PIT/SAST); specific frequency/channel requirements not verified in detail this session"
    detail: "证据来自主板上市资格页面导航与正文里提到的合规检查条目，非专门的披露制度说明文字。"
    sources:
      - title: Eligibility Criteria - Public Issues Main Board（官网）
        url: https://www.nseindia.com/static/companies-listing/raising-capital-public-issues-eligibility-equity-debt
        accessed: 2026-08-14
    quote: "Compliance track record (including LODR , ICDR, PIT, SAST)"
    verified: 2026-08-27
    confidence: medium

  investor_protection:
    zh: "设有投资者保护基金（Investor Protection Trust Fund / IPFT）与在线争议解决机制（SMARTODR）等投资者保护安排；具体赔付规则与额度本次未逐条核实"
    en: "An Investor Protection Trust Fund (IPFT) and an Online Dispute Resolution mechanism (SMARTODR) exist among investor protection arrangements; specific compensation rules and caps not verified in detail this session"
    detail: "证据来自站内导航条目（Investor Protection Trust Fund、LOGIN TO SMARTODR 等）；IPFT 作为一项由交易所代收的投资者保护教育基金征费也在 'SEBI Turnover Fees, STT and Other levies' 页面被提及。"
    sources:
      - title: History & Milestones（官网，站内导航含投资者保护相关条目）
        url: https://www.nseindia.com/static/national-stock-exchange/history-milestones
        accessed: 2026-08-14
      - title: SEBI Turnover Fees, STT and Other levies（NSE 官网）
        url: https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies
        accessed: 2026-08-27
    quote: "Investor Protection Trust Fund"
    verified: 2026-08-27
    confidence: medium

