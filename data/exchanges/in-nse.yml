      resolution: cancel
      note: "『Trade Annulment』政策（依 SEBI CIR/MRD/DP/15/2015）：仅执行该成交的交易会员（买 / 卖方）可通过交易系统电子申请，须在成交后 30 分钟内提交。须同时满足：单笔订单最低价值 Rs 10 Crores（1 亿卢比）、单笔订单产生的成交最低价值 Rs 10 lakhs；成交须不在当时适用的价格带 / operating range / trade execution range 内；须为连续时段（Normal market）成交；买卖两侧 PAN 不同。对手方交易会员须在收市后 30 分钟内（或申请后 30 分钟内、以较晚者为准）电子表示接受。无固定价格偏离百分比门槛——以『在价格带外』+ 卢比金额门槛替代"
    zh: "『交易作废（Trade Annulment）』政策（依 SEBI 2015 年通函）：只有执行该成交的交易会员（买方或卖方）可申请，须通过交易所交易系统在成交后 30 分钟内电子提交。须同时满足：产生该成交的单笔订单价值不低于 Rs 10 Crores（1 亿卢比）、单笔订单产生的成交价值不低于 Rs 10 lakhs；该成交在成交时不在适用的价格带 / 操作区间 / 成交执行区间之内；须为连续时段（Normal market）成交；买卖两侧非同一 PAN。对手方交易会员须电子表示同意作废（在收市后 30 分钟内、或申请后 30 分钟内，以较晚者为准）"
    en: "Trade Annulment policy (under SEBI circular of 2015): only the executing trading member (buyer or seller) may apply, electronically through the exchange trading system, within 30 minutes of execution. The trade must meet all of: a minimum order value of Rs 10 Crores and a minimum trade value from a single order of Rs 10 lakhs; the trade must have been outside the applicable price bands / operating range / trade execution range at the time; it must have been executed in the continuous (Normal market) session; and the two sides must not share the same PAN. The counterparty trading member must electronically consent to the annulment (within 30 minutes after market close, or within 30 minutes of the request, whichever is later)"
    detail: "NSEIL Consolidated Circular ITEM 3.1（Trade Annulment Request）+ SEBI CIR/MRD/DP/15/2015。来源为第三方转载件（ricago.com），confidence: medium。与 trading_halt_mechanism 视角不同。印度属『阈值 + 时限复核制』，门槛以卢比金额 + 是否在价格带外计，非 % 偏离——故 spec.deviation_threshold_pct 留 null。"
    sources:
      - title: "NSEIL Consolidated Circular（ITEM 3.1 Trade Annulment Request，经 ricago.com 逐字转载）PDF"
        url: https://www.ricago.com/assets/front/base/file/file_management/441.pdf
        accessed: 2026-08-30
      - title: "NSE Circular CMTR54851（确认 Trade Annulment 依 SEBI CIR/MRD/DP/15/2015 处理）PDF"
        url: https://archives.nseindia.com/content/circulars/CMTR54851.pdf
        accessed: 2026-08-30
    quote: "Trade annulment requests should be submitted to the Exchange within 30 minutes of the execution of trade. A trade annulment request can only be made for an order of a minimum value of Rs 10 Crores ... Minimum trade value of trade(s) originating from a single order for which annulment request is made should be Rs. 10 lakhs or above ... The trade(s) in question are not within the price bands / operating range / trade execution range applicable at the time of trade. ... Counterparty trading member should have provided acceptance to trade annulment in electronic form within 30 minutes after the market closure or within 30 minutes from time of trade annulment requests whichever is later."
    confidence: medium

