      quote: "The Futures and Options Trading System provides a fully automated trading environment for screen-based, floor-less trading on a nationwide basis and an online monitoring and surveillance mechanism. The system supports an order driven market and provides complete transparency of trading operations. / Orders are stored in price-time priority in various books in the following sequence: Best Price / Within Price, by time priority. / Orders are always matched at the passive order price."
      confidence: high

