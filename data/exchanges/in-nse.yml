      en: "NSE runs a Liquidity Enhancement Scheme (LES) offering tiered order/trade/open-interest incentives to Designated Market Makers, who must disclose their market-maker status to clients to avoid conflicts of interest. The products confirmed as currently covered by LES on the fetched page are concentrated in the Commodity Derivatives segment (Silver 30Kg Options, Electricity Futures, Dated Brent Crude Oil Futures); this session could not confirm whether the Equity Derivatives segment currently has an active LES product (the page also showed a \"no market makers this month\" notice, which may reflect a temporary status for the month fetched rather than a permanent absence of LES for this product line)"
      sources:
