      quote: "No market makers for this month / Commodity in which LES is available - Silver (30Kgs) Options on Goods (Launched on 27th November 2023) , Electricity Futures Contract (Launched on 14th July 2025) and Dated Brent Crude Oil (Platts) Futures Contract (Launched on 17th June 2026). / Framework for Conflict of Interest - In order to avoid any conflict of interest that may arise between Member(s) (who is acting as designated Market Maker) and their clients, Market Maker is requested to apprise about its appointment as a Designated Market Maker to its clients by any means of communication such as display on their website, email, letters etc."
      confidence: medium

    margin_practice_note:
      zh: "NSE Clearing（NSCCL）对期货期权持仓采用 SPAN®（Standard Portfolio Analysis of Risk，经芝加哥商业交易所CME授权使用的组合保证金算法）逐日在线计收初始保证金：以16档标准风险情景（价格扫描区间×波动率扫描区间的组合）逐一计算组合在「盯市观察期」内的最大潜在亏损，取16档中最大者作为「扫描风险费用」（Scanning Risk Charge），另加跨月价差费用（Calendar Spread Charge）构成SPAN保证金总额；初始保证金以99%单日风险价值（VaR）为基准，期货合约（因次日开盘前可能来不及完成盯市结算）改按两日风险价值计算；此外对深度虚值空头期权等特殊持仓叠加「极端亏损保证金」（Extreme Loss Margin，指数期权虚值超10%为3%、剩余期限超9个月为5%，个股期权虚值超30%为5.25%）作为SPAN保证金之外的第二层缓冲"
      en: "NSE Clearing (NSCCL) collects initial margin online, daily, for futures & options positions using SPAN® (Standard Portfolio Analysis of Risk, a portfolio-margining algorithm used under license from the Chicago Mercantile Exchange): 16 standard risk scenarios (combinations of price-scan range × volatility-scan range) are each used to estimate the portfolio's worst one-day loss, and the largest of the 16 becomes the \"Scanning Risk Charge\"; a Calendar Spread Charge for inter-month risk is added on top to form the total SPAN margin. Initial margin is based on 99% one-day Value-at-Risk (VaR), except futures contracts (where same-day mark-to-market settlement may not complete before next-day trading starts) use a two-day VaR horizon instead. A second layer, the Extreme Loss Margin, is additionally levied on positions such as deep out-of-the-money short options (3% for index options OTM by more than 10%, 5% for index options with residual maturity over 9 months, 5.25% for single-stock options OTM by more than 30%)"
      sources:
        - title: Equity Derivatives Margins（官网）
          url: https://www.nseindia.com/static/products-services/equity-derivatives-margins
          accessed: 2026-08-18
        - title: NSCCL SPAN（官网）
          url: https://www.nseindia.com/products-services/equity-derivatives-nse-clearing-span
          accessed: 2026-08-18
      quote: "NSE Clearing uses the SPAN® (Standard Portfolio Analysis of Risk) system for the purpose of margining, which is a portfolio based system. / Initial margin requirements are based on 99% value at risk over a one day time horizon. However, in the case of futures contracts (on index or individual securities), where it may not be possible to collect mark to market settlement value, before the commencement of trading on the next day, the initial margin is computed over a two-day time horizon / SPAN constructs scenarios of probable changes in underlying prices and volatilities in order to identify the largest loss a portfolio might suffer from one day to the next. It then sets the margin requirement at a level sufficient to cover this one-day loss. / In case of short index options contracts that are deep out of the money (i.e., strikes out of the money by more than 10% from the previous day closing underlying price), the applicable Extreme Loss Margin is 3%. In case of short index option contracts with residual maturity of more than 9 months, the applicable Extreme Loss Margin is 5%. In case of short single stock options contracts that are deep out of the money (i.e., strikes out of the money by more than 30% from the previous day closing underlying price), the applicable Extreme Loss Margin is 5.25%."
      confidence: high

    connect_schemes:
      zh: "NSE IFSC-SGX Connect 严格来说是本节讨论的「NSE 挂牌衍生品业务」与「NSE IFSC 子公司」两个不同法人载体之间的迁移/联通安排——Nifty系列衍生品此前在SGX交易，2022年起通过GIFT City的NSE IFSC实体联通，国际投资者经SGX会员即可交易挂钩Nifty的产品；与顶层字段引用同一事实，此处仅从「这具体是哪条产品线」的角度补充说明是股指衍生品（而非现货）业务"
      en: "Strictly speaking, NSE IFSC-SGX Connect is a migration/linkage arrangement between the NSE-listed derivatives business discussed in this section and the separate NSE IFSC subsidiary entity — Nifty-linked derivatives previously traded on SGX have, since 2022, been linked via the NSE IFSC entity at GIFT City, letting international investors access Nifty-linked products through SGX membership; this references the same fact as the top-level field, adding only the clarification that it specifically concerns the index-derivatives product line (not the cash market)"
      detail: "具体条款、覆盖产品范围（是否仅Nifty 50，或也含Bank Nifty等其他指数衍生品）本次未逐条核实。"
      sources:
        - title: History & Milestones（官网）
          url: https://www.nseindia.com/static/national-stock-exchange/history-milestones
          accessed: 2026-08-14
      quote: "NSE IFSC-SGX Connect Inaugurated by Hon'ble Prime Minister of India Shri Narendra Modi / 22 years of partnership between NSE and SGX for NIFTY50"
      confidence: medium

