        zh: "衍生品分部无每日固定涨跌停，改以「操作区间」（Operating Range）机制防止错价申报：超出区间的委托单会被交易所判定为「价格冻结」（price freeze）而拒收；区间本身可在盘中动态调整（个股期货按趋势方向每次放宽5%，跨机构协同），借用「动态参考价区间」枚举值仅取其「非固定硬性涨跌停」之近似含义，不代表与港交所式参考价联动机制完全等价"
        en: "The derivatives segment has no fixed daily price limit; instead an \"Operating Range\" mechanism screens out erroneous orders — orders priced beyond the range are rejected by the Exchange as a \"price freeze\". The range itself can be relaxed intraday (for stock futures, by 5% at a time in the direction of the market trend, coordinated across exchanges); the \"dynamic reference price\" enum value is borrowed only for its \"not a fixed hard limit\" sense, and does not imply an HKEX-style moving-reference-price mechanism"
        sources:
