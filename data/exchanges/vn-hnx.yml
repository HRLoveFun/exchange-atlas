    en: "No intraday reversal (T+0). HNX listed stocks / UPCoM settle T+2 (see chapter 8). Article 10 of Circular 120/2020 reserves a legal basis for day trading (requiring a day-trading contract), but the Ministry of Finance's 2025 market-upgrade implementation plan lists intraday trading, alongside securities lending and secured short selling, as a target to be rolled out gradually between 2026 and 2028 — not yet deployed"
    sources:
      - title: "财政部通函 120/2020/TT-BTC 英译第10条（Day trading）"
        url: https://english.luatvietnam.vn/circular-no-120-2020-tt-btc-dated-december-31-2020-of-the-ministry-of-finance-on-transaction-of-listed-shares-registration-of-transactions-and-fund-196778-doc1.html
        accessed: 2026-09-07
      - title: "Vietnam plans roadmap to allow short selling under stock market upgrade program（The Investor，2025-11-15，当日交易列 2026–2028 路线图）"
        url: https://theinvestor.vn/vietnam-plans-roadmap-to-allow-short-selling-under-stock-market-upgrade-program-d17588.html
        accessed: 2026-09-07
    quote: "Investor can conduct day trading after entered into day trading contract with securities company eligible to provide the service of securities loan. ... the ministry has assigned the State Securities Commission (SSC) to study and gradually implement mechanisms for securities borrowing and lending, and regulated short selling through “pending settlement” and intraday trading between 2026 and 2028"
    confidence: medium

