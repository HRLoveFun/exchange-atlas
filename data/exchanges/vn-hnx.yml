      sources:
        - title: "VN30 指数期货合约规格（SSI 英译，Initial margin rate 10%）+ 政府令 158 第34条"
          url: https://www.ssi.com.vn/upload/files/KHCN/TA%20-SSI_HDTLVN30_English.pdf
          accessed: 2026-09-07
      quote: "Initial margin rate | 10%"
      confidence: medium
    connect_schemes:
      zh: "无跨境安排"
      en: "No cross-border arrangements"
      detail: "消极认定；政府令 158 无跨境衍生品条款。"
