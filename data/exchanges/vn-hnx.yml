    # HNX 无科创板 / 创业板式分层。政府债券市场与衍生品市场是独立市场，不是「板块」。

  review_system:
    enum: approval
    zh: "核准制（同 HOSE）：上市登记由交易所依政府令 155/2020/NĐ-CP 审核批准；UPCoM 注册交易为核准登记；发行环节公开发行由 SSC 发注册证书"
    en: "Approval-based (same as HOSE): listing registration is reviewed and approved by the exchange under Decree 155/2020/NĐ-CP; UPCoM registered-trading is an approval-based registration; the public-offering leg requires an SSC certificate"
    sources:
      - title: "政府令 155/2020/NĐ-CP 第109条 / 第133条"
        url: https://stream.vnx.vn/VNX//Legal/20211122161440105155.signed.pdf
        accessed: 2026-09-07
    quote: "Là công ty cỗ phần có vốn điều lệ đã góp tại thời điểm đăng ký niêm yết từ 30 tỷ đồng trở lên"
    confidence: medium

  listing_process_duration:
    zh: ""
    detail: "同 HOSE：无从申请到挂牌的单一法定总时长；交易所有法定审核时限（政府令 155 第111条）。UPCoM 注册交易的审核周期通常更短。本次未从 OCR 定位到含阿拉伯数字的干净时限句，spec 不填，记 OPEN-QUESTIONS。"
    confidence: low

  transfer_between_boards:
    zh: "HNX 上市股票被强制退市但仍符合公众公司条件的，转入 UPCoM（政府令 155 第120(2)条 / 第133条）。UPCoM 公司满足政府令 155 第109条条件的可申请到 HOSE 上市。HNX 与 HOSE 之间无正式转板通道，但市场分工政策鼓励新上市集中于 HOSE"
    en: "An HNX-listed stock that is mandatorily delisted but still qualifies as a public company moves to UPCoM (Decree 155 Art 120(2) / Art 133). A UPCoM company meeting the Art 109 conditions may apply to list on HOSE. There is no formal board-transfer channel between HNX and HOSE, though the market-division policy steers new listings to HOSE"
    sources:
      - title: "政府令 155/2020/NĐ-CP 第120(2)条 / 第133条"
        url: https://stream.vnx.vn/VNX//Legal/20211122161440105155.signed.pdf
        accessed: 2026-09-07
    quote: "Cổ phiếu của công ty hủy bỏ niêm yết nhưng vẫn đáp ứng điều kiện là công ty đại chúng phải đăng ký giao dịch trên hệ thống giao dịch Upcom theo quy định tại Điều 133 Nghị định này."
    confidence: medium

  continuing_obligations:
    zh: "HNX 上市公司同 HOSE（治理要求、通函 96/2020 披露、公众持股门槛、HOSE/HNX 状态阶梯）。UPCoM 公司持续义务较轻（披露频率、内容精简）"
    en: "HNX-listed companies have the same continuing obligations as on HOSE (governance requirements, Circular 96/2020 disclosure, public-float thresholds, the status ladder). UPCoM companies have lighter continuing obligations (reduced disclosure frequency and content)"
    detail: "具体清单待核实。"
    sources:
      - title: "VNX QĐ 22 第六章（个股监管状态阶梯）"
        url: https://stream.vnx.vn/VNX//Legal/2026031816145088VNX.Quy-che-niem-yet_QD22.pdf
        accessed: 2026-09-07
    confidence: medium

  suspension_resumption:
    zh: "HNX 上市股票停牌 / 复牌同 HOSE（QĐ22 第43–44条）；连续 ≥25 交易日停牌后复牌首日适用 ±30% 涨跌幅（HNX 值）。UPCoM 另有其业务规则"
    en: "HNX listed-stock suspension/resumption follows the same rules as HOSE (QĐ22 Arts 43–44); a stock resuming after ≥25 consecutive trading days of suspension uses the ±30% band on its first day (the HNX value). UPCoM has its own regulation"
    sources:
      - title: "VNX QĐ 22 第43–44条 + 附录 II（HNX 复牌 ±30%）"
        url: https://stream.vnx.vn/VNX//Legal/20260318161451415VNX.-PL-Quy-che-niem-yet_QD22.pdf
        accessed: 2026-09-07
    quote: "Biên độ dao động giá của cổ phiếu, chứng chỉ quỹ được giao dịch trở lại sau khi bị tạm ngừng giao dịch, đình chỉ giao dịch từ hai mươi lăm (25) ngày giao dịch liên tiếp trở lên ... +30% so với giá tham chiếu"
    confidence: medium

  delisting_conditions:
    zh: "强制退市条件同 HOSE（政府令 155 第120条：连续 3 年亏损 / 累亏超注册资本 / 净资产为负；连续 3 年否定或拒绝表示审计意见；连续 3 年迟报年报；丧失公众公司资格；主营停顿 ≥1 年；在交易所无交易满 12 个月；伪造文件；《证券法》第12条违法等）。自愿退市须股东大会批准且上市满 2 年（第121条）"
    en: "Mandatory delisting conditions are the same as HOSE (Decree 155 Art 120: losses for 3 consecutive years / accumulated losses exceeding charter capital / negative equity; adverse or disclaimed audit opinion for 3 consecutive years; late annual statements for 3 consecutive years; loss of public-company status; cessation of main business for ≥1 year; no trading for 12 months; forged documents; Article 12 breaches). Voluntary delisting requires shareholder-meeting approval and 2 years listed (Art 121)"
    sources:
      - title: "政府令 155/2020/NĐ-CP 第120条 / 第121条"
        url: https://stream.vnx.vn/VNX//Legal/20211122161440105155.signed.pdf
        accessed: 2026-09-07
    quote: "Kết quả sản xuất, kinh doanh bị thua lỗ trong 03 năm liên tục hoặc tổng số lỗ luỹ kế vượt quá số vốn điều lệ thực góp hoặc vốn chủ sở hữu âm trong báo cáo tài chính kiểm toán năm gần nhất ... Cổ phiếu không có giao dịch tại Sở giao dịch chứng khoán trong thời hạn 12 tháng"
    confidence: medium

  delisting_process:
    zh: "HNX 作出退市决定并公告；符合条件的强制退市股票经整理期后摘牌（见 delisting_transition_period），仍属公众公司的转 UPCoM；被退市组织可依政府令 155 第122条重新申请上市"
    en: "HNX issues and announces the delisting decision; an eligible mandatorily-delisted stock is removed after a transition period (see delisting_transition_period) and, if still a public company, moves to UPCoM; a delisted organization may re-apply to list under Decree 155 Art 122"
    sources:
      - title: "政府令 155/2020/NĐ-CP 第120(4)条 + 第122条"
        url: https://stream.vnx.vn/VNX//Legal/20211122161440105155.signed.pdf
        accessed: 2026-09-07
    confidence: medium

  delisting_transition_period:
    spec:
      value: 30
      unit: calendar_days
      bound: upper
      note: "同 HOSE（政府令 155 第120(4)条，HNX 与 HOSE 共用）：强制退市股票自退市决定日起继续交易「最多 30 日」再摘牌；因吊照 / 无交易满 12 个月 / 破产 / 伪造文件 / 《证券法》第12条违法 / 被暂停主营等特定事由退市的不适用"
    zh: "强制退市股票自退市决定日起继续交易最多 30 日后摘牌；特定严重事由退市的不适用该整理期"
    en: "A mandatorily-delisted stock continues trading for up to 30 days from the delisting decision before removal; this transition period does not apply where delisting is on certain serious grounds"
    sources:
      - title: "政府令 155/2020/NĐ-CP 第120(4)条"
        url: https://stream.vnx.vn/VNX//Legal/20211122161440105155.signed.pdf
        accessed: 2026-09-07
    quote: "được tiếp tục giao dịch trong thời hạn tối đa 30 ngày kể từ ngày ra quyết định hủy niêm yết, trừ trường hợp hủy niêm yết theo quy định tại các điểm c, d, đ, g, k, l, m khoản 1"
    confidence: medium

  post_delisting_venue:
    zh: "仍符合公众公司条件的退市股票转入 HNX 自身运营的 UPCoM 注册交易市场（政府令 155 第120(2)条）"
    en: "A delisted stock still meeting the public-company criteria moves to the UPCoM registered-trading market that HNX itself operates (Decree 155 Art 120(2))"
    sources:
      - title: "政府令 155/2020/NĐ-CP 第120(2)条"
        url: https://stream.vnx.vn/VNX//Legal/20211122161440105155.signed.pdf
        accessed: 2026-09-07
    quote: "phải đăng ký giao dịch trên hệ thống giao dịch Upcom theo quy định tại Điều 133 Nghị định này"
    confidence: medium

