clearing:
  _meta:
    verified: 2026-09-07
    sources:
      - title: "VSDC 英文站「Clearing and Settlement」服务页（现货 T+2·T+1、衍生品 CCP T+1 现金 / E+3 实物）"
        url: https://vsdc.vn/en/sd/XAz40d2Q-9j569TvBgLQaQ
        accessed: 2026-09-07
      - title: "政府令 158/2020/NĐ-CP 第27–35条（衍生品清算结算：VSDC 作 CCP、清算会员、保证金、风险防范机制）"
        url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
        accessed: 2026-09-07

  settlement_cycle:
    enum: t2
    zh: "HNX 上市股票 / UPCoM 股票 T+2；上市公司债券 T+1；政府债券逐笔 T+1；私募债券逐笔 T+0"
    en: "HNX listed stocks / UPCoM stocks T+2; listed corporate bonds T+1; government bonds transaction-by-transaction T+1; privately-placed bonds transaction-by-transaction T+0"
    sources:
      - title: "VSDC 英文站「Clearing and Settlement」服务页"
        url: https://vsdc.vn/en/sd/XAz40d2Q-9j569TvBgLQaQ
        accessed: 2026-09-07
    quote: "Settlement is carried out according to the results of multilateral clearing with a settlement time of T+1 for listed corporate bond transactions and T+2 for stock, fund certificate, and secured warrant transactions. b) For debt instrument transactions: Settlement is done on a transaction-by-transaction basis with a settlement time of T+1."
    confidence: high

  ccp_name:
    zh: "越南证券存托与清算总公司（VSDC）——现货多边净额、无更替；**衍生品市场 VSDC 是中央对手方**（依政府令 158/2020 更替介入买卖双方，设清算会员、保证金、清算基金）"
    en: "Vietnam Securities Depository and Clearing Corporation (VSDC) — multilateral netting without novation for the cash market; **for the derivatives market VSDC is the central counterparty** (interposing itself between buyer and seller under Decree 158/2020, with clearing members, margin and a clearing fund)"
    sources:
      - title: "政府令 158/2020/NĐ-CP 第27–32条 + VSDC 英文站"
        url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
        accessed: 2026-09-07
    quote: "Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam bảo đảm khả năng bù trừ, thanh toán giao dịch chứng khoán phái sinh của thành viên bù trừ thông qua cơ chế phòng ngừa rủi ro quy định tại Điều 35 Nghị định này"
    confidence: medium

  csd_name:
    zh: "越南证券存托与清算总公司（VSDC）——上市证券必须集中登记与存托于 VSDC 方可交易；同 HOSE"
    en: "Vietnam Securities Depository and Clearing Corporation (VSDC) — listed securities must be centrally registered and deposited at VSDC before trading; same as HOSE"
    sources:
      - title: "Law on Securities No. 54/2019/QH14 英译（Art 61–62）"
        url: https://www.economica.vn/Content/files/LAW%20%26%20REG/Securities%20Law%202019%20ENG%281%29.pdf
        accessed: 2026-09-07
    quote: "Securities of public companies and securities of other organizations listed and registered for trading on the securities trading system must be deposited in a concentrated manner at the Vietnam Securities Depository and Clearing Corporation before being traded"
    confidence: medium

  guarantee_model:
    enum: lines_of_defence
    zh: "现货市场（HNX 上市股票 / UPCoM / 债券）为多层结算保障防线、无更替（同 HOSE：违约会员资源 → 结算支持基金 → VSDC 支付支持来源）。**衍生品市场为标准 CCP 违约瀑布**：VSDC 更替担保，设由清算会员出资的清算基金、保证金制度与风险防范机制（政府令 158 第35条），见 default_management"
    en: "The cash market (HNX listed stocks / UPCoM / bonds) runs on multiple lines of defence without novation (same as HOSE: defaulting member's resources → payment assistance fund → VSDC support). **The derivatives market runs a standard CCP default waterfall**: VSDC guarantees via novation, with a clearing-member-funded clearing fund, a margin regime and a risk-prevention mechanism (Decree 158 Art 35), see default_management"
    detail: "本字段 enum 描述现货市场（lines_of_defence）；衍生品市场的 ccp_default_waterfall 在 default_management.spec 与 detail 中表达（taxonomy 说明：同时运营独立衍生品 CCP 的在 detail 补充）。"
    sources:
      - title: "政府令 158/2020/NĐ-CP 第35条（VSDC 衍生品风险防范机制）+ Law on Securities Art 66"
        url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
        accessed: 2026-09-07
    quote: "Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam được áp dụng các biện pháp sau để phòng ngừa rủi ro cho hệ thống thanh toán và bảo vệ nhà đầu tư: a) Xác định và điều chỉnh các mức ký quỹ quy định; b) Yêu cầu thành viên bù trừ đóng góp vào quỹ bù trừ"
    confidence: medium

  initial_margin_practice:
    zh: "现货市场无 CCP 保证金（同 HOSE）。融资交易由证券公司按合同收保证金、外资禁融资。衍生品保证金见 clearing.derivatives"
    en: "The cash market has no CCP margin (same as HOSE). Margin trading is run by securities companies under contract, with foreign investors barred. Derivatives margin is in clearing.derivatives"
    sources:
      - title: "财政部通函 120/2020/TT-BTC 英译第6条 / 第9条"
        url: https://english.luatvietnam.vn/circular-no-120-2020-tt-btc-dated-december-31-2020-of-the-ministry-of-finance-on-transaction-of-listed-shares-registration-of-transactions-and-fund-196778-doc1.html
        accessed: 2026-09-07
    quote: "During the time the securities clearing and settlement has not been implemented under the central clearing partner mechanism, the investor shall carry out securities transactions ... without having to open clearing margin accounts."
    confidence: medium

  maintenance_margin_practice:
    zh: "现货：见 initial_margin_practice。衍生品：清算会员与投资者每日及价格剧烈波动时盯市、按 VSDC 要求追加保证金，未补足 VSDC / 清算会员可平仓（政府令 158 第33–34条）"
    en: "Cash: see initial_margin_practice. Derivatives: clearing members and investors are marked to market daily and intraday, top up margin on VSDC's demand, and have positions closed by VSDC / the clearing member on failure to top up (Decree 158 Arts 33–34)"
    sources:
      - title: "政府令 158/2020/NĐ-CP 第33–34条（清算会员 / 投资者保证金管理、追保、平仓）"
        url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
        accessed: 2026-09-07
    quote: "Thành viên bù trừ có trách nhiệm bổ sung ký quỹ hoặc đóng một phần hoặc đóng toàn bộ vị thế theo yêu cầu của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam. Trường hợp thành viên bù trừ không bổ sung đầy đủ, kịp thời, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam có quyền đóng một phần hoặc toàn bộ vị thế"
    confidence: medium

  mark_to_market_frequency:
    zh: "现货无 CCP 盯市。衍生品：每日盯市，且在价格剧烈波动的交易时段内进行盘中盯市与追保（政府令 158 第33(3)条 / 第34(2)条）"
    en: "The cash market has no CCP mark-to-market. Derivatives: marked to market daily, plus intraday marking and margin calls during trading sessions with sharp price moves (Decree 158 Arts 33(3) / 34(2))"
    sources:
      - title: "政府令 158/2020/NĐ-CP 第33(3)条 / 第34(2)条"
        url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
        accessed: 2026-09-07
    quote: "Hàng ngày và trong các phiên giao dịch có giá chứng khoán biến động mạnh, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam xác định mức ký quỹ yêu cầu trên từng tài khoản"
    confidence: medium

  delivery_method:
    enum: na
    zh: "现货市场 DVP 簿记过户（同 HOSE，BIDV 为股票结算银行、SBV 营业部为债务工具）。衍生品：VN30 指数期货现金结算（T+1，经越南工商银行 Vietinbank），政府债券期货实物交割（买方付款、卖方交付政府债券，E+3，按 DVP 原则）"
    en: "Cash market: DVP by book-entry (same as HOSE, BIDV as stock settlement bank, the SBV's Exchange for debt instruments). Derivatives: VN30 index futures are cash-settled (T+1, via Vietinbank), while government bond futures are physically delivered (buyer pays cash, seller delivers government bonds, E+3, on a DVP basis)"
    sources:
      - title: "VSDC 英文站「Clearing and Settlement」服务页（衍生品结算方式 / 结算银行 Vietinbank）"
        url: https://vsdc.vn/en/sd/XAz40d2Q-9j569TvBgLQaQ
        accessed: 2026-09-07
    quote: "For index futures contracts: Settlement is based on the profit/loss settlement of the last trading day with a settlement time of T+1 ... For government bond futures contracts: Settlement is based on physical delivery (buyer pays cash, seller delivers government bonds) on the last settlement day E+3 ... Cash payment is made through Vietinbank."
    confidence: medium

  last_trading_day_rule:
    zh: "现货市场无「最后交易日」概念。VN30 指数期货最后交易日为合约月第三个星期四（遇假日提前至前一交易日），最后结算日为其后第一个工作日（T+1）；政府债券期货实物交割，最后结算日 E+3"
    en: "The cash market has no \"last trading day\" concept. The VN30 index futures last trading day is the third Thursday of the contract month (brought forward to the previous trading day for holidays), with the final settlement day the next working day (T+1); government bond futures are physically delivered with final settlement day E+3"
    sources:
      - title: "VN30 指数期货合约规格（SSI 英译，Final trading day / Final settlement day）"
        url: https://www.ssi.com.vn/upload/files/KHCN/TA%20-SSI_HDTLVN30_English.pdf
        accessed: 2026-09-07
    quote: "Final trading day | The 3rd Thursday in the contract month. If that day is a holiday, final trading day will be adjusted to the previous trading day / Final settlement day | The next business day after the final trading day"
    confidence: medium

  default_management:
    spec:
      model: ccp_default_waterfall
      layers:
        - {order: 1, resource: "违约投资者保证金 + 违约清算会员保证金", bearer: defaulter}
        - {order: 2, resource: "违约清算会员对清算基金（quỹ bù trừ）的出资", bearer: defaulter}
        - {order: 3, resource: "VSDC 自有资源 / 职业风险防范基金", bearer: ccp}
        - {order: 4, resource: "存续清算会员对清算基金的出资 + VSDC 安排存续会员做反向交易平仓", bearer: surviving_members}
      note: "衍生品市场违约瀑布（政府令 158 第28(5)条 / 第35条）：VSDC 依次动用违约方保证金与担保品 → 违约清算会员的清算基金份额 → VSDC 自有资源 → 存续会员清算基金。VSDC 可强制平仓违约方头寸、要求其他清算会员做对冲交易。现货市场是另一套 lines_of_defence（无更替，见 guarantee_model）"
    zh: "衍生品市场为标准 CCP 违约瀑布：① 违约投资者 / 清算会员保证金；② 违约清算会员的清算基金出资；③ VSDC 自有资源 / 职业风险防范基金；④ 存续清算会员清算基金 + VSDC 组织平仓。绝对额不披露。现货市场违约处置见 guarantee_model（多层防线、无更替）"
    en: "The derivatives market runs a standard CCP default waterfall: (1) the defaulting investor's / clearing member's margin; (2) the defaulting clearing member's clearing-fund contribution; (3) VSDC's own resources / professional risk-prevention fund; (4) surviving clearing members' clearing-fund contributions plus VSDC-arranged position close-out. Absolute amounts are not disclosed. Cash-market default handling is in guarantee_model (lines of defence, no novation)"
    sources:
      - title: "政府令 158/2020/NĐ-CP 第28(5)条 + 第35条（VSDC 衍生品违约处置 / 风险防范机制）"
        url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
        accessed: 2026-09-07
    quote: "Được sử dụng khoản đóng góp vào quỹ bù trừ của thành viên bù trừ để bảo đảm thanh toán và bù đắp các thiệt hại tài chính cho Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam ... Được yêu cầu các thành viên bù trừ khác thực hiện các giao dịch đối ứng để đóng vị thế đứng tên thành viên bù trừ mất khả năng thanh toán hoặc phá sản"
    confidence: medium

  derivatives:
    initial_margin_practice:
      zh: "清算会员须以现金 / 证券 / 其他合格资产向 VSDC（以 VSDC 名义的账户）足额及时缴纳保证金，覆盖清算会员自有及其投资者的全部持仓；保证金水平与方法论由 VSDC 依财政部规定确定、可调整（政府令 158 第33条）。VN30 指数期货合约规格标注初始保证金比例 10%（实际由 VSDC 定）"
      en: "A clearing member must post margin fully and promptly to VSDC (into an account in VSDC's name) in cash / securities / other eligible assets, covering all positions of the clearing member and its investors; margin levels and methodology are set and adjustable by VSDC under Ministry of Finance rules (Decree 158 Art 33). The VN30 index futures contract spec cites a 10% initial margin rate (the actual level is set by VSDC)"
      sources:
        - title: "政府令 158/2020/NĐ-CP 第33条 + VN30 期货合约规格（SSI 英译）"
          url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
          accessed: 2026-09-07
      quote: "Thành viên bù trừ phải ký quỹ đầy đủ và kịp thời trên tài khoản đứng tên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam. Tài sản ký quỹ của thành viên bù trừ bao gồm tiền, chứng khoán và tài sản khác đủ điều kiện ký quỹ"
      confidence: medium
    maintenance_margin_practice:
      zh: "每日及价格剧烈波动的交易时段内，VSDC 重算各账户所需保证金、确定清算会员应缴总额与追加额；清算会员未足额及时补缴，VSDC 有权部分 / 全部平仓其名下头寸（含违约投资者头寸）（政府令 158 第33(3)–(4)条）"
      en: "Daily and during trading sessions with sharp price moves, VSDC recomputes the required margin per account and the clearing member's total and additional obligation; on failure to top up fully and promptly, VSDC may partly or fully close the clearing member's positions (including defaulting investors' positions) (Decree 158 Arts 33(3)–(4))"
      sources:
        - title: "政府令 158/2020/NĐ-CP 第33(3)–(4)条"
          url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
          accessed: 2026-09-07
      quote: "Trường hợp thành viên bù trừ không bổ sung đầy đủ, kịp thời, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam có quyền đóng một phần hoặc toàn bộ vị thế đứng tên thành viên bù trừ"
      confidence: medium
    mark_to_market_frequency:
      zh: "每日盯市 + 价格剧烈波动时段内盘中盯市（政府令 158 第33(3)条 / 第34(2)条）；VN30 指数期货每日结算价与最后结算价方法由 VSDC 规定"
      en: "Daily mark-to-market plus intraday marking during sessions with sharp price moves (Decree 158 Arts 33(3) / 34(2)); the VN30 index futures daily and final settlement price methods are set by VSDC"
      sources:
        - title: "政府令 158/2020/NĐ-CP 第33(3)条 / 第34(2)条"
          url: https://stream.vnx.vn/VNX//Legal/20211122160710946158.signed.pdf
          accessed: 2026-09-07
      quote: "Hàng ngày và trong các phiên giao dịch có giá chứng khoán biến động mạnh, thành viên bù trừ tính toán lãi lỗ vị thế, đánh giá lại giá trị tài sản ký quỹ"
      confidence: medium
    delivery_method:
      enum: cash
      zh: "VN30 指数期货现金结算（按最后结算价与持仓的盈亏差额现金交收，T+1，经越南工商银行 Vietinbank）"
      en: "VN30 index futures are cash-settled (the profit/loss against the final settlement price is settled in cash, T+1, via Vietinbank)"
      sources:
        - title: "VSDC 英文站「Clearing and Settlement」+ VN30 合约规格（SSI 英译）"
          url: https://vsdc.vn/en/sd/XAz40d2Q-9j569TvBgLQaQ
          accessed: 2026-09-07
      quote: "For index futures contracts: Settlement is based on the profit/loss settlement of the last trading day with a settlement time of T+1"
      confidence: medium
    last_trading_day_rule:
      zh: "VN30 指数期货最后交易日为合约月第三个星期四（遇假日提前），最后结算日 T+1；政府债券期货实物交割、最后结算日 E+3"
      en: "The VN30 index futures last trading day is the third Thursday of the contract month (brought forward for holidays), with final settlement T+1; government bond futures are physically delivered with final settlement E+3"
      sources:
        - title: "VN30 合约规格（SSI 英译）+ VSDC 英文站（政府债券期货 E+3）"
          url: https://www.ssi.com.vn/upload/files/KHCN/TA%20-SSI_HDTLVN30_English.pdf
          accessed: 2026-09-07
      quote: "Final trading day | The 3rd Thursday in the contract month ... For government bond futures contracts: Settlement is based on physical delivery ... on the last settlement day E+3 (the 3rd business day after the last trading day)"
      confidence: medium

