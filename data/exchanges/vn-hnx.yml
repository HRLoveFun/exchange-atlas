    en: "Price priority then time priority (HNX and HOSE share QĐ22 Art 22: higher-priced buys and lower-priced sells rank first, earlier orders first at the same price; continuous matching at the waiting counter-order's price, the auction at the maximum-volume price)"
    sources:
