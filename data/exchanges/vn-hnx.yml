  founded_year:
    zh: "2005（河内证券交易中心 3 月 8 日开业）；2009 年升格为「河内证券交易所」（6 月 24 日正式挂牌）"
    en: "2005 (Hanoi Securities Trading Center opened 8 March); upgraded to the Hanoi Stock Exchange in 2009 (officially inaugurated 24 June)"
    detail: |
      交易中心依总理 127/1998/QĐ-TTg 设立、2005-03-08 开业，是越南继胡志明市证券交易中心
      之后的第二家。2009 年依总理 01/2009/QĐ-TTg 改制为「河内证券交易所」、2009-06-24 挂牌，
      组织形式为财政部持股的国有一人有限责任公司；同日启动 UPCoM 注册交易市场（初始 10 只，
      2024 年逾 500 只）。2021 年起并入越南交易所（VNX）体系。
    sources:
      - title: "Hanoi Stock Exchange（Wikipedia，沿革）"
        url: https://en.wikipedia.org/wiki/Hanoi_Stock_Exchange
        accessed: 2026-09-07
    quote: "The exchange was launched on March 8, 2005 ... The HNX was established through Decision No. 01/2009/QĐ-TTg by the Prime Minister, transforming and restructuring the Hanoi Securities Trading Center ... on June 24, 2009, HNX was officially inaugurated as a State-owned single-member limited liability company owned by the Ministry of Finance."
    verified: 2026-09-07
    confidence: medium

  history:
    zh: "2020 年起 HNX 主要作为越南的债券交易所并运营 UPCoM 注册交易市场，多数股票交易迁至 HOSE；2021 年「一个集中交易所」改革后成为越南交易所（VNX）的独立法人子公司（与 HOSE 并列）。HNX 另运营越南衍生品市场（2017-08-10 上线 VN30 指数期货）"
    en: "From 2020 HNX has served primarily as Vietnam's bond exchange and operates the UPCoM registered-trading market, with most stock trading moved to HOSE; after the 2021 \"one concentrated stock exchange\" reform it became a separately-incorporated subsidiary of the Vietnam Exchange (VNX) alongside HOSE. HNX also runs Vietnam's derivatives market (VN30 index futures launched 10 August 2017)"
    detail: "HNX 现组织四个市场：① 上市股票市场（HNX-Index，规模已萎缩）② UPCoM 注册交易市场（逾 500 只）③ 政府债券市场（一级招标 + 二级交易）④ 衍生品市场（VN30 指数期货、5 年 / 10 年期政府债券期货）。"
    sources:
      - title: "Hanoi Stock Exchange（Wikipedia）"
        url: https://en.wikipedia.org/wiki/Hanoi_Stock_Exchange
        accessed: 2026-09-07
    quote: "From 2020, HNX has served primarily as Vietnam's bonds exchange and operates the UPCoM market, while most stock trading was transferred to the HOSE."
    verified: 2026-09-07
    confidence: medium

  organization_form:
    enum: state_owned
    zh: "国有：河内证券交易所是越南交易所（VNX）的一人有限责任公司子公司，VNX 由国家 100% 持股；由国家证券委员会管理监督"
    en: "State-owned: the Hanoi Stock Exchange is a single-member limited-liability subsidiary of the Vietnam Exchange (VNX), which is 100% state-held; managed and supervised by the State Securities Commission"
    sources:
      - title: "Law on Securities No. 54/2019/QH14 英译（Art 43(1)/(3)：VNX 及其子公司）"
        url: https://www.economica.vn/Content/files/LAW%20%26%20REG/Securities%20Law%202019%20ENG%281%29.pdf
        accessed: 2026-09-07
    quote: "The Vietnam Stock Exchange is an enterprise established and operating under the provisions of this Law and the Law on Enterprises, with over 50% of its charter capital or total voting shares held by the State. ... The Vietnam Stock Exchange and its subsidiaries shall be managed and supervised by the State Securities Commission."
    verified: 2026-09-07
    confidence: medium

