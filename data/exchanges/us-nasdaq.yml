        url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-17/title-31.xml?part=1023"
        accessed: 2026-08-24
    quote: "A broker-dealer must establish, document, and maintain a written Customer Identification Program (\"CIP\") ... Except as permitted by paragraph (a)(2)(i)(B) of this section, the broker-dealer must obtain, at a minimum, the following information prior to opening an account: (1) Name; (2) Date of birth, for an individual; (3) Address ...; and (4) Identification number, which shall be: (i) For a U.S. person, a taxpayer identification number; or (ii) for a non-U.S. person, one or more of the following: A taxpayer identification number, a passport number and country of issuance, an alien identification card number, or the number and country of issuance of any other government-issued document evidencing nationality or residence and bearing a photograph or similar safeguard."
