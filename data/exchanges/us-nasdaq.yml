      5810（职员认定）/5815（听证小组复核）/5820（理事会上诉）三级结构的现行设计——该次
      具体修法提案后续于2024年10月撤回，但背景部分对现行规则结构的描述不受撤回影响。
      Listing Council由非纳斯达克关联的产业与非产业背景人士组成、经Nasdaq董事会提名委员会
      批准，这一治理细节另有Nasdaq Listing and Hearing Review Council Charter（托管于
      listingcenter.nasdaq.com/assets/的静态PDF，未走被拦截的Rulebook交互页）佐证。
    sources:
      - title: "SEC Notice of Filing of Proposed Rule Change To Amend Rule 5820（SR-NASDAQ-2024-037，federalregister.gov官方转载）"
        url: https://www.federalregister.gov/documents/2024/07/23/2024-16105/self-regulatory-organizations-the-nasdaq-stock-market-llc-notice-of-filing-of-proposed-rule-change
        accessed: 2026-08-24
      - title: "Nasdaq Listing and Hearing Review Council Charter（PDF）"
        url: https://listingcenter.nasdaq.com/assets/NLHRC_Charter.pdf
