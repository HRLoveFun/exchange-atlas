  price_limits:
    type:
      enum: dynamic_reference
      zh: "涨跌限价机制（LULD），以过去5分钟均价为基准动态计算价格区间，与us-nyse.yml记录的机制相同（同一份跨市场NMS Plan联合规则）"
      en: "Limit Up-Limit Down (LULD)"
      sources:
        - title: Limit Up-Limit Down FAQ（PDF）
          url: https://www.nasdaqtrader.com/content/MarketRegulation/LULD_FAQ.pdf
          accessed: 2026-08-14
      quote: "The Limit Up-Limit Down (LULD) mechanism is intended to prevent trades in National Market System (NMS) securities from occurring outside of specified price bands. The bands would be set at a percentage level above and below the average reference price of the security over the immediately preceding five-minute period."
      confidence: high
    main_board:
      spec: {type: dynamic, band_pct: 5, reference_window_min: 5, note: "LULD 动态价格带，参考价为过去 5 分钟均价。常规时段（9:30am-3:35pm）分层：Tier1（标普500/罗素1000/部分 ETP，前收 >$3）±5%；Tier2（其他 NMS >$3）±10%；前收 $0.75-3 → ±20%；前收 <$0.75 → $0.15 或 75% 孰低。收盘前时段（3:35-4:00pm）各档加倍。band_pct 取 Tier1 常规时段值"}
      zh: "常规时段（9:30am-3:35pm）按证券分层：Tier1（标普500/罗素1000/部分ETP，前收盘价>$3）5%；Tier2（其他NMS证券，前收盘价>$3）10%；前收盘价$0.75-3之间的Tier1&2证券20%；前收盘价低于$0.75者为$0.15或75%孰低。收盘前时段（3:35-4:00pm）各档带宽加倍（如Tier1变10%、$0.75-3档变40%）"
      en: "Tiered during Regular Hours (9:30am-3:35pm): Tier 1 (S&P 500/Russell 1000/select ETPs, prior close >$3) 5%; Tier 2 (other NMS securities, prior close >$3) 10%; Tier 1&2 securities priced $0.75-$3 use 20%; below $0.75 use the lesser of $0.15 or 75%. Bands double during the 3:35-4:00pm closing period"
      sources:
        - title: Limit Up-Limit Down FAQ（PDF）
          url: https://www.nasdaqtrader.com/content/MarketRegulation/LULD_FAQ.pdf
          accessed: 2026-08-14
      quote: |
        Tier 1 Securities Previous close > $3.00 / During Market Open and Market Hours, excluding Close (9:30 AM to 3:35 PM) / 5%
        Tier 2 NMS Securities Previous close > $3.00 / During Market Hours, including Open/Close (9:30 AM to 4:00 PM) / 10%
        Tier 1 and Tier 2 NMS Securities Previous close equal to $0.75 to and including $3.00 / During Market Open and Market Hours, excluding Close (9:30 AM to 3:35 PM) / 20%
        Tier 1 & 2 NMS Securities Previous close < $0.75 / During Market Open and Market Hours, excluding Close (9:30 AM to 3:35 PM) / The lesser of $0.15 or 75%
      confidence: high
    other_boards:
      zh: "不适用：LULD的Tier1/Tier2分层已覆盖全部NMS证券，无另设的'其他板块'幅度"
      en: "Not applicable: the Tier 1/Tier 2 LULD structure already covers all NMS securities"
      confidence: medium

  circuit_breaker:
    enum: index_level
    spec: {type: index_level, reference: [{index: "S&P 500", exchange: self}], levels: [{threshold_pct: 7, halt_minutes: 15}, {threshold_pct: 13, halt_minutes: 15}, {threshold_pct: 20, halt_minutes: null, day_end: true}], note: "同一跨市场联合计划（与 NYSE 一致）；一、二级 3:25pm 后触发不再暂停（除非同时触发三级）；三级任何时段触发即暂停至收市"}
    zh: "全市场熔断（Market-Wide Circuit Breaker, MWCB），基于标普500指数单日跌幅：7%（一级）、13%（二级）、20%（三级）；与us-nyse.yml记录的机制相同（同一份跨市场联合计划）"
    en: "Market-Wide Circuit Breaker (MWCB) based on S&P 500 index decline: 7% (Level 1), 13% (Level 2), 20% (Level 3)"
    detail: "一级/二级：3:25pm前触发则暂停交易15分钟，3:25pm后触发不再暂停（除非同时触发三级）；三级：任何时段触发即暂停交易至当日收市。"
    sources:
      - title: Market-Wide Circuit Breakers FAQ（PDF）
        url: https://www.nasdaqtrader.com/content/marketregulation/mwcb_faq.pdf
        accessed: 2026-08-14
    quote: "Level 1 halt (7% decline in S&P 500 index) / Trading will halt for 15 minutes if drop occurs before 3:25 p.m. / Level 2 halt (13% decline in S&P 500 index) / Trading will halt for 15 minutes if drop occurs before 3:25 p.m. / Level 3 halt (20% decline in S&P 500 index) / At any time during the trading day-trading will halt for the remainder of the trading day."
    confidence: high

  volatility_interruption:
    spec: {halt_minutes: 5, note: "LULD 个股级：NBO 等于下限价格带（或 NBB 等于上限）形成 15 秒 Limit State，若仍在价格带交易或 15 秒内无价格带内成交即触发 5 分钟交易暂停；价格带见 price_limits"}
    zh: "LULD个股级波动性中断：报价触及价格带边缘形成'Limit State'，持续15秒仍未消化即触发5分钟交易暂停"
    en: "LULD stock-level volatility interruption: an unresolved 15-second Limit State triggers a five-minute trading pause"
    sources:
      - title: Limit Up-Limit Down FAQ（PDF）
        url: https://www.nasdaqtrader.com/content/MarketRegulation/LULD_FAQ.pdf
        accessed: 2026-08-14
    quote: "All NMS Stocks (once all phased in) will enter into a \"Limit State\" quotation period of 15 seconds if the NBO equals the Lower Price Band (without crossing the NBB), or the NBB equals the upper price band (without crossing the NBO)... If a limit state exists and trading continues to occur at the price band OR no trading occurs within the price band for more than 15 seconds, then a five-minute trading pause would be enacted."
    confidence: high

  trading_halt_mechanism:
    zh: "见circuit_breaker（全市场级MWCB）与volatility_interruption（个股级LULD）；另有因披露事项、系统故障等触发的监管性停牌，本次未逐条核实"
    en: "See circuit_breaker (market-wide MWCB) and volatility_interruption (stock-level LULD); regulatory halts (disclosure matters, technical issues, etc.) also exist but were not verified in detail this session"
    confidence: medium

  error_trade_rule:
    spec:
      bust_allowed: true
      review_window_min: 30
      deviation_threshold_pct: 10
      resolution: cancel
      note: "常规市场时段内、受 LULD 计划约束的 NMS 股票原则上不可复核（LULD 价格带已阻止极端价成交）；仅在 LULD 带不可用、系统故障致带外成交、监管停牌后成交、或参考价错误等情形可复核。适用数值门槛按参考价分档：≤$25 为 10%、$25.01–$50 为 5%、>$50 为 3%（盘前/盘后翻倍）。裁定成立即宣告成交无效并从合并行情带移除，不作调价。Rule 4120(c) 停牌拍卖产生的成交不可申请复核"
    zh: "「明显错误」成交（价格、股数、证券识别等任一要素明显有误）：会员可在成交后 30 分钟内向 Nasdaq MarketWatch 书面申请复核；官员亦可自行发起、一般在发现后 30 分钟内处理；裁定成立者宣告该笔成交无效（null and void）并从合并行情带移除。常规市场时段内受 LULD 计划约束的股票通常不予复核；适用数值门槛为偏离参考价 10%（参考价 $0.00–$25.00）、5%（$25.01–$50.00）、3%（>$50.00），偏离 ≥30% 一律作废"
    en: "A 'clearly erroneous' execution (an obvious error in any term such as price, number of shares, or identification of the security): a member may file a written request for review with Nasdaq MarketWatch within 30 minutes of the execution time, and an official may also act on their own motion generally within 30 minutes of detection; if found clearly erroneous the transaction is declared null and void and removed from the consolidated tape. During Regular Market Hours, stocks subject to the LULD Plan are generally not reviewable; where the Numerical Guidelines apply a trade is clearly erroneous if it deviates from the Reference Price by 10% (Reference Price $0.00–$25.00), 5% ($25.01–$50.00) or 3% (over $50.00), and transactions 30% or more away are nullified"
    detail: "Nasdaq Equity Rule 11890（Clearly Erroneous Transactions），与 NYSE Rule 7.10 同出 SRO 统一框架、内容基本一致。美国股票 CEE 只作废、不调价。quote 引自 SR-NASDAQ-2022-052 Exhibit 5（原文含增删标记，此处摘无标记的连续片段）。"
    sources:
    - {title: "The Nasdaq Stock Market LLC Rules — Rule 11890 (Clearly Erroneous Transactions)，SEC filing SR-NASDAQ-2022-052 Exhibit 5", url: "https://www.sec.gov/files/rules/sro/nasdaq/2022/34-95902-ex5.pdf", accessed: 2026-08-30}
    - {title: "Clearly Erroneous Transactions Policy（nasdaqtrader.com 官网）", url: "https://www.nasdaqtrader.com/trader.aspx?id=clearlyerroneous", accessed: 2026-08-30}
    quote: "the terms of a transaction executed on Nasdaq are \"clearly erroneous\" when there is an obvious error in any term, such as price, number of shares or other unit of trading, or identification of the security. A transaction made in clearly erroneous error and cancelled by both parties or determined by Nasdaq to be clearly erroneous will be removed from the consolidated tape. ... Nasdaq MarketWatch within 30 minutes of the execution time. ... Greater than $0.00 up to and including $25.00 10% ... Greater than $50.00 3% ... the official shall declare the transaction null and void."
    confidence: high

  intraday_reversal:
    enum: t0
    zh: "T+0（可当日回转），与结算层面T+1（见clearing.settlement_cycle）是两个不同概念"
    en: "T+0 (same-day round-trip trading allowed); distinct from the T+1 settlement cycle (see clearing.settlement_cycle)"
    detail: "与us-nyse.yml记录的判断依据一致：美股交易层面对当日买卖同一证券无交易所层面的特殊限制，Pattern Day Trader规则是针对保证金账户的监管要求而非交易所回转限制，本次未深入核实细节。"
    confidence: medium

  short_selling:
    enum: restricted_uptick
    spec: {naked_allowed: false, uptick_rule: true, borrow_required: true, note: "Reg SHO；Rule 201 备兑报升熔断——证券较上一交易日收盘价跌 ≥10% 触发，触发后当日剩余及次日卖空单价须高于当前全国最优买价（NBB）方可成交；short exempt 及触发前已优于 NBB 的展示单例外"}
    zh: "受Regulation SHO监管，含卖空限制熔断机制（Rule 201报升规则，Alternative Uptick Rule）：当某证券较其上一交易日常规交易时段收盘价（由其上市市场认定）下跌达10%或以上时触发，触发后当日剩余时段及次一交易日，卖空单价格须高于当前全国最优买价方可成交（展示卖空单在触发前已优于最优买价挂出的除外，另有标记为short exempt的例外情形）"
    en: "Regulated under Regulation SHO, including the short sale-related circuit breaker (Rule 201, Alternative Uptick Rule): triggered when a security's price decreases by 10% or more from its closing price on the prior day (as determined by its listing market), after which short sale orders for the remainder of that day and the following day may only execute at a price above the current national best bid (subject to exceptions for displayed orders already priced above the NBB before the trigger, and orders marked \"short exempt\")"
    detail: |
      先前留空理由：Nasdaq/NYSE/FINRA页面均只确认Rule 201存在，未给出触发跌幅百分比的逐字
