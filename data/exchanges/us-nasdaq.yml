      达标情形，其他类型持续上市缺陷（如市值、股东人数）的宽限期长度本次未逐一核实。
      ⚠️ 降级说明：本次抓取到的 .cache/us-nasdaq 下该 federalregister.gov 页面实为反爬验证页
      （标题「Request Access」、reCAPTCHA 拦截），并非文档正文，无法逐字核验下列引文，故
      confidence 由 high 降为 medium；原拟引用文字移入此处备查：a company that was afforded the
      second 180-day compliance period described in Nasdaq Rule 5810(c)(3)(A)(ii) ... The Exchange
      states in its proposal that it believes that two consecutive compliance periods for a total of
      360 days is a sufficient period of time for a company to regain compliance with the Bid Price
      Requirement.
    sources:
      - title: "SEC Order Granting Approval of a Proposed Rule Change to Modify the Application of the Minimum Bid Price Compliance Periods and the Delisting Appeals Process（SR-NASDAQ-2024-031，federalregister.gov官方转载）"
