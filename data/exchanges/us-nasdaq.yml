  history:
    zh: "1971年由美国证券商协会（NASD）设立为电子报价系统子公司；此后经股权重组逐步脱离NASD，2005年以代码NDAQ完成上市；2007年收购北欧-波罗的海交易所运营商OMX，组建纳斯达克OMX集团（现同一法人体系下称 Nasdaq, Inc.，见各页版权声明）"
    en: "Founded 1971 as a subsidiary of the National Association of Securities Dealers (NASD); gained independence through a restructuring and went public under the symbol NDAQ in 2005; acquired OMX (the Nordic/Baltic exchange operator) in 2007, forming the NASDAQ OMX Group (the current corporate entity is Nasdaq, Inc., per site copyright notices)"
    detail: |
      2000年起NASD开始向FINRA会员、投资公司及上市公司出售Nasdaq股权、扩大股权分散度；
      抓取到的官网文章明确表述"脱离创始机构NASD、于2005年以NDAQ代码上市"这一因果关系，
      但具体"NASD完全退出持股""正式成为独立注册全国性证券交易所"的确切年份（常见说法为
      2006/2007年）本次抓取页面未给出可摘引的逐字原文，故未写入 zh/en 正文，仅记于此处
      供后续核实。2007年收购OMX、组建"NASDAQ OMX Group"这一节点则有官网原文直接佐证
      （见 quote）；该集团后续更名回"Nasdaq, Inc."的具体年份同样未在本次抓取页面中找到
      原文确认，只能用各页面版权声明"© 2026, Nasdaq, Inc."佐证这是当前的法律实体名称。
    sources:
      - title: Nasdaq CEOs Recall 50 Years of Innovation（历史访谈文章）
        url: https://www.nasdaq.com/articles/nasdaq-ceos-recall-50-years-of-innovation
