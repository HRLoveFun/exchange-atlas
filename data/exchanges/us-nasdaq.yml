    en: "Market-Wide Circuit Breaker (MWCB) based on S&P 500 index decline: 7% (Level 1), 13% (Level 2), 20% (Level 3)"
    detail: "一级/二级：3:25pm前触发则暂停交易15分钟，3:25pm后触发不再暂停（除非同时触发三级）；三级：任何时段触发即暂停交易至当日收市。"
    sources:
      - title: Market-Wide Circuit Breakers FAQ（PDF）
        url: https://www.nasdaqtrader.com/content/marketregulation/mwcb_faq.pdf
        accessed: 2026-08-14
    quote: "Level 1 halt (7% decline in S&P 500 index) / Trading will halt for 15 minutes if drop occurs before 3:25 p.m. / Level 2 halt (13% decline in S&P 500 index) / Trading will halt for 15 minutes if drop occurs before 3:25 p.m. / Level 3 halt (20% decline in S&P 500 index) / At any time during the trading day-trading will halt for the remainder of the trading day."
    confidence: high

  volatility_interruption:
    zh: "LULD个股级波动性中断：报价触及价格带边缘形成'Limit State'，持续15秒仍未消化即触发5分钟交易暂停"
    en: "LULD stock-level volatility interruption: an unresolved 15-second Limit State triggers a five-minute trading pause"
    sources:
      - title: Limit Up-Limit Down FAQ（PDF）
        url: https://www.nasdaqtrader.com/content/MarketRegulation/LULD_FAQ.pdf
        accessed: 2026-08-14
    quote: "All NMS Stocks (once all phased in) will enter into a \"Limit State\" quotation period of 15 seconds if the NBO equals the Lower Price Band (without crossing the NBB), or the NBB equals the upper price band (without crossing the NBO)... If a limit state exists and trading continues to occur at the price band OR no trading occurs within the price band for more than 15 seconds, then a five-minute trading pause would be enacted."
    confidence: high

  trading_halt_mechanism:
    zh: "见circuit_breaker（全市场级MWCB）与volatility_interruption（个股级LULD）；另有因披露事项、系统故障等触发的监管性停牌，本次未逐条核实"
    en: "See circuit_breaker (market-wide MWCB) and volatility_interruption (stock-level LULD); regulatory halts (disclosure matters, technical issues, etc.) also exist but were not verified in detail this session"
    confidence: medium

  intraday_reversal:
    enum: t0
    zh: "T+0（可当日回转），与结算层面T+1（见clearing.settlement_cycle）是两个不同概念"
    en: "T+0 (same-day round-trip trading allowed); distinct from the T+1 settlement cycle (see clearing.settlement_cycle)"
    detail: "与us-nyse.yml记录的判断依据一致：美股交易层面对当日买卖同一证券无交易所层面的特殊限制，Pattern Day Trader规则是针对保证金账户的监管要求而非交易所回转限制，本次未深入核实细节。"
    confidence: medium

  short_selling:
    enum: restricted_uptick
    zh: "受Regulation SHO监管，含卖空限制熔断机制（Rule 201报升规则，Alternative Uptick Rule）；具体触发跌幅阈值本次未在抓取页面中找到可摘引的官方原文"
    en: "Regulated under Regulation SHO, including the short sale-related circuit breaker (Rule 201, Alternative Uptick Rule)"
    detail: "与us-nyse.yml记录的情况一致：Regulation SHO是SEC统一规则，Nasdaq/NYSE/FINRA页面均只确认Rule 201存在，未给出'跌幅达到多少百分比触发'的逐字原文，按铁律不凭记忆填入具体数值。"
    sources:
      - title: Regulation SHO（官网）
        url: https://www.nasdaqtrader.com/Trader.aspx?id=regsho
        accessed: 2026-08-14
      - title: Short Sale Circuit Breaker（官网）
        url: https://www.nasdaqtrader.com/trader.aspx?id=ShortSaleCircuitBreaker
        accessed: 2026-08-14
    quote: "The SEC adopted amendments to Regulation SHO with a compliance date of November 10, 2010. Among the rule changes, the SEC introduced Rule 201 (Alternative Uptick Rule), a short sale-related circuit breaker that when triggered, will impose a restriction on prices at which securities may be sold short."
    confidence: medium

  block_trade:
    zh: ""
    confidence: low

  dark_pool:
    zh: "纳斯达克自身撮合系统内设有非展示订单（Non-Displayed/Midpoint Peg等）机制，可提供不公开显示的流动性；这与传统意义上独立于交易所之外的第三方暗池是否算同一概念，本次未核实清楚"
    en: "Nasdaq's own matching system offers non-displayed order types (e.g. Midpoint Peg) providing hidden liquidity; whether this is the same concept as third-party off-exchange dark pools was not clarified this session"
    sources:
