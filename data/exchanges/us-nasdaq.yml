  regulator:
    zh: "美国证券交易委员会"
    en: "U.S. Securities and Exchange Commission (SEC)"
    detail: "Nasdaq 作为注册的全国性证券交易所受SEC监管；Corporate Governance 上市规则表中多处援引SEC规则条款（如审计委员会须满足SEC Rule 10A-3），是SEC对上市公司层面监管职权的进一步佐证。"
    sources:
      - title: Regulation SHO（官网）
        url: https://www.nasdaqtrader.com/Trader.aspx?id=regsho
        accessed: 2026-08-14
    quote: "The Securities and Exchange Commission (SEC) has adopted amendments to Regulation SHO"
    confidence: high

  self_regulatory_org:
    zh: "Nasdaq自身监管职能部门（MarketWatch股票/期权市场监察、调查与执法、上市审核三大团队，独立于业务部门运作）；FINRA代表纳斯达克会员机构提供部分监管服务"
    en: "Nasdaq's own regulatory functions (MarketWatch equities/options surveillance, Investigations & Enforcement, Listing Qualifications — operating independently of Nasdaq's business units); FINRA provides regulatory services on Nasdaq's behalf for its members"
    detail: |
      与 NYSE"NYSE Regulation自身部门 + 委托FINRA处理跨市场事务"的组合结构基本一致；
      Market Maker Process页面明确写明"FINRA provides regulatory services for all NASDAQ
      members on behalf of The NASDAQ Stock Market LLC"，是会员资格审核环节FINRA介入的
      直接佐证。
    sources:
      - title: Market Regulation（官网）
        url: https://www.nasdaq.com/market-regulation
        accessed: 2026-08-14
      - title: Market Maker Process（官网）
        url: https://www.nasdaqtrader.com/trader.aspx?id=marketmakerprocess
        accessed: 2026-08-14
    quote: "At Nasdaq, our regulatory functions operate independently of Nasdaq's business units to safeguard the integrity of our markets."
    confidence: high

  clearing_regulator:
    zh: "美国证券交易委员会"
    en: "SEC"
    detail: "与市场监管为同一机构；清算机构NSCC/DTCC本身的监管细节本次未专门核实，与us-nyse.yml记录的情况一致。"
    confidence: medium

  core_laws:
    zh: "《1934年证券交易法》（Securities Exchange Act of 1934）——纳斯达克作为SEC注册的全国性证券交易所须依据该法第6条完成注册"
    en: "Securities Exchange Act of 1934 — Nasdaq is registered as a national securities exchange under Section 6 of this Act"
    detail: |
      本文件先前因 nasdaq.com/nasdaqtrader.com 页面未见逐字原文而留空（见旧版 detail）；本次
      改用 govinfo.gov 官方汇编版制定法全文（美国政府出版局/众议院法律修订顾问办公室发布的
      "Compilation of Statutes"，非扫描件，可直接 curl 抓取纯文本 PDF）找到该法第6条"全国性
      证券交易所注册"条文原文，佐证 Nasdaq 与 us-nyse 等其他全国性证券交易所同受本法管辖。
      govinfo.gov 与 sec.gov 是不同域名/基础设施，未触发 sec.gov 的反爬拦截，详见
      SOURCES.md 本节反爬突破记录。
    sources:
      - title: "Securities Exchange Act of 1934（govinfo.gov 官方汇编全文 PDF，Compilation of Statutes, current through P.L. 119-60）"
        url: https://www.govinfo.gov/content/pkg/COMPS-1885/pdf/COMPS-1885.pdf
        accessed: 2026-08-24
    quote: "SECURITIES EXCHANGE ACT OF 1934 ... NATIONAL SECURITIES EXCHANGES SEC. 6. An exchange may be registered as a national securities exchange under the terms and conditions hereinafter provided in this section and in accordance with the provisions of section 19(a) of this title, by filing with the Commission an application for registration in such form as the Commission, by rule, may prescribe containing the rules of the exchange and such other information and documents as the Commission, by rule, may prescribe as necessary or appropriate in the public interest or for the protection of investors."
    confidence: high

  foreign_ownership_limit:
    zh: "无针对纳斯达克上市公司整体的统一外资持股比例上限；外国投资以「个案国家安全审查」（CFIUS，外国投资委员会）而非固定比例上限的形式管控，特定受监管行业（如航空、广播电视等）另有行业专属的法定持股比例限制，本次未逐一核实"
    en: "No blanket foreign-ownership percentage cap applies market-wide to Nasdaq-listed companies; foreign investment is instead subject to case-by-case national-security review (CFIUS) rather than a fixed ownership ceiling. Select regulated industries (e.g. airlines, broadcasting) carry their own statutory ownership caps, not individually verified this session"
    detail: |
      推断依据：美国财政部官网将CFIUS定性为审查"特定"涉及外国投资美国企业交易的跨部门
      委员会，其审查对象是逐笔"交易"，不是设定一条全市场统一的持股比例红线，这与常见的
      "外资持股不得超过X%"式限制在制度设计上是两类不同机制。未找到官方原文直接断言"无
      持股比例上限"这一否定性表述（防幻觉铁律不能证明否定），故本字段confidence定为
      medium，以CFIUS机制本身的官方定性作为可引用的正面事实，"无统一比例上限"是结构性
      推论而非逐字引用。
    sources:
      - title: "Committee on Foreign Investment in the United States (CFIUS)（美国财政部官网）"
        url: https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius
        accessed: 2026-08-24
    quote: "an interagency committee authorized to review certain transactions involving foreign investment into United States businesses and certain transactions by foreign persons involving real estate in the United States, in order to determine the effect of such transactions on the national security of the United States"
    confidence: medium

  capital_controls:
    zh: "无统一的资本/外汇管制制度；对外国投资者资金进出的限制以「特定国家/主体定向制裁」（OFAC，外国资产控制办公室）为主要渠道，而非普遍性资本管制——例如对俄罗斯关联实体的新增投资限制并不禁止向非美国人出售/剥离既有证券持仓"
    en: "No general capital/FX control regime; restrictions on foreign investors' funds are instead administered through targeted, country/entity-specific sanctions programs (OFAC) rather than blanket capital controls — e.g. the new-investment restrictions on Russia-connected entities do not prohibit selling or divesting existing securities holdings to a non-U.S. person"
    detail: |
      OFAC官网历史沿革页说明其前身可追溯至二战时期防止纳粹利用被占领国外汇/证券资产的
      「外国资金控制办公室」，现职能定位为对特定国家、政权、恐怖组织等实施定向经济制裁；
      FAQ 1055（俄罗斯相关制裁）具体示例进一步说明限制针对特定交易类型/特定对手方（新增
      对俄关联实体的投资），而非笼统限制外国人买卖美国证券或汇出收益，普通二级市场剥离/
      出售交易明确不受影响。与foreign_ownership_limit字段相同的方法论限制：未找到"美国无
      一般性资本管制"这一表述的逐字官方原文（防幻觉铁律不能证明否定），confidence定为
      medium，仅以OFAC职能范围与具体制裁条款的运作方式作为正面可引用事实。
    sources:
      - title: About OFAC（美国财政部海外资产控制办公室官网）
        url: https://ofac.treasury.gov/about-ofac
        accessed: 2026-08-24
      - title: "OFAC FAQ 1055（俄罗斯相关定向制裁示例）"
        url: https://ofac.treasury.gov/faqs/1055
        accessed: 2026-08-24
    quote: "OFAC notes, however, the new investment prohibitions of the respective E.O.s do not prohibit U.S. persons from selling or divesting debt or equity securities issued by such entities to a non-U.S. person. Moreover, U.S. financial institutions may clear and settle, or otherwise serve as market intermediaries in, such divestment transactions on the secondary market — including transactions between non-U.S. persons."
    confidence: medium

  disclosure_requirements:
    zh: "联邦层面公平披露规则（Regulation FD，§ 243.100）：发行人向经纪商/投资顾问/机构投资经理等特定对象披露重大非公开信息时，须同步（故意披露）或及时（非故意披露）向公众披露同一信息"
    en: "Federal-level Regulation FD (Fair Disclosure, § 243.100): when an issuer discloses material nonpublic information to specified persons (broker-dealers, investment advisers, institutional investment managers, etc.), it must simultaneously (intentional disclosure) or promptly (non-intentional disclosure) make the same information public"
    detail: |
      Regulation FD是SEC统一规则，适用于全体在美上市发行人，非纳斯达克自身单独设定的披露
      要求；纳斯达克自身上市规则（Rule 5250(d)，见Continued Listing Guide已核实内容）另要求
      上市公司通过邮寄或官网电子方式向股东提供年度/中期报告，属于交易所上市规则层面的
      补充性披露义务。两者是"SEC联邦证券法层面"与"交易所上市规则层面"两套并存的披露要求，
      本字段以更基础的Regulation FD为主。本次通过 ecfr.gov 的 versioner API（而非该站面向
      用户的前端页面，那是纯JS外壳、curl抓不到正文）拿到Title 17 Part 243的官方汇编纯文本，
      详见SOURCES.md本节反爬突破记录。
    sources:
      - title: "17 CFR 243.100 Regulation FD（eCFR 官方汇编全文，versioner API 纯文本接口）"
        url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-17/title-17.xml?part=243"
        accessed: 2026-08-24
    quote: "§ 243.100 General rule regarding selective disclosure. ... Whenever an issuer, or any person acting on its behalf, discloses any material nonpublic information regarding that issuer or its securities to any person described in paragraph (b)(1) of this section, the issuer shall make public disclosure of that information as provided in § 243.101(e): (1) Simultaneously, in the case of an intentional disclosure; and (2) Promptly, in the case of a non-intentional disclosure."
    confidence: high

  investor_protection:
    zh: "证券投资者保护公司（SIPC）：SIPC会员经纪商破产清算时，为客户账户中缺失的现金和证券提供保护，保护限额50万美元（其中现金子限额25万美元）；保护对象不区分投资者国籍或居住地"
    en: "Securities Investor Protection Corporation (SIPC): protects against the loss of cash and securities held at a failed SIPC-member brokerage, up to a limit of $500,000 (including a $250,000 sub-limit for cash); protection applies regardless of the customer's nationality or residency"
    detail: |
      SIPC不是政府机构，而是国会依据《1970年证券投资者保护法》设立的会员制非营利公司，
      具有法定强制性（受监管的经纪商必须加入）；官网原文明确SIPC不保护证券市值下跌造成的
      损失，只保护经纪商破产清算时账户中"缺失"的现金和证券，与银行存款保险（FDIC）的保障
      范围不同。
    sources:
      - title: "What SIPC Protects（sipc.org 官网）"
        url: https://www.sipc.org/for-investors/what-sipc-protects
        accessed: 2026-08-24
    quote: "SIPC protects against the loss of cash and securities – such as stocks and bonds – held by a customer at a financially-troubled SIPC-member brokerage firm. The limit of SIPC protection is $500,000, which includes a $250,000 limit for cash. ... There is no requirement that a customer reside in or be a citizen of the United States."
    confidence: high

