  dividend_withholding_tax:
    zh: "境外投资者（非美国居民/外国实体）取得美国来源股息等收入，一般按30%的法定税率由付款方（经纪商/托管机构）代扣代缴（NRA Withholding，Internal Revenue Code第1441-1443条）；若投资者所在国与美国订有税收协定，可申请按协定优惠税率代扣（需提交W-8BEN等证明文件）；美国本土居民投资者取得股息则按其个人所得税税率征税（合格股息适用与长期资本利得相同的优惠税率档），不涉及预扣"
    en: "Foreign investors (nonresident aliens/foreign entities) receiving U.S.-source dividend income are generally subject to a statutory 30% withholding at source (NRA Withholding under Internal Revenue Code Sections 1441-1443), withheld by the payer (broker/custodian); a reduced treaty rate may apply if the investor's home country has a tax treaty with the U.S. (requires filing Form W-8BEN etc.). U.S. resident investors' dividends are instead taxed at their personal income tax rate (qualified dividends receive the same preferential rates as long-term capital gains), with no withholding involved"
    sources:
      - title: "NRA withholding（irs.gov官网）"
        url: https://www.irs.gov/individuals/international-taxpayers/nra-withholding
        accessed: 2026-08-24
    quote: "Generally, a foreign person is subject to U.S. tax on its U.S. source income. Most types of U.S. source income received by a foreign person are subject to U.S. tax of 30%. A reduced rate, including exemption, may apply if an Internal Revenue Code Section provides for a lower rate, or there is a tax treaty between the foreign person's country of residence and the United States. The tax is generally withheld (NRA withholding) from the payment made to the foreign person."
    confidence: high

  implicit_costs_note:
    zh: "本次未找到纳斯达克官方/权威机构公开的买卖价差、市场冲击成本等隐性成本统计数据；间接信号：持续上市标准中做市商数量最低要求随所选子标准而异——Nasdaq Capital Market（入门层级）三个可选子标准均只需2家做市商，Global Select/Global Market的权益标准同样只需2家，但其市值标准/总资产标准则需4家。做市商数量下限越低，理论上买卖价差与隐性成本越高，但这是从持续上市量化标准反推的结构性信号，非直接的价差实测数据"
    en: "No official Nasdaq or authoritative statistics on bid-ask spread or market-impact cost were found this session. An indirect signal: the minimum market-maker count for continued listing varies by sub-standard — Nasdaq Capital Market's (entry-tier) three alternative sub-standards each require only 2 market makers, and Global Select/Global Market's Equity Standard also requires only 2, but their Market Value/Total Assets standards require 4. A lower market-maker floor is generally associated with wider spreads and higher implicit costs, but this is a structural inference from listing standards, not a direct spread measurement"
    detail: "与costs.exchange_fees记录的做市商-吃单者（maker-taker）费率模式有关联但概念不同：exchange_fees是交易所向会员收取的显性费用，implicit_costs_note是投资者因价差/冲击成本承担的隐性成本，两者不可混同。"
    sources:
      - title: Nasdaq Continued Listing Guide（PDF）
        url: https://listingcenter.nasdaq.com/assets/continuedguide.pdf
        accessed: 2026-08-24
    quote: |
      For Nasdaq Global Select Market and Nasdaq Global Market Companies ... Market Makers 2 4 4
      For Nasdaq Capital Market Companies ... Market Makers 2 2 2
    confidence: low

