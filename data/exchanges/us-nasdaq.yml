    zh: "公司制（由NASD旗下子公司改制为独立上市公司，2005年以NDAQ代码上市）"
    en: "Demutualized, listed (converted from an NASD subsidiary to an independent public company, listed under NDAQ in 2005)"
    detail: "与 NYSE 2006年由会员制改制为上市公司的路径不同：Nasdaq 起点不是传统会员制交易所，而是行业自律组织NASD旗下的电子报价系统子公司，走的是'子公司独立化上市'而非'会员制改制'路径，但落点同样是自身股票公开交易的公司制实体，故枚举值同取 demutualized_listed。"
    sources:
