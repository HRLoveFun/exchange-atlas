    zh: "SEC《最佳利益规则》（Regulation Best Interest, Reg BI，§ 240.15l-1）：经纪商及其关联自然人向散户客户就证券交易/投资策略提出建议时，须以散户客户利益为先，不得将自身或第三方利益置于客户利益之上；须履行披露、审慎、利益冲突管理、合规四项义务"
    en: "SEC's Regulation Best Interest (Reg BI, § 240.15l-1): a broker-dealer and its associated persons, when recommending any securities transaction or investment strategy to a retail customer, must act in the customer's best interest and not place their own or a third party's interest ahead of the customer's — satisfied through four component obligations: Disclosure, Care, Conflict of Interest, and Compliance"
    detail: |
