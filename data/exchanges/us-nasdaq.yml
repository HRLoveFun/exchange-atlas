  fx_risk_note:
    zh: "美元为全球主要储备货币，本币汇率风险对美国本土投资者而言较低；对以美元计价资产的境外投资者而言，汇率风险来自其本币兑美元波动"
    en: "USD is the world's primary reserve currency; domestic FX risk is low for U.S.-based investors. For foreign investors holding USD-denominated assets, FX risk arises from their home currency's fluctuation against the USD"
    detail: "与us-nyse.yml记录的通用美元市场表述一致，非纳斯达克专属，未附独立来源。"
    confidence: low

  political_risk_note:
    zh: "《外国公司问责法》（Holding Foreign Companies Accountable Act, HFCAA，2020年签署生效）：若上市公司使用的会计师事务所因所在辖区当局限制，连续3年无法接受美国上市公司会计监督委员会（PCAOB）检查，SEC须禁止该公司证券在美全国性证券交易所（含纳斯达克）及场外市场交易——该法是近年在美上市外国发行人（尤以中国大陆背景发行人为代表）面临的主要政治/地缘风险来源之一"
    en: "Holding Foreign Companies Accountable Act (HFCAA, enacted 2020): if a listed issuer's auditor cannot be inspected by the PCAOB for 3 consecutive years because of restrictions imposed by authorities in the auditor's jurisdiction, the SEC must prohibit that issuer's securities from trading on U.S. national securities exchanges (including Nasdaq) and OTC markets — a leading source of political/geopolitical risk in recent years for foreign issuers listed in the U.S., particularly those with mainland China ties"
    detail: |
      来源为govinfo.gov托管的官方公法（Public Law 116-222）全文PDF，非扫描件、可直接curl
      抓取纯文本，详见SOURCES.md本节反爬突破记录，法案签署日期为2020年12月18日
      （原文"Approved December 18, 2020."，见quote）。WebSearch过程中另见到"2022年12月29日
      《综合拨款法案》将连续不可核查年限从3年缩短为2年"的说法，但本次未独立抓取该修正案
      原文逐字核实，故zh/en正文仍以HFCAA原始法条"3年"表述为准，2年修正说法仅记于此供
      后续核实，不作为已核实事实写入正文。
    sources:
      - title: "Holding Foreign Companies Accountable Act, Public Law 116-222（govinfo.gov官方公法全文PDF）"
        url: https://www.govinfo.gov/content/pkg/PLAW-116publ222/pdf/PLAW-116publ222.pdf
        accessed: 2026-08-24
    quote: "TRADING PROHIBITION AFTER 3 YEARS OF NON-INSPECTION ... a covered issuer has 3 consecutive non-inspection years, the Commission shall prohibit the securities of the covered issuer ... Approved December 18, 2020."
    confidence: high

  liquidity_risk_note:
    zh: "持续上市标准中做市商数量最低要求随所选子标准不同而有别：Nasdaq Capital Market（入门层级）三个可选子标准（权益/上市证券市值/净利润标准）均只需2家做市商；Nasdaq Global Select Market与Global Market的权益标准同样只需2家，但市值标准与总资产/营收标准则需4家。做市商数量下限越低，理论上流动性风险越高，尤以Capital Market层级的小型成长型公司为甚"
    en: "The minimum market-maker count required for continued listing varies by sub-standard: Nasdaq Capital Market's (entry-tier) three alternative sub-standards (Equity/Market Value of Listed Securities/Net Income) each require only 2 market makers; Global Select Market and Global Market's Equity Standard also requires only 2, but their Market Value Standard and Total Assets/Total Revenue Standard require 4. A lower market-maker floor is generally associated with higher liquidity risk, particularly for small growth companies on the Capital Market tier"
    detail: "该判断是从listing.boards已核实的量化上市门槛（Continued Listing Guide列示的做市商数量最低要求）反向推出的结构性信号，非独立的流动性风险专项统计或研报，与costs.implicit_costs_note的推理逻辑一致、引用同一份来源文档。"
    sources:
      - title: Nasdaq Continued Listing Guide（PDF）
        url: https://listingcenter.nasdaq.com/assets/continuedguide.pdf
        accessed: 2026-08-24
    quote: |
      For Nasdaq Global Select Market and Nasdaq Global Market Companies ... Market Makers 2 4 4
      For Nasdaq Capital Market Companies ... Market Makers 2 2 2
    confidence: medium

  regulatory_change_risk_note:
    zh: "纳斯达克上市规则处于持续修订状态：仅退市听证/上诉相关的Rule 5810/5815/5820就在2024-2026年间经历多轮SEC规则修改申请（如2024年拟修改上诉标准后撤回、2025年通过买价二次合规期与退市听证例外规则）；NSCC结算基金方法论、持续上市新增要求等亦在2026年内多次修订，反映美国证券市场监管规则处于常态化、高频次的动态调整中，而非一经制定长期不变"
    en: "Nasdaq's listing rules are under continuous revision: Rules 5810/5815/5820 (delisting hearings/appeals) alone went through multiple SEC rule-change filings in 2024-2026 (e.g. a 2024 proposal to change the appeal standard was later withdrawn; a 2025 change added a second bid-price compliance period and hearing-stay exceptions); NSCC's Clearing Fund methodology and new continued-listing requirements were also amended multiple times within 2026 — reflecting that U.S. securities market rules are subject to routine, high-frequency change rather than being fixed once adopted"
    detail: "该判断综合自本次研究过程中检索到的多份federalregister.gov官方转载SEC通知/命令（详见listing.delisting_process/suspension_resumption/delisting_transition_period与clearing.default_management各字段引用的具体文件），下方sources只列代表性的两份，属于对已核实事实的横向归纳，无独立于这些已引用文件之外的新增来源。"
    sources:
      - title: "SEC Notice of Filing of Proposed Rule Change To Amend Rule 5820（SR-NASDAQ-2024-037，与listing.delisting_process同一来源）"
        url: https://www.federalregister.gov/documents/2024/07/23/2024-16105/self-regulatory-organizations-the-nasdaq-stock-market-llc-notice-of-filing-of-proposed-rule-change
        accessed: 2026-08-24
      - title: "SEC Notice of Filing of Proposed Rule Change To Enhance NSCC's Clearing Fund Methodology（与clearing.default_management同一来源）"
        url: https://www.federalregister.gov/documents/2026/06/04/2026-11144/self-regulatory-organizations-national-securities-clearing-corporation-notice-of-filing-of-proposed
        accessed: 2026-08-24
    confidence: medium

