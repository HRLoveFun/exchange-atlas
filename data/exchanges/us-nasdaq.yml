        url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-17/title-17.xml?part=240&subject_group=ECFR64f52d737aea1ed"
        accessed: 2026-08-24
    quote: "§ 240.15l-1 Regulation best interest. ... A broker, dealer, or a natural person who is an associated person of a broker or dealer, when making a recommendation of any securities transaction or investment strategy involving securities (including account recommendations) to a retail customer, shall act in the best interest of the retail customer at the time the recommendation is made, without placing the financial or other interest of the broker, dealer, or natural person who is an associated person of a broker or dealer making the recommendation ahead of the interest of the retail customer."
