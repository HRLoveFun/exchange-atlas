    en: "Federal Customer Identification Program (CIP) rule: a broker-dealer must establish a written CIP and, at minimum, obtain each customer's name, date of birth (for an individual), address, and identification number before opening an account (a U.S. taxpayer ID for U.S. persons; for non-U.S. persons, a taxpayer ID, passport number and country of issuance, alien ID card number, or another government-issued document number)"
    detail: |
