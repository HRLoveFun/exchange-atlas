    zh: "场外市场（OTC market）——公司证券在退市听证/上诉程序进行期间或正式退市后转入OTC市场交易；若公司在此期间恢复达标（如通过反向股票分割使收盘价连续10个交易日达1美元以上），听证小组可裁定恢复其在纳斯达克的交易"
