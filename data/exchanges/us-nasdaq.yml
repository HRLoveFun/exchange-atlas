  delisting_process:
    zh: "三级流程：(1) Listing Qualifications Department（上市审核部门）认定公司未达上市标准后出具Staff Delisting Determination（职员退市决定，或视情形出具Public Reprimand Letter公开谴责函）；(2) 公司可请求Hearings Panel（听证小组，由非纳斯达克关联人士组成）就书面记录及口头听证进行复核并作出裁决；(3) 听证小组裁决可上诉至Nasdaq Listing and Hearing Review Council（上市与听证复核理事会），该理事会亦可依职权主动调取案件复核"
    en: "Three-tier process: (1) the Listing Qualifications Department issues a Staff Delisting Determination (or, in some cases, a Public Reprimand Letter) upon finding a company fails to meet listing standards; (2) the company may request review by a Hearings Panel (composed of persons unaffiliated with Nasdaq), which issues a decision after reviewing the written record and holding an oral hearing if requested; (3) the Panel's decision may be appealed to, or called for review by, the Nasdaq Listing and Hearing Review Council (the Listing Council)"
    detail: |
      来源是SEC就纳斯达克SR-NASDAQ-2024-037规则修改申请发布的官方通知（federalregister.gov
