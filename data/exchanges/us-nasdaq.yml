      调整等），本字段只摘取"违约"定义与基金机制本身，未逐项摘录各分项算法。该机制性质上
      与本项目其他交易所记录的"违约处置与风险共担"字段（如设有会员分摊损失的Loss
      Allocation机制）概念对应，但本次未找到NSCC具体损失分摊（向非违约会员摊派）触发条件
      与比例的逐字原文，故未写入正文，留待后续核实。
      ⚠️ 降级说明：本次抓取到的 .cache/us-nasdaq 下该 federalregister.gov 页面（SR-NSCC-2026-11144）
      实为反爬验证页（标题「Request Access」、reCAPTCHA 拦截），并非文档正文，无法逐字核验下列
      引文，故 confidence 由 high 降为 medium；原拟引用文字移入此处备查：The objective of a Member's
      Required Fund Deposit is to mitigate potential losses to NSCC associated with liquidating a
      Member's portfolio in the event NSCC ceases to act for that Member (hereinafter referred to as a
      "default"). Required Fund Deposits operate, individually, as the Member's margin, and the aggregate
      of all such Members' deposits is referred to, collectively, as the Clearing Fund, which operates as
      NSCC's default fund. NSCC would access the Clearing Fund should a defaulting Member's own Required
      Fund Deposit be insufficient to satisfy losses to NSCC caused by the liquidation of that Member's
      portfolio.
