    quote: "When the Listing Qualifications Department determines that a company does not meet the requirements to remain listed, the Listing Qualifications Department will issue a Staff Delisting Determination. ... Upon receipt of a Staff Delisting Determination or a Public Reprimand Letter, or when its application for initial listing is denied, a company may request that a Hearings Panel review the matter. ... After reviewing the written record and holding an oral hearing, if one is requested, a Hearings Panel will issue a decision, which is reviewed by the Nasdaq Listing and Hearing Review Council (the \"Listing Council\"), either on appeal or on its own initiative."
