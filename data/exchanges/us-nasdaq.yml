    en: "Competing market maker model: any number of member firms may register as market makers in the same security and compete on quotes (contrasted with NYSE's single Designated Market Maker, see us-nyse.yml)"
    detail: "术语见 schema/glossary.yml 的 `competing-market-maker` 条目。成为做市商须先是/申请成为Nasdaq会员，并经FINRA地区办公室（或非FINRA会员时由The NASDAQ Stock Market LLC自身）审核批准。"
    sources:
