      of Federal Regulations，17 CFR 242.201，Regulation SHO的官方法规文本），成功取得"10%"
      这一具体阈值的逐字条文。ecfr.gov面向用户的前端页面（如
      ecfr.gov/current/title-17/.../section-242.201）是纯JS渲染的SPA外壳，curl直接抓取
      拿不到正文；本次改用其公开的versioner API（无需鉴权，返回官方汇编XML/纯文本全文）
      成功绕过，详见SOURCES.md本节反爬突破记录。该API URL按eCFR"issue date"锁定版本
      （本次用2026-08-17，17 CFR Title 17当时的最新汇编日期），属于稳定可复现的历史快照
      引用方式，不会因未来法规再修订而失效或内容漂移。
    sources:
