    zh: "混合模式：中央电子限价订单簿连续撮合，叠加竞争性做市商制度——任意数量会员机构可就同一证券登记为做市商，以自有账户在 Nasdaq 显示报价买卖并彼此竞争"
    en: "Hybrid: a central electronic limit order book with continuous matching, plus a competing market maker model — any number of member firms may register as market makers in a security and display two-sided quotes for their own account in competition with one another"
    detail: "enum 依据既有 market_maker_scheme（竞争性做市商，confidence high）与 matching_principle（displayed / non-displayed 优先级，confidence high）的已核实 quote 综合判定：做市商为一等价格形成参与者，故归 hybrid。与 NYSE 同为 hybrid 但形态不同（竞争性多做市商 vs 单一 DMM）。"
    sources:
