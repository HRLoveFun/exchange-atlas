    en: "For specified continued-listing deficiencies such as the Bid Price Requirement, a company is ordinarily afforded a 180-day compliance period; if it notifies Nasdaq of an intent to cure via reverse stock split, a second 180-day period may be granted (up to 360 days combined). Only after these periods lapse without regaining compliance does Nasdaq issue a Staff Delisting Determination, triggering the hearing/appeal process described in listing.delisting_process"
