    zh: "清算对手方NSCC（National Securities Clearing Corporation）设有「结算基金」（Clearing Fund，即其违约基金）：每个会员按每日风险测算缴纳「应缴基金保证金」（Required Fund Deposit，个体层面即为该会员的保证金），全体会员保证金汇总构成结算基金；若某会员违约（NSCC终止为其行为）且该会员自身保证金不足以弥补清算其持仓所造成的损失，NSCC动用结算基金弥补差额"
    en: "NSCC (the CCP for Nasdaq trades) maintains a Clearing Fund functioning as its default fund: each member deposits a daily risk-based Required Fund Deposit (individually, the member's margin); the aggregate of all members' deposits is the Clearing Fund. If a Member defaults (NSCC ceases to act for it) and that member's own deposit is insufficient to cover losses from liquidating its portfolio, NSCC draws on the Clearing Fund to cover the shortfall"
