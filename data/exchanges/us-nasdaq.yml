    en: "No broad-based securities/financial transaction tax currently exists at the U.S. federal level; a historical federal Stock Transfer Tax was in effect from 1914 to 1966 before repeal. Its present-day successor is the SEC Section 31 transaction fee recorded under costs.regulatory_fees (a small fee funding SEC operations, not a broad-based transaction tax); various broad-based securities transaction tax proposals since have not been enacted"
