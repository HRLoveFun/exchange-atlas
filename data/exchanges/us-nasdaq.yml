# 纳斯达克证券交易所 The Nasdaq Stock Market (Nasdaq)
# 抓取来源见 PROJECT/SOURCES.md `us-nasdaq` 一节；原始页缓存于 .cache/us-nasdaq/
# source_lang: en——美国交易所无官方中文原文，按 ADR-013「无中选英」，英文是溯源锚点，
# zh 是翻译展示。
#
# group_id: nasdaq-group——The Nasdaq Stock Market LLC 是 Nasdaq, Inc. 旗下多家独立注册
# SEC 交易所实体之一：同集团美股姊妹现货交易所另有 Nasdaq BX、Nasdaq PSX、Nasdaq Texas；
# 期权市场另有 Nasdaq PHLX/ISE/GEMX/MRX/NOM；欧洲则是 2007 年收购 OMX 并入的
# Nasdaq Stockholm/Copenhagen/Helsinki/Iceland（北欧）与 Nasdaq Riga/Tallinn/Vilnius
# （波罗的海）——nasdaq.com/market-regulation 官方原文写明"Nasdaq operates securities
# markets in Stockholm, Copenhagen, Helsinki and Iceland"。与 NYSE Group 结构相同：各姊妹
# 实体独立注册、各自持有规则手册，不是同一法人实体内部的板块，本文件只记录 The Nasdaq
# Stock Market（美股现货主板，Tape C）本身，其余实体的规则不塞进本文件的 boards。
#
# 压测点（对照 NYSE，见 us-nyse.yml）：NYSE 是单一指定做市商（DMM）主持价格发现的
# 混合市场；Nasdaq 是任意数量会员机构可同时登记为做市商、彼此竞价的纯电子竞争性做市商
# 市场——同一法域下两种真实并存的做市商制度设计，见 market_structure.market_maker_scheme
# 与 schema/glossary.yml 的 `competing-market-maker` / `designated-market-maker` 两条对照。

