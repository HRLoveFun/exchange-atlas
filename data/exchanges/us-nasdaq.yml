        accessed: 2026-08-14
    quote: "Nasdaq features a price/time priority model where the execution logic is fair and transparent for all market participants. All displayed limit orders are treated equally and executed in the order in which they were received at the same price. Non-displayed shares are executed after displayed shares in the order in which they were received at that price."
