        url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-17/title-17.xml?part=242"
        accessed: 2026-08-24
    quote: "A trading center shall establish, maintain, and enforce written policies and procedures reasonably designed to: (i) Prevent the execution or display of a short sale order of a covered security at a price that is less than or equal to the current national best bid if the price of that covered security decreases by 10% or more from the covered security's closing price as determined by the listing market for the covered security as of the end of regular trading hours on the prior day; and (ii) Impose the requirements of paragraph (b)(1)(i) of this section for the remainder of the day and the following day..."
