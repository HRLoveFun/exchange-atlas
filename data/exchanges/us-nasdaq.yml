  suspension_resumption:
    zh: "公司收到Staff Delisting Determination（职员退市决定）后如及时提出Hearings Panel（听证小组）复核请求，通常将中止暂停交易/退市程序直至书面决定作出为止；但特定情形（如二次180天买价合规宽限期届满仍未达标）下，提出听证请求不再中止暂停，证券在听证程序期间转入场外市场（OTC）交易，听证小组仍保留在公司恢复达标后裁定其恢复纳斯达克交易的权限"
    en: "A timely request for Hearings Panel review of a Staff Delisting Determination ordinarily stays the suspension and delisting action pending a written Panel decision; however, in specified circumstances (e.g. a company that received a second 180-day bid-price compliance period and still failed to regain compliance), the stay does not apply, and the security trades in the OTC market pending the appeal — the Hearings Panel retains authority to reinstate Nasdaq trading if the company regains compliance during that period"
    detail: |
      两项细节分别来自同一份SEC命令的正文与脚注：正文确认"一般规则"是听证请求通常中止
      暂停（stay）；脚注说明该次规则修改所涉及的例外情形下证券改在OTC市场交易，且听证
      小组仍可在公司后续达标时裁定恢复纳斯达克交易（如通过反向股票分割恢复至少10个连续
      交易日收盘价达1美元）。      来源为federalregister.gov官方转载的SEC批准令（Order Granting
      Approval），而非listingcenter.nasdaq.com被拦截的Rulebook交互页，详见SOURCES.md本节
      反爬突破记录。
