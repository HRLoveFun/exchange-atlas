  capital_gains_tax:
    zh: "属于投资者个人所得税范畴，非交易所/市场层面收费。美国本土个人投资者：长期资本利得（持有超过1年）适用0%/15%/20%三档优惠税率（按应纳税所得额分档，2025纳税年度门槛见detail）；短期资本利得按累进的普通所得税税率征收。非美国居民境外投资者买卖美股产生的资本利得的具体待遇本次未找到可引用的官方原文逐字确认，故未写入zh/en正文"
    en: "A matter of investor personal income tax, not an exchange/market-level charge. For U.S. domestic individual investors: long-term capital gains (holdings over 1 year) are taxed at preferential 0%/15%/20% rates depending on taxable income (2025 tax-year thresholds in detail); short-term gains are taxed at ordinary progressive income tax rates. The specific treatment of nonresident alien investors' capital gains from trading U.S. stocks was not verified with a citable official source this session and is therefore omitted from the zh/en fields"
    detail: |
      2025纳税年度门槛（原文）：单身报税者应纳税所得额≤$48,350、已婚合并报税≤$96,700、
      户主报税≤$64,750适用0%档；超过该门槛且未超过$533,400（单身）/$600,050（已婚合并）/
      $566,700（户主）适用15%档；再往上适用20%档。另有合格小企业股票（Section 1202）、
      收藏品等最高28%及未收回1250条款利得最高25%的例外情形，本字段未逐条摘录。常见说法是
      非居民外国人买卖美股资本利得一般不属于美国联邦所得税应税范围（与dividend_withholding_tax
      记录的股息预扣待遇不同），但本次未独立抓取irs.gov对应页面逐字确认，按铁律不凭记忆
      填入，仅记于此供后续核实。
    sources:
      - title: "Topic no. 409, Capital gains and losses（irs.gov官网）"
        url: https://www.irs.gov/taxtopics/tc409
        accessed: 2026-08-24
    quote: "Net capital gains are taxed at different rates depending on overall taxable income, although some or all net capital gain may be taxed at 0%. For taxable years beginning in 2025, the tax rate on most net capital gain is no higher than 15% for most individuals. A capital gains rate of 0% applies if your taxable income is less than or equal to: $48,350 for single and married filing separately; $96,700 for married filing jointly and qualifying surviving spouse; and $64,750 for head of household. ... However, a capital gains rate of 20% applies to the extent that your taxable income exceeds the thresholds set for the 15% capital gain rate."
