  fx_risk_note:
    zh: "欧元区无资本管制，欧元自由浮动；因产品覆盖多币种计价（见overview.trading_currency），交易该所衍生品的汇率风险因具体产品计价货币而异，不能一概而论"
    en: "No capital controls in the Eurozone; the euro floats freely. Because products are denominated in multiple currencies (see overview.trading_currency), FX risk varies by the specific product's denomination currency rather than being uniform"
    confidence: low

  political_risk_note:
    zh: "德国/欧盟政治与法律环境总体稳定；主要地缘与政策风险来自欧盟/美国监管分化（如 EMIR 3.0 对第三国 CCP 的敞口限制、潜在欧盟金融业交易税）、制裁机制（如对俄制裁影响特定合约）以及欧元区能源/地缘冲击。Eurex Clearing 作为受 BaFin/ESMA 监管的 CCP，其稳健性亦受欧盟监管政策演变影响。"
    en: "The German/EU political and legal environment is broadly stable; principal geopolitical and policy risks stem from EU/US regulatory divergence (e.g. EMIR 3.0 limits on third-country CCP exposure, potential EU FTT), sanction regimes (e.g. Russia-related affecting specific contracts), and Eurozone energy/geopolitical shocks. Eurex Clearing, as a BaFin/ESMA-supervised CCP, is also exposed to evolving EU regulatory policy."
    sources:
      - title: Eurex Clearing — Licensing & supervision（官网，EMIR 监管框架）
        url: https://www.eurex.com/ec-en/find/about-us/licensing-supervision
        accessed: 2026-08-27
    confidence: medium

  liquidity_risk_note:
    zh: "流动性风险集中于产品：Eurex 是全球流动性最高的欧洲衍生品场所之一，旗舰指数/利率衍生品（EURO STOXX 50、DAX、Bund 等）深度极佳；但长尾与部分商品/单一股票合约流动性较浅，极端行情下冲击成本上升。做市商制度在一定程度上缓释该风险。"
    en: "Liquidity risk is product-concentrated: Eurex is among the most liquid venues for European derivatives globally, with very deep flagship index/rate contracts (EURO STOXX 50, DAX, Bund etc.); but tail and some commodity/single-stock contracts are thinner, with higher impact cost under stress. The market-maker scheme partly mitigates this."
    confidence: medium

  regulatory_change_risk_note:
    zh: "监管变更风险显著：作为欧盟 CCP，Eurex Clearing 持续受 EMIR 框架演进影响，最典型的是 EMIR 3.0（Regulation (EU) 2024/2987）对第三国 CCP 敞口与风险共担规则的修订；此外 MiFID II、欧洲市场基础设施规则与潜在欧盟金融业交易税均可能改变成本与参与结构。交易所端规则也经管理董事会/Eurex 规则定期修订。"
    en: "Regulatory-change risk is significant: as an EU CCP, Eurex Clearing is continuously affected by the evolution of the EMIR framework, most notably EMIR 3.0 (Regulation (EU) 2024/2987) revising third-country CCP exposure and risk-sharing rules; MiFID II, European market-infrastructure rules and a potential EU FTT could also reshape costs and access. Exchange-side rules are also periodically amended by the Management Board / Eurex rulebook."
    sources:
      - title: Eurex Clearing — Licensing & supervision（官网，EMIR 授权）
        url: https://www.eurex.com/ec-en/find/about-us/licensing-supervision
        accessed: 2026-08-27
    quote: "Eurex Clearing AG has been granted authorization as a Central Counterparty (CCP) under the European Market Infrastructure Regulation (EMIR) on 10 April 2014."
    confidence: medium

  enforcement_note:
    zh: "市场操纵与执法由交易所交易监视办公室（Trading Surveillance Office）一线监控持仓与异常，并由 BaFin/ESMA 依欧盟《市场滥用规制》(MAR) 实施监管执法。交易所规则要求对持仓限额合规进行核查与报送。"
    en: "Market-manipulation oversight is first-line monitored by the Trading Surveillance Office for positions and anomalies, with regulatory enforcement by BaFin/ESMA under the EU Market Abuse Regulation (MAR). The rules require verification and reporting of compliance with position limits."
    sources:
      - title: Exchange Rules of Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
    quote: "The Trading Surveillance Office examines all positions of an Admitted Company, including Agent Position Accounts, to verify compliance with the position limits."
    confidence: medium
