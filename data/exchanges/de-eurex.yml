# 欧洲期货交易所 Eurex（法律实体名 Eurex Deutschland）
# 抓取来源见 PROJECT/SOURCES.md `de-eurex` 一节；原始页缓存于 .cache/de-eurex/
# source_lang: en——按 ADR-013「无中选英」，官方英文版覆盖更全，是溯源锚点。
#
# ⚠️ 本文件是本项目第一个衍生品交易所样本（此前 cn-sse/hk-hkex/us-nyse/jp-jpx 均为
# 现货股票交易所）。taxonomy 的「六｜上市」章节假设的是「公司上市」范式（IPO、持续
# 信息披露、财务类退市……），这套范式在期货期权交易所不成立——这里没有公司上市，
# 只有「交易员/交易参与者准入」与「合约（产品）挂牌」两个概念，两者都不是
# taxonomy 现有字段能干净承接的。本文件对 listing 章节采用如实留空 + detail 说明
# 的处理方式，不强行往公司上市的框架里套，已记入 OPEN-QUESTIONS。
#
# v1.1 Batch 2（2026-08-27）补全：regulation / listing(6 项 N/A) / clearing(6 项) /
# participants / infrastructure / costs / risks 共 40 个目标字段全部落定为
# 「带出处引文的值」或「N/A + 理由」。

id: de-eurex
name_zh: 欧洲期货交易所
name_native: {de: "Eurex Deutschland", en: Eurex}
official_languages: [de, en]
source_lang: en
group_id: deutsche-boerse-group
region: europe
tier: standard

