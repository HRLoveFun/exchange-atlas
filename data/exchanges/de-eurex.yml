# ═══════════════════════════════════════════════
# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-27
    sources:
      - title: Exchange Rules of Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
      - title: Eurex Clearing — Licensing & supervision（官网）
        url: https://www.eurex.com/ec-en/find/about-us/licensing-supervision
        accessed: 2026-08-27
      - title: Free movement of capital — legal basis（欧盟委员会 PDF）
        url: https://commission.europa.eu/system/files/2020-06/120216-legal-basis-free-movement-capital_en.pdf
        accessed: 2026-08-27
    confidence: high

  regulator:
    zh: "黑森州最高监管机关（交易所监管机关，Exchange Supervisory Authority）——不是联邦金融监管局BaFin"
    en: "The competent highest state authority in the State of Hesse (\"Exchange Supervisory Authority\") — not the federal BaFin"
    detail: |
      德国交易所监管实行邦（州）级属地管辖，法兰克福所在的黑森州对Eurex Deutschland行使
      交易所监管职能；这与常识印象里"德国金融监管找BaFin"不完全一致——BaFin是联邦层面的
      金融业务行为监管机构，与交易所设立/运作的属地监管是两回事，本次未找到BaFin在
      Eurex具体监管职能中的官方原文表述，故本字段只写实测确认的黑森州机关，不臆测BaFin
      的角色边界。
    quote: "Supervision of the operations of Eurex Deutschland shall be the responsibility of the competent highest state authority in the State of Hesse (hereinafter \"Exchange Supervisory Authority\")."
    confidence: high

  self_regulatory_org:
    zh: "交易所理事会（Exchange Council），依据德国交易所法及黑森州交易所条例设立"
    en: "Exchange Council, established pursuant to the German Stock Exchange Act and the Exchange Regulation issued by the State of Hesse"
    quote: "Eurex Deutschland shall establish an Exchange Council pursuant to the German Stock Exchange Act and the Exchange Regulation (Börsenverordnung) issued by the State of Hesse."
    confidence: high

  clearing_regulator:
    zh: "Eurex Clearing AG 作为中央对手方（CCP）由德国联邦金融监管局 BaFin 监管（依据《德国银行法》），并依《欧洲市场基础设施规制》(EMIR) 于 2014 年 4 月 10 日获 CCP 授权；监督还包括德国央行与 ESMA 牵头的 EMIR 监管学院"
    en: "Eurex Clearing AG, as the central counterparty (CCP), is supervised by the German Federal Financial Supervisory Authority (BaFin) under the German Banking Act and was authorised as a CCP under the European Market Infrastructure Regulation (EMIR) on 10 April 2014; supervision also involves the Deutsche Bundesbank and the ESMA-led EMIR Supervisory College"
    sources:
      - title: Eurex Clearing — Licensing & supervision（官网）
        url: https://www.eurex.com/ec-en/find/about-us/licensing-supervision
        accessed: 2026-08-27
    quote: "Eurex Clearing AG ... licensed as a credit institution pursuant to the German Banking Act under supervision of the German Financial Supervisory Authority (BaFin – Bundesanstalt für Finanzdienstleistungsaufsicht) ／ Eurex Clearing AG has been granted authorization as a Central Counterparty (CCP) under the European Market Infrastructure Regulation (EMIR) on 10 April 2014."
    confidence: high

  core_laws:
    zh: "《德国交易所法》（Börsengesetz）"
    en: "German Stock Exchange Act (Börsengesetz)"
    quote: "pursuant to the German Stock Exchange Act and the Exchange Regulation (Börsenverordnung) issued by the State of Hesse"
    confidence: high

  foreign_ownership_limit:
    zh: "无明确外资持股/准入上限。Eurex 的准入对象是「获准公司」（Admitted Companies）与「交易员」（Exchange Traders）；交易所规则明确允许注册地在外国的获准公司参与交易（见 exchange_rules 原文「registered office abroad」「located outside the Federal Republic of Germany」），欧盟/欧洲经济区机构凭护照制度准入，第三国机构亦可作为获准公司被接纳。未检索到对外资持股比例的封顶条款。"
    en: "No explicit foreign-ownership / participation cap. Eurex admits 'Admitted Companies' and 'Exchange Traders'; the rules expressly contemplate Admitted Companies with their registered office abroad and Participant Trading Systems located outside Germany, so foreign entities are admissible. EU/EEA firms access via passport, and third-country firms may also be admitted. No statutory cap on foreign shareholding was found."
    sources:
      - title: Exchange Rules of Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
    quote: "Admitted Companies with their registered office abroad."
    confidence: medium

  capital_controls:
    zh: "无资本管制与外汇管制。Eurex 位于德国/欧盟单一市场，《欧盟运作条约》(TFEU) 第 63 条禁止一切资本与支付在成员国之间及成员国与第三国之间的流动限制；德国自 1990 年起已实现资本自由流动，近年仅塞浦路斯(2015)、希腊(2019)曾短暂实施资本管制，德国不在其列。"
    en: "No capital or FX controls. Eurex sits within the German/EU single market; Article 63 TFEU prohibits all restrictions on the movement of capital and payments between Member States and between Member States and third countries. Germany has had fully liberalised capital movements since 1990; only Cyprus (2015) and Greece (2019) briefly imposed controls among EU states."
    sources:
      - title: Free movement of capital — legal basis（欧盟委员会 PDF）
        url: https://commission.europa.eu/system/files/2020-06/120216-legal-basis-free-movement-capital_en.pdf
        accessed: 2026-08-27
      - title: Free movement of capital（欧洲议会事实简报）
        url: https://www.europarl.europa.eu/factsheets/en/sheet/39/free-movement-of-capital
        accessed: 2026-08-27
    quote: "all restrictions on the movement of capital between Member States and between Member States and third countries shall be prohibited. ／ The general principle about free movement of capital is defined in Art. 63 TFEU. ／ Capital movements were fully liberalised by the directive for the implementation of Article 67 of the Treaty in 1988, which scrapped all remaining restrictions on capital movements between Member State residents as of 1 July 1990. ／ Cyprus (2013) and Greece (2015) were forced to introduce capital controls in order to prevent an excessive outflow of capital. Cyprus removed all of the remaining restrictions in 2015 and Greece did so in 2019."
    verified: 2026-08-27
    confidence: high

  disclosure_requirements:
    zh: "衍生品交易所并无「上市公司信息披露」制度；与本所最接近的披露义务是持仓/头寸披露：交易监视办公室（Trading Surveillance Office）检视获准公司的全部持仓以核实是否符合持仓限额，并在最后交易日等时点要求报送客户头寸明细。"
    en: "A derivatives exchange has no 'corporate disclosure' regime; the closest obligation is position disclosure: the Trading Surveillance Office examines all positions of an Admitted Company to verify compliance with position limits and requires customer-position reporting at certain times (e.g. by 10 a.m. on the last Trading Day before expiry)."
    sources:
      - title: Exchange Rules of Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
    quote: "The Trading Surveillance Office examines all positions of an Admitted Company, including Agent Position Accounts, to verify compliance with the position limits. ／ On the last Trading Day before expiry of a Contract, these details shall be provided until 10 a.m. CET/CEST."
    verified: 2026-08-27
    confidence: high

  investor_protection:
    zh: "投资者保护主要通过中央对手方（CCP）机制实现：Eurex Clearing 作为 CCP 对每笔交易进行合约更替（novation），担保履约，并依 EMIR 对客户头寸实施隔离（segregation）与可移植性（portability）安排；违约时依违约处置瀑布优先用违约方资源，再动用共同违约基金。这是专业/机构市场的制度性保护，而非现货交易所式的散户赔偿基金。"
    en: "Investor protection is primarily delivered through the central counterparty (CCP) mechanism: Eurex Clearing, authorised as a CCP under EMIR, novates every trade, guarantees performance, and applies client-position segregation and portability under EMIR; on a member default the default waterfall uses the defaulter's resources first, then the mutual Default Fund. This is institutional/professional-market protection, not a retail investor-compensation fund."
    sources:
      - title: Eurex Clearing — Licensing & supervision（官网）
        url: https://www.eurex.com/ec-en/find/about-us/licensing-supervision
        accessed: 2026-08-27
      - title: Default Management Process（Eurex Clearing 官网 PDF）
        url: https://www.eurex.com/resource/blob/2784226/a66d966ca0842a54bb70c2a60821cc6b/data/presentation-default-management-process.pdf
        accessed: 2026-08-27
    quote: "Eurex Clearing AG has been granted authorization as a Central Counterparty (CCP) under the European Market Infrastructure Regulation (EMIR) on 10 April 2014."
    confidence: high

