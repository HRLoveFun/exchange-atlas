  market_data_levels:
    zh: "提供从最优档（Level 1）到完整订单簿深度（Level 2）及逐笔（tick-by-tick）的多档行情：T7 通过 EOBI（Enhanced Orderbook Interface，逐笔订单/报价）、EMDI（Enhanced Market Data Interface，订单簿深度）与 RDI（Reference Data Interface）等接口发布；历史与实时数据由 Deutsche Börse Market Data + Services 统一提供。"
    en: "Multiple market-data levels from top-of-book (Level 1) to full order-book depth (Level 2) and tick-by-tick: T7 disseminates via EOBI (Enhanced Orderbook Interface, every visible order/quote), EMDI (Enhanced Market Data Interface, order-book depth) and RDI (Reference Data Interface); real-time and historical data are unified under Deutsche Börse Market Data + Services."
    sources:
      - title: Insights into Trading System Dynamics — Deutsche Börse’s T7（官网 PDF）
        url: https://www.eurex.com/resource/blob/48918/4f724c9415d2731cfb27295db6269c9c/data/presentation-insights-into-trading-system-dynamics.pdf
        accessed: 2026-08-27
      - title: T7 System（Eurex官网）
        url: https://www.eurex.com/ex-en/support/technology/t7
        accessed: 2026-08-27
    quote: "The T7 trading system is used by multiple derivatives and cash markets. For derivatives trading, this includes: Eurex"
    confidence: medium

  data_latency:
    zh: "T7 定位为超低时延（ultra-low latency）交易平台；会员可经共址（Co-location，Colo 2.0）等低时延接入方式就近下单，并提供高精度时间戳供时延测算。具体时延数值随产品/连接而异，Eurex 通过公开时延统计与高精度时间戳文件透明披露。"
    en: "T7 is positioned as an ultra-low-latency trading platform; members can connect via low-latency co-location (Colo 2.0) and other proximal access, with high-precision timestamps for latency measurement. Exact latency figures vary by product/connection and are disclosed transparently via published latency statistics and high-precision timestamp files."
    sources:
      - title: T7 System（Eurex官网）
        url: https://www.eurex.com/ex-en/support/technology/t7
        accessed: 2026-08-27
    quote: "Cutting-edge technology delivers ultra-low latency, robustness and safe handling of very high throughput. ／ by absolut low latency-affin trading participants with the latest technology (e.g. ETI, CoLo 2.0 and Partition Specific Gateways)"
    verified: 2026-08-27
    confidence: high

  data_pricing_model:
    zh: "行情与历史数据属德意志交易所集团的数据业务（Deutsche Börse Market Data + Services），为付费商业产品：实时/历史/分析/参考数据通过 Data Shop、Marketplace 等渠道按产品订阅与下载收费，并非免费公开。"
    en: "Market and historical data are part of Deutsche Börse Group's data business (Deutsche Börse Market Data + Services) and are paid commercial products: real-time/historical/analytics/reference data are licensed via the Data Shop, Marketplace and similar channels on a per-product subscription/download basis, not free public feeds."
    sources:
      - title: Data（Eurex官网）
        url: https://www.eurex.com/ex-en/data
        accessed: 2026-08-27
      - title: Deutsche Börse Market Data + Services — Historical Data
        url: https://www.mds.deutsche-boerse.com/mds-en/historical-data
        accessed: 2026-08-27
    quote: "Deutsche Börse Market Data + Services"
    confidence: medium

  historical_data_availability:
    zh: "历史数据可得性高：Deutsche Börse Market Data + Services 提供源自交易所的 Eurex 高质量历史行情（含逐笔 EOBI、订单簿 EMDI、参考数据和每日统计/理论价格数据），可通过 Eurex File Service 与 Data Shop 订购下载。"
    en: "Historical data is readily available: Deutsche Börse Market Data + Services offers high-quality Eurex historical market data sourced directly from the exchange (including tick-by-tick EOBI, order-book EMDI, reference data, and daily statistics/theoretical-price data), orderable via the Eurex File Service and Data Shop."
    sources:
      - title: Deutsche Börse Market Data + Services — Historical Data
        url: https://www.mds.deutsche-boerse.com/mds-en/historical-data
        accessed: 2026-08-27
    quote: "high-quality historical market data from Europe’s leading trading systems Xetra and Eurex as well as Deutsche Börse and STOXX indices – directly from the source. ／ The Eurex File Service provides theoretical price data for Eurex products."
    confidence: high

  trading_system_name:
    zh: "T7——由 Deutsche Börse Group 开发的交易系统架构，Eurex、EEX、Xetra 等多个市场共用"
    en: "T7 — the trading system architecture developed by Deutsche Börse Group, shared by Eurex, EEX, Xetra and other markets"
    sources:
      - title: T7 System（Eurex官网）
        url: https://www.eurex.com/ex-en/support/technology/t7
        accessed: 2026-08-27
    quote: "the T7 trading architecture, developed by Deutsche Börse Group, is set to revolutionize the way traders and investors access market opportunities worldwide."
    confidence: high

  access_methods:
    zh: "接入方式多元：纯人工交易可用 Eurex Trader GUI；低时延/程序化交易可通过 ETI（Enhanced Trading Interface）、FIX LF、共址（Colo 2.0）、Partition Specific Gateways 等接入；另有 T7 Entry Service (TES) 用于 off-book 录入。"
    en: "Multiple access methods: manual trading via the Eurex Trader GUI; low-latency/algorithmic trading via ETI (Enhanced Trading Interface), FIX LF, co-location (Colo 2.0) and Partition Specific Gateways; plus the T7 Entry Service (TES) for off-book entry."
    sources:
      - title: T7 System（Eurex官网）
        url: https://www.eurex.com/ex-en/support/technology/t7
        accessed: 2026-08-27
    quote: "The T7 platform can be used by minor trading participants which trade purely manually (Eurex Trader GUI) and by absolut low latency-affin trading participants with the latest technology (e.g. ETI, CoLo 2.0 and Partition Specific Gateways)"
    confidence: high

  major_outage_history:
    zh: "本次会话未能从一手官方来源核实到具体的重大系统故障事件时间线（已知 Eurex 历史上曾发生技术故障，但缺乏可逐字引用的官方原文，故不臆造）。Eurex 设有事故沟通与恢复机制（生产新闻板 production newsboard、Emergency Playbook、市场状态指示），用于事件期间的披露与复牌。"
    en: "This session could not verify a specific major-outage timeline from a primary official source (Eurex has experienced technical incidents historically, but no verbatim official text was retrieved, so none is asserted). Eurex operates incident-communication and recovery mechanisms (production newsboard, Emergency Playbook, market-status indicator) for disclosure and re-opening during incidents."
    detail: "待人工提供权威事故记录（如 BaFin/ESMA 报告或 Eurex 官方事后说明）后再核实，已记入 OPEN-QUESTIONS（de-eurex）。"
