# ═══════════════════════════════════════════════
participants:
  _meta:
    verified: 2026-08-27
    confidence: medium
    sources:
      - title: Admission Regulations for Exchange Traders at Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/3354190/02b3ede980a95392ae1001a592930a81/data/2025-07-07_eurex_d_zulassungsordnung_en.pdf
        accessed: 2026-08-27
      - title: Exchange Rules of Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
      - title: The Market Place（Eurex官网，参与者列表）
        url: https://www.eurex.com/ex-en/find/about-us/the-market-place
        accessed: 2026-08-27

  investor_structure:
    zh: "以机构与专业客户为主：参与方包括银行、资产管理公司、对冲基金、自营交易商及通过其开户的终端客户；Eurex 是面向专业/批发市场的衍生品交易所，散户经会员（经纪商）间接参与。本所未逐产品公布投资者结构明细，本次未核实具体占比。"
    en: "Institution- and professional-client dominated: participants are banks, asset managers, hedge funds, proprietary trading firms and their clients; Eurex is a professional/wholesale derivatives market, with retail accessing indirectly via member brokers. Per-product investor-structure breakdowns are not published and were not individually verified this session."
    detail: "这是专业衍生品市场的结构性特征，非某条具体规则的引文；confidence 标 medium。"
    confidence: medium

  account_opening_requirements:
    zh: "终端客户不直接向 Eurex 开户，而是向获准公司（会员/经纪商）开立交易与清算账户；要成为可参与 Eurex 交易的机构，须先成为「获准公司」（Admitted Company）并安排通过「交易员资格考试」（Exchange Trader Examination）的交易员代表其下单。"
    en: "End clients do not open accounts directly with Eurex but with Admitted Companies (member brokers); to trade, a firm must first become an 'Admitted Company' and have Exchange Traders who passed the Exchange Trader Examination placing orders on its behalf."
    sources:
      - title: Admission Regulations for Exchange Traders at Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/3354190/02b3ede980a95392ae1001a592930a81/data/2025-07-07_eurex_d_zulassungsordnung_en.pdf
        accessed: 2026-08-27
    quote: "Persons who shall be authorized to trade on behalf of a company admitted to exchange trading."
    confidence: medium

  suitability_management:
    zh: "交易所层面的适当性门槛体现在「交易员资格考试」（Exchange Trader Examination）对代表获准公司下单人员的资质要求；面向终端客户的投资者适当性由会员依 MiFID II 自行履行，Eurex 规则本身不直接规定零售客户适当性。"
    en: "At exchange level, the suitability gate is the Exchange Trader Examination requiring qualified personnel to trade on behalf of Admitted Companies; client-facing suitability is performed by members under MiFID II, and Eurex's own rules do not prescribe retail-client suitability."
    sources:
      - title: Admission Regulations for Exchange Traders at Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/3354190/02b3ede980a95392ae1001a592930a81/data/2025-07-07_eurex_d_zulassungsordnung_en.pdf
        accessed: 2026-08-27
    confidence: medium

  foreign_access_channel:
    zh: "外国机构可作为「获准公司」直接参与：交易所规则明确允许注册地在外国的获准公司、及其位于德国境外的参与交易系统/输入设备参与交易。欧盟/欧洲经济区机构凭护照制度准入；第三国机构亦可被接纳为获准公司或通过本地会员（ sponsored access / 清算会员）间接参与。"
    en: "Foreign firms may participate directly as 'Admitted Companies': the rules expressly allow Admitted Companies with their registered office abroad and Participant Trading Systems/Input Devices located outside Germany. EU/EEA firms access via passport; third-country firms may also be admitted or participate indirectly via local members (sponsored access / clearing members)."
    sources:
      - title: Exchange Rules of Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
    quote: "Admitted Companies with their registered office abroad. ／ Each Admitted Company which participates directly in exchange trading at Eurex Deutschland through its Participant Trading System or Input Device located outside the Federal Republic of Germany"
    confidence: high

  membership_structure:
    zh: "分「获准公司」（Admitted Companies）与「交易员」（Exchange Traders）两层：公司须获准参与交易所交易，个人交易员须通过资格考试（Exchange Trader Examination）后方可代表获准公司下单"
    en: "Two-tier structure: \"Admitted Companies\" must be admitted to exchange trading, and individual \"Exchange Traders\" must pass an Exchange Trader Examination before placing orders on behalf of an Admitted Company"
    sources:
      - title: Admission Regulations for Exchange Traders at Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/3354190/02b3ede980a95392ae1001a592930a81/data/2025-07-07_eurex_d_zulassungsordnung_en.pdf
        accessed: 2026-08-27
    confidence: medium

  broker_landscape:
    zh: "交易经获准公司（银行、券商、自营交易商等充当清算会员/交易参与者）中介；Eurex 公布参与者列表，涵盖 Exchange Participants、各类 Market Maker、Brokers、Sponsored Access 等。具体经纪商排名/市占未逐家核实，本所不发布经纪商排行榜。"
    en: "Trading is intermediated by Admitted Companies (banks, brokers, proprietary trading firms acting as clearing members / trading participants); Eurex publishes participant lists covering Exchange Participants, various Market Makers, Brokers and Sponsored Access. A per-broker ranking/market-share league table is not published and was not individually verified."
    sources:
      - title: The Market Place（Eurex官网，参与者列表导航）
        url: https://www.eurex.com/ex-en/find/about-us/the-market-place
        accessed: 2026-08-27
    quote: "Participant lists Exchange Participants Market Maker Futures Market Maker Options Independent Software Vendors 3rd Party Information Provider Market data vendors Brokers Sponsored Access"
    confidence: medium

