  initial_margin_practice:
    zh: "Eurex Clearing Prisma：基于会员整体持仓组合计算保证金的方法（而非逐笔/逐品种），可反映对冲与品种间相关性带来的风险抵消效应，覆盖场内与场外产品"
    en: "Eurex Clearing Prisma: a portfolio-based margin methodology (rather than trade-by-trade or product-by-product) that accounts for hedging and cross-correlation effects, covering both ETD and OTC products"
    sources:
      - title: Margining Process（Eurex官网）
        url: https://www.eurex.com/ec-en/services/margining/margining-process
        accessed: 2026-08-27
    quote: "Eurex Clearing Prisma, a robust portfolio-based risk management method has been introduced for all ETD and OTC products. The Eurex Clearing Prisma method is based on the view of each member's entire portfolio and has the advantage of accounting for hedging and cross-correlation effects through determining the margin requirement on a portfolio level as opposed to a product-by-product view."
    confidence: high

  maintenance_margin_practice:
    zh: "Eurex 不另设与初始保证金分离的「维持保证金阈值」（不同于美股 Reg T 模式）；其做法是以 Eurex Clearing Prisma 计算的初始保证金要求为底线，按持仓价格变动实时（real-time）重算并随时追加保证金（intraday margin calls），叠加按日盯市的变动保证金（variation margin）。即「维持」通过实时重估初始保证金要求实现，而非单独一条维持线。"
    en: "Eurex does not use a separate 'maintenance margin' threshold distinct from initial margin (unlike the U.S. Reg T model); instead the Initial Margin requirement (Prisma) is the baseline, recalculated in real time as positions/prices change with intraday margin calls, plus daily variation-margin settlement. 'Maintenance' is achieved by continuously re-measuring the Initial Margin requirement."
    sources:
      - title: Margining Process（Eurex官网）
        url: https://www.eurex.com/ec-en/services/margining/margining-process
        accessed: 2026-08-27
    quote: "Eurex Clearing calculates real-time the margin requirements for derivatives products by any position or price change. Margin information for equity and fixed income cash products are provided every ten minutes."
    confidence: high

  mark_to_market_frequency:
    zh: "按日盯市（每日盈亏结算）通过变动保证金（variation margin）实现；同时保证金要求在交易时段内按持仓/价格变动实时重算，股票与固定收益现货产品的保证金信息每十分钟提供一次"
    en: "Daily mark-to-market via variation margin (daily settlement of profits and losses); in addition, margin requirements are recalculated in real time as positions/prices change during the trading session, with margin information for equity and fixed-income cash products provided every ten minutes"
    sources:
      - title: Margining Process（Eurex官网）
        url: https://www.eurex.com/ec-en/services/margining/margining-process
        accessed: 2026-08-27
    quote: "Variation margin (i.e. daily settlement of profits and losses) as well as premiums on traditional options and futures on options must be paid in cash. ／ Eurex Clearing calculates real-time the margin requirements for derivatives products by any position or price change."
    confidence: high

  delivery_method:
    enum: either
    zh: "视产品而定：实物交割为默认方式（如部分利率/债券期货），管理董事会可决定排除实物交割改为现金结算"
    en: "Depends on the product: physical delivery is the default for some products (e.g. certain interest-rate/bond futures); the Management Board may rule out physical delivery in favor of cash settlement"
    detail: "这是与四家现货标杆（均填na）最实质性的字段差异——衍生品交易所是本项目第一次真正用上delivery_method这个字段。"
    sources:
      - title: Exchange Rules（官网英文版PDF）§ 相关条款（物理交割排除与现金结算条款）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
    quote: "In case of an exclusion of physical delivery pursuant to Clause 1 (iii) or Clause 2 (ii), a cash settlement of the relevant Contracts shall take place."
    confidence: high

  last_trading_day_rule:
    zh: "最后交易日与到期/最终结算日按各合约的产品说明书（Contract Specifications）逐一规定，由管理董事会确定，无全市场统一规则。以最具代表性的 EURO STOXX 50® 指数期权为例：最后交易日即为最终结算日，最终结算日为每个到期月的第三个周五（若为交易日；否则为该日之前最近的交易日）。期货的最后交易日则通常为交割/结算日前一营业日。"
    en: "The last trading day and expiry/final settlement are defined per contract in the Contract Specifications and set by the Management Board; there is no single exchange-wide rule. For the flagship EURO STOXX 50® Index Options, the last trading day is the final settlement day, which is the third Friday of each expiration month (or the preceding exchange day if that is not an exchange day). For futures the last trading day is typically a business day before delivery/settlement."
    sources:
      - title: EURO STOXX 50® Index Options（产品说明书页）
        url: https://www.eurex.com/ex-en/markets/idx/stx/euro-stoxx-50-derivatives/products/EURO-STOXX-50-Index-Options-69660
        accessed: 2026-08-27
    quote: "Last trading day is the final settlement day. Final settlement day is the third Friday of each expiration month if this is an exchange day; otherwise the exchange day immediately preceding that day. ／ EURO STOXX 50® Index Options"
    verified: 2026-08-27
    confidence: high

  default_management:
    zh: "违约处置采用多层「违约瀑布」（Default Waterfall / Lines of Defense）：先动用违约结算会员自身的保证金抵押与违约基金出资；不足时依次动用 Eurex Clearing 的自有「Skin in the Game」出资、非违约会员的违约基金出资（含「Second Skin in the Game」）及 Eurex Clearing 剩余资本。设有单一、跨所有资产类别的联合违约基金。"
    en: "Default management uses a multi-level 'Default Waterfall' (Lines of Defense): first the defaulter's own margin collateral and Default Fund contribution are used; if insufficient, Eurex Clearing's own 'Skin in the Game', then non-defaulting members' Default Fund contributions (including 'Second Skin in the Game') and Eurex Clearing's remaining capital follow. There is one joint Default Fund covering all asset classes."
    sources:
      - title: Default Management Process（Eurex Clearing 官网 PDF）
        url: https://www.eurex.com/resource/blob/2784226/a66d966ca0842a54bb70c2a60821cc6b/data/presentation-default-management-process.pdf
        accessed: 2026-08-27
    quote: "Eurex Clearing provides a multi-level security system ／ First the collateral and the Default Fund contribution of the member in default are utilized. ／ After the defaulter’s contributions are exhausted, an assigned dedicated amount of Eurex Clearing, a so-called 'Skin in the Game', is applied, before non-defaulting clearing members’ Default Fund contributions, a 'Second Skin in the Game' and remaining capital of Eurex Clearing are used."
    confidence: high

