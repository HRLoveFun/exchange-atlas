# 十一｜交易成本与税费
# ═══════════════════════════════════════════════
costs:
  _meta:
    verified: 2026-08-27
    confidence: medium
    sources:
      - title: Fee Regulations for Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/311122/413cca981529493937c4c381408291e7/data/2022_12_01_eurex_d_gebuehrenordnung_en.pdf
        accessed: 2026-08-27
      - title: Price List of Eurex Clearing AG（官网 PDF）
        url: https://www.eurex.com/resource/blob/46180/1f489f16fe6f64dfb49d56cdf0d1d4be/data/2026_08_17_ecag_price_list_en.pdf
        accessed: 2026-08-27
      - title: Transaction fees（Eurex官网）
        url: https://www.eurex.com/ex-en/trade/transaction-fees
        accessed: 2026-08-27

  commission_structure:
    zh: "交易所不规定经纪商对客户收取的佣金；Eurex 自身按合约收取交易/清算费（见 exchange_fees、clearing_fees），经纪佣金由会员（银行/券商）与客户自行约定。此外 Eurex 对做市商与特定产品设有费用减免/返利（rebates）。"
    en: "The exchange does not set broker-to-client commissions; Eurex itself charges per-contract trading/clearing fees (see exchange_fees, clearing_fees), while broker commissions are negotiated between members (banks/brokers) and their clients. Eurex also offers fee reductions/rebates for market makers and selected products."
    sources:
      - title: Transaction fees（Eurex官网）
        url: https://www.eurex.com/ex-en/trade/transaction-fees
        accessed: 2026-08-27
    quote: "All transaction fees and applicable rebates are outlined in the Price List of Eurex Clearing AG (chapter 3)."
    confidence: medium

  exchange_fees:
    zh: "按三类收费：交易参与准入费、交易参与年费（由管理董事会确定）、交易员资格考试费；另有成交撤销/更正申请费每笔500欧元"
    en: "Three fee categories: admission fee, annual participation fee (set by the Management Board), and Exchange Trader examination fee; a separate EUR 500 fee applies per cancellation/correction application"
    quote: "Fees are levied for 1. admission to participation in exchange trading, 2. participation in exchange trading, and 3. participation in the Exchange trader examination. ... This fee shall amount to EUR 500 per application."
    confidence: high

  clearing_fees:
    zh: "Eurex Clearing 对衍生品交易的撮合/登记收取交易与清算费，按「每合约标准费」（standard fee per contract）计费，具体费率按产品/产品类别列于《Eurex Clearing AG 价目表》(Price List) 第 3 章；部分产品（如股票总回报期货）按合约价值百分比计费。"
    en: "Eurex Clearing charges trading and clearing fees for the matching/registration of derivatives transactions, billed as a 'standard fee per contract', with rates per product/product class set out in chapter 3 of the Price List of Eurex Clearing AG; some products (e.g. Equity Total Return Futures) are charged as a percentage of contract value."
    sources:
      - title: Price List of Eurex Clearing AG（官网 PDF）
        url: https://www.eurex.com/resource/blob/46180/1f489f16fe6f64dfb49d56cdf0d1d4be/data/2026_08_17_ecag_price_list_en.pdf
        accessed: 2026-08-27
    quote: "For transactions executed via the order book on the Eurex Exchange or transactions executed off-book and entered either via Eurex EnLight or via the Eurex T7 Entry Service (TES), a standard fee per contract applies as listed in the following tables."
    confidence: high

  regulatory_fees:
    zh: "Eurex Deutschland 的费用由《费用条例》(Fee Regulations) 这一公法性质的收费目录规定（准入费、年费、考试费等，由交易所理事会/管理董事会确定），本身即具监管收费属性；本次未在官方价目表中识别到单独的「政府监管征费」（如按笔征收的监管机构费）。衍生品交易亦不受德国金融业交易税（Finanztransaktionssteuer）覆盖（见 financial_transaction_tax）。"
    en: "Eurex Deutschland's fees are set out in its public-law Fee Regulations (admission, annual, examination fees, determined by the Exchange Council/Management Board), which are inherently regulatory in nature; no separate per-trade government 'regulatory levy' was identified in the official fee schedule. Derivatives trading is also outside the scope of any German financial transaction tax (see financial_transaction_tax)."
    sources:
      - title: Fee Regulations for Eurex Deutschland（官网英文版PDF）
        url: https://www.eurex.com/resource/blob/311122/413cca981529493937c4c381408291e7/data/2022_12_01_eurex_d_gebuehrenordnung_en.pdf
        accessed: 2026-08-27
    quote: "Fee Regulations for Eurex Deutschland"
    confidence: medium

  stamp_duty:
    zh: "N/A — 德国对衍生品交易不征收印花税（英国式的股票印花税/荷兰式转让税不适用于场内衍生品），衍生品本身亦不发生证券过户印花税。"
    en: "N/A — Germany does not levy stamp duty on derivatives trading (the UK-style share stamp duty / Dutch-style transfer tax does not apply to on-exchange derivatives), and derivatives do not involve a stampable securities transfer."
    confidence: medium

  financial_transaction_tax:
    zh: "无金融业交易税适用于 Eurex 衍生品：欧盟金融业交易税（EU FTT）提案至今未生效；德国亦未单独立法对衍生品征收交易税。少数标的股票可能适用德国《交易所 turnover 税》(Börsenumsatzsteuer)，但该税不延伸至在 Eurex 交易的衍生品合约本身。具体适用性本次未逐条核实，已记入 OPEN-QUESTIONS。"
    en: "No financial transaction tax applies to Eurex derivatives: the EU FTT proposal is not in force, and Germany has not enacted a standalone transaction tax on derivatives. A few underlying equities may be subject to the German stock-exchange turnover tax (Börsenumsatzsteuer), but that does not extend to the derivative contracts traded on Eurex. Exact applicability was not individually verified this session (see OPEN-QUESTIONS)."
    confidence: medium

  capital_gains_tax:
    zh: "Eurex 不征收资本利得税；资本利得税是投资者所在税域的投资者层面税种（德国税务居民私人生意通常按 25% 的 Abgeltungsteuer 计），并非交易所收取的费用。"
    en: "Eurex does not levy capital gains tax; any capital gains tax is an investor-level tax in the investor's jurisdiction (German tax residents are generally subject to the 25% Abgeltungsteuer on private gains), not an exchange fee."
    confidence: medium

  dividend_withholding_tax:
    zh: "N/A — 衍生品（期货/期权）本身不支付股息，交易所层面不存在股息预扣税；仅合约标的股票可能涉及发行方所在国的股息预扣，但与本所交易机制无关。"
    en: "N/A — Derivatives (futures/options) do not pay dividends, so there is no dividend withholding tax at the exchange level; only the underlying shares may be subject to a source-country withholding tax, which is unrelated to Eurex's trading mechanism."
    confidence: medium

  implicit_costs_note:
    zh: "隐性成本主要表现为买卖价差与冲击成本：Eurex 旗舰合约（DAX、EURO STOXX 50 期货/期权）流动性极高、价差很薄；长尾/小众合约流动性较浅、价差更宽。受监管做市商（Regulated Market Maker）制度持续提供双边报价以支撑流动性，缓解隐性成本。"
    en: "Implicit costs are mainly bid-ask spreads and market impact: flagship Eurex contracts (DAX, EURO STOXX 50 futures/options) are extremely liquid with tight spreads, while tail/niche contracts are thinner with wider spreads. The Regulated Market Maker scheme continuously supplies two-way quotes to support liquidity and mitigate implicit costs."
    sources:
      - title: Exchange Rules（官网英文版PDF）§48-49（做市商义务）
        url: https://www.eurex.com/resource/blob/334918/a72a2163fa0bb8fac8d6c710e244bfd8/data/2026_07_07_eurex_d_boersenordnung_en.pdf
        accessed: 2026-08-27
    quote: "the Exchange Traders acting on behalf of the Regulated Market Maker are required to continuously enter binding Quotes in at least one Derivative and during 50% of the daily Trading Hours on a monthly average."
    confidence: medium

