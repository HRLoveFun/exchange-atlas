# 瑞士证券交易所 SIX Swiss Exchange（法律实体名 SIX Swiss Exchange AG）
# 抓取来源见 PROJECT/SOURCES.md `ch-six` 一节；原始页缓存于 .cache/ch-six/
# source_lang: en——Trading Rules §26「Binding nature」原文明确：规则同时以德/法/英三种
# 语言发布，三者不一致时以德文本为准（"The German version alone of the Trading Rules...
# is binding in the event of inconsistencies between the German, French and English
# versions."）。本文件仍选英文为 source_lang（按 ADR-013「无中选英」，且本所英文版规则
# 文件覆盖完整、可直接摘引），但这与 Eurex 的情况本质相同：德文法律上优先，英文是官方
# 发布但非终局的语言版本，不是普通翻译展示，已在 regulation 章节如实记录这层关系。
#
# ⚠️ 瑞士不是欧盟成员国，SIX 不直接适用 MiFID II，监管框架是 FINMA + 瑞士《金融市场基础设施
# 法》（FinMIA/FMIA）体系，与项目里已有的欧盟成员国交易所（如未来可能收录的 uk-lse 脱欧后
# 情况不同、de-xetra 直接受 MiFID II 约束）构成有意义的对照点。欧盟委员会先后两次发布《实施
# 决定》认定瑞士交易所与MiFID II「等效」——(EU) 2017/2441（2017-12-21通过，有效期至2018-12-31）
# 与 (EU) 2018/2047（2018-12-20通过，延长至2019-06-30）——此后未再续期，等效认定自2019-07-01
# 起失效；瑞士随即启动对欧盟的「交易所基础设施保护措施」反制，已于2024-01-01转入FinMIA正式
# 立法，2025-01-29瑞士联邦委员会决定自2025-05-01起将欧盟从保护措施名单移除。完整时间线已于
# 2026-08-21逐条核实欧盟官方Implementing Decision原文（eur-lex.europa.eu）与瑞士联邦财政部
# 国际金融事务秘书处SIF官方说明页，写入 risks.regulatory_change_risk_note，confidence: high。
#
# ⚠️ SIX Group 除本所外，另有两类值得注意的姊妹实体：(1) SDX Trading AG——2021年由 FINMA
# 批准的独立数字资产交易所法人（与本所同为 FINMA "Authorised Swiss Stock Exchanges" 名录
# 上的两个交易所之一，另一为不属于本集团的 BX Swiss AG）；(2) BME Exchange（西班牙交易所
# 集团，2020年并入 SIX Group）——本所官网多处将 SIX Swiss Exchange 与 BME Exchange 的运行
# 数据合并披露。两者均是"同集团下其他独立交易所实体"，故设 group_id，boards 字段仍只记录
# 本法律实体（SIX Swiss Exchange AG）自身的板块体系。

