# ═══════════════════════════════════════════════
# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-16
    sources:
      - title: Monitoring and Regulation（SIX集团官网，监管架构说明页）
        url: https://www.six-group.com/en/company/governance/monitoring-and-regulation.html
        accessed: 2026-08-16
    confidence: high

  regulator:
    zh: "瑞士金融市场监管局（FINMA）——终局监管权；另有瑞士国家银行（SNB）对系统重要性基础设施（含SIX x-clear）的监测"
    en: "Swiss Financial Market Supervisory Authority (FINMA) — ultimate supervisory authority; the Swiss National Bank (SNB) additionally monitors systemically important infrastructure (including SIX x-clear)"
    detail: |
      监管为三层结构：(1) SNB监测系统重要性法人实体（SIC、SECOM、SIX x-clear）；(2) FINMA对
      从事证券交易与结算的全部SIX实体行使直接监管；(3) 自律监管由SIX Exchange Regulation
      （见self_regulatory_org）承担。三层并存、职责不同，不是单一监管机构的简单对照。
    quote: "All entities of SIX that are engaged in securities trading and securities settlement are subject to the direct supervision of FINMA. ... The legal framework is provided by the Federal Act on Financial Market Infrastructures and Market Conduct in Securities and Derivatives Trading (FinMIA). Ultimate supervisory authority lies with the Swiss Financial Market Supervisory Authority (FINMA)."
    confidence: high

  self_regulatory_org:
    zh: "SIX Exchange Regulation（SER）——依《证券交易法》自律监管授权设立的独立实体，与SIX集团运营业务分离，直接向SIX董事会主席报告"
    en: "SIX Exchange Regulation (SER) — an independent entity established under the self-regulatory mandate of the Stock Exchange Act, segregated from SIX's operational business and reporting directly to the Chairman of the Board of Directors of SIX"
    detail: "SER法律上是独立法人（SIX Exchange Regulation AG，ser-ag.com为其独立域名），下设Regulatory Board（制定规则）、Surveillance & Enforcement（监督参与者/交易员）、Listing & Enforcement（监督发行人）、Sanction Commission/Appeals Board/Board of Arbitration（裁决），职权三分。"
    sources:
      - title: We regulate the swiss stock exchange（SER官网关于页）
        url: https://www.ser-ag.com/en/about.html
        accessed: 2026-08-16
    quote: "On the basis of the self-regulatory mandate prescribed under the Stock Exchange Act, SIX performs regulatory functions in stock market trading and the admission of securities as well as associated follow-up obligations. The Exchange Regulation entity is segregated from the operational business of SIX and reports directly to the Chairman of the Board of Directors of SIX."
    confidence: high

  clearing_regulator:
    zh: "瑞士金融市场监管局（FINMA）——SIX x-clear（中央对手方）与SIX SIS（中央证券存管机构）均持有FINMA依《金融市场基础设施法》（FMIA）颁发的牌照"
    en: "Swiss Financial Market Supervisory Authority (FINMA) — both SIX x-clear (CCP) and SIX SIS (CSD) hold licences issued by FINMA under the Financial Market Infrastructure Act (FMIA)"
    quote: "SIX x-clear is licensed by the Swiss Financial Market Supervisory Authority (FINMA) as a central counterparty according to the Swiss Financial Market Infrastructure Act (FMIA). SIX SIS possesses a license as central security depository under FMIA."
    confidence: high

  core_laws:
    zh: "《联邦金融市场基础设施与证券衍生品交易市场行为法》（FinMIA/FMIA）"
    en: "Federal Act on Financial Market Infrastructures and Market Conduct in Securities and Derivatives Trading (FinMIA / FMIA)"
    detail: |
      瑞士不是欧盟成员国，FinMIA是本国独立立法（2015年6月19日通过），不是MiFID II的国内转化法。
      本所《交易规则》（Trading Rules）§26明确：规则以德/法/英三种语言发布，三者不一致时以
      德文本为准——这一点与Eurex（Deutsche Börse Group旗下、同样以德文Börsenordnung为终局
      文本）构成同类对照，但SIX的适用法律体系（瑞士FinMIA）与Eurex（德国《交易所法》
      Börsengesetz）是两套不同的国家法律，不要混同。
    sources:
      - title: Trading Rules（SIX Exchange Regulation官网英文版PDF）§26 Binding nature
        url: https://www.ser-ag.com/dam/downloads/regulation/trading/rule-books/rb-en.pdf
        accessed: 2026-08-16
    quote: "The Trading Rules, including the implementing provisions of the Exchange, are available in German, French and English. The German version alone of the Trading Rules including the execution provisions of the Exchange is binding in the event of inconsistencies between the German, French and English versions."
    confidence: high

  foreign_ownership_limit:
    zh: "瑞士对外国投资者持有上市公司股份无一般性限制（非欧盟国家，资本市场总体对外资开放）；唯一例外是2025年12月19日通过的《投资审查法》（ISA），规定外国国有控股投资者收购瑞士特定敏感行业企业须事先审批，预计2027年生效——但这是针对外国直接投资的并购审查，并非对二级市场证券投资的外资持股上限。"
    en: "Switzerland imposes no general restriction on foreign ownership of listed-company shares (a non-EU country with an overall open capital market); the only exception is the Investment Screening Act (ISA), adopted on 19 December 2025, which subjects acquisitions by foreign state-controlled investors of Swiss companies in certain sensitive sectors to prior approval (expected entry into force in 2027) — but this is FDI merger-review, not a foreign-ownership cap on secondary-market portfolio investment."
    detail: "SECO官方说明页确认ISA仅针对外国国有控股投资者收购敏感行业企业的「事先审批」，并非全面外资持股上限；二级市场证券投资不受此限。"
    quote: "The objective of the Investment Screening Act is to protect Switzerland's security and public order by subjecting acquisitions of Swiss companies operating in especially critical sectors by foreign state-controlled investors to prior approval. Entry into force is expected in 2027."
    sources:
      - title: "Investment Screening (SECO 瑞士联邦经济事务秘书处官方说明页)"
        url: https://www.seco.admin.ch/en/investment-screening
        accessed: 2026-08-27
    verified: 2026-08-27
    confidence: medium

  capital_controls:
    zh: "瑞士无外汇管制：瑞士法郎自由兑换，资本可自由跨境流动；仅对银行及金融公司适用特定审慎监管规定，不存在一般性资本流动限制。"
    en: "Switzerland has no exchange controls: the Swiss franc is freely convertible and capital may move freely across borders; only certain prudential regulations applicable to banks and finance companies apply, with no general capital-movement restrictions."
    detail: "美国国际贸易署（ITA/export.gov）说明瑞士法郎自由兑换、除对银行及金融公司的特定规定外无外汇管制；第三方政府来源，confidence标medium。"
    quote: "The Swiss franc is freely convertible. With the exception of certain regulations applicable to banks and finance companies, there are no exchange controls."
    sources:
      - title: "Switzerland - Foreign Exchange Controls (U.S. International Trade Administration, export.gov)"
        url: https://legacy.export.gov/article?id=Switzerland-Foreign-Exchange-Controls
        accessed: 2026-08-27
    verified: 2026-08-27
    confidence: medium

  disclosure_requirements:
    zh: "发行人须按所适用财务报告准则（IFRS/US GAAP/Swiss GAAP FER）发布经审计年度报告；上市规则另强制要求权益类证券发行人发布半年度财务报告，季度报告为自愿。此外有《上市规则》第53条「价格敏感事实披露义务」（ad hoc publicity）及内幕交易规则保护投资者。"
    en: "Issuers must publish an audited annual report under the applicable financial reporting standard (IFRS/US GAAP/Swiss GAAP FER); the Listing Rules additionally impose an obligation to publish semi-annual financial statements for issuers of listed equity securities, while quarterly reporting is voluntary. There is also the ad-hoc publicity obligation (Art. 53 LR) and insider-trading rules."
    detail: "披露频率框架以Listing Rules Art. 49（年度）与Art. 50（半年度强制、季度自愿）为准；价格敏感事实披露见Art. 53。"
    quote: "Issuers of listed equity securities are obliged to publish semi-annual financial statements. The publication of quarterly financial statements is voluntary. Art. 53 Obligation to disclose price-sensitive facts (ad hoc publicity): The issuer must inform the market of any price-sensitive facts which have arisen in its sphere of activity."
    sources:
      - title: "Listing Rules Art. 50 (SIX Exchange Regulation 官网英文版 PDF)"
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-27
    verified: 2026-08-27
    confidence: high

  investor_protection:
    zh: "瑞士投资者保护框架以《金融服务法》（FinSA）为核心，对金融服务提供者设行为准则、客户分类（零售/专业/机构）与适当性/合适性要求，并要求向零售投资者提供基本信息文件（BIB）；交易所层面由SIX Exchange Regulation（SER）通过上市披露（如Art. 53价格敏感事实披露义务）与交易监督规则保护投资者。"
    en: "Switzerland's investor-protection framework is anchored in the Financial Services Act (FinSA), which sets a code of conduct for financial service providers, client categorisation (retail/professional/institutional) and suitability/appropriateness requirements, and requires a Basic Information Document (BIB) for retail investors; at the exchange level SIX Exchange Regulation (SER) protects investors through listing-disclosure (e.g. Art. 53 ad-hoc publicity) and trading-surveillance rules."
    detail: "FinSA为国家级投资者保护立法（mirroring MiFID II），交易所层面的保护主要通过SER的披露与监督规则实现。"
    quote: "Art. 53 Obligation to disclose price-sensitive facts (ad hoc publicity): The issuer must inform the market of any price-sensitive facts which have arisen in its sphere of activity."
    sources:
      - title: "Listing Rules Art. 53 (SIX Exchange Regulation 官网英文版 PDF)"
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-27
      - title: "FinSA – Services (SIX 官网说明页)"
        url: https://www.six-group.com/en/products-services/the-swiss-stock-exchange/services/finsa.html
        accessed: 2026-08-27
    verified: 2026-08-27
    confidence: high

