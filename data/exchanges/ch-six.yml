  error_trade_rule:
    spec:
      bust_allowed: true
      review_window_min: null
      deviation_threshold_pct: null
      resolution: cancel
      note: "『不规则的场内成交（irregular on-exchange trades）』由交易双方共同向交易所申请作废——须双方提供的信息一致方可作废；申请须不迟于成交次一交易日提交；交易所一般于当日交易日结束前（CCP 品种为清算日结束前）作废，例外情形可延长或拒绝作废。无固定价格偏离百分比门槛。作废后交易所在行情数据中公布。另可用『countertrade（对冲平仓交易）』替代作废"
    zh: "对『不规则的场内成交』，交易双方均须向交易所申请作废（须双方提供的信息一致方可作废，即双方需就作废达成一致）。申请须不迟于成交之次一交易日提交；交易所一般于当日交易日结束前（属中央对手方清算品种的于清算日结束前）作废，例外情形可延长期限或拒绝作废。没有固定的价格偏离百分比门槛。作废经交易所在行情数据中公布。交易所另设『对冲平仓交易（countertrade）』作为替代路径"
    en: "For irregular on-exchange trades, both parties to the trade must apply to the Exchange to cancel it — a trade cannot be cancelled unless the information given by the two parties corresponds (i.e. both must agree). The application must be made no later than the trading day following the trade; as a rule the Exchange cancels by the end of the trading day (by the end of the clearing day for CCP-eligible securities), and under exceptional circumstances may extend these periods or refuse to cancel. There is no fixed price-deviation threshold. A cancellation is published by the Exchange in the market data. A 'countertrade' is available as an alternative to cancellation"
    detail: "Directive 3 §23.2.1（Cancellation of trade by the Exchange）+ §24（Countertrade）。与 trading_halt_mechanism（Trading Interruption）视角不同。SIX 的错误交易作废是双边合意制（需双方申请、信息一致），无 % 阈值，窗口以『交易日』计。resolution 记 cancel。"
    sources:
      - title: Directive 3 — Trading §23.2.1 / §24（SIX Swiss Exchange）
        url: https://www.ser-ag.com/dam/downloads/regulation/trading/directives/dir03-en.pdf
        accessed: 2026-08-30
    quote: "In the event of irregular on-exchange trades, both parties involved in the trade shall apply to the Exchange to cancel the trade. ... A trade cannot be cancelled unless the information given by the two parties corresponds. ... The application from the parties shall be made no later than the trading day following that on which the trade was made. ... As a rule, the Exchange will cancel the trade by the end of the trading day at the latest. Trades in CCP-eligible securities will be cancelled by the end of the clearing day at the latest. ... Under exceptional circumstances, the Exchange may extend these periods or refuse to cancel a trade."
    confidence: high

  order_book_transparency:
    zh: "盘前：中央限价订单簿公开，展示订单的价量向市场披露、按价格-时间优先撮合。同一订单簿内支持不完全披露 / 隐藏的流动性——冰山订单仅逐档披露可见数量（隐藏部分每档换新时间戳、失时间优先）、Auction Volume Discovery 订单为集合竞价专用全隐藏订单、Retail 触发订单在触发前不进入订单簿。此外 SIX 运营 SwissAtMid 中点整合订单簿（依瑞士金融市场基础设施法规免于盘前透明度）。盘后：适用瑞士 FinfraG / FMIO 的成交披露与延迟安排"
    en: "Pre-trade: the central limit order book is public — displayed order sizes and prices are disseminated and matched on price-then-time priority. The same book supports partially-disclosed and hidden liquidity — Iceberg orders publish only one visible tranche at a time (each new tranche gets a fresh time stamp and loses time priority), Auction Volume Discovery orders are fully hidden and used only in auctions, and Retail (trigger) orders are not in the book before triggering. SIX additionally operates the SwissAtMid midpoint integrated order book, which is exempt from pre-trade transparency under the Swiss financial market infrastructure ordinance. Post-trade: publication and deferral follow the Swiss FinfraG / FMIO regime"
    detail: "字段管本所订单簿内部的（非）展示流动性；SwissAtMid 中点暗簿见 dark_pool。行情层级 / 收费见第十章。quote 引自 Directive 3 §5.1.2（Iceberg 定义）+ §11（免盘前透明度）。"
    sources:
      - title: Directive 3 — Trading §5.1.2 / §11（SIX Swiss Exchange）
        url: https://www.ser-ag.com/dam/downloads/regulation/trading/directives/dir03-en.pdf
        accessed: 2026-08-16
    quote: "The visible quantity of the Iceberg order is published in the order book. After the visible quantity of the Iceberg order has been executed, the next tranche of the total order quantity shall be published in the order book as a new visible quantity ... Each tranche shall be given a new time stamp and a new identification number, and thus loses its time priority. ... Iceberg orders, Retail orders and orders with at-the-close validity (namely also Auction Volume Discovery orders) which are executed using an order management facility of the Exchange are exempted from pre-trade transparency regulations"
    confidence: high

