    en: "SIX x-clear (the CCP for SIX Swiss Exchange trades) maintains a Default Fund and a default waterfall (loss-allocation hierarchy) covering its cleared instruments; on a member default, losses are absorbed in order by the defaulter's margin, SIX x-clear's own equity contribution (skin in the game), the respective Default Fund Segment contributions, and (in extreme cases) supplementary contributions from non-defaulting members."
