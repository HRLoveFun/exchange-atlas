          url: https://www.ser-ag.com/dam/downloads/regulation/trading/directives/gtp-en.pdf
          accessed: 2026-08-16
      confidence: high

  circuit_breaker:
    enum: stock_level
    spec: {type: stock_level, note: "无按指数跌幅自动触发的全市场熔断；个股级交易中断见 volatility_interruption；非常规情形交易所有裁量权（延迟开盘/暂停个股/删单等）"}
    zh: "无独立于个股级波动性中断之外、按指数跌幅自动触发的全市场熔断；极端情形下交易所依《交易规则》「非常规情形」/「紧急情形」条款拥有自由裁量权，可延迟开盘、限制/暂停个股连续交易、拒绝或删除订单，乃至暂停部分规则"
    en: "No automatic market-wide circuit breaker triggered by index-level declines, separate from the per-security Volatility Interruption; in extreme situations the Exchange has discretionary powers under the Trading Rules' \"Extraordinary situations\" / \"Emergency situations\" provisions to delay openings, restrict or suspend continuous trading in a security, reject or delete orders, or even suspend rules in part"
    detail: "与Eurex/JPX的情况相似（均未找到独立于个股价格机制之外的自动全市场熔断），可能是本次检索范围局限，未逐条核实是否存在，见OPEN-QUESTIONS。"
    sources:
      - title: Trading Rules §10.10.1/10.10.2 Extraordinary/Emergency situations
        url: https://www.ser-ag.com/dam/downloads/regulation/trading/rule-books/rb-en.pdf
