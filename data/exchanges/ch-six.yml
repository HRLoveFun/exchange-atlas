      zh: "蓝筹股（Annex A）：偏离参考价±1.5%触发5分钟交易中断（另有10秒内价格骤变的Avalanche Stop机制，同阈值）"
      en: "Blue Chip Shares (Annex A): a ±1.5% deviation from the reference price triggers a 5-minute trading interruption (an Avalanche Stop for rapid moves within 10 seconds applies the same threshold)"
      quote: "Continuous trading shall be interrupted for 5 minutes if the potential subsequent price differs a) by 1.5% or more from the current reference price; b) by 1.5% or more from a reference price valid within 10 seconds (Avalanche Stop)."
      sources:
        - title: "\"Trading Parameters\" Guideline, Annex A – Blue Chip Shares §4 Trading interruption"
          url: https://www.ser-ag.com/dam/downloads/regulation/trading/directives/gtp-en.pdf
          accessed: 2026-08-16
      confidence: high
    other_boards:
      zh: "中小盘股（Annex B）：一般个股±2%触发15分钟中断；SMIM成份股±2%触发5分钟中断；被标记为「volatile securities」的个股阈值放宽至±10%（触发5分钟中断）。开盘/收盘集合竞价另设「Delayed Auction」延时机制，计算价偏离参考价±2%~5%（按细分市场而异）即延长竞价时段5-15分钟"
      en: "Mid-/Small-Cap Shares (Annex B): ±2% triggers a 15-minute interruption for ordinary constituents; ±2% triggers a 5-minute interruption for SMIM constituents; securities classified as \"volatile securities\" have a widened ±10% threshold (5-minute interruption). Opening/closing auctions separately have a \"Delayed Auction\" mechanism extending the auction by 5-15 minutes (varying by segment) if the calculated price deviates ±2%-5% from the reference price"
      quote: |
        Continuous trading shall be interrupted for 15 minutes if the potential subsequent price differs
        a) by 2% or more from the current reference price; or
        b) by 2% or more from a reference price valid within 10 seconds (Avalanche Stop).
        For securities of the Swiss Market Index Mid (SMIM®), the delay in the opening or the trading interruption
        shall be 5 minutes and the bandwidth shall be 2% or more in accordance with letters a and b above.
        For volatile securities, the delay in the opening or the trading interruption shall be 5 minutes and the
        bandwidth shall be 10% or more in accordance with letters a and b above.
      sources:
