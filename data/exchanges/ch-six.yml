  liquidity_risk_note:
    zh: "SIX Swiss Exchange是瑞士证券的参考市场，拥有最高日交易份额与最窄买卖价差，蓝筹与主流证券流动性充裕；但市场流动性高度集中于大盘股与ETF/债券，中小盘及部分结构性产品流动性较薄（如Swiss Steel因低流通股与低成交量于2025年退市）。对单一中小盘或冷门结构化产品，流动性风险需单独评估。"
    en: "SIX Swiss Exchange is the reference market for Swiss securities with the highest daily trading share and tightest spreads, so blue chips and mainstream securities are highly liquid; however liquidity is concentrated in large caps and ETFs/bonds, while small/mid caps and some structured products are thinner (e.g. Swiss Steel delisted in 2025 citing low free float and limited trading volume). Liquidity risk for a single small cap or obscure structured product must be assessed separately."
    detail: "流动性分层明显；参考市场地位降低整体隐性成本，但非全覆盖。"
    quote: "the reference market with the highest market share of daily trading in Swiss securities, we offer unparalleled liquidity and the tightest bid/ask spreads."
