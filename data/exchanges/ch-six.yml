  suitability_management:
    zh: "适用瑞士《金融服务法》（FinSA，2020年生效）的客户适当性/合适性框架：金融服务提供者须将客户分类为零售、专业或机构，并提供与其分类相匹配的适当性（appropriateness）与合适性（suitability）评估；零售客户另须获基本信息文件（BIB）。该要求约束面向投资者的服务，而非交易所交易本身。"
    en: "Switzerland's Financial Services Act (FinSA, in force 2020) client-suitability framework applies: financial service providers must categorise clients as retail, professional or institutional and perform appropriateness/suitability assessments matching the category; retail clients must additionally receive a Basic Information Document (BIB). The requirement binds investor-facing services rather than the exchange trading itself."
    detail: "SIX FinSA说明页概述FinSA的投资者保护要求（mirroring MiFID II）；分类与适当性义务落在金融服务提供者一侧。"
    quote: "The Swiss Financial Services Act (FinSA), enacted on January 1, 2020, sets out regulatory requirements for investor protection, mirroring MiFID II in Europe and PRIIPs regulations. It defines a code of conduct for financial service providers and requires a Basic Information Document (BIB) for retail investors."
    sources:
