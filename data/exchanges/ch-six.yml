  account_opening_requirements:
    zh: "参与者须持有FINMA颁发的证券商牌照或「远程会员」（remote member）授权；具备接入交易系统的技术条件；是受认可清算机构与结算机构的参与者（或通过General Clearing Member/托管行间接接入）"
    en: "Applicants must hold a FINMA licence as a securities firm or FINMA authorisation as a remote member; meet the technical requirements for connecting to the exchange system; and be a participant in a recognised clearing organisation and settlement organisation (directly or via a General Clearing Member / custodian)"
    quote: "An applicant must fulfil the admission requirements according to Clause 3 Trading Rules, i.e. he must a) have a licence as a securities firm or remote member of the Exchange from FINMA; ... d) be a participant in a clearing organisation recognised by the Exchange or have access to such via a General Clearing Member; and e) be a participant in a settlement organisation recognised by the Exchange or have access to such via a custodian."
