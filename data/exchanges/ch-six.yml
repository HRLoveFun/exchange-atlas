  price_limits:
    type:
      enum: dynamic_reference
      zh: "动态参考价区间——预期后续成交价偏离当前参考价超出阈值即触发交易中断（Trading Interruption），而非直接禁止申报的固定涨跌停"
      en: "Dynamic reference-price range — trading is interrupted once the potential subsequent execution price deviates from the current reference price beyond a threshold, rather than orders being flatly barred by a fixed daily limit"
