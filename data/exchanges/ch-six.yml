    en: "Issuers must publish an audited annual report under their applicable financial reporting standard (IFRS/US GAAP/Swiss GAAP FER etc.); the Regulatory Board may require additional disclosure on corporate management and governance structure"
    quote: "The issuer is required to publish an annual report. This comprises the audited annual financial statements, in accordance with the applicable financial reporting standard, as well as the corresponding audit report."
    sources:
      - title: Listing Rules Art. 49 Annual reporting
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-16
    confidence: high

  suspension_resumption:
    zh: "SIX Exchange Regulation可依发行人申请或依职权，在异常情形（尤其是发行人违反重大披露义务）下临时暂停交易"
    en: "SIX Exchange Regulation may temporarily suspend trading, either at the issuer's request or on its own initiative, where unusual circumstances — in particular a breach of material disclosure obligations by the issuer — make suspension advisable"
    quote: "SIX Exchange Regulation may temporarily suspend the trading of securities at the request of the issuer or on its own initiative if unusual circumstances, specifically the breach of important disclosure obligations by the issuer, indicate that such a suspension is advisable."
    sources:
      - title: Listing Rules Art. 57 Suspension of trading
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-16
    confidence: high

  delisting_conditions:
    zh: "五类情形：(1)发行人依合理申请主动退市；(2)偿付能力存在重大疑虑或已进入破产/清算程序；(3)Regulatory Board认定证券市场流动性已不足；(4)连续停牌三个月且暂停原因持续存在；(5)不再满足上市要求"
    en: "Five categories: (1) a justified application by the issuer; (2) serious doubt over solvency, or insolvency/liquidation proceedings already commenced; (3) the Regulatory Board deeming the market no longer sufficiently liquid; (4) trading suspended continuously for three months with the reasons persisting; (5) listing requirements no longer fulfilled"
    quote: "The Regulatory Board may cancel the listing of securities in the following cases: 1. following a justified application by an issuer...; 2. if the solvency of the issuer is in serious doubt, or insolvency or liquidation proceedings have already commenced...; 3. if the Regulatory Board deems that there is no longer a sufficiently liquid market in the securities; 4. if trading has been suspended for a continuous three-month period, and the reasons for the suspension continue to exist; 5. if the listing requirements set out in Art. 26 are no longer fulfilled."
    sources:
      - title: Listing Rules Art. 58 Delisting
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-16
    confidence: high

  delisting_process:
    zh: "主动退市须发行人负责机构签署书面同意声明；Regulatory Board可对退市附加通知期与合理等待期要求，审查退市决定是否符合公司法定程序（尤其涉及2023年起生效的新规——股东大会而非董事会才有权决定主动退市）"
    en: "A voluntary delisting requires a signed declaration from the issuer's responsible bodies consenting to it; the Regulatory Board may make delisting conditional on due notice and appropriate waiting periods, and reviews whether the delisting decision was duly taken under corporate law (notably, since a 2023 legal reform it is the shareholders' meeting rather than the board of directors that has the power to decide on delisting)"
    detail: "2023年起生效的「股东大会而非董事会决定退市」这一变化，来自WebSearch定位到的第三方法律资源（CapLaw等），本次未逐条抓取原始瑞士债法典（OR）条文核实，confidence标medium。"
    sources:
      - title: Listing Rules Art. 58
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-16
    confidence: medium

  delisting_transition_period:
    zh: "《上市规则》第58条仅笼统要求退市须给予适当通知并遵守合理的等待期（「Regulatory Board may make delisting conditional upon due notice and the observance of appropriate waiting periods」），未规定统一的具体天数；过渡期长短视个案而定。"
    en: "Listing Rules Art. 58 only generally requires that delisting be subject to due notice and appropriate waiting periods, without prescribing a uniform fixed number of days; the transition period varies case by case."
    detail: "与有固定退市过渡期的市场不同，SIX以「合理等待期」原则处理，具体时长由Regulatory Board酌定。"
    quote: "Art. 58 Delisting — The Regulatory Board may make delisting conditional upon due notice and the observance of appropriate waiting periods."
    sources:
      - title: "Listing Rules Art. 58 (SIX Exchange Regulation 官网英文版 PDF)"
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-27
    verified: 2026-08-27
    confidence: high

  post_delisting_venue:
    zh: "SIX Swiss Exchange本身不设专门的退市后交易场所（不同于某些交易所的OTC/粉单板块）；退市证券可转至场外（OTC）双边交易。案例：Swiss Steel于2025年退市后，剩余股东经安排通过私人银行Lienhardt & Partner的LPZ-X场外交易平台继续交易，但这是个案安排而非交易所常设板块。"
    en: "SIX Swiss Exchange itself operates no dedicated post-delisting venue (unlike some exchanges' OTC/pink-sheet boards); delisted securities may move to bilateral over-the-counter (OTC) trading. Case in point: after its 2025 delisting, Swiss Steel Holding AG shareholders were given the option to trade via the over-the-counter platform LPZ-X of private bank Lienhardt & Partner — an ad-hoc arrangement, not a standing exchange segment."
    detail: "SIX无正式post-delisting board；退市后流动性通常依赖OTC双边报价或第三方平台。"
    quote: "Immediately after delisting, Swiss Steel Holding AG shares will be traded via the over-the-counter trading platform LPZ-X of the private bank Lienhardt & Partner."
    sources:
      - title: "Swiss Steel Holding AG: Last trading day on SIX Swiss Exchange on June 5, 2025 (Ad-hoc release via EQS)"
        url: https://www.eqs-news.com/news/ad-hoc/swiss-steel-holding-ag-last-trading-day-on-six-swiss-exchange-on-june-5-2025-exemption-from-annual-results-publication-requirement-granted/ba532e25-4c3f-4a71-aa2d-66048e20f26e_en
        accessed: 2026-08-27
    verified: 2026-08-27
    confidence: medium

