  regulatory_change_risk_note:
    zh: "瑞士作为非欧盟国家，其交易所监管框架能否获欧盟MiFID II/MiFIR「等效性」认定存在政治不确定性，且已实际发生过一次认定失效。时间线：(1) 欧盟委员会《实施决定》(EU) 2017/2441（2017年12月21日通过）首次认定SIX Swiss Exchange AG与BX Swiss AG符合等效标准，有效期至2018年12月31日；(2) 《实施决定》(EU) 2018/2047（2018年12月20日通过）将认定延长至2019年6月30日；(3) 此后欧盟未再续期，等效认定自2019年7月1日起失效；(4) 瑞士随即针对欧盟启动「交易所基础设施保护措施」反制（禁止外国交易场所未经认可交易瑞士股票），该措施已于2024年1月1日转入《金融市场基础设施法》（FinMIA）正式立法；(5) 随欧盟2024年修订相关法律基础，瑞士联邦委员会2025年1月29日决定，自2025年5月1日起将欧盟从保护措施适用名单中移除。截至本次核实（2026年8月），欧盟层面的正式「等效性」认定本身尚未恢复，双方仅通过瑞士单方面解除反制措施使市场准入恢复常态。"
    en: "As a non-EU country, whether Switzerland's exchange regulatory framework retains MiFID II/MiFIR \"equivalence\" recognition has been a source of political uncertainty, and equivalence has in fact already lapsed once. Timeline: (1) Commission Implementing Decision (EU) 2017/2441 (adopted 21 December 2017) first recognised SIX Swiss Exchange AG and BX Swiss AG as equivalent, expiring 31 December 2018; (2) Implementing Decision (EU) 2018/2047 (adopted 20 December 2018) extended recognition to 30 June 2019; (3) the EU did not renew it thereafter, and equivalence lapsed with effect from 1 July 2019; (4) Switzerland responded by activating a \"stock exchange infrastructure protective measure\" against the EU (barring unrecognised foreign trading venues from trading Swiss shares), which was incorporated into ordinary law (the Financial Market Infrastructure Act, FinMIA) on 1 January 2024; (5) following an EU revision of the underlying legal basis in 2024, the Swiss Federal Council decided on 29 January 2025 to remove the EU from the list of jurisdictions subject to the protective measure, effective 1 May 2025. As of this review (August 2026), formal EU-level \"equivalence\" recognition itself has not been reinstated — market access has instead normalised only through Switzerland's unilateral withdrawal of its countermeasure."
    detail: "2026-08-21 已用欧盟官方Implementing Decision原文（eur-lex.europa.eu）与瑞士联邦财政部国际金融事务秘书处（SIF）官方说明页逐条核实完整时间线，替换掉此前仅第三方律所转述、且把第一次决定的到期日期误记为「2017年12月31日」（实际为2018年12月31日）的旧版本。欧盟官方新闻稿页面（europa.eu/rapid）本身仍为纯JS渲染SPA无法抓取；`admin.ch`两条联邦委员会新闻稿页面本次curl返回403（反爬），但SIF说明页本身已完整转述其内容，不影响本条结论。"
    sources:
      - title: "Commission Implementing Decision (EU) 2017/2441 of 21 December 2017, Article 2 & Annex"
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32017D2441
        accessed: 2026-08-21
      - title: "Commission Implementing Decision (EU) 2018/2047 of 20 December 2018, Article 2"
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32018D2047
        accessed: 2026-08-21
      - title: "Measure to protect Swiss stock exchange infrastructure（瑞士联邦财政部国际金融事务秘书处SIF官方说明页）"
        url: https://www.sif.admin.ch/en/protect-swiss-stock-exchange-infrastructure
        accessed: 2026-08-21
    quote: "Article 2 This Decision shall enter into force on the day following that of its publication in the Official Journal of the European Union. It shall expire on 31 December 2018. ... ANNEX Stock exchanges in Switzerland considered equivalent ...: (a) SIX Swiss Exchange AG (b) BX Swiss AG ... Article 2 ... It shall apply from 1 January 2019. It shall expire on 30 June 2019. ... The EU granted Switzerland stock market equivalence only until the end of June 2019, but did not extend it beyond that date. ... the safeguard measure was transferred to ordinary law on 1 January 2024. ... On 29 January 2025, the Federal Council decided to remove the European Union (EU) from the list of jurisdictions affected by the measure to protect the Swiss stock exchange infrastructure (protective measure) with effect from 1 May 2025."
    confidence: high

  enforcement_note:
    zh: "SIX Exchange Regulation（SER）负责监督与执法：对发行人可处谴责、最高CHF 100万（过失）或CHF 1,000万（故意）罚款、暂停交易、退市或重新分配至不同监管标准等制裁；对交易参与者另依《交易规则》监督。制裁由Regulatory Board / Sanction Commission作出。"
    en: "SIX Exchange Regulation (SER) is responsible for supervision and enforcement: against issuers it may impose reprimand, a fine of up to CHF 1 million (negligence) or CHF 10 million (wilful intent), suspension of trading, delisting or reallocation to a different regulatory standard; trading participants are supervised under the Trading Rules. Sanctions are decided by the Regulatory Board / Sanction Commission."
    detail: "执法依据为Listing Rules Art. 61（发行人制裁）与Trading Rules相关条款。"
    quote: "One or more of the following sanctions may be imposed on issuers and guarantors ... 1. reprimand; 2. fine of up to CHF 1 million (in cases of negligence) or CHF 10 million (in cases of wrongful intent); 3. suspension of trading; 4. delisting or reallocation to a different regulatory standard;"
    sources:
      - title: "Listing Rules Art. 61 Sanctions (SIX Exchange Regulation 官网英文版 PDF)"
        url: https://www.ser-ag.com/dam/downloads/regulation/listing/listing-rules/lr-en.pdf
        accessed: 2026-08-27
    verified: 2026-08-27
    confidence: high
