    en: "Price-time priority: the order/quote with the better price (highest limit for buy side, lowest for sell side) is executed first, unlimited orders enjoy top priority, and orders at the same price are executed in order of receipt; auctions additionally apply the \"principle of highest executable volume\" to determine a single auction price"
    quote: "As a rule, the price-time priority principle applies. This means that the order and quote with the better price (highest price limit for buy side, lowest price limit for sell side) is executed first. Unlimited orders enjoy top priority when consolidating orders and quotes."
