    en: "Brokerage commissions are set bilaterally between the trading participant (member firm) and its client; the exchange does not prescribe a uniform commission rate. SIX itself charges a per-transaction, per-participant exchange fee (see exchange_fees) and access/capacity fees, not investor-facing commissions."
    detail: "佣金属会员机构商业定价；本字段记录为「由券商自行定价」。"
    quote: "SIX charges a fee for all on-Exchange transactions. This fee is calculated per transaction and participant and depends on the given participant's total trading turnover (money involved; ad valorem fee) and number of transactions."
