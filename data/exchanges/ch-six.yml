  investor_structure:
    zh: "投资者结构以机构投资者为主导——瑞士及国际的养老基金、保险公司、共同基金/资产管理人（如UBS、Pictet、BlackRock等）是最大参与方；零售参与度相对有限。瑞士养老基金约三成资产投向股票，且其中近三分之二为国际股票，表明外资与国际投资者在瑞士市场占有重要地位。"
