    detail: "完整订单类型表见 NYSE Pillar Binary/FIX Gateway Order Type Matrix。此处 quote 引自 SR-NYSE-2019-05 Exhibit 5（Rule 7.31 条文），定义性措辞稳定，但个别子类型自 2019 年后有增减，故整体 confidence: medium。"
    sources:
