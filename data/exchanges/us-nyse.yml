      en: "Block-style trading on the options side is represented by the Qualified Contingent Cross (QCC): an originating order to buy or sell at least 1,000 contracts identified as part of a qualified contingent trade, coupled with contra-side order(s) totaling an equal number of contracts; a conforming QCC trades immediately in full at its price, does not route, and may be entered with an MPV of $0.01 regardless of the MPV of the options series; the multi-leg Complex QCC Order requires at least 1,000 contracts per leg. The NYSE Arca options-side block-trade provisions were not verified in detail this session"
