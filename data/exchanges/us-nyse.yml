  tick_size:
    spec:
      regime: tiered_by_price_and_liquidity
      min_tick: 0.005
      currency: USD
      full_table_note: "17 CFR 242.612 (Reg NMS Rule 612)：报价 ≥ $1.00 的 NMS 股票按主上市所每半年测算的时间加权平均报价价差（TWAQS）分配 tick——≤ $0.015 为 $0.005，> $0.015 为 $0.01；报价 < $1.00 的股票为 $0.0001。两档制 2025-11-03 起施行"
      note: "联邦层面的全国市场系统统一规则，非 NYSE 单独规定；某股当期 tick 由主上市所按 Rule 612 评估期测算后分配"
    zh: "按 Reg NMS Rule 612（17 CFR 242.612）：报价不低于 $1.00 的 NMS 股票，最小报价单位为 $0.01 或 $0.005（时间加权平均报价价差 $0.015 或以下者为 $0.005，否则为 $0.01，由主上市交易所每半年评估分配）；报价低于 $1.00 的股票为 $0.0001"
    en: "Per Reg NMS Rule 612 (17 CFR 242.612): for NMS stocks priced at or above $1.00, the minimum pricing increment is either $0.01 or $0.005 (a $0.005 tick if the Time Weighted Average Quoted Spread over the Evaluation Period was $0.015 or less, otherwise $0.01, assessed semi-annually by the primary listing exchange); for stocks priced below $1.00 it is $0.0001"
    detail: "两档制（$0.005 / $0.01）自 2025-11-03（首个评估期 2025 年 7–9 月）起施行，取代此前统一 $0.01。适用范围为全部 NMS 股票（联邦规则），此前本字段留空。"
    sources:
    - {title: "17 CFR § 242.612 — Minimum pricing increment（eCFR versioner API，title 17 part 242，issue 2026-08-17）", url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-17/title-17.xml?part=242", accessed: 2026-08-30}
    - {title: "Tick Sizes – A Small Entity Compliance Guide（SEC，2024-11-21）", url: "https://www.sec.gov/resources-small-businesses/small-business-compliance-guides/tick-sizes", accessed: 2026-08-30}
    quote: "if that bid or offer, order, or indication of interest is priced equal to or greater than $1.00 per share: ( i ) $0.01, if the Time Weighted Average Quoted Spread for the NMS stock during the Evaluation Period was greater than, $0.015; or ( ii ) $0.005, if the Time Weighted Average Quoted Spread for the NMS stock during the Evaluation Period was equal to or less than $0.015. ... shall display, rank, or accept from any person a bid or offer, an order, or an indication of interest in any NMS stock priced in an increment smaller than $0.0001 if that bid or offer, order, or indication of interest is priced less than $1.00 per share."
    confidence: high

  board_lot_size:
    zh: "「整手」（round lot）由 Reg NMS Rule 600(b) 全国统一定义，按前一评估期主上市所平均收盘价分档：≤$250 为 100 股，$250.01–$1,000 为 40 股，$1,000.01–$10,000 为 10 股，>$10,000 为 1 股；新上市 NMS 股票一律先按 100 股。适用于全部 NMS 股票，纽交所与纳斯达克一致"
    en: "The 'round lot' is defined market-wide by Reg NMS Rule 600(b), tiered by the stock's average closing price on the primary listing exchange during the prior Evaluation Period: 100 shares for stocks priced $250.00 or less, 40 shares for $250.01–$1,000.00, 10 shares for $1,000.01–$10,000.00, and 1 share for $10,000.01 or more; a new NMS stock is assigned a 100-share round lot. This applies to all NMS stocks, identically for NYSE and Nasdaq"
    quote: "Round lot means: (i) For any NMS stock for which the average closing price on the primary listing exchange during the prior Evaluation Period was: (A) $250.00 or less per share, an order for the purchase or sale of an NMS stock of 100 shares; (B) $250.01 to $1,000.00 per share, an order for the purchase or sale of an NMS stock of 40 shares; (C) $1,000.01 to $10,000.00 per share, an order for the purchase or sale of an NMS stock of 10 shares; (D) $10,000.01 or more per share, an order for the purchase or sale of an NMS stock of 1 share; and (ii) New NMS stocks. Any security that becomes an NMS stock during an operative period as described in paragraph (b)(93)(iv) of this section shall be assigned a round lot of 100 shares."
    sources:
      - title: "17 CFR 242.600(b)(93) — Regulation NMS, definition of 'round lot'（eCFR versioner API，Title 17 Part 242）"
        url: https://www.ecfr.gov/api/versioner/v1/full/2025-01-01/title-17.xml?part=242
        accessed: 2026-09-04
    detail: "分档 round lot 是 2020 年 SEC Market Data Infrastructure Rules 引入、分阶段实施的定义。传统上『整手 = 100 股』，高价股分档是新增。"
    confidence: high

  odd_lot_handling:
    zh: "「碎股」（odd-lot）= 数量少于一个整手（round lot）的 NMS 股票买卖订单。碎股可正常成交；按 SEC Market Data Infrastructure Rules，优于全国最优买卖价的碎股报价须纳入行情传输并按最不激进价格聚合披露"
    en: "An 'odd-lot' is an order to buy or sell an NMS stock in an amount less than a round lot. Odd lots execute normally; under the SEC's Market Data Infrastructure Rules, odd-lot quotations better than the national best bid/offer must be included in the consolidated feed, aggregated and disseminated at the least aggressive price"
    quote: "Odd-lot means an order for the purchase or sale of an NMS stock in an amount less than a round lot. …… such aggregation shall occur across multiple prices and shall be disseminated at the least aggressive price of all such aggregated odd-lots."
    sources:
      - title: "17 CFR 242.600(b)(68) — Regulation NMS, definition of 'odd-lot'（eCFR versioner API，Title 17 Part 242）"
        url: https://www.ecfr.gov/api/versioner/v1/full/2025-01-01/title-17.xml?part=242
        accessed: 2026-09-04
    detail: "quote 用「……」连接 (b)(68) odd-lot 定义与 (b)(69) odd-lot information 里的聚合披露条款。"
    confidence: high

