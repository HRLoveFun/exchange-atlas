  # derivatives 子块（2026-09-05，框架性问题 #45 之 us-nyse 衍生品缺口）：期权清算端主体是
  # OCC（Options Clearing Corporation）——全美上市期权（含 NYSE American/Arca 期权）的唯一
  # 中央清算机构/CCP，与本文件顶层 clearing.ccp_name 描述的现货端 CCP（NSCC）是两回事，
  # OCC 的身份与角色在本子块内如实描述。theocc.com 直连 403，原始页经 wayback 回退落盘
  # （快照日期见 PROJECT/sources/us-nyse.md 登记条目）。
  derivatives:
    initial_margin_practice:
      zh: "期权清算的中央对手方是 OCC（Options Clearing Corporation）——全美上市期权的唯一 CCP，NYSE American/Arca 期权成交全部经 OCC 清算；OCC 对清算会员的保证金采用自研的 STANS（System for Theoretical Analysis and Numerical Simulations）方法论：全球首个采用大规模蒙特卡洛模拟的衍生品清算机构，对清算会员账户中经 OCC 清算持有的期权、期货与现金工具组合计量风险敞口，基础保证金组件取自 99% Expected Shortfall 风险度量，另加压力测试组件"
      en: "The CCP for options clearing is OCC (Options Clearing Corporation) — the sole central counterparty for all US-listed options, clearing all NYSE American/Arca options trades; OCC's clearing-member margin uses its proprietary STANS (System for Theoretical Analysis and Numerical Simulations) methodology: the first derivatives clearinghouse in the world to use a large-scale Monte Carlo-based risk management methodology, measuring the exposure of portfolios of options, futures and cash instruments cleared and carried by OCC for its clearing member firms, with the base margin component obtained from the 99% Expected Shortfall risk measure plus a stress-test component"
      detail: "顶层 clearing.ccp_name 描述现货端（NSCC）；期权端 CCP 为 OCC，本子块按衍生品口径记录。原始页经 wayback 回退抓取（theocc.com 直连 403）。"
      sources:
        - title: "OCC — Margin Methodology（STANS 方法论总览；经 wayback 2025-12-09 快照）"
          url: https://www.theocc.com/risk-management/margin-methodology
          accessed: 2026-09-05
      quote: "OCC is the first derivatives clearinghouse in the world to use a large-scale Monte Carlo-based risk management methodology. The STANS methodology is used to measure the exposure of portfolios of options, futures and cash instruments cleared and carried by OCC on behalf of its clearing member firms (“CMs”). ... The base component of the margin requirement for each account is obtained from the risk measure known as 99% Expected Shortfall."
      confidence: high
      verified: 2026-09-05

    maintenance_margin_practice:
      zh: "OCC 逐日对每个清算会员账户适用保证金要求：逐日保证金计算基于全组合蒙特卡洛模拟并保守构建，确保账户内已清算产品价值加已缴保证金抵押品在两日展望期内不会明显为负；出现重大亏损的账户可被盘中追加保证金（intraday calls）；客户层无备兑期权空头的维持要求以期权当前市值替代权利金收入计算（公式见 market_structure.derivatives.margin_practice_note）；客户账户中的期权多头头寸出于投资者保护原因整体不计入 OCC 保证金计算"
      en: "OCC applies margin requirements on a daily basis to each clearing-member account: the daily margin calculation is based on full-portfolio Monte Carlo simulations, constructed conservatively to ensure that the value of cleared products in the account plus posted collateral will not be appreciably negative at a two-day horizon; intraday calls may be made on accounts incurring significant losses; at the customer level, maintenance requirements for uncovered short options use the option's current market value in place of the option proceeds (formula under market_structure.derivatives.margin_practice_note); long option positions in customer accounts are excluded altogether from OCC margin calculations for investor protection reasons"
      detail: "同 initial_margin_practice，本字段是清算/CCP 层面视角，与市场结构章节的交易端保证金说明不合并，见 [ADR-030]。"
      sources:
        - title: "OCC — Margin Methodology（General Features 段与脚注1；经 wayback 2025-12-09 快照）"
          url: https://www.theocc.com/risk-management/margin-methodology
          accessed: 2026-09-05
        - title: "OCC — Equity Options Product Specifications（Minimum Customer Margin 脚注；经 wayback 2025-08-08 快照）"
          url: https://www.theocc.com/clearance-and-settlement/clearing/equity-options-product-specifications
          accessed: 2026-09-05
      quote: "OCC applies margin requirements on a daily basis to each account maintained at OCC by its CMs. Intraday calls for additional margin may be made on accounts incurring significant losses. ... Monte Carlo simulations and - as set out in more detail below - is constructed conservatively to ensure a very high level of assurance that the overall value of cleared products in the account, plus collateral posted to meet margin requirements, will not be appreciably negative at a two-day horizon. ... Long option positions held in customer accounts of CMs, and not part of various designated spread positions, are excluded altogether from OCC margin calculations for investor protection reasons. ... *For calculating maintenance margin, use the option's current market value instead of the option proceeds."
      confidence: high
      verified: 2026-09-05

    mark_to_market_frequency:
      zh: "逐日盯市：OCC 对其清算会员在 OCC 开立的每个账户逐日计算并适用保证金要求；出现重大亏损的账户可被盘中追保"
      en: "Daily: OCC applies margin requirements on a daily basis to each account maintained at OCC by its clearing members; intraday calls for additional margin may be made on accounts incurring significant losses"
      sources:
        - title: "OCC — Margin Methodology（General Features 段；经 wayback 2025-12-09 快照）"
          url: https://www.theocc.com/risk-management/margin-methodology
          accessed: 2026-09-05
      quote: "OCC applies margin requirements on a daily basis to each account maintained at OCC by its CMs. Intraday calls for additional margin may be made on accounts incurring significant losses."
      confidence: high
      verified: 2026-09-05

    delivery_method:
