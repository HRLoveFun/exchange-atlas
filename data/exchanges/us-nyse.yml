# 二｜基本信息
# ═══════════════════════════════════════════════
overview:
  _meta:
    verified: 2026-08-13
    confidence: medium

  timezone: "America/New_York (ET)"
  dst_rule: "实行夏令时（东部时间在 EST/EDT 间切换）"

  founded_year:
    zh: "1792（5月17日，梧桐树协议 Buttonwood Agreement）"
    en: "1792 (Buttonwood Agreement, May 17)"
    detail: |
      24 名经纪人在华尔街一棵梧桐树下签署协议，约定佣金规则与交易对象限于彼此信任的
      成员——这是 NYSE 追溯的正式成立起点；官网同时提及其渊源可上溯至1600年代曼哈顿
      早期的贸易活动，但那不算正式成立年份。
    sources:
      - title: The History of NYSE（官网）
        url: https://www.nyse.com/history-of-nyse
        accessed: 2026-08-13
    quote: "The New York Stock Exchange traces its origins to the Buttonwood Agreement signed by 24 stockbrokers on May 17, 1792"
    confidence: high

  history:
    zh: "1792年成立；2006年由会员制改为公司制并上市（与Archipelago/Pacific Exchange合并组成NYSE Group）；2013年被洲际交易所（ICE）收购，现为ICE子公司"
    detail: |
      2005年11月16日，洲际交易所（NYSE代码：ICE）在纽交所自身挂牌上市；2006年纽交所、
      Archipelago（Arca）、Pacific Exchange合并组成公开交易的NYSE Group，结束会员制；
      2008年收购American Stock Exchange；2013年ICE反向收购NYSE Group。因此"纽交所自身
      是否上市"这个问题的准确答案是：挂牌的是它现在的母公司ICE，不是NYSE这个交易所
      实体本身——见 self_listed 字段的详细说明。
    sources:
      - title: The History of NYSE（官网）
        url: https://www.nyse.com/history-of-nyse
        accessed: 2026-08-13
    quote: "On November 16, 2005, Intercontinental Exchange (NYSE: ICE) listed on the NYSE. In 2006, the New York Stock Exchange (NYSE), Archipelago (Arca), and the Pacific Exchange (PCX) merged to form the publicly traded NYSE Group, ending membership ownership of the Exchange. In 2008, the NYSE acquired the American Stock Exchange, becoming the third largest U.S. options market. By 2013, ICE acquired the NYSE"
    confidence: high

  organization_form:
    enum: demutualized_listed
    zh: "公司制（2006年由会员制改制）"
    en: "Demutualized (2006)"
    detail: "改制后的公开交易主体几经并购，现处于 ICE 集团架构之下（见 history）。"
    sources:
      - title: The History of NYSE（官网）
        url: https://www.nyse.com/history-of-nyse
        accessed: 2026-08-13
    quote: "In 2006, the New York Stock Exchange (NYSE), Archipelago (Arca), and the Pacific Exchange (PCX) merged to form the publicly traded NYSE Group, ending membership ownership of the Exchange."
    confidence: high

  self_listed:
    enum: partial
    zh: "并非NYSE实体本身上市，而是其母公司洲际交易所（ICE）在纽交所上市（股票代码 ICE）"
    en: "Not NYSE itself; parent Intercontinental Exchange (ICE) is listed on NYSE"
    detail: |
      与港交所"自身股票在自己主板挂牌"（0388.HK）不是同一种情况——NYSE 这个交易所
      实体（现为 ICE 全资子公司）没有独立上市的股票，是它的母公司 ICE 反过来在 NYSE
      挂牌交易，方向和港交所相反。故枚举值取 partial 而非 yes/no 的简单二分。
    sources:
      - title: The History of NYSE（官网）
        url: https://www.nyse.com/history-of-nyse
        accessed: 2026-08-13
    quote: "On November 16, 2005, Intercontinental Exchange (NYSE: ICE) listed on the NYSE... By 2013, ICE acquired the NYSE"
    confidence: high

  market_cap_usd_bn:
    zh: ""
    confidence: low
    detail: "未在本次会话核实最新总市值统计口径与数字，留空。"

  listed_companies_count:
    zh: ""
    confidence: low

  annual_turnover_usd_bn:
    zh: ""
    confidence: low

  global_ranking:
    zh: ""
    confidence: low
    detail: "草稿印象：按上市公司总市值计通常被列为全球最大交易所——未附具体统计口径与日期的来源，留空。"

  trading_currency: "美元 (USD)"

  settlement_currency: "美元 (USD)"

