      note: "一、二级仅 9:30am-3:25pm 可触发、各每日一次；三级任何时段可触发。停牌后重开集合竞价（[ADR-037] 的 Phase 1b 待办已补 halt_minutes / day_end）"
    zh: "全市场熔断（Market-Wide Circuit Breaker, MWCB），基于标普500指数单日跌幅触发三级阈值：7%（一级）、13%（二级）、20%（三级）；一、二级暂停交易 15 分钟，三级当日收市"
    en: "Market-Wide Circuit Breaker (MWCB)"
    detail: "由 NYSE、NYSE American、NYSE Arca Rule 7.12 共同规定，跨市场协调停牌。一、二级仅在 9:30am-3:25pm 触发、每交易日各限一次；三级任何时段触发即停至收市。"
    sources:
      - title: Trading Information（官网）
        url: https://www.nyse.com/trade/trading-information
        accessed: 2026-08-13
      - title: NYSE Market-Wide Circuit Breakers FAQ（官网 PDF）
        url: https://nyse.com/publicdocs/nyse/NYSE_MWCB_FAQ.pdf
        accessed: 2026-08-30
    quote: "A cross-market trading halt can be triggered at three circuit breaker thresholds that measure a decrease against the prior day's closing price of the S&P 500 Index -- 7% (Level 1), 13% (Level 2), and 20% (Level 3) (See NYSE, NYSE American and NYSE Arca Rule 7.12). ... Level 1 and Level 2 breaches halt trading for a minimum of 15 minutes. Level 3 breach halts trading for the remainder of the trading day."
