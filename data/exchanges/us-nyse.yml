  capital_gains_tax:
    zh: "长期资本利得（持有超过一年）按 0%/15%/20% 三档优惠税率计征；短期（持有一年及以内）利得按普通所得税率计征：2025 纳税年度，单身应税所得不超过 48,350 美元适用 0% 档、48,350–533,400 美元适用 15% 档，超过 15% 档门槛的部分适用 20%（本字段为联邦口径，州所得税另计，未逐州核实）"
    en: "Long-term capital gains (held over one year) are taxed at preferential rates of 0%/15%/20%; short-term gains (held one year or less) are taxed as ordinary income: for taxable years beginning in 2025, the 0% rate applies to single filers with taxable income up to 48,350 USD and the 15% rate between 48,350 and 533,400 USD, with the 20% rate above the 15% thresholds (federal basis; state income taxes not verified per-state)"
    sources:
      - title: "Topic 409, Capital Gains and Losses（IRS 官方主题页，长期三档税率、2025 年度门槛与短期/长期分类）"
        url: https://www.irs.gov/taxtopics/tc409
        accessed: 2026-09-05
    quote: "For taxable years beginning in 2025, the tax rate on most net capital gain is no higher than 15% for most individuals. A capital gains rate of 0% applies if your taxable income is less than or equal to: $48,350 for single and married filing separately ... A capital gains rate of 15% applies if your taxable income is: more than $48,350 but less than or equal to $533,400 for single ... However, a capital gains rate of 20% applies to the extent that your taxable income exceeds the thresholds set for the 15% capital gain rate. ... Generally, if you hold the asset for more than one year before you dispose of it, your capital gain or loss is long-term. If you hold it one year or less, your capital gain or loss is short-term."
    confidence: high

  dividend_withholding_tax:
    zh: "非居民外国人（NRA）取得美国来源股息等固定/可确定的年度或定期所得（FDAP），按 30% 固定税率预扣（适用税收协定可降至更低税率），由支付方扣缴、不得就该类所得扣除费用"
    en: "Nonresident aliens receiving U.S.-source dividends and other fixed, determinable, annual or periodical (FDAP) income are subject to a flat 30 percent tax (lower treaty rates may apply), withheld by the payer, with no deductions allowed against such income"
    sources:
      - title: "Nonresident aliens（IRS 官方国际税收页，FDAP 所得 flat 30 percent 或更低协定税率）"
        url: https://www.irs.gov/individuals/international-taxpayers/nonresident-aliens
        accessed: 2026-09-05
    quote: "If you are not engaged in a trade or business, the payment of U.S. source income that is fixed, determinable, annual, or periodical is taxed at a flat 30 percent (or lower treaty rate) and no deductions are allowed against such income."
    confidence: high

  implicit_costs_note:
    zh: "美国现货股票的主要隐性成本为买卖价差与市场冲击。可引用的官方口径（SEC 市场结构演讲）：最大市值股票的报价价差长期钉在最小报价单位 1 美分上，包含中小盘股票在内的整体价差接近历史低位；同时 SEC 同文记录了针对 maker-taker 返佣与订单流付费（PFOF）安排是否构成利益冲突、损害投资者最佳执行权的官方争论——返佣结构本身（见 exchange_fees）与价差形成直接相关。实际价差/冲击成本的逐标的直接测度官方不发布，本字段按覆盖边界停留在分析性描述"
    en: "The main implicit costs in U.S. cash equities are bid-ask spreads and market impact. Citable official account (SEC market structure speech): quoted bid-ask spreads for the largest stocks remain pegged at the minimum tick of one cent, and overall spreads, including those for smaller stocks, are near historic lows; the same speech records the official debate over whether maker-taker rebates and payment for order flow (PFOF) create conflicts of interest that undermine best execution — the rebate structure itself (see exchange_fees) bears directly on spread formation. Per-instrument realized spread/impact figures are not officially published, so this note remains analytical per the project's coverage boundary"
    detail: "由 low 升级：找到 SEC 官方一手演讲（.cache 已落盘）提供可摘引的价差与市场结构争论表述；数字（1 美分、历史低位）为演讲引用的定性口径，非逐笔实测。原 low 记录中『NYSE Market Quality infographic 链接失效』的教训保留在 git 历史，不再重复。"
    sources:
      - title: "U.S. Equity Market Structure: Making Our Markets Work Better for Investors（SEC 官方演讲稿，价差水平与 maker-taker/PFOF 争论的官方叙述）"
        url: https://www.sec.gov/newsroom/speeches-statements/us-equity-market-structure
        accessed: 2026-09-05
    quote: "Quoted bid-ask spreads for the largest stocks remain pegged at the minimum level of one cent, [5] and overall spreads, including those for smaller stocks, are near historic lows. ... incentives like the maker-taker pricing model [30] and payment for order flow arrangements [31] pose irreconcilable conflicts of interest for broker-dealers that deprive investors of their right to best execution."
    confidence: medium

