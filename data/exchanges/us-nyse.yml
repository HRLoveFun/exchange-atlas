    quote: "Limit Order. An order to buy or sell a stated amount of a security at a specified price or better. ... Non-Displayed Limit Order. A Limit Order that is not displayed and does not route. ... Mid-Point Liquidity Order (“MPL Order”). A Limit Order that is not displayed and does not route, with a working price at the midpoint of the PBBO. ... Pegged Orders. A Limit Order that does not route with a working price that is pegged to a"
