    en: "USD"

# ═══════════════════════════════════════════════
# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-13
    sources:
      - title: NYSE Regulation（官网）
        url: https://www.nyse.com/regulation
        accessed: 2026-08-13
    confidence: high

  regulator:
    zh: "美国证券交易委员会"
    en: "U.S. Securities and Exchange Commission (SEC)"
    detail: "NYSE 规则的任何新增或修订都须依据《1934年证券交易法》第19(b)条向SEC备案（Rule 19b-4），经批准后方可生效。"
    quote: "As a registered securities exchange, NYSE is subject to the regulatory oversight of the SEC and all rules and amendments must be filed with and approved by the SEC pursuant to Section 19(b) of the Securities and Exchange Act of 1934 and Rule 19b-4 thereunder."
    confidence: high

  self_regulatory_org:
    zh: "NYSE Regulation（交易所自身的一线监管部门）；金融业监管局（FINRA）按监管服务协议代为执行部分跨市场执法工作"
    en: "NYSE Regulation; FINRA (via Regulatory Services Agreements)"
    detail: |
      NYSE Regulation 下设 Issuer Regulation（上市审核与持续监管）与 Market Regulation
      （会员合规监督、稽查执法）两大团队，由首席监管官独立领导；FINRA 代表包括 NYSE
      在内的多个自律组织处理跨市场违规调查。这与港交所"交易所自身兼一线监管"、上交所
      "交易所+中国证券业协会"的模式都不完全相同——NYSE 是"交易所自身设专责监管部门+
      委托 FINRA 处理跨市场事务"的第三种组合，值得记入 OPEN-QUESTIONS 的受控词表讨论。
    quote: "Market Regulation also oversees the work that FINRA conducts on behalf of the NYSE Exchanges pursuant to Regulatory Services Agreements (RSAs). These matters are regularly brought as cross-market actions on behalf of multiple self-regulatory organizations, sometimes including FINRA."
    confidence: high

  clearing_regulator:
    zh: "美国证券交易委员会"
    en: "SEC"
    detail: "与市场监管为同一机构；清算机构 NSCC/DTCC 本身的监管细节本次未核实，见 OPEN-QUESTIONS。"
    confidence: medium

  core_laws:
    zh: "《1934年证券交易法》"
    en: "Securities Exchange Act of 1934"
    quote: "Section 19(b) of the Securities and Exchange Act of 1934 and Rule 19b-4 thereunder"
    confidence: high

  foreign_ownership_limit:
    zh: ""
    confidence: low
    detail: "未核实是否存在一般性外资持股限制，留空。"

  capital_controls:
    zh: "联邦层面没有一般性资本管制或外汇管制；外国对美投资受CFIUS（美国外国投资委员会）以国家安全为由的审查，审查对象是特定交易本身，不是资本跨境流动的额度或审批"
    en: "No general federal capital or foreign-exchange controls; inbound foreign investment is instead subject to national-security review by CFIUS (the Committee on Foreign Investment in the United States) on a transaction-by-transaction basis, not a capital-flow quota or approval regime"
    detail: |
      CFIUS由财政部牵头的跨部门委员会，依据《外国投资风险审查现代化法案》（FIRRMA）审查可能导致
      外国方控制美国企业的交易，以及外国人涉及美国不动产的特定交易，判断依据是国家安全影响而非
      外汇/资本管制考量；不覆盖大多数普通证券二级市场买卖。OFAC制裁名单（详见 risks.political_
      risk_note）是另一套独立机制，限制特定被制裁主体的交易对手资格，也不构成一般性资本管制。
    sources:
      - title: "The Committee on Foreign Investment in the United States (CFIUS)（美国财政部官网）"
        url: https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius
        accessed: 2026-08-24
    quote: "an interagency committee authorized to review certain transactions involving foreign investment into United States businesses and certain transactions by foreign persons involving real estate in the United States, in order to determine the effect of such transactions on the national security of the United States"
    confidence: high

  disclosure_requirements:
    zh: "披露制度以持续性定期报告为核心：资产超过1000万美元且股东超过500人的公司须提交年度与定期报告（如10-K/10-Q等），信息通过SEC的EDGAR数据库向公众公开；征集股东投票所用的委托材料（proxy materials）须在征集前向SEC备案"
    en: "Disclosure centers on ongoing periodic reporting: companies with more than $10 million in assets and more than 500 holders of record must file annual and other periodic reports, made public via the SEC's EDGAR database; proxy materials used to solicit shareholder votes must be filed with the SEC in advance of solicitation"
    detail: |
      本条概括自 investor.gov（SEC投资者教育官网）对《1934年证券交易法》信息披露条款的说明；具体
      报告语言（英文）、频率（10-K年报/10-Q季报/8-K重大事项即时披露）等细分规则未在本次抓取的
      页面中逐条核实。
      注意：本次抓取 investor.gov 该页面时返回 Akamai「Access Denied」拦截页（见 .cache/us-nyse/
      role-sec-laws-govern-securities-industry-f54da8e541.html），无法取得原文逐字核验；下方量化
      门槛（资产/股东人数）为第三方概括，非官方原文 quote，故 confidence 降为 medium，待人工提供
      原文（或换用 SEC 官方规则手册）后复核。原拟引用文本（非 verbatim 核验）："Companies with more
      than $10 million in assets whose securities are held by more than 500 owners must file annual and
      other periodic reports... proxy materials must be filed with the Commission in advance of any
      solicitation."
    sources:
      - title: "Laws That Govern the Securities Industry（Investor.gov，SEC投资者教育官网）"
        url: https://www.investor.gov/introduction-investing/investing-basics/role-sec/laws-govern-securities-industry
        accessed: 2026-08-24
    confidence: medium

  investor_protection:
    zh: "证券投资者保护公司（SIPC）为SIPC会员经纪商破产后客户账户中缺失的现金与证券提供有限保护，保护上限50万美元（含现金部分上限25万美元）；SIPC不保护证券价值下跌造成的损失，也不是针对投资建议不当的赔偿机制"
    en: "The Securities Investor Protection Corporation (SIPC) provides limited protection for missing cash and securities in a customer's account at a failed SIPC-member brokerage firm, capped at $500,000 (including a $250,000 limit for cash); SIPC does not protect against a decline in the value of securities or against losses from bad investment advice"
    detail: |
      SIPC由《1970年证券投资者保护法》设立，是会员经纪商出资的非营利公司，功能类似银行储蓄的
      FDIC存款保险，但性质不同——只保障经纪商托管环节的资产完整性（经纪商倒闭时找回客户资产），
      不承保市场价格风险。SIPC本身不是政府机构，但由国会立法设立并受SEC监督。
    sources:
      - title: "What SIPC Protects（sipc.org 官网）"
        url: https://www.sipc.org/for-investors/what-sipc-protects
        accessed: 2026-08-24
    quote: "SIPC protects against the loss of cash and securities – such as stocks and bonds – held by a customer at a financially-troubled SIPC-member brokerage firm. The limit of SIPC protection is $500,000, which includes a $250,000 limit for cash... SIPC does not protect against the decline in value of your securities."
    confidence: high

