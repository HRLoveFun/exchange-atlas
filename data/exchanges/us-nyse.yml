  suitability_management:
    zh: "经纪商向零售客户提出投资建议时，如涉及《证券交易法》15l-1规则（Regulation Best Interest，简称Reg BI），须遵守'最优利益标准'，FINRA第2111条的一般适当性规则则不适用于受Reg BI约束的建议；第2111条要求经纪商/关联人员基于对客户投资画像（年龄、财务状况、税务状况、投资目标、投资经验、时间horizon、流动性需求、风险承受力等）的合理尽职调查，有合理依据相信推荐的交易或投资策略适合该客户"
    en: "For recommendations to retail customers subject to SEA Rule 15l-1 (Regulation Best Interest, \"Reg BI\"), broker-dealers must meet the Best Interest standard, and FINRA's general suitability rule (Rule 2111) does not apply to those Reg BI-covered recommendations; Rule 2111 itself requires a firm or associated person to have a reasonable basis — based on reasonable diligence into the customer's investment profile (age, other investments, financial situation, tax status, investment objectives, experience, time horizon, liquidity needs, risk tolerance) — to believe a recommended transaction or strategy is suitable"
    detail: |
      Reg BI于2020年生效，是SEC层面对经纪商向零售客户提出证券推荐时的行为标准（取代原先较宽松的
      单纯"适当性"框架，适用范围与FINRA第2111条部分重叠但不完全等同——两套规则如何分工适用的
      细节本次未逐条核实）。第2111条列出三项具体适当性义务（合理基础适当性/客户特定适当性/量化
      适当性），本条只摘取总体要求，未逐条展开三项子义务。
    sources:
      - title: "Suitability（finra.org 官网，Key Topics）"
        url: https://www.finra.org/rules-guidance/key-topics/suitability
        accessed: 2026-08-24
    quote: "FINRA Rule 2111 does not apply to recommendations subject to SEA Rule 15l-1 (Regulation Best Interest)... FINRA Rule 2111 requires that a firm or associated person have a reasonable basis to believe a recommended transaction or investment strategy involving a security or securities is suitable for the customer. This is based on the information obtained through reasonable diligence of the firm or associated person to ascertain the customer's investment profile... the customer's investment profile \"includes, but is not limited to, the customer's age, other investments, financial situation and needs, tax status, investment objectives, investment experience, investment time horizon, liquidity needs [and] risk tolerance\""
