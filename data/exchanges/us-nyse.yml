  # SEC 交易所实体，属于同一集团（group_id: nyse-group）但不是同一实体的板块——这是
  # 与前两家标杆结构性不同之处，记入 OPEN-QUESTIONS。
  boards: []

  review_system:
    zh: "披露为本（非注册制/核准制二分），设有量化+定性双重上市标准，由Issuer Regulation团队审核"
    detail: |
      与上交所"注册制"、港交所"披露为本但上市委员会有实质审核权"都不完全相同——NYSE
      的量化标准非常具体（按规则编号逐条列出，如Rule 102.01C(I)盈利测试、102.01C(II)
      市值测试），另有定性标准赋予交易所较大裁量权。这是受控词表"够不够用"问题的第三个
      真实案例（继上交所注册制、港交所披露为本之后），已记入 OPEN-QUESTIONS。
    sources:
      - title: Initial Listings（官网）
        url: https://www.nyse.com/regulation/initial-listings
        accessed: 2026-08-13
    quote: "The Exchange has broad discretion regarding the listing of a company. All listed companies must comply with the Exchange's corporate governance standards of Section 3 of the NYSE Listed Company Manual. In addition, companies must meet other qualitative criteria including but not limited to being suitable for auction market trading and maintaining a healthy level of financial liquidity."
    confidence: high

  listing_process_duration:
    zh: ""
