    en: "Rule 201 of Regulation SHO (the \"Alternative Uptick Rule\" / short sale circuit breaker): once a covered security's price declines 10% or more intraday from its prior day's regular-trading-hours closing price, a circuit breaker is triggered, and for the remainder of that day and the following day, trading centers must prevent execution or display of a short sale order at a price at or below the current national best bid"
