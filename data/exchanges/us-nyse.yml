  major_outage_history:
    zh: "2023年1月24日，NYSE因关键系统故障（主用交易系统与备用交易系统同时运行导致系统误判开盘集合竞价已完成）未能为2,824只NYSE上市证券执行开盘集合竞价、转为直接连续交易，引发价格触发型交易限制、84只证券的市场级交易暂停及数千笔交易被取消；SEC于2026年3月认定NYSE违反Regulation SCI（系统合规与完整性条例）第1001(a)(2)(vii)条及《证券交易法》第19(g)(1)条，NYSE同意支付900万美元民事罚款，此前已向会员机构支付超过577万美元的相关索赔"
    en: "On January 24, 2023, NYSE failed to run opening auctions for 2,824 NYSE-listed securities — instead initiating continuous trading for them — due to a critical systems disruption (its backup trading system remained running alongside the primary system after planned maintenance, causing the primary system to incorrectly treat the opening auctions as having occurred); this caused price-triggered trading restrictions, market-wide trading pauses in 84 securities, and thousands of busted trades. In March 2026 the SEC found NYSE violated Rule 1001(a)(2)(vii) of Regulation SCI and Exchange Act Section 19(g)(1), and NYSE agreed to pay a $9,000,000 civil penalty, having already paid over $5.77 million to member organizations for related claims"
    detail: |
