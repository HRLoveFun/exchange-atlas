    en: "Delisted shares generally move to over-the-counter (OTC) trading: SEC official investor materials state that resumption of OTC quotation after a suspension requires a broker-dealer to review company information under Exchange Act Rule 15c2-11 and file a Form 211 with FINRA — i.e. the OTC market is where delisted shares continue trading; NYSE's own delistings page covers only the Form 25 removal process (see transfer_between_boards quote) — post-delisting venues are outside its scope"
