      zh: "实物交割为主：行权或被指派的结果是标的股份的取得或交付——每张标准股票期权对应标的证券100股，任一营业日提交的行权通知于行权后第一个营业日（T+1）交付标的股票；个别产品为现金结算（如 NYSE 官网 Options Trading 信息列示的 Cash-Settled FLEX ETF Options——经批准以现金结算为灵活条款的类别），与股票期权实物交割为默认的主线不同"
