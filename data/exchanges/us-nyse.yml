      quote: "A QCC Order must be comprised of an originating order to buy or sell at least 1,000 contracts that is identified as being part of a qualified contingent trade coupled with a contra-side order or orders totaling an equal number of contracts. If a QCC has more than one option leg (a “Complex QCC Order”), each option leg must have at least 1,000 contracts. A QCC Order that is not rejected per paragraph (g)(1)(C) or (D) below will immediately trade in full at its price, does not route, and may be entered with an MPV of $0.01 regardless of the MPV of the options series."
