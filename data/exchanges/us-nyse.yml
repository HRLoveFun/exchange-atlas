      en: "Not differentiated by board — LULD price bands are tiered as Tier 1 (S&P 500 / Russell 1000 / selected ETPs) and Tier 2 (all other NMS securities), by index membership rather than by listing board; NYSE American / NYSE Arca etc. are separately registered exchange entities within the group and outside this record's scope (see main_board / type)"
