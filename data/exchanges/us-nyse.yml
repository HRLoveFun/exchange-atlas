  foreign_access_channel:
    zh: "美国证券市场对外资无一般性准入限制与额度审批：境外投资者可直接在美国券商开立账户买卖 NYSE 上市证券；联邦层面的外资审查制度只覆盖一小部分可能危及国家安全的具体入境交易，公开市场证券的普通组合投资不在其列"
    en: "The U.S. securities market imposes no general restrictions or quota approvals on foreign investors: overseas investors may open accounts directly with U.S. broker-dealers to trade NYSE-listed securities; the federal foreign-investment review regime covers only a small share of inbound transactions that may pose a national-security risk, not ordinary portfolio purchases of publicly traded securities"
    detail: |
      由 low 坐实：官方口径出自国会研究服务处（CRS）《Foreign Direct Investment: Background and Issues》
      （IF10636.11）——「Traditionally, the United States has supported a rules-based and open investment
      environment」（开放投资环境的官方表述）与「the United States maintains a foreign investment review
      regime to review a small share of inbound transactions that may pose a risk to U.S. national security」
      （外资审查仅覆盖一小部分入境交易）两句均已在落盘 PDF 中逐字核对，quote 取后一句。
      「公开市场证券的普通组合投资不在其列」的推断依据：同报告明确区分 FDI 与组合投资——
