      6日），是本次会话通过突破sec.gov反爬直接拿到的一手监管文件，非新闻转述。2015年7月8日
      NYSE因技术故障全天停牌约3.5小时的更早期事件，本次未找到同等权威的官方文件原文，未纳入
      本条。
    sources:
      - title: "SEC Administrative Proceeding File No. 3-22608, In the Matter of New York Stock Exchange LLC（sec.gov 官方处罚令PDF）"
        url: https://www.sec.gov/files/litigation/admin/2026/34-104934.pdf
        accessed: 2026-08-24
    quote: "This matter arises out of a January 24, 2023 event in which NYSE failed to run opening auctions for 2,824 NYSE-listed securities (\"the 2,824 Securities\") due to a critical systems disruption. Instead, NYSE initiated continuous trading for those securities. NYSE's failures caused market-wide impacts, including price-triggered restrictions on trading, market-wide trading pauses in 84 of the securities, and ultimately thousands of busted trades... Respondent shall, within 14 days of the entry of this Order, pay a civil money penalty in the amount of $9,000,000.00"
    confidence: high

