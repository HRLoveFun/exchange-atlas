        url: https://www.everycrsreport.com/reports/RL32266.html
        accessed: 2026-09-05
    quote: "No major industrialized nation has adopted a broad-based transaction tax. At the federal level one of the historical examples of a transaction tax was a stock transfer tax (STT) effective from 1914 to 1966."
