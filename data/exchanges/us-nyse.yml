  fx_risk_note:
    zh: "美元为全球主要储备货币，本币汇率风险对美国本土投资者而言较低；对以美元计价资产的境外投资者而言，汇率风险来自其本币兑美元波动"
    en: "USD is the world's primary reserve currency; domestic FX risk is low for U.S.-based investors. For foreign investors holding USD-denominated assets, FX risk arises from their home currency's fluctuation against the USD"
    confidence: low

  political_risk_note:
    zh: "对特定外国（尤其中国大陆/香港）发行人而言，存在因《外国公司问责法》（HFCAA）触发的强制退市/停止交易政治风险：若SEC认定某发行人连续三年由PCAOB无法完成检查的会计师事务所出具审计报告，SEC将禁止其证券在美国全国性证券交易所或场外市场交易；此外OFAC经济制裁名单也会限制特定被制裁主体的证券交易资格，这两类风险独立于交易所自身监管框架，源自更广泛的美国对外政策与国家安全立法"
    en: "For certain foreign issuers (particularly those based in mainland China/Hong Kong), there is a political/legislative delisting risk under the Holding Foreign Companies Accountable Act (HFCAA): if the SEC determines an issuer has filed audit reports from a PCAOB-uninspectable accounting firm for three consecutive years, the SEC must prohibit the securities from trading on a national securities exchange or OTC market in the U.S.; separately, OFAC sanctions lists restrict trading eligibility for specific sanctioned parties — both risks arise from broader U.S. foreign-policy and national-security legislation independent of the exchange's own regulatory framework"
    detail: |
      HFCAA于2020年12月18日签署成法，起因是PCAOB此前无法检查中国大陆/香港注册会计师事务所出具的
      审计底稿；2021年12月2日SEC通过最终实施细则。触发交易禁令需要连续三年被认定为"Commission-
      Identified Issuer"，最早可能的禁令生效时点本次未逐条核实标注具体年份。该风险对本文件
      regulation.core_laws所述SEC监管框架构成延伸，但触发机制来自HFCAA这部专门立法而非交易所
      自身规则。
    sources:
      - title: "SEC Adopts Amendments to Finalize Rules Relating to the Holding Foreign Companies Accountable Act（sec.gov 官方新闻稿 2021-250）"
        url: https://www.sec.gov/newsroom/press-releases/2021-250
        accessed: 2026-08-24
    quote: "The Securities and Exchange Commission today adopted amendments to finalize rules implementing the submission and disclosure requirements in the Holding Foreign Companies Accountable Act (HFCAA). The rules apply to registrants the SEC identifies as having filed an annual report with an audit report issued by a registered public accounting firm that is located in a foreign jurisdiction and that the Public Company Accounting Oversight Board (PCAOB) is unable to inspect or investigate (Commission-Identified Issuers)."
    confidence: high

  liquidity_risk_note:
    zh: "美股整体呈现高度分散化的多元交易场所格局，非展示型订单（non-displayed order types）约占交易所内成交量的11%–14%；学术研究发现暗池/非展示交易占比存在一个'临界点'（有研究估计约46.7%），超过该临界点后继续分散化交易场所可能损害价格发现与整体市场质量，但截至相关SEC讨论撰写时尚未观察到已越过该临界点的证据"
    en: "U.S. equity trading is highly fragmented across a growing web of venues; non-displayed order types account for roughly 11%–14% of exchange-based volume. Academic research has identified a potential \"tipping point\" for dark/non-displayed trading (one study estimated around 46.7%) beyond which further fragmentation could impair price discovery and overall market quality, though the SEC noted that available evidence at the time of writing did not show that threshold had yet been crossed"
    detail: |
      来源为SEC官方演讲稿《U.S. Equity Market Structure: Making Our Markets Work Better for
      Investors》，是对市场结构性流动性风险（而非NYSE单一机构流动性）的整体性讨论，反映的是
      美股市场整体格局而非NYSE特有情况；具体发表时间与演讲人本次未逐条核实标注。
    sources:
      - title: "U.S. Equity Market Structure: Making Our Markets Work Better for Investors（sec.gov 官方演讲稿）"
        url: https://www.sec.gov/newsroom/speeches-statements/us-equity-market-structure
        accessed: 2026-08-24
    quote: "non-displayed order types are the most commonly used order types on exchanges, and these order types may account for as much as 11% to 14% of exchange-based volume... This study found that 46.7% could be the tipping point for all stocks... while there may come a point when dark venues capture too much order flow, the evidence currently available to us suggests that we have not yet crossed that threshold."
    confidence: high

  regulatory_change_risk_note:
    zh: "美国证券监管规则处于持续演进状态，且改动经常直接影响交易/结算机制本身：例如2024年5月28日起证券结算周期从T+2缩短至T+1（见clearing.settlement_cycle）；SEC对交易所的Section 31监管费费率逐年（有时逐半年）重新核定（见costs.regulatory_fees）；针对特定外国发行人的HFCAA强制退市立法2020年通过、2021年实施细则落地（见political_risk_note）。交易所自身规则的任何新增/修订也须按《证券交易法》第19(b)条向SEC备案并经批准（见regulation.core_laws），意味着规则变更节奏部分取决于SEC自身的审批流程而非交易所单方面决定"
    en: "U.S. securities regulation is in continuous flux, with changes that often directly reshape trading/settlement mechanics: e.g., the settlement cycle shortened from T+2 to T+1 effective May 28, 2024 (see clearing.settlement_cycle); the SEC's Section 31 fee rate on exchanges is re-set annually, sometimes semi-annually (see costs.regulatory_fees); the HFCAA's forced-delisting regime for certain foreign issuers was enacted in 2020 with implementing rules finalized in 2021 (see political_risk_note). Any new or amended exchange rule must itself be filed with and approved by the SEC under Exchange Act Section 19(b) (see regulation.core_laws), meaning the pace of rule change partly depends on the SEC's own approval process rather than the exchange acting unilaterally"
    detail: "本条为综合本文件其他章节已核实事实的归纳性风险陈述，三条来源分别对应T+1结算周期改革、Section 31费率年度调整、HFCAA立法节点三个具体例证，quote留空（避免拼接多份文档制造看似统一实则跨文档的引文，见 SKILL.md 第4步第6条）；具体量化的'年度规则变更数量'等统计本次未核实。"
    sources:
      - title: "One-Day Settlement Cycle (T+1) To Begin May 28, 2024（Cahill Gordon & Reindel LLP 客户简报）"
        url: https://www.cahill.com/publications/client-alerts/2024-04-29-one-day-settlement-cycle-t-1-to-begin-may-28-2024
        accessed: 2026-08-13
      - title: "Section 31 Transaction Fee Rate Advisory for Fiscal Year 2026（sec.gov 官方费率公告）"
        url: https://www.sec.gov/rules-regulations/fee-rate-advisories/2026-2
        accessed: 2026-08-24
      - title: "SEC Adopts Amendments to Finalize Rules Relating to the Holding Foreign Companies Accountable Act（sec.gov 官方新闻稿 2021-250）"
        url: https://www.sec.gov/newsroom/press-releases/2021-250
        accessed: 2026-08-24
    confidence: medium

  enforcement_note:
    zh: "NYSE Regulation下设监察调查组（Surveillance and Investigations）与执法组（Enforcement），后者可通过和解（AWC）或诉讼程序对会员及其关联人员进行纪律处分，重大案件可能移交FINRA听证办公室审理"
    en: "Surveillance and Investigations; Enforcement (settlements or litigated proceedings)"
    quote: "The Enforcement group investigates potentially violative conduct that may merit formal disciplinary action. When appropriate, Enforcement will take formal disciplinary action through either settlements (i.e., AWCs) or litigated proceedings, all of which are public. Litigated matters may proceed to a contested hearing before FINRA's Office of Hearing Officers (OHO), which hears the matter and issues a decision."
    sources:
