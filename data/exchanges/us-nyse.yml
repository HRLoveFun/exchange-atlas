  financial_transaction_tax:
    spec: {type: none, note: "联邦层面无普遍证券交易税；1914–1966 转让税已废止；现存 SEC 发行/转让小额规费（约 0.0033%）性质近监管经费"}
    zh: "联邦层面没有对证券买卖普遍征收的金融交易税；历史上1914–1966年曾对股票发行与转让征收印花性质的转让税（1966年税率为发行0.1%、转让0.04%），该税种已废止。目前联邦仍保留一项与SEC经费挂钩的证券发行/转让小额收费（费率约发行0.028%、转让0.0033%），性质更接近监管经费而非普遍性交易税，与本文件costs.regulatory_fees所述SEC第31条交易费属同一类别的不同计费环节"
    en: "There is no broad-based federal financial transaction tax on securities trading; a federal stock transfer tax existed from 1914 to 1966 (rates of 0.1% on issuance and 0.04% on transfer by the time of repeal), since abolished. A small residual federal charge on share issuance/transfer tied to funding SEC operations still exists (roughly 0.028% on issuance, 0.0033% on transfer) — this is more akin to a regulatory funding fee than a general transaction tax, and sits in the same category as the Section 31 fee described under costs.regulatory_fees"
    detail: |
      来源是国会研究服务处（CRS）2004年报告《Transaction Tax: General Overview》，经非营利机构
      everycrsreport.com托管（第三方镜像站，非congress.gov官方页面本身——本次尝试直接抓取
      congress.gov两次均返回403，退而求其次用该镜像，按CLAUDE.md第三方来源上限medium处理）。
      报告本身发布于2004年，"目前"（at the present time）指报告写作时点，具体费率是否有后续
      变化未在本次逐条核实，纽约州层面历史上曾有独立的股票转让税（现已100%返还实质失效）本次
      也未纳入，留待后续补充。
    sources:
      - title: "Transaction Tax: General Overview（CRS Report RL32266，everycrsreport.com 镜像托管）"
        url: https://www.everycrsreport.com/reports/RL32266.html
        accessed: 2026-08-24
    quote: "one of the historical examples of a transaction tax was a stock transfer tax (STT) effective from 1914 to 1966. In 1966 the rates were 0.1% at security issuance and 0.04% on transfer. At the present time the federal government still levies a small tax on share issuance and transfers at the rates of 0.028% and 0.0033%, respectively, for the primary purpose of financing the activities of the Securities and Exchange Commission (SEC)."
