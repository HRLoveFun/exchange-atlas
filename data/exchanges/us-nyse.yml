      zh: "交易端保证金（OCC 最低客户保证金要求，经会员经纪商执行）：买入9个月以内到期的认沽/认购期权须全额付清权利金——期权买方不融资、不缴保证金；无备兑（uncovered）期权卖方须存入并维持「100%期权权利金收入 + 20%标的合约总值（标的现价×$100）−期权虚值额（如有）」，其中认购的最低要求为权利金+10%合约总值、认沽的最低要求为权利金+10%行权价总值；计算维持保证金时以期权当前市值替代权利金收入。OCC 对清算会员层级的保证金方法论（STANS）见 clearing.derivatives"
