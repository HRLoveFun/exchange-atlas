      quote: "Unit of Trade: Each standard contract represents 100 shares of the underlying equity. ... Exercise or assignment of equity options results in acquisition or delivery of the underlying shares. ... Exercise notices tendered on any business day will result in delivery of the underlying stock on the first (T+1) business day following exercise."
