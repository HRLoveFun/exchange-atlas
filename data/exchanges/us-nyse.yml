    en: "No federal stamp duty on securities transactions: no broad-based federal stamp-duty instrument applies to securities trades in the U.S. — the federal transaction-stage levies on record are the historical stock transfer tax and the current small SEC fees; the federal transaction-tax history (the 1914–1966 stock transfer tax and the current small SEC-related fees) is covered under the financial_transaction_tax field, which uses the same source and judgment basis"
    detail: "原留空记录中的『与上交所 0.05% 单边、港交所 0.1% 双边对比』仍成立且已在相应交易所字段坐实；美国联邦层面对交易征税的正面依据与 financial_transaction_tax 共用 CRS RL32266。州层面（如纽约州历史上）的转让税本次未单独核实，不写入 zh。"
    sources:
