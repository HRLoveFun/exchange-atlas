      note: "核心时段内、受 LULD 计划约束的 NMS 股票原则上不可复核（LULD 价格带已阻止极端价成交）；仅在 LULD 带不可用、交易所系统故障致带外成交、监管停牌后成交、或参考价因公司行动/新股/暂停恢复而错误等情形可复核。适用数值门槛按参考价分档：≤$25 为 10%、$25.01–$50 为 5%、>$50 为 3%（盘前时段翻倍）。裁定成立即宣告成交无效并从合并行情带移除，股票市场不作调价"
    zh: "「明显错误」成交（价格、股数、证券识别等任一要素明显有误）可由会员在成交后 30 分钟内书面申请复核；officer 裁定成立者宣告该笔成交无效（null and void）并从合并行情带（Consolidated Tape）移除。核心交易时段内受 LULD 计划约束的股票通常不予复核，仅限 LULD 带不可用、系统故障带外成交、监管停牌后成交或参考价错误等例外；适用数值门槛为偏离参考价 10%（参考价 $0.00–$25.00）、5%（$25.01–$50.00）、3%（>$50.00）"
    en: "A 'clearly erroneous' execution (an obvious error in any term such as price, number of shares or identification of the security) may be challenged in writing by a member organization within 30 minutes of execution time; if an Exchange Officer finds it clearly erroneous the transaction is declared null and void and removed from the Consolidated Tape. During the Core Trading Session, transactions in stocks subject to the LULD Plan are generally not reviewable — review is limited to cases where the LULD bands were unavailable, a systems issue produced a trade outside the bands, the trade followed a regulatory halt, or the reference price was erroneous. Where the Numerical Guidelines apply, a trade is clearly erroneous if it deviates from the Reference Price by 10% (Reference Price $0.00–$25.00), 5% ($25.01–$50.00) or 3% (over $50.00)"
    detail: "NYSE Rule 7.10（Clearly Erroneous Executions）。与 trading_halt_mechanism（盘中停牌 / 复牌）视角不同。美国股票 CEE 只作废、不调价（期权市场才有调价选项）。officer 裁定可上诉至 Clearly Erroneous Execution Panel，但 LULD 带外成交的裁定不可上诉。quote 引自 SR-NYSE-2022-38 Exhibit 5（原文含增删标记，此处摘无标记的连续片段）。"
    sources:
    - {title: "Rules of New York Stock Exchange LLC — Rule 7.10 (Clearly Erroneous Executions)，SEC filing SR-NYSE-2022-38 Exhibit 5", url: "https://www.sec.gov/files/rules/sro/nyse/2022/34-95822-ex5.pdf", accessed: 2026-08-30}
    quote: "the terms of a transaction executed on the Exchange are “clearly erroneous” when there is an obvious error in any term, such as price, number of shares or other unit of trading, or identification of the security. ... Requests for review must be received by the Exchange within 30 minutes of execution time ... If the execution time of the transaction(s) under review is during the Core Trading Session, the transaction will not be reviewable as clearly erroneous unless the transaction: A. is in an NMS Stock that is not subject to the Plan to Address Extraordinary Market Volatility ... Between $0.00 and $25.00 10% ... Between $25.01 and $50.00 5% ... Greater than $50.00 3% ... In the event that the Officer determines that the transaction in dispute is clearly erroneous, the Officer will declare the transaction null and void."
