      quote: "Market Makers. A Market Maker must provide continuous two-sided quotations throughout the trading day in its appointed issues for 60% of the time the Exchange is open for trading in each issue. Such quotations must meet the legal quote width requirements of Rule 925NY. These obligations will apply to all of the Market Maker's appointed issues collectively, rather than on an issue-by-issue basis. Compliance with this obligation will be determined on a monthly basis. ... Firm Quotes. A Market Maker will be compelled to buy/sell a specified quantity of option contracts at the disseminated bid/offer pursuant to his obligations under Rule 970NY."
