regulation:
  _meta:
    verified: 2026-08-13
    sources:
      - title: NYSE Regulation（官网）
        url: https://www.nyse.com/regulation
        accessed: 2026-08-13
    confidence: high

  regulator:
    zh: "美国证券交易委员会"
    en: "U.S. Securities and Exchange Commission (SEC)"
    detail: "NYSE 规则的任何新增或修订都须依据《1934年证券交易法》第19(b)条向SEC备案（Rule 19b-4），经批准后方可生效。"
    quote: "As a registered securities exchange, NYSE is subject to the regulatory oversight of the SEC and all rules and amendments must be filed with and approved by the SEC pursuant to Section 19(b) of the Securities and Exchange Act of 1934 and Rule 19b-4 thereunder."
    confidence: high

  self_regulatory_org:
    zh: "NYSE Regulation（交易所自身的一线监管部门）；金融业监管局（FINRA）按监管服务协议代为执行部分跨市场执法工作"
    en: "NYSE Regulation; FINRA (via Regulatory Services Agreements)"
    detail: |
      NYSE Regulation 下设 Issuer Regulation（上市审核与持续监管）与 Market Regulation
      （会员合规监督、稽查执法）两大团队，由首席监管官独立领导；FINRA 代表包括 NYSE
      在内的多个自律组织处理跨市场违规调查。这与港交所"交易所自身兼一线监管"、上交所
      "交易所+中国证券业协会"的模式都不完全相同——NYSE 是"交易所自身设专责监管部门+
      委托 FINRA 处理跨市场事务"的第三种组合，值得记入 OPEN-QUESTIONS 的受控词表讨论。
    quote: "Market Regulation also oversees the work that FINRA conducts on behalf of the NYSE Exchanges pursuant to Regulatory Services Agreements (RSAs). These matters are regularly brought as cross-market actions on behalf of multiple self-regulatory organizations, sometimes including FINRA."
    confidence: high

  clearing_regulator:
    zh: "美国证券交易委员会"
    en: "SEC"
    detail: "与市场监管为同一机构；清算机构 NSCC/DTCC 本身的监管细节本次未核实，见 OPEN-QUESTIONS。"
    confidence: medium

  core_laws:
    zh: "《1934年证券交易法》"
    en: "Securities Exchange Act of 1934"
    quote: "Section 19(b) of the Securities and Exchange Act of 1934 and Rule 19b-4 thereunder"
    confidence: high

