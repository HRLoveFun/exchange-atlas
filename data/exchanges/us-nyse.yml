    quote: "On May 31, 2012, the SEC approved, on a pilot basis, a National Market System Plan, known as the Limit Up/Limit Down (\"LULD\") Plan, to address extraordinary market volatility. The Plan was approved as a permanent rule on April 11, 2019."
