  execution_model:
    enum: hybrid
    spec: {electronic: true, dealer_intermediated: true, note: "中央电子限价订单簿（NYSE Pillar）连续撮合 + 每支上市股票一名指定做市商（DMM）主持开盘/收盘集合竞价并在严重失衡/不稳定期间提供流动性与价格发现"}
    zh: "混合模式：以中央电子限价订单簿（NYSE Pillar）连续撮合为主，叠加指定做市商（DMM）制度——每支股票指定一名 DMM 负责开盘、收盘及严重失衡期间的价格发现"
    en: "Hybrid: a central electronic limit order book (NYSE Pillar) with continuous matching, overlaid with the Designated Market Maker (DMM) system — each listed stock has one assigned DMM that facilitates price discovery at the open, at the close and during periods of substantial imbalance or instability"
    detail: "enum 依据既有 market_maker_scheme（DMM，confidence high）与 opening_mechanism / closing_mechanism（均 dmm_auction）的已核实 quote 综合判定：DMM 承担实质做市与价格发现职能，故归 hybrid 而非纯 order_driven。matching_principle（价格-时间优先）是订单簿内部的成交优先级细化，与本字段是两个层次。"
    sources:
    - {title: "NYSE Listings Process & Requirements（官网）", url: "https://www.nyse.com/listings-process", accessed: 2026-08-13}
    quote: "Your DMM will facilitate price discovery for your stock during market opens, closes and during periods of substantial trading imbalances or instability."
    confidence: medium

  matching_principle:
    enum: price_time
    zh: "开盘/收盘由DMM主持的集合竞价撮合，盘中为电子连续竞价撮合（NYSE Pillar系统）"
    en: "DMM-facilitated auctions at open/close; continuous electronic matching intraday via NYSE Pillar"
    detail: "未找到对撮合优先顺序（价格优先/时间优先等）逐条说明的官方原文，本条为对整体机制的归纳，非逐字摘引。"
    confidence: medium

  order_types:
    spec:
      market: true
      limit: true
      iceberg: true
      hidden: true
      pegged: true
      tif: [day, ioc]
      note: "NYSE Pillar 订单类型（Rule 7.31）：限价单 / 市价单为基础；Reserve Order（部分显示 + 隐藏储备量）承担冰山功能；Non-Displayed Limit Order 与 Mid-Point Liquidity (MPL) Order 为全隐藏；Pegged Order 盯住 PBBO；有效期以 Day 为主，IOC 为常用修饰符；开盘/收盘另有 LOO/LOC 及 D-Order。GTC 类跨日单在 Pillar 迁移后由券商端维护"
    zh: "主要订单类型（Rule 7.31 Orders and Modifiers）：限价单（Limit Order）、市价单（Market Order）、非显示限价单（Non-Displayed Limit Order）、中点流动性单（MPL Order）、储备单（Reserve Order，部分显示 + 隐藏储备量）、盯住单（Pegged Order）；修饰符含 IOC、ALO（仅添加流动性）；开盘/收盘专用 LOO/LOC 及 D-Order"
