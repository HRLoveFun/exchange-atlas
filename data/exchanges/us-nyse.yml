      zh: "做市商制度（NYSE American 期权）：Market Maker 须在其任期的期权类别上提供持续双边报价，时间为交易所对每个类别开盘交易时间的60%（按月考核、对其全部任期类别集合适用），报价须满足 Rule 925NY 的法定报价宽度要求；做市商可被交易官要求对特定系列提交单一报价或维持持续报价，并对其发布的买卖报价负有强制成交义务（firm quotes）；NYSE 官网另按类别公布 NYSE Arca Options 的 LMM 名单（Arca 侧为 Lead Market Maker 制，义务条文本次未逐条核实）"
      en: "Market Maker scheme (NYSE American options): Market Makers must provide continuous two-sided quotations throughout the trading day in their appointed issues for 60% of the time the Exchange is open for trading in each issue (assessed monthly, applied collectively across all appointed issues), meeting the legal quote width requirements of Rule 925NY; Market Makers may be called upon by a Trading Official to quote specific series and are compelled to buy/sell a specified quantity at their disseminated bid/offer (firm quotes); NYSE also publishes per-class LMM lists for NYSE Arca Options (Arca runs a Lead Market Maker scheme, whose obligations were not verified in detail this session)"
      sources:
