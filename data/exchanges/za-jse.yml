  settlement_cycle:
    enum: t3
    zh: "T+3（2016年起，此前为T+5）：卖方交付证券换取现金（DvP），买方支付现金换取证券（RvP），经JSE指定的中央证券存管机构Strate处理，实现同步、终局、不可撤销的券款对付（SFIDvP）"
    en: "T+3 (since 2016, down from T+5): sellers deliver securities against cash receipt (DvP) and buyers receive securities against cash payment (RvP), processed through Strate (the JSE-appointed CSD), achieving simultaneous, final, irrevocable delivery versus payment (SFIDvP)"
    sources:
      - title: Equity Market Risk Management（jse.co.za，T+3结算说明页）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
      - title: History | Explore the Legacy of JSE Group（group.jse.co.za，确认2016年生效日期）
        url: https://group.jse.co.za/group-overview/history
        accessed: 2026-08-16
    quote: "On T+3, settlement of cash equities transactions take place, i.e. sellers deliver securities in exchange for cash receipt (DvP), and buyers receive securities in exchange for cash payments (RvP), which is processed through the JSE appointed CSD, Strate, and which achieves simultaneous, final, irrevocable delivery versus payment (SFIDvP). ... 2014 2016 The JSE moves to a T+3 settlement cycle"
    confidence: high

  ccp_name:
    zh: "现货证券市场无传统意义上的中央对手方净额担保安排，而是由JSE结算权威机构（JSE Settlement Authority）通过多层结算保障机制（\"防线\"：会员准入门槛、每日资本充足监控、CSDP承诺、保证金、违约处置流程）提供结算保障，非CCP novation模式；衍生品市场则设有独立的中央对手方JSE Clear（JSE全资子公司，2022年9月1日起持有FSCA/PA/SARB联合颁发的独立结算所与CCP牌照）"
    en: "The cash equity market has no traditional CCP novation arrangement — instead, the JSE Settlement Authority provides settlement assurance through multiple \"lines of defence\" (membership entry requirements, daily capital-adequacy monitoring, CSDP commits, margin, default-management process). Derivatives markets instead have a dedicated CCP, JSE Clear (a wholly owned JSE subsidiary, licensed as an independent clearing house and CCP by the FSCA jointly with the PA/SARB since 1 September 2022)"
    detail: "这是本项目在 de-eurex（衍生品无\"公司上市\"概念）之后又一个字段设计前提与实际制度不完全吻合的案例：taxonomy 的 ccp_name 隐含假设\"存在单一CCP\"，但JSE现货与衍生品两个市场的清算安排结构性不同，如实分别说明比单填一个机构名更准确。"
    sources:
      - title: Equity Market Risk Management（jse.co.za）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
      - title: JSE Clear Granted Clearing House & CCP Licence（jse.co.za 新闻稿，2022年9月1日）
        url: https://www.jse.co.za/news/news/jse-clear-granted-independent-clearing-house-central-counterparty-licence
        accessed: 2026-08-16
    quote: "The JSE provides settlement assurance for central order book trades in the cash equity market and employs various measures to affect this. ... JSE Clear, its wholly owned subsidiary, has been granted a licence to operate as an Independent Clearing House and Central Counterparty (CCP) by the Financial Sector Conduct Authority (FSCA) ... Published 01 Sep 2022"
    confidence: high

  csd_name:
    zh: "证券存管中心Strate Limited，南非法定的中央证券存管机构与中央质押品平台"
    en: "Strate Limited, South Africa's principal central securities depository (CSD) and central collateral platform"
    sources:
      - title: "South Africa's principal CSD（strate.co.za）"
        url: https://www.strate.co.za/about-us/
        accessed: 2026-08-16
    quote: "Strate is South Africa's principal central securities depository and central collateral platform."
    confidence: high

  initial_margin_practice:
    zh: "针对现货证券交易的结算保障金：JSE要求会员在T+2（按T+1收盘时点计算）就其撮合成交、存在未结算风险的全部交易向JSE存入结算保证金"
    en: "For cash equity settlement assurance: the JSE requires members to deposit settlement margin on T+2 (calculated at the T+1 end of day) for all transactions they introduced that carry settlement risk"
    sources:
      - title: Equity Market Risk Management（jse.co.za）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
    quote: "The JSE requires members to deposit settlement margin with the JSE on T+2 (calculated at EOD T+1) for all transactions that they have introduced to the market and which pose a risk of not settling."
    confidence: high

  maintenance_margin_practice:
    zh: "现货证券市场（现金交易）不存在与衍生品对应的「维持保证金」概念：JSE 结算权威机构通过 T+2 结算保证金 + 多层违约处置防线（会员准入、资本充足监控、CSDP 承诺、保证金、违约管理）保障结算，而非对现货持仓逐日追缴维持保证金；维持/变动保证金机制仅适用于 JSE Clear 清算的衍生品（见 clearing.derivatives.maintenance_margin_practice）。"
    en: "The cash equity market has no 'maintenance margin' concept akin to derivatives: the JSE Settlement Authority assures settlement via T+2 settlement margin plus the multi-layer default-management framework, rather than daily maintenance-margin top-ups on spot positions; maintenance/variation margin applies only to JSE Clear-cleared derivatives (see clearing.derivatives.maintenance_margin_practice)."
    sources:
      - title: Equity Market Risk Management（jse.co.za，现金市场结算保障机制说明页）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
    confidence: medium
    detail: "顶层字段按 ADR-023 收窄为描述现货/主板市场；现金市场无逐日盯市追缴，故本字段定性为「不适用现货」，相关机制归入衍生品子块。"

  mark_to_market_frequency:
    zh: "现货证券（现金权益）交易不适用逐日盯市保证金机制：成交后按 T+3 通过 Strate 结算，仅在 T+2 计收结算保证金以覆盖未结算风险，不对现货持仓按日重估追缴；逐日盯市仅适用于 JSE Clear 清算的衍生品持仓（每个营业日 17:00，见 clearing.derivatives.mark_to_market_frequency）。"
    en: "Cash equity trades are not subject to daily mark-to-market margin: they settle T+3 through Strate, with a T+2 settlement margin collected only to cover unsettled risk, and no daily revaluation of spot positions; daily mark-to-market applies only to JSE Clear-cleared derivatives (at 17:00 each business day, see clearing.derivatives.mark_to_market_frequency)."
    sources:
      - title: Equity Market Risk Management（jse.co.za，现金市场结算保障机制说明页）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
    confidence: medium
    detail: "同 maintenance_margin_practice，顶层字段描述现货市场，cash 无 MTM，机制在衍生品子块。"

  delivery_method:
    enum: na
    zh: "现货证券交割为无纸化记账过户（经Strate电子结算），不适用实物/现金交割二选一；衍生品部分另见 clearing.derivatives.delivery_method"
    en: "Cash equities settle via dematerialised book-entry transfer through Strate — not applicable to a physical/cash delivery choice; for derivatives see clearing.derivatives.delivery_method"
    detail: "ADR-023 新增 clearing.derivatives 子块后，顶层字段收窄为仅描述现货市场；衍生品各品种的实物/现金交割方式本次未逐条核实，移入新子块留空，见 OPEN-QUESTIONS。与 settlement_cycle 字段引用同一份来源。"
    sources:
      - title: Equity Market Risk Management（jse.co.za，T+3结算说明页）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
    quote: "sellers deliver securities in exchange for cash receipt (DvP), and buyers receive securities in exchange for cash payments (RvP)"
    confidence: medium

  last_trading_day_rule:
    zh: "「最后交易日」是衍生品（期货/期权）概念，现货证券无到期日，故不适用；JSE 现货股票在被除牌前持续交易，相关到期/最后交易日规则见 clearing.derivatives.last_trading_day_rule（以 ALSI 股指期货为例：三月、六月、九月、十二月第三个星期四）。"
    en: "'Last trading day' is a derivatives (futures/options) concept; cash equities have no expiry and therefore do not apply — JSE listed shares trade continuously until delisted. The last-trading-day rule for derivatives is in clearing.derivatives.last_trading_day_rule (e.g. ALSI: third Thursday of Mar/Jun/Sep/Dec)."
    sources:
      - title: Equity Market Risk Management（jse.co.za，现金市场结算保障机制说明页）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
    confidence: medium
    detail: "顶层字段按 ADR-023 收窄为现货；现金市场无最后交易日。"

  default_management:
    zh: "JSE结算权威机构针对现货证券市场设有多层\"防线\"式违约处置机制：会员准入财务/资本/管理/运营门槛→每日资本充足监控（经BDA系统）→资产透明度（JSE可查会员及其客户持仓）→CSDP结算承诺→T+2结算保证金→失败交易处置流程→违约管理→治理机制，逐层降低成交无法结算的风险"
    en: "The JSE Settlement Authority operates a multi-layered \"lines of defence\" default-management framework for the cash equity market: membership entry requirements, daily capital-adequacy monitoring (via the BDA system), asset visibility (the JSE can view members' and clients' holdings), CSDP settlement commits, T+2 settlement margin, a fails-transaction-management process, default management, and governance"
    sources:
      - title: Equity Market Risk Management（jse.co.za）
        url: https://www.jse.co.za/services/post-trade-services/t3settlement
        accessed: 2026-08-16
    quote: "The JSE provides settlement assurance for central order book trades in the cash equity market and employs various measures to affect this. These measures are listed below: Entry Requirements Capital Adequacy View of Assets CSDP Commits Margin Fails Transaction Management Process Default Management Governance"
    confidence: high

  derivatives:
    initial_margin_practice:
      zh: "JSE Clear 对场内衍生品持仓计收初始保证金（Initial Margin），采用组合扫描（Portfolio Scanning）模型：对会员整个持仓组合在一系列极端市场情景下重新估值，取最大潜在亏损作为保证金（情景宽度由风险管理委员会 RMCO 设定的风险参数——3.5 个标准差——决定，本质为 VaR 方法）；利率衍生品改用 Portfolio VaR 方法，其余衍生品沿用 JSPAN 算法。"
      en: "JSE Clear collects Initial Margin on all on-exchange derivatives positions under a Portfolio Scanning model: a member's whole portfolio is revalued across a range of extreme market scenarios and margin is set to the greatest potential loss (scenario width driven by the Risk Management Committee's 3.5-standard-deviation risk parameter, a VaR-type approach); interest rate derivatives use a Portfolio VaR methodology, with the JSPAN framework used for all other derivatives."
      sources:
        - title: "JSE Clear Margin Methodology（jse.co.za PDF，2019年2月版）"
          url: https://www.jse.co.za/sites/default/files/media/documents/2020-08/JSE%20Clear%20Margin%20Methdology.pdf
          accessed: 2026-08-27
      quote: "Initial margin (IM) represents the primary prefunded line of defense for JSE Clear (JSEC) in managing the risks associated with clearing financial instruments. ... a base IM requirement, calculated under the Portfolio VaR framework for interest rate derivatives, and the JSPAN framework for all other derivatives. ... This is measured in standard deviations (\"Sds\") and has been set at 3.5 Sds since the margining methodology was introduced."
      confidence: high
      detail: "3.5 个标准差风险参数出自 SAFCOM Margins Explained（2012）文档，与 JSE Clear Margin Methodology 的 JSPAN/Portfolio VaR 框架互为印证；利率衍生品的方法论切换年份（2019）见 margin_practice_note，本字段不重复。本字段与顶层 clearing.initial_margin_practice（现货市场 T+2 结算保证金）互补，不合并。"

    maintenance_margin_practice:
      zh: "JSE 衍生品规则以「维持保证金水平」（Maintenance margin level，规则 8.60.5）界定：当客户存入的追加保证金被用于支付变动保证金后，会员可与客户约定、客户须补足至约定水平；实际风控中变动保证金（Variation Margin）按日盯市产生、由清算会员向下游追收，构成维持持仓的常态化追缴机制。"
      en: "The JSE derivatives rules define a 'Maintenance margin level' (rule 8.60.5): where a client's additional margin has been used to meet variation-margin payments, the member may agree that the client must restore the additional margin to the contracted level; in practice variation margin is generated by daily mark-to-market and called downstream by clearing members, forming the routine top-up mechanism that maintains positions."
      sources:
        - title: "Derivatives Rules（jse.co.za PDF，规则 8.60.5）"
          url: https://www.jse.co.za/sites/default/files/jse_document_manager/RW/Internal/Trade/Derivative%20Market/Derivatives%20Market/DerivativesRules.pdf
          accessed: 2026-08-27
      quote: "8.60.5 Maintenance margin level A member may agree, where a client has an amount of money deposited with the member ... that the client shall pay an amount of money to restore the additional margin to the amount contemplated by rule 8.60.3.2 when the additional margin has been used to meet payments of variation margin in terms of rule 8.60.2."
      confidence: high
      detail: "JSE 衍生品清算语境下并无独立的「维持保证金」账号概念，维持机制通过「追加保证金（additional margin）+ 变动保证金追缴」实现，规则 8.60.5 是其法定表述。"

    mark_to_market_frequency:
      zh: "JSE Clear 对每个会员及其客户的衍生品持仓于每个营业日 17:00 进行盯市（mark-to-market）；JSE 或 JSE Clear 亦可在任一营业日视市场情况对任意持仓追加盯市。"
      en: "JSE Clear marks each member's and client's derivative positions to market at 17:00 on each business day; the JSE or JSE Clear may additionally mark any position to market on any business day at its discretion."
      sources:
        - title: "Derivatives Rules（jse.co.za PDF，规则 8.50.1）"
          url: https://www.jse.co.za/sites/default/files/jse_document_manager/RW/Internal/Trade/Derivative%20Market/Derivatives%20Market/DerivativesRules.pdf
          accessed: 2026-08-27
      quote: "8.50.1 At 17:00 on each business day, or such other time as the JSE may determine on a particular business day, the positions in each exchange contract of all members and their clients shall be marked-to-market on such basis as the JSE may determine."
      confidence: high

    delivery_method:
      enum: cash
      zh: "JSE 旗舰股指期货（FTSE/JSE ALSI 等）权益衍生品为现金交割（Cash Settled），无实物交割；少数农产品衍生品（如农业产品）规则中另有实物交割（physical delivery）条款，但主流权益/利率/货币衍生品均为现金结算。"
      en: "JSE's flagship equity derivatives (e.g. the FTSE/JSE ALSI Index Future) are cash-settled (Cash Settled) with no physical delivery; a physical-delivery framework exists only for certain agricultural products under the rules, while mainstream equity/interest-rate/currency derivatives settle in cash."
      sources:
        - title: "SAFEX Equity Derivatives – Index Futures Contract Specifications（jse.co.za PDF）"
          url: https://www.jse.co.za/sites/default/files/jse_document_manager/RW/Internal/Equity%20Index%20Futures/ContractSpecifications.pdf
          accessed: 2026-08-27
      confidence: medium
      detail: "Contract Specifications（ALSI 等指数期货）的 Settlement Method 列逐字为「Cash」/「Settled」分两行排布，缓存文本层里不是连续子串，无法机器反查逐字原文，故本字段按防幻觉铁律二.5 降为 medium；现货权益指数期货为现金交割（Cash Settled）的事实成立，农产品实物交割见 Derivatives Rules 7.170，属少数例外。"

    last_trading_day_rule:
      zh: "以 FTSE/JSE 股指期货（ALSI）为例：最后交易日为三月、六月、九月、十二月的第三个星期四（遇公众假期则提前至前一营业日），到期结算价通过到期日中午 12:00 开始的盘中集合竞价（12:00–12:15，按成交量最大化算法）产生。"
      en: "For the FTSE/JSE Index Future (ALSI): the last trading day is the third Thursday of March, June, September and December (or the preceding business day if a public holiday), with the final settlement price derived from an intraday auction starting at 12:00 SA time (12:00–12:15) using the volume-maximising algorithm."
      sources:
        - title: "SAFEX Equity Derivatives – Index Futures Contract Specifications（jse.co.za PDF）"
          url: https://www.jse.co.za/sites/default/files/jse_document_manager/RW/Internal/Equity%20Index%20Futures/ContractSpecifications.pdf
          accessed: 2026-08-27
      quote: "thursday of Mar, Jun, Sep & Dec. ... at noon 12h00 SA time on 3rd Thursday of Mar, Jun, Sep & Dec. (or previous business day if a public holiday) ... Cash Settled ... between 12h00 and 12h15"
      confidence: high

