  holidays_note:
    zh: "JSE 遵循南非公共假期休市，每年发布交易日历；常规休市包括元旦、人权日（3 月 21 日）、耶稣受难日、家庭日、自由日（4 月 27 日）、劳动节（5 月 1 日）、青年日（6 月 16 日）、全国妇女日（8 月 9 日）、传统日（9 月 24 日）、和解日（12 月 16 日）、圣诞及翌日等。具体每年日历以 JSE 官网 Trading Calendar 为准。"
    en: "The JSE closes on South African public holidays and publishes an annual trading calendar; standard closures include New Year's Day, Human Rights Day (21 Mar), Good Friday, Family Day, Freedom Day (27 Apr), Workers' Day (1 May), Youth Day (16 Jun), National Women's Day (9 Aug), Heritage Day (24 Sep), Day of Reconciliation (16 Dec), Christmas and the following day. The exact calendar is per the JSE's published Trading Calendar."
