      en: "For Segment ZA01 (Top40 constituents and other highly liquid instruments): Continuous Trading Static ±10% / Dynamic ±3%; Opening/Closing/Re-Opening Auction Calls Static ±8% / Dynamic ±6%; Futures Close-Out Auction Call Static ±15% / Dynamic ±2%"
