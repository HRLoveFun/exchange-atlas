  commission_structure:
    zh: "JSE 不直接向个人投资者收取佣金；佣金由会员券商（broker）自行定价，通常按成交金额的比例或固定每笔费率计收，并可视客户类型（尤其机构）协商。具体费率因券商而异，不在交易所统一披露范围。"
    en: "The JSE does not charge commission directly to retail investors; commission is set by the member broker, typically as a percentage of trade value or a fixed per-trade fee, and is negotiable by client type (especially institutions). Rates vary by broker and are not uniformly disclosed by the exchange."
    sources:
      - title: "How to choose a broker（JSE / investor education）"
        url: https://www.jse.co.za/invest/who-can-invest/how-to-choose-a-broker
