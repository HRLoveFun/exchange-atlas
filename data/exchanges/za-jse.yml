    en: "The South African rand (ZAR) is a free-floating currency with historically high volatility and sensitivity to global risk sentiment and commodity-price cycles; foreign investors in JSE assets bear rand FX risk, and cross-border repatriation is also subject to exchange-control declarations (see capital_controls)."
