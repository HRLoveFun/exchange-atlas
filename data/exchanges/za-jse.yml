  regulatory_change_risk_note:
    zh: "监管框架持续演进：『双峰』监管下，金融部门行为监管局（FSCA）负责市场行为与投资者保护、南非储备银行负责审慎监管；JSE 于 2025 年 12 月发布《上市规则简化》（Listings Requirements Simplified）以降低成本与复杂度，并自 2025 年 7 月起将 BDA 交易费下调 4 分。规则与费用的结构性变动构成持续的制度变更风险。"
    en: "The regulatory framework keeps evolving: under 'twin peaks' regulation, the FSCA oversees market conduct and investor protection while the SARB handles prudential supervision; in Dec 2025 the JSE published 'Listings Requirements Simplified' to cut listing and ongoing costs, and from July 2025 reduced the BDA transaction fee by 4 cents. Structural rule and fee changes pose ongoing regulatory-change risk."
    sources:
      - title: "JSE Listings Requirements Simplified（2025年12月）PDF"
        url: https://www.jse.co.za/sites/default/files/media/documents/jse-listings-requirements-simplified/JSE_Listings_Requirements_Simplified_Final_@_12_December_2025_Final.pdf
        accessed: 2026-08-27
      - title: "JSE Ltd – Integrated Annual Report 2025"
        url: https://group.jse.co.za/sites/ir.jse.co.za/files/media/documents/1-jse-ltd-integrated-annual-report-2025-30032026-published/1%20-%20JSE%20Ltd%20%E2%80%93%20Integrated%20Annual%20Report%202025%20%E2%80%93%2030032026%20-%20As%20published.pdf
        accessed: 2026-08-27
    quote: "Effective July 2025, the BDA transaction fee was reduced by 4 cents to acknowledge members' cost pressures associated with this fee."
