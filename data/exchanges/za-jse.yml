    quote: "When the listing of securities is under threat of suspension or removal, the JSE will, in terms of section 12(2) of the FMA: (a) inform the issuer of its intention to suspend/remove; (b) give the issuer the reasons for the intended suspension/removal; and (c) call upon the issuer to show cause, within a period specified by the JSE, why the suspension/removal should not be effected."
