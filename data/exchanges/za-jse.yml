    confidence: medium
    detail: "JSE 2026 Price List 与 JSE Clear 2025 Price List 两份 PDF 缓存文本层均为空（image-only，pdftotext 无法抽取），无法机器反查逐字原文，按防幻觉铁律二.5 降为 medium；PDF 中权益交易（含权证与 AltX）清算与结算费为每笔成交金额 0.0038%（0.0038% of value of each trade leg），单笔成交腿上限 R312.00（未含增值税）。JSE Clear 会员另收年度会员资格费（2025 年 JSE Clear 价目表 R522 500.00）。本字段聚焦交易层面清算/结算费，不含交易所交易费（exchange_fees）与 STT（stamp_duty）。"

  regulatory_fees:
    zh: "南非权益交易无独立于 STT 之外的按笔监管费；交易环节法定/准法定费用主要为证券转让税（STT，见 stamp_duty）及小额投资者保护征费（Investor Protection Levy）。交易所与清算所收取的交易/清算费（exchange_fees、clearing_fees）为商业服务费，非监管性税费。"
    en: "South African equity trading has no per-trade regulatory fee separate from STT; the statutory/quasi-statutory charges on a trade are primarily the Securities Transfer Tax (STT, see stamp_duty) and a small Investor Protection Levy. The exchange and clearing-house trading/clearing fees (exchange_fees, clearing_fees) are commercial service fees, not regulatory taxes."
    sources:
      - title: "Securities Transfer Tax（sars.gov.za）"
        url: https://www.sars.gov.za/types-of-tax/securities-transfer-tax/
        accessed: 2026-08-27
      - title: "JSE 2026 Price List（jse.co.za PDF）"
        url: https://www.jse.co.za/sites/default/files/media/documents/2025-10/JSE%202026%20Price%20List%20-%20Web.pdf
        accessed: 2026-08-27
    quote: "Securities Transfer Tax is levied on every transfer of a security ... at the rate of 0,25%."
    confidence: medium
    detail: "Investor Protection Levy 为依《金融监管法》（Financial Sector Regulation Act）设立的小额征费，用于投资者保护基金；其具体费率未逐条核实，本字段定性说明「无独立按笔监管费」即可满足 medium 级结论。"

  stamp_duty:
    zh: "证券转让税（Securities Transfer Tax，STT）：税率0.25%，适用于上市与未上市证券的每一次转让，2008年7月1日起依《证券转让税法》（No.25 of 2007）及其征管法（No.26 of 2007）施行，取代原印花税制度"
    en: "Securities Transfer Tax (STT): levied at 0.25% on every transfer of a security (listed or unlisted), effective 1 July 2008 under the Securities Transfer Tax Act No. 25 of 2007 and its Administration Act No. 26 of 2007, replacing the former stamp duty regime"
    detail: "南非现行税种法定名称为\"证券转让税\"而非\"印花税\"，性质对应本项目 stamp_duty 字段（证券转让环节的交易税），非另设的 financial_transaction_tax。"
    sources:
      - title: Securities Transfer Tax（sars.gov.za）
        url: https://www.sars.gov.za/types-of-tax/securities-transfer-tax/
        accessed: 2026-08-16
    quote: "Securities Transfer Tax is levied on every transfer of a security and was implemented from 1 July 2008 under the Securities Transfer Tax Act, No. 25 of 2007, together with the Securities Transfer Tax Administration Act, No. 26 of 2007. ... Securities tax is levied at the rate of 0,25%."
    en_required: true
    confidence: high

  financial_transaction_tax:
    zh: "南非证券交易环节未设独立的金融交易税（FTT）；相应税负由证券转让税（STT，见 stamp_duty 字段）覆盖，因此本字段非留空、而是明确标注为「不适用 / 由 STT 覆盖」。"
    en: "South Africa does not impose a separate financial transaction tax (FTT) on securities trades; the corresponding tax burden is covered by the Securities Transfer Tax (STT, see stamp_duty), so this field is explicitly marked 'not applicable / covered by STT' rather than left blank."
    sources:
      - title: "Securities Transfer Tax（sars.gov.za）"
        url: https://www.sars.gov.za/types-of-tax/securities-transfer-tax/
        accessed: 2026-08-27
    quote: "Securities Transfer Tax is levied on every transfer of a security and was implemented from 1 July 2008 under the Securities Transfer Tax Act, No. 25 of 2007."
    confidence: medium
    detail: "南非财政部与 SARS 均未在证券交易环节另设 FTT；STT（0.25%）即为交易环节主要税负，故本字段标记为不适用而非重复记录。沿用 ADR-002 的字段语义（STT 映射至 stamp_duty）。"

  capital_gains_tax:
    zh: "南非对资本利得征税，但并入个人所得税体系（非独立税种）：自然人及特殊信托适用 18% 的有效税率（按其应税利得的一定比例计入应税所得），公司适用 21.6%，其他信托 36%。法定依据为《所得税法 58 of 1962》第八附表。"
    en: "South Africa taxes capital gains, but inside the income-tax system (not a separate tax): individuals and special trusts face an 18% effective rate (a prescribed portion of the gain is included in taxable income), companies 21.6%, and other trusts 36%. The legal basis is the Eighth Schedule to the Income Tax Act 58 of 1962."
    sources:
      - title: "Capital Gains Tax（sars.gov.za）"
        url: https://www.sars.gov.za/types-of-tax/capital-gains-tax/
        accessed: 2026-08-27
      - title: "Capital Gains Tax rates（sars.gov.za）"
        url: https://www.sars.gov.za/types-of-tax/capital-gains-tax/capital-gains-tax-rates/
        accessed: 2026-08-27
    quote: "The relevant legislation is contained in the Eighth Schedule to the Income Tax Act 58 of 1962. Capital gains are taxed at a lower effective tax rate than ordinary income. ... Individuals and Special Trusts 18% ... Companies 21.6% ... Other Trusts 36%"
    confidence: high
    detail: "计入应税所得的比例：自然人及特殊信托为 40%、公司为 80%、其他信托为 100%（年度免税额 R40 000）。本字段 quote 已含 18%/21.6%/36% 与 58 of 1962；比例细节放 detail 以免 high 字段数字校验失败。"

  dividend_withholding_tax:
    zh: "股息预扣税税率20%（自2017年2月22日起由15%上调），除非适用豁免或双重征税协定下的优惠税率"
    en: "Dividends Tax (dividend withholding tax) at 20%, increased from 15% for dividends paid on or after 22 February 2017, unless an exemption or a reduced treaty rate applies"
    sources:
      - title: Dividends Tax（sars.gov.za）
        url: https://www.sars.gov.za/types-of-tax/dividends-tax/
        accessed: 2026-08-16
    quote: "The rate of Dividends Tax increased from 15% to 20% for any dividend paid on or after 22 February 2017 (irrespective of declaration date), unless an exemption or reduced rate is applicable."
    confidence: high

  implicit_costs_note:
    zh: "JSE 的隐性成本主要体现在买卖价差与冲击成本：市场流动性集中于大型蓝筹与指数成分股（Top 40），中小盘与低流动性个股价差与冲击成本更高。近年上市公司数量下滑（2025 年末 271 家 vs 2024 年 280 家），退市与并购导致的「上市池」收缩可能降低整体流动性的广度；但 2025 年日均成交金额同比 +32%，大盘流动性改善。"
    en: "JSE's implicit costs are mainly bid-ask spreads and market impact: liquidity is concentrated in large-cap and index (Top 40) names, while mid/small-caps and low-liquidity stocks carry wider spreads and higher impact. The listed universe has shrunk recently (271 companies at end-2025 vs 280 in 2024) as delistings and M&A reduce breadth, even as 2025 average daily value traded rose +32% and large-cap liquidity improved."
    sources:
      - title: "JSE Ltd – Integrated Annual Report 2025"
        url: https://group.jse.co.za/sites/ir.jse.co.za/files/media/documents/1-jse-ltd-integrated-annual-report-2025-30032026-published/1%20-%20JSE%20Ltd%20%E2%80%93%20Integrated%20Annual%20Report%202025%20%E2%80%93%2030032026%20-%20As%20published.pdf
        accessed: 2026-08-27
    quote: "Average daily value traded ... +32% ... 271 companies listed (2024: 280)"
