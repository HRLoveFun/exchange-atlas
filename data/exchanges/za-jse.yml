    en: "The JSE may suspend a listing on grounds including non-compliance, dual-information situations, business rescue/liquidation, regulatory deregistration notices, or ceasing business; during suspension the issuer must keep complying with the Requirements, file monthly progress reports and quarterly announcements on its status and expected resumption date — failure to take adequate remedial steps within a reasonable period allows the JSE to remove the listing"
