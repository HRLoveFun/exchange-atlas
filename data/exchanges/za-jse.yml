  post_delisting_venue:
    zh: "JSE 自身没有为已退市证券设立正式的场外（OTC）交易板块；退市后股东仍持有股票，但无法在交易所买卖，只能通过场外双边协商转让——常见渠道包括 OTC Express（Singular Systems 运营的买卖意向公告板与双边结算后台）、以及 EasyEquities 等平台允许股东以未上市状态继续持有，历史上 SARB 亦曾设「场外股份转让便利」（OTCSTF）作为退出机制。"
    en: "The JSE does not operate a formal OTC board for delisted securities; after delisting, shareholders still own the shares but can no longer trade them on-exchange and must transfer them bilaterally OTC — common channels include OTC Express (a bulletin board plus back-office for bilateral settlement run by Singular Systems) and platforms such as EasyEquities that let holders keep unlisted positions; the SARB formerly offered an Over-the-Counter Share Transfer Facility (OTCSTF) as an exit mechanism."
    sources:
