  regulator:
    zh: "金融部门行为监管局（Financial Sector Conduct Authority，FSCA）——南非「双峰」（Twin Peaks）监管架构下负责市场行为监管的机构"
    en: "Financial Sector Conduct Authority (FSCA) — the market-conduct regulator under South Africa's Twin Peaks framework"
    detail: "常识背景：FSCA由原金融服务局（FSB）于2018年改制而来，但本次未在fsca.co.za抓取到直接摘引\"2018\"这一年份的原文段落（quote 只确认了机构现有职能表述），故zh/en正文不写入该年份数字，避免与quote反查不上；这一沿革事实作为背景写在这里而非正文。南非另设审慎监管局（Prudential Authority，隶属南非储备银行SARB）负责金融机构的审慎监管，与FSCA构成「双峰」分工；清算类系统重要性基础设施（如JSE Clear）的牌照审批由FSCA会同PA/SARB联合作出，见 clearing_regulator。"
    sources:
      - title: About Us（fsca.co.za）
        url: https://www.fsca.co.za/about-us/
        accessed: 2026-08-16
    quote: "The Financial Sector Conduct Authority (FSCA) regulates and supervises the market conduct of financial institutions in South Africa. The mandate of the FSCA is to enhance and support the efficiency and integrity of the financial system, and to protect financial customers."
    confidence: high

  self_regulatory_org:
    zh: "JSE自身兼具前线监管职能：设Issuer Regulation（发行人监管）与Market Regulation（市场监管）两个内部部门，负责上市审核、持续监管、成员合规与市场纪律，重大规则修订与授权则需FMA框架下向FSCA备案/批准"
    en: "The JSE itself performs front-line regulation via its internal Issuer Regulation and Market Regulation divisions (listing review, continuing obligations, member compliance and market discipline), with major rule changes and authorisations subject to FSCA oversight under the FMA"
    detail: "本条为综合多份JSE官方文档（上市规则\"the JSE will grant a listing\"式表述、Market Regulation Division负责会员资本充足监控的表述）的归纳性描述，非单一原文段落的逐字摘引，quote 摘自其中一处最具代表性的段落。"
    sources:
