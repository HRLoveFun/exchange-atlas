  delisting_process:
    zh: "JSE拟暂停/除牌前须依《金融市场法》第12(2)条：告知发行人拟暂停/除牌的意图、说明理由、并要求发行人在指定期限内说明不应暂停/除牌的理由（show cause）；发行人主动申请除牌则须召开股东大会，经至少75%到会表决权（不含要约方及一致行动人）通过决议，并提供公平要约与独立公平意见书"
    en: "Before suspending/removing, the JSE must (under FMA s.12(2)): inform the issuer of its intention, give reasons, and call on the issuer to show cause within a specified period. A voluntary removal instead requires a general meeting resolution passed by at least 75% of votes cast (excluding the offeror and concert parties), a fair offer, and an independent fairness opinion"
