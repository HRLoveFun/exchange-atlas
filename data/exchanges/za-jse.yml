    quote: "JSE Clear, its wholly owned subsidiary, has been granted a licence to operate as an Independent Clearing House and Central Counterparty (CCP) by the Financial Sector Conduct Authority (FSCA), in agreement with the Prudential Authority (PA) and the South African Reserve Bank (SARB)."
