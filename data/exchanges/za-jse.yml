  delisting_transition_period:
    zh: "JSE 未设置类似 A 股「退市整理期」那样固定天数的过渡窗口；被暂停上市后，发行人须在「合理期限（reasonable period）」内采取充分措施恢复上市条件，否则 JSE 可除牌，期间须按月提交进展、按季度公告现状与预计复牌时间。"
    en: "JSE has no fixed-day 'delisting transition period' akin to a trade-out window; once suspended, the issuer must take adequate steps to enable reinstatement 'within a reasonable period', failing which the JSE may remove the listing, and must file monthly progress reports and quarterly status announcements meanwhile."
    sources:
