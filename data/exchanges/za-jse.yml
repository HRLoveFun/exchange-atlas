    zh: "《金融市场法》（Financial Markets Act No.19 of 2012，经历次修订）"
    en: "Financial Markets Act No. 19 of 2012, as amended"
    detail: "南非法律信息数据库 saflii.org 与 lawlibrary.org.za 本次两次尝试均返回403（详见 SOURCES.md 探测记录），未能拿到法律全文逐条核对；改用JSE自己《上市规则》定义章节对该法的引用作为来源，足以确认法律全称/编号但非法律全文本身。另有《金融部门监管法》（Financial Sector Regulation Act, No. 9 of 2017）设立FSCA/PA双峰架构，见 regulator 字段。"
