  liquidity_risk_note:
    zh: "JSE 流动性集中于大型蓝筹与指数成分股（Top 40），中小盘与低流动性个股价差偏大、退出难度更高；近年上市公司数量下滑（2025 年末 271 家 vs 2024 年 280 家），退市与并购导致的「上市池」收缩，可能降低整体流动性的广度，并使个股流动性风险上升。"
