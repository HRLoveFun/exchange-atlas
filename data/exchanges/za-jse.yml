  political_risk_note:
    zh: "南非面临结构性治理与政策挑战：长期电力危机（限电 load-shedding）削弱增长、国有企业治理问题突出；南非曾于 2023 年 2 月被列入 FATF 灰名单，已于 2025 年 2 月移出。兰特与本地资产价格对政治更迭、政策转向与矿业/土地等敏感议题高度敏感。"
    en: "South Africa faces structural governance and policy challenges: a prolonged electricity crisis (load-shedding) that constrains growth, weak state-owned-enterprise governance, and a period on the FATF grey list (listed Feb 2023, removed Feb 2025). The rand and local asset prices are highly sensitive to political change, policy shifts and sensitive topics such as mining and land."
