    zh: "1947年《证券交易所管制法》立法；1963年加入世界交易所联合会（WFE）；1996年电子化交易系统上线、场内公开喊价交易大厅关闭；1997年电子清算结算机构Strate成立；2001年收购南非期货交易所（SAFEX），获得金融衍生品交易能力；2003年设立AltX（中小企业板）；2005年改制为公司制并在自身运营的交易所挂牌上市，成为JSE Limited；2009年收购南非债券交易所（BESA）；2012年现货市场迁移至新交易平台Millennium Exchange；2014年开设托管中心（colocation）；2016年结算周期从T+5缩短至T+3；2019年权益及货币衍生品迁移至Millennium Exchange平台"
    en: "1947 Stock Exchange Control Act promulgated; 1963 joined the World Federation of Exchanges (WFE); 1996 electronic trading system launched and the open outcry trading floor closed; 1997 Strate (electronic clearing and settlement) established; 2001 acquired the South African Futures Exchange (SAFEX); 2003 launched AltX; 2005 demutualised and self-listed as JSE Limited; 2009 acquired the Bond Exchange of South Africa (BESA); 2012 equity market moved to the Millennium Exchange trading platform; 2014 opened a colocation centre; 2016 moved to T+3 settlement; 2019 equity and currency derivatives migrated to Millennium Exchange"
    sources:
      - title: History | Explore the Legacy of JSE Group（group.jse.co.za）
        url: https://group.jse.co.za/group-overview/history
        accessed: 2026-08-16
