    en: "The JSE charges a trading fee of 0.50 basis points of the value of each trade leg on equity trades (including warrants, ETPs and AltX), subject to a per-trade ceiling (trade cap, see detail)."
    sources:
      - title: "JSE 2026 Price List（jse.co.za PDF）"
