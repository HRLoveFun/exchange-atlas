        accessed: 2026-08-27
    quote: "The JSE review process commonly takes about three to four weeks, as there are certain prescribed timelines that the JSE is required to follow (five business days for a first submission, three business days for the second submission (informal approval) and two business days for the final submission (formal approval))."
