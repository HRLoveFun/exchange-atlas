    detail: "双峰监管（FSCA + SARB/PRUDENT）为南非 2018 年起实施的监管架构（依 Financial Sector Regulation Act 9 of 2017），属公认制度背景（medium 综合）；BDA 降费与上市规则简化均有官方原文支撑。"

  enforcement_note:
    zh: "市场纪律由 JSE 市场监督（JSE Market Regulation）与金融部门行为监管局（FSCA）共同执行；JSE 可对违规会员采取纪律处分、暂停或撤销会员资格，FSCA 拥有调查、罚款与起诉权，并可移交司法机关。"
    en: "Market discipline is enforced jointly by JSE Market Regulation and the Financial Sector Conduct Authority (FSCA); the JSE can take disciplinary action against, suspend, or revoke the membership of non-compliant members, while the FSCA holds investigatory, fining and prosecution powers and can refer matters to the NPA."
