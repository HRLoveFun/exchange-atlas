  foreign_ownership_limit:
    zh: "南非对 JSE 上市证券的外资持股总体上不设置普遍性上限：现行外国直接投资政策不对境外所有权施加限制，仅少数敏感行业（银行依《Banks Act 1990》、矿业依《矿业与石油资源开发法》MPRDA、广播电视依《电子通信法 2005》、私营安保依《私营安保行业监管修正案》限外资 49% 等）另有行业性准入/持股上限。"
    en: "South Africa imposes no general foreign-ownership cap on JSE-listed securities: the current foreign direct investment policy does not impose limitations on foreign ownership, with sector carve-outs only in sensitive industries (banks under the Banks Act 1990, mining under the MPRDA, broadcasting under the Electronic Communications Act 2005, private security capped at 49% under the Private Security Industry Regulation Amendment Act)."
    sources:
      - title: "Foreign ownership and firm performance（Naidu, S. et al., 2022, Acta Commercii）"
        url: https://actacommercii.co.za/index.php/acta/article/download/1443/2773
        accessed: 2026-08-27
      - title: "2024 Investment Climate Statements: South Africa（U.S. Department of State）"
        url: https://www.state.gov/reports/2024-investment-climate-statements/south-africa/
        accessed: 2026-08-27
    quote: "as the current foreign direct investment policy in South Africa does not impose limitations on foreign ownership, the negative impact at higher levels highlights the potential need for a legislative cap on the percentage of foreign ownership permitted in JSE-listed firms."
    confidence: medium
    detail: "quote 出自 Naidu et al. (2022) 对 JSE 上市公司的实证研究，明确写明「现行 FDI 政策不对外资所有权设限」；美国国务院《2024 投资环境报告》亦载「few limitations on foreign private ownership」。行业性例外为公认事实（Banks Act 1990 / MPRDA / Electronic Communications Act 2005 / 私营安保 49% 上限），属 medium 级背景补充。本字段不覆盖跨境资本汇出的外汇管制（见 capital_controls）。"

  capital_controls:
    zh: "南非实行外汇管制（Exchange Control），现行《外汇管制条例》（Exchange Control Regulations）由财政部长通过政府公告 R.1111 颁布、并历经修订，由南非储备银行（SARB）金融监察部门（Financial Surveillance）负责执行。"
    en: "South Africa operates exchange controls; the current Exchange Control Regulations were promulgated by the Minister of Finance under Government Notice R.1111 and have been amended from time to time, administered by the SARB's Financial Surveillance department."
    sources:
      - title: "Exchange Control Regulations（resbank.co.za，南非储备银行金融监察部门）"
        url: https://www.resbank.co.za/en/sarb/what-we-do/financial-surveillance/exchange-control-regulations
