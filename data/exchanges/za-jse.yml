        accessed: 2026-08-16
    quote: "the JSE may remove the listing of securities if it will further one or more of the objects of the FMA, which may include: (a) non-compliance with the Requirements; (b) when holders of securities have approved the removal of listing ...; (c) when an offeror intends to remove a listing through a take-over offer in terms of section 124 of the Act ...; (d) on the completion of a scheme of arrangement in terms of sections 114 and 115 of the Act ... where all the securities have been acquired and the JSE is satisfied that the issuer no longer qualifies for listing; and (e) the redemption of securities in accordance with their terms, provided the listing of such securities was first suspended."
    en_required: true
