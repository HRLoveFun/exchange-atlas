    en: "JSE's review of a listing application runs in stages (first submission 5 business days, second/informal-approval 3 business days, final/formal-approval 2 business days), with the JSE review process commonly taking about three to four weeks; the full IPO from kick-off to admission typically takes 10–14 weeks (8–12 weeks via AltX), with no statutory maximum."
