# 约翰内斯堡证券交易所 Johannesburg Stock Exchange（法定实体名 JSE Limited）
# 抓取来源见 PROJECT/SOURCES.md `za-jse` 一节；原始页缓存于 .cache/za-jse/
#
# source_lang: en——JSE 全部规则文档、上市规则、市场通知均只有英文版，未见南非其他
# 官方语言（如南非荷兰语/祖鲁语）的对照版本；与 us-nyse 同理，按"有官方中文原文选中文，
# 没有则选英文"的取源规则（ADR-013）定为 en。
#
# ⚠️ 本次是 v1.0 Wave 2 里 mena_africa 地区第二个样本（此前仅 sa-tadawul 沙特一家），
# 也是撒哈拉以南非洲的首个样本。region 沿用任务初判 mena_africa（enums.yml 目前只有
# americas/europe/apac/mena_africa 四档，没有更细的非洲子分类）——沙特与南非在监管框架
# （CMA阿语法域 vs FSCA英语法域/Twin Peaks模式）、地理位置（中东 vs 非洲南部）上差异明显，
# 这个粗粒度分类是否够用已记入 OPEN-QUESTIONS「框架性问题」，不擅自改枚举。
#
# group_id：未设置。JSE Limited 是单一法人实体，Main Board / AltX 是同一实体内部的板块
# （非姊妹交易所），JSE Clear（衍生品CCP）/ JSE Investor Services / JSE Private Placements
# 是全资子公司但角色是清算/登记/私募平台服务商，不是可比的"姊妹交易所"实体（判断标准见
# add-exchange skill 第1步），故不设 group_id，这点与 sa-tadawul 的处理一致、与 us-nyse/
# jp-jpx/de-eurex 的多姊妹实体集团结构不同类。
#
# 结构性发现：JSE 现货证券市场的清算安排既不是完全的CCP净额担保模式，也不是无保障的
# 纯双边结算——而是 JSE 结算权威机构（Settlement Authority）通过"多层防线"（Lines of
# Defence：会员准入/资本充足监控/CSDP承诺/保证金/违约处置）提供结算保障；衍生品市场
# 则由子公司 JSE Clear（2022年9月起持牌）担任传统意义的中央对手方 CCP。详见 clearing
# 章节各字段的 detail 说明，这是继 de-eurex（衍生品无"公司上市"概念）之后又一个"字段
# 设计前提与实际制度不完全吻合但仍可如实描述"的案例，比直接留空更能反映真实制度。

id: za-jse
name_zh: 约翰内斯堡证券交易所
name_native: {en: "JSE Limited (Johannesburg Stock Exchange)"}
official_languages: [en]
source_lang: en
region: mena_africa
tier: extended

