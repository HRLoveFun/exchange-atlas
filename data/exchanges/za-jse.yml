    en: "The JSE may remove a listing where: the issuer breaches the Requirements; securities holders have approved removal (requiring at least 75% of votes cast, plus a fairness opinion); an offeror intends removal via a takeover offer under Companies Act s.124; a scheme of arrangement under ss.114/115 is completed and the JSE is satisfied the issuer no longer qualifies; or securities are redeemed per their terms — removal must first be preceded by suspension"
