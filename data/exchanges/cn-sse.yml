    other_boards:
      zh: "科创板 ±20%；风险警示（ST/*ST）股票 ±5%；退市整理期股票 ±10%；新股上市后前5个交易日、退市整理期首日、重新上市首日不设涨跌幅限制"
      en: "STAR Market ±20%; risk-warning (ST/*ST) stocks ±5%; stocks in the delisting transition period ±10%; no price-limit band applies for the first 5 trading days after a new listing, on the first day of the delisting transition period, or on the first day of resumed listing"
