  mark_to_market_frequency:
    zh: "不适用衍生品式逐日盯市盈亏划转——A 股实行多边净额结算（T+1 货银对付），交收完成后结算风险即告消灭；结算风险改由逐日资金交收、逐月重算的最低结算备付金限额与恒定缴存的结算保证金监控，而非逐日盯市"
    en: "Derivative-style daily variation margin settlement does not apply — A-shares settle on a multilateral netting basis (T+1 DvP) and settlement risk is extinguished upon settlement; risk is instead monitored through daily cash settlement, the monthly recalculated minimum reserve fund limit, and the standing settlement margin, not through daily mark-to-market"
    sources:
      - title: "《证券结算保证金管理办法》（中国结算官方 PDF，第四条结算保证金不得用于日常交收）"
        url: http://www.chinaclear.cn/zdjs/editor_file/20211030211400917.pdf
        accessed: 2026-09-05
      - title: "《结算备付金管理办法（2023年8月修订版）》（中国结算官方 PDF，第九条逐月限额管理）"
        url: http://www.chinaclear.cn/zdjs/qzb/202310/cca8984cb74a46aab0b3f75f2df4acb4/files/%E4%B8%AD%E5%9B%BD%E8%AF%81%E5%88%B8%E7%99%BB%E8%AE%B0%E7%BB%93%E7%AE%97%E6%9C%89%E9%99%90%E8%B4%A3%E4%BB%BB%E5%85%AC%E5%8F%B8%E7%BB%93%E7%AE%97%E5%A4%87%E4%BB%98%E9%87%91%E7%AE%A1%E7%90%86%E5%8A%9E%E6%B3%95%EF%BC%882023%E5%B9%B48%E6%9C%88%E4%BF%AE%E8%AE%A2%E7%89%88%EF%BC%89.pdf
