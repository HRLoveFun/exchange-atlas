    zh: "存在独立于交易所经手费之外的「证券（业务）监管费」（俗称证管费），由中国证监会向交易所收取：现行标准依《国家发展改革委 财政部关于证券期货业监管费标准等有关问题的通知》（发改价格规〔2018〕917号），对上海、深圳证券交易所按股票交易额 0.02‰ 收取，自 2018 年 1 月 1 日起执行、未设有效期限（同时废止 2016 年旧标准）；2012 年通知（有效期 3 年至 2015）亦为 0.02‰、基金/债券免收。实务中并入券商佣金作为「证管费」代收。"
    en: "A \"securities (business) regulatory fee\" exists on top of the Exchange's own handling fee, collected by the CSRC from the exchanges: the current standard is the NDRC/MOF Notice Fagai Jiage Gui [2018] No. 917, levying 0.02‰ of stock trading value on the Shanghai and Shenzhen stock exchanges, effective 1 January 2018 with no stated expiry (repealing the 2016 standard); the earlier 2012 notice (3-year validity to 2015) also set 0.02‰ with funds and bonds exempt. In practice it is passed through inside broker commissions."
    detail: "2026-09-04（ADR-067 成本瀑布数据层长尾）：本字段原引 2012 通知（发改价格〔2012〕2119号），该通知注明「有效期3年」（至2015）、当时未找到后续文件、故 confidence medium 且带「现行费率未再核实」的 hedge。本次找到并抓取现行标准——发改价格规〔2018〕917号（ndrc.gov.cn），明文『对上海、深圳证券交易所收取证券业务监管费，按股票交易额的0.02‰收取』、『自2018年1月1日起执行』、同时废止 2016 年标准、无有效期限。据此把主来源换为 2018 通知，去掉「未再核实」hedge；confidence 仍标 medium（发布已 7 年，机构监管费部分曾 2018–2020 暂免、显示此类收费会周期性调整，未再核实到更晚的业务监管费文件）。"
    sources:
