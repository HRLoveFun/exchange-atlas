  continuing_obligations:
    zh: "上市后的持续义务以《股票上市规则》为总纲：信息披露义务人应当及时、公平地披露信息并保证信息真实、准确、完整（第二章）；上市公司须遵守公司治理（第四章）、定期报告（第五章）、应当披露的交易与关联交易（第六章）、应当披露的其他重大事项（第七章）等持续规范；控股股东、实控人及董监高负有相应诚信与配合义务"
    en: "Post-listing continuing obligations are codified in the SSE Listing Rules: timely and fair disclosure with information that is true, accurate and complete (Chapter 2); ongoing compliance across corporate governance (Chapter 4), periodic reports (Chapter 5), disclosable transactions and related-party transactions (Chapter 6) and other material matters (Chapter 7); controlling shareholders, actual controllers and directors/supervisors/senior management bear corresponding integrity and cooperation duties"
    sources:
      - title: "《上海证券交易所股票上市规则（2026年4月修订）》全文 DOCX（第一、二、四至七章持续义务条款）"
        url: https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/mainipo/c/10816589/files/0017fa2bde184b53b43c046d503f54d0.docx
        accessed: 2026-09-05
    quote: "上市公司及相关信息披露义务人应当及时、公平地披露信息，并保证所披露的信息真实、准确、完整，不得有虚假记载、误导性陈述或者重大遗漏。"
    confidence: high

  suspension_resumption:
    zh: "停牌与复牌专章规定（《股票上市规则》第八章）：上市公司发生本章规定事项应向本所申请停牌复牌；未按期披露定期报告、财报被责令改正未改正、信息披露或规范运作存在重大缺陷被要求改正未改正等情形应停牌，停牌期限不超过 2 个月，依规改正后复牌；资金占用达最近一期经审计净资产绝对值 30% 以上或金额达 2 亿元以上被责令改正未改正的同样停牌不超过 2 个月；股本总额/股权分布连续 20 个交易日不具备上市条件的停牌不超过 1 个月"
    en: "Suspension and resumption are governed by a dedicated chapter (Chapter 8 of the SSE Listing Rules): the company must apply to the Exchange for suspension/resumption of the enumerated matters; trading is suspended — with a suspension period of no more than 2 months — where periodic reports are not disclosed on time, where financial reports are ordered to be corrected but are not, where disclosure or governance has major defects, or where non-operating fund occupation by controlling shareholders reaches 30% of audited net assets or two hundred million yuan; suspension for losing listing conditions on share capital/distribution over 20 consecutive trading days lasts no more than 1 month, with resumption upon rectification"
    detail: "原留空记录（『个股级临时停牌见 market_structure.trading_halt_mechanism，此字段特指长期停牌』）的分工沿用：本字段聚焦第八章的制度性停复牌，盘中临时停牌仍在交易机制字段。"
    sources:
      - title: "《上海证券交易所股票上市规则（2026年4月修订）》全文 DOCX（第八章 停牌与复牌）"
        url: https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/mainipo/c/10816589/files/0017fa2bde184b53b43c046d503f54d0.docx
        accessed: 2026-09-05
    quote: "8.1 上市公司发生本章规定的停牌、复牌事项，应当向本所申请对其股票及其衍生品种停牌与复牌。 ... 8.3 上市公司未在法定期限内披露年度报告或者半年度报告的 ... 股票及其衍生品种应当自相关定期报告披露期限届满后次一交易日起停牌，停牌期限不超过2个月。 ... 余额达到最近一期经审计净资产绝对值30%以上，或者金额达到2亿元以上 ... 8.7 上市公司因股本总额、股权分布发生变化导致连续20个交易日不具备上市条件的，本所将于前述交易日届满的次一交易日起对公司股票及其衍生品种实施停牌，停牌期限不超过1个月。"
    confidence: high

  delisting_conditions:
    zh: "四类强制退市（交易类、财务类、规范类、重大违法类）+ 主动退市"
    en: "Four categories of mandatory delisting (trading-based, financial, compliance, major-violation) plus voluntary delisting"
    detail: |
      财务类主要指标：最近一个会计年度净利润为负且营业收入低于1亿元；期末净资产为负；
      审计报告被出具无法表示意见或否定意见。上市公司连续两年触及财务类指标即终止上市。
      2024年修订取消了交易类退市的退市整理期设置。
      本条来自第三方财经媒体综述，非交易所规则原文，confidence 标 medium；en 为对已核实中文的
      直接翻译，非另一份官方英文来源。
    sources:
      - title: 上交所：拓宽重大违法强制退市适用范围 新增三种规范类退市情形（财联社）
        url: https://www.cls.cn/detail/1645334
        accessed: 2026-08-12
    confidence: medium

  delisting_process:
    zh: "本所上市审核委员会审议后，本所决定是否终止上市；决定作出后2个交易日内通知公司并公告，同时报中国证监会备案；强制终止上市后进入退市整理期（触及交易类退市情形的除外）；决定公告之日后5个交易日内予以摘牌；摘牌后须聘请主办券商安排转入退市板块，保证摘牌之日起45个交易日内可转让"
    en: "The Exchange's Listing Review Committee deliberates and the Exchange then decides whether to terminate listing; within 2 trading days of the decision it notifies the company, announces publicly, and files with the CSRC; mandatory delisting (except trading-based delisting) is followed by a delisting transition period; the stock is delisted within 5 trading days after the decision is announced; after delisting, a sponsor securities firm must be engaged to arrange the stock's transfer to the delisting board, ensuring it can be traded within 45 trading days of delisting"
    detail: "出处为《上海证券交易所股票上市规则（2026年4月修订）》第九章「退市与风险警示」9.1.10/9.1.13/9.1.14/9.1.15/9.2.9条；与 delisting_transition_period（整理期时长）、post_delisting_venue（摘牌后去向）互为补充，避免重复摘引同一章节内容。"
    sources:
      - title: 上海证券交易所股票上市规则（2026年4月修订）全文，第九章 9.1.10/9.1.13/9.1.14/9.1.15/9.2.9条
        url: https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/mainipo/c/10816589/files/0017fa2bde184b53b43c046d503f54d0.docx
        accessed: 2026-08-24
    confidence: medium

  delisting_transition_period:
    zh: "交易类退市已取消退市整理期设置（2024年修订）；财务类等其他类型是否保留整理期未逐条核实"
    en: "The delisting transition period has been eliminated for trading-based delisting (per the 2024 revision); whether it is retained for other categories such as financial-based delisting was not verified item by item"
    sources:
      - title: 上交所：拓宽重大违法强制退市适用范围 新增三种规范类退市情形（财联社）
        url: https://www.cls.cn/detail/1645334
        accessed: 2026-08-12
    confidence: medium

  post_delisting_venue:
    zh: "摘牌后转入退市板块挂牌转让（依托全国中小企业股份转让系统），由主办券商办理转入手续"
    en: "After delisting, shares are transferred to the delisting board for over-the-counter trading (hosted on the National Equities Exchange and Quotations), with a sponsor securities firm handling the transfer"
    detail: "《关于退市公司进入退市板块挂牌转让的实施办法》由上交所、深交所、北交所、全国股转系统、中国结算五方联合制定，2022年4月29日发布施行，公告页标注「现行有效」；具体挂牌交易规则（如涨跌幅、投资者适当性）本次未逐条核实。"
    sources:
      - title: 关于发布《关于退市公司进入退市板块挂牌转让的实施办法》的通知（股转系统公告〔2022〕166号）
        url: http://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/mainipo/c/c_20250516_10779154.shtml
        accessed: 2026-08-24
    quote: "为了适应注册制改革和常态化退市的要求，顺畅退市公司进入退市板块挂牌转让，完善退市公司管理……上海证券交易所、深圳证券交易所、北京证券交易所（以下统称交易所）、全国中小企业股份转让系统有限责任公司和中国证券登记结算有限责任公司联合制定了《关于退市公司进入退市板块挂牌转让的实施办法》（以下简称《实施办法》）。经中国证监会批准，现予以发布，自发布之日起施行。"
    confidence: high

