        accessed: 2026-08-12
      - title: "Trading Rules of Shanghai Stock Exchange (2026 Revision) 第6.4条 — SSE 官方英文译本，仅供参考，中文本为准"
        url: https://english.sse.com.cn/start/sserules/stocks/trading/c/10825757/files/d263e3a87f37436ca2f8e5bcfc4ff001.pdf
        accessed: 2026-08-13

  connect_schemes:
    zh: "沪港通（与港交所互联互通，2014年11月开通）"
    en: "Shanghai-Hong Kong Stock Connect (interconnection with HKEX, launched November 2014)"
    confidence: low
    detail: "开通日期等细节为一般知识，未在本次会话重新核实原始公告，留待与 hk-hkex 数据交叉核对时补充来源。"

