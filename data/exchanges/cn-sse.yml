      quote: "期权竞价交易按价格优先、时间优先的原则撮合成交。／连续竞价交易时段，以涨跌停价格进行的申报，按照平仓优先、时间优先的原则撮合成交。平仓优先的原则为：以涨停价格进行的申报，买入平仓（含备兑平仓）申报优先于买入开仓申报；以跌停价格进行的申报，卖出平仓申报优先于卖出开仓申报。"
      confidence: high
      verified: 2026-09-05

    order_types:
      spec:
        market: true
        limit: true
        tif: [fok, ioc]
        note: "申报指令共 5 类：普通限价、市价剩余转限价、市价剩余撤销、全额即时限价、全额即时市价（全额即时类对应 FOK 语义、市价剩余撤销对应 IOC 语义，为本所规则语义的归纳）；第五十五条另有兜底项「（六）本所规定的其他申报类型」；申报数量 1 张或其整数倍，限价单笔最大 10 张、市价单笔最大 5 张；集合竞价阶段仅接受普通限价申报及撤单申报（不接受撤单申报的时段除外）；所列类型中未见止损/冰山/隐藏类"
      zh: "买卖类型：买入开仓、买入平仓、卖出开仓、卖出平仓、备兑开仓、备兑平仓等；委托类型分限价与市价，本所接受的申报指令为普通限价申报、市价剩余转限价申报、市价剩余撤销申报、全额即时限价申报、全额即时市价申报五类；申报数量为1张或其整数倍，限价申报的单笔申报最大数量为10张，市价申报的单笔申报最大数量为5张"
      en: "Trading types: buy-to-open, buy-to-close, sell-to-open, sell-to-close, covered-call-open and covered-call-close; orders are either limit or market orders, with five accepted instruction types — ordinary limit, market-with-remainder-to-limit, market-with-remainder-cancelled, fill-or-kill limit, and fill-or-kill market orders; order size is 1 contract or a multiple thereof, capped at 10 contracts per limit order and 5 per market order"
      detail: "与深交所《股票期权试点交易规则》的申报口径存在实质差异：深交所限价/市价单笔上限为50张/10张、申报指令清单为8类，上交所为10张/5张、5类——数据未混用，quote 全部摘自上交所规则原文。卖出平仓须持有权利仓、买入平仓须持有义务仓（第四十五、四十六条），备兑开仓须先提交合约标的备兑锁定指令（第四十七条），均为上交所原文，未逐条入 quote。"
      sources:
        - title: 上海证券交易所股票期权试点交易规则 第四十三条、第五十五条、第五十八条
          url: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/10781448/files/0c0f89e74e9c4a5b9aa3a7acafdf5119.docx
          accessed: 2026-09-05
      quote: "前款第（三）项所称买卖类型，包括买入开仓、买入平仓、卖出开仓、卖出平仓、备兑开仓以及备兑平仓等。前款第（五）项所称委托类型，包括普通限价委托、市价剩余转限价委托、市价剩余撤销委托、全额即时限价委托、全额即时市价委托等。／本所接受交易参与人的下列限价申报和市价申报指令：（一）普通限价申报；（二）市价剩余转限价申报；（三）市价剩余撤销申报；（四）全额即时限价申报；（五）全额即时市价申报；……／期权交易的申报数量为1张或者其整数倍，限价申报的单笔申报最大数量为10张，市价申报的单笔申报最大数量为5张。"
      confidence: high
      verified: 2026-09-05

