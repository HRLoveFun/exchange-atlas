    quote: "第五条 本办法适用于由本公司提供多边净额结算服务的人民币普通股（A 股）、债券、证券投资基金和其他证券类金融产品（不含人民币特种股票交易、开放式基金等产品场外申购赎回）的交易结算业务。"
    confidence: medium

  default_management:
    spec:
      model: ccp_default_waterfall
      layers:
        - {order: 1, resource: "违约方担保物中的现金部分", bearer: defaulter}
        - {order: 2, resource: "证券结算保证金中违约方缴纳部分", bearer: defaulter}
        - {order: 3, resource: "证券结算保证金中其他参与人缴纳及公司划拨部分", bearer: surviving_members}
        - {order: 4, resource: "证券结算风险基金", bearer: statutory_fund}
        - {order: 5, resource: "商业银行等机构的授信支持", bearer: external}
      note: "顺序为《证券登记结算管理办法》第六十八条明列；另有『其他资金』兜底层与证券交收违约的同种证券冲抵机制（见 zh），未入 layers"
    zh: "结算参与人资金交收违约时，中国结算按顺序动用：违约方担保物中的现金部分→证券结算保证金中违约方缴纳部分→证券结算保证金中其他参与人缴纳及公司划拨部分；仍不足的可动用证券结算风险基金、商业银行等机构授信支持等；证券交收违约的可用违约方提交的同种证券或以专用清偿账户资金买入的同种证券冲抵；违约方逾期未补足的，公司可处分其担保物、回购质押券及专用清偿账户内资产以补足欠付，并继续向其追偿"
    en: "When a settlement participant defaults on a cash settlement obligation, ChinaClear draws on, in order: the cash portion of the defaulter's collateral, then the defaulter's own contribution to the securities settlement deposit, then other participants' contributions and the company's allocation within that deposit; if still insufficient, it may draw on the Securities Settlement Risk Fund or commercial-bank credit facilities; for a securities settlement default, it may offset using identical securities submitted by the defaulter or bought with funds in a dedicated clearing account; if the defaulter fails to make up the shortfall within the required period, the company may dispose of the defaulter's collateral, repo-pledged securities and dedicated-account assets to cover the shortfall, and continues to pursue recovery from the defaulter"
    detail: "出处为《证券登记结算管理办法》（中国证监会令第29号）第七章「风险防范和交收违约处理」第65-73条；《证券结算风险基金管理办法》（证监会、财政部联合发布，托管于财政部官网）进一步规定风险基金本身用于垫付/弥补违约交收、技术故障、操作失误损失，两份规章配合构成完整的违约处置与风险共担体系，本条 quote 仅摘自第一份文件，第二份作为背景补充列入 sources。"
    sources:
      - title: 证券登记结算管理办法（中国证监会令第29号）第七章第65-73条
        url: http://www.sse.com.cn/lawandrules/regulations/csrcorder/c/10116597/files/f2bae870b188483eae343f735c141cf6.pdf
        accessed: 2026-08-24
      - title: 证券结算风险基金管理办法
        url: http://m.mof.gov.cn/zcfb/202511/P020251107701444228151.pdf
        accessed: 2026-08-24
    quote: "第六十八条 结算参与人发生资金交收违约的，证券登记结算机构应当按照下列顺序动用担保物和证券结算保证金，完成与对手方结算参与人的资金交收：（一）违约结算参与人的担保物中的现金部分；（二）证券结算保证金中违约结算参与人交纳的部分；（三）证券结算保证金中其他结算参与人交纳的及证券登记结算机构划拨的部分。按前款处理仍不能弥补结算参与人资金交收违约的，证券登记结算机构还可以动用下列资金：（一）证券结算风险基金；（二）商业银行等机构的授信支持；（三）其他资金。"
    confidence: high

  # ── 衍生品子块（2026-09-05 衍生品覆盖缺口补齐，参照 cn-szse 范式）。清算端主体为中国结算；
  # 一手出处同 market_structure.derivatives：《期权交易规则》（上证发〔2015〕7号）与《风险控制
  # 办法》（上证发〔2015〕8号），全文 DOCX 缓存于 .cache/cn-sse/。 ──
  derivatives:
    initial_margin_practice:
      zh: "期权保证金实行分级收取：中国结算向结算参与人收取、结算参与人向委托其结算的期权经营机构收取、期权经营机构向客户收取，下级收取标准不得低于上级标准；保证金以现金或经上交所及中国结算认可的证券交纳，开仓保证金按公式计算（本所现行全部品种为 ETF 标的，公式与参数见 market_structure.derivatives.margin_practice_note）；上交所对每笔卖出开仓申报实时计算开仓保证金额度，并根据结算参与人的保证金日间余额数据对申报进行校验"
      en: "Option margin is collected in a tiered structure: ChinaClear collects from clearing participants, clearing participants from the options firms that clear through them, and options firms from clients — each tier's requirement no lower than the tier above; margin is payable in cash or securities recognized by SSE/ChinaClear, and opening margin is formula-based (all currently listed products are ETF-underlying — formulas and parameters in market_structure.derivatives.margin_practice_note); SSE computes the opening-margin requirement for every sell-to-open order in real time and validates the order against the clearing participant's intraday margin balance"
      detail: "本字段是 clearing（清算/CCP）层面对同一保证金制度的视角，与 market_structure.derivatives.margin_practice_note（交易端保证金要求）描述同一套规则但视角不同，不合并，见 PROJECT/DECISIONS.md [ADR-030]。卖出开仓实时校验为《期权交易规则》第一百二十一条与《风险控制办法》第十二、十三条（已核实，未入 quote）。"
      sources:
        - title: 上海证券交易所、中国证券登记结算有限责任公司股票期权试点风险控制管理办法 第五条、第六条
          url: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/10781451/files/f993fec80e204f9fb013813f2b0e0c00.docx
          accessed: 2026-09-05
      quote: "保证金按照下列要求，进行分级收取：（一）期权经营机构向客户收取；（二）中国结算向结算参与人收取。结算参与人应当向委托其结算的期权经营机构收取保证金。／期权经营机构向客户、结算参与人向委托其结算的期权经营机构收取保证金的标准，不得低于中国结算向结算参与人收取保证金的标准。委托结算参与人结算的期权经营机构向客户收取保证金的标准，不得低于结算参与人向其收取保证金的标准。"
      confidence: high
      verified: 2026-09-05

    maintenance_margin_practice:
      zh: "每个交易日日终，中国结算按上交所公布的合约结算价格计算并收取结算参与人应交纳的维持保证金；结算参与人结算准备金最低余额应当达到中国结算的要求（以自有资金交纳），结算准备金小于零、或开盘时结算准备金大于零但低于最低余额的，不得进行买入开仓、卖出开仓；维持保证金计算公式与开仓保证金同构，仅将「前收盘价/前结算价」替换为「收盘价/结算价」（详细公式见 market_structure.derivatives.margin_practice_note）"
      en: "At the end of every trading day, ChinaClear calculates and collects the maintenance margin owed by each clearing participant, based on the contract settlement price published by SSE; a participant's minimum settlement-reserve balance must meet ChinaClear's requirement (funded with the participant's own capital), and a participant whose settlement reserve is negative — or positive but below the minimum at the open — may not open new long or short option positions; the maintenance-margin formula mirrors the opening-margin formula, substituting the prior close/prior settlement price with the current close/settlement price (formulas in market_structure.derivatives.margin_practice_note)"
      detail: "同 initial_margin_practice，本字段是清算/CCP 层面视角，与市场结构章节的交易端保证金说明不合并，见 [ADR-030]。"
      sources:
        - title: 上海证券交易所、中国证券登记结算有限责任公司股票期权试点风险控制管理办法 第十六条、第十七条、第十九条
          url: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/10781451/files/f993fec80e204f9fb013813f2b0e0c00.docx
          accessed: 2026-09-05
      quote: "结算参与人结算准备金最低余额应当达到中国结算的要求。结算准备金最低余额由结算参与人以自有资金交纳。结算参与人结算准备金小于零，或者开盘时结算准备金大于零但低于结算准备金最低余额的，不得进行买入开仓、卖出开仓。／每个交易日日终，中国结算按上交所公布的合约结算价格计算并收取结算参与人应当交纳的维持保证金。合约结算价格计算方式由上交所及中国结算另行规定。／（一）认购期权义务仓维持保证金＝[合约结算价+Max（12%×合约标的收盘价-认购期权虚值，7%×合约标的收盘价）]×合约单位。（二）认沽期权义务仓维持保证金＝Min[合约结算价 +Max(12%×合约标的收盘价-认沽期权虚值，7%×行权价)，行权价]×合约单位。"
      confidence: high
      verified: 2026-09-05

    mark_to_market_frequency:
      zh: "逐日盯市：每个交易日日终由中国结算按上交所公布的合约结算价格核算并收取结算参与人应交纳的维持保证金；合约结算价格为该合约当日收盘集合竞价的成交价格（未形成成交价或明显不合理时由本所另行计算），最后交易日实值合约按合约标的当日收盘价格与行权价格计算结算价格，虚值/平值合约结算价格为0"
      en: "Mark-to-market is performed daily: at the end of every trading day, ChinaClear calculates and collects the maintenance margin owed by clearing participants based on the contract settlement price published by SSE; the settlement price is that day's closing call auction traded price (computed separately by the Exchange if no price forms or it is evidently unreasonable), while on the last trading day in-the-money contracts settle from the underlying's closing price and the strike, and out-of-the-money/at-the-money contracts settle at 0"
      sources:
        - title: 上海证券交易所、中国证券登记结算有限责任公司股票期权试点风险控制管理办法 第十七条
          url: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/10781451/files/f993fec80e204f9fb013813f2b0e0c00.docx
          accessed: 2026-09-05
        - title: 上海证券交易所股票期权试点交易规则 第七十二条
          url: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/10781448/files/0c0f89e74e9c4a5b9aa3a7acafdf5119.docx
          accessed: 2026-09-05
      quote: "每个交易日日终，中国结算按上交所公布的合约结算价格计算并收取结算参与人应当交纳的维持保证金。合约结算价格计算方式由上交所及中国结算另行规定。／期权合约的结算价格为该合约当日收盘集合竞价的成交价格。当日收盘集合竞价未形成成交价格或者成交价格明显不合理的，由本所另行计算该合约的结算价格，具体事宜由本所及中国结算另行规定。／期权合约最后交易日为实值合约的，本所根据合约标的当日收盘价格和该合约行权价格，计算该合约的结算价格；期权合约最后交易日为虚值或者平值合约的，结算价格为0。"
      confidence: high
      verified: 2026-09-05

    delivery_method:
      enum: physical
      zh: "股票期权行权默认以给付合约标的的方式交割（实物交割），行权交收日为行权日的次一交易日；仅在列明情形（行权日合约标的全天停牌/临时停牌直至收盘致实值认沽期权行权申报因合约标的不足未通过有效性检查、交收日合约标的全天停牌/临时停牌直至收盘致行权交割中应交付合约标的不足、出现交易异常情况或本所认为有必要的情形）按本所公布的行权现金结算价格以现金结算，其余应交付标的不足部分按中国结算公布的价格以现金结算；行权现金结算价格：股票标的为最近一个交易日实际交易时段最后30分钟内的时间加权平均价，ETF标的为前一交易日单位净值×（1+对应指数当日涨跌幅）"
      en: "Option exercise settles by default through delivery of the underlying securities (physical delivery), with the exercise settlement date the trading day after the exercise day; only in enumerated situations — an in-the-money put's exercise instruction failing validation due to a shortage of the underlying when the underlying is suspended all day until close on the exercise day, a delivery shortfall caused by a full-day underlying suspension on the settlement day, or abnormal situations deemed necessary by the Exchange — is settlement made in cash at the exercise cash settlement price published by SSE, with any remaining shortfall settled in cash at the price published by ChinaClear; the exercise cash settlement price is the time-weighted average price of the last 30 minutes of the underlying's most recent trading day for stock underlyings, or the ETF's prior-day NAV × (1 + the tracked index's daily move) for ETF underlyings"
      detail: "「实物交割为默认」系对规则结构的归纳：第一百零三条以「期权合约行权以给付合约标的的方式进行」表述默认交割义务，仅第一百一十条列明情形以现金结算（与 cn-szse 同款归纳）。行权现金结算价格公式为第一百一十一条（股票标的）与第一百一十二条（ETF标的，原文公式中乘号为字母「X」——quote 逐字保留）。"
      sources:
        - title: 上海证券交易所股票期权试点交易规则 第一百零三条、第一百零九至一百一十二条
          url: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/10781448/files/0c0f89e74e9c4a5b9aa3a7acafdf5119.docx
          accessed: 2026-09-05
      quote: "期权合约行权以给付合约标的的方式进行，本规则第一百一十条规定的情形除外。／期权合约行权交收日为行权日的次一交易日。／期权合约行权中出现以下情形之一的，对相应合约按照本所公布的行权现金结算价格，以现金结算方式进行行权交割：……除前款规定情形之外，对于行权交割中应交付的合约标的不足部分，按照中国结算公布的价格，以现金结算方式进行行权交割。／期权合约标的为股票的，行权现金结算价格为合约标的在最近一个交易日实际交易时段最后30分钟内的时间加权平均价。／行权现金结算价格=交易所交易基金前一交易日的单位净值X（1+对应指数当日涨跌幅）。"
      confidence: high
      verified: 2026-09-05

    last_trading_day_rule:
      zh: "期权合约到期日为到期月份的第四个星期三（该日为国家法定节假日、本所休市日的顺延至下一个交易日）；最后交易日与行权日同到期日，到期日提前或顺延时随之调整；合约最后交易日发生全天停牌或盘中临时停牌的，行权申报照常进行，最后交易日、到期日、行权日不作顺延；另有专门顺延情形：最后交易日处于合约标的配股股权登记日与配股缴款日后复牌首日之间且标的停牌的顺延至复牌首日、标的将在最后交易日次一交易日除权除息的顺延至除权除息日、标的被暂停上市或终止上市的提前至其实施前最后交易日的前一交易日、本所暂停交易或临时停市当日未恢复的顺延至恢复交易首日、本所对合约当日采取取消交易措施的顺延至次一交易日"
      en: "An option contract's expiration date is the fourth Wednesday of the expiration month (deferred to the next trading day if a statutory holiday or an SSE non-trading day); the last trading day and exercise day coincide with expiration and move with it; if the contract is suspended all day or intraday on its last trading day, exercise instructions proceed as normal and the last trading day/expiration/exercise day are NOT deferred; dedicated deferral rules instead apply where the underlying's suspension spans a rights-issue registration/payment window (deferred to the resumption day), where the underlying goes ex-rights/ex-dividend the next day (deferred to that day), where the underlying is suspended from or delisted from listing (advanced to the trading day before), where an Exchange suspension/halt does not lift same-day (deferred to the resumption day), or where the Exchange cancels the contract's trades that day (deferred to the next trading day)"
      sources:
        - title: 上海证券交易所股票期权试点交易规则 第九条、第一百零七条、第一百零八条
          url: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/10781448/files/0c0f89e74e9c4a5b9aa3a7acafdf5119.docx
          accessed: 2026-09-05
      quote: "期权合约的到期日为到期月份的第四个星期三，该日为国家法定节假日、本所休市日的，顺延至下一个交易日。期权合约的最后交易日和行权日，同其到期日；到期日提前或者顺延的，最后交易日和行权日随之调整。本规则另有规定的除外。／期权合约最后交易日，期权合约发生全天停牌或者盘中临时停牌的，期权合约的行权申报照常进行，期权合约最后交易日、到期日、行权日不作顺延。／（一）期权合约最后交易日处于合约标的配股股权登记日与配股缴款日后的复牌首日之间，且合约标的停牌的，期权合约最后交易日顺延至合约标的配股缴款日后的复牌首日，期权合约于当日到期并进行行权。（二）合约标的将在期权合约最后交易日的次一交易日进行除权、除息的，期权合约最后交易日顺延至合约标的除权、除息日，期权合约于当日到期并进行行权。（三）因合约标的被暂停上市、终止上市，该合约品种所有未平仓合约提前至合约标的被实施暂停或者终止上市前的最后交易日的前一交易日到期并行权。（四）期权合约最后交易日，本所对该合约采取暂时停止交易或者临时停市措施，且当日未恢复交易的，期权合约最后交易日顺延至期权合约恢复交易首日，期权合约于当日到期并进行行权。（五）期权合约最后交易日，本所对该合约当日交易采取取消交易措施的，期权合约最后交易日顺延至次一交易日，期权合约于当日到期并进行行权。"
      confidence: high
      verified: 2026-09-05

