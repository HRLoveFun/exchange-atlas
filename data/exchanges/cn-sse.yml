    zh: "注册制下上交所股票发行上市的法定时限（《上海证券交易所股票发行上市审核规则》现行版）：收到申请文件后 5 个工作日内作出是否受理的决定；自受理之日起，本所审核和证监会注册的时间总计不超过 3 个月（发行人及保荐机构回复审核问询的时间不计算在内）"
