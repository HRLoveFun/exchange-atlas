  dividend_withholding_tax:
    zh: "个人从公开发行和转让市场取得的上市公司股票股息红利按持股期限差别化计征个人所得税（财税〔2015〕101号）：持股超过 1 年的暂免征收；持股 1 个月以内（含）的全额计入应纳税所得额；持股 1 个月以上至 1 年（含）的暂减按 50% 计入；上述所得统一适用 20% 的税率计征"
    en: "Dividend income of individuals from listed-company shares is taxed on a holding-period-differentiated basis (Caishui [2015] No. 101): exempt for holdings over 1 year; fully taxable for holdings within 1 month (inclusive); half-counted for holdings over 1 month up to 1 year (inclusive); all taxed at the 20% rate"
    sources:
