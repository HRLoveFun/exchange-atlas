      （fgk.chinatax.gov.cn 国家税务总局政策法规库全文，『对证券交易的出让方征收，不对受让方
      征收』），此前仅由人民网转载的公告支撑。上交所与深交所（cn-szse）适用同一税率。
    sources:
      - title: "中华人民共和国印花税法（国家税务总局政策法规库，fgk.chinatax.gov.cn；第三条 side sell 一手依据）"
        url: https://fgk.chinatax.gov.cn/zcfgk/c100009/c5193058/content.html
