      - title: 关于降低证券、期货市场监管费收费标准等问题的通知（发改价格〔2012〕2119号，mof.gov.cn，历史沿革）
        url: https://www.mof.gov.cn/zhengwuxinxi/zhengcefabu/201207/t20120714_666369.htm
        accessed: 2026-08-24
    quote: "一、证券期货业监管费标准 （一）业务监管费标准。对上海、深圳证券交易所收取证券业务监管费，按股票交易额的0.02‰收取。……四、证券期货业业务监管费标准自2018年1月1日起执行，《国家发展改革委 财政部关于重新核发银监会证监会保监会监管费等收费标准的通知》（发改价格〔2016〕14号）同时废止。／一、你会向上海、深圳证券交易所收取的证券交易监管费收费标准，对股票由按年交易额的0.04‰调整为按年交易额的0.02‰收取；对证券投资基金和债券免收证券交易监管费。"
