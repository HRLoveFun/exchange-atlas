    quote: "北京证券交易所上市公司向上海证券交易所科创板转板办法（试行） 发文文号 上证发〔2022〕34号 发布日期 2022年03月04日 生效日期 2022年03月04日 时效性 现行有效 ... 为了细化落实《中国证监会关于北京证券交易所上市公司转板的指导意见》，规范北京证券交易所上市公司向上海证券交易所（以下简称本所）科创板转板审核及上市安排等事宜"
