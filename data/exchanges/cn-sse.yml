  boards:
    - id: cn-sse-main
      name_zh: 主板
      financial_threshold: "发行后股本总额不低于5000万元，公开发行股份占公司股份总数25%以上（股本总额超4亿元的，比例为10%以上）；市值及财务指标三选一：①最近3年净利润均为正且累计不低于2亿元、最近一年净利润不低于1亿元，同时最近3年经营活动产生的现金流量净额累计不低于2亿元或营业收入累计不低于15亿元；②预计市值不低于50亿元，且最近一年净利润为正、营业收入不低于6亿元，最近3年经营活动现金流量净额累计不低于2.5亿元；③预计市值不低于100亿元，且最近一年净利润为正、营业收入不低于10亿元（以上净利润指扣除非经常性损益前后孰低者，均为经审计数值）；另有红筹企业、差异化表决权企业的专门标准（详见规则第3.1.4-3.1.6条），未逐条列入本摘要"
      target_companies: "大中型成熟企业"
    - id: cn-sse-star
      name_zh: 科创板
      name_native: "科创板"
      financial_threshold: "发行后股本总额不低于3000万元，公开发行股份占公司股份总数25%以上（股本总额超4亿元的，比例为10%以上）；市值及财务指标五选一：①预计市值不低于10亿元，最近两年净利润均为正且累计不低于5000万元，或预计市值不低于10亿元且最近一年净利润为正、营业收入不低于1亿元；②预计市值不低于15亿元，最近一年营业收入不低于2亿元，且最近三年累计研发投入占最近三年累计营业收入比例不低于15%；③预计市值不低于20亿元，最近一年营业收入不低于3亿元，且最近三年经营活动产生的现金流量净额累计不低于1亿元；④预计市值不低于30亿元，且最近一年营业收入不低于3亿元；⑤预计市值不低于40亿元，主要业务或产品需经国家有关部门批准、市场空间大、已取得阶段性成果（医药行业企业需至少一项核心产品获准开展二期临床试验，其他企业需具备明显技术优势）；另有红筹企业、差异化表决权企业的专门标准（详见规则第2.1.3-2.1.4条），未逐条列入本摘要"
      target_companies: "科技创新型企业，2019年设立，注册制试点板块"
      launched_year: 2019

  review_system:
    enum: registration
