  last_trading_day_rule:
    zh: "不适用——现货证券无到期日与『最后交易日』概念；中国结算对 A 股等品种实行多边净额结算与担保交收，清算义务随 T+1 交收完成而消灭"
    en: "Not applicable — cash securities have no expiry and thus no derivative-style last trading day; ChinaClear provides multilateral netting and guaranteed settlement for A-shares and other products, and clearing obligations are extinguished upon T+1 settlement"
    sources:
      - title: "《证券结算保证金管理办法》（中国结算官方 PDF，第五条适用范围——A 股/债券/基金的多边净额结算业务）"
        url: http://www.chinaclear.cn/zdjs/editor_file/20211030211400917.pdf
