  financial_transaction_tax:
    spec: {type: none, note: "中国的交易环节流转税即『证券交易印花税』（印花税的一个税目，见 stamp_duty），无另立的『金融交易税』税种：《印花税法》是交易凭证/证券交易类税收的完整立法，第一/二/三条把证券交易与合同、产权转移书据、营业账簿并列为印花税征税范围，未见独立 FTT 税目"}
    zh: "中国大陆对证券交易不另立独立于印花税之外的『金融交易税』税种：《中华人民共和国印花税法》（2021 通过、2022-07-01 施行）是交易凭证与证券交易类税收的完整立法——第一条规定『进行证券交易的单位和个人，为印花税的纳税人』，第二条列举应税凭证为合同、产权转移书据和营业账簿，第三条把『证券交易』并入印花税征税范围（即证券交易印花税，见 stamp_duty）。中国现行税种中无『金融交易税』；证券交易环节的国家税收即证券交易印花税（现行单边 0.05%）。"
    en: "Mainland China imposes no financial transaction tax separate from stamp duty on securities trading: the PRC Stamp Tax Law (passed 2021, effective 1 July 2022) is the complete legislation for taxes on transaction instruments and securities trading — Article 1 makes those 'engaging in securities transactions' taxpayers of the stamp tax, Article 2 lists the taxable instruments (contracts, property-transfer documents, business account books), and Article 3 brings 'securities transactions' within the stamp tax's scope (i.e. the securities transaction stamp duty, see stamp_duty). There is no 'financial transaction tax' among China's current taxes; the national tax at the trading stage is the securities transaction stamp duty (currently 0.05% one-sided)."
    sources:
      - title: 中华人民共和国印花税法（国家税务总局政策法规库，fgk.chinatax.gov.cn）
        url: https://fgk.chinatax.gov.cn/zcfgk/c100009/c5193058/content.html
        accessed: 2026-09-04
    quote: "第一条 在中华人民共和国境内书立应税凭证、进行证券交易的单位和个人，为印花税的纳税人，应当依照本法规定缴纳印花税。第二条 本法所称应税凭证，是指本法所附《印花税税目税率表》列明的合同、产权转移书据和营业账簿。第三条 本法所称证券交易，是指转让在依法设立的证券交易所、国务院批准的其他全国性证券交易场所交易的股票和以股票为基础的存托凭证。"
    confidence: medium
    verified: 2026-09-04
    detail: "2026-09-04（ADR-067 成本瀑布数据层长尾）：本字段原为空（草稿印象、未核实）。本次抓《印花税法》全文（fgk.chinatax.gov.cn 国家税务总局政策法规库）——该法把证券交易与合同/产权转移书据/营业账簿并列为印花税的征税范围（第一/二/三条），是中国交易环节税收的完整立法，无独立『金融交易税』税目。据此判 type: none（证券流转税即证券交易印花税，映射至 stamp_duty，沿用 ADR-002 语义）。confidence medium——《印花税法》是一手，但『无独立 FTT』是对『该法即完整立法』的结构性推断，非法条明文否定句。与 cn-szse 同步处置。"

