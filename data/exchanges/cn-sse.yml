  tick_size:
    spec:
      regime: per_instrument
      min_tick: 0.001
      currency: CNY
      full_table_note: "按证券类型（非按价格）分档：A 股 0.01 元人民币，基金 / 权证 0.001 元人民币，B 股 0.001 美元。科创板股票申报价格最小变动单位同为 0.01 元"
      note: "B 股以美元计价，最小变动单位 0.001 美元"
    zh: "A股 0.01 元人民币；基金/权证 0.001 元人民币；B股 0.001 美元"
    en: "A-shares RMB 0.01; funds/warrants RMB 0.001; B-shares USD 0.001"
    quote: "A 股的申报价格最小变动单位为 0.01 元人民币，基金、权证交易为 0.001 元人民币，B 股交易为 0.001 美元。"
