  suitability_management:
    zh: "投资者适当性管理制度为全市场统一框架：依《证券期货投资者适当性管理办法》（证监会令第130号公布，经2020年修订），向投资者销售证券期货产品或提供服务的经营机构须了解投资者信息、进行风险承受能力评估并做适当性匹配；在此基础上分板块设置准入门槛（如科创板另设资产与交易经验门槛，未核实最新标准原文，见 detail）"
    en: "A unified investor-suitability regime applies market-wide: under the Measures for the Administration of Suitability Management of Securities and Futures Investors (CSRC Order No. 130, revised 2020), institutions selling securities/futures products or providing services must understand investor information, assess risk tolerance and match products appropriately; individual boards add entry thresholds on top (e.g. STAR Market asset/trading-experience gates — latest criteria not verified, see detail)"
    sources:
