# ═══════════════════════════════════════════════
# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-12
    confidence: medium

  regulator:
    zh: "中国证券监督管理委员会"
    en: "China Securities Regulatory Commission (CSRC)"
    detail: "国务院直属正部级事业单位，统一监管全国证券期货市场。"
    sources:
      - title: 中国证监会官网
        url: http://www.csrc.gov.cn/
        accessed: 2026-08-12
    confidence: medium

  self_regulatory_org:
    zh: "一线自律监管：上海证券交易所自身承担对上市公司与会员的一线自律监管职能（官方简介明列其职能包括『组织和监督证券交易；对会员进行监管』等，且『受中国证监会监督和管理』）；券商层面另有中国证券业协会（自律组织）承担行业自律职责"
    en: "Front-line self-regulation: the Shanghai Stock Exchange itself exercises front-line self-regulatory functions over listed companies and members (its official profile lists 'organising and supervising securities trading; regulating members' among its functions, operating 'under the supervision and administration of the CSRC'); at the broker level, the Securities Association of China (SAC) undertakes industry self-regulation"
    detail: "由 low 升级：以本所官网『本所简介』一手坐实交易所的自律监管职能与证监会监管关系；证券业协会一句为制度常识性补充，未单独登记来源，不作为字段主要论断。"
    sources:
      - title: "本所简介（上海证券交易所官网，成立时间、职能与证监会监管关系的官方表述）"
        url: https://www.sse.com.cn/aboutus/overview/
        accessed: 2026-09-05
    quote: "上海证券交易所成立于1990年11月26日，同年12月19日开业，受中国证监会监督和管理。 ... 组织和监督证券交易；对会员进行监管"
    confidence: medium
    en: "Securities Association of China (SAC)"
    confidence: low
    detail: "SAC 官网本次抓取失败（HTTP 异常），其与交易所自律监管的职责边界未逐条核实，见 OPEN-QUESTIONS。"

  clearing_regulator:
    zh: "中国证券监督管理委员会（对中国结算的监管）"
    en: "CSRC"
    confidence: medium

  core_laws:
    zh: "《中华人民共和国证券法》"
    en: "Securities Law of the People's Republic of China"
    detail: "另有《上海证券交易所交易规则》《股票上市规则》等交易所自律规则体系，效力位阶低于证券法。
      英文官方译名此前未核实（曾尝试 npc.gov.cn 与 csrc.gov.cn 英文站均未能定位到该法英译本直链），
      2026-08-20 改从 SSE 官方《交易规则》英文译本（2026年修订版）第1.1条法律依据条款核实到官方
      英译名，见下方 quote。"
    sources:
      - title: 中华人民共和国证券法（全国人大官网）
        url: http://www.npc.gov.cn/npc///c2/c30834/201912/t20191231_304436.html
        accessed: 2026-08-12
      - title: "Trading Rules of Shanghai Stock Exchange (2026 Revision) — Article 1.1"
        url: https://english.sse.com.cn/start/sserules/stocks/trading/c/10825757/files/d263e3a87f37436ca2f8e5bcfc4ff001.pdf
        accessed: 2026-08-20
    quote: "these Rules are formulated in accordance with the Securities Law of the People's Republic of China"
    confidence: high

  foreign_ownership_limit:
    zh: "单个境外投资者持有单个上市公司股份不得超过该公司股份总数的10%；全部境外投资者合计持股不得超过30%；对上市公司战略投资的持股不受此比例限制"
    en: "A single foreign investor may not hold more than 10% of a listed company's total shares; all foreign investors combined may not exceed 30%; strategic-investment stakes in listed companies are exempt from this cap"
    detail: "适用于合格境外机构投资者（QFII）与人民币合格境外机构投资者（RQFII）及其他境外投资者的境内证券投资，为2020年11月1日起施行的现行版本。"
    sources:
      - title: 关于实施《合格境外机构投资者和人民币合格境外机构投资者境内证券期货投资管理办法》有关问题的规定
        url: https://www.sse.com.cn/lawandrules/regulations/csrcannoun/c/10117179/files/9cdbd4b41fc3453e8f8a036719ea8e24.pdf
        accessed: 2026-08-24
    quote: "七、合格境外投资者及其他境外投资者的境内证券投资，应当遵循下列持股比例限制：（一）单个合格境外投资者或其他境外投资者持有单个上市公司或者挂牌公司的股份，不得超过该公司股份总数的10%；（二）全部合格境外投资者及其他境外投资者持有单个公司A股或者境内挂牌股份的总和，不得超过该公司股份总数的30%。合格境外投资者及其他境外投资者依法对上市公司战略投资的，其战略投资的持股不受前款规定的比例限制。"
    confidence: high

  capital_controls:
    zh: "境外投资者须通过合格境外投资者（QFII/RQFII）等渠道并委托境内托管人参与境内证券投资，跨境资金流动纳入中国证监会、央行、外汇局联合监管协调机制；人民币资本项下尚未完全可自由兑换"
    en: "Foreign investors must access the domestic securities market via qualified-investor channels (QFII/RQFII) through a domestic custodian; cross-border fund flows are subject to coordinated oversight by the CSRC, the People's Bank of China and the State Administration of Foreign Exchange (SAFE); the renminbi is not yet fully convertible under the capital account"
    detail: "本条聚焦证券投资渠道下的跨境资金监管框架；具体购汇/结汇额度、锁定期等操作性细节本次未核实到明确条款——现行（2020年11月起施行）版本的规定条文中未见相关限制表述，不排除是此前额度管理已被简化，但未找到明文废止/确认的条款，故 zh/en 均不断言「额度已取消」，只描述已核实到的托管+联合监管机制。"
    sources:
      - title: 关于实施《合格境外机构投资者和人民币合格境外机构投资者境内证券期货投资管理办法》有关问题的规定
        url: https://www.sse.com.cn/lawandrules/regulations/csrcannoun/c/10117179/files/9cdbd4b41fc3453e8f8a036719ea8e24.pdf
        accessed: 2026-08-24
    quote: "中国证监会、人民银行、外汇局就合格境外投资者投资境内证券期货的情况加强监管协调，建立信息共享机制。"
    confidence: medium

  disclosure_requirements:
    zh: "披露文本以中文为准；同时采用外文文本的，两种文本发生歧义时以中文文本为准。定期报告含年度报告（会计年度结束后4个月内）、半年度报告（上半年结束后2个月内）、季度报告（前3个月/前9个月结束后1个月内），另有重大事项临时报告义务"
    en: "Disclosures must be made in Chinese as the authoritative text — if a foreign-language version is also issued and the two differ, the Chinese text prevails. Periodic reports comprise the annual report (within 4 months after fiscal year-end), the semi-annual report (within 2 months after the first half-year ends) and quarterly reports (within 1 month after the first 3/9 months end), in addition to ad hoc disclosure duties for material events"
    detail: "出处为《上海证券交易所股票上市规则（2026年4月修订）》第二章「信息披露的基本原则和一般规定」2.2.1条与第五章「定期报告」5.2.1-5.2.2条；与 CSRC 层面《上市公司信息披露管理办法》（第226号令，2025年7月1日起施行，本次仅核实到公告元数据未核实到全文，见 SOURCES.md）并行适用，本条聚焦交易所自律规则层面可摘引的条文。"
    sources:
      - title: 上海证券交易所股票上市规则（2026年4月修订）全文，第二章 2.2.1条、第五章 5.2.1-5.2.2条
        url: https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/mainipo/c/10816589/files/0017fa2bde184b53b43c046d503f54d0.docx
        accessed: 2026-08-24
    quote: "上市公司应当在每个会计年度结束后4个月内披露年度报告，应当在每个会计年度的上半年结束后2个月内披露半年度报告，应当在每个会计年度前3个月、前9个月结束后1个月内披露季度报告。"
    confidence: high

  investor_protection:
    zh: "设有国务院出资、归口证监会管理的中国证券投资者保护基金有限责任公司，证券公司被撤销/关闭/破产或被行政接管、托管经营时，按规定用基金对债权人（投资者）予以偿付；基金来源包括交易所经手费的一定比例、证券公司按营业收入0.5%-5%缴纳等"
    en: "China Securities Investor Protection Fund Corporation Ltd — funded by the State Council and supervised by the CSRC — pays compensation to creditors (investors) out of the fund when a securities company is revoked, closed, goes bankrupt, or is placed under administrative takeover/custodial management; the fund is financed by, among other sources, a share of exchange handling fees and contributions from securities companies set at 0.5%-5% of their operating revenue"
    detail: "出处为《证券投资者保护基金管理办法》（2016年修订，中国证监会令第124号），托管于基金公司自身官网 sipf.com.cn；该办法针对的是证券公司风险处置场景下的投资者偿付机制，不同于交易所层面的投资者纠纷调解/教育类工作（后者未在本条核实）。"
    sources:
      - title: 证券投资者保护基金管理办法（2016年修订，中国证监会令第124号）
        url: http://www.sipf.com.cn/tbfg/2020/03/12872.shtml
        accessed: 2026-08-24
    quote: "第二条 证券投资者保护基金（以下简称基金）是指按照本办法筹集形成的、在防范和处置证券公司风险中用于保护证券投资者利益的资金。设立国有独资的中国证券投资者保护基金有限责任公司（以下简称基金公司），负责基金的筹集、管理和使用。／第十四条 基金的来源：（一）上海、深圳证券交易所在风险基金分别达到规定的上限后，交易经手费的20%纳入基金；（二）所有在中国境内注册的证券公司，按其营业收入的0.5–5%缴纳基金"
    confidence: high

