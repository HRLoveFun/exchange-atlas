        url: https://shanghai.chinatax.gov.cn/zcfw/rdwd/201512/t420630.html
        accessed: 2026-09-05
    quote: "根据《财政部国家税务总局证监会关于上市公司股息红利差别化个人所得税政策有关问题的通知》（财税〔2015〕101号）的规定，个人从公开发行和转让市场取得的上市公司股票，持股期限超过1年的,股息红利所得暂免征收个人所得税。个人从公开发行和转让市场取得的上市公司股票，持股期限在1个月以内（含1个月）的，其股息红利所得全额计入应纳税所得额；持股期限在1个月以上至1年（含1年）的，暂减按50%计入应纳税所得额;上述所得统一适用20%的税率计征个人所得税。"
    confidence: high

  implicit_costs_note:
    zh: "隐性成本主要来自买卖价差与市场冲击成本；A股最小价格变动单位为0.01元人民币，叠加百分比涨跌幅限制（主板±10%、科创板±20%）在极端行情下可能加剧流动性缺口、扩大有效价差"
    en: "Implicit costs stem mainly from the bid-ask spread and market-impact cost; the RMB 0.01 minimum tick size for A-shares, combined with the percentage price-limit bands (±10% on the Main Board, ±20% on the STAR Market), can widen effective spreads and worsen liquidity gaps during extreme price moves"
    detail: "本条为综合 market_structure.tick_size 与 market_structure.price_limits（均已有独立来源）的分析性归纳，并非某一份文档专门论述「隐性成本」这一概念本身，故 confidence 标 medium。"
    sources:
      - title: 上海证券交易所交易规则（2023年修订），经 mgzq.com 镜像获取，见 SOURCES.md 说明
        url: https://www.mgzq.com/userfiles/ecb5375bc6ab4174a6d9fb405222c2a7/files/cms/article/上海证券交易所交易规则（2023年修订）.pdf
        accessed: 2026-08-12
    confidence: medium

