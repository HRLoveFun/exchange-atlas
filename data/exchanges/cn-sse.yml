  political_risk_note:
    zh: "境外投资者参与 A 股的政策/政治风险制度核：国家对外商投资实行准入前国民待遇加负面清单管理制度——负面清单规定禁止投资的领域，外国投资者不得投资；规定限制投资的领域，进行投资应当符合负面清单规定的条件（《外商投资法》第二十八条）；国家建立外商投资安全审查制度，对影响或者可能影响国家安全的外商投资进行安全审查，依法作出的安全审查决定为最终决定（《外商投资法》第三十五条，见 sources）。上述准入管理与安全审查属国家层面制度，沪深两市同受其约束；与监管机构的日常执法边界见 enforcement_note"
    en: "Institutional core of policy/political risk for foreign participation in A-shares: the state applies pre-establishment national treatment plus a negative-list management regime for foreign investment — sectors on the prohibited list are off-limits to foreign investors, and investment in restricted sectors must meet the negative-list conditions (Foreign Investment Law, official text); the state has established a foreign-investment security review regime covering investments that affect or may affect national security, and security review decisions made in accordance with law are final (Foreign Investment Law, see sources). These access-management and security-review arrangements are national-level institutions binding both SSE and SZSE; the day-to-day enforcement perimeter is covered in enforcement_note"
    quote: "国家建立外商投资安全审查制度，对影响或者可能影响国家安全的外商投资进行安全审查。依法作出的安全审查决定为最终决定。"
    sources:
      - title: "《中华人民共和国外商投资法》全文（中联办官网转载；第二十八条负面清单管理、第三十五条安全审查制度）"
        url: https://www.locpg.gov.cn/jsdt/2019-03/20/c_1210087363.htm
        accessed: 2026-09-05
    detail: "原留空原因（地缘制裁维度无一手原文可落地）仍成立并保留于 OPEN-QUESTIONS；本条按制度核口径填入具名法条（外商投资法）官方逐字原文，仅覆盖外资准入与安全审查这一政治/政策风险核心，不作地缘政治分析。"
    confidence: high
    verified: 2026-09-05

  liquidity_risk_note:
    zh: "个股层面：被实施风险警示（ST/*ST）或处于退市整理期的股票流动性通常显著下降；交易类强制退市本身设有成交量门槛（如仅发行A股的公司连续90个交易日累计成交量低于375万股，即应披露终止上市风险提示），成交低迷本身就是触发强制退市的情形之一，反映流动性枯竭与强制退市机制的直接联动"
    en: "At the individual-stock level, liquidity typically drops sharply once a stock is placed under risk warning (ST/*ST) or enters the delisting transition period; trading-based mandatory delisting itself uses a turnover threshold (e.g. for a company that has issued only A-shares, cumulative trading volume below 3.75 million shares over 90 consecutive trading days triggers a disclosure of possible delisting risk) — illustrating that depressed trading volume is itself one of the triggers for mandatory delisting"
    detail: "成交量触发退市风险提示的具体门槛出处为《上海证券交易所股票上市规则（2026年4月修订）》第九章第二节「交易类强制退市」9.2.2条，与 listing.delisting_conditions（退市条件总览，第三方来源）互补；本条聚焦交易类退市中与流动性直接相关的量化触发线，直接引自交易所规则原文。"
    sources:
      - title: 上海证券交易所股票上市规则（2026年4月修订）全文，第九章第二节 9.2.2条
        url: https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/mainipo/c/10816589/files/0017fa2bde184b53b43c046d503f54d0.docx
        accessed: 2026-08-24
    quote: "在本所仅发行A股股票的上市公司，出现连续90个交易日（不包含公司股票停牌日）通过本所交易系统实现的累计股票成交量低于375万股的，应当在次一交易日披露公司股票可能被终止上市的风险提示公告"
    confidence: high

  regulatory_change_risk_note:
    zh: "监管规则处于高频修订期，规则变动风险较高：可核实的官方样本包括——《股票上市规则》2026年4月修订（整合修订持续生效文本）、《股票发行上市审核规则》2024年4月修订、2024-07-11 起暂停转融券业务等融券逆周期调整措施；上市、审核与交易环节的核心规则近年均经历多次修订，参与者需要持续跟踪规则版本变化"
    en: "Regulatory rules are in a high-frequency revision cycle, making rule-change risk material: verifiable official samples include the April 2026 revision of the Listing Rules (consolidated and in force), the April 2024 revision of the Issuance and Listing Review Rules, and the suspension of securities refinancing (转融券) from 11 July 2024; core listing, review and trading rules have all seen multiple revisions in recent years, so participants must track rule-version changes continuously"
    detail: "分析性字段：以三份已在缓存的官方文件（上市规则 2026 修订 DOCX、审核规则 2024 修订 DOCX、转融券暂停要闻）作为『规则高频修订』的正面事件锚点；『规则变动风险较高』为基于修订频率的归纳判断，非引用专门论述该风险的官方文本。"
    sources:
