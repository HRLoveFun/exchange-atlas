  stamp_duty:
    spec: {rate: 0.5, unit: permille, side: sell, note: "证券交易印花税：现行单边 0.5‰（2023-08-28 起减半，此前 1‰），由 财政部/税务总局公告调整；side: sell 由《印花税法》第三条一手坐实——『证券交易印花税对证券交易的出让方征收，不对受让方征收』"}
    zh: "0.05%（单边，卖方缴纳）：证券交易印花税自 2023 年 8 月 28 日起由单边 1‰ 减半至 0.5‰。征收方向为卖方——《中华人民共和国印花税法》（2021 通过、2022-07-01 施行）第三条明文『证券交易印花税对证券交易的出让方征收，不对受让方征收』。印花税为全国统一税率的国家税种、非交易所自定，上交所与深交所适用同一税率。"
    en: "0.05% (one-sided, paid by the seller): the securities transaction stamp duty was halved from 1‰ to 0.5‰ per side from 28 August 2023. The seller side is confirmed by Article 3 of the PRC Stamp Tax Law (passed 2021, effective 1 July 2022): 'the securities transaction stamp duty is levied on the transferor of a securities transaction, not on the transferee'. Stamp duty is a nationally uniform state tax set centrally, not by the exchange, and SSE and SZSE apply the same rate."
    detail: |
      2023年8月28日起，证券交易印花税由此前的单边1‰减半下调至单边0.5‰，仅对卖方征收。
