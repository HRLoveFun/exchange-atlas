  circuit_breaker:
    enum: none
    spec: {type: none}
    zh: "无指数级熔断（2016年1月8日起暂停实施）"
    en: "No index-level circuit breaker (suspended since 8 January 2016)"
    detail: |
      2015年12月本所曾在《交易规则》第四章第五节新增"指数熔断"机制（以沪深300指数为基准，
      5%/7%两档阈值），实施4个交易日后于2016年1月8日起暂停，此后未恢复。现行规则中已无该章节。
      个股级另有临时停牌机制，见 volatility_interruption / trading_halt_mechanism。
      交叉核实：SSE 官方《交易规则》英文译本（2026年修订版）修订历史里"Circuit Breaker"仅在
      2015年12月4日新增该节的记录中出现一次（"the sixth time on December 4, 2015 by the Notice
      of Adding Chapter IV Section 5 'Circuit Breaker' to the Trading Rules"），正文再无相关章节
      （现行第四章标题为"Other Trading-Related Matters"，不含"Circuit Breaker"字样），与"已暂停
      且未恢复"的结论一致，en 字段 2026-08-20 据此补上。
    sources:
      - title: 关于暂停实施指数熔断机制的通知（上证发〔2016〕4号）
        url: http://www.sse.com.cn/aboutus/mediacenter/hotandd/c/c_20160107_4033450.shtml
        accessed: 2026-08-12
      - title: "Trading Rules of Shanghai Stock Exchange (2026 Revision) 修订历史 — SSE 官方英文译本，仅供参考，中文本为准"
        url: https://english.sse.com.cn/start/sserules/stocks/trading/c/10825757/files/d263e3a87f37436ca2f8e5bcfc4ff001.pdf
        accessed: 2026-08-20
    quote: "上证发〔2016〕4号 各市场参与人：为维护市场平稳运行，经中国证监会批准，上海证券交易所决定自2016年1月8日起暂停实施《上海证券交易所交易规则》第四章第五节规定的「指数熔断」机制。／the sixth time on December 4, 2015 by the Notice of Adding Chapter IV Section 5 \"Circuit Breaker\" to the Trading Rules of Shanghai Stock Exchange"

  volatility_interruption:
    spec: {type: stock_level, halt_minutes: 10, note: "科创板无涨跌幅限制股票（新股前 5 日等）盘中涨跌达 ±30% 或 ±60% 触发 10 分钟临时停牌；「异常波动/严重异常波动」两级指标仅触发信息披露不中断交易"}
    zh: "科创板设「异常波动」与「严重异常波动」两级指标并公告，不中断交易；无涨跌幅限制股票另有盘中30%/60%触发的10分钟临时停牌"
    en: "STAR Market has two tiers of public disclosure triggers — \"abnormal fluctuation\" and \"severe abnormal fluctuation\" — that do not interrupt trading; stocks without a price-limit band separately have a 10-minute intraday trading halt triggered at 30%/60% price moves"
    detail: |
      科创板异常波动：连续3个交易日内日收盘价涨跌幅偏离值累计达±30%。
      严重异常波动：连续10个交易日内累计达+100%/-50%，或连续30个交易日内累计达+200%/-70%。
      触发后本所公布相关信息（如异常交易营业部名单），不直接中断交易，属于信息披露与监控机制而非熔断。
      英文对照此前未核实到官方译本中的对应条款（SSE 英文版《交易规则》第六章科创板专章未见
      "abnormal fluctuation" 类表述），2026-08-20 改为直接翻译已核实的中文 quote，未采用官方
      译本原文（因其确实没有对应条款可摘引）。
    quote: "连续 3 个交易日内日收盘价格涨跌幅偏离值累计达到±30%／连续 10 个交易日内日收盘价格涨跌幅偏离值累计达到＋100%（-50%）；连续 30 个交易日内日收盘价格涨跌幅偏离值累计达到＋200%（-70%）"

  trading_halt_mechanism:
    zh: "无涨跌幅限制的股票盘中较开盘价首次涨跌达30%或60%，实施单次10分钟临时停牌；另有因违规嫌疑的特别停牌"
    en: "For stocks without a price-limit band, a single 10-minute intraday trading halt is triggered the first time the intraday price rises or falls 30% or 60% from that day's opening price; a separate special halt applies where rule violations are suspected"
    quote: "本所股票竞价交易出现下列情形之一的，本所实施盘中临时停牌，单次盘中临时停牌时间为 10 分钟：（一）无价格涨跌幅限制的股票盘中交易价格较当日开盘价格首次上涨或下跌达到或超过 30%的；（二）……达到或超过 60%的"

  error_trade_rule:
    spec:
      bust_allowed: true
      review_window_min: null
      deviation_threshold_pct: null
      resolution: cancel
      note: "成交依规则达成即具法律效力，买卖双方须接受成交结果并履行清算交收义务，无欧美式『偏离参考价达某百分比、限时申请复核作废』的常规错误交易流程。交易所仅在窄口径情形可宣布交易无效：不可抗力 / 意外事件 / 非法侵入交易系统等致严重后果、成交显失公平、成交违反规则并严重扰乱市场秩序。事前防线：涨跌停 / 价格笼子 / 有效申报价格范围 / 无效申报剔除。第八章另规定重大技术故障、重大人为差错等紧急情况下可取消交易并通知登记结算机构暂停结算"
    zh: "依规则达成的成交自成交时起即具法律效力，买卖双方均应当接受成交结果、履行清算交收义务。上海证券交易所没有欧美式『成交价偏离参考价达某百分比、限时申请复核并作废』的常规错误交易处理机制。仅在因不可抗力、意外事件、非法侵入交易系统等原因致成交产生严重后果，或成交显失公平，或成交违反交易规则并严重扰乱市场正常秩序的窄口径情形下，交易所方可采取措施或宣布交易无效"
    en: "A transaction concluded under the Rules is legally effective from the moment of its conclusion; both buyer and seller must accept the result and perform their clearing and settlement obligations. The SSE has no routine erroneous-trade process of the US/EU type (a deviation-from-reference-price threshold plus a time-limited request for review and cancellation). The Exchange may take measures or declare a transaction void only in narrow circumstances — where force majeure, an accident, illegal intrusion into the trading system or similar causes serious consequences, where a transaction is manifestly unfair, or where a transaction violates the Rules and seriously disrupts the normal order of the market"
    detail: "上海证券交易所交易规则 3.5.5 + 第八章（交易异常情况处理）。与 trading_halt_mechanism（盘中临时停牌）视角不同。中国 A 股与日本 / 香港证券市场同属『成交近乎终局、靠事前价格控制防误单』一类，与欧美的偏离阈值复核制度形成对比。deviation_threshold_pct / review_window_min 均留 null（原文无量化门槛）。quote 引自 SSE 官方英文译本（中文本为准）。"
    sources:
      - title: 上海证券交易所交易规则（2023年修订）3.5.5 / 第八章，经 mgzq.com 镜像获取
        url: https://www.mgzq.com/userfiles/ecb5375bc6ab4174a6d9fb405222c2a7/files/cms/article/上海证券交易所交易规则（2023年修订）.pdf
        accessed: 2026-08-12
      - title: "Trading Rules of Shanghai Stock Exchange — SSE 官方英文译本（3.5.5 / Chapter VIII），仅供参考，中文本为准"
        url: https://english.sse.com.cn/start/sserules/stocks/trading/c/10825757/files/d263e3a87f37436ca2f8e5bcfc4ff001.pdf
        accessed: 2026-08-13
    quote: "For a transaction that results in serious consequences due to force majeure, accidents, illegal intrusion into the trading system, or other reasons, the Exchange may take appropriate measures or declare the transaction void. For a transaction that is manifestly unfair, the Exchange may, upon its determination, take appropriate measures. Where a transaction violates these Rules and seriously disrupts the normal operation of the securities market, the Exchange has the right to cancel it"
    confidence: high

  order_book_transparency:
    zh: "盘前：中央订单簿公开——连续竞价阶段的实时行情向市场发布各证券的即时最高五档买入申报价格及数量、即时最低五档卖出申报价格及数量（Level-1）；Level-2 行情另提供十档及逐笔委托。证券市场不提供冰山 / 隐藏 / 未披露委托类型。盘中另设『价格笼子』限制申报价格偏离范围。盘后：成交实时揭示，大宗交易单独申报并披露"
    en: "Pre-trade: the central order book is public — real-time market data during continuous auction disseminates, for each security, the best five bid prices and quantities and the best five ask prices and quantities (Level-1); Level-2 data additionally provides ten price levels and order-by-order feeds. The securities market offers no iceberg, hidden or undisclosed order types. An intraday 'price cage' limits how far an order price may deviate. Post-trade: executions are shown in real time; block trades are reported and disclosed separately"
    detail: "字段管本所订单簿内部的（非）展示流动性——A 股订单簿全展示、无非展示订单类型，与欧美市场是显著差异。行情层级 / 收费见第十章 market_data_levels。quote 引自 SSE 官方英文译本 5.2.2。"
    sources:
      - title: "Trading Rules of Shanghai Stock Exchange — SSE 官方英文译本 5.2.2，仅供参考，中文本为准"
        url: https://english.sse.com.cn/start/sserules/stocks/trading/c/10825757/files/d263e3a87f37436ca2f8e5bcfc4ff001.pdf
        accessed: 2026-08-13
    quote: "The real-time quotations during continuous auction include, with respect to each type of security, its code, short name, previous closing price, last execution price, highest execution price of the day, lowest execution price of the day, cumulative trading volume and transaction value of the day, the five real-time highest bids and their quantities, and the five real-time lowest asks and their quantities."
    confidence: high

  intraday_reversal:
    enum: t1
    zh: "T+1（股票整体）；部分品种（跨境/商品/货币/黄金ETF、权证等）实行 T+0"
    en: "T+1 for stocks overall; certain products (cross-border/commodity/currency/gold ETFs, warrants, etc.) trade T+0"
    detail: "投资者买入证券在交收前不得卖出（T+1），但债券型ETF、货币型ETF、黄金ETF、商品期货ETF、跨境ETF、跨境上市开放式基金、权证等品种实行当日回转交易（T+0）。"
    quote: "投资者买入的证券，在交收前不得卖出，但实行回转交易的除外。／下列品种实行当日回转交易：（一）债券交易型开放式指数基金；……（七）权证"

  short_selling:
    enum: restricted_list
    spec: {naked_allowed: false, uptick_rule: null, borrow_required: true, note: "融资融券制度，限指定标的范围内进行；报升规则具体表述未核实；转融券业务 2024-07-11 起暂停（见 sources）"}
    zh: "融券（卖空）经融资融券制度在指定标的范围内进行（裸卖空不允许、须借券），且处于持续收紧的逆周期调节之下：2024-07-10 经证监会批准，中证金融公司暂停转融券业务（自 2024-07-11 起实施），融券卖空的实际可用券源因此大幅收缩"
    en: "Securities lending (short selling) runs through the margin-trading regime on designated eligible securities (no naked shorting; borrowing required), under progressively tightening counter-cyclical adjustment: with CSRC approval, China Securities Finance suspended its securities-refinancing business from 11 July 2024, materially shrinking the lendable supply for short selling"
    confidence: medium
