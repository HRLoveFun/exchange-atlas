        accessed: 2026-08-13

  order_types:
    zh: "限价申报；市价申报（仅限连续竞价阶段）"
    en: "Limit Order; Market Order (continuous auction only)"
    quote: "市价申报只适用于连续竞价期间的交易"
    sources:
      - title: 上海证券交易所交易规则（2023年修订）第3.1.4条，经 mgzq.com 镜像获取，见 SOURCES.md 说明
