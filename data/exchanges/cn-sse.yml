    quote: "第一条 为了规范证券期货投资者适当性管理，维护投资者合法权益，根据《 证券法 》《 证券投资基金法 》《 证券公司监督管理条例 》《 期货交易管理条例 》及其他相关法律、行政法规，制定本办法。 第二条 向投资者销售公开或者非公开发行的 证券 、公开或者非公开募集的 证券投资基金 和 股权投资基金 （包括创业投资基金，以下简称基金）、公开或者非公开转让的期货及其他衍生产品，或者为投资者提供相关业务服务的，适用本办法。"
