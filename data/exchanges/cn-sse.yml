      quote: "合约标的为股票的，期权交易的委托、申报及成交价格为每股股票对应的权利金金额，申报价格最小变动单位为0.001元人民币；合约标的为交易所交易基金的，期权交易的委托、申报及成交价格为每份交易所交易基金对应的权利金金额，申报价格最小变动单位为0.0001元人民币。"
