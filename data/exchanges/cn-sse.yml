    quote: "第十七条 符合法律、行政法规、国务院证券监督管理机构及本公司有关规定的自然人、法人、合伙企业以及其他投资者，可以申请开立证券账户。／第十九条 子账户包括人民币普通股票账户（以下称为A股账户）、人民币特种股票账户（以下称为B股账户）、全国中小企业股份转让系统账户（以下简称股转系统账户）、封闭式基金账户、开放式基金账户以及本公司根据业务需要设立的其他证券账户。／第二十三条 投资者应当以本人名义申请开立证券账户，不得冒用他人名义或使用虚假证件开立证券账户。"
