    quote: "根据《财政部国家税务总局证监会关于上市公司股息红利差别化个人所得税政策有关问题的通知》（财税〔2015〕101号）的规定,个人从公开发行和转让市场取得的上市公司股票,持股期限超过1年的,股息红利所得暂免征收个人所得税。个人从公开发行和转让市场取得的上市公司股票,持股期限在1个月以内(含1个月)的,其股息红利所得全额计入应纳税所得额;持股期限在1个月以上至1年(含1年)的,暂减按50%计入应纳税所得额;上述所得统一适用20%的税率计征个人所得税。"
