      en: "RMB 0.0001 for ETF-underlying options (currently all SSE-listed option products); the rules separately provide for RMB 0.001 on stock-underlying options, not yet in actual use as SSE has not listed any stock options"
      sources:
        - title: 上海证券交易所股票期权试点交易规则 第五十九条
