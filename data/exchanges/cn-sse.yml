  order_book_transparency:
    zh: "盘前：中央订单簿公开——连续竞价阶段的实时行情向市场发布各证券的即时最高五档买入申报价格及数量、即时最低五档卖出申报价格及数量（Level-1）；Level-2 行情另提供十档及逐笔委托。证券市场不提供冰山 / 隐藏 / 未披露委托类型。盘中另设『价格笼子』限制申报价格偏离范围。盘后：成交实时揭示，大宗交易单独申报并披露"
    en: "Pre-trade: the central order book is public — real-time market data during continuous auction disseminates, for each security, the best five bid prices and quantities and the best five ask prices and quantities (Level-1); Level-2 data additionally provides ten price levels and order-by-order feeds. The securities market offers no iceberg, hidden or undisclosed order types. An intraday 'price cage' limits how far an order price may deviate. Post-trade: executions are shown in real time; block trades are reported and disclosed separately"
    detail: "字段管本所订单簿内部的（非）展示流动性——A 股订单簿全展示、无非展示订单类型，与欧美市场是显著差异。行情层级 / 收费见第十章 market_data_levels。quote 引自 SSE 官方英文译本 5.2.2。"
