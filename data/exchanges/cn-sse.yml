  enforcement_note:
    zh: "执法与稽查制度核：国务院证券监督管理机构（中国证监会）依法对全国证券市场实行集中统一监督管理；证券法第一百七十条规定其依法履行职责时有权采取的措施，包括对证券发行人、证券公司、证券服务机构、证券交易场所、证券登记结算机构进行现场检查，进入涉嫌违法行为发生场所调查取证，以及查阅复制当事人及有关单位和个人的证券交易记录、登记过户记录等资料，对可能被转移、隐匿或者毁损的文件和资料予以封存、扣押（见 sources）。上交所作为证券交易场所属于上述现场检查的明列对象；交易所自律处分与 listing.delisting_conditions 衔接"
    en: "Enforcement is centralised: the CSRC (the State Council securities regulatory authority) exercises unified regulation over the national securities market; under the PRC Securities Law it may, in performing its duties, conduct on-site inspections of securities issuers, securities companies, securities service agencies, trading venues and depositary/clearing institutions, enter premises where suspected violations occurred to investigate and collect evidence, and inspect/copy trading and registration-transfer records, sealing or seizing documents and materials at risk of being transferred, hidden or destroyed (PRC Securities Law, see sources). SSE, as a trading venue, is expressly within the enumerated inspection scope; exchange self-regulatory discipline links with listing.delisting_conditions"
    quote: "国务院证券监督管理机构依法履行职责，有权采取下列措施：（一）对证券发行人、证券公司、证券服务机构、证券交易场所、证券登记结算机构进行现场检查；（二）进入涉嫌违法行为发生场所调查取证；"
    sources:
      - title: "《中华人民共和国证券法》（2019 修订）全文（中国人大网；第一百七十条证监会执法措施）"
