        accessed: 2026-08-12
    confidence: medium

  trading_sessions:
    pre_market:
      spec: {start: "09:15", end: "09:25", kind: opening_auction}
      zh: "无独立盘前时段；9:15-9:25 为开盘集合竞价"
      en: "No separate pre-market session; 9:15-9:25 is the opening call auction"
    continuous_am:
      spec: {start: "09:30", end: "11:30", kind: continuous}
      zh: "9:30-11:30"
      en: "9:30-11:30"
    lunch_break:
      spec: {start: "11:30", end: "13:00", kind: lunch_recess}
      zh: "11:30-13:00"
      en: "11:30-13:00"
    continuous_pm:
      spec: {start: "13:00", end: "15:00", kind: continuous, note: "14:57-15:00 为收盘集合竞价，见 closing_mechanism"}
      zh: "13:00-15:00（普通证券 13:00-14:57 连续竞价 + 14:57-15:00 收盘集合竞价；基金交易 13:00-15:00 全程连续竞价，无独立收盘集合竞价）"
      en: "13:00-15:00 (ordinary securities: 13:00-14:57 continuous auction + 14:57-15:00 closing call auction; fund trading: continuous auction throughout 13:00-15:00, with no separate closing call auction)"
      quote: "9:30 至 11:30、13:00 至 14:57 为连续竞价时间，14:57 至 15:00 为收盘集合竞价时间。基金交易，每个交易日的 9:15 至 9:25 为开盘集合竞价时间，9:30 至 11:30、13:00 至 15:00 为连续竞价时间。"
    after_market:
      spec: {start: "15:05", end: "15:30", kind: fixed_price, note: "仅科创板股票"}
      zh: "科创板股票另有盘后固定价格交易，15:05-15:30，按当日收盘价成交"
      en: "STAR Market stocks additionally have an after-hours fixed-price trading session, 15:05-15:30, executed at that day's closing price"
      quote: "每个交易日的 15:05 至 15:30 为盘后固定价格交易时间，当日 15:00 仍处于停牌状态的股票不进行盘后固定价格交易。"
