    zh: "订单驱动：证券竞价交易按价格优先、时间优先的原则在中央订单簿撮合，无做市商介入；仅科创板股票交易可实行做市商机制，由做市商提供双边报价服务"
    en: "Order-driven: auction trading is matched in the central order book on price-then-time priority with no dealer intervention; only STAR Market stocks may operate a market-making mechanism under which market makers provide two-sided quotes"
    detail: "enum 依据既有 matching_principle（价格优先、时间优先）与 market_maker_scheme（仅科创板可实行做市商机制）的已核实 quote 综合判定：主板为纯订单驱动，科创板做市为补充、不改变市场基本形态。dealer_intermediated 记 false（就主板而言）。"
