      quote: "Intraday: Matching takes place based on price and time priority. ... The Derivatives Trading System assigns order priority based on price and time of entry to the Derivatives Trading System. It gives the highest buy order prices the highest priority. Conversely, it gives the lowest sell order prices the highest priority. ... The Derivatives Trading System always gives market orders the highest priority."
