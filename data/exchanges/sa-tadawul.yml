    quote: "An issuer whose shares are listed on the Parallel Market may only make an application to transfer to the Main Market after two calendar years from the day on which its shares were listed on the Parallel Market. ... The absence of a suspension case in accordance with Article 38 of these Rules to the Issuer's shares, within the twelve months prior to the submission of the application for transfer to the Main Market..."
    confidence: high

  continuing_obligations:
    zh: "上市后持续义务集中于 Listing Rules Part 5（Articles 27–33）：发行人须按适用要求持续披露，所有披露须完整、清晰、准确、不误导；须披露可能影响证券价格的行为；交易所可要求提供进一步信息；并须遵守持续上市标准（如最低平均收盘价等）"
    en: "Post-listing continuing obligations are set out in Listing Rules Part 5 (Articles 27–33): issuers must make ongoing disclosures as required, all disclosures complete/clear/accurate/not misleading; disclose price-sensitive actions; the Exchange may require further information; and meet continued-listing standards (e.g. minimum average closing price)"
