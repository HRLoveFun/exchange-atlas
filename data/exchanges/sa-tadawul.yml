        url: https://www.tadawulgroup.sa/wps/wcm/connect/e4bfbba8-4932-4b0c-b405-c922ac56d780/Listing+Rules.pdf?MOD=AJPERES&CVID=pfpotDY
        accessed: 2026-08-27
    quote: "Article 38: Power to suspend trading or cancel listing. The Authority may at any time suspend the trading of securities or cancel their listing as it deems fit, in any of the following circumstances: ... 13) upon the registration of the application for the commencement of a financial restructuring procedure of the issuer, whose accumulated losses reached 50% or more of its capital with the court in accordance with the Bankruptcy Law. [Listing Rules Art 38] ... Article 39(a): An issuer whose securities have been listed may not cancel the listing of its securities on the Exchange without the prior approval of the Authority. In order to obtain the Authority's approval, the issuer must submit a request of the cancelation to the Authority with a simultaneous notification to the Exchange... [Listing Rules Art 39]"
    confidence: high
    verified: 2026-08-27

  delisting_transition_period:
    zh: "若发行人证券被暂停交易后连续六个月未采取适当行动消除暂停原因，CMA 可取消其上市证券。即停牌→强制退市的过渡期阈值为约六个月"
    en: "Where the suspension of an issuer continues for six months without the issuer taking appropriate action to resolve the reasons that lead to the suspension, the Authority may cancel that issuer's listed securities — i.e. the suspension-to-compulsory-delisting threshold is about six months"
    detail: "该六个月为 Listing Rules Article 38(g) 的硬性阈值；自愿退市则无固定过渡期，取决于 CMA 审批节奏"
    sources:
