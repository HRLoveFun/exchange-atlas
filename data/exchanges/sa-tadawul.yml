# 沙特交易所 Saudi Exchange (Tadawul)
# 抓取来源见 PROJECT/SOURCES.md `sa-tadawul` 一节；原始页缓存于 .cache/sa-tadawul/
#
# source_lang: en——阿拉伯语是本所唯一官方语言（Market Making Regulations 封面原文：
# "Arabic is the official language of the Saudi Exchange"），本次抓取未能核实到可直接
# 摘引的官方阿拉伯语原文页（官网 www.saudiexchange.sa 全站被 Akamai 拦截，见下方降级说明），
# 但拿到了监管方/集团站点发布的官方英文文本（部分标注"unofficial translation, Arabic
# prevails"），按 ADR-013「有中文原文选中文，没有则选英文」的取源规则，本项目 zh/en 二元
# 体系里没有阿语选项，故按「没有可核实中文原文」定为 source_lang: en，与 NYSE/JPX/Eurex
# 同理——阿语原文的法律效力高于英文译本，但英文是本项目当前能溯源引用的最佳可得文本。
#
# ⚠️ 本次是 v1.0 Wave 1 里 mena_africa 地区首个样本（此前 5 家标杆里该地区 0 家）。
#
# group_id：未设置。Saudi Tadawul Group（集团控股公司，2021年改制为控股结构后的母公司）
# 旗下除 Saudi Exchange（本文件记录的交易所实体）外，另有 Muqassa（证券清算中心，CCP）、
# Edaa（证券存管中心，CSD）、Wamid（技术服务商）三家子公司——按 add-exchange skill 第1步
# 的判断标准（"是否存在计划收录的姊妹交易所实体"，不是"母公司叫什么名字"），Muqassa/Edaa/
# Wamid 都不是交易所实体，是清算/存管/技术服务商（角色对应 clearing.ccp_name/csd_name 字段，
# 不是姊妹交易所），集团内没有第二家可比的证券交易所，故不设 group_id，这点与 NYSE Group
# （旗下有多个各自独立注册的姊妹交易所）不同类。
#
# self_listed 的结构性细节：Saudi Exchange（运营实体本身）并未独立上市；据集团公开的组织
# 结构（Saudi Tadawul Group 官网子公司列表页），其母公司 Saudi Tadawul Group Holding
# Company 于2021年改制为控股集团后完成上市，在 Saudi Exchange 运营的主板挂牌交易——但本次
# 未能抓取到直接确认母公司上市日期/代码的一手原文（仅有 WebSearch 摘要印象，按 skill 规则
# 摘要不能当引用来源），故 self_listed 标 low confidence，具体日期/代码留待下次核实，
# 见 OPEN-QUESTIONS。

id: sa-tadawul
name_zh: 沙特交易所
name_native: {en: "Saudi Exchange (Tadawul)"}
official_languages: [ar]
source_lang: en
region: mena_africa
