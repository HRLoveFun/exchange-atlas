    en: "Formed on 19 March 2007 as a joint stock company in accordance with Article 20 of the Capital Market Law"
    detail: "Tadawul 是王国境内唯一被授权运营证券交易所的实体（'the sole entity in the Kingdom authorized to act as a securities exchange'）。2021年改制为控股集团结构（Saudi Tadawul Group Holding Company），成为 Saudi Exchange/Muqassa/Edaa/Wamid 四家子公司的母公司——改制生效日期、股东大会决议日期与母公司上市细节现已核实到官方一手原文，见 self_listed 字段。"
    sources:
      - title: "About Tadawul（2018年度报告存档站点，官方历史资料）"
        url: https://annualreport2018.tadawul.com.sa/Resources/AnnualReport/company_profile/about_tadawul.html
        accessed: 2026-08-14
    quote: "Formed on 19 March 2007 as a joint stock company in accordance with article 20 of the Capital Market Law, Tadawul is the sole entity in the Kingdom authorized to act as a securities exchange."
    confidence: high

  organization_form:
    enum: demutualized_unlisted
    zh: "公司制（股份公司），但运营实体本身未独立上市——见上方身份注释"
    en: "Demutualized (joint stock company), operating entity itself not separately listed"
    detail: "《资本市场法》第20条要求交易所/存管中心/清算中心必须采用股份公司形式并经CMA许可，本条确认组织形式为公司制；母公司 Saudi Tadawul Group 是否/何时上市另见 self_listed 字段说明。"
    sources:
      - title: Capital Market Law（CMA 官方文本，Chapter Three, Article Twenty）
        url: https://cma.gov.sa/en/RulesRegulations/CMALaw/Documents/CMA_Law.pdf
        accessed: 2026-08-14
    quote: "It shall be prohibited for any person to carry out any activities of the Exchange, the Depository Center, or the Clearing Center, or establish or operate any of them without obtaining a license from the Authority, provided that such person takes the legal form of a joint stock company."
    confidence: high

  self_listed:
    enum: partial
    zh: "运营实体本身（Saudi Exchange Company）未独立上市；母公司 Saudi Tadawul Group Holding Company 经股东特别大会决议（决议日期2021年4月6日）于2021年5月20日改制为控股集团，同年12月8日完成首次公开发行并在其自身运营的交易所挂牌交易（发行3600万股，占股本30%，发行价每股105里亚尔，发行后市值约126亿里亚尔）"
    en: "The operating entity (Saudi Exchange Company) is not itself listed; parent Saudi Tadawul Group Holding Company was converted into a holding company on 20 May 2021G pursuant to an Extraordinary General Assembly resolution dated 6 April 2021G, and completed its IPO on 8 December 2021, listing on the Exchange it operates (36,000,000 shares offered, 30% of share capital, at SAR 105 per share, implying a market cap of SAR 12.6bn at listing)"
    detail: "两份官方一手文件互相印证：CMA备案的招股说明书（577页全文，含审计财务报表）确认改制生效日期与股东大会决议日期，且明确公开发售股份将在Company自身运营的Exchange挂牌交易；集团官方2021年报「The IPO」页确认发行细节与IPO完成日期。母公司架构：Saudi Tadawul Group Holding Company 为上市控股实体，其下 Saudi Exchange Company（交易所运营实体本身）、Muqassa（清算）、Edaa（存管）、Wamid（技术服务）四家全资子公司均未独立上市——故本字段取 partial 而非 yes：交易所运营法人本身不在自己市场挂牌，但同集团的控股母公司在挂牌。"
    sources:
      - title: "Saudi Tadawul Group Holding Company Prospectus（CMA官方备案招股说明书）"
        url: https://cma.gov.sa/en/Market/Prospectuses/Documents/Saudi_Tadawul_Group_en.pdf
        accessed: 2026-08-20
      - title: "The IPO（Saudi Tadawul Group 官方2021年报，Company Profile章节）"
        url: https://annualreport.tadawulgroup.sa/Resources/AnnualReport2021/company_profile/the_ipo.html
        accessed: 2026-08-20
    quote: "The Company was converted into a holding company on 08/10/1442H (corresponding to 20 May 2021G) pursuant to the resolution of the Extraordinary General Assembly of the Company in its meeting dated 24/08/1442H (corresponding to 6 April 2021G). [Prospectus, Section 4-1] ... The transformation of the Group into a holding structure earlier this year paved the way for the successful IPO of Saudi Tadawul Group Holding Company on 8 December 2021. Saudi Tadawul Group floated 36,000,000 shares, representing 30% of its issued share capital. ... The offering shares were priced at SAR 105 per share at the top of the Company's initial price range, implying a market capitalization of SAR 12.6 Bn at the time of listing. [Annual Report 2021, The IPO]"
    confidence: high

