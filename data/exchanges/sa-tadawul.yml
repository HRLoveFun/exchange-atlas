    opening_mechanism:
      zh: "第一时段（09:00–09:30）开盘前集合竞价：以能撮合最大成交量的价位作为理论开盘价，若剩余量相同再按买卖不平衡方向取最优价或均价（四舍五入至最小价位）；市场于09:30:00–09:30:30区间内随机时点开盘揭示（uncross）；第一时段最后一次理论开盘价即为正式开盘价"
      en: "First Session (09:00–09:30) Opening Auction: the price at which the maximum quantity might trade is assigned as the Theoretical Opening Price, with tie-breaking by minimum residual and imbalance direction; the market opens and uncrosses at a random point between 09:30:00 and 09:30:30; the last Theoretical Opening Price of the First Session becomes the Opening Price"
      sources:
        - title: Derivatives Exchange Trading and Membership Procedures（Saudi Exchange 官方规程 PDF，经 tadawulgroup.sa 分发）
          url: https://www.tadawulgroup.sa/wps/wcm/connect/f4480189-6e3e-4aac-b385-d858b3baff4c/Derivatives+Exchange+Trading+and+Membership+Procedure+.pdf?MOD=AJPERES&ContentCache=NONE&CACHE=NONE&CACHEID=ROOTWORKSPACE-f4480189-6e3e-4aac-b385-d858b3baff4c-pfkJUdp
          accessed: 2026-08-18
      quote: "Open: Opening of the market takes place by an auction for Futures and Options Contracts. The auction shall be based on the bids and asks entered during the Opening Auction. The market will open and uncross on a variable basis between 09:30:00am and 09:30:30am every Trading Day. ... The Derivatives Trading System will assign a price at which the maximum quantity of Listed Derivatives Products might be traded. ... The last Theoretical Opening Price of the First Session will be the Opening Price, provided that it is formed with orders that, when matched, result in at least one trade on the Main Market."
      confidence: high

    closing_mechanism:
      zh: "无独立收盘集合竞价；收盘价即最后成交价（Last Traded Price, LTP）；15:30后进入休市状态（Third Session: Market Closed，至16:00）"
      en: "No separate closing auction; Close is the Last Traded Price (LTP); the market enters the Third Session (Market Closed) from 15:30 to 16:00"
