# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-14
    confidence: medium

  regulator:
    zh: "资本市场管理局"
    en: "Capital Market Authority (CMA)"
    detail: "依据2003年颁布的《资本市场法》（王室法令 M/30 号）设立，财政、法律、行政独立，直接向首相负责。"
    sources:
      - title: About CMA（CMA 官网）
        url: https://cma.gov.sa/en/AboutCMA/Pages/AboutCMA.aspx
        accessed: 2026-08-14
    quote: "The current Capital Market Law is promulgated and pursuant to Royal Decree No. (M/30) dated 2/6/1424H, which formally brought the Capital Market Authority (CMA) into existence. The CMA is a government organization applying full financial, legal, and administrative independence, and has direct links with the Prime Minister."
    confidence: high

  self_regulatory_org:
    zh: "Saudi Exchange 本身兼具前线监管职能（提出上市与交易相关规则、信息披露要求，报请CMA批准后实施）"
    en: "Front-line rule-making by the Exchange, subject to CMA Board approval"
    detail: "《资本市场法》第23条明确交易所董事会负责提出证券上市与交易条件、交易信息披露、发行人/股东/会员披露义务等规则草案，但须报请CMA董事会批准后方可施行——前线监管权与最终批准权分置的模式，与港交所「自身兼前线监管但SFC最终把关」结构相似。"
    sources:
      - title: Capital Market Law（CMA 官方文本，Article Twenty-Three）
        url: https://cma.gov.sa/en/RulesRegulations/CMALaw/Documents/CMA_Law.pdf
        accessed: 2026-08-14
    quote: "the board of directors of the Exchange shall propose regulations, rules and instructions regarding: the conditions for listing and trading of Securities; the immediate and regular publication of the information related to executed transactions of the Securities traded on the Exchange; the obligations of Issuers, shareholders and members to disclose to the Exchange the information that the Exchange believes to be necessary..."
    confidence: high

  clearing_regulator:
    zh: "资本市场管理局（对清算中心 Muqassa、存管中心 Edaa 同样行使许可与监管权）"
    en: "Capital Market Authority (CMA)"
    sources:
      - title: Capital Market Law（CMA 官方文本，Article Twenty）
        url: https://cma.gov.sa/en/RulesRegulations/CMALaw/Documents/CMA_Law.pdf
        accessed: 2026-08-14
    quote: "It shall be prohibited for any person to carry out any activities of the Exchange, the Depository Center, or the Clearing Center, or establish or operate any of them without obtaining a license from the Authority..."
    confidence: high

  core_laws:
    zh: "《资本市场法》（王室法令 M/30 号，伊斯兰历1424年6月2日颁布）"
    en: "Capital Market Law (Royal Decree No. M/30, dated 2/6/1424H)"
    detail: "本次抓取到的官方英译本首页标注'The official text is in Arabic. This document in an unofficial translation and is provided for information purposes only.'——阿拉伯语原文具有法律效力，英译本仅供参考，与 SSE 英文版、JPX/Eurex 英文版的免责声明模式一致。公历对应日期本次未找到可直接摘引的一手原文确认（不同检索结果给出的公历换算日期彼此不一致），故不在 zh/en 里断言具体公历日期，只保留可核实的伊斯兰历王室法令编号与日期。其下另有交易所层面的 Listing Rules、Trading and Membership Procedures/Rules、Market Making Regulations 等实施细则，分别对应各自章节的具体规则依据。"
    sources:
      - title: About CMA（CMA 官网）
        url: https://cma.gov.sa/en/AboutCMA/Pages/AboutCMA.aspx
        accessed: 2026-08-14
    quote: "The current Capital Market Law is promulgated and pursuant to Royal Decree No. (M/30) dated 2/6/1424H, which formally brought the Capital Market Authority (CMA) into existence."
    confidence: high

  foreign_ownership_limit:
    zh: "非居民境外投资者（外国战略投资者除外）单一持股不得达到或超过10%；全体境外投资者（不含外国战略投资者）合计持股上限49%"
    en: "A non-residing foreign investor (except a Foreign Strategic Investor) may not own 10% or more of the shares of any listed issuer; aggregate ownership by all foreign investors (excluding Foreign Strategic Investors) is capped at 49%"
    detail: "已从CMA官方《外资证券投资规则》（Rules for Foreign Investment in Securities）2026年1月5日修订版原文核实，Article 6 (Investment Restrictions) 逐字确认10%/49%两项上限；QFI（合格境外投资者）制度取消一事亦从CMA官方公告页（CMA_N_3974，发布日期2026年1月6日）核实——公告确认自2026年2月1日起取消QFI资格分类，全体境外投资者可直接投资主板；修订后的规则原文全文亦不再出现'Qualified Foreign Investor'定义，与官方公告互相印证。原引用的第三方律所简报（Latham & Watkins）已不再作为来源。"
    sources:
      - title: "Rules for Foreign Investment in Securities（CMA官方规则，2026年1月5日修订版，Article 6）"
        url: https://cma.gov.sa/en/RulesRegulations/Regulations/Documents/Rules_for_Foreign_Investment_in_Securities_en.pdf
        accessed: 2026-08-20
      - title: "The CMA Opens the Capital Market to All Categories of Foreign Investors（CMA官方公告，发布日期2026-01-06）"
        url: https://cma.gov.sa/en/MediaCenter/NEWS/Pages/CMA_N_3974.aspx
        accessed: 2026-08-20
    quote: "Article 6: Investment Restrictions a) Investments of foreign investors shall be subject to the following restrictions: 1) A non-residing foreign investor (except the foreign strategic investor), may not own (10%) or more of the shares of any issuer whose shares are listed or convertible debt instrument of the issuer. 2) The maximum proportion of the shares of any issuer whose shares are listed or convertible debt instrument of the issuer that may be owned by all foreign investors (in all categories, whether residents or non-residents, except the foreign strategic investors) in aggregate is (49%). [Rules for Foreign Investment in Securities] ... The Capital Market Authority (CMA) announces the opening of the capital market to all categories of foreign investors and enabling them to invest directly therein as of 1 February 2026 ... The approved amendments eliminated the concept of the Qualified Foreign Investor (QFI) in the Main Market. [CMA_N_3974]"
    confidence: high

  capital_controls:
    zh: "沙特实行开放资本账户，对证券投资组合资本一般无资本管制；境外投资者可自由汇入、汇出资金及投资收益，唯须通过 CMA 许可的渠道（如经交易所会员）并遵守反洗钱与外商投资披露要求。2026年2月取消 QFI 资格后外资可直接投资主板，进一步降低准入壁垒"
    en: "Saudi Arabia maintains an open capital account with no general capital controls on portfolio capital; foreign investors may freely repatriate capital and investment returns through CMA-permitted channels, subject to AML and foreign-ownership disclosure rules. The Feb-2026 abolition of the QFI framework further lowered access barriers"
    detail: "未发现明文'无资本管制'的一手条款；以 CMA 外资规则与 QFI 改革为背景推断，属综述性结论，故 confidence 降为 medium"
    sources:
      - title: "Rules for Foreign Investment in Securities（CMA，2026-01-05 修订版）"
        url: https://cma.gov.sa/en/RulesRegulations/Regulations/Documents/Rules_for_Foreign_Investment_in_Securities_en.pdf
        accessed: 2026-08-27
      - title: "The CMA Opens the Capital Market to All Categories of Foreign Investors（CMA_N_3974，2026-01-06）"
        url: https://cma.gov.sa/en/MediaCenter/NEWS/Pages/CMA_N_3974.aspx
        accessed: 2026-08-27
    quote: "The Capital Market Authority (CMA) announces the opening of the capital market to all categories of foreign investors and enabling them to invest directly therein as of 1 February 2026 ... eliminating the concept of the Qualified Foreign Investor (QFI)."
    confidence: medium
    verified: 2026-08-27

  disclosure_requirements:
    zh: "发行人须按《资本市场法》及其实施细则、《交易所规则》持续、充分披露；所有对公众披露须完整、清晰、准确、不具误导性。交易所可要求提供进一步信息，价格敏感事项须即时披露。CMA 的法定职责包括'监管并确保证券及其发行人的信息充分披露'"
    en: "Issuers must make ongoing, adequate disclosures under the CMA Law, its Implementing Regulations and the Exchange Rules; all public disclosures must be complete, clear, accurate and not misleading. The Exchange may require further information; price-sensitive events must be disclosed promptly. CMA's statutory mandate includes regulating and monitoring full disclosure"
    detail: "持续义务集中在 Listing Rules Part 5（Articles 27–33）；披露监督为 CMA 法定职责（CMA Law Article 182）"
    sources:
      - title: "Listing Rules（Article 27: Obligation to make disclosures in accordance with applicable requirements）"
        url: https://www.tadawulgroup.sa/wps/wcm/connect/e4bfbba8-4932-4b0c-b405-c922ac56d780/Listing+Rules.pdf?MOD=AJPERES&CVID=pfpotDY
        accessed: 2026-08-27
      - title: "Capital Market Law（Article 182）"
        url: https://cma.gov.sa/en/RulesRegulations/Laws/Documents/CapitalMarketLaw.pdf
        accessed: 2026-08-27
    quote: "All disclosures made by an issuer to the public must be complete, clear, accurate, not misleading and shall comply with all disclosure requirements prescribed by the Capital Market Law, its Implementing Regulations and the Exchange Rules. [Listing Rules Art 27] ... Regulate and monitor the full disclosure of information regarding the securities and their issuers. [CMA Law Art 182]"
    confidence: high
    verified: 2026-08-27

  investor_protection:
    zh: "CMA 的法定使命包括保护投资者、确保上市公司充分披露与透明"
    en: "Investor protection is a statutory CMA mandate"
    sources:
      - title: About CMA（CMA 官网）
        url: https://cma.gov.sa/en/AboutCMA/Pages/AboutCMA.aspx
        accessed: 2026-08-14
    quote: "The Capital Market Authority oversees the regulation and development of the capital market, and issues the necessary regulations, rules, and instructions for the implementation of the Capital Market Law. This is aimed at creating a favorable investment environment, enhancing confidence in the market, ensuring adequate disclosure and transparency by listed companies, and protecting investors and securities traders from unlawful practices in the market."
    confidence: high

