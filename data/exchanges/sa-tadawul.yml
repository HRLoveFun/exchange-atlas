# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-14
    confidence: medium

  regulator:
    zh: "资本市场管理局"
    en: "Capital Market Authority (CMA)"
    detail: "依据2003年颁布的《资本市场法》（王室法令 M/30 号）设立，财政、法律、行政独立，直接向首相负责。"
    sources:
      - title: About CMA（CMA 官网）
        url: https://cma.gov.sa/en/AboutCMA/Pages/AboutCMA.aspx
        accessed: 2026-08-14
    quote: "The current Capital Market Law is promulgated and pursuant to Royal Decree No. (M/30) dated 2/6/1424H, which formally brought the Capital Market Authority (CMA) into existence. The CMA is a government organization applying full financial, legal, and administrative independence, and has direct links with the Prime Minister."
    confidence: high

  self_regulatory_org:
    zh: "Saudi Exchange 本身兼具前线监管职能（提出上市与交易相关规则、信息披露要求，报请CMA批准后实施）"
    en: "Front-line rule-making by the Exchange, subject to CMA Board approval"
    detail: "《资本市场法》第23条明确交易所董事会负责提出证券上市与交易条件、交易信息披露、发行人/股东/会员披露义务等规则草案，但须报请CMA董事会批准后方可施行——前线监管权与最终批准权分置的模式，与港交所「自身兼前线监管但SFC最终把关」结构相似。"
    sources:
      - title: Capital Market Law（CMA 官方文本，Article Twenty-Three）
        url: https://cma.gov.sa/en/RulesRegulations/CMALaw/Documents/CMA_Law.pdf
        accessed: 2026-08-14
    quote: "the board of directors of the Exchange shall propose regulations, rules and instructions regarding: the conditions for listing and trading of Securities; the immediate and regular publication of the information related to executed transactions of the Securities traded on the Exchange; the obligations of Issuers, shareholders and members to disclose to the Exchange the information that the Exchange believes to be necessary..."
    confidence: high

  clearing_regulator:
    zh: "资本市场管理局（对清算中心 Muqassa、存管中心 Edaa 同样行使许可与监管权）"
    en: "Capital Market Authority (CMA)"
    sources:
      - title: Capital Market Law（CMA 官方文本，Article Twenty）
        url: https://cma.gov.sa/en/RulesRegulations/CMALaw/Documents/CMA_Law.pdf
        accessed: 2026-08-14
    quote: "It shall be prohibited for any person to carry out any activities of the Exchange, the Depository Center, or the Clearing Center, or establish or operate any of them without obtaining a license from the Authority..."
    confidence: high

  core_laws:
    zh: "《资本市场法》（王室法令 M/30 号，伊斯兰历1424年6月2日颁布）"
    en: "Capital Market Law (Royal Decree No. M/30, dated 2/6/1424H)"
    detail: "本次抓取到的官方英译本首页标注'The official text is in Arabic. This document in an unofficial translation and is provided for information purposes only.'——阿拉伯语原文具有法律效力，英译本仅供参考，与 SSE 英文版、JPX/Eurex 英文版的免责声明模式一致。公历对应日期本次未找到可直接摘引的一手原文确认（不同检索结果给出的公历换算日期彼此不一致），故不在 zh/en 里断言具体公历日期，只保留可核实的伊斯兰历王室法令编号与日期。其下另有交易所层面的 Listing Rules、Trading and Membership Procedures/Rules、Market Making Regulations 等实施细则，分别对应各自章节的具体规则依据。"
    sources:
      - title: About CMA（CMA 官网）
        url: https://cma.gov.sa/en/AboutCMA/Pages/AboutCMA.aspx
        accessed: 2026-08-14
    quote: "The current Capital Market Law is promulgated and pursuant to Royal Decree No. (M/30) dated 2/6/1424H, which formally brought the Capital Market Authority (CMA) into existence."
    confidence: high

  foreign_ownership_limit:
    zh: "非居民境外投资者单一持股不得达到或超过10%；全体境外投资者（不含外国战略投资者）合计持股上限49%"
    en: "Non-resident foreign investors individually capped below 10% of a listed issuer; aggregate foreign ownership (excluding Foreign Strategic Investors) capped at 49%"
    detail: "2026年1月6日CMA宣布修订外资准入框架，取消QFI（合格境外投资者）资格制度，自2026年2月1日起允许全体境外投资者不受资格分类限制直接投资主板，但10%单一上限与49%合计上限两条限制维持不变。⚠️ 本条来源为第三方律所客户简报（Latham & Watkins），非CMA官方规则原文——本次 WebSearch 检索配额已用尽，未能在 cma.gov.sa 站内定位到对应的官方公告或修订后的《外资证券投资规则》原文，按 CLAUDE.md 二第3条第三方来源上限 medium，下次有空应补找CMA官方原文升级来源，见 OPEN-QUESTIONS。"
    sources:
      - title: "Saudi CMA Broadens Main Market Access for Foreign Investors（Latham & Watkins 客户简报）"
        url: https://www.lw.com/en/insights/saudi-cma-broadens-main-market-access-for-foreign-investors
        accessed: 2026-08-14
    quote: "Foreign investors may now invest directly in shares listed on the Main Market without the need to fall within specified investor categories. The QFI framework has been removed. The existing 10% individual cap for non-resident foreign investors and 49% aggregate cap for all foreign investors remain in force."
    confidence: medium

  capital_controls:
    zh: ""
    confidence: low

  disclosure_requirements:
    zh: ""
    confidence: low

  investor_protection:
    zh: "CMA 的法定使命包括保护投资者、确保上市公司充分披露与透明"
    en: "Investor protection is a statutory CMA mandate"
    sources:
      - title: About CMA（CMA 官网）
        url: https://cma.gov.sa/en/AboutCMA/Pages/AboutCMA.aspx
        accessed: 2026-08-14
    quote: "The Capital Market Authority oversees the regulation and development of the capital market, and issues the necessary regulations, rules, and instructions for the implementation of the Capital Market Law. This is aimed at creating a favorable investment environment, enhancing confidence in the market, ensuring adequate disclosure and transparency by listed companies, and protecting investors and securities traders from unlawful practices in the market."
    confidence: high

