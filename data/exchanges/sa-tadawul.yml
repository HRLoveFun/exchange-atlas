        accessed: 2026-08-27
    quote: "Article 27: Obligation to make disclosures in accordance with applicable requirements — All disclosures made by an issuer to the public must be complete, clear, accurate, not misleading and shall comply with all disclosure requirements prescribed by the Capital Market Law, its Implementing Regulations and the Exchange Rules."
