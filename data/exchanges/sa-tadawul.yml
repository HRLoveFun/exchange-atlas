  delisting_process:
    zh: "自愿退市须事先取得 CMA 批准：发行人须向 CMA 提交退市申请并同时通知交易所，说明退市理由等；CMA 亦可在多种情形下主动取消上市（Article 38）。强制退市多见于持续违反规则、suitability 不再适合上市或累计亏损达资本 50% 以上并进入破产重整等"
    en: "Voluntary delisting requires prior CMA approval: the issuer must submit a cancellation request to the CMA with simultaneous notice to the Exchange stating the reasons; the CMA may also cancel listing on its own initiative (Article 38) for material breaches, unsuitability, or accumulated losses ≥50% of capital with bankruptcy restructuring"
    detail: "Article 39 规定自愿退市须 CMA 事前批准 + 相关披露；Article 38 为 CMA 主动取消上市的权力基础"
    sources:
