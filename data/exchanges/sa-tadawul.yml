      quote: "7.1.1 The Derivatives Trading System will improve the execution prices of limit orders (by reducing them for buyers or increasing them for sellers) whenever the price is better than the order's price limit on the opposite side ... In the absence of a better price on the opposite side, the order will be executed at the limit price. ... 7.2.2 During the Second Session, the Derivatives Trading System will execute market orders partially or fully at one price and convert the unmatched parts of partially matched market orders into limit orders at their traded prices. ... 8.1.1 Fill or Kill (“FoK”) means the complete order quantity must be executed as soon as it becomes available for matching; otherwise the order will be immediately cancelled ... 9.1.3 Good till Cancelled (“GTC”): means that orders are subject to full execution with a validity period of up to (30) days from the transmission of the order."
