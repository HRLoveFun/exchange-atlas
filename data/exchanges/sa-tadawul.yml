  suspension_resumption:
    zh: "交易所可应要求或主动实施临时停牌（Article 40 临时停牌机制）；若停牌情形消除，交易所将在停牌情形结束后的不超过五个交易日内恢复交易"
    en: "The Exchange may impose a temporary trading halt on request or suo motu (Article 40 temporary trading halt); where the suspension circumstances end, the Exchange will lift the suspension within a period not exceeding five trading sessions following the end of those circumstances"
    detail: "Article 38 另赋予 CMA 暂停交易或取消上市的权限；恢复以'情形消除后≤5个交易日'为操作口径"
    sources:
