  implicit_costs_note:
    zh: "除显性费用外，隐性成本主要为买卖价差（bid-ask spread）与市场冲击（market impact）。沙特市场散户参与度高、流动性集中于大盘蓝筹（如 Aramco、SABIC、银行股），中小盘价差可能较宽、冲击成本更高；深度流动性在大盘品种更充足"
    en: "Beyond explicit fees, implicit costs are mainly bid-ask spread and market impact. The Saudi market has high retail participation and liquidity concentrated in large-cap blue chips (e.g. Aramco, SABIC, bank stocks); smaller names may show wider spreads and higher impact cost, while deep liquidity is concentrated in large caps"
