    matching_principle:
      zh: "按价格与时间优先原则撮合：买盘价格从高到低、卖盘价格从低到高享有优先权；同价位按进入交易系统的时间先后排序；市价盘始终享有最高优先权"
      en: "Matching takes place based on price and time priority: the highest buy order prices and the lowest sell order prices get the highest priority; orders at the same price are prioritized by entry time; market orders always receive the highest priority"
      sources:
        - title: Derivatives Exchange Trading and Membership Procedures（Saudi Exchange 官方规程 PDF，经 tadawulgroup.sa 分发）
          url: https://www.tadawulgroup.sa/wps/wcm/connect/f4480189-6e3e-4aac-b385-d858b3baff4c/Derivatives+Exchange+Trading+and+Membership+Procedure+.pdf?MOD=AJPERES&ContentCache=NONE&CACHE=NONE&CACHEID=ROOTWORKSPACE-f4480189-6e3e-4aac-b385-d858b3baff4c-pfkJUdp
          accessed: 2026-08-18
      quote: "Intraday: Matching takes place based on price and time priority. ... The Derivatives Trading System assigns order priority based on price and time of entry to the Derivatives Trading System. It gives the highest buy order prices the highest priority. Conversely, it gives the lowest sell order prices the highest priority. ... The Derivatives Trading System always gives market orders the highest priority."
      confidence: high

    order_types:
      zh: "限价盘（Limit Order）：若对手方有更优价格，系统按更优价成交，否则按限价成交；市价盘（Market Order）：第二时段内按当前最优价全部/部分成交，未成交部分转为限价盘；另设订单条件（Order Conditions）：FoK（全额成交否则撤单）、FaK（部分成交、未成交部分即撤）、Hidden Quantity（冰山单，每次仅披露部分数量）、Cancel on Disconnect（连线中断自动撤单）；订单有效期分四种：第一时段内有效、当日有效（Day，至第二时段结束）、GTC（最长30天）、GTD（可指定日期，最长30天）"
      en: "Limit Order: executed at a better price when available on the opposite side, otherwise at the limit price; Market Order: executed partially or fully at the best price during the Second Session, with unmatched portions converted to limit orders; Order Conditions: FoK (full execution or cancel), FaK (partial execution, remainder cancelled), Hidden Quantity (iceberg, discloses only part of the quantity at a time), Cancel on Disconnect; Order Validity: First Session, Day (until end of Second Session), GTC (up to 30 days), GTD (a specified date, up to 30 days)"
      sources:
        - title: Derivatives Exchange Trading and Membership Procedures（Saudi Exchange 官方规程 PDF，经 tadawulgroup.sa 分发）
          url: https://www.tadawulgroup.sa/wps/wcm/connect/f4480189-6e3e-4aac-b385-d858b3baff4c/Derivatives+Exchange+Trading+and+Membership+Procedure+.pdf?MOD=AJPERES&ContentCache=NONE&CACHE=NONE&CACHEID=ROOTWORKSPACE-f4480189-6e3e-4aac-b385-d858b3baff4c-pfkJUdp
          accessed: 2026-08-18
      detail: |
        订单渠道（Order Channels，§6）另设六类：T（衍生品注册交易员专用）、I（客户网站/App自助下单）、
        A（ATM）、V（电话）、S（短信）、G（算法交易自动化下单）。订单修改会影响优先级：修改价格/增加数量/
        增加披露数量会丧失优先级，减少数量或仅修改有效期不丧失优先级（§11.1.3 Table 2）。
      quote: "7.1.1 The Derivatives Trading System will improve the execution prices of limit orders (by reducing them for buyers or increasing them for sellers) whenever the price is better than the order's price limit on the opposite side ... In the absence of a better price on the opposite side, the order will be executed at the limit price. ... 7.2.2 During the Second Session, the Derivatives Trading System will execute market orders partially or fully at one price and convert the unmatched parts of partially matched market orders into limit orders at their traded prices. ... 8.1.1 Fill or Kill (“FoK”) means the complete order quantity must be executed as soon as it becomes available for matching; otherwise the order will be immediately cancelled ... 9.1.3 Good till Cancelled (“GTC”): means that orders are subject to full execution with a validity period of up to (30) days from the transmission of the order."
      confidence: high

