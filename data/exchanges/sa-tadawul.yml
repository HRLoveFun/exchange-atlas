        accessed: 2026-08-14
    quote: "The Authority may at any time suspend the trading of securities or cancel their listing as it deems fit, in any of the following circumstances: 1) the Authority considers it necessary for the protection of investors or the maintenance of an orderly market; 2) the issuer fails, in a manner which the Authority considers material, to comply with the Capital Market Law, its Implementing Regulations or the Exchange Rules... 13) upon the registration of the application for the commencement of a financial restructuring procedure of the issuer, whose accumulated losses reached 50% or more of its capital with the court in accordance with the Bankruptcy Law."
    en_required: true
