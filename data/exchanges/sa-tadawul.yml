    order_types:
      zh: "限价盘（Limit Order）：若对手方有更优价格，系统按更优价成交，否则按限价成交；市价盘（Market Order）：第二时段内按当前最优价全部/部分成交，未成交部分转为限价盘；另设订单条件（Order Conditions）：FoK（全额成交否则撤单）、FaK（部分成交、未成交部分即撤）、Hidden Quantity（冰山单，每次仅披露部分数量）、Cancel on Disconnect（连线中断自动撤单）；订单有效期分四种：第一时段内有效、当日有效（Day，至第二时段结束）、GTC（最长30天）、GTD（可指定日期，最长30天）"
      en: "Limit Order: executed at a better price when available on the opposite side, otherwise at the limit price; Market Order: executed partially or fully at the best price during the Second Session, with unmatched portions converted to limit orders; Order Conditions: FoK (full execution or cancel), FaK (partial execution, remainder cancelled), Hidden Quantity (iceberg, discloses only part of the quantity at a time), Cancel on Disconnect; Order Validity: First Session, Day (until end of Second Session), GTC (up to 30 days), GTD (a specified date, up to 30 days)"
      sources:
        - title: Derivatives Exchange Trading and Membership Procedures（Saudi Exchange 官方规程 PDF，经 tadawulgroup.sa 分发）
          url: https://www.tadawulgroup.sa/wps/wcm/connect/f4480189-6e3e-4aac-b385-d858b3baff4c/Derivatives+Exchange+Trading+and+Membership+Procedure+.pdf?MOD=AJPERES&ContentCache=NONE&CACHE=NONE&CACHEID=ROOTWORKSPACE-f4480189-6e3e-4aac-b385-d858b3baff4c-pfkJUdp
          accessed: 2026-08-18
      detail: |
        订单渠道（Order Channels，§6）另设六类：T（衍生品注册交易员专用）、I（客户网站/App自助下单）、
        A（ATM）、V（电话）、S（短信）、G（算法交易自动化下单）。订单修改会影响优先级：修改价格/增加数量/
