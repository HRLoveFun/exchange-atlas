  initial_margin_practice:
    zh: "衍生品交易端由会员向客户收取初始保证金，用以覆盖客户持仓价值的潜在不利变动；清算端（Muqassa 对结算会员）设最低初始保证金，结算会员可在此最低保证金基础上按合约类别适用各自的保证金乘数（Margin Multiplier）向客户加收。总保证金 = 初始保证金 + 适用的变动保证金 + Muqassa/结算会员认定的追加保证金"
    en: "On the trading side, Exchange Members collect Initial Margin from clients to cover potential adverse changes in the value of each client position; on the clearing side Muqassa sets a minimum Initial Margin, and clearing members may apply their own contract-class-specific margin multiplier (Margin Multiplier) on top when collecting from clients. Total Margin = Initial Margin + applicable Variation Margin + any additional margin determined by Muqassa and the clearing member"
    detail: "此处为衍生品保证金框架；现货市场无保证金（见 settlement_cycle / clearing.derivatives）。保证金乘数为结算会员在 Muqassa 最低保证金之上自行适用的加收系数，官方 brochure 未给出各合约类别的具体乘数数值，故不臆造百分比。引文来自 Tadawul Derivatives Market Brochures"
    sources:
