        url: https://www.tadawulgroup.sa/wps/wcm/connect/e4bfbba8-4932-4b0c-b405-c922ac56d780/Listing+Rules.pdf?MOD=AJPERES&CVID=pfpotDY
        accessed: 2026-08-27
    quote: "Where the suspension of an issuer continues for six months without the issuer taking appropriate action to resolve the reasons that lead to the suspension, the Authority may cancel that issuer's listed securities."
    confidence: high
    verified: 2026-08-27

  post_delisting_venue:
    zh: "被暂停/退市的证券可在 Tadawul 的 OTC Trading（场外交易）平台继续交易；该平台面向'暂停/退市的公司与基金'。退市完成后证券若未转入 OTC 则不再在主板挂牌"
    en: "Suspended/delisted securities may continue to trade on Tadawul's OTC Trading platform, which is designated for suspended/delisted companies and funds; once delisting is completed and not transferred to OTC, the security is no longer listed on the Main Market"
