  short_selling:
    enum: restricted_uptick
    spec: {naked_allowed: false, uptick_rule: true, borrow_required: true, note: "受监管备兑卖空（禁裸卖空），须标记且经证券借贷协议锁定；类报升——卖出价须高于该证券当前最优买价；默认覆盖除衍生品外全部上市证券；两项动态限额（净空头/60 日日均量 ≤10 日；净空头 ≤自由流通 10%），触限次日禁卖空该证券"}
    zh: "受监管的备兑卖空（禁止裸卖空）：卖空订单须标记且已通过证券借贷协议锁定证券；默认覆盖除衍生品外全部上市证券（非指定清单），但须满足价格条件（卖出价须高于该证券当前最优买价，类报升规则）与两项动态限额（净空头持仓/最近60日日均成交量之比不超10日；净空头持仓不超过该证券自由流通量10%），触及限额的证券次一交易日禁止卖空"
    en: "Regulated covered short selling (naked short selling prohibited): orders must be flagged and covered under a securities borrowing and lending agreement; eligible by default for all listed securities except Derivatives (not a curated list), subject to a price condition (sale price must exceed the security's current best bid — an uptick-like rule) and two dynamic caps (net short position / 60-day average daily traded volume must not exceed 10 days; net short position must not exceed 10% of free float) — securities breaching either cap are barred from short selling the next Trading Day"
    detail: "已从 Short Selling Regulations 全文（Article 3 短卖交易定义/Article 4 合资格参与人/Article 5 合资格上市证券）核实，此前的悬案本次已澄清：(a) 不存在静态「合格证券清单」，Article 5(a) 明确默认覆盖除衍生品外全部上市证券（'Unless the Exchange specifies otherwise, a short selling transaction may be entered into in respect of all listed securities (except for Derivatives)'），交易所仅保留另行指定例外的权力，故此前暂定的 restricted_list（限指定标的）判断不准确；(b) 确实存在类报升规则的价格条件——Article 3(b)(4) 要求卖空订单价格须高于标的证券当前最优买价（不同于传统美股式「较上一笔成交价上涨」，而是「高于当前最优买价」），据此改判 enum 为 restricted_uptick；(c) 另有两项量化动态限额（10日空头量/日均成交量之比、10%自由流通量上限），触及限额次日禁止卖空，属报升规则之外的补充限制。"
    sources:
      - title: Trading and Membership Procedures（§12 Short Selling）
        url: https://www.tadawulgroup.sa/wps/wcm/connect/1c9c5c7b-1c6a-444e-994a-85fe1fbabb5c/Trading+and+Membership+Procedures+.pdf?MOD=AJPERES&ContentCache=NONE&CACHE=NONE&CACHEID=ROOTWORKSPACE-1c9c5c7b-1c6a-444e-994a-85fe1fbabb5c-pvARxBI
        accessed: 2026-08-14
      - title: "Short Selling Regulations（Saudi Exchange官方卖空监管规则全文，Article 3/4/5）"
        url: https://www.tadawulgroup.sa/wps/wcm/connect/1300edb3-6987-4d93-9515-138e1e7343e8/Short+Selling+Regulations.pdf?MOD=AJPERES&ContentCache=NONE&CACHE=NONE&CACHEID=ROOTWORKSPACE-1300edb3-6987-4d93-9515-138e1e7343e8-oV2AOMl
        accessed: 2026-08-20
    quote: "Article 3 Short selling transactions ... b. A person must not enter into as seller ... a short selling order in respect of a listed security unless all of the following conditions are met: ... 4) the price of selling the security, underlying the transaction, is higher than the price of the best bid of that security. ... Article 5 Eligible listed securities a. Unless the Exchange specifies otherwise, a short selling transaction may be entered into in respect of all listed securities (except for Derivatives) in accordance with the following limits: 1) The short ratio to Average Daily Traded Volume of the relevant security (total net short positions / Average Daily Traded Volume of the last 60 days) must not exceed 10 days; and 2) The total net short positions must not exceed 10% of the free floated securities of the relevant security."
