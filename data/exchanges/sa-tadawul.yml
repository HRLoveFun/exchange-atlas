    quote: "Article 40: Temporary trading halt. An issuer may request from the Exchange a temporary trading halt upon the occurrence of an event that occurs during trading hours which requires immediate disclosure under the Capital Market Law, its Implementing Regulations and the Exchange Rules and the issuer cannot maintain the confidentiality of this information until the end of the trading period, the trading halt of that issuer's securities will be made by the Exchange immediately upon receiving the request. [Listing Rules Art 40] ... The Exchange will lift the suspension within a period not exceeding five trading sessions following the end of the suspension circumstances. [Listing Rules Art 38]"
    confidence: high
    verified: 2026-08-27

  delisting_conditions:
    zh: "CMA可在多种情形下随时暂停交易或取消上市，包括：为保护投资者/维护市场秩序认为有必要；发行人重大违反《资本市场法》/实施细则/交易所规则；未按时缴纳费用或罚款；发行人业务/资产已不再适合继续上市；累计亏损达资本50%以上并已向法院申请破产重整程序等"
    en: "CMA may suspend trading or cancel listing at any time on multiple grounds, incl. investor protection/orderly market, material rule breaches, unpaid fees/fines, unsuitability for continued listing, bankruptcy restructuring filings with accumulated losses ≥50% of capital"
    sources:
