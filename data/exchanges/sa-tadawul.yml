      en: "Matching takes place based on price and time priority: the highest buy order prices and the lowest sell order prices get the highest priority; orders at the same price are prioritized by entry time; market orders always receive the highest priority"
      sources:
        - title: Derivatives Exchange Trading and Membership Procedures（Saudi Exchange 官方规程 PDF，经 tadawulgroup.sa 分发）
