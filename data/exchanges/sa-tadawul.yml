      订单有效期（§7）：Session（限当次第一/第三时段内完成）、Day（当日有效，至第四时段结束）、
      GTC（Good till Cancelled，最长30天）、GTD（Good till Date，最长30天）。
    quote: "5.1.1 The Trading System will improve the execution prices of limit orders ... 5.2.1 During the Second Session, the Trading System will execute market orders partially or fully at one price, and convert the unmatched parts of partially matched market orders into limit orders at their traded prices."
