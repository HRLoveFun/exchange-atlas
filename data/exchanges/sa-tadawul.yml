        accessed: 2026-08-27
    quote: "The margin that is collected to cover potential changes in the value of each client position. ... Is the number by which the minimum percentage margin, required by the Muqassa, have to be multiplied to form the margin required by the clearing member from his clients for newly entered positions. ... Means total Margin and it includes Initial Margin, any applicable Variation Margin and any additional margin determined by Muqassa and the clearing member."
    confidence: high
    verified: 2026-08-27

  maintenance_margin_practice:
    zh: "变动保证金（Variation Margin）按市值计价（MTM）每日计收，用于覆盖未平仓头寸当日的实际盈亏；当保证金低于维持水平时会员向客户追收"
    en: "Variation Margin (VM) is mark-to-market (MTM), collected on a daily basis to cover the current losses on open positions; members make margin calls when the balance falls below the maintenance level"
