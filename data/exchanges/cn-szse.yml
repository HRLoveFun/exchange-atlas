    quote: "9.1.16 上市公司股票被本所强制退市后，进入退市整理期，因触及交易类强制退市情形而终止上市的除外。强制退市公司应当在本所作出终止其股票上市决定后立即安排股票转入全国中小企业股份转让系统等证券交易场所转让的相关事宜，保证公司股票在摘牌之日起四十五个交易日内可以转让。强制退市公司在股票被摘牌前，应当与符合规定条件的证券公司（以下简称主办券商）签订协议，聘请该机构在公司股票被终止上市后为公司提供股份转让服务……主动终止上市公司可以选择在全国中小企业股份转让系统等证券交易场所交易或转让其股票，或者依法作出其他安排。"
