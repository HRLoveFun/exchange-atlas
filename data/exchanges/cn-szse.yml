    en: "Commercial distribution of official market data is real-time by default: both the basic and enhanced feeds are streamed in real time over a persistent TCP/IP connection to Shenzhen Securities Information's MDC gateway, and official materials emphasize 'stable, low-latency, low-cost' service; this session's sources did not describe any free delayed-quote arrangement for the general public (e.g. the common 15-minute delay), left for future verification"
