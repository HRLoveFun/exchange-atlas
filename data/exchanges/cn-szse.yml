    confidence: medium

  core_laws:
    zh: "《中华人民共和国证券法》"
    en: "Securities Law of the People's Republic of China"
    detail: |
      本所《交易规则》《股票上市规则》等自律规则的效力位阶低于证券法，制定依据在规则正文
      开篇即列明。英文官方译名未在本次会话核实到 npc.gov.cn/csrc.gov.cn 英文站的直链，沿用
      与 cn-sse.yml 一致的通行译名，未独立验证，见 OPEN-QUESTIONS。
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第1.1条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14
    quote: "为规范证券市场交易行为，维护证券市场秩序，保护投资者合法权益，根据《中华人民共和国证券法》《证券交易所管理办法》等法律、行政法规、部门规章、规范性文件（以下统称法律法规）以及《深圳证券交易所章程》，制定本规则。"
    confidence: high

