    en: "Basic Market Data (Level-1): core data including a five-level bid/ask book; Enhanced Market Data (commonly called Level-2): on top of the basic feed, the real-time bid/ask book is expanded from 5 to 10 price levels, plus the top-50 price-tier detail, order-by-order and trade-by-trade data, covering the full Main Board/ChiNext market across all instrument types (equities, funds, indices, bonds); both tiers are licensed exclusively through SZSE's wholly-owned data subsidiary, Shenzhen Securities Information Co."
