    quote: "1.2 在深圳证券交易所（以下简称本所）主板上市的股票及其衍生品种的上市、信息披露、停牌、复牌、退市等事宜，适用本规则。……1.3 发行人申请股票及其衍生品种在本所上市的，应当经本所审核同意。发行人首次公开发行股票或者存托凭证在本所上市的，应当在上市前与本所签订上市协议，明确双方的权利、义务和其他事项。／2.1.1 上市公司及相关信息披露义务人应当根据法律法规、本规则及本所其他规定，及时、公平地披露信息，并保证所披露的信息真实、准确、完整。"
