  delisting_conditions:
    zh: "四类强制退市（交易类、财务类、规范类、重大违法类）+ 主动退市；主板「面值退市」标准为连续二十个交易日收盘价均低于1元，市值退市标准为连续二十个交易日收盘总市值均低于5亿元，股东人数标准为连续二十个交易日股东人数均少于2000人；创业板市值退市标准更低（3亿元），股东人数退市标准也更低（400人）"
