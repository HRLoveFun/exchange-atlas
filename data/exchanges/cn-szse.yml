# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-14
    confidence: medium

  regulator:
    zh: "中国证券监督管理委员会"
    en: "China Securities Regulatory Commission (CSRC)"
    detail: "国务院直属正部级事业单位，统一监管全国证券期货市场；与上交所受同一机构监管。"
    sources:
      - title: 本所简介
        url: https://www.szse.cn/aboutus/sse/introduction/index.html
        accessed: 2026-08-14
      - title: SZSE English — About Overview
        url: https://www.szse.cn/English/about/overview/index.html
        accessed: 2026-08-14
    quote: "Shenzhen Stock Exchange (SZSE), established on 1st December, 1990, is a self-regulated legal entity under the supervision of China Securities Regulatory Commission (CSRC)."
    confidence: high

  self_regulatory_org:
    zh: "中国证券业协会（券商层面）；深交所自身对上市公司与会员行使一线自律监管职能"
    en: "Securities Association of China (SAC); SZSE itself as front-line self-regulator"
    confidence: medium
    detail: "SAC 与交易所自律监管的职责边界未逐条核实，与 cn-sse.yml 记录的悬案相同（见 OPEN-QUESTIONS）；但交易所自身自律法人地位有直接官网原文佐证。"
    sources:
      - title: SZSE English — About Overview
        url: https://www.szse.cn/English/about/overview/index.html
        accessed: 2026-08-14
    quote: "self-regulated legal entity under the supervision of China Securities Regulatory Commission (CSRC)"

  clearing_regulator:
    zh: "中国证券监督管理委员会（对中国结算的监管）"
    en: "CSRC"
    confidence: medium

  core_laws:
    zh: "《中华人民共和国证券法》"
    en: "Securities Law of the People's Republic of China"
    detail: |
      本所《交易规则》《股票上市规则》等自律规则的效力位阶低于证券法，制定依据在规则正文
      开篇即列明。英文官方译名未在本次会话核实到 npc.gov.cn/csrc.gov.cn 英文站的直链，沿用
      与 cn-sse.yml 一致的通行译名，未独立验证，见 OPEN-QUESTIONS。
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第1.1条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14
    quote: "为规范证券市场交易行为，维护证券市场秩序，保护投资者合法权益，根据《中华人民共和国证券法》《证券交易所管理办法》等法律、行政法规、部门规章、规范性文件（以下统称法律法规）以及《深圳证券交易所章程》，制定本规则。"
    confidence: high

  foreign_ownership_limit:
    zh: "单个合格境外投资者（QFII/RQFII）或其他境外投资者持有单个上市公司的股份，不得超过该公司股份总数的10%；全部合格境外投资者及其他境外投资者持有单个公司A股股份的总和，不得超过该公司股份总数的30%；因上市公司减少注册资本等原因导致合计持股比例被动超过30%的，可继续持有但不得增持，直至回落至30%以下方可恢复增持；战略投资持股不受此比例限制"
    en: "A single QFII/RQFII or other foreign investor may not hold more than 10% of a single listed company's total shares; all qualified foreign investors and other foreign investors combined may not hold more than 30% of a single company's A-share total; if the combined stake passively exceeds 30% (e.g. due to the company reducing registered capital), holders may keep the excess but may not add to it until the combined stake falls back below 30%; shares held under a lawful strategic investment are exempt from this cap"
    detail: "该细则为深交所自身发布的业务规则，与中国证监会/人民银行/外汇局2020年发布的《合格境外机构投资者和人民币合格境外机构投资者境内证券期货投资管理办法》第十五条「合格境外投资者开展境内证券投资，应当遵守中国证监会规定的证券投资比例限制」衔接——后者未直接给出具体比例数字，具体10%/30%门槛由本细则明确。"
    sources:
      - title: 深圳证券交易所合格境外机构投资者和人民币合格境外机构投资者证券交易实施细则（2020年修订）第十一条
        url: https://docs.static.szse.cn/www/disclosure/notice/general/W020201030604374968707.pdf
        accessed: 2026-08-24
    quote: "第十一条 合格境外投资者及其他境外投资者的境内证券投资，应当遵循下列持股比例限制：（一）单个合格境外投资者或其他境外投资者持有单个上市公司的股份，不得超过该公司股份总数的 10%；（二）全部合格境外投资者及其他境外投资者持有单个公司 A 股股份的总和，不得超过该公司股份总数的 30%。"
    confidence: high

  capital_controls:
    zh: "合格境外投资者（QFII/RQFII）须委托境内托管人办理资产托管，并依法委托境内证券公司办理境内证券交易；须在托管人处开立外汇账户和/或人民币专用存款账户，收支范围须符合人民银行、外汇局规定；本金汇入与投资收益汇出均须按人民银行、外汇局相关规定办理，以外汇形式汇入的本金须为境内外汇市场可挂牌交易货币；托管人须对合格境外投资者的自有资产与受托资产分账托管"
    en: "QFII/RQFII investors must appoint an onshore custodian to hold assets in custody and must trade through licensed onshore securities firms; they must open a foreign-exchange account and/or a dedicated RMB deposit account with the custodian, subject to PBOC/SAFE rules on permitted receipts and payments; both inbound principal and outbound proceeds must be handled per PBOC/SAFE requirements, and foreign-currency principal must be in a currency tradable on China's FX market; custodians must keep QFII/RQFII assets segregated from the custodian's own assets"
    detail: "本字段引用的是中国证监会、人民银行、外汇局联合发布的全国性规章，非深交所自定规则，与上交所（cn-sse）适用同一套资本管制框架；深交所自身的《合格境外机构投资者和人民币合格境外机构投资者证券交易实施细则》（见 foreign_ownership_limit 字段来源）在此基础上另订持股比例、减持等交易端安排，但汇兑、跨境收付等资本项目管制事项仍以本办法为准。"
    sources:
      - title: 合格境外机构投资者和人民币合格境外机构投资者境内证券期货投资管理办法（2020年证监会、人民银行、外汇局令第176号，自2020年11月1日起施行）第十九、二十条
        url: http://www.csrc.gov.cn/csrc/c106256/c1653823/content.shtml
        accessed: 2026-08-24
    quote: "第十九条 合格境外投资者应当在托管人处开立外汇账户和（或）人民币专用存款账户，收支范围应当符合人民银行、外汇局的有关规定。第二十条 合格境外投资者应当按照人民银行、外汇局相关规定汇入本金，以外汇形式汇入的本金应当是在中国外汇市场可挂牌交易的货币。合格境外投资者可以按照人民银行、外汇局相关规定汇出资金。"
    confidence: high

  disclosure_requirements:
    zh: "基本框架为《证券法》《上市公司信息披露管理办法》与深交所《股票上市规则》，深交所另订《上市公司自律监管指引第5号——信息披露事务管理》细化落实；核心原则是信息披露须及时、公平、真实、准确、完整，上市公司须指定董事会秘书统筹信息披露事务管理部门，披露形式含定期报告（年报/半年报/季报）与临时报告两类"
    en: "The framework rests on the Securities Law, the CSRC's Administrative Measures for Information Disclosure by Listed Companies, and SZSE's own Stock Listing Rules, with SZSE Self-Regulatory Guideline No. 5 — Information Disclosure Administration providing implementation detail; the core principle is that disclosure must be timely, fair, truthful, accurate and complete, each listed company must designate a board secretary to head its disclosure-administration department, and disclosure takes the form of periodic reports (annual/semi-annual/quarterly) plus ad hoc reports"
    sources:
      - title: 深圳证券交易所上市公司自律监管指引第5号——信息披露事务管理（2025年修订）第一条
        url: https://docs.static.szse.cn/www/lawrules/rule/stock/supervision/currency/W020250327591142579433.pdf
        accessed: 2026-08-24
      - title: 深圳证券交易所股票上市规则（2026年修订）第2.1.1条
        url: http://docs.static.szse.cn/www/lawrules/rule/allrules/bussiness/W020260424747613955674.pdf
        accessed: 2026-08-24
    quote: "第一条 为规范上市公司及相关信息披露义务人的信息披露行为，提高公司信息披露管理水平和信息披露质量，引导和督促公司做好信息披露及相关工作，保护投资者合法权益，根据《证券法》《上市公司信息披露管理办法》和《深圳证券交易所股票上市规则》《深圳证券交易所创业板股票上市规则》（以下统称《股票上市规则》）等规定，制定本指引。／2.1.1 上市公司及相关信息披露义务人应当根据法律法规、本规则及本所其他规定，及时、公平地披露信息，并保证所披露的信息真实、准确、完整，简明清晰、通俗易懂，不得有虚假记载、误导性陈述或者重大遗漏。"
    confidence: high

  investor_protection:
    zh: "全国性专业投资者保护机构为中证中小投资者服务中心（投服中心），提供持股行权、纠纷调解、支持诉讼、股东诉讼及特别代表人诉讼等服务；特别代表人诉讼依据《证券法》第九十五条第三款，由投服中心受五十名以上投资者委托作为代表人参加证券民事诉讼；该机构服务覆盖沪深两所上市公司，非深交所专属机制"
    en: "The national specialized investor-protection body is the China Securities Investor Services Center (ISC), which offers shareholder-rights exercise, dispute mediation, litigation support, shareholder litigation and special representative litigation; special representative litigation, based on Article 95(3) of the Securities Law, lets the ISC act as representative in a securities civil suit on behalf of 50-plus investors who have entrusted it; this mechanism covers listed companies on both SSE and SZSE and is not SZSE-specific"
    detail: "投服中心是中国证监会体系下的全国性机构，本字段所述职能与机制适用全国沪深两所，未见深交所自身另立专属的投资者保护机构或补充安排，本次会话也未核实具体涉及深市上市公司的特别代表人诉讼/支持诉讼案例，confidence 因此定为 medium 而非 high。"
    sources:
      - title: 维权服务 - 中证中小投资者服务中心
        url: http://www.isc.com.cn/tsyw/wqfw/
        accessed: 2026-08-24
    quote: "维权服务主要包括证券特别代表人诉讼、支持诉讼、股东诉讼。特别代表人诉讼是指依据《证券法》第九十五条第三款和《最高人民法院关于证券纠纷代表人诉讼若干问题的规定》第三十七条规定，投服中心受五十名以上投资者委托，作为代表人参加的证券民事诉讼。"
    confidence: medium

