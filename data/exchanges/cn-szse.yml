    zh: "中国结算作为CCP以分层财务资源应对结算参与人交收违约：先动用违约方担保物中的现金部分、结算保证金，不足部分动用证券结算风险基金及一般风险准备金；对逾期无法追偿的证券/资金，可依法动用结算保证金与结算风险基金予以弥补，之后继续向违约方追偿；程序上可采取扣划证券、处置证券等措施完成违约处置"
    en: "As CCP, ChinaClear meets a clearing participant's settlement default with tiered financial resources: first the defaulting party's own cash collateral and settlement margin, then (if insufficient) the securities settlement risk fund and general risk reserve; for securities or funds that cannot be recovered within the prescribed period, it may draw on the settlement margin and risk fund to cover the shortfall and then continue pursuing recovery from the defaulter; procedurally it may debit or dispose of the defaulter's securities to make up the shortfall"
    detail: "本字段为中国结算的全国性违约处置框架，同等适用于沪深两所清算的证券，非深交所专属机制；与上交所（cn-sse）共用同一登记结算法人（见 clearing.ccp_name）。"
