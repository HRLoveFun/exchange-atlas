    en: "From acceptance of the listing application, SZSE's own review plus CSRC's registration decision must together take no more than 3 months (time the issuer and intermediaries spend responding to review inquiries is excluded from this clock, and is itself capped separately at 3 months in total); SZSE must issue its first round of review inquiries within 20 working days of acceptance"
    sources:
      - title: 深圳证券交易所股票发行上市审核规则（2024年修订）第三十六条、第四十四条
