      zh: "期权保证金实行分级收取：中国结算向结算参与人、结算参与人向委托其结算的期权经营机构、期权经营机构向客户逐级收取，下级收取标准不得低于上级标准；开仓保证金以现金或中国结算认可的证券交纳，按公式计算（以深交所目前全部品种——ETF为标的为例：认购期权义务仓开仓保证金=[合约前结算价+Max(12%×标的前收盘价-认购期权虚值,7%×标的前收盘价)]×合约单位，认沽公式对称，详细公式与股票标的的另一套参数见 market_structure.derivatives.margin_practice_note）"
      en: "Option margin is collected in a tiered structure: ChinaClear collects from clearing participants, clearing participants from the options firms that clear through them, and options firms from clients — each tier's requirement no lower than the tier above; opening margin is payable in cash or securities recognized by ChinaClear and is formula-based (for SZSE's current products, all ETF-underlying: short-call opening margin = [prior settlement price + Max(12%×underlying prior close − call's out-of-the-money value, 7%×underlying prior close)] × contract multiplier, with a symmetric put formula; the stock-underlying parameter set is not yet in use — see market_structure.derivatives.margin_practice_note for the full formulas)"
      detail: "本字段是 clearing（清算/CCP）层面对同一保证金制度的视角，与 market_structure.derivatives.margin_practice_note（交易端保证金要求）描述同一套规则但视角不同，两者不合并，见 PROJECT/DECISIONS.md [ADR-030]。"
      sources:
        - title: 深圳证券交易所 中国证券登记结算有限责任公司股票期权试点风险控制管理办法 第十四、十五条
          url: http://docs.static.szse.cn/www/option/rules/optrules/W020191207433397366259.pdf
          accessed: 2026-08-24
      quote: "合约标的为交易型开放式指数基金（以下简称交易型开放式基金）的，每张合约的开仓保证金的计算公式为：（一）认购期权义务仓开仓保证金＝ [合约前结算价+Max（12%×合约标的前收盘价-认购期权虚值，7%×合约标的前收盘价）]×合约单位。（二）认沽期权义务仓开仓保证金＝Min[合约前结算价+Max（12%×合约标的前收盘价-认沽期权虚值，7%×行权价），行权价]×合约单位。"
      confidence: high

    maintenance_margin_practice:
      zh: "每个交易日日终，中国结算按深交所公布的合约结算价格计算并收取结算参与人应交纳的维持保证金；结算准备金小于零、或开盘时结算准备金大于零但低于最低余额的，不得进行买入开仓、卖出开仓；维持保证金计算公式与开仓保证金同构，仅将「前收盘价/前结算价」替换为「收盘价/结算价」"
      en: "At the end of every trading day, ChinaClear calculates and collects the maintenance margin owed by each clearing participant, based on the contract settlement price published by SZSE; a participant whose settlement reserve is negative — or positive but below the minimum balance at the open — may not open new long or short option positions; the maintenance-margin formula mirrors the opening-margin formula, substituting the prior close/prior settlement price with the current close/settlement price"
      detail: "同 initial_margin_practice，本字段是清算/CCP层面视角，与市场结构章节的交易端保证金说明不合并，见 [ADR-030]。"
      sources:
        - title: 深圳证券交易所 中国证券登记结算有限责任公司股票期权试点风险控制管理办法 第十六至十九条
          url: http://docs.static.szse.cn/www/option/rules/optrules/W020191207433397366259.pdf
          accessed: 2026-08-24
      quote: "第十六条 结算参与人结算准备金最低余额应当达到中国结算的要求。结算准备金最低余额由结算参与人以自有资金交纳。结算参与人结算准备金小于零，或者开盘时结算准备金大于零但低于结算准备金最低余额的，不得进行买入开仓、卖出开仓。第十七条 每个交易日日终，中国结算按深交所公布的合约结算价格计算并收取结算参与人应当交纳的维持保证金。合约结算价格计算方式由深交所及中国结算另行规定。"
