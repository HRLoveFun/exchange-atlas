    en: "Closing Call Auction (14:57-15:00)"
    detail: "9:20-9:25 开盘集合竞价阶段、14:57-15:00 收盘集合竞价阶段，交易主机不接受撤销申报。"
    quote: "每个交易日 9:20 至 9:25、14:57 至 15:00，本所交易主机不接受参与竞价交易的撤销申报"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第3.3.1条
