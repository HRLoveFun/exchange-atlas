      quote: "2.5 期权合约的到期日为到期月份的第四个星期三。该日为国家法定节假日、本所休市日的，顺延至次一交易日。期权合约的最后交易日和行权日，同其到期日；到期日提前或者顺延的，最后交易日和行权日随之调整。……5.11 期权合约最后交易日，期权合约发生全天停牌或者盘中临时停牌的，期权合约的行权申报照常进行，期权合约最后交易日、到期日、行权日不作顺延。5.12 期权合约最后交易日出现下列情形的，期权合约最后交易日、到期日、行权日相应调整：（一）期权合约最后交易日处于合约标的配股股权登记日与配股缴款日后复牌首日之间且停牌的……（二）合约标的将在期权合约最后交易日的次一交易日进行除权、除息的……"
