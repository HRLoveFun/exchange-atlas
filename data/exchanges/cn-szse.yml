  fx_risk_note:
    zh: "人民币非完全可自由兑换，外资参与需通过额度管理渠道，存在换汇与资金进出限制；与上交所面临相同的国家层面外汇管制环境"
    en: "The RMB is not fully convertible; foreign participation must go through quota-managed channels, and FX conversion and cross-border fund movement are subject to restrictions — the same national-level FX control environment faced by SSE"
    confidence: low

  political_risk_note:
    zh: "深交所受中国证监会统一监管，跨境资金流动、外资持股比例、信息披露合规边界均受国家层面资本管制与外汇管理政策约束（见 regulation.capital_controls、regulation.foreign_ownership_limit）；地缘政治环境变化可能通过跨境资本流动限制、境外投资者准入政策调整等渠道传导至深市，与上交所面临同一国家层面的政治与监管环境"
    en: "SZSE is regulated uniformly by the CSRC, and cross-border capital flows, foreign ownership limits, and the boundaries of disclosure compliance are all constrained by national-level capital and FX controls (see regulation.capital_controls, regulation.foreign_ownership_limit); shifts in the geopolitical environment could transmit to the Shenzhen market through channels such as cross-border capital flow restrictions or changes to foreign-investor access policy — the same national-level political and regulatory environment faced by SSE"
    confidence: low
    detail: "本条为基于已核实的 regulation.capital_controls / foreign_ownership_limit 等结构性字段的推断说明，非独立数据来源；sources 复用支撑 capital_controls 字段的同一份规章，作为背景支撑，而非本字段本身的直接出处。"
    sources:
      - title: 合格境外机构投资者和人民币合格境外机构投资者境内证券期货投资管理办法（2020年证监会、人民银行、外汇局令第176号）
        url: http://www.csrc.gov.cn/csrc/c106256/c1653823/content.shtml
        accessed: 2026-08-24

  liquidity_risk_note:
    zh: "深市个股流动性分层明显：主板蓝筹与创业板龙头交投活跃，但风险警示（ST/*ST）与退市整理股票因涨跌幅收窄至±5%、叠加适当性门槛（两年以上交易经验、开通前20个交易日日均资产不低于50万元，见 participants.suitability_management）等制度安排，实际流动性显著低于普通股票"
    en: "Liquidity is markedly stratified across Shenzhen-listed stocks: Main Board blue chips and ChiNext leaders trade actively, but risk-warned (ST/*ST) and delisting-transition-period stocks — subject to a narrowed ±5% price-limit band plus suitability-management thresholds (2+ years' trading experience, RMB 500,000+ average daily assets over the preceding 20 trading days; see participants.suitability_management) — have materially lower actual liquidity than ordinary stocks"
    confidence: low
    detail: "本条为基于已核实的 market_structure.price_limits、participants.suitability_management 等结构性字段的推断说明，非独立数据来源；官方就深交所整体或分层的换手率、买卖价差公开统计本次未核实到；sources 复用支撑 suitability_management 字段的同一份交易规则，作为背景支撑，而非本字段本身的直接出处。"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第4.5.3条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14

  regulatory_change_risk_note:
    zh: "深交所核心业务规则修订频繁：现行《股票上市规则》自1998年1月实施以来已历经十七次修订（最近一次为2026年4月）；《交易规则》自2001年11月30日实施以来同样历经多次修订。本项目建档过程中也直接观测到这种高频修订节奏——上一轮抓取登记的2025年修订版《股票上市规则》PDF链接在本轮抓取时已返回404，经核实是被2026年4月发布的新修订版静默替换下线（详见 PROJECT/SOURCES.md 本节开头记录）"
    en: "SZSE's core business rules are revised frequently: the current Stock Listing Rules, in effect since January 1998, have already undergone seventeen revisions (the most recent in April 2026); the Trading Rules, in effect since 30 November 2001, have likewise been revised repeatedly. This project's own data-gathering process observed this high revision cadence directly — the 2025-revision Stock Listing Rules PDF registered during a prior fetch returned a 404 on this round, and was confirmed to have been silently superseded and taken offline by the new revision published in April 2026 (see the note at the top of this file's section in PROJECT/SOURCES.md)"
