  delisting_process:
    zh: "强制退市程序：本所在规定期限内向公司发出拟终止上市事先告知书→公司可在5个交易日内提出听证要求，或10个交易日内提交书面陈述和申辩（逾期视为放弃）→未申请听证的，本所上市委员会在陈述申辩期届满后15个交易日内形成审议意见；申请听证的，听证会后15个交易日内形成意见→本所依据上市委员会意见作出是否终止上市的决定，2个交易日内公告并报中国证监会备案"
    en: "Mandatory delisting procedure: SZSE issues a prior notice of intent to terminate listing within a prescribed period → the company may, within 5 trading days, request a hearing, or within 10 trading days submit a written statement and defense (failure to do either within the deadline is treated as a waiver) → if no hearing was requested, SZSE's Listing Review Committee forms its opinion within 15 trading days of the statement/defense deadline; if a hearing was held, within 15 trading days of the hearing's conclusion → SZSE decides whether to terminate the listing based on the Committee's opinion, announcing the decision within 2 trading days and filing it with the CSRC"
    sources:
      - title: 深圳证券交易所股票上市规则（2026年修订）第9.1.9-9.1.13条
        url: http://docs.static.szse.cn/www/lawrules/rule/allrules/bussiness/W020260424747613955674.pdf
        accessed: 2026-08-24
    quote: "9.1.9 上市公司出现本所规定的强制退市情形之一的，本所在规定期限内向公司发出拟终止其股票上市的事先告知书。……9.1.10 上市公司可以在收到或者本所公告送达终止上市事先告知书之日……起五个交易日内，以书面形式向本所提出听证要求……公司对终止上市有异议的，可以在收到或者本所公告终止上市事先告知书之日起十个交易日内，向本所提交相关书面陈述和申辩……9.1.11……上市公司在本规则第9.1.10条规定期限内提出听证要求的，由本所上市委员会按照有关规定组织召开听证会，并在听证程序结束后十五个交易日内就是否终止公司股票上市事宜形成审议意见。公司未在规定期限内提出听证申请的，本所上市委员会在陈述和申辩提交期限届满后十五个交易日内，就是否终止公司股票上市事宜形成审议意见。本所根据上市委员会的审议意见，作出是否终止股票上市的决定。……9.1.13 本所在作出终止上市公司股票上市决定之日起两个交易日内，通知上市公司并以交易所公告形式发布相关决定，同时报中国证监会备案。"
    confidence: high

  delisting_transition_period:
    zh: "财务类、规范类、重大违法类强制退市适用十五个交易日退市整理期；交易类强制退市不适用退市整理期（直接终止上市）"
    en: "Fifteen-trading-day delisting transition period applies to financial/compliance/major-violation delisting; not applicable to trading-based delisting"
    detail: "与 cn-sse.yml 记录的「交易类退市已取消退市整理期设置（2024年修订）」结论一致，本条在 SZSE 主板上市规则原文中读到更明确的适用范围划分（仅第三至五节情形适用第六节退市整理期，第二节交易类强制退市不适用）。"
    sources:
      - title: 深圳证券交易所股票上市规则（2026年修订）第9.6.1-9.6.2条
