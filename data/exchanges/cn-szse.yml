  founded_year:
    zh: "1990（12月1日开业）"
    en: "1990 (opened 1 December 1990)"
    detail: |
      深圳证券交易所于1990年12月1日开始营业，经国务院批准设立。与上交所（1990年11月26日
      成立、12月19日开业）几乎同期设立，两所是中国内地仅有的两家证券交易所（另有主要服务
      中小企业的北交所，2021年设立，本次未纳入研究范围）。
    sources:
      - title: 本所简介
        url: https://www.szse.cn/aboutus/sse/introduction/index.html
        accessed: 2026-08-14
      - title: SZSE English — About Overview
        url: https://www.szse.cn/English/about/overview/index.html
        accessed: 2026-08-14
    quote: "深圳证券交易所（以下简称深交所或本所）于1990年12月1日开始营业，是经国务院批准设立的全国性证券交易场所，受中国证监会监督管理。"
    confidence: high

  history:
    zh: "2004年5月设立中小企业板；2009年10月设立创业板；2021年中小企业板并入主板"
    en: "SME Board launched May 2004; ChiNext market inaugurated October 2009; SME Board merged into Main Board in 2021"
    detail: |
      与上交所"主板+科创板"的结构不同，深交所现行板块结构是"主板+创业板"——中小企业板已
      于2021年并入主板，不再独立存在。这是本次建档发现的一处与 cn-sse.yml 记录方式的结构性
      差异：cn-sse 的科创板（2019年设立）定位科技创新企业且保留至今，深交所的中小企业板则是
      "设立后又被撤并"的板块，历史沿革比 cn-sse 更曲折。
    sources:
      - title: SZSE English — About Overview
        url: https://www.szse.cn/English/about/overview/index.html
        accessed: 2026-08-14
    quote: "The SME Board was launched in May 2004. The ChiNext market was inaugurated in October 2009. In 2021, SZSE starts preparation for the merger between the Mainboard and the SME Board."
    confidence: medium

  organization_form:
