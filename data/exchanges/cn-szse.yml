    quote: "第三十六条 对股票首次发行上市申请，本所发行上市审核机构自受理之日起二十个工作日内，通过保荐人向发行人提出首轮审核问询。……第四十四条 申请股票首次发行上市的，本所在规定的时限内出具发行人符合发行条件、上市条件和信息披露要求的审核意见或者作出终止发行上市审核的决定，但发行人及其保荐人、证券服务机构回复本所审核问询的时间不计算在内。发行人及其保荐人、证券服务机构回复本所审核问询的时间总计不超过三个月。自受理发行上市申请文件之日起，本所审核和中国证监会注册的时间总计不超过三个月。"
