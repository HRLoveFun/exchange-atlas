    quote: "发生交收违约时，中国结算可以动用的财务资源包括违约结算参与人的担保物中的现金部分、结算保证金、结算风险基金以及包括一般风险准备金在内的其他资金。……《结算规则》规定，违约结算参与人未在规定的期间内补足资金、证券的，证券登记结算机构可以处分违约结算参与人所提供的担保物、质押品保管库中的回购质押券、卖出专用清偿账户内的证券。在规定期限内无法追偿的证券或资金，证券登记结算机构可以依法动用结算保证金和结算风险基金予以弥补。……中国结算可依照《结算规则》规定的程序，通过采取扣划证券、处置证券等措施，进行结算参与人交收违约处置，弥补违约金额。"
