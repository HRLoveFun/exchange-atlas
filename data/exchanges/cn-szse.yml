  investor_structure:
    zh: "按证券账户数计，个人投资者占绝对多数（第三方分析显示2024年末个人投资者账户占比超99.7%）；按A股持股市值计，机构与产业资本占比明显高于账户数占比——第三方分析将2024年末沪深A股整体持股市值划分为产业资本34.4%、政府持股7.6%、专业机构投资者19.2%、个人大股东6.4%、一般个人投资者32.3%（以上均为沪深A股市场整体口径，非深交所单独统计，深交所自身逐年发布的《市场统计年鉴》理论上含更精确口径，本次未及逐份核对）"
    en: "By number of securities accounts, individual investors are the overwhelming majority (third-party analysis put individual accounts at over 99.7% of all accounts at end-2024); by A-share holding value the institutional/corporate share is markedly higher than its account-count share — third-party analysis splits end-2024 combined SSE+SZSE A-share holding value into 34.4% corporate capital, 7.6% government holdings, 19.2% professional institutional investors, 6.4% individual controlling shareholders, and 32.3% general individual investors (all figures are market-wide for both exchanges combined, not an SZSE-specific breakdown; SZSE's own annually published Market Statistical Yearbook likely has a more precise SZSE-only figure, not cross-checked this session)"
    detail: "以上数字来自第三方财经媒体对官方统计年鉴的二次分析整理，非直接读到深交所/上交所年鉴原文，故 confidence 依 CLAUDE.md 铁律封顶 medium；且口径为沪深两市合计，非深交所单独数据，留待后续直接核对《深圳证券交易所市场统计年鉴》原文。"
    sources:
      - title: 从投资者结构变化看资本市场投资端改革——2024年投资者结构全景分析（新浪财经转载）
        url: https://finance.sina.com.cn/jjxw/2025-06-23/doc-infcanva9299037.shtml
        accessed: 2026-08-24
      - title: A股投资者首超2.4亿，个人投资者超99%，占比逐年递增（财联社）
        url: https://www.cls.cn/detail/2086830
        accessed: 2026-08-24
    confidence: medium

  account_opening_requirements:
    zh: "年满18周岁的中国公民（含16-18周岁以自身劳动收入为主要生活来源者）、获得中国永久居留资格的外国人，以及普通机构投资者，可申请开立A股账户等证券账户；在中国大陆工作生活的港澳台居民可持港澳台居住证或来往内地/大陆通行证（须附就业证明等材料）申请开立A股账户；纯境外自然人/机构（未在大陆工作生活）原则上仅可开立B股等特定账户；开立股转系统账户、信用证券账户等另需符合投资者适当性管理要求"
    en: "Chinese citizens aged 18 or older (including those aged 16-18 whose main livelihood is their own labor income), foreigners with permanent Chinese residency, and ordinary institutional investors may apply to open A-share and other securities accounts; Hong Kong/Macao/Taiwan residents living and working in mainland China may open A-share accounts using their mainland residence permit or mainland travel permit (plus proof of employment); foreign natural persons or institutions without mainland residency/work status may generally only open B-share and certain other specified accounts; opening a NEEQ account, a margin-trading securities account, etc. additionally requires meeting investor-suitability requirements"
    detail: "来源为中国结算《证券账户业务指南》，文档版本落款「二〇一六年十月」，本次未核实2016年10月之后是否另有修订版本，账户开立资格这类结构性规则变动概率较低但未逐一验证最新状态，故 confidence 定 medium 而非 high；该指南通过中国证监会陕西监管局官网留存获取，非中国结算官网当次直接抓取，属间接留存件。"
    sources:
      - title: 中国证券登记结算有限责任公司证券账户业务指南（二〇一六年十月）第1.4、1.5条
        url: http://www.csrc.gov.cn/shanxi/c1055540/c1609332/1609332/files/中国证券登记结算有限责任公司证券账户业务指南.pdf
        accessed: 2026-08-24
    quote: "1.4【境内投资者开户资格】……（1）年满十八周岁的中国公民（含境内十六周岁以上不满十八周岁，以自己的劳动收入为主要生活来源的中国公民）可以申请开立一码通账户、A股账户……（2）获得中国永久居留资格的外国人可以申请开立一码通账户、A股账户……1.5【境外投资者开户资格】……（1）外国的自然人以及中国香港、澳门特别行政区和台湾地区的自然人，持有中国护照并获得境外国家或者地区永久居留签证的中国公民可以申请开立一码通账户、B股账户……在大陆工作和生活的中国香港、澳门特别行政区和台湾地区的居民还可以申请开立A股账户……"
    confidence: medium

  suitability_management:
    zh: "退市整理股票有专门的适当性门槛：个人投资者须具备两年以上股票交易经验，且申请权限开通前二十个交易日证券账户及资金账户内的资产日均不低于人民币50万元"
    en: "Investors trading delisting-transition-period stocks must have 2+ years of trading experience and RMB 500,000+ average daily assets over the preceding 20 trading days"
    detail: "这是「风险警示板」（退市整理股票专属交易板块）的准入门槛，不是全市场统一的适当性标准；全市场层面的适当性管理制度未核实，留空对应部分。"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第4.5.3条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14
    quote: "参与退市整理股票买入交易的个人投资者，必须具备两年以上股票交易经验，申请权限开通前二十个交易日证券账户及资金账户内的资产日均不低于人民币50万元，其中不包括该投资者通过融资融券融入的证券和资金。"
    confidence: high

