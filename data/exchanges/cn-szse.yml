    en: "Market data is licensed on a 'basic service + value-added services' commercial model, billed annually per MDC (market-data client gateway): basic SZSE Binary feed RMB 50,000/year/MDC (each customer's first unit free); SZSE DBF feed, SZSE market-data API, SSE API feed and SSE TXT feed each RMB 30,000/year; additional local access RMB 10,000/connection; the pricing is set and licensed exclusively by SZSE's wholly-owned data subsidiary, Shenzhen Securities Information Co."
    sources:
