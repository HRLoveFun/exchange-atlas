  major_outage_history:
    zh: "2002年7月5日上午，深圳证券通信公司租用的亚太卫星1号7A转发器受不明强信号干扰，导致917家证券营业部通信全部中断，深交所依《交易规则》及《异常情况处理规定》作出紧急停市决定，通信系统于当日中午11:15恢复正常，下午交易恢复正常；更早期还有1992年8月10-11日因新股认购抽签表发售引发风波（「8·10事件」），深圳证券市场领导小组决定停市半天"
    en: "On the morning of 5 July 2002, the Asiapac-1 satellite transponder (channel 7A) leased by Shenzhen Securities Communication Co. suffered unexplained strong-signal interference, cutting off communications with all 917 securities branch offices; SZSE declared an emergency trading halt under its Trading Rules and Abnormal-Circumstance Handling Provisions, restored communications by 11:15am the same day, and resumed normal trading that afternoon; an earlier case was the 10-11 August 1992 disruption around the sale of new-share subscription lottery slips (the '8-10 Incident'), after which the Shenzhen securities-market leading group halted trading for half a day"
    detail: "来源为中文维基百科「深圳证券交易所」条目「大事记」章节，属第三方百科来源，本次会话未核实到深交所官方对这两起事件的原始公告存档，confidence 依 CLAUDE.md 铁律封顶 medium。"
    sources:
