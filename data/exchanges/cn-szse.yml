# ═══════════════════════════════════════════════
# 二｜基本信息
# ═══════════════════════════════════════════════
overview:
  _meta:
    verified: 2026-08-14
    confidence: medium

  timezone: "Asia/Shanghai (UTC+8)"
  dst_rule: "不实行夏令时"

  founded_year:
    zh: "1990（12月1日开业）"
    en: "1990 (opened 1 December 1990)"
    detail: |
      深圳证券交易所于1990年12月1日开始营业，经国务院批准设立。与上交所（1990年11月26日
      成立、12月19日开业）几乎同期设立，两所是中国内地仅有的两家证券交易所（另有主要服务
      中小企业的北交所，2021年设立，本次未纳入研究范围）。
    sources:
      - title: 本所简介
        url: https://www.szse.cn/aboutus/sse/introduction/index.html
        accessed: 2026-08-14
      - title: SZSE English — About Overview
        url: https://www.szse.cn/English/about/overview/index.html
        accessed: 2026-08-14
    quote: "深圳证券交易所（以下简称深交所或本所）于1990年12月1日开始营业，是经国务院批准设立的全国性证券交易场所，受中国证监会监督管理。"
    confidence: high

  history:
    zh: "2004年5月设立中小企业板；2009年10月设立创业板；2021年中小企业板并入主板"
    en: "SME Board launched May 2004; ChiNext market inaugurated October 2009; SME Board merged into Main Board in 2021"
    detail: |
      与上交所"主板+科创板"的结构不同，深交所现行板块结构是"主板+创业板"——中小企业板已
      于2021年并入主板，不再独立存在。这是本次建档发现的一处与 cn-sse.yml 记录方式的结构性
      差异：cn-sse 的科创板（2019年设立）定位科技创新企业且保留至今，深交所的中小企业板则是
      "设立后又被撤并"的板块，历史沿革比 cn-sse 更曲折。
    sources:
      - title: SZSE English — About Overview
        url: https://www.szse.cn/English/about/overview/index.html
        accessed: 2026-08-14
    quote: "The SME Board was launched in May 2004. The ChiNext market was inaugurated in October 2009. In 2021, SZSE starts preparation for the merger between the Mainboard and the SME Board."
    confidence: medium

  organization_form:
    enum: member_owned
    zh: "会员制"
    en: "Member-owned, Self-regulated Legal Entity"
    detail: "深交所是实行自律管理的会员制法人，现有122家会员和2家特别会员，建立了会员大会、理事会、经理层、监事会「三会一层」的治理结构。与上交所同为会员制，区别于已公司化改制的北交所、纽交所、港交所等。"
    sources:
      - title: 本所简介
        url: https://www.szse.cn/aboutus/sse/introduction/index.html
        accessed: 2026-08-14
      - title: SZSE English — About Overview
        url: https://www.szse.cn/English/about/overview/index.html
        accessed: 2026-08-14
    quote: "深交所是实行自律管理的会员制法人，现有122家会员和2家特别会员"
    confidence: high

  self_listed:
    enum: "no"
    zh: "否"
    detail: "会员制法人单位，自身未上市。"
    sources:
      - title: 本所简介
        url: https://www.szse.cn/aboutus/sse/introduction/index.html
        accessed: 2026-08-14
    confidence: medium

  market_cap_usd_bn:
    zh: ""
    confidence: low
    detail: "官网市场总貌页面（market/overview）实际统计数字由前端 JS/AJAX 动态渲染，curl 抓到的静态 HTML 只有导航栏，无具体数值，未能核实，留空。该字段已不在矩阵 in_matrix 范围内（见 DECISIONS.md ADR-014），留空不影响矩阵展示。"

  listed_companies_count:
    zh: ""
    confidence: low
    detail: "同 market_cap_usd_bn，静态抓取拿不到 AJAX 渲染的统计数字，留空。"

  annual_turnover_usd_bn:
    zh: ""
    confidence: low

  global_ranking:
    zh: "2023年深市股票融资金额、成交金额、股票市价总值分别位列全球第2、第3、第6位（深交所官网现行表述，未逐年更新到最新数据）"
    detail: "官网本所简介页面这段表述截至本次抓取（2026-08-14）仍在使用2023年的排名数据，未见更新，如实按原文记录。"
    sources:
      - title: 本所简介
        url: https://www.szse.cn/aboutus/sse/introduction/index.html
        accessed: 2026-08-14
    quote: "2023年，深市股票融资金额、成交金额和股票市价总值分别位列世界第二、第三位和第六位。"
    confidence: high

  trading_currency:
    zh: "人民币（A股）；港元（B股，规模很小且趋于边缘化）"
    en: "RMB (A-shares); HKD (B-shares, small and marginal)"
    detail: "与上交所不同：SSE 的 B 股以美元计价，SZSE 的 B 股以港元计价——这是两所 B 股制度的一处具体差异。"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第3.3.11条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14
    quote: "A 股交易的申报价格最小变动单位为 0.01 元人民币；基金的申报价格最小变动单位为 0.001 元人民币；B 股的申报价格最小变动单位为 0.01 港元。"
    confidence: high

  settlement_currency: "人民币（B股为港元）"

