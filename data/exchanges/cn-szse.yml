      - title: SZSE English — Trading Overview
        url: https://www.szse.cn/English/services/trading/tradOverview/index.html
        accessed: 2026-08-14
    confidence: high

  matching_principle:
    zh: "价格优先、时间优先"
    en: "Price priority and time priority"
    quote: "证券竞价交易按价格优先、时间优先的原则撮合成交。"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第3.4.2条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14
      - title: SZSE English — Trading Overview
        url: https://www.szse.cn/English/services/trading/tradOverview/index.html
        accessed: 2026-08-14
    confidence: high

  order_types:
    zh: "限价申报；市价申报（六种类型，仅限有价格涨跌幅限制证券的连续竞价阶段）"
    en: "Limit Order; Market Order (six sub-types, continuous auction only, price-limited securities)"
    detail: "市价申报含对手方最优价格、本方最优价格、最优五档即时成交剩余撤销、即时成交剩余撤销、全额成交或撤销等类型。"
    quote: "市价申报只适用于有价格涨跌幅限制证券连续竞价期间的交易。其他交易时间，交易主机不接受市价申报。"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第3.3.3-3.3.5条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14
      - title: SZSE English — Trading Overview
        url: https://www.szse.cn/English/services/trading/tradOverview/index.html
        accessed: 2026-08-14
    confidence: high

  tick_size:
    zh: "A股 0.01 元人民币；基金 0.001 元人民币；B股 0.01 港元"
    detail: "与上交所不同：SSE 的 B 股最小变动单位为 0.001 美元，SZSE 为 0.01 港元——计价货币不同（见 overview.trading_currency）。"
    quote: "A 股交易的申报价格最小变动单位为 0.01 元人民币；基金的申报价格最小变动单位为 0.001 元人民币；B 股的申报价格最小变动单位为 0.01 港元。"
    confidence: high

  board_lot_size:
    zh: "买入须为 100 股（份）整数倍；单笔申报最大 100 万股（份）；创业板另有细分上限：限价申报单笔不超过 30 万股，市价申报单笔不超过 15 万股"
    detail: "创业板对单笔申报数量的细分上限是 SZSE 特有、SSE 现行交易规则文本中未见的额外限制，压测点之一。"
    quote: "通过竞价交易买入证券的，申报数量应当为 100 股（份）或其整数倍。／证券竞价交易单笔申报数量不得超过 100 万股（份）。创业板股票限价申报的单笔申报数量不得超过 30 万股，市价申报的单笔申报数量不得超过 15 万股。"
    confidence: high

  odd_lot_handling:
    zh: "卖出时不足 100 股的余额可一次性申报卖出"
    quote: "卖出证券时，余额不足 100 股（份）部分，应当一次性申报卖出。"
    confidence: high

  price_limits:
    type:
      enum: percentage_band
      zh: "百分比涨跌幅"
    main_board:
      zh: "±10%"
      quote: "主板股票的价格涨跌幅限制比例为 10%"
      confidence: high
    other_boards:
      zh: "创业板 ±20%；风险警示（ST/*ST）与退市整理股票 ±5%（普通标准）；无涨跌幅限制情形：新股上市后前5个交易日、重新上市首日、退市整理期首日"
      detail: |
        涨跌幅限制价格 = 前收盘价 ×（1±涨跌幅限制比例）。跟踪创业板或其他20%涨跌幅限制股票
        的指数型基金也适用20%限制。压测点：SZSE 主板 vs 创业板 与 SSE 主板 vs 科创板结构一致
        （均为10% vs 20%），两所在这一维度取值口径完全对齐。
      quote: "创业板股票的价格涨跌幅限制比例为 20%。／基金的价格涨跌幅限制比例为 10%。……价格涨跌幅限制比例为 20%。"
      confidence: high

  circuit_breaker:
    enum: none
    zh: "无指数级熔断（2016年1月8日起暂停实施）"
    en: "No index-level circuit breaker (suspended since 8 January 2016)"
    detail: |
      2015年12月本所曾在《交易规则》第四章第六节新增"指数熔断"机制（以沪深300指数为基准，
      与上交所联动），实施4个交易日后于2016年1月8日起与上交所、中金所同步暂停，此后未恢复。
      现行（2026年修订）《交易规则》全文搜索"熔断"无结果，与"已暂停且未恢复"的结论一致。
      本次会话未抓到 szse.cn 自身的暂停通知原页（WebSearch 未命中直链），退而用新浪财经转载
      的深交所通知全文作为来源——quote 摘的是被转载的官方通知原文，但因转载渠道是第三方媒体，
      confidence 依 CLAUDE.md 铁律封顶 medium，不因转载内容是官方原文而破例标高。
    sources:
      - title: 三大交易所公告确认指数熔断制度暂停实施（新浪财经，全文转载深交所2016-01-07公告）
        url: http://finance.sina.com.cn/stock/y/20160107/223324126797.shtml
