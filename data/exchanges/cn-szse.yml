    last_trading_day_rule:
      zh: "期权合约到期日为到期月份的第四个星期三（遇国家法定节假日、本所休市日顺延至次一交易日）；最后交易日与行权日同其到期日，到期日提前或顺延时随之调整；合约标的除权除息、配股缴款复牌、合约暂停交易或取消交易等情形另有专门的顺延安排，且原则上最后交易日、到期日、行权日不因该合约当日停牌/临时停牌而顺延"
      en: "An option contract's expiration date is the fourth Wednesday of the expiration month (deferred to the next trading day if that falls on a statutory holiday or an SZSE non-trading day); the last trading day and the exercise day coincide with the expiration date and move together with it; corporate actions on the underlying (ex-rights/ex-dividend, resumption after a rights-issue payment period) and contract-level trading suspensions or cancelled-trade measures trigger their own separate deferral rules, and — as a general rule — a same-day suspension or intraday halt of the contract itself does NOT defer the last trading day/expiration/exercise day"
      sources:
