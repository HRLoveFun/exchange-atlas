  membership_structure:
    zh: "会员制，现有122家会员和2家特别会员，会员大会为最高权力机关"
    en: "Member-owned; 122 members and 2 special members"
    quote: "深交所是实行自律管理的会员制法人，现有122家会员和2家特别会员"
