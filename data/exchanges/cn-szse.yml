    en: "Chapters 2 through 8 of the Stock Listing Rules set out a listed company's ongoing obligations as a package: disclosure must be timely, fair, truthful, accurate and complete; periodic reports (annual/semi-annual/quarterly) and ad hoc reports on material events must be filed on schedule; a governance structure (board secretary, independent directors, etc.) must be maintained; material transactions, changes to shares and derivative securities, and trading suspensions/resumptions must all follow the rules; and the issuer must sign a listing agreement with SZSE before listing that spells out both parties' rights and obligations"
