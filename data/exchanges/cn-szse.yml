    zh: "股票交易过户费由中国结算统一收取（不由证券公司留存），现行标准为按成交金额0.01‰双向收取（2022年4月29日起执行；此前沪深市场A股为0.02‰，北京市场A股及挂牌公司股份为0.025‰）"
    en: "The stock transfer fee is collected uniformly by ChinaClear (not retained by securities firms); the current rate is 0.01‰ of trade value, charged bilaterally, effective 29 April 2022 (previously 0.02‰ for SSE/SZSE A-shares and 0.025‰ for Beijing Stock Exchange A-shares and NEEQ-listed shares)"
    detail: "该费用是与交易所自身经手费（见 exchange_fees）平行的另一项独立费用，由中国结算这一登记结算机构收取，非深交所收取；来源为第三方媒体转载中国结算官网公告，非本次直接抓取到 chinaclear.cn 官网原始公告页，confidence 依铁律封顶 medium。"
    sources:
      - title: 4月29日起股票交易过户费总体下调50%（人民网，转载中国结算官网公告）
        url: http://finance.people.com.cn/n1/2022/0429/c1004-32411923.html
        accessed: 2026-08-24
    quote: "据中国证券登记结算有限责任公司（以下简称\"中国结算\"）网站消息，自2022年4月29日起，将股票交易过户费总体下调50%。据悉，中国结算决定将股票交易过户费由现行沪深市场A股按照成交金额0.02‰、北京市场A股和挂牌公司股份按照成交金额0.025‰双向收取，统一下调为按照成交金额0.01‰双向收取。……交易过户费为中国结算收费，证券经营机构不予留存。"
    confidence: medium

  regulatory_fees:
    zh: ""
    confidence: low
    detail: "未核实到深交所或中国证监会体系下、独立于交易所经手费（exchange_fees）与清算过户费（clearing_fees）之外、以「监管费」命名且现行有效征收的费用项目。历史上曾存在「证券监管费」（证管费）项目，本次会话未能确认其当前是否仍在征收及现行费率，留空并转 OPEN-QUESTIONS，不排除中国大陆现行收费体系确实不单列此类费用（与 CLAUDE.md 任务说明的预期一致）。"

  stamp_duty:
    spec: {rate: 0.5, unit: permille, side: sell, note: "2023-08-28 起减半（此前单边 1‰）"}
    zh: "0.05%（单边，卖方缴纳）"
    en: "0.05% (one-sided, paid by the seller)"
    detail: |
      2023年8月28日起，证券交易印花税由此前的单边1‰减半下调至单边0.5‰，仅对卖方征收。
      印花税是全国统一税率的国家税种，非交易所自定，深交所与上交所适用同一税率——本条与
      cn-sse.yml 引用同一篇报道确认同一政策，信息来自新闻媒体对财政部、税务总局公告的转载，
      非财政部官方公告原页，confidence 标 medium。
    sources:
      - title: 证券交易印花税8月28日起实施减半征收（人民网）
        url: http://finance.people.com.cn/n1/2023/0828/c1004-40065300.html
        accessed: 2026-08-14
    quote: "据财政部、税务总局公告，为活跃资本市场、提振投资者信心，自2023年8月28日起，证券交易印花税实施减半征收。……证券交易印花税由单边征收1‰下调至0.5‰"
    confidence: medium

  financial_transaction_tax:
    spec: {rate: null, note: "未找到明确不征依据：本字段无独立来源（复用 stamp_duty 的同一篇报道作背景），原 detail 自述结论为「检索未发现」的推断；见 OPEN-QUESTIONS"}
    zh: "本次会话未见独立于证券交易印花税（见 stamp_duty 字段）之外、以「金融交易税」单独命名的税种；中国大陆对证券交易征收的国家层面税收目前以证券交易印花税（单边0.05%，卖方缴纳）为主体。按 CLAUDE.md 第二节第四条，「检索未发现」不等于「明确不征」，故 spec 记为 rate: null（幽灵条）而非 type: none，并转 OPEN-QUESTIONS"
    en: "This session found no tax separately labelled a 'financial transaction tax' distinct from the securities transaction stamp duty (see stamp_duty); mainland China's national-level tax on securities trading is currently, in substance, the stamp duty alone (0.05%, one-sided, paid by the seller). Per the CLAUDE.md anti-hallucination rules, 'not found by search' is not proof of non-levy, so the spec is recorded as rate: null (ghost bar) rather than type: none and referred to OPEN-QUESTIONS"
    confidence: low
    detail: "本条为基于已核实的 stamp_duty 字段与本次检索未发现另一独立税种的推断说明，非独立数据来源；sources 复用 stamp_duty 字段的同一篇报道，作为「现行税种即印花税」这一判断的背景支撑，而非本字段本身的直接出处。"
    sources:
      - title: 证券交易印花税8月28日起实施减半征收（人民网）
        url: http://finance.people.com.cn/n1/2023/0828/c1004-40065300.html
        accessed: 2026-08-14

  capital_gains_tax:
    zh: "境内个人投资者转让境内上市公司股票所得，自1997年1月1日起持续暂免征收个人所得税，该项豁免延续至今未见废止；境内企业投资者的股票转让所得则依法计入企业应纳税所得额，按企业所得税相关规定征收（一般规定，本次未就上市公司股票转让单独核实企业所得税税率或优惠安排）"
    en: "Gains that domestic individual investors realize from transferring shares of domestic listed companies have been exempt from individual income tax on a continuing basis since 1 January 1997, and this exemption remains in force with no repeal found; gains realized by domestic corporate investors, by contrast, are included in taxable corporate income and taxed under the ordinary corporate income tax rules (general principle only — this session did not separately verify any listed-share-specific corporate tax rate or preferential treatment)"
    sources:
      - title: 财政部 国家税务总局关于个人转让股票所得继续暂免征收个人所得税的通知（财税字〔1998〕61号，1997年1月1日起施行；国家税务总局广东省税务局官网转发，标注来源为国家税务总局）
        url: https://guangdong.chinatax.gov.cn/gdsw/grsdsgg_hmqsc_pyzbsc_ssgs/2021-08/31/content_0515931e3f044baf9a26bbe53e85eb38.shtml
        accessed: 2026-08-24
    quote: "为了配合企业改制，促进股票市场的稳健发展，经报国务院批准，从1997年1月1日起，对个人转让上市公司股票取得的所得继续暂免征收个人所得税。"
    confidence: high

  dividend_withholding_tax:
    zh: "个人投资者持有上市公司股票的股息红利所得实行持股期限差别化征税：持股1个月以内（含）全额计入应纳税所得额；1个月以上至1年（含）暂减按50%计入；持股超过1年暂免征收个人所得税；应纳部分统一按20%税率计征，由证券登记结算公司根据持股期限计算并代扣代缴"
    en: "Individual investors' dividend income on listed-company shares is taxed on a holding-period-differentiated basis: for shares held 1 month or less, dividend income is included in taxable income in full; for shares held more than 1 month up to 1 year, only 50% is included; for shares held over 1 year, dividend income is exempt from individual income tax; where tax is due it is levied at a flat 20% rate, calculated by holding period and withheld by the securities depository and clearing corporation"
    sources:
      - title: 财政部 国家税务总局 证监会关于上市公司股息红利差别化个人所得税政策有关问题的通知（财税〔2015〕101号，通知抬头列明直接下发对象含"上海、深圳证券交易所"）
        url: https://www.chinatax.gov.cn/n810341/n810755/c1797427/content.html
        accessed: 2026-08-24
    quote: "一、个人从公开发行和转让市场取得的上市公司股票，持股期限超过1年的，股息红利所得暂免征收个人所得税。个人从公开发行和转让市场取得的上市公司股票，持股期限在1个月以内（含1个月）的，其股息红利所得全额计入应纳税所得额；持股期限在1个月以上至1年（含1年）的，暂减按50%计入应纳税所得额；上述所得统一适用20%的税率计征个人所得税。二、上市公司派发股息红利时，对个人持股1年以内（含1年）的，上市公司暂不扣缴个人所得税；待个人转让股票时，证券登记结算公司根据其持股期限计算应纳税额……"
    confidence: high

  implicit_costs_note:
    zh: "隐性成本主要体现为买卖价差与冲击成本：A股最小报价单位0.01元人民币、基金0.001元人民币（见 market_structure.tick_size），涨跌幅限制（主板±10%/创业板±20%）与临时停牌机制客观上约束了单日价格冲击的上限，但本次未见官方就买卖价差、冲击成本的独立统计披露"
    en: "Implicit costs chiefly take the form of the bid-ask spread and market-impact cost: the tick size is RMB 0.01 for A-shares and RMB 0.001 for funds (see market_structure.tick_size), and the price-limit bands (±10% Main Board / ±20% ChiNext) plus the trading-halt mechanism objectively cap the ceiling on same-day price impact, though this session found no official standalone statistics on bid-ask spreads or impact cost"
    confidence: low
    detail: "本条为基于已核实的 market_structure.tick_size / price_limits 等结构性字段的推断说明，非独立数据来源；sources 复用支撑 tick_size/price_limits 两个字段的同一份交易规则，作为背景支撑，而非本字段本身的直接出处。"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第3.3.11条、第4.3.1-4.3.3条
        url: https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf
        accessed: 2026-08-14

