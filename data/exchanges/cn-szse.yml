  trading_sessions:
    pre_market: "无独立盘前时段；9:15-9:25 为开盘集合竞价"
    continuous_am: "9:30-11:30"
    lunch_break: "11:30-13:00"
    continuous_pm:
      zh: "13:00-15:00（13:00-14:57 连续竞价 + 14:57-15:00 收盘集合竞价）"
      quote: "9:30 至 11:30、13:00 至 14:57 为连续竞价时间，14:57 至 15:00 为收盘集合竞价时间。"
    after_market:
      zh: "盘后固定价格交易，15:05-15:30，按当日收盘价成交；适用范围为 A 股与交易型开放式基金（ETF），不限于特定板块"
      detail: "与上交所不同：SSE 的盘后固定价格交易仅限科创板股票，SZSE 的这项机制覆盖全市场 A 股和 ETF，不分板块——这是两所交易机制的一处具体差异。"
      quote: "投资者可以通过盘后固定价格交易方式买卖 A 股、交易型开放式基金。……每个交易日的 15:05 至 15:30 为盘后固定价格交易时间。"
      confidence: high
    night_session: "无"

  holidays_note:
    zh: "每周一至周五交易，国家法定假日及本所公告的休市日休市"
    quote: "本所交易日为每周一至周五。国家法定假日和本所公告的休市日，本所市场休市。"

  opening_mechanism:
    zh: "开盘集合竞价（9:15-9:25）"
    en: "Opening Call Auction (9:15-9:25)"
    quote: "证券采用竞价交易方式的，每个交易日的 9:15 至 9:25 为开盘集合竞价时间"
    sources:
      - title: 深圳证券交易所交易规则（2026年修订）第2.3.2条
