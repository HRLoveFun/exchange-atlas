  broker_landscape:
    zh: "深交所自身层面：现有122家会员及2家特别会员，均为持牌证券/期货类经营机构（见 membership_structure）。全国行业层面（非深交所专属统计）：第三方行业报告显示截至2022年末全国证券公司约140家，行业集中度（CR4）约42%，中信证券、国泰君安、广发证券、海通证券等头部公司资产规模领先"
    en: "At the SZSE level: 122 members plus 2 special members, all licensed securities/futures firms (see membership_structure). At the national industry level (not an SZSE-specific figure): third-party industry research put the number of Chinese securities firms at roughly 140 as of end-2022, with industry concentration (CR4) around 42%, led by firms such as CITIC Securities, Guotai Junan, GF Securities and Haitong Securities by asset size"
    detail: "未核实到深交所经纪业务市场份额的交易所层面独立统计（如「深市成交额前十大会员占比」），本条只能以深交所自身会员总数（一手来源）搭配全国证券业协会/行业研究机构的全国口径集中度数据（第三方）合成，两段口径不同，读者不应将全国集中度数字误认为深市专属数据。"
