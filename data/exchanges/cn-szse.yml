    quote: "在本所仅发行A股股票或者既发行A股又发行B股股票的公司，连续二十个交易日在本所的股票收盘总市值均低于5亿元……公司连续二十个交易日股东人数均少于2000人……最近一个会计年度经审计的利润总额、净利润、扣除非经常性损益后的净利润三者孰低为负值，且扣除后的营业收入低于3亿元。（创业板对照条款：连续二十个交易日的股票收盘市值均低于3亿元；连续二十个交易日的公司股东人数均少于400人）"
