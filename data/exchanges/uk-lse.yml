  fx_risk_note:
    zh: "英镑为自由浮动货币、英国无资本管制：1979-10-23 财政大臣 Geoffrey Howe 在下议院宣布自当日午夜起撤销全部剩余外汇管制（官方议会记录原文；原句末尾附有罗得西亚相关例外的但书，与 capital_controls 字段口径一致），英国投资者的跨境证券投资与外汇兑换自此不受管制；对非英镑投资者的 LSE 上市证券持仓而言，汇率风险来自其本币兑英镑的波动，无官方对冲安排或管制缓冲"
    en: "Sterling floats freely and the UK has no capital controls: on 23 October 1979 Chancellor Geoffrey Howe announced in the Commons the removal of all remaining exchange control restrictions from midnight that night (official Hansard record; the original sentence carries a caveat for Rhodesia-related restrictions, consistent with the capital_controls field) — since then UK cross-border portfolio investment and FX conversion are uncontrolled; for non-GBP investors holding LSE-listed securities, FX risk arises from their home currency's fluctuation against sterling, with no official hedging arrangement or control buffer"
    sources:
      - title: "EXCHANGE CONTROLS, HC Deb 23 October 1979 vol 972 cc202-14（英国议会官方 Hansard 记录，外汇管制全面撤销的一手原文）"
        url: https://api.parliament.uk/historic-hansard/commons/1979/oct/23/exchange-controls
        accessed: 2026-09-05
    quote: "I have now decided to remove all the remaining exchange control restrictions from midnight tonight"
    confidence: medium

  political_risk_note:
    zh: "英国对俄制裁曾直接导致LSE按自身规则暂停特定证券交易：2022年3月3日，交易所依《伦敦证券交易所规则》第1510条，援引「俄乌事件相关制裁、市场状况恶化、维护市场平稳运行」为由，即时暂停约20只俄罗斯公司GDR/ADR（含Gazprom、Lukoil、Novatek、Norilsk Nickel、PhosAgro等）的交易准入，是地缘政治/制裁风险直接作用于LSE挂牌证券交易资格的一手实证"
    en: "UK sanctions on Russia have directly led LSE to suspend specific securities under its own rules: on 3 March 2022, citing 'recent sanctions in connection with events in Ukraine, in light of market conditions, and in order to maintain orderly markets', the Exchange suspended admission to trading, with immediate effect, of roughly 20 Russian companies' GDRs/ADRs (including Gazprom, Lukoil, Novatek, Norilsk Nickel and PhosAgro) under Rule 1510 of the Rules of the London Stock Exchange — direct primary evidence of geopolitical/sanctions risk acting on LSE-listed trading eligibility"
    detail: |
      该Market Notice（N06/22）是LSE自身发布、经FCA National Storage Mechanism officially
      存档的一手公告，非新闻媒体转述；FCA同期亦发布声明提醒受监管机构与发行人注意俄乌局势
      下的制裁义务。该批暂停证券此后长期未恢复交易（未在本次抓取范围内核实后续状态），
      反映此类政治/制裁风险一旦触发，对具体证券的交易资格影响可能是长期而非临时性的。
    sources:
      - title: N06/22 - Russia related sanctions - Update（LSE Market Notice，经FCA National Storage Mechanism存档）
        url: https://data.fca.org.uk/artefacts/NSM/RNS/4290415.html
        accessed: 2026-08-24
      - title: New financial sanctions measures in relation to Russia（FCA官网声明）
        url: https://www.fca.org.uk/news/statements/new-financial-sanctions-measures-relation-russia
        accessed: 2026-08-24
    quote: "3 March 2022 N06/22 - Russia related sanctions - Update／Further to recent sanctions in connection with events in Ukraine, in light of market conditions, and in order to maintain orderly markets, the London Stock Exchange (the \"Exchange\") has suspended the admission to trading of the instruments listed below, in accordance with Rule 1510 of the Rules of the London Stock Exchange, with immediate effect."
    verified: 2026-08-24
    confidence: high

  liquidity_risk_note:
    zh: "LSE现货市场的流动性风险呈明显分层：主板核心蓝筹（如富时100成分股，属最高流动性梯队FE10）采用较窄的价格监控阈值（动态3%），流动性次一级的梯队（如FS10）阈值放宽至5%，反映交易所自身在制度设计上已确认不同证券的流动性/波动特征存在数量级差异（见price_limits.main_board）；订单驱动品种以外，流动性较低的品种（含部分AIM证券）改用报价驱动的SETSqx机制、依赖注册做市商的确定报价（Firm Quotes）维持可交易性，而非依赖自然订单簿深度（见market_maker_scheme）——两种机制并存本身即是「部分证券依赖做市商托底流动性」的结构性证据"
    en: "Liquidity risk on LSE's cash markets is clearly tiered: the most liquid segment (e.g. FTSE 100 constituents, LSE sector FE10) uses a narrower dynamic price-monitoring threshold (3%), while a less liquid tier (e.g. FS10) uses a wider 5% threshold — the Exchange's own rule design already reflects an order-of-magnitude difference in liquidity/volatility characteristics across securities (see price_limits.main_board). Beyond order-driven instruments, less liquid names (including some AIM securities) instead use the quote-driven SETSqx mechanism, relying on registered market makers' Firm Quotes to sustain tradability rather than natural order-book depth (see market_maker_scheme) — the coexistence of the two mechanisms is itself structural evidence that liquidity for some securities depends on market-maker backstops"
    detail: |
      本字段是对已有sourced字段（market_structure.price_limits、market_structure.
      market_maker_scheme）的跨字段归纳分析，不重复摘引其quote（原文锚点留在各自字段，
      遵循CLAUDE.md"任何一个事实只在一处手写"原则），故不单列quote、confidence降级为
      medium。真正意义上的"流动性风险"（如某证券可能连续数日零成交、买卖盘长期缺失一侧）
      需要实际成交统计数据而非规则文本佐证，本次未纳入抓取范围。
    sources:
      - title: Maintaining orderly markets（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/maintaining-orderly-markets.pdf
        accessed: 2026-08-14
      - title: MIT201 – Guide to the Trading System Issue 15.8（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
        accessed: 2026-08-14
    verified: 2026-08-24
    confidence: medium

  regulatory_change_risk_note:
    zh: "压测点核心字段——英国脱欧后正处于持续的监管框架重构期，三条并行证据：(1) 2024年7月UKLR改革以单一“股票证券（商业公司）”类别取代此前承接自欧盟体系的Premium/Standard两级上市架构；(2) 2026年7月13日起，SSR 2025正式取代此前“承接”的欧盟《卖空条例》(EU) No 236/2012；(3) 英国计划于2027年10月11日整体切换至T+1结算周期（现行仍为T+2），与欧盟是否/何时跟进尚不同步。三条改革叠加意味着填写本文件时必须持续关注“规则是否已生效”而非套用脱欧前的欧盟框架惯例"
    en: "Core stress-test field — post-Brexit, the UK is in a sustained period of regulatory reconstruction, evidenced by three parallel threads: (1) the July 2024 UKLR reform replaced the previously EU-derived two-tier Premium/Standard listing structure with a single 'equity shares (commercial companies)' category; (2) from 13 July 2026, SSR 2025 formally replaced the previously-assimilated EU Short Selling Regulation (EU) No 236/2012; (3) the UK plans a market-wide move to T+1 settlement on 11 October 2027 (currently still T+2), not necessarily synchronised with if/when the EU follows. Together these mean data in this file must be checked against 'has this rule actually taken effect' rather than assumed to follow pre-Brexit EU-framework conventions"
    detail: |
      三条证据分别来自 listing.review_system（UKLR quote）、market_structure.short_selling
      （SSR quote）、clearing.settlement_cycle（T+1 quote）三个字段，此处汇总不重复摘录quote，
      避免同一原文在文件内出现两次——按CLAUDE.md"任何一个事实只在一处手写"的原则，quote
      锚点留在各自字段，这里只做跨字段的综合归纳（属于detail的归纳改写，不是quote）。
    sources:
      - title: UKLR UK Listing Rules sourcebook（FCA Handbook）
        url: https://api-handbook.fca.org.uk/files/sourcebook/UKLR.pdf
        accessed: 2026-08-14
      - title: Short selling（FCA官网）
        url: https://www.fca.org.uk/markets/short-selling
        accessed: 2026-08-14
      - title: About T+1 settlement（FCA官网）
        url: https://www.fca.org.uk/markets/about-t1-settlement
        accessed: 2026-08-14
    confidence: medium

  enforcement_note:
    zh: "英国市场滥用监管框架（UK MAR）——2016年7月生效的欧盟《市场滥用条例》经2020年12月31日「内化」（onshored）为英国国内法后持续演进（2021年《金融服务法》就董事内部人名单/管理层交易另有修订）。内幕交易、非法披露、市场操纵及操纵未遂构成UK MAR下的民事违规，FCA可处以无上限罚款、责令禁令、禁止相关机构/获批人员从业；刑事层面，内幕交易依《1993年刑事司法法》第五编、市场操纵依《2012年金融服务法》第89-91条定罪，最高可判10年监禁并处无上限罚金"
    en: "The UK Market Abuse Regulation (UK MAR) regime — the EU Market Abuse Regulation, effective 3 July 2016, was onshored into UK domestic law on 31 December 2020 and has continued to evolve (e.g. amendments on insider lists and managers' transactions under the Financial Services Act 2021). Insider dealing, unlawful disclosure, market manipulation and attempted manipulation are civil offences under UK MAR, for which the FCA can impose unlimited fines, order injunctions, and prohibit firms or approved persons from operating; criminally, insider dealing is an offence under Part V of the Criminal Justice Act 1993 and market manipulation under sections 89-91 of the Financial Services Act 2012, carrying custodial sentences of up to 10 years plus unlimited fines"
    detail: |
      与risks.investor_protection（FSCS对投资中介倒闭的事后补偿）是不同角度：本字段
      聚焦"市场公平性/操纵行为"的监管执法体系，FSCS聚焦"机构倒闭"的投资者事后救济，
      两者互补、不合并。UK MAR适用于LSE等全部英国交易场所，非LSE专属规则，但FCA的
      监测手段明确包含对交易场所提交的可疑交易与订单报告（STOR）的分析，与本文件
      regulation.self_regulatory_org记录的"交易所自身一线监管+FCA监管官方名册"分工
      相互印证。
    sources:
      - title: Market abuse（FCA官网）
        url: https://www.fca.org.uk/markets/market-abuse
        accessed: 2026-08-24
    quote: "Market Abuse Regulation (MAR) The EU Market Abuse Regulation (EU MAR) came into effect on 3 July 2016 and was onshored into UK law on 31 December 2020 by the EU (Withdrawal) Act 2018.／The following are civil offences under UK MAR: Insider dealing. Unlawful disclosure. Market manipulation. Attempted manipulation.／Criminal insider dealing is an offence under Part V of the Criminal Justice Act 1993. Criminal market manipulation is an offence under sections 89 to 91 of the Financial Services Act 2012.／For breaches of UK MAR we can: Impose unlimited fines. Order injunctions. Prohibit regulated firms or approved persons. Criminal sanctions for insider dealing and market manipulation can incur custodial sentences of up to 10 years and unlimited fines."
    verified: 2026-08-24
    confidence: high
