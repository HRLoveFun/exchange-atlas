    quote: "Circuit breakers are tools that temporarily halt trading activity or delay an auction execution if certain price movement tolerances would be breached. Following the halt, the affected security will be placed into auction allowing a price to be formed in an orderly fashion... Note that each auction and extension is followed by a random period of up to 30 seconds."
