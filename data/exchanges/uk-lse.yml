    quote: "The obligations of market makers in order-driven securities section (rules 4100-4110.6) covers trading services SETS, IOB, securitised derivatives and order book for fixed income securities where registered market makers use Executable Quotes (EQ) to display their quote. The obligations of market makers in quote driven securities section (rules 4200 – 4334.3) covers trading services SETSqx, SEAQ and European Quoting Service where registered market makers use firm quotes to display their quote."
