  price_limits:
    type:
      enum: dynamic_reference
      zh: "非固定百分比涨跌停板，而是逐证券（security-by-security）的价格监控机制——静态价格监控（相对开盘集合竞价价格的偏离阈值）与动态价格监控（相对最近成交价的偏离阈值）触发后，转入波动性拍卖重新形成价格，而非直接停牌"
      en: "Not a fixed percentage limit-up/limit-down band; instead a security-by-security price monitoring mechanism — static price monitoring (deviation from the opening auction price) and dynamic price monitoring (deviation from the last traded price) trigger a volatility auction to re-form the price, rather than a straight halt"
      sources:
        - title: Maintaining orderly markets（官网）
          url: https://docs.londonstockexchange.com/sites/default/files/documents/maintaining-orderly-markets.pdf
          accessed: 2026-08-14
      quote: "Not all circuit breakers work the same way. In the US, market-wide circuit breakers enforce a trading pause for all stocks for 15 minutes. London Stock Exchange's price monitoring functionality is constantly evolving to respond to clients' changing needs and instead, employs a security-by-security price monitoring mechanism."
      confidence: high
    main_board:
      zh: "以富时100成分股为例：静态价格监控阈值8%（相对上一次集合竞价成交价），动态价格监控阈值3%（相对最近成交价，触发5分钟波动性拍卖，含最多一次2分钟市价订单延期）；次一流动性梯队（如LSE行业分类FS10）静态阈值10%、动态阈值5%；富时100盘中/收盘/EDSP拍卖的动态阈值比常规交易更紧（FE10为1%，FS10为3%）"
      en: "For FTSE 100 constituents: static price monitoring threshold 8% (vs. last auction uncrossing price), dynamic threshold 3% (vs. last traded price, triggering a 5-minute volatility auction with up to one 2-minute Market Order extension); the next liquidity tier (e.g. LSE sector FS10) uses 10% static / 5% dynamic; FTSE 100 intraday/closing/EDSP auctions use tighter dynamic thresholds than regular trading (1% for FE10, 3% for FS10)"
      sources:
        - title: Maintaining orderly markets（官网）
          url: https://docs.londonstockexchange.com/sites/default/files/documents/maintaining-orderly-markets.pdf
          accessed: 2026-08-14
      quote: "For the most liquid stocks in the FTSE 100 stocks (e.g. London Stock Exchange sector FE10): – An 8% (Static Price Monitoring %) move from the last auction uncross... would cause a Static Limit volatility auction with 5-minute duration... – Any single order which moves market 3% (Dynamic Price Monitoring %) from last order book traded price would cause a volatility auction of 5-minute duration... For the next most liquid stocks in the FTSE 100 (e.g. London Stock Exchange sector FS10), the Static Price Monitoring % is 10%, and the Dynamic Price Monitoring % is 5%."
      confidence: high
