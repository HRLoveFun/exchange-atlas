  self_listed:
    enum: partial
    zh: "2001年7月LSE本身曾作为独立公众公司在自己市场挂牌；2007年10月与Borsa Italiana合并组成LSEG集团后，当前的挂牌主体是集团控股公司London Stock Exchange Group plc（LSEG plc），而非“伦敦证券交易所”这一运营法人实体本身"
    en: "London Stock Exchange itself listed on its own market in July 2001; following the October 2007 merger with Borsa Italiana that formed LSEG, the entity currently listed is the group holding company, London Stock Exchange Group plc, rather than the operating exchange entity itself"
    detail: |
      与 NYSE（现为 ICE 全资子公司，挂牌的是母公司 ICE）是同一种结构性情况：本次抓取的
      LSEG历史页明确了2001年自身上市与2007年合并组建集团两个节点，但未找到LSEG plc当前
      在自身主板具体上市板块/股票代码的独立官方原文（本次会话未专门核实这一点，2025年度
      初步业绩公告 RNS 以每股便士（p）计的每股收益/股息等数据佐证其为公开挂牌公司，但不构成
      对"在LSE主板挂牌"这一具体事实的直接原文引用），故 confidence 标 medium 而非 high，
      与 NYSE 的处理方式一致。
    sources:
      - title: The history of LSEG（官网）
        url: https://www.lseg.com/en/about-us/history
        accessed: 2026-08-14
    quote: "July 2001\nLondon Stock Exchange becomes a public company listed on its own market.\nOctober 2007\nLondon Stock Exchange and Borsa Italiana merge, creating London Stock Exchange Group (LSEG)."
    confidence: medium

