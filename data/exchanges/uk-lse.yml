    zh: "分订单驱动与报价驱动两套做市商制度：SETS/IOB/证券化衍生品/固定收益订单簿等订单驱动品种，注册做市商以可执行报价（Executable Quotes）参与；SETSqx/SEAQ/欧洲报价服务等报价驱动品种，注册做市商以非电子可执行的确定报价（Firm Quotes）参与，且仅具备中央对手方清算资格的会员机构方可注册为报价驱动品种做市商"
    en: "Two parallel market maker regimes: order-driven instruments (SETS, IOB, securitised derivatives, fixed income order book) use registered market makers quoting Executable Quotes; quote-driven instruments (SETSqx, SEAQ, European Quoting Service) use registered market makers providing non-electronically-executable Firm Quotes, and only member firms with central counterparty clearing capability may register as quote-driven market makers"
