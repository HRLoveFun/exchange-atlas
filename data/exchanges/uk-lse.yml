    zh: "披露为本，2024年7月UKLR改革后以单一“股票证券（商业公司）”类别取代此前Premium/Standard两级架构；申请人须在多类触发事件（如须发布招股说明书、反向收购通函等）委任一名保荐人（Sponsor）向FCA确认其符合UKLR相关要求"
    en: "Disclosure-based; following the July 2024 UKLR reform, a single 'equity shares (commercial companies)' category replaced the previous two-tier Premium/Standard structure. Issuers must appoint a Sponsor on multiple trigger events (e.g. when a prospectus or reverse-takeover circular is required) to confirm compliance with the relevant UKLR requirements to the FCA"
