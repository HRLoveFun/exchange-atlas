    en: "Uses the UK's assimilated EU harmonised tick-size technical standard (retained in UK law after Brexit): the minimum price increment is obtained from a two-dimensional table indexed by the security's price band and by its average daily number of transactions — the higher the price and the lower the liquidity, the coarser the tick; exchange-traded funds use a single (most-liquid) liquidity band"
