  listing_process_duration:
    zh: "本字段仅指规则本身设定的最短提前通知期，非企业筹备上市全过程的市场惯例周期（后者本次未找到官方原文，未纳入）。AIM：申请人须在预期挂牌日至少10个工作日前提交Schedule One信息（「合资格投资者」申请人为至少20个工作日前），至少3个工作日前提交完整申请表与电子版挂牌文件；主板（Official List）：FCA要求申请人最迟于FCA审议该申请之日的中午前2个工作日，提交申请人基本信息、证券信息、董事联系方式确认等材料"
    en: "This field captures only the minimum advance-notice periods fixed by the rules themselves, not the market-practice duration of a company's full IPO preparation (no citable primary source for the latter was found this session). AIM: an applicant must provide Schedule One information at least 10 business days before the expected admission date (20 business days for a 'quoted applicant'), and submit the completed application form and electronic admission document at least 3 business days before the expected admission date. Main Market (Official List): the FCA requires applicants to submit specified applicant/security information and director contact confirmations by midday 2 business days before the FCA is to consider the application"
    detail: |
      两套规则的性质不同：AIM的10/20个工作日窗口是给交易所/提名顾问（Nomad）预留的信息审查期，
      主板的"2个工作日"则是FCA就单次审议会议要求的最终材料截止时点，二者不是同一维度的
      "流程周期"，不能直接横向相加或比较。真实的企业上市全流程（从决定上市到挂牌交易）
      通常以数月计（涉及尽职调查、招股说明书/AIM挂牌文件编制、路演等），但这部分周期没有
      监管规则强制规定的固定天数，本次未找到LSE/FCA官方原文对此给出具体周数或月数的正式
      声明，故不采纳网络流传的"5周"之类说法，只记录规则条文本身明确写出的最短提前期。
      AIM Rules原文将"十/二十/三个工作日"拼写为英文单词（ten/twenty/three）而非阿拉伯数字，
      zh/en字段里的"10/20/3"是转写自单词的阿拉伯数字（内容真实、逐字对应，只是数字书写
      形式不同），为避免`validate.py`反查规则误判成"数字对不上"，confidence如实降一档标
      medium，而非勉强找无关文字凑数字。
    sources:
      - title: AIM Rules for Companies（官网，Rule 2/Rule 5）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/AIM%20Rules%20for%20Companies%20-%20January%202026.pdf
        accessed: 2026-08-24
      - title: UKLR UK Listing Rules sourcebook（FCA Handbook，UKLR 20.2.2R）
        url: https://api-handbook.fca.org.uk/files/sourcebook/UKLR.pdf
        accessed: 2026-08-24
    quote: |
      An applicant must provide the Exchange, at least ten business days before the expected date of admission to AIM, with the information specified by Schedule One. A quoted applicant must provide the Exchange, at least twenty business days before the expected date of admission to AIM, with the information specified in Schedule One and its supplement.／At least three business days before the expected date of admission, an applicant must submit to the Exchange a completed application form and an electronic version of its admission document.／An applicant must apply to the FCA for admission to listing by: (1A) submitting to the FCA by midday 2 business days before the FCA is to consider the application: (a) the following information in respect of the applicant... (c) the following information in respect of the admission to listing: (i) the date for the application for admission to be considered; and (ii) the expected admission date
    verified: 2026-08-24
