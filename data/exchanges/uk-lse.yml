        - {order: 6, resource: "服务连续性阶段的损失分摊（Loss Distribution）", bearer: surviving_members}
        - {order: 7, resource: "自愿服务连续性", bearer: surviving_members}
        - {order: 8, resource: "EquityClear 服务关闭（最终手段）", bearer: surviving_members}
      note: "EquityClear 业务线专属瀑布；LCH Ltd 四条业务线各自独立的违约基金与自有资本额度、互不交叉污染（见 detail）。spec 不存各层金额"
    zh: "LCH Ltd（本所CCP，见ccp_name）对EquityClear（证券清算业务线）设有分层「违约处置瀑布」（Default Waterfall）：违约会员自身的初始保证金/追加保证金等各类保证金及其违约基金出资首先被吸收→LCH LTD自有资本出资（「风险共担」，截至2024年10月末为€1.6百万，四条业务线中最低，与EquityClear业务线整体风险规模匹配）→非违约会员对EquityClear违约基金的出资（截至2024年10月末规模£155百万，可通过「追加缴款」Assessment进一步补充）→服务连续性阶段的损失分摊（Loss Distribution）→自愿服务连续性→EquityClear服务关闭（最终手段）。LCH LTD截至2024年10月31日持有的保证金抵押品市值合计€288十亿"
    en: "LCH Ltd (this Exchange's CCP, see ccp_name) operates a tiered Default Waterfall for its EquityClear (securities clearing) service line: the defaulting member's own margin (initial, variation, delivery and additional margins) and its default fund contribution are absorbed first, then LCH LTD's own capital ('skin in the game', €1.6mn as of end-October 2024 — the smallest of the four service lines, scaled to EquityClear's relative risk size), then non-defaulting members' EquityClear default fund contributions (£155mn as of end-October 2024, further replenishable via callable 'Assessments'), then loss distribution during the service continuity phase, then voluntary service continuity, and finally EquityClear service closure as a last resort. LCH LTD held margin collateral with a total market value of €288bn as of 31 October 2024"
    detail: |
      LCH LTD同时为ForexClear（外汇）、Rates Derivatives（利率衍生品）、EquityClear（证券）、
      RepoClear（回购）四条业务线分别设立独立的违约基金与自有资本出资额度，不同业务线之间
      风险不交叉污染——EquityClear的€1.6mn LCH自有资本出资与£155mn违约基金规模，相较
      Rates Derivatives（€61.9mn资本/£6,014mn基金）小得多，反映证券现货清算相对利率衍生品
      清算的风险敞口更低。术语译法见schema/glossary.yml新增`default-waterfall`条目。本字段
      的信息来源是一份"瀑布流程图"型PDF而非叙述性条文，摘引的quote由图中各阶段标签与脚注
      文字按图示顺序拼接而成，非重新组织的转述。
    sources:
