  trading_halt_mechanism:
    zh: "两套并行机制：(1) FCA可依UKLR暂停/取消证券上市（如未达持续义务、市场平稳运行受威胁等，暂停满6个月须与FCA讨论是否取消上市）；(2) 交易所自身的技术性市场干预（Service Interruptions Protocol）——因系统故障等严重事件，可对受影响证券实施Halt（禁止新订单但可撤单）、Suspension（订单簿冻结，禁止新增和撤销）或Halt and Close（当日不再恢复交易，直接设定收盘价）三种状态之一"
    en: "Two parallel mechanisms: (1) the FCA may suspend/cancel a listing under UKLR (e.g. failure to meet continuing obligations, threat to orderly market operation; after 6 months of suspension the issuer must discuss cancellation with the FCA); (2) the Exchange's own technical market interventions under its Service Interruptions Protocol — for major system outages, affected securities may be placed into Halt (no new orders, deletions allowed), Market/Partition Suspension (order book frozen, no new orders or deletions) or Halt and Close (trading will not resume that day; a closing price is set)"
    sources:
      - title: UKLR UK Listing Rules sourcebook（FCA Handbook）
        url: https://api-handbook.fca.org.uk/files/sourcebook/UKLR.pdf
        accessed: 2026-08-14
      - title: MIT201 – Guide to the Trading System Issue 15.8（官网，第11章）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
        accessed: 2026-08-14
    quote: "11.4.1 Halt / If London Stock Exchange specifically wishes to prevent further order entry, then it will place the market in a Halt state, which does not allow the entry of new orders... 11.4.2 Market/Partition Suspension... 11.4.3 Halt and Close / This state will be used if London Stock Exchange concludes that there is no prospect of trading resuming on the trading day of the outage."
    confidence: high

