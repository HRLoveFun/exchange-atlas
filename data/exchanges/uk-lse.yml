    en: "Price priority (Millennium Exchange operates on a price priority basis); at the same price, displayed order portions take precedence over non-displayed portions (iceberg non-display > fully hidden orders > mid-price pegged orders), each category then time-prioritised except for the non-displayed iceberg portion"
    sources:
