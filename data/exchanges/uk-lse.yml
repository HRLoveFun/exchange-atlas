    en: "Limit Order, Market Order (unpriced, has price priority over all priced orders), Stop / Stop Limit Order, Iceberg Order (displays only a portion of total volume), Hidden Limit Order (non-displayed), Mid-Price Pegged Order (executes only at the mid BID/OFFER price during regular trading)"
