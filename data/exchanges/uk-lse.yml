    en: "Ongoing disclosure obligations are set out in the Disclosure Guidance and Transparency Rules sourcebook (DTR), a separate FCA Handbook module alongside UKLR"
    detail: "具体披露频率/语言/渠道等细节本次未逐条核实DTR原文，只确认了该规则手册的存在与地位。"
