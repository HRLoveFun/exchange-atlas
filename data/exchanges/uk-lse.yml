  delisting_process:
    zh: "取消上市（除牌）双向程序（UKLR 21）：① FCA 强制取消——FCA 认为存在妨碍正常有序交易的特别情形时可取消上市（如证券不再按规则获准交易、发行人不再满足持续义务如公众持股比例低于 10%、停牌超过 6 个月等）；② 发行人主动申请——须书面提出并载明证券详情、背景与理由、拟生效日期等要素，并按 UKLR 21.2.8R 出具股东决议等证明文件"
    en: "Cancellation of listing runs both ways (UKLR 21): (1) FCA cancellation — the FCA may cancel the listing where special circumstances preclude normal regular dealings (e.g. securities no longer admitted to trading as required, continuing obligations unmet such as public hands falling below 10%, or suspension exceeding 6 months); (2) issuer-initiated requests — a written request must set out the issuer's name, the securities and RIEs concerned, background and reasons, the requested effective date, and evidence of any resolution required under UKLR 21.2.8R"
    sources:
      - title: "UKLR — UK Listing Rules sourcebook 全文 PDF（FCA Handbook，UKLR 21.2 Cancelling listing / 21.3 Requests to cancel or suspend）"
        url: https://api-handbook.fca.org.uk/files/sourcebook/UKLR.pdf
        accessed: 2026-09-05
    quote: "The FCA may cancel the listing of securities if it is satisfied that there are special circumstances that preclude normal regular dealings in them. ... (2) the issuer no longer satisfies its continuing obligations for listing – for example, if the percentage of shares in public hands falls below 10% ... (3) the securities' listing has been suspended for more than 6 months; ... A request by an issuer for the listing of its securities to be suspended or cancelled must be in writing and must include: (1) the issuer's name; (2) details of the securities to which it relates and the RIEs on which they are traded; (3) a clear explanation of the background and reasons for the request; (4) the date on which the issuer requests the suspension or cancellation to take effect;"
