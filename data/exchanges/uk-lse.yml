  price_limits:
    type:
      enum: dynamic_reference
      zh: "非固定百分比涨跌停板，而是逐证券（security-by-security）的价格监控机制——静态价格监控（相对开盘集合竞价价格的偏离阈值）与动态价格监控（相对最近成交价的偏离阈值）触发后，转入波动性拍卖重新形成价格，而非直接停牌"
      en: "Not a fixed percentage limit-up/limit-down band; instead a security-by-security price monitoring mechanism — static price monitoring (deviation from the opening auction price) and dynamic price monitoring (deviation from the last traded price) trigger a volatility auction to re-form the price, rather than a straight halt"
      sources:
        - title: Maintaining orderly markets（官网）
          url: https://docs.londonstockexchange.com/sites/default/files/documents/maintaining-orderly-markets.pdf
          accessed: 2026-08-14
      quote: "Not all circuit breakers work the same way. In the US, market-wide circuit breakers enforce a trading pause for all stocks for 15 minutes. London Stock Exchange's price monitoring functionality is constantly evolving to respond to clients' changing needs and instead, employs a security-by-security price monitoring mechanism."
      confidence: high
    main_board:
      spec: {type: dynamic, band_pct: null, note: "逐证券价格监控（非固定涨跌停）：富时100 FE10 组静态阈值 8%（相对上次集合竞价价）+ 动态阈值 3%（相对最近成交价），FS10 组 10%/5%；触发转 5 分钟波动性拍卖。band_pct 留 null——分组、且静态/动态两套阈值，无单一值"}
      zh: "以富时100成分股为例：静态价格监控阈值8%（相对上一次集合竞价成交价），动态价格监控阈值3%（相对最近成交价，触发5分钟波动性拍卖，含最多一次2分钟市价订单延期）；次一流动性梯队（如LSE行业分类FS10）静态阈值10%、动态阈值5%；富时100盘中/收盘/EDSP拍卖的动态阈值比常规交易更紧（FE10为1%，FS10为3%）"
      en: "For FTSE 100 constituents: static price monitoring threshold 8% (vs. last auction uncrossing price), dynamic threshold 3% (vs. last traded price, triggering a 5-minute volatility auction with up to one 2-minute Market Order extension); the next liquidity tier (e.g. LSE sector FS10) uses 10% static / 5% dynamic; FTSE 100 intraday/closing/EDSP auctions use tighter dynamic thresholds than regular trading (1% for FE10, 3% for FS10)"
      sources:
        - title: Maintaining orderly markets（官网）
          url: https://docs.londonstockexchange.com/sites/default/files/documents/maintaining-orderly-markets.pdf
          accessed: 2026-08-14
      quote: "For the most liquid stocks in the FTSE 100 stocks (e.g. London Stock Exchange sector FE10): – An 8% (Static Price Monitoring %) move from the last auction uncross... would cause a Static Limit volatility auction with 5-minute duration... – Any single order which moves market 3% (Dynamic Price Monitoring %) from last order book traded price would cause a volatility auction of 5-minute duration... For the next most liquid stocks in the FTSE 100 (e.g. London Stock Exchange sector FS10), the Static Price Monitoring % is 10%, and the Dynamic Price Monitoring % is 5%."
      confidence: high
    other_boards:
      zh: "AIM 与主板（Main Market）共用同一套 Millennium Exchange 静态 / 动态价格监控机制，触发阈值按流动性梯队（如 FE10 / FS10）而非上市板块分档（见 main_board / type）；AIM 与其他品种的具体阈值数值表在未抓取的 Business Parameters 文档内，未逐档核实"
      en: "AIM shares the same Millennium Exchange static/dynamic price-monitoring mechanism as the Main Market, with trigger thresholds graduated by liquidity band (e.g. FE10 / FS10) rather than by listing board (see main_board / type); the specific threshold table for AIM and other instrument types is in the Business Parameters document, which was not fetched, and was not verified tier by tier"
      sources:
        - title: "MIT201 – Guide to the Trading System Issue 15.8（官网 PDF，价格监控章节）"
          url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
          accessed: 2026-08-14
      confidence: medium

  circuit_breaker:
    enum: stock_level
    spec: {type: stock_level, note: "无美式全市场熔断；逐证券价格监控触发波动性拍卖，见 volatility_interruption"}
    zh: "个股级价格监控机制（无美股式全市场熔断）：不同于美国基于标普500指数跌幅触发的全市场熔断（暂停全部股票交易15分钟），伦敦证券交易所采用逐证券的价格监控功能"
    en: "Stock-level price monitoring mechanism (no US-style market-wide circuit breaker): unlike US market-wide circuit breakers that pause all stocks for 15 minutes based on S&P 500 declines, LSE employs a security-by-security price monitoring mechanism"
    detail: "同一份说明文档明确将美式全市场熔断作为对照系统提及，是本项目目前少数能在同一原文里直接对比两种机制设计哲学差异的样本。"
    sources:
      - title: Maintaining orderly markets（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/maintaining-orderly-markets.pdf
        accessed: 2026-08-14
    quote: "In the US, market-wide circuit breakers enforce a trading pause for all stocks for 15 minutes. London Stock Exchange's price monitoring functionality is constantly evolving to respond to clients' changing needs and instead, employs a security-by-security price monitoring mechanism."
    confidence: high

  volatility_interruption:
    spec: {static_pct: null, dynamic_pct: null, note: "静态价格监控（相对上次集合竞价价）+ 动态价格监控（相对最近成交价）触发 5 分钟波动性拍卖（含最多一次 2 分钟市价订单延期）；富时100 FE10 组静态 8%/动态 3%，FS10 组 10%/5%（见 price_limits），故两个 pct 键均留 null；每次拍卖及延期后另加最长 30 秒随机"}
    zh: "静态价格监控（Static Price Monitoring）与动态价格监控（Dynamic Price Monitoring）触发后转入波动性拍卖（volatility auction），价格重新形成后恢复常规交易；每次拍卖及延期后另设最长30秒随机时间"
    en: "Static and Dynamic Price Monitoring trigger a volatility auction; once the price re-forms, regular trading resumes; each auction/extension is followed by a random period of up to 30 seconds"
    sources:
      - title: Maintaining orderly markets（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/maintaining-orderly-markets.pdf
        accessed: 2026-08-14
    quote: "Circuit breakers are tools that temporarily halt trading activity or delay an auction execution if certain price movement tolerances would be breached. Following the halt, the affected security will be placed into auction allowing a price to be formed in an orderly fashion... Note that each auction and extension is followed by a random period of up to 30 seconds."
    confidence: high

  trading_halt_mechanism:
    zh: "两套并行机制：(1) FCA可依UKLR暂停/取消证券上市（如未达持续义务、市场平稳运行受威胁等，暂停满6个月须与FCA讨论是否取消上市）；(2) 交易所自身的技术性市场干预（Service Interruptions Protocol）——因系统故障等严重事件，可对受影响证券实施Halt（禁止新订单但可撤单）、Suspension（订单簿冻结，禁止新增和撤销）或Halt and Close（当日不再恢复交易，直接设定收盘价）三种状态之一"
    en: "Two parallel mechanisms: (1) the FCA may suspend/cancel a listing under UKLR (e.g. failure to meet continuing obligations, threat to orderly market operation; after 6 months of suspension the issuer must discuss cancellation with the FCA); (2) the Exchange's own technical market interventions under its Service Interruptions Protocol — for major system outages, affected securities may be placed into Halt (no new orders, deletions allowed), Market/Partition Suspension (order book frozen, no new orders or deletions) or Halt and Close (trading will not resume that day; a closing price is set)"
    sources:
      - title: UKLR UK Listing Rules sourcebook（FCA Handbook）
        url: https://api-handbook.fca.org.uk/files/sourcebook/UKLR.pdf
        accessed: 2026-08-14
      - title: MIT201 – Guide to the Trading System Issue 15.8（官网，第11章）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
        accessed: 2026-08-14
    quote: "11.4.1 Halt / If London Stock Exchange specifically wishes to prevent further order entry, then it will place the market in a Halt state, which does not allow the entry of new orders... 11.4.2 Market/Partition Suspension... 11.4.3 Halt and Close / This state will be used if London Stock Exchange concludes that there is no prospect of trading resuming on the trading day of the outage."
    confidence: high

  error_trade_rule:
    spec:
      bust_allowed: true
      review_window_min: 30
      deviation_threshold_pct: null
      resolution: cancel
      note: "交易所视一切成交为 firm，仅在例外情形作 Exchange enforced cancellation（Rule 2120–2121），可应会员申请或交易所自行发起。无固定价格偏离百分比门槛，代之以：成交须『manifestly erroneous』、双方无法用 contra facility 自行冲销、且申请方潜在损失达最低标准——股票单只 £100,000 / 多只 £200,000，ETF/ETP £50,000 / £100,000。申请须在成交后 30 分钟内提交 Market Supervision（收盘 16:30 后的收盘拍卖成交须在 17:00 前）。交易所决定为终局，无上诉；只作废、不调价"
    zh: "交易所将其规则下的所有成交视为确定（firm），仅在例外情形下由交易所强制作废（Exchange enforced cancellation，规则 2120–2121）——可应会员申请或交易所自行发起（如公司事件明显误传、收盘拍卖被错单严重扭曲）。会员申请须在成交后 30 分钟内提交市场监察部门；待作废成交须经交易所判断为『明显错误（manifestly erroneous）』，且双方无法通过 contra 冲销机制自行处理，申请方潜在损失须达门槛（股票单只 £100,000、多只 £200,000；ETF/ETP 单只 £50,000、多只 £100,000）。交易所决定为终局，只作废不调价"
    en: "The Exchange treats all trades under its rules as firm; only in exceptional circumstances will it undertake an Exchange enforced cancellation (Rules 2120–2121), on a member firm's request or of its own volition (e.g. a clear miscommunication of a corporate event, or a closing price significantly distorted by erroneous orders in the closing auction). A member firm's request must reach the Market Supervision department within 30 minutes of the trade time; the trade must be manifestly erroneous in the Exchange's judgement, the parties must be unable to use the contra facility, and the requesting firm's potential loss must reach a threshold (£100,000 for a single stock, £200,000 across more than one). The Exchange's decision is final; trades are cancelled, not price-adjusted"
    detail: "Rule 2120–2121（Exchange enforced cancellation of erroneous trades）+ Guidance to Rule。与 trading_halt_mechanism（系统故障停牌）不同。无固定 % 偏离阈值——LSE 用『manifestly erroneous + 损失门槛 + 市场影响』的裁量标准，故 spec.deviation_threshold_pct 留 null。"
    sources:
      - title: "RULES OF THE LONDON STOCK EXCHANGE（Rulebook，effective 19 January 2026，Rule 2120–2121）"
        url: https://docs.londonstockexchange.com/sites/default/files/documents/rules-of-the-london-stock-exchange-effective-19-january-2026_0.pdf
        accessed: 2026-08-30
    quote: "The Exchange views all trades undertaken under its rules as firm. However, the Exchange may, in exceptional circumstances, undertake an Exchange enforced cancellation of an automated trade executed on the trading system, either at the request of a member firm or of its own volition. ... any requests from member firms to cancel trades should be made to the Market Supervision department as soon as possible and in any event within 30 minutes of the trade time. ... any trades to be cancelled must be manifestly erroneous in the judgement of the Exchange. ... the Market Supervision department will only consider an Exchange enforced cancellation where the amount of loss is £100,000 or more in relation to automated trades conducted in a single stock on the trading system and £200,000 or more in relation to automated trades conducted in more than one stock"
    confidence: high

  intraday_reversal:
    enum: t0
    zh: "交易层面为 T+0（当日买入的证券当日即可卖出）——LSE 的 MIT201 交易系统指南与 Rules of the London Stock Exchange 只规范订单簿运作、竞价与撮合，未设持有期或「交收前不得卖出」限制；结算层面为 T+2（见 clearing.settlement_cycle；英国已定于 2027-10-11 改 T+1）"
    en: "T+0 at the trading level (securities bought during the day may be sold the same day) — the LSE's MIT201 Guide to the Trading System and the Rules of the London Stock Exchange govern only order-book operation, auctions and matching, with no holding-period or 'may not sell before settlement' restriction; settlement is T+2 (see clearing.settlement_cycle)"
    detail: "confidence 标 medium——依据是交易规则中不存在持有期限制条款（消极认定），而非交易所对「允许当日回转」的正面声明。与中国 A 股 T+1（SSE / SZSE 交易规则明文「交收前不得卖出」）形成对照——英国现货市场无此明文限制。"
    sources:
      - title: "MIT201 – Guide to the Trading System Issue 15.8（官网 PDF）"
        url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
        accessed: 2026-08-14
    confidence: medium

  short_selling:
    enum: restricted_list
    spec: {naked_allowed: null, uptick_rule: false, borrow_required: null, note: "SSR 2025（脱欧后英国独立框架，自 2026-07-13 起）：净空头仓位达 0.2% 须报 FCA，FCA 公布匿名化 ANSP；无报升规则；FCA 保留紧急限制/禁止权"}
    zh: "《2025年卖空规则》（Short Selling Regulations 2025, SSR 2025）——脱欧后英国自订的独立卖空监管框架，2026年7月13日起正式取代此前“承接”的欧盟《卖空条例》（Regulation (EU) No 236/2012）。持有可报告股票净空头仓位达0.2%阈值须向FCA报告，FCA公布匿名化的汇总净空头仓位（ANSP）；FCA保留在特殊情形下实施限制/禁止卖空的紧急权力"
    en: "Short Selling Regulations 2025 (SSR 2025) — the UK's own post-Brexit short-selling framework, which from 13 July 2026 replaced the previously-assimilated EU Short Selling Regulation (Regulation (EU) No 236/2012). Net short positions in reportable shares must be notified to the FCA once the 0.2% threshold is reached; the FCA publishes anonymised Aggregate Net Short Positions (ANSP); the FCA retains emergency powers to restrict or ban short selling in exceptional circumstances"
    detail: |
      压测点核心证据：这是本项目迄今唯一能在同一份原文里直接看到"英国自订规则明确替换欧盟
      规则、附生效日期"的案例，比"脱欧后监管独立"这个笼统印象具体得多。枚举值选
      restricted_list（需报告的可报告股票清单机制）而非 restricted_uptick（如美股报升规则），
      因为SSR 2025的核心约束是"达到净空头仓位阈值须披露"而非逐笔挂单的报升限制，两者机制
      设计不同，具体触发/豁免细节（稳定化交易、做市商豁免等）未逐条核实。
    sources:
      - title: Short selling（FCA官网）
        url: https://www.fca.org.uk/markets/short-selling
        accessed: 2026-08-14
    quote: "The SSR is set out in the Short Selling Regulations 2025 (SSR 2025) and the Short Selling Rules Sourcebook within the FCA Handbook. These form the legal and regulatory framework for short selling in the UK. The new SSR applies from 13 July 2026. It replaces the assimilated EU Short Selling Regulation (Regulation (EU) No 236/2012)... The FCA publishes daily current and historic ANSP reports. These show the aggregated net short positions in companies based on reported net short positions above the 0.2% threshold."
    confidence: high

  block_trade:
    zh: "无按规模设限的专门大宗交易时段。大额交易在中央限价订单簿外完成，作为『在交易所（on-Exchange）的簿外成交』申报（经 TRADEcho），前提是该笔符合以下情形之一：属『大额成交』（large in scale，即规模达到或超过英国 MiFIR 规定的最小订单规模）、或属『协议成交』（negotiated trade，不适用盘前透明度、成交条件不劣于当时订单／报价簿可达到的水平）。此外 SETS 内设 RFQ（询价）交易簿，股票 RFQ 的最低金额为 £50,000 与盘前大额成交（LIS）阈值的 25% 两者取高"
    en: "There is no size-gated dedicated block-trading session. Large trades are executed away from the central limit order book and reported as off-book on-Exchange trades (via TRADEcho), provided the trade is either 'large in scale' (equal to or larger than the minimum order size set in UK MiFIR) or a 'negotiated trade' (not subject to pre-trade transparency, on terms no worse than could be achieved on the order or quote book at the time). SETS also runs an on-book RFQ facility; for equities the minimum RFQ value is the higher of £50,000 or 25% of the pre-trade large-in-scale value"
    detail: "英国承接 MiFID II／MiFIR 后无亚洲式规模化『大宗交易』设施；LIS 阈值由 UK MiFIR（受托规例 (EU) 2017/587 承接版）按证券日均成交额分档设定，非 LSE 自设。引文为《伦敦证券交易所规则》术语定义 + MIT201 的 RFQ 参数。"
    sources:
      - title: Rules of the London Stock Exchange (effective 5 February 2024) — Definitions; Rule 3000
        url: https://docs.londonstockexchange.com/sites/default/files/documents/rules-of-the-london-stock-exchange-effective-5-february-2024.pdf
        accessed: 2026-09-04
      - title: MIT201 – Guide to the Trading System (Issue 15.8) §6.6 Request for Quote
        url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
        accessed: 2026-09-04
    quote: "a trade, conducted in UK regulated market security, that is not subject to pre-trade transparency on the trading system and which is on terms that are no worse than those that could be achieved on the relevant Exchange order or quote book at the time of the trade. …… an order which is equal to or larger than the minimum size of orders provided for in UK MiFIR and reflected in the parameters …… Where the trade is executed away from an order book (but possibly still in an order book security) a 'manual' trade report must be submitted to TRADEcho to bring the execution 'on Exchange' under paragraph 3040 of Rules of the London Stock Exchange. …… the minimum will be set as the higher of £50,000 or 25% of Pre-Trade Large in Scale value. Other instruments will not have a minimum."
    confidence: high

  order_book_transparency:
    zh: "盘前：SETS 为公开的中央限价订单簿，展示订单的价量向市场披露（Millennium Exchange 以价格优先运作，展示部分优先于非展示部分）；同一订单簿内支持不披露的流动性——冰山订单仅展示部分数量、隐藏限价订单全隐藏、中间价挂钩订单仅以买卖中间价成交，均排在同价展示订单之后。盘后：适用英国承接的 MiFIR 成交透明度制度，大额成交（LIS）可延迟披露"
    en: "Pre-trade: SETS is a public central limit order book whose displayed order sizes and prices are disseminated to the market (Millennium Exchange operates on price priority, with displayed portions ahead of non-displayed); the same book supports undisclosed liquidity — Iceberg Orders show only a portion, Hidden Limit Orders are fully non-displayed, and Mid-Price Pegged Orders execute only at the mid, all ranked behind displayed orders at the same price. Post-trade: under the UK's assimilated MiFIR transparency regime, large-in-scale (LIS) trades may be published on a deferred basis"
    detail: "字段管本所订单簿内部的（非）展示流动性；独立暗池 / MTF 实体（Turquoise）见 dark_pool，行情层级 / 收费见第十章 market_data_levels。quote 复用 MIT201 已核实的展示 / 非展示优先级表述；盘后 LIS 延迟披露为 UK MiFIR 一般制度，未逐字核实交易所侧参数，故整体 confidence: medium。"
    sources:
      - title: MIT201 – Guide to the Trading System Issue 15.8（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
        accessed: 2026-08-14
    quote: "Millennium Exchange operates on a price priority basis. Displayed parts of orders take precedence over non-displayed parts at any price point. With non-display portions of icebergs taking precedence over fully Hidden Orders, which in turn take precedence over Mid-Price Pegged Orders."
    confidence: medium

  dark_pool:
