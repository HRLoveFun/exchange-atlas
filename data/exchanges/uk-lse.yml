  timezone: "Europe/London (GMT/BST)"
  dst_rule: "实行英国夏令时（British Summer Time, BST），在格林尼治标准时间（GMT）与BST之间切换"

  founded_year:
    zh: "1801（第一家受监管的交易所在伦敦成立，现代意义上的证券交易所由此诞生）；渊源可上溯至1698年 Jonathan's Coffee House 内 John Castaing 开始发布证券商品价格清单"
    en: "1801 (the first regulated exchange, marking the birth of the modern Stock Exchange); traces its origins to 1698, when John Castaing began issuing price lists at Jonathan's Coffee House"
    detail: |
      LSEG 官网历史时间线把「the modern Stock Exchange」的诞生明确定在1801年，早于此的
      1698年只是"渊源"（John Castaing 在 Jonathan's Coffee House 发布《The Course of the
      Exchange and other things》价格清单），与 NYSE 官网对1792年 Buttonwood Agreement 之前
      1600年代贸易活动"渊源不算正式成立"的处理方式是同一套叙事逻辑。
    sources:
      - title: The history of LSEG（官网）
        url: https://www.lseg.com/en/about-us/history
        accessed: 2026-08-14
    quote: "1698\nAt Jonathan's Coffee House, John Castaing begins issuing a list of stock and commodity prices called 'The Course of the Exchange and other things'.\n1801\nThe first regulated exchange comes into existence in London and the modern Stock Exchange is born."
    confidence: high

  history:
    zh: "1801年现代证券交易所成立；1986年英国金融“大爆炸”（Big Bang）改革实现去监管化；1995年创立AIM（另类投资市场）；2001年7月LSE本身成为在自己市场挂牌的公众公司；2007年10月与米兰证券交易所（Borsa Italiana）合并组成伦敦证券交易所集团（LSEG）；2009年收购MillenniumIT（现交易系统Millennium Exchange的技术基础）并取得泛欧交易平台Turquoise的多数股权；2013年取得清算所LCH集团的多数股权；2021年1月完成对数据商Refinitiv的全股份收购"
    en: "The modern Stock Exchange was born in 1801; the UK market was deregulated in the 1986 'Big Bang'; AIM (Alternative Investment Market) was founded in 1995; in July 2001 London Stock Exchange became a public company listed on its own market; in October 2007 it merged with Milan's Borsa Italiana to form London Stock Exchange Group (LSEG); MillenniumIT was acquired in 2009 (the technology base for today's Millennium Exchange) alongside a majority stake in pan-European venue Turquoise; a majority stake in LCH Group was acquired in 2013; the all-share acquisition of Refinitiv completed in January 2021"
    detail: |
      2007年10月的 Borsa Italiana 合并是本文件 group_id 判断的直接依据（见文件头部注释）；
      2001年"自身上市"这一事件与2007年集团重组后的当前挂牌主体关系，见下 self_listed 字段
      的详细说明。
    sources:
      - title: The history of LSEG（官网）
        url: https://www.lseg.com/en/about-us/history
        accessed: 2026-08-14
    quote: "1986\nThe UK market is deregulated in the 'Big Bang'.\n1995\nAIM, London Stock Exchange's Alternative Investment Market, is founded... 2000 - 2009\nJuly 2001\nLondon Stock Exchange becomes a public company listed on its own market.\nOctober 2007\nLondon Stock Exchange and Borsa Italiana merge, creating London Stock Exchange Group (LSEG)."
    confidence: high

  organization_form:
    enum: demutualized_listed
    zh: "公司制（2001年7月由会员制改制为公众公司）"
    en: "Demutualized (became a public company in July 2001)"
