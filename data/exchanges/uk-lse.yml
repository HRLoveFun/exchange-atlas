    quote: "The tick size regime only determines the minimum difference between two price levels of orders sent in relation to a financial instrument in the order-book. It should therefore be applied equally, regardless of the currency of the financial instrument. ... 0 ≤ price < 0,1 0,0005 0,0002 0,0001 0,0001 0,0001 0,0001 ... 1 ≤ price < 2 0,01 0,005 0,002 0,001 0,0005 0,0002 ... 50 000 ≤ price 500 200 100 50 20 10"
