# 伦敦证券交易所 London Stock Exchange (LSE)
# 抓取来源见 PROJECT/SOURCES.md `uk-lse` 一节；原始页缓存于 .cache/uk-lse/
# source_lang: en——英国监管机构（FCA）与交易所自身官网均无官方中文原文，按 ADR-013
# 「无中选英」，英文是溯源锚点，zh 是翻译展示。
# group_id: lseg-group——London Stock Exchange Group plc（LSEG）旗下除本所（London Stock
# Exchange plc，一线运营 Main Market/AIM/ISM/PSM 等市场的法人实体）外，还持有 Borsa
# Italiana（米兰证券交易所，2007年10月合并组成集团时并入）这一真实存在、且本身是可独立
# 收录对象的姊妹交易所实体——判断标准满足 add-exchange skill 第1步的要求（Borsa Italiana
# 目前不在 v1.0 Wave1/Wave2 候选名单里，但它是真实的独立交易所法人，不是"母公司叫什么
# 名字"这类误判来源，NYSE Group 的先例——NYSE American/Arca 同样未列入候选名单但仍标了
# group_id——支持这个判断）。LSEG 集团下的 FTSE Russell（指数业务）、LCH（清算所）、
# Turquoise（泛欧MTF）、LSEG Data & Analytics 均不是"交易所"，不构成 group_id 判断的
# 依据，只在相关字段（indices/clearing/dark_pool等）里以来源关系提及。
# 压测点（脱欧后独立监管框架）在 regulation/costs/risks 三章均有实证：FCA 用 Short Selling
# Regulations 2025（SSR 2025）替换了此前"承接"的欧盟卖空监管（Regulation (EU) No 236/2012），
# 2024年7月的 UK Listing Rules（UKLR）改革则把英国上市制度与欧盟《上市指令》体系下的
# Premium/Standard 两级架构脱钩、改为单一"equity shares (commercial companies)"类别。

id: uk-lse
name_zh: 伦敦证券交易所
name_native: {en: "London Stock Exchange (LSE)"}
official_languages: [en]
source_lang: en
group_id: lseg-group
region: europe
tier: extended

