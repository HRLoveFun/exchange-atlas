  investor_structure:
    zh: "按国家统计局（ONS）2026年1月发布的两年一期官方口径，2024年末英国本土注册、在LSE挂牌的公司普通股总值£2.54万亿，其中境外投资者持有比例连续多年上升，2024年末达58.8%的历史新高（2022年为57.7%），美国投资者以£6,939亿居境外持有人之首；英国境内个人投资者持股11.6%（£2,950亿，历史新高）；银行持股3.6%（历史新高）；公共部门（含2008年金融危机后遗留的银行持股）持股0.2%（£47亿，较2022年£135亿继续下降）"
    en: "Per the Office for National Statistics' (ONS) biennial official bulletin published January 2026, the total value of ordinary shares in UK-domiciled companies listed on the LSE was £2.54 trillion at end-2024; the proportion held by overseas beneficiaries has risen for years, reaching a record high of 58.8% at end-2024 (up from 57.7% in 2022), with US-based holders leading foreign ownership at £693.9bn. UK-resident individuals held 11.6% (£295.0bn, a record high); banks held a record 3.6%; the public sector (a legacy of post-2008 financial-crisis bank stakes) held 0.2% (£4.7bn, down from £13.5bn in 2022)"
    detail: |
      该统计口径为"由LSE认定注册国为英国的挂牌公司"的普通股，与overview章节因LSEG集团口径
      /交易所口径混同问题而留空的market_cap_usd_bn（集团合并市值）是完全不同的统计对象，
      不构成对该字段留空决定的推翻——ONS这份统计明确是"交易所口径"（LSE挂牌英国公司），
      可以安全使用。数据来源为Euroclear（CREST）结算系统记录与股东名册分析，两年更新一次。
    sources:
      - title: "Ownership of UK quoted shares: 2024（ONS官网，2026-01-29发布）"
        url: https://www.ons.gov.uk/economy/investmentspensionsandtrusts/bulletins/ownershipofukquotedshares/2024
        accessed: 2026-08-24
    quote: "The total value of shares held in quoted UK-domiciled companies listed on the London Stock Exchange (LSE) was £2.54 trillion at the end of 2024. Overseas investors continued to increase their holdings, with the proportion of UK shares owned by the rest of the world reaching a record high of 58.8% in 2024, up from 57.7% in 2022. UK-resident individuals held 11.6% of quoted shares... these holdings were valued at £295.0 billion – a record-high value. Banks expanded their holdings to a record 3.6%... public sector holdings of UK quoted shares stood at 0.2% at the end of 2024; these holdings were valued at £4.7 billion, a decrease of 0.4 percentage points compared with 2022 when the value of holdings were £13.5 billion... beneficiaries in the United States held £693.9 billion in 2024, which is the largest proportion of UK quoted shares of any country outside the UK"
    verified: 2026-08-24
