    en: "LCH Ltd collects initial margin from EquityClearing Members: the Clearing House requires members to transfer Collateral in respect of their initial margin obligations, the amount being determined by the Clearing House using the LCH ERA algorithm; initial and variation margin are calculated separately for a member's Proprietary Account, each Client Account (other than an Indirect Gross Account) and each Indirect Gross Sub-Account, with no offset between proprietary and client accounts or between client accounts (except as allowed under the Default Rules or any Insufficient Resources Determination Rule)"
