  account_opening_requirements:
    zh: "适用英国通用的反洗钱客户尽职调查（Customer Due Diligence, CDD）规则，而非LSE专属开户规则：依《2017年洗钱、恐怖主义融资与资金转移（付款人信息）条例》（Money Laundering Regulations 2017）第28条，受监管机构（含证券经纪商）须在建立业务关系前识别并核实客户身份、了解业务关系或临时交易的目的与性质；客户为法人实体时须另行获取并核实名称、注册号、注册地址等信息，并在客户存在受益所有人时识别、核实受益所有人身份"
    en: "This is the UK's general anti-money-laundering customer due diligence (CDD) regime, not an LSE-specific account-opening rule: under Regulation 28 of the Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017, a relevant person (including securities brokers) must identify and verify a customer's identity before establishing a business relationship, and assess the purpose and intended nature of that relationship or occasional transaction; where the customer is a body corporate, the firm must also obtain and verify its name, registration number and registered address, and identify and verify any beneficial owner"
    detail: |
      本字段描述的是英国全金融体系统一适用的CDD/KYC法定底线，任何经纪商为客户开立可交易
      LSE证券的账户均须遵守，并非LSE自身另订的准入门槛（LSE本身的准入规则是对"会员机构"
      而非"终端投资者"的资格要求，见membership_structure字段）。具体到零售经纪商的开户
      实操（身份证件种类、地址证明有效期等）由各经纪商自行落实监管要求的细节，未在受监管
      法条原文中逐条列明，故本字段只记录法定义务本身而非经纪商操作细则。
    sources:
      - title: The Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017, Regulation 28（legislation.gov.uk官方立法数据库）
        url: https://www.legislation.gov.uk/uksi/2017/692/regulation/28
        accessed: 2026-08-24
    quote: "The Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017／28. —(1) This regulation applies when a relevant person is required by regulation 27 to apply customer due diligence measures. (2) The relevant person must— (a) identify the customer unless the identity of that customer is known to, and has been verified by, the relevant person; (b) verify the customer's identity unless the customer's identity has already been verified by the relevant person; and (c) assess, and where appropriate obtain information on, the purpose and intended nature of the business relationship or occasional transaction. Where the customer is a body corporate— (a) the relevant person must obtain and verify— (i) the name of the body corporate; (ii) its company number or other registration number; (iii) the address of its registered office, and if different, its principal place of business"
    verified: 2026-08-24
    confidence: high

  suitability_management:
    zh: "适用英国通用的FCA行为准则手册COBS（Conduct of Business Sourcebook）适当性规则：经纪商/投资顾问提供投资建议或组合管理服务时，须取得客户在相关金融工具知识与经验、财务状况（含承受损失能力）、投资目标（含风险容忍度）三方面的必要信息，并据此确保推荐的投资服务/金融工具与决策符合客户的风险承受能力与承受损失能力"
    en: "This is the UK's general FCA Conduct of Business Sourcebook (COBS) suitability regime: a firm providing investment advice or portfolio management must obtain the necessary information about a client's (a) knowledge and experience relevant to the specific type of financial instrument, (b) financial situation including ability to bear losses, and (c) investment objectives including risk tolerance, and must ensure recommended investment services, financial instruments and trading decisions are suitable for that client's risk tolerance and ability to bear losses"
    detail: |
      COBS 9A（脱胎于欧盟MiFID II第25(2)条、经英国脱欧后内嵌为FCA Handbook独立规则手册）
      适用于MiFID业务范畴，是英国全市场统一的适当性框架，非LSE专属；对非咨询类服务另有
      COBS 10"适当性"（Appropriateness）规则（要求更低，仅需评估知识经验而非全套三要素），
      两者是不同强度的两层规则，本字段以覆盖面更广、要求更高的COBS 9A"适当性"（Suitability）
      为主。
    sources:
      - title: FCA Handbook - COBS 9A Suitability (MiFID and insurance-based investment products provisions)
        url: https://handbook.fca.org.uk/handbook/cobs9a
        accessed: 2026-08-24
    quote: "When providing investment advice or portfolio management a firm must: (1) obtain the necessary information regarding the client's: (a) knowledge and experience in the investment field relevant to the specific type of financial instrument, insurance-based investment product or service; (b) financial situation including his ability to bear losses; and (c) investment objectives including his risk tolerance, so as to comply with (2); (2) only recommend investment services, financial instruments and insurance-based investment products, as applicable, or take decisions to trade, which are suitable for the client and, in particular, in accordance with the client's risk tolerance and ability to bear losses."
    verified: 2026-08-24
    confidence: high

  foreign_access_channel:
    zh: "两条并行通道：(1) 直接会员通道——境外证券商可在英国或「适格境外法域」获授权监管（或经交易所认定资本充足性/诚信与专业能力已受充分监管）后直接成为LSE会员机构，无须以英国本土法人身份接入（见membership_structure）；(2) 存托凭证/互联互通通道——境外投资者亦可通过在LSE挂牌的国际存托凭证（IOB交易服务）或专项互联互通安排（如深圳-伦敦互联互通）间接接触境内证券，无需直接开立LSE交易权限"
    en: "Two parallel channels: (1) direct membership — an overseas broker authorised under UK or an 'appropriate overseas' jurisdiction (or otherwise deemed sufficiently regulated by the Exchange in respect of capital adequacy and fitness/probity) may become an LSE member firm directly, without needing to be a UK-incorporated legal entity (see membership_structure); (2) depositary receipts / connect schemes — overseas investors can also gain indirect access via international depositary receipts listed on LSE (International Order Book) or dedicated connect arrangements (e.g. Shenzhen-London Stock Connect), without opening direct LSE trading access"
    detail: |
      渠道(2)与market_structure.connect_schemes（深港通式安排的具体条文与quote）以及
      overview.trading_currency字段提及的"国际预托凭证"是同一批事实的不同侧面，此处不
      重复摘引其quote，只做跨字段的归纳指路，quote锚点仍留在原字段（遵循CLAUDE.md
      "任何一个事实只在一处手写"原则）。渠道(1)的quote与membership_structure字段共用
      同一份来源文档（同一条规则原文本身就同时支撑"会员体系是什么"与"外资如何接入"两个
      问题，不是重复摘引不同事实）。
    sources:
      - title: Rules of the London Stock Exchange（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/rules-of-the-london-stock-exchange-effective-5-february-2024.pdf
        accessed: 2026-08-24
    quote: "A member firm must at all times be authorised under relevant United Kingdom, or appropriate overseas legislation, or in the view of the Exchange be otherwise sufficiently regulated, in respect of capital adequacy, and fitness and probity"
    verified: 2026-08-24
    confidence: high

  membership_structure:
    zh: "会员机构（member firm）制：须在英国或适格境外法域获得授权监管（或经交易所认定在资本充足性、诚信与专业能力方面已受充分监管），须持有有效LEI码，须具备充足的交易执行、记录、报告与结算能力及至少一名合规官"
    en: "Member firm structure: must be authorised under UK or appropriate overseas legislation (or otherwise deemed sufficiently regulated for capital adequacy and fitness/probity), must hold a valid LEI, and must maintain adequate trade execution, recording, reporting and settlement capabilities plus at least one compliance officer"
    sources:
      - title: Rules of the London Stock Exchange（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/rules-of-the-london-stock-exchange-effective-5-february-2024.pdf
        accessed: 2026-08-14
    quote: "A member firm must at all times be authorised under relevant United Kingdom, or appropriate overseas legislation, or in the view of the Exchange be otherwise sufficiently regulated, in respect of capital adequacy, and fitness and probity... A member firm must hold a valid, issued and duly renewed LEI code at all times... A member firm must, to ensure compliance with these rules, at all times have: adequate trade execution, recording, reporting and settlement procedures and systems... sufficient staff with adequate knowledge, experience, training and competence; adequate internal procedures and controls; and one or more compliance officers."
    confidence: high

  broker_landscape:
    zh: "《伦敦证券交易所规则》将会员机构在订单簿上的交易行为区分为「代理经纪商」（Agency Broker，为客户下单执行、须对客户履约负责）与充当「零售服务商」（Retail Service Provider, RSP）的做市/自营性质会员——RSP是就零售规模订单持续按当前订单簿最优价提供成交承诺的会员机构，零售经纪商通常并非LSE直接会员，而是依托RSP网络的报价承诺为终端零售客户执行订单，规则本身对「利用RSP既有报价承诺、在其之前抢先在订单簿制造新最优价」这类行为专门作出了不当交易行为的界定"
    en: "The Rules of the London Stock Exchange distinguish between member firms acting as an 'Agency Broker' (executing orders on behalf of clients and responsible for performance to those clients) and members acting as a Retail Service Provider (RSP) — a dealer/market-making-type member firm that stands ready to deal at the current best order-book price for retail-sized orders. Retail brokers are typically not direct LSE members themselves; they route client orders to be executed against RSPs' standing quote commitments, and the Rules specifically define as improper conduct the practice of exploiting an RSP's prior quote commitment by creating a new best price ahead of it on the order book"
    detail: |
      本次抓取范围内未找到"RSP"这一缩写在《伦敦证券交易所规则》定义章节（Definitions）
      的正式释义条目，摘引的原文来自Core Rules章节里对不当交易行为的说明性文字，是从
      RSP在实务中如何运作反推出的描述，而非规则本身给出的正式定义句——故confidence标
      medium而非high。RSP机制是英国零售股票经纪市场的标志性结构（多数零售经纪商本身
      不是LSE会员，而是依托一批做市商/自营交易商的RSP报价网络执行客户订单），与订单簿
      直接撮合的机构投资者交易路径是两种不同的市场微观结构，日后如需更完整定义宜专门
      抓取LSE面向零售中介的说明文档（本次未纳入抓取范围）。
    sources:
      - title: Rules of the London Stock Exchange（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/rules-of-the-london-stock-exchange-effective-5-february-2024.pdf
        accessed: 2026-08-24
    quote: "Certain trading practices that exploit the commitment given by firms that act as RSPs are considered to be detrimental to the fairness and integrity of the Exchange's markets and should be discouraged. For example, an order is entered onto the order book with the intention of creating a new best price, away from generally accepted trading levels, for the principle purpose of executing a larger order against an RSP by virtue of the RSP's previous commitment to deal on the basis of the current best order book price."
    verified: 2026-08-24
    confidence: medium

# ═══════════════════════════════════════════════
# 十｜市场数据与技术基础设施
# ═══════════════════════════════════════════════
infrastructure:
  _meta:
    verified: 2026-08-14
    confidence: medium

  market_data_levels:
    zh: "分三档：Level 2（订单簿全深度，含全部报价/订单及Level 1全部内容，如开盘价/收盘价/揭示价及数量、最优价及数量）、Level 1（最优价及数量、每证券成交额、揭示成交量指示、开盘价、最高最低成交价、逐笔成交、收盘价、全部成交VWAP、累计成交量、揭示价及数量、盘后成交数据）、Post-trade Data（场内/场外成交报告及TRADEcho场外系统性内部撮合商报价）"
    en: "Three tiers: Level 2 (full order-book depth, including all quotes and orders plus everything in Level 1, e.g. open/close/uncrossing prices and volumes, best price and volume), Level 1 (best price and volume, value traded per security, indicative uncrossing volume, opening prices, trade high/low, individual trades, closing prices, all-trades VWAP, cumulative volumes, uncrossing price and volume, Post-trade Data), and Post-trade Data (on-book/on-exchange trade reports and TRADEcho systematic internaliser quoting)"
    sources:
      - title: Schedule A – Price List and Data Products（官网，01 January 2026）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/schedule-a-price-list-and-products-schedule-2026.pdf
        accessed: 2026-08-24
    quote: "Level 2 includes full depth of the book with all quotes, orders and Level 1 Data including trades, open price, close price, uncrossing price plus volume, best price plus volume. Level 1 includes best price and volume, value traded per security, indicative uncrossing volume, opening prices, trade high and low individual trades, closing prices, all trades VWAP, cumulative volumes, uncrossing price and volume, Post-trade Data. Post-trade Data includes on-book, on-exchange trade reports and TRADEcho SI quoting for the respective market."
    verified: 2026-08-24
    confidence: high

  data_latency:
    zh: "行情数据按时效性分三类许可：Real Time Data（实时数据，经再分发许可对专业客户/私人投资者提供）、Delayed Data（延时数据，经「延时及收市后数据再分发许可」以受控机制分发）、After Midnight Data（收市后数据，经「历史数据再分发许可」以不受控机制分发，典型用途为云端逐笔历史数据服务）；本次未找到官方原文明确给出Delayed Data具体延时时长"
    en: "Market data is licensed in three latency tiers: Real Time Data (via redistribution licences to Professional Customers/Private Investors), Delayed Data (via a 'Delayed / After Midnight Redistribution licence' delivered through controlled mechanisms), and After Midnight Data (via a 'Historical Redistribution licence' delivered through uncontrolled mechanisms, typically used for cloud-based tick history services); no primary source found this session states the specific delay duration for Delayed Data"
    detail: |
      与market_data_levels共用同一批来源文档，但两个字段描述的是数据的两个不同维度（深度
      vs 时效性），故分开成两个独立字段各自摘引quote，不合并。市面上常见"延时数据15分钟"
      的说法（在若干第三方与LSEG集团数据业务综合介绍页面中出现过），但本次抓取范围内的
      LSE官方定价/政策文档均未见对"15分钟"这一具体时长的逐字确认，按铁律不采纳未落实
      原文的印象，故zh/en均不写入这个数字，只如实说明"未找到官方原文明确时长"。
    sources:
      - title: Schedule A – Price List and Data Products（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/schedule-a-price-list-and-products-schedule-2026.pdf
        accessed: 2026-08-24
      - title: Market Data Policy Guidelines（官网，01 January 2025）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/market-data-policy-guidelines-2025_0.pdf
        accessed: 2026-08-24
    quote: "3.1.1 REAL TIME REDISTRIBUTION LICENCES／3.1.2 DELAYED AND AFTER MIDNIGHT REDISTRIBUTION LICENCES／Delayed Data / After Midnight Redistribution licence — A licence for redistribution of Delayed Data and / or After Midnight Data delivered via controlled mechanisms respectively／Historical Redistribution licence — A licence for redistribution of After Midnight Data delivered via uncontrolled mechanisms／Typical use case: Cloud-based tick service, delivery of After Midnight Data via datafeed"
    verified: 2026-08-24
    confidence: high

  data_pricing_model:
    zh: "按客户类型（专业客户 vs 私人投资者）、数据深度（Level 2/Level 1/盘后）与时效性（实时/延时/收市后）多维度分级定价，年度许可费按客户/计量单位/数据产品逐项累计收取（不含增值税），预先按年开票；数据使用费（Data Charges）按月开票、按月后付。举例：UK market Data（英股整体行情）实时再分发许可，专业客户Level 2年费£67,611、Level 1年费£37,083；私人投资者档Level 2年费£13,258、Level 1年费£8,215；延时数据（Delayed Data）按「企业级」许可另设费率，如UK market Data Level 2企业级年费£158,981"
    en: "Pricing is tiered along multiple axes — customer type (Professional vs Private Investor), data depth (Level 2/Level 1/post-trade) and latency (real-time/delayed/after-midnight). Licence Charges are cumulative per Customer, per Unit of Count, per Data Product, quoted excluding VAT and invoiced annually in advance; Data Charges are invoiced monthly in arrears. Example: for UK market Data real-time redistribution, Professional Users pay £67,611/year for Level 2 and £37,083/year for Level 1; the Private Investors tier pays £13,258/year for Level 2 and £8,215/year for Level 1; Delayed Data carries separate 'Enterprise' tier pricing, e.g. £158,981/year for UK market Data Level 2 Enterprise"
    detail: |
      价目表覆盖UK/International/European/Turquoise/Turquoise Europe多个市场数据产品线，
      本字段只摘取UK market Data这一核心产品线的代表性数字作为定价模式的例证，不逐项
      列全价目表（完整数值见来源PDF Schedule A第3节）。Private Securities Market Data
      （PISCES私募证券市场对应的数据产品）对"相关客户"免费，是本文件products章节
      uk-lse-private条目的又一佐证。
    sources:
      - title: Schedule A – Price List and Data Products（官网）
