  investor_protection:
    zh: "金融服务补偿计划（Financial Services Compensation Scheme, FSCS）——依《2000年金融服务与市场法》（FSMA）设立的法定投资者/存款人补偿机制：若受FCA或审慎监管局（PRA）授权的投资公司/顾问倒闭，投资类索赔按2019年4月1日后倒闭案件每人每机构最高赔付£85,000（2010年1月至2019年3月倒闭案件适用£50,000上限，2010年1月前适用£30,000+£20,000累进上限£48,000规则）；FSCS保护范围以该机构从事的具体业务是否属PRA/FCA监管活动为准，并非所有投资产品均受保护"
    en: "The Financial Services Compensation Scheme (FSCS) — a statutory investor/depositor compensation scheme established under the Financial Services and Markets Act 2000 (FSMA): where an FCA- or Prudential Regulation Authority (PRA)-authorised investment firm or adviser fails, investment claims are compensated up to £85,000 per eligible person per firm for firms that failed after 1 April 2019 (a £50,000 cap applies to failures between January 2010 and March 2019, and 100% of the first £30,000 plus 90% of the next £20,000, capped at £48,000, applies to earlier failures); FSCS protection depends on whether the specific activity the firm was carrying out is a PRA/FCA-regulated activity, and not all investment products are protected"
    detail: |
      FSCS是覆盖英国全金融体系（存款/保险/投资/养老金/按揭咨询等）的统一补偿机构，非LSE或
      清算体系专属安排，但对英国上市证券的个人投资者而言，是投资中介机构（经纪商/投资顾问）
      倒闭时的主要事后救济渠道；与investor_protection常见的另一维度"市场层面的操纵/欺诈执法"
      是不同角度，后者见risks.enforcement_note（FCA对UK MAR违规的执法权力），两者互为补充、
      不合并。
    sources:
      - title: What we cover | Investments（FSCS官网）
        url: https://www.fscs.org.uk/what-we-cover/investments/
        accessed: 2026-08-24
    quote: "If you have an investment (or you were advised to invest) and the provider or adviser has gone out of business, you may be able to claim compensation with FSCS.／Compensation limits／If the firm failed after 1 Apr 2019 - up to £85,000 per eligible person, per firm.／If it failed between 1 Jan 2010 - 31 Mar 2019 - up to £50,000 per eligible person, per firm.／If it failed before 1 Jan 2010 - 100% of the first £30,000 and 90% of the next £20,000 up to £48,000 per eligible person, per firm."
    verified: 2026-08-24
    confidence: high

