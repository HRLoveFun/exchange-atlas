    en: "Hybrid: at its core a central electronic limit order book (Millennium Exchange) with continuous matching, running alongside two parallel registered market-maker regimes — market makers in order-driven instruments (SETS, IOB, etc.) quote Executable Quotes into the book, while quote-driven instruments (SETSqx, SEAQ, European Quoting Service — largely less liquid securities) rely on registered market makers providing Firm Quotes"
    detail: "enum 依据既有 market_maker_scheme（confidence high）明确记载的订单驱动 + 报价驱动双轨制与 matching_principle（价格优先、显示/非显示优先级）的已核实 quote 综合判定为 hybrid。"
    sources:
