    en: "No market-wide board-lot trading unit. The SETS order book is specified in number of shares; a per-instrument minimum order size is set in the Business Parameters document rather than as a uniform market-wide threshold"
    detail: "「无全市场整手」为消极认定——MIT201《Guide to the Trading System》通篇无 board lot / round lot 概念，只有逐证券的 minimum order size 参数（定义在未抓取的 Business Parameters 文档）。"
