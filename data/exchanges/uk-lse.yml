# ═══════════════════════════════════════════════
# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-14
    confidence: high

  regulator:
    zh: "金融行为监管局（Financial Conduct Authority, FCA）——作为英国上市监管机关（UK Listing Authority职能），维护官方名册（Official List）并制定UK Listing Rules（UKLR）"
    en: "Financial Conduct Authority (FCA) — acts as the UK Listing Authority, maintains the Official List and makes the UK Listing Rules (UKLR)"
    detail: "英国脱欧后，FCA以UKLR取代此前直接承接自欧盟《上市指令》体系的Listing Rules框架，2024年7月改革将官方名册下的上市类别由此前的Premium/Standard两级简化为单一“equity shares (commercial companies)”类别（见listing.review_system）。"
    sources:
      - title: Admission and Disclosure Standards（官网，术语表）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/admission_disclosure_standards.pdf
        accessed: 2026-08-14
      - title: UKLR UK Listing Rules sourcebook（FCA Handbook）
        url: https://api-handbook.fca.org.uk/files/sourcebook/UKLR.pdf
        accessed: 2026-08-14
    quote: "Official List — the list maintained by the FCA in accordance with section [...] Listing Rules — the Listing Rules of the FCA, which can be found in the FCA Handbook."
    confidence: high

  self_regulatory_org:
    zh: "伦敦证券交易所本身作为“认可投资交易所”（Recognised Investment Exchange, RIE），对市场准入交易与市场运作承担一线监管职责，须遵守FCA就RIE制定的监管手册（sourcebook）要求"
    en: "London Stock Exchange itself, as a Recognised Investment Exchange (RIE) under UK law, carries front-line responsibility for admission to trading and market operation, subject to the FCA's sourcebook for Recognised Investment Exchanges"
    detail: |
      与 UKLR（FCA作为官方名册/Listing Rules的监管者）是两套并行制度：RIE身份下交易所自身
      是Main Market/AIM/ISM/PSM等市场准入交易的一线监管方（体现在《Admission and
      Disclosure Standards》与《Rules of the London Stock Exchange》两份自订规则中），而
      官方名册（Official List）与上市持续义务由FCA依UKLR直接监管——这是"交易所自身兼一线
      监管"（如港交所）与"纯由外部机构监管"两种模式之外的第三种组合，与NYSE"交易所自身
      设专责部门+委托FINRA"的模式也不相同，是监管模式多样性的又一个真实样本（不是
      review_system 字段本身，该字段已按 DECISIONS.md ADR-023 归入 disclosure_with_discretion，
      本条讨论的是 self_regulatory_org 这个不同字段）。
    sources:
      - title: Admission and Disclosure Standards（官网）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/admission_disclosure_standards.pdf
        accessed: 2026-08-14
    quote: "The Exchange is a Recognised Investment Exchange under UK law. This means the Exchange must ensure that all securities admitted to trading on its markets, and all dealings in those securities are conducted in accordance with the primary and secondary market regulatory obligations set out in the FCA's sourcebook for Recognised Investment Exchanges."
    confidence: high

  clearing_regulator:
    zh: "中央对手方的审慎监管归属英格兰银行（Bank of England）：LCH 官方清算费率表自述『LCH Limited is supervised by the Bank of England within the UK regulatory framework』，并同时在美国 CFTC 注册为衍生品清算组织、依 EMIR 获第三国 CCP 认可；证券市场行为/上市监管仍属 FCA（见 regulator 字段）——即清算机构的审慎监督（BoE）与行为监管（FCA）分属两个机关"
    en: "Prudential supervision of central counterparties sits with the Bank of England: LCH's own clearing fee schedule states that 'LCH Limited is supervised by the Bank of England within the UK regulatory framework', while also registered as a derivatives clearing organisation with the U.S. CFTC and recognised as a third-country CCP under EMIR; conduct/listing regulation remains with the FCA (see the regulator field) — i.e. prudential CCP supervision (BoE) and conduct regulation (FCA) are split between two authorities"
    detail: "复核订正（ADR-074 流程）：原留空判断『未找到直接原文确认』已失效——同一批抓取的 LCH 清算费率表 PDF（settlement-fee-schedule）内即有『supervised by the Bank of England』原句（OPEN-QUESTIONS 第22条据此可关闭）。confidence high：LCH 官方文件自述其监管归属，属当事人对自身监管框架的一手陈述。"
    sources:
      - title: "LCH Ltd EquityClear settlement fee schedule（LCH 官方费率表 PDF，开头条款自述 supervised by the Bank of England）"
        url: https://www.lseg.com/content/dam/post-trade/en_us/documents/lch/resources/lch-ltd-equity-clear-settlement-fee-schedule-current-010724.pdf
        accessed: 2026-09-05
    quote: "LCH Limited is supervised by the Bank of England within the UK regulatory framework, registered as a derivatives clearing organisation with the U.S. Commodity Futures Trading Commission (\"CFTC\") and recognised as a third-country CCP under Regulation (EU) No. 648/2012"
    confidence: high
    detail: "英格兰银行（Bank of England）按常识应是英国中央对手方（CCP）的监管机关（UK EMIR框架下），但本次抓取范围内未找到直接原文确认这一点，按铁律不采纳未核实的印象，留空，见 OPEN-QUESTIONS。"

  core_laws:
    zh: "《2000年金融服务与市场法》（Financial Services and Markets Act 2000, FSMA）"
    en: "Financial Services and Markets Act 2000 (FSMA)"
    detail: "UKLR、DTR（Disclosure Guidance and Transparency Rules）、PRM（Prospectus Rules）等FCA Handbook内的具体规则手册均以FSMA为上位法律依据。"
    sources:
      - title: Admission and Disclosure Standards（官网，术语表）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/admission_disclosure_standards.pdf
        accessed: 2026-08-14
    quote: "FSMA — Financial Services and Markets Act 2000."
    confidence: high

  foreign_ownership_limit:
    zh: "英国对上市公司股权收购不区分收购方国籍设置一般性外资持股比例上限，而是采用以国家安全为由的个案审查机制：《2021年国家安全与投资法》（National Security and Investment Act 2021, NSI Act）规定，收购方持股或表决权比例跨越25%/50%/75%三档门槛、且标的实体从事列明的17个「敏感领域」业务时须强制向政府申报；政府可批准、附条件批准，极端情形下可阻止或撤销交易；未经批准即完成的强制申报交易在法律上无效，收购方可能面临民事或刑事处罚"
    en: "The UK does not impose a general statutory cap on foreign ownership of listed shares differentiated by the acquirer's nationality; instead it applies a case-by-case national security review. Under the National Security and Investment Act 2021 (NSI Act), an acquirer crossing the 25%/50%/75% shareholding or voting-rights thresholds in a qualifying entity carrying on activities in one of 17 defined 'sensitive' sectors must notify the government; the government may clear the acquisition, impose conditions, or in rare cases block or unwind it. Completing a notifiable acquisition without approval renders it void and may expose the acquirer to civil or criminal penalties."
    detail: |
      NSI Act条文本身以持股/表决权门槛与标的行业作为适用要件，未见区分收购方是否为外国主体的
      排除性条款——本次抓取范围内未找到"仅适用于外资"的官方限定表述，故如实按官方原文的中性
      表述处理，不主张这是专门的外资准入配额制度；但在政策语境与实务中，该制度通常被作为英国
      "外资安全审查"的对应机制引用（类似其他司法辖区的外资审查/CFIUS式安排）。主管机关是内阁
      办公室下设的投资安全部（Investment Security Unit, ISU），与regulation.regulator/
      self_regulatory_org记录的FCA/交易所自身监管体系是完全不同的另一条监管线，NSI Act本身
      也不特定针对LSE上市公司，覆盖全经济体的合资格实体收购。
    sources:
      - title: Check if you need to tell the government about an acquisition that could harm the UK's national security（gov.uk官方指引）
        url: https://www.gov.uk/guidance/national-security-and-investment-act-guidance-on-acquisitions
        accessed: 2026-08-24
    quote: "The government can scrutinise and intervene in certain acquisitions that could harm the UK's national security. They can impose certain conditions on an acquisition and in rare cases may unwind or block an acquisition completely.／If you are planning an acquisition of a qualifying entity in one of 17 defined sensitive areas of the UK economy, you may need to get approval from the government before you can complete it. This is called a notifiable acquisition. Completing a notifiable acquisition without approval will mean the acquisition is void and may mean that the acquirer is subject to civil or criminal penalties.／Your acquisition is in scope if your shareholding stake or voting rights increase: from 25% or less to more than 25% / from 50% or less to more than 50% / from less than 75% to 75% or more"
    verified: 2026-08-24
    confidence: high

  capital_controls:
    zh: "英国自1979年十月23日起全面撤销外汇管制，此后未再恢复：资本可自由跨境流动，外国货币的持有、买卖、境外投资（含全部外币证券投资）不受行政许可限制；这是本项目「英国无资本管制」这一常识性事实少见的、可逐字追溯到官方一手原文（英国议会官方发言记录 Hansard）的样本"
    en: "The UK abolished all remaining exchange controls with effect from midnight on 23 October 1979 and has not reinstated them since: capital moves freely across borders, and there is no administrative licensing restriction on holding, buying, retaining or using foreign currency, or on outward investment including all foreign-currency securities. This is one of the few instances in this project where the commonly-known fact that 'the UK has no capital controls' can be traced verbatim to an official primary record (Hansard, the UK Parliament's official record)."
    detail: |
      Chancellor of the Exchequer Sir Geoffrey Howe于1979年6月的预算声明中宣布逐步撤销外汇
      管制的意向，同年10月23日在下议院宣布即时撤销全部剩余管制（罗德西亚相关的极小范围例外
      除外，该例外本身也早已随历史情势变化而失去现实意义，未见后续恢复管制的记录）。这是
      "常识性事实"类字段里少有的、按CLAUDE.md铁律要求真正找到可摘引官方一手原文的案例——
      多数"某国无资本管制"这类背景性事实很难在近五十年内找到当次可抓取的原始宣告文本，
      英国因1979年撤销管制这一具体历史事件留下了议会官方记录，属于例外情况，不代表其他
      交易所同类字段也能类似地找到一手来源。
    sources:
      - title: EXCHANGE CONTROLS (Hansard, 23 October 1979)
        url: https://api.parliament.uk/historic-hansard/commons/1979/oct/23/exchange-controls
        accessed: 2026-08-24
    quote: "EXCHANGE CONTROLS (Hansard, 23 October 1979)／HC Deb 23 October 1979 vol 972 cc202-14／I have now decided to remove all the remaining exchange control restrictions from midnight tonight, apart from those still needed, I hope not for long, in relation to Rhodesia. With that single exception, there will from tomorrow be full freedom to buy, retain and use foreign currency for travel, gifts and loans to non-residents, buying property overseas and investment in all foreign currency securities. Portfolio investment will be wholly freed, and the requirement to deposit foreign currency securities with an authorised depositary is abolished."
    verified: 2026-08-24
    confidence: high

  disclosure_requirements:
    zh: "持续信息披露适用《披露指引与透明度规则》（Disclosure Guidance and Transparency Rules, DTR），与UKLR并列为FCA Handbook内的独立规则手册"
    en: "Ongoing disclosure obligations are set out in the Disclosure Guidance and Transparency Rules sourcebook (DTR), a separate FCA Handbook module alongside UKLR"
    detail: "具体披露频率/语言/渠道等细节本次未逐条核实DTR原文，只确认了该规则手册的存在与地位。"
    sources:
      - title: UKLR UK Listing Rules sourcebook（FCA Handbook）
        url: https://api-handbook.fca.org.uk/files/sourcebook/UKLR.pdf
        accessed: 2026-08-14
    quote: "[Note: Other parts of the Handbook that may also be relevant to issuers or sponsors include the Disclosure Guidance and Transparency Rules sourcebook (DTR), the Prospectus Rules: Admission to Trading on a Regulated Market sourcebook (PRM)..."
