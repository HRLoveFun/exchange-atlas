  capital_gains_tax:
    zh: "2026/27纳税年度（2026年4月6日起）个人股票资本利得税：落在基本税率所得区间内的部分按18%征收，超出基本税率所得区间的部分按24%征收（2024年10月30日预算案起，股票与其他非房产资产已与住宅物业统一适用同一档税率，此前股票适用更低的10%/20%）；年度免税额（Annual Exempt Amount）为£3,000/人；个人经营性公司股份处置符合条件的可适用「企业资产处置减免」（Business Asset Disposal Relief），税率自2025年4月6日起为14%，2026年4月6日起进一步升至18%"
    en: "For the 2026/27 tax year (from 6 April 2026), individuals' Capital Gains Tax on shares: 18% on gains falling within the basic Income Tax band, and 24% on gains above it (since the 30 October 2024 Budget, shares and other non-property assets have shared the same rates as residential property, having previously been taxed at lower 10%/20% rates); the Annual Exempt Amount is £3,000 per person; qualifying disposals of shares in a personal trading company may qualify for Business Asset Disposal Relief, taxed at 14% from 6 April 2025 and rising to 18% from 6 April 2026"
    detail: |
      本字段只覆盖个人（Income Tax意义上的自然人纳税主体）持有股票的资本利得税，公司/信托
      等主体适用不同税制（公司利得计入公司税应纳税所得额，未展开）；未纳入本字段的是"住房
      自用"等与本项目股票交易场景无关的豁免情形。
    sources:
      - title: "Capital Gains Tax: what you pay it on, rates and allowances（gov.uk官方页面）"
        url: https://www.gov.uk/capital-gains-tax/rates
        accessed: 2026-08-24
    quote: "If you're a higher or additional rate taxpayer, you'll pay 24% on your gains from 6 April 2026.／If you're a basic rate taxpayer, the rate you pay on gains you receive from 6 April 2026 depends on the size of your gain and your taxable income... If this amount is within the basic Income Tax band, you'll pay 18% on your gains made from 6 April 2026. For any amount above the basic Income Tax band, you'll pay 24% on gains made from 6 April 2026.／For the 2026 to 2027 tax year the allowance is £3,000"
    verified: 2026-08-24
    confidence: high

  dividend_withholding_tax:
    zh: "英国对股息不设源头预扣：HMRC 官方 helpsheet（HS300）明确非居民取得的英国投资收入「税负以源头扣缴额为限」，且英国公司股息列为「disregarded income」（不计入该限额计算的收入）——支付时不作源头扣缴，非居民实际不因英国股息在英国被预扣税款；居民个人的股息税通过年度申报/自我评估解决，与预扣机制无关"
    en: "The UK operates no withholding on dividends: HMRC's official helpsheet (HS300) states that for non-residents the tax charge on UK investment income is restricted to the amount of tax deducted at source, and UK company dividends are 'disregarded income' — dividends are paid gross with no deduction at source, so non-residents suffer no UK withholding on UK dividends; resident individuals settle dividend tax via self-assessment, unrelated to any withholding mechanism"
    detail: "原留空记录（『常识印象：英国股息通常无预扣』）本次以 HMRC HS300 一手坐实——『restricted to the amount of tax, if any, deducted at source』与『disregarded income includes ... dividends from UK companies』两处条文合成『无预扣』的正面依据。"
    sources:
      - title: "HS300 Non-residents and investment income (2025)（HMRC 官方 helpsheet，非居民投资收入税负限制与 disregarded income 列举）"
        url: https://www.gov.uk/government/publications/non-residents-and-investment-income-hs300-self-assessment-helpsheet/hs300-non-residents-and-investment-income-2025
        accessed: 2026-09-05
    quote: "the tax charge for non-residents on investment income arising in the UK is restricted to the amount of tax, if any, deducted at source. ... dividends from UK companies"
    confidence: medium

  implicit_costs_note:
    zh: "买卖价差（隐性成本的主要构成之一）在报价驱动品种上受交易所规则直接约束：注册做市商提供的可执行报价（Executable Quote）买卖价差须不小于一个最小报价单位（tick size），且不得超过就该证券设定的「最大价差百分比」（超出上限的报价会被系统拒绝，除非窄于「最大价差下限」）；具体的最大价差百分比数值定义在未抓取的Business Parameters文档内（与tick_size字段面临的数据缺口相同）"
    en: "Bid-ask spread — one of the main components of implicit trading cost — is directly constrained by Exchange rules for quote-driven instruments: a registered market maker's Executable Quote spread must be at least one tick size and no wider than a security-specific 'maximum spread percentage' (quotes exceeding this ceiling are rejected by the system, unless narrower than the maximum spread floor); the specific maximum-spread percentage values are defined in the Business Parameters document, which was not fetched this session — the same gap already noted for the tick_size field"
    detail: |
      本字段记录的是价差被规则约束的机制本身（做市商义务的一部分），而非市场实际观测到的
      平均买卖价差/冲击成本水平（后者需交易统计数据而非规则文本，本次未纳入抓取范围）。
      与market_structure.market_maker_scheme字段（订单驱动vs报价驱动两套做市商制度的
      整体介绍）互补，本字段聚焦"价差本身如何被规则量化约束"这一更具体的机制细节，quote
      来自不同章节段落，不与该字段重复。
    sources:
      - title: MIT201 – Guide to the Trading System Issue 15.8（官网，第5.6节）
        url: https://docs.londonstockexchange.com/sites/default/files/documents/mit201-guide-to-the-trading-system-15-8-20260119_0.pdf
        accessed: 2026-08-24
    quote: "Executable Quote maximum spread／The spread between the bid and offer prices must be at least one tick size and subject to the maximum spread floor no more than the maximum spread percentage specified for the relevant security. When validating maximum spreads, the absolute spread (offer less bid) is divided by the mid-price of the spread (offer plus bid, divided by two) to determine a percentage spread, which is assessed against the permitted maximum. Executable Quotes that are wider than the permitted maximum spread will be rejected unless it is less than the maximum spread floor. Details of the maximum spread percentage and maximum spread floor in place are contained in the Business Parameters document."
    verified: 2026-08-24
    confidence: high

