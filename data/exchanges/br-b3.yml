    maintenance_margin_practice:
      zh: "衍生品采用维持保证金：除初始保证金外，持仓按每日盈亏（逐日结算）调整，会员须维持账户余额覆盖敞口，保证金不足时需补足。"
      en: "Derivatives use maintenance margin: beyond initial margin, positions are adjusted by daily P&L (daily settlement), members must keep account balances covering exposure, and must top up if margin falls short."
