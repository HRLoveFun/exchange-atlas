  investor_structure:
    zh: "B3投资者结构以外国（非居民）投资者主导成交，机构（基金、养老、保险）次之，个人投资者（Pessoas Físicas）占账户多数但成交占比较低。B3《Boletim Ações》显示，截至2025年1月，股票个人投资者约388.7万户，外国投资者为成交主力。"
