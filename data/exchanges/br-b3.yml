  liquidity_risk_note:
    zh: "B3整体流动性良好，蓝筹股与指数期货成交活跃；但中小盘股、部分固定收益与场外产品流动性分化明显，极端事件（如2026年8月3日技术故障导致多市场停摆逾两小时）会暂时放大流动性风险。退市证券在过渡期后仍可临时交易，但长期流动性枯竭。"
    en: "B3 is generally liquid with active blue-chip and index-futures trading, but mid/small-cap equities and some fixed-income/OTC products show clear liquidity dispersion; extreme events (e.g., the 3 Aug 2026 technical outage that halted several markets for >2 hours) can temporarily amplify liquidity risk. Delisted securities may trade temporarily during the transition period but ultimately face liquidity evaporation."
    detail: "Liquidity is concentrated in index names; the 2026-08-03 outage illustrates operational liquidity risk."
    quote: "B3 said a “technical and isolated failure” in its post-trade operations forced it to delay the start of trading in several markets, in some cases by more than two and a half hours past the regular opening time."
