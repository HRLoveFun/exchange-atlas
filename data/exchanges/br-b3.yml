    margin_practice_note:
      zh: "开仓仅需按持仓总值的一定比例缴纳担保品（保证金），无需支付全额价值：担保品可用现金、政府债券、股票、银行存单（CDB）、信用证等形式缴纳，具体比例由B3按合约类型设定；日内交易的担保品比例由经纪商自行设定，隔夜持仓的担保品比例则由B3设定。本字段描述的是交易端投资者面对的担保品要求，区别于clearing.initial_margin_practice描述的CORE方法论清算端计算逻辑"
      en: "Opening a position requires only a collateral deposit equal to a percentage of the total position value, not the full amount; collateral may be posted in cash, government bonds, stocks, Bank Certificate of Deposit (CDB), letters of credit, etc., with the exact percentage set by B3 per contract type; the day-trade collateral percentage is set by the brokerage house, while the percentage for overnight positions is set by B3. This field describes the trading-side collateral requirement facing investors, distinct from clearing.initial_margin_practice's CORE-methodology clearing-side calculation"
      sources:
