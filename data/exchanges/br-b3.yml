    opening_mechanism:
      zh: "沿用顶层市场通用的「开盘前阶段」（Pre-opening phase）机制定义——只接受挂单、不做撮合，仅用于确定理论开盘价；该定义见于《交易规程手册》Title II「交易环境」章节，明确适用于「各组资产与衍生品」（in each group of assets and derivatives），非现货专属。指数期货类旗舰合约的开盘前阶段时长为5分钟（具体时刻见trading_sessions.pre_market）"
      en: "Reuses the same market-wide 'Pre-opening phase' definition as the top level — orders are accepted but not matched, used only to determine the theoretical opening price; this is defined in Title II ('Trading Environment') of the Trading Procedures Manual, explicitly applicable to 'each group of assets and derivatives', not cash-market-exclusive. For the flagship index futures, the pre-opening phase lasts 5 minutes (see trading_sessions.pre_market for the concrete clock time)"
      sources:
        - title: B3's Trading Procedures Manual（PDF）
          url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
          accessed: 2026-08-18
      quote: "Trading phases are previously defined periods for trading of various kinds in each group of assets and derivatives. ... Pre-opening phase: precedes trading in an instrument, with a specific duration and designed to assure the opening of trading at a fair and transparent price. Order registration is allowed but no trades are matched. Orders are used only to define the theoretical opening price in accordance with auction rules."
      confidence: high

    closing_mechanism:
      zh: "沿用顶层「收盘集合竞价」（Closing call phase）机制定义——以现货市场收盘前几分钟同样的定价规则透明收盘；指数期货类旗舰合约（IND/WIN）的收盘电子集合竞价（Electronic call）在18:25进行，个股/份额期货在17:55，期权市场则在16:55（个股/ETF期权）或16:50（指数期权）进入收盘集合竞价"
      en: "Reuses the top-level 'Closing call phase' definition — trading closes transparently using the same pricing rules as those used for the final minutes of regular trading; for the flagship index futures (IND/WIN) the closing Electronic call occurs at 18:25, for Single Stock, Units and ETFs Futures at 17:55, and the options market enters its closing call at 16:55 (single-stock/ETF options) or 16:50 (index options)"
      sources:
        - title: Trading Hours – Derivatives, Indices（B3 官网）
          url: https://www.b3.com.br/en_us/solutions/platforms/puma-trading-system/for-members-and-traders/trading-hours/derivatives/indices/
          accessed: 2026-08-18
        - title: Trading Hours – Derivatives, Single Stock and Units Futures（B3 官网）
          url: https://www.b3.com.br/en_us/solutions/platforms/puma-trading-system/for-members-and-traders/trading-hours/derivatives/single-stock-and-units-futures/
          accessed: 2026-08-18
      quote: "Ibovespa Futures FUT IND 09:00 (1) 18:25 (2) (4) - - 18:25 - - - - - -"
      confidence: high

    matching_principle:
      enum: price_time
      zh: "与现货市场共用同一套「资产与衍生品」统一撮合框架（《交易规程手册》Title II「交易环境」）：买卖盘经B3交易系统撮合成交，遵循已获授权参与者依交易规则登记的报单/交叉盘规则，同一撮合引擎不区分现货与衍生品（见顶层matching_principle的价格优先/时间优先撮合原则）"
      en: "Shares the same unified 'assets and derivatives' matching framework as the cash market (Title II, Trading Environment, of the Trading Procedures Manual): bids and asks are matched by B3's trading system per orders/cross orders registered by authorized participants under B3's trading rulebook; the same matching engine does not distinguish cash from derivatives (see top-level matching_principle for the price-priority/time-priority matching rule)"
      sources:
        - title: B3's Trading Procedures Manual（PDF）
          url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
          accessed: 2026-08-18
      quote: "Trading in assets and derivatives during trading sessions results from the matching of bids and asks or cross orders in B3's trading system registered by authorized participants in accordance with the provisions of B3's trading rulebook and this trading procedures manual."
      confidence: high

    order_types:
      zh: "基础订单类型集合与现货市场共用（市价单/限价单/管理单/自由裁量单等八种基础类型+MOA/MOC/LOC特殊撮合期订单+GTC/GTD有效期修饰符，见顶层order_types），其中GTC/GTD明确写明「直至该衍生品到期」这一衍生品专属失效条件。衍生品市场另有现货没有的「结构化交易」（Structured Transaction）订单类型，由系统自动生成配对腿——例如美元期货与即期美元反向对冲的「美元联动」（U.S. Dollar Casado）交易、跨两个到期月份联动的展期（Rollover）交易，以及DI1/DAP/FRC等利率期货专用的DV01/PU中性联动交易"
      en: "The base order-type set is shared with the cash market (Market/Limit/Managed/Discretionary etc. eight base types, plus auction-period MOA/MOC/LOC and GTC/GTD time-in-force qualifiers — see top-level order_types); GTC/GTD explicitly extend validity 'until the derivative expires', a derivatives-specific condition. The derivatives market additionally has 'Structured Transaction' order types not found in the cash market, which auto-generate paired legs — e.g. the 'U.S. Dollar Casado' (an inverse-hedge pairing of US Dollar Futures with US Spot Dollar), calendar-month Rollover transactions, and DV01/PU-neutral structured transactions on DI1/DAP/FRC interest-rate futures"
      sources:
        - title: B3's Trading Procedures Manual（PDF）
          url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
          accessed: 2026-08-18
      quote: "Good-till-cancel (GTC): remains active on the central order book until completely filled or canceled, until the occurrence of dividend distribution or other entitlements involving the asset, or until expiration (if a derivative); ... U.S. Dollar “Casado” creates an inverse nature execution in the first contract month available of the U.S. Dollar Futures (DOL) exchange rate, traded on the trading platform, and another execution of the same nature in the U.S. Spot Dollar with T+2 settlement, settled at the B3 Foreign Exchange Clearinghouse. ... The structured transaction of DV01 Neutral or PUA Neutral allows the simultaneous trading of two DI1, DAP or FRC maturities, in inverse nature (sell or buy), in quantities that neutralize the DV01 or PU measures of each of the two maturities of these contracts."
      confidence: high

    tick_size:
      zh: "以旗舰产品为例：迷你指数期货（WIN）最小变动价位为5个指数点（每点0.20雷亚尔）；个股期货最小报价单位为0.01点（每点1.00雷亚尔）；Ibovespa指数期权最小变动价位同为5个指数点（每点0.01雷亚尔）"
      en: "Flagship examples: Mini Ibovespa Futures (WIN) has a minimum price fluctuation of 5 index points (BRL0.20 per point); Stock Futures have a tick size of 0.01 points (BRL1.00 per point); Options on Ibovespa likewise have a minimum fluctuation of 5 index points (BRL0.01 per point)"
      sources:
