    price_limits:
      type:
        enum: dynamic_reference
        zh: "与现货市场共用同一套「交易隧道」（trading tunnels）动态参考价机制框架（拒绝隧道/拍卖隧道/保护隧道三类，见顶层price_limits.type），但衍生品的隧道中枢（tunnel center）采用「基准合约月」（pivot point）方法学动态更新：以流动性最高合约月份的实际成交价为基准，动态推算流动性较低合约月份的隧道中枢；期权隧道则改用波动率曲面（volatility surface）结合标的资产价格高低点代入认购/认沽期权定价公式得出隧道上下限"
        en: "Shares the same dynamic-reference 'trading tunnels' framework as the cash market (rejection / auction / protection tunnels, see top-level price_limits.type), but the tunnel center for derivatives is dynamically updated using a 'pivot point' contract-month methodology: actual trade prices in the most liquid contract month serve as the basis for dynamically deriving the tunnel center for less liquid contract months; for options, tunnels instead use volatility surfaces combined with the underlying's period price highs/lows fed into call/put option pricing formulas to derive the upper/lower tunnel limits"
        sources:
          - title: B3's Trading Procedures Manual（PDF）
            url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
            accessed: 2026-08-18
        quote: "The methodology uses the prices of actual trades in the most liquid contract months as a basis for dynamic updating of the reference price (tunnel center) to calculate auction and rejection tunnels for the less liquid contract months, as follows: I - Pivot point: the contract month considered most liquid and used as a basis for updating the other contract months, considered less liquid."
        confidence: high
      main_board:
        zh: ""
        confidence: low
        detail: "具体隧道带宽参数（更新百分比、最小带宽等）依合约类型逐一维护于B3官网，本次抓取到的规程手册正文未给出固定数值表，留空不猜（与顶层price_limits.main_board同一处理方式）。"
      other_boards:
        zh: ""
        confidence: low

    circuit_breaker:
      enum: index_level
      zh: "与顶层市场熔断机制（见market_structure.circuit_breaker）为同一套以Ibovespa跌幅触发的机制，规程原文明确写明覆盖范围包含衍生品：跌10%时全市场（含资产、衍生品与私募固定收益工具）暂停交易30分钟；恢复后再跌15%暂停1小时；恢复后再跌20%由B3自行决定暂停时长并公告"
      en: "The same Ibovespa-decline-triggered circuit breaker described at the top level (see market_structure.circuit_breaker) explicitly covers derivatives per the rulebook text: a 10% decline halts all trading (assets, derivatives and private fixed-income instruments) for 30 minutes; upon resumption, a 15% decline halts trading for 1 hour; upon resumption, a 20% decline lets B3 determine and announce the suspension period"
      sources:
        - title: Circuit breaker（官网新闻公告）
          url: https://www.b3.com.br/en_us/news/circuit-breaker-8AE490CA70CB10030170CEECFCE05EAF.htm
          accessed: 2026-08-18
      quote: "I - If the Ibovespa falls ten per cent (10%) from its closing level on the previous day, all trading in assets, derivatives and private fixed-income instruments is interrupted for thirty (30) minutes; II - When trading resumes, if the Ibovespa falls fifteen per cent (15%) from its closing level on the previous day, all trading in assets, derivatives and private fixed-income instruments is interrupted for one hour; III - When trading resumes, if the Ibovespa falls twenty per cent (20%) from its closing level on the previous day, B3 may determine a suspension of trading in assets, derivatives and private fixed-income instruments for a certain period to be announced by B3."
      confidence: high

    volatility_interruption:
      zh: "与顶层「拍卖隧道」自动触发集合竞价机制（见market_structure.volatility_interruption）为同一套通用触发逻辑，本身不区分现货与衍生品；衍生品的特有之处在于隧道中枢的计算方法——见上方price_limits.type的「基准合约月」（pivot point）动态更新方法学：用最活跃合约月份的成交价格反推流动性较低合约月份的隧道中枢"
      en: "Shares the same general auction-tunnel trigger logic as the top level (see market_structure.volatility_interruption), which does not itself distinguish cash from derivatives; the derivatives-specific distinction lies in how the tunnel center is calculated — see price_limits.type above for the 'pivot point' contract-month methodology, which derives the tunnel center for less-liquid contract months from the trade prices of the most liquid (pivot) contract month"
      sources:
        - title: B3's Trading Procedures Manual（PDF）
          url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
          accessed: 2026-08-18
      quote: "The methodology uses the prices of actual trades in the most liquid contract months as a basis for dynamic updating of the reference price (tunnel center) to calculate auction and rejection tunnels for the less liquid contract months, as follows: I - Pivot point: the contract month considered most liquid and used as a basis for updating the other contract months, considered less liquid."
      confidence: high

    trading_halt_mechanism:
      zh: "个股期权（options on equities）与标的现货股票共用同一套因发行人重大事项公告触发的分档停牌/复牌机制（具体时间窗口分档表见顶层trading_halt_mechanism），规程手册原文明确将该机制的适用范围写为「资产或个股期权」（an asset or option on equities）。此外，电子交易总监有权对资产与衍生品实施停牌，B3并可对与已停牌标的挂钩的衍生品启用专门交易安排以便平仓了结未平仓头寸"
      en: "Options on equities share the same tiered halt/resumption procedure triggered by an issuer's material-event notice as their underlying stocks (see the time-window table under the top-level trading_halt_mechanism); the Manual's own text frames this procedure's scope as 'an asset or option on equities'. Separately, B3's Director of Electronic Trading is empowered to suspend trading in assets and derivatives, and B3 may apply special trading procedures for derivatives referenced in suspended assets in order to close out open positions"
      sources:
        - title: B3's Trading Procedures Manual（PDF）
          url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
          accessed: 2026-08-18
      quote: "B3's Director of Electronic Trading, by delegation of its Chief Executive Officer (CEO), is empowered to suspend trading in assets and derivatives admitted to trading on organized markets in the situations specified by B3's rules and other normative documents. B3 may use special trading procedures for assets and derivatives referenced in suspended assets in order to close out open positions in derivatives, informing the market of the procedures to be used in notices. ... If trading in an asset or option on equities is suspended due to the publication or imminent publication of a material event notice during a trading session, in accordance with the provisions of B3's trading rulebook, issuer listing and securities admission for trading rulebook and issuer manual, the following procedures will apply."
      confidence: high

    block_trade:
