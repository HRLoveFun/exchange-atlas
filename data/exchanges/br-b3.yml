  account_opening_requirements:
    zh: "非居民投资者须依CMN 4.373号决议开立「4.373账户」：指定巴西本地法定代表人、税务代表、托管机构，并向CVM完成电子登记（获发CNPJ税号，一般在申请后24小时内下发），再通过本地经纪商开户方可交易"
    en: "Non-resident investors must open a '4.373 Account' under CMN Resolution 4.373: appointing a Brazil-based legal representative, tax representative and custodian, completing electronic registration with CVM (which issues a CNPJ tax ID typically within 24 hours), then opening an account with a local brokerage house"
    sources:
      - title: Trading equities, derivatives and fixed income - CMN 4.373/2014
