  maintenance_margin_practice:
    zh: "现货（现金）市场采用维持保证金机制：因现金市场风险仅在结算周期内评估，清算所要求会员在整个结算周期维持足额担保品以覆盖风险敞口，不足时追加。"
    en: "The cash/spot market uses a maintenance margin mechanism: because cash market risk is assessed only over the settlement cycle, the clearinghouse requires members to maintain adequate collateral covering the exposure throughout the settlement cycle, with top-up calls if deficient."
