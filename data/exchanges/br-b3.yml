  dividend_withholding_tax:
    zh: "官方法律原文（巴西联邦立法门户 planalto.gov.br 刊载的《第15.270/2025号法律》全文）第3条修订《9.249/1995号法律》第10条，新增第4款明确规定：支付、记入、交付、使用或汇往国外的利润或股息，须按10%税率缴纳预扣所得税；第8条规定该法自公布之日起施行、自2026年1月1日起产生效力。B3官网非居民投资者税务页（本次同一时点重新抓取核实，内容未变）仍写「利润分配与股息免税」，两者存在冲突——按CLAUDE.md来源优先级（官方法律原文 > 交易所官网说明页），且法律原文属一手立法文本，故以法律原文为准：非居民股息预扣税税率为10%，自2026年1月1日起施行，B3官网页面尚未更新反映这一变化"
    en: "The official law text (Law No. 15.270/2025, full text hosted on Brazil's federal legislation portal planalto.gov.br) amends Law No. 9.249/1995 Art. 10 via its Art. 3, adding a new §4 stating that profits or dividends paid, credited, delivered, used, or remitted abroad are subject to withholding income tax at a rate of 10%; Art. 8 states the law enters into force on its publication date and takes effect from 1 January 2026. B3's official non-resident taxation page (re-fetched this session, unchanged) still states dividends and profit distributions are tax-exempt — the two sources conflict. Per CLAUDE.md's source-priority rule (official law text ranks above an exchange's own explainer page), and given the law text is a first-hand legislative document, the law text is adopted as authoritative: the non-resident dividend withholding tax rate is 10%, effective 1 January 2026; B3's own page has not yet been updated to reflect this"
    detail: |
      本条此前的悬案（B3官网称免税、第三方税务简报称已立法10%预扣税，未逐条核实）已解决。
      本次直接 curl 抓取巴西总统府法务顾问办公室（Casa Civil）维护的联邦法律现行文本门户
      www.planalto.gov.br 上《第15.270/2025号法律》全文（该门户是巴西联邦法律正式公布/
      现行文本的权威来源，非第三方转述），法律原文第3条对《9.249/1995号法律》第10条的
      修订新增了针对汇往境外利润/股息的10%预扣税条款（第4款），并列出了过渡期豁免情形
      （第5款：2025年12月31日前已批准分配、且计入2025及以前年度经营成果的部分予以豁免，
      过渡期至2028年；以及外国政府、主权基金、境外养老金管理机构等特定对象豁免）。第8条
      明确生效时点为2026年1月1日。B3官方页面未见更新，判断为交易所说明页滞后于最新立法，
      而非法律尚未生效。
    sources:
      - title: Lei nº 15.270, de 26 de novembro de 2025（联邦法律现行文本，权威来源）
        url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15270.htm
        accessed: 2026-08-20
      - title: Non-resident Investor – Taxation（B3官网原文，与法律原文冲突的一方，用于说明差异）
        url: https://www.b3.com.br/en_us/non-resident-investor/characteristics-brazilian-market/taxation.htm
        accessed: 2026-08-20
    quote: "§ 4º Os lucros ou dividendos pagos, creditados, entregues, empregados ou remetidos ao exterior ficarão sujeitos à incidência do imposto de renda na fonte à alíquota de 10% (dez por cento). [...] Art. 8º Esta Lei entra em vigor na data de sua publicação e produzirá efeitos a partir de 1º de janeiro de 2026."
    confidence: high

  implicit_costs_note:
    zh: "除显性费用（交易费约0.00500%、CCP清算费约0.02240%、经纪佣金、IOF 0%/所得税）外，B3现货市场隐性成本主要来自买卖价差与结算周期（交易日后第二个工作日）的资金占用；蓝筹股与指数期货流动性好、价差窄。逐日盯市仅适用于衍生品，现货无盯市追加成本。"
    en: "Beyond explicit fees (trading ~0.00500%, CCP clearing ~0.02240%, broker commission, IOF 0%/income tax), the main implicit cost in B3's spot market is the bid-ask spread and the funding cost of the T+2 settlement cycle; blue chips and index futures are liquid with tight spreads. Daily mark-to-market applies only to derivatives, so spot has no margin-call implicit cost."
    detail: "B3 spot fee schedule rates used for the explicit-fee illustration; the T+2 settlement cycle is the main implicit funding cost for spot."
    quote: "Monthly ADTV(BRL million) Trading fee CCP fee Asset transfer fee Total ... 0 3 0.00500% 0.02240% 0.0026% 0.0300%; Cash Market risk assessed only for the settlement cycle: from trade date until settlement"
    sources:
