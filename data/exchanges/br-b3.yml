    detail: "Foreign investors are the largest by traded volume (often >50%); individuals are a growing but minority volume share. Exact % split (foreign ~62%, institutional ~21%, individual ~17% by volume in the Boletim) to be confirmed from Boletim Ações 01M25."
    quote: ""
    sources:
      - url: https://www.b3.com.br/data/files/A4/C4/EF/D2/E11F491029BEEC39AC094EA8/Boletim%20Acoes%20-%2001M25.pdf
