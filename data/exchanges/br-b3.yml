        - title: Stock Futures（B3 官网）
          url: https://www.b3.com.br/en_us/products-and-services/trading/equities/cash-equities/stock-futures.htm
          accessed: 2026-08-18
        - title: Options on Ibovespa（B3 官网）
          url: https://www.b3.com.br/en_us/products-and-services/trading/equities/options-on-ibovespa.htm
          accessed: 2026-08-18
      quote: "The contract size is the amount of Ibovespa points multiplied by BRL0.20 and its minimum variation is 5 index points."
