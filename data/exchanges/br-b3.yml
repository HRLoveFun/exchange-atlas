          accessed: 2026-08-16
      quote: "the CORE methodology employs three different calculation modules: CORE0: risk calculation for transactions allocated to the final investor. CORE1: risk calculation for non-allocated transactions. CORE2: risk calculation for transactions allocated to the Full Trading Participant/settlement participant (on behalf of final investor)."
      confidence: high
