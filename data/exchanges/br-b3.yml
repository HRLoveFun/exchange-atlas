      en: "Shares the same registration regime as the top-level market_maker_scheme (independent market makers / independent market makers accredited for B3 programs / contracted market makers, with investment funds also eligible to register as independent market makers); the Manual's own text sets the market-maker headcount cap separately 'for each type or class of derivative', meaning this framework is itself asset-and-derivative-generic rather than the derivatives market running a distinct scheme"
