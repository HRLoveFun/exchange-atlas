      zh: "以CORE（Closeout Risk Evaluation）方法论计算所需担保品（保证金），分三个计算模块：CORE0（已分配至最终投资者的交易）、CORE1（未分配交易）、CORE2（分配至全权/结算参与者的交易）；担保品可用现金或多类金融资产（如国债、银行存单CDB、不动产信贷凭证LCI等）出质"
      en: "Required collateral (margin) is computed via the CORE (Closeout Risk Evaluation) methodology across three modules — CORE0 (allocated to the final investor), CORE1 (unallocated), CORE2 (allocated to the Full Trading Participant/settlement participant); collateral may be posted in cash or various financial assets (e.g. government bonds, bank CDs, real-estate credit notes)"
      sources:
