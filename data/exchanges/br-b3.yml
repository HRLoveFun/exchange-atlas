# B3 – Brasil, Bolsa, Balcão
# 抓取来源见 PROJECT/SOURCES.md `br-b3` 一节；原始页缓存于 .cache/br-b3/
# source_lang: en——B3官网原文为葡萄牙语，但没有可核实的官方中文版；按 ADR-013「无中选英」，
# b3.com.br/en_us 路径下的官方英文版是溯源锚点，zh 是翻译展示。葡萄牙语本身不是 zh/en
# 二选一之外的第三态：官方英文页面本身就是可核实的官方原文（非机器翻译），可以直接引用。
# 无 group_id：B3 是巴西唯一的证券/期货交易所，由 2017 年 BM&FBOVESPA 与 Cetip 合并而成，
# 是最终控股主体本身（B3自身即在自己管理的 Novo Mercado 板块挂牌，代码 B3SA3）——未发现类似
# NYSE Group / JPX Group 那样同集团下辖多个独立注册交易所法人实体的结构。
# 拉美首个样本，压测点：CVM 监管框架、"交易隧道"(trading tunnel) 式动态价格限制（区别于
# SSE/HKEX 的固定百分比涨跌停，也不同于 NYSE 的 LULD）、B3 自身身兼 CCP+CSD 双重职能（未
# 拆分为独立法人，与美股 DTCC/NSCC 模式不同）。

id: br-b3
name_zh: 巴西B3交易所
name_native: {pt: "B3 S.A. – Brasil, Bolsa, Balcão", en: "B3 S.A. – Brasil, Bolsa, Balcão (B3)"}
official_languages: [pt-BR]
source_lang: en
region: americas

