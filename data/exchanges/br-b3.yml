  political_risk_note:
    zh: "巴西为联邦民主共和国，政策与监管环境总体稳定但受选举周期与财政/税制改革影响；国有企业（如Petrobras、Banco do Brasil、Eletrobras）在指数中权重较大，其治理与政治干预风险可能影响市场。整体属新兴市场政治风险，但CVM/B3监管框架成熟。"
    en: "Brazil is a federal democracy; policy and regulatory settings are broadly stable but subject to electoral cycles and fiscal/tax reforms. State-owned enterprises (e.g., Petrobras, Banco do Brasil, Eletrobras) carry meaningful index weight, and governance/political-intervention risk can affect the market. Overall an emerging-market political risk, but the CVM/B3 regulatory framework is mature."
    detail: "No exchange-level seizure risk; risk is country-level policy/SOE governance."
