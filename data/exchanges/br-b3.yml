  closing_mechanism:
    zh: "收盘集合竞价（Closing Call）：16:55–17:00"
    en: "Closing Call: 16:55–17:00"
    quote: "Trading Closing Call After-Market trading ... 10:00 16:55 16:55 17:00"
    confidence: high

  matching_principle:
    zh: "连续交易按价格优先、报单先后时间顺序（chronological order of entry）撮合；集合竞价按能匹配最大成交量的价格确定理论价，价格相同再依失衡量最小与最近成交价接近程度决胜"
    en: "Continuous trading matches on price priority and chronological order of entry; auctions determine the theoretical price as the one matching the largest quantity, with ties broken by the smallest resulting imbalance and proximity to the last traded price"
    sources:
      - title: B3 Trading Characteristics and Rules
        url: https://www.b3.com.br/en_us/products-and-services/trading/equities/cash-equities/b3-trading-characteristics-and-rules.htm
        accessed: 2026-08-16
    quote: "LOC orders do not have priority over other types of orders or order qualifiers and always compete based on price priority and chronological order of entry"
