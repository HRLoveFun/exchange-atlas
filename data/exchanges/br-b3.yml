    en: "CMN Resolution 4.373 is the primary channel, giving non-resident investors access to the same range of products available to local investors; CMN Resolution 2.687 separately governs commodities trading; simplified registration (CVM Rule 419, issued 2005) is available for qualified investors whose local representatives have a formal relationship with overseas representatives, from jurisdictions whose securities regulators are signatories to the IOSCO MMOU with CVM"
