      after_market:
        zh: "本文件已收录的旗舰合约（Ibovespa/迷你指数期货、个股期货、S&P 500期货）在B3官方交易时段表中「Extended hours (T+0)」栏位均为空，即无独立盘后延长时段；但部分挂钩欧洲股指的合约（如DAX期货/Euro Stoxx期货）确有12:40–18:00的延长时段用于衔接欧美市场；期权市场另有独立的盘后交易窗口（AHT，与现货共用，具体时刻见顶层after_market）"
        en: "For the flagship contracts covered in this file (Ibovespa/Mini Ibovespa Futures, single-stock futures, S&P 500 Futures), B3's trading-hours table shows no populated 'Extended hours (T+0)' column, i.e. no separate after-market session; some other contracts tracking European indices (e.g. DAX Futures / Euro Stoxx Futures) do have a 12:40-18:00 extended window bridging into European/US hours; the options market has its own after-market window (AHT, shared with the cash market, see top-level after_market for the clock times)"
        sources:
          - title: Trading Hours – Derivatives, Indices（B3 官网）
            url: https://www.b3.com.br/en_us/solutions/platforms/puma-trading-system/for-members-and-traders/trading-hours/derivatives/indices/
            accessed: 2026-08-18
        quote: "DAX Futures FUT DAX 09:00 (1)(2) 12:20 12:27 12:30 12:30 - - 12:40 18:00 - -"
        confidence: high
      night_session:
        zh: "《交易规程手册》Title II「交易环境」定义了市场通用的三段式框架——常规交易时段/盘后延长时段/收市后T+1时段，T+1时段的成交于次一营业日登记、日盯市保证金于T+2现金结算；但本文件已收录的旗舰合约（Ibovespa/迷你指数期货IND/WIN、个股期货）在B3官方交易时段表中「After-hours (T+1)」栏位均为空，即未见对这些合约开放T+1夜盘交易，T+1机制主要见于利率、大宗商品等其他品类合约"
        en: "Title II ('Trading Environment') of B3's Trading Procedures Manual defines a market-wide three-part session framework — regular trading period / after-market (extended-hours) period / after-hours (T+1) period — under which T+1 trades are registered on the next business day and daily variation margin is cash-settled on T+2; however, the flagship contracts covered in this file (Ibovespa/Mini Ibovespa Futures IND/WIN, single-stock futures) show no populated 'After-hours (T+1)' column in B3's trading-hours table, i.e. no T+1 night session for these contracts; the T+1 mechanism mainly applies to other segments such as interest-rate and commodity contracts"
        sources:
          - title: B3's Trading Procedures Manual（PDF）
            url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
            accessed: 2026-08-18
          - title: Trading Hours – Derivatives, Indices（B3 官网）
            url: https://www.b3.com.br/en_us/solutions/platforms/puma-trading-system/for-members-and-traders/trading-hours/derivatives/indices/
            accessed: 2026-08-18
        quote: "Before the start of the after-hours period, all orders with validity for the day are canceled by B3. Trades executed during after-hours periods are registered on the business day subsequent to the day of their execution (T+1), and daily variation margin is cash-settled on the second business day after execution (T+2), in accordance with the clearinghouse's rules."
        confidence: high

