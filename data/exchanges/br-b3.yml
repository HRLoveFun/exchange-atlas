  # 衍生品市场机制：B3自身运营期货/期权业务线（见第四章products的br-b3-options/br-b3-futures），
  # 本子块裁剪自本章顶层字段集合，见 schema/taxonomy.yml market_structure.derivatives 与
  # PROJECT/DECISIONS.md [ADR-019]。样本以Ibovespa期货/迷你指数期货（FUT IND/WIN）、个股期货、
  # Ibovespa指数期权为代表，均为第四章已列出的具体产品。
  derivatives:
    trading_sessions:
      pre_market:
        zh: "衍生品市场没有统一的「开市前议价」时段，具体因产品而异：指数期货类旗舰合约（Ibovespa期货FUT IND/迷你指数期货FUT WIN）在09:00常规时段开盘前5分钟（即08:55）设开盘前阶段；期权市场（个股/ETF/指数期权）则沿用现货市场同一套09:30–09:45撤单、09:45–10:00开盘前集合竞价的安排（见顶层trading_sessions.pre_market）"
        en: "No unified pre-market period across the derivatives market as a whole; it varies by product: the flagship index futures (Ibovespa Futures FUT IND / Mini Ibovespa Futures FUT WIN) have a pre-opening phase starting 5 minutes before the 09:00 regular-session open (i.e. from 08:55); the options market (single-stock/ETF/index options) instead reuses the cash market's own 09:30-09:45 order-cancellation + 09:45-10:00 pre-opening call window (see top-level trading_sessions.pre_market)"
        sources:
          - title: Trading Hours – Derivatives, Indices（B3 官网）
            url: https://www.b3.com.br/en_us/solutions/platforms/puma-trading-system/for-members-and-traders/trading-hours/derivatives/indices/
            accessed: 2026-08-18
        quote: "Ibovespa Futures FUT IND 09:00 (1) 18:25 (2) (4) - - 18:25 - - - - - - ... (1) The pre-opening phase starts 5 minutes before the trading phase."
        confidence: high
      continuous_am:
        zh: "指数期货类旗舰合约（IND/WIN）自09:00起连续交易，无独立上午/下午分段，直至18:25收盘电子集合竞价（见continuous_pm）；B3官网概括性说法为多数衍生品合约交易时段在上午9时至下午6时之间，具体因合约类型而异"
        en: "The flagship index futures (IND/WIN) trade continuously from 09:00, with no separate morning/afternoon split, through to the 18:25 electronic closing call (see continuous_pm); B3's own general statement is that most derivatives contracts trade between 9 AM and 6 PM, varying by contract type"
