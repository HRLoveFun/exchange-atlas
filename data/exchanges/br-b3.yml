            url: https://www.b3.com.br/en_us/products-and-services/trading/equities/cash-equities/trading-dynamics.htm
            accessed: 2026-08-18
        quote: "Ibovespa Futures FUT IND 09:00 (1) 18:25 (2) (4) - - 18:25 - - - - - -"
        confidence: high
      lunch_break:
        zh: "无：指数期货、个股期货均为单一连续交易时段（09:00至收盘），不设午间休市；期权市场同样沿用现货市场无午休的连续交易安排（见顶层lunch_break）"
        en: "None: index futures and single-stock futures both run as a single continuous session (09:00 to close) with no midday break; the options market likewise follows the cash market's no-lunch-break continuous arrangement (see the top-level lunch_break)"
        confidence: medium
      continuous_pm:
        zh: "延续continuous_am的单一连续时段直至电子集合竞价收盘：指数期货类旗舰合约（IND/WIN）18:25；个股/份额期货（Single Stock, Units and ETFs Futures）17:55；期权市场（个股/ETF期权）连续交易至16:55、指数期权至16:50，其后进入收盘集合竞价（见closing_mechanism）"
        en: "Continues the single continuous session from continuous_am through to the electronic closing call: 18:25 for the flagship index futures (IND/WIN); 17:55 for Single Stock, Units and ETFs Futures; the options market (single-stock/ETF options) trades continuously to 16:55 and index options to 16:50, after which the closing call begins (see closing_mechanism)"
        sources:
