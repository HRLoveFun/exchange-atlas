    quote: "B3 is the result of the merger between BM&FBOVESPA S.A. – Bolsa de Valores, Mercadorias e Futuros (“BM&FBOVESPA”) and Cetip S.A. – Mercados Organizados (“Cetip”), consummated on March 29, 2017."
    confidence: high

  history:
    zh: "2008年BM&F（衍生品交易所）与Bovespa Holding合并组成BM&FBOVESPA；2017年BM&FBOVESPA与Cetip（原场外市场基础设施公司）合并组成现在的B3"
    en: "2008: BM&F (derivatives exchange) merged with Bovespa Holding to form BM&FBOVESPA; 2017: BM&FBOVESPA merged with Cetip (former OTC market infrastructure company) to form today's B3"
    detail: |
      Cetip前身1984年作为非营利组织成立（有巴西央行支持），2008年转为营利性股份公司，2009年
      上市，2011年ICE入股。2016年BM&FBOVESPA与Cetip董事会批准合并方案，2017年获巴西央行、
      CVM与经济保护行政委员会（Cade）批准生效。这条并购路径与NYSE"会员制改公司制后再被收购"
      不同，是"多家已各自公司化/上市的机构横向合并"的模式。PUMA Trading System（现主撮合
      引擎）由BM&FBOVESPA与CME集团合作开发，2011年起分阶段上线，2016年BM&FBOVESPA与CME
      的战略合作关系终止。
    sources:
      - title: History - B3（投资者关系站）
        url: https://ri.b3.com.br/en/b3/history/
        accessed: 2026-08-16
    quote: "BM&FBOVESPA 2008 BM&FBOVESPA is born, from the merger between BM&F and Bovespa Holding. ... 2017 The business combination between BM&FBOVESPA and Cetip is approved by the regulators: Central Bank, Brazilian Securities Commission (CVM) and Administrative Council for Economic Defense (Cade). Thus starts the history of B3."
    confidence: high

