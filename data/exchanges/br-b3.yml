    contract_specs_note:
      zh: "三类旗舰产品举例：①迷你指数期货（WIN）——合约规模为Ibovespa点数×0.20雷亚尔/点，最小变动5个指数点，到期月份为双月（2/4/6/8/10/12月），到期日为合约月15日最近的星期三，整手为1张迷你合约；②个股期货——代码结构为「公司代码+品类+到期月+到期年」，合约规模为1股，以点数报价（每点1.00雷亚尔），最小报价单位0.01点，整手100张合约，逐月到期，现金结算（不涉及标的股票实物交收）；③Ibovespa指数期权——标的为Ibovespa指数，欧式行权，合约规模为指数点数×0.01雷亚尔/点，最小变动5个指数点，整手1张合约，到期日为合约月15日最近的星期三（遇假日顺延至次一营业日），全部月份均有合约挂牌；到期日的自动履约由B3执行——认购期权在Ibovespa结算价高于行权价时自动行权，认沽期权在结算价低于行权价时自动行权。更广义地，B3期货市场划分为利率/汇率/股指/大宗商品四大品类，多数合约现金结算，少数存在实物交割"
      en: "Three flagship examples: (1) Mini Ibovespa Futures (WIN) — contract size is Ibovespa points x BRL0.20/point, minimum fluctuation 5 index points, expiration in even months (Feb/Apr/Jun/Aug/Oct/Dec), last trading day the Wednesday nearest the 15th of the contract month, round lot 1 minicontract; (2) Stock Futures — ticker structured as company code + type/class + contract month + contract year, contract size 1 share, quoted in points (BRL1.00 per point), tick size 0.01 points, round lot 100 contracts, monthly expiration, cash-settled (no physical delivery of the underlying share); (3) Options on Ibovespa — underlying is the Ibovespa index, European-style exercise, contract size is index points x BRL0.01/point, minimum fluctuation 5 index points, round lot 1 contract, last trading day the Wednesday nearest the 15th of the contract month (rolled to the next business day if a holiday), listed for all contract months; automatic exercise on the expiration date is carried out by B3 — calls are exercised automatically if the Ibovespa settlement price exceeds the strike, puts if the settlement price is below the strike. More broadly, B3's futures market spans four segments — interest rate, currencies, stock indices and commodities — with most contracts cash-settled and some physically delivered"
      sources:
        - title: Ibovespa Futures（B3 官网，正文详述迷你指数期货WIN合约规格）
          url: https://www.b3.com.br/en_us/products-and-services/trading/equities/cash-equities/ibovespa-futures.htm
