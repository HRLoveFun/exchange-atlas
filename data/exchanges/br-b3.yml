  opening_mechanism:
    zh: "开盘集合竞价（Opening Call）：09:45–10:00为盘前阶段，只挂单不成交，用于形成开盘理论价格"
    en: "Opening Call: the 09:45–10:00 pre-opening phase accepts order entry without matching, used to form the theoretical opening price"
    quote: "Order cancellation Pre-opening Trading ... Cash Market, Odd lots market, Investment Funds and OTC Market 09:30 09:45 09:45 10:00 10:00 16:55 ... Pre-opening phase: precedes trading in an instrument, with a specific duration and designed to assure the opening of trading at a fair and transparent price. Order registration is allowed but no trades are matched. Orders are used only to define the theoretical opening price in accordance with auction rules."
