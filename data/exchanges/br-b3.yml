    en: "B3 Clearinghouse collects initial margin for the cash/spot market. Cash market risk is assessed only for the settlement cycle (from trade date until settlement), and Clearing Members, Brokers or Clients may pledge collateral for cash market risk."
    detail: "B3 Guide for Nonresident Investors, 'Cash Market Collateralization in the B3 Clearinghouse'. The spot market is not margin-traded in the derivatives sense; collateral covers settlement-cycle risk."
