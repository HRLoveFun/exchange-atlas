    en: "Once listing/admission is cancelled, per B3's Issuers Regulation the securities 'shall no longer be traded' on any B3-operated Organized Market (encompassing both the exchange market and the organized OTC market, Balcão B3). B3 separately operates the Balcão B3 electronic OTC platform for unlisted assets, but a delisted issuer's securities are barred from B3-operated trading; any subsequent transfer occurs off-exchange via bilateral OTC outside B3."
    detail: "Balcão B3 is B3's organized OTC venue for assets not admitted to the exchange; a delisted security is excluded from BOTH the exchange and Balcão B3 per Art. 71."
    quote: "Once a voluntary cancellation has been authorized or the cancellation of the Issuer's Listing or its Admission to Trading has been communicated, the securities issued by it shall no longer be traded; O Capítulo V trata do Mercado de Balcão Organizado de negociação eletrônica (Plataforma de Negociação de Balcão B3)"
    sources:
