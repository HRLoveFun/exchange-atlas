  circuit_breaker:
    enum: index_level
    spec: {type: index_level, reference: [{index: "Ibovespa", exchange: self}], levels: [{threshold_pct: 10, halt_minutes: 30}, {threshold_pct: 15, halt_minutes: null}, {threshold_pct: 20, halt_minutes: null, day_end: false}], note: "跌幅相对前一交易日收盘；二档暂停 1 小时（原文「one hour」未给数字）；三档暂停时长由 B3 自定并公告；全市场（资产/衍生品/私募固收）联动"}
    zh: "指数级熔断：以Ibovespa较前一交易日收盘的跌幅触发，分三档——跌10%暂停全市场交易30分钟；恢复后再跌15%暂停1小时；恢复后再跌20%由B3自行决定暂停时长并公告"
    en: "Index-level circuit breaker triggered by Ibovespa's decline from the prior close, in three stages: -10% halts all trading for 30 minutes; upon resumption, -15% halts trading for 1 hour; upon resumption, -20% lets B3 determine and announce the suspension period"
    sources:
      - title: Circuit breaker（官网新闻公告）
        url: https://www.b3.com.br/en_us/news/circuit-breaker-8AE490CA70CB10030170CEECFCE05EAF.htm
        accessed: 2026-08-16
    quote: "I - If the Ibovespa falls ten per cent (10%) from its closing level on the previous day, all trading in assets, derivatives and private fixed-income instruments is interrupted for thirty (30) minutes; II - When trading resumes, if the Ibovespa falls fifteen per cent (15%) from its closing level on the previous day, all trading in assets, derivatives and private fixed-income instruments is interrupted for one hour; III - When trading resumes, if the Ibovespa falls twenty per cent (20%) from its closing level on the previous day, B3 may determine a suspension of trading in assets, derivatives and private fixed-income instruments for a certain period to be announced by B3."
    confidence: high

  volatility_interruption:
    spec: {note: "品种级「拍卖隧道」（auction tunnel）：撮合价将突破基于最近成交价动态计算的区间时，自动触发一次集合竞价而非直接成交；区间参数逐品种、无公开统一表"}
    zh: "品种级的「拍卖隧道」（auction tunnel）机制：撮合价若将突破基于最近成交价动态计算的价格区间，系统不直接成交，而是自动触发一次集合竞价"
    en: "Instrument-level 'auction tunnel' mechanism: when a prospective trade price would breach the dynamically computed band around the last traded price, the system does not execute directly but automatically triggers an auction"
    sources:
      - title: B3's Trading Procedures Manual（PDF）
        url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
        accessed: 2026-08-16
    quote: "Auction tunnels are an enhancement of the current intraday fluctuation limits. After a trade is executed, while its conformity to the intraday fluctuation limits is verified, the auction tunnels activate, at the imminence of the trade execution, an automatic auction in the trading system if the trade price is not within the price interval defined by the tunnel."
    confidence: high

  trading_halt_mechanism:
    zh: "除熔断与隧道机制外，若发行人在交易时段内发布或即将发布重大事项公告，B3按公告发生的时点分五档窗口（如9:15前/9:15–9:29/9:30–9:59/10:00–16:09/16:10–16:49），分别延后撤单阶段、开盘集合竞价，或直接暂停交易20分钟后再进行撤单与重新开盘拍卖"
    en: "Beyond circuit breakers and tunnels, if an issuer publishes or is about to publish a material-event notice during a session, B3 applies a tiered procedure across five time windows that postpones order-cancellation phases and the opening call, or suspends trading for 20 minutes followed by an order-cancellation phase and a reopening auction"
    sources:
      - title: B3's Trading Procedures Manual（PDF）
        url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
        accessed: 2026-08-16
    quote: "9:15:00-9:29:59 a.m. Postponement of order cancellation phases for twenty (20) minutes, followed by: Order cancellation phase lasting five minutes / Opening call lasting at least five minutes"
    confidence: high

  error_trade_rule:
    spec:
      bust_allowed: true
      review_window_min: 10
      deviation_threshold_pct: null
      resolution: cancel
      note: "因严重操作错误（severe operating error）单方申请作废：须在成交登记后 10 分钟内电话通知 B3，并于当日交易时段结束前用 B3 提供的表单正式提交。除交易规则另有规定外，B3 依职权或应申请作废该类成交，仅当该成交造成的实际或潜在财务损失 ≥ 1,000 万巴西雷亚尔（BRL 10,000,000）。B3 应申请作废时，收到请求后 20 分钟内尽力执行。B3 可对责任方处罚款——不低于损失的 20%、不超过 BRL 5,000 万。事前防线：盘中波动限制 + type 1/2/4 拒单隧道 + 拍卖隧道"
    zh: "因『严重操作错误（severe operating error）』的单方作废申请：会员须在成交登记后 10 分钟内电话通知 B3，并在当日交易时段结束前用 B3 提供的表单正式提交。除交易规则另有规定外，B3 依职权或应会员申请作废该类成交，前提是该成交造成的实际或潜在财务损失达到或超过 1,000 万巴西雷亚尔。B3 决定应申请作废时，收到请求后 20 分钟内尽力执行。B3 可对该成交的责任方处以罚款，金额不低于损失的 20%、不超过 5,000 万巴西雷亚尔"
    en: "A unilateral request to cancel a trade due to severe operating error must be communicated to B3 by telephone within 10 minutes of trade registration and formalised on a B3 form by the end of the trading session. Apart from situations specified in its rulebook, B3 may cancel such a trade ex officio or on request only if the trade incurs an actual or potential financial loss of at least ten million Brazilian Reais (BRL 10,000,000). Where B3 decides to cancel on request, it uses best efforts to do so within 20 minutes of receiving the request. B3 may fine the responsible participant at least 20% of the loss, up to BRL 50,000,000"
    detail: "B3's Trading Procedures Manual（Unilateral trade cancellation requests due to severe operating error）。与 trading_halt_mechanism 视角不同。B3 的门槛是绝对金额（BRL 10M）而非 % 偏离，故 deviation_threshold_pct 留 null。属『阈值 + 时限复核制』，门槛以损失金额计。"
    sources:
      - title: B3's Trading Procedures Manual（PDF，Unilateral trade cancellation requests due to severe operating error）
        url: https://www.b3.com.br/data/files/55/84/E9/FB/7DBEE8100E866AE8AC094EA8/B3%20Trading%20Procedures%20Manual.pdf
        accessed: 2026-08-16
    quote: "A unilateral request to cancel a trade due to severe operating error must be communicated to B3 by telephone by the full trading participant or trading participant concerned not more than ten (10) minutes after registration of the trade and formalized using a form provided by B3 by the end of the trading session ... B3 may cancel a trade due to severe operating error ex officio or at the request of a full trading participant or trading participant only if the trade in question incurs an actual or potential financial loss equal to or exceeding ten million Brazilian Reais (BRL 10,000,000.00). If B3 decides to cancel a trade at the request of a full trading participant or trading participant, B3 will make best efforts to do so for twenty (20) minutes after receiving the cancellation request."
    confidence: high

  order_book_transparency:
