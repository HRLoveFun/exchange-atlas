    quote: "The very first step to start the operations in the Brazilian Financial and Capital Markets is to open a 4.373 Account. ... To get broad access to the Brazilian financial and capital mar­kets, international investors are required to: Appoint a legal representative in Brazil to fill out the forms required by the Brazilian authorities... Hire custodial services in Brazil... Send the documents to the Brazilian Securities Commission... Choose a local broker ... The registration with the CVM is made electronically and it will provide the legal representative with a tax code (CNPJ) within 24 hours after the request."
