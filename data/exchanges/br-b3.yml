# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-16
    confidence: medium

  regulator:
    zh: "巴西证券交易委员会（Comissão de Valores Mobiliários, CVM）"
    en: "Brazilian Securities and Exchange Commission (CVM)"
    detail: |
      CVM是具有全国管辖权的独立联邦监管机构。巴西金融市场监管架构分三层：国家货币委员会
      （Conselho Monetário Nacional, CMN）居最高层，制定货币/信贷/外汇政策方针；巴西央行
      （Banco Central do Brasil）负责本币购买力稳定与支付体系安全效率；CVM专责证券市场，
      对商品与金融衍生品市场亦有管辖权，但不含政府债券市场。
    sources:
      - title: Non-resident Investor – Regulatory Environment
        url: https://www.b3.com.br/en_us/non-resident-investor/characteristics-brazilian-market/regulatory-environment.htm
        accessed: 2026-08-16
    quote: "CVM is an independent federal regulatory agency with nationwide jurisdiction over securities markets. Its responsibilities include commodities and financial derivatives markets and exclude government debt markets. Besides regulating and enforcing the related laws and its own rules, CVM is empowered to investigate market participants and apply sanctions."
    confidence: high

  self_regulatory_org:
    zh: "BSM Supervisão de Mercados（B3集团旗下的自律监管子机构）"
    en: "BSM Supervisão de Mercados"
    detail: "BSM对B3管理的市场参与者乃至B3自身进行稽查监督，拥有发起纪律处分程序的权力，受CVM监督。第三方资料常提及BSM设立于2007年，但本次抓取到的b3.com.br/bsmsupervisao.com.br页面均未给出该具体年份的官方原文，故不写入zh/en正文。"
    sources:
      - title: Non-resident Investor – Regulatory Environment
        url: https://www.b3.com.br/en_us/non-resident-investor/characteristics-brazilian-market/regulatory-environment.htm
        accessed: 2026-08-16
    quote: "4. BSM / Subsidiary of B3 group, inspects and supervise market participants and B3 itself and has the capability to establish and conduct disciplinary administrative proceedings."
    confidence: high

  clearing_regulator:
    zh: "巴西央行（Banco Central do Brasil）与CVM共同审批（视清算/托管系统类型而定）"
    en: "Central Bank of Brazil (BCB), jointly with CVM (depending on the type of clearing/custody system)"
    sources:
      - title: Project T+2 – Context
        url: https://www.b3.com.br/en_us/project-t-2/context/
        accessed: 2026-08-16
    quote: "on May 14, 2019, the Central Bank of Brazil (BCB) and the Securities and Exchange Commission of Brazil (CVM) granted B3 the authorizations necessary for implementation of the T+2 Settlement Cycle Project"
    confidence: high

  core_laws:
    zh: "《6.385号法律》（Law 6385）——B3就非居民投资者事务列为核心巴西联邦证券法规之一"
    en: "Law No. 6.385 – listed by B3 as one of the core Brazilian federal securities statutes"
    detail: |
      该法律常被认为是巴西证券市场基本法（Lei do Mercado de Capitais，1976年颁布并创设
      CVM），但本次抓取到的 B3 页面仅以法规名称链接形式列出（且指向的是可能已失效的CVM
      旧版英文子门户），未抓取到法律正文或对其历史作用的官方逐字表述——具体颁布年份与
      "设立CVM"这一表述未经本次抓取验证，故不写入 zh/en 正文，仅在此提示，待后续找到
      CVM官网现行英文页面核实后升级。
    sources:
      - title: Non-resident Investor – Operational Procedures and Regulation
        url: https://www.b3.com.br/en_us/non-resident-investor/market-rules/operational-procedures-and-regulation.htm
        accessed: 2026-08-16
    quote: "Brazilian Federal Laws and Resolutions / Law 6385"
    confidence: medium

  foreign_ownership_limit:
    zh: ""
    confidence: low
    detail: "未核实是否存在一般性外资持股比例限制，留空。"

  capital_controls:
    zh: "外资须通过CMN 4.373号决议开立「4.373账户」进入市场：委托当地法定代表人、税务代表与托管机构并向CVM登记；资金汇入/汇出目前对交易所内股票与ETF交易适用0%金融操作税（IOF）"
    en: "Foreign investors must open a '4.373 Account' under CMN Resolution 4.373 (2014): appointing a local legal representative, tax representative and custodian, and registering with CVM; inbound/outbound FX for on-exchange stock and ETF trades currently carries a 0% Financial Transaction Tax (IOF)"
    sources:
      - title: Trading equities, derivatives and fixed income - CMN 4.373/2014
        url: https://www.b3.com.br/en_us/non-resident-investor/characteristics-brazilian-market/trading-equities-derivatives-and-fixed-income-cmn-4-373-2014.htm
        accessed: 2026-08-16
      - title: Non-resident Investor – Taxation
        url: https://www.b3.com.br/en_us/non-resident-investor/characteristics-brazilian-market/taxation.htm
        accessed: 2026-08-16
    quote: "The very first step to start the operations in the Brazilian Financial and Capital Markets is to open a 4.373 Account."
    confidence: high

  disclosure_requirements:
    zh: "披露语言/渠道因上市板块而异：Novo Mercado要求重大信息、分红信息与业绩新闻稿以葡萄牙语和英语同步披露；基本板块（Basic）仅须遵循现行法律的一般披露要求，无强制英文披露义务"
    en: "Disclosure language/channel varies by listing segment: Novo Mercado requires simultaneous Portuguese/English disclosure of material information, benefit-distribution notices and results press releases; the Basic segment follows only the general statutory disclosure requirements, with no mandatory English disclosure"
    sources:
      - title: About listing segments – Novo Mercado
        url: https://www.b3.com.br/en_us/products-and-services/solutions-for-issuers/listing-segments/novo-mercado/
        accessed: 2026-08-16
      - title: About Listing Segments（板块对比表）
        url: https://www.b3.com.br/en_us/products-and-services/solutions-for-issuers/listing-segments/about-listing-segments/
        accessed: 2026-08-16
    quote: "Simultaneous disclosure, in Portuguese and English, of Material Information, benefit distribution information and results press releases;"
    confidence: high

  investor_protection:
    zh: "BSM设有举报通道（Whistleblower Channel）与投资者服务/建议渠道，并具备对市场参与者发起纪律处分程序的权力；CVM官网另设 Investors' Rights 栏目"
    en: "BSM operates a Whistleblower Channel and investor service/suggestion channels, and has authority to initiate disciplinary proceedings against market participants; CVM's site also has an Investors' Rights section"
    detail: "两处证据均为导航栏目名称，非描述性正文段落，故标medium而非high。"
    sources:
      - title: BSM Supervisão de Mercados – 英文首页
        url: https://www.bsmsupervisao.com.br/en/us/home
        accessed: 2026-08-16
      - title: CVM 英文门户
        url: https://www.gov.br/cvm/en
        accessed: 2026-08-16
    confidence: medium

