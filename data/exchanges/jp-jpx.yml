  founded_year:
    zh: "1878（5月15日，「东京株式取引所」设立）；现行「东京证券交易所」于1949年4月1日重新成立，5月16日开业"
    en: "1878 (May 15, \"Tokyo Stock Exchange Co., Ltd.\" established); the present-day \"Tokyo Stock Exchange\" was founded April 1, 1949 (opened May 16)"
    detail: |
      1943年因战时统制，与全国其他交易所合并为「日本证券取引所」（准官方机构），1947年
      随占领当局的财阀解体政策解散；1949年以现行组织形式重新成立。这条历史链条与现在的
      JPX集团（2013年成立）是两回事——见 history 字段。
    quote: "\"Tokyo Stock Exchange Co., Ltd.\" established. / \"Tokyo Stock Exchange\" in the present form founded (opened on May 16)."
    confidence: high

  history:
    zh: "1878年设立，几经战时整合与解散重组，1949年以现行组织形式重新成立；2013年东京证券交易所集团与大阪证券交易所合并成立日本交易所集团（JPX），JPX随即于同月在TSE挂牌上市；同年大阪证交所现货市场并入TSE，衍生品市场整合进更名后的大阪交易所（OSE）"
    en: "Established 1878; wartime consolidation and dissolution, refounded in present form in 1949; in 2013 Tokyo Stock Exchange Group merged with Osaka Securities Exchange to form Japan Exchange Group (JPX), which listed on TSE that same month; OSE's cash equity market was integrated into TSE while its derivatives market became the renamed Osaka Exchange (OSE)"
    sources:
      - title: History（JPX官网）
        url: https://www.jpx.co.jp/english/corporate/about-jpx/history/index.html
        accessed: 2026-08-13
    quote: "Jan. 1, 2013 Japan Exchange Group, Inc.(JPX) is established / Jan. 4, 2013 Japan Exchange Group, Inc.(JPX) is listed on Tokyo Stock Exchange (TSE) 1st Section / Jul. 16, 2013 Cash equity market of Osaka Securities Exchange (OSE) is integrated into TSE"
    confidence: high

  organization_form:
    enum: demutualized_listed
    zh: "公司制（母公司JPX由2013年东证集团与大阪证交所合并组成并上市）"
    en: "Demutualized (parent JPX formed by the 2013 merger of Tokyo Stock Exchange Group and Osaka Securities Exchange, then listed)"
    sources:
      - title: History（JPX官网）
        url: https://www.jpx.co.jp/english/corporate/about-jpx/history/index.html
        accessed: 2026-08-13
    quote: "Jan. 1, 2013 Japan Exchange Group, Inc.(JPX) is established"
    confidence: high

  self_listed:
    enum: partial
    zh: "并非TSE本身单独上市，而是母公司日本交易所集团（JPX）在TSE挂牌（2013年1月4日，当时为第一部）"
    en: "Not TSE itself; parent Japan Exchange Group (JPX) is listed on TSE (since January 4, 2013, originally on the 1st Section)"
    detail: "与NYSE/ICE是同一种结构——挂牌的是控股母公司，不是被记录的交易所实体本身，故取 partial 而非简单是/否。"
