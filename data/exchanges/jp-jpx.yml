        accessed: 2026-08-13
    confidence: high

  trading_sessions:
    pre_market:
      zh: "无独立盘前时段"
      en: "No separate pre-market session"
      confidence: medium
    continuous_am:
      zh: "上午盘 9:00-11:30"
      en: "Morning session 9:00 a.m.-11:30 a.m."
      quote: "The morning trading session shall be held from 9:00 a.m. to 11:30 a.m."
    lunch_break:
      zh: "11:30-12:30 午休，无交易"
      en: "11:30 a.m.-12:30 p.m. lunch recess, no trading"
      confidence: medium
    continuous_pm:
      zh: "下午盘 12:30-15:30，其中15:25-15:30为收盘集合竞价"
      en: "Afternoon session 12:30 p.m.-3:30 p.m., with 3:25-3:30 p.m. as the closing auction session"
      quote: "the afternoon trading session shall be held from 0:30 p.m. to 3.30 p.m. However, 3:25 p.m. to 3:30 p.m. will be a closing auction session, with trades being executed at 3:30 p.m."
    after_market:
      zh: "无独立盘后连续交易时段"
      en: "No separate after-hours continuous session"
      confidence: medium
    night_session:
      zh: "现货股票无夜盘（衍生品市场另有夜盘，属大阪交易所OSE，不在本文件范围）"
      en: "None for cash equities (derivatives have a night session under Osaka Exchange, outside this file's scope)"
      confidence: medium

  holidays_note:
    zh: "周末与法定节假日休市，具体日历官网逐年公布，未逐条核实"
    en: "Closed on weekends and national holidays; the exact calendar is published yearly and was not individually verified"
    confidence: low

  opening_mechanism:
    zh: "开盘集合竞价撮合决定开盘价，其后转为连续竞价"
    en: "Opening price determined by call auction, then continuous trading begins"
    detail: "「所有开盘价确定前的申报视为同时提出」——board_lot_size等细则见 Rule 10。"
    sources:
      - title: Business Regulations（官网英文版PDF）Rule 10, Rule 12
        url: https://www.jpx.co.jp/english/rules-participants/rules/regulations/tvdivq0000001vyt-att/business_regs_20250507.pdf
        accessed: 2026-08-13
    quote: "All bids and offers made prior to determination of an opening price [shall be deemed to have been made simultaneously]"
    confidence: high

  closing_mechanism:
    zh: "收盘集合竞价，15:25-15:30，15:30执行成交"
    en: "Closing call auction, 3:25-3:30 p.m., executed at 3:30 p.m."
    quote: "3:25 p.m. to 3:30 p.m. will be a closing auction session, with trades being executed at 3:30 p.m."
    confidence: high

  matching_principle:
    zh: "价格优先、时间优先；市价申报优先于指值申报"
    en: "Price priority, then time priority; market orders take precedence over limit orders"
    quote: "A lower offer shall have precedence over higher offers, and a higher bid shall have precedence over lower bids... Market orders shall have precedence over bids and offers other than those of market orders in terms of price."
    confidence: high

  order_types:
    zh: "市价申报、指值申报（限价申报）"
    en: "Market orders and limit orders"
    detail: "官方英文版《业务规程》未见对订单类型的独立分类条款清单（不同于纽交所专门的Order Type Matrix文档），本条基于撮合规则条文（Rule 10）里对市价/指值申报的提及归纳。"
    sources:
      - title: Business Regulations（官网英文版PDF）Rule 10
        url: https://www.jpx.co.jp/english/rules-participants/rules/regulations/tvdivq0000001vyt-att/business_regs_20250507.pdf
        accessed: 2026-08-13
    quote: "Market orders shall have precedence over bids and offers other than those of market orders in terms of price. All market orders shall be on parity with each other."
    confidence: medium

  tick_size:
    zh: ""
    confidence: low

  board_lot_size:
    zh: ""
    confidence: low
    detail: "日股普遍以100股为单位交易，但未在本次抓取的条文中找到统一规定的直接原文，留空不猜。"

  odd_lot_handling:
    zh: ""
    confidence: low

  price_limits:
    type:
      enum: absolute_tiered
      zh: "值幅制限：按前收盘价所在区间，分37档规定绝对值幅（非百分比），如100円以下±30円……5000万円以上±1000万円"
      en: "Price limits on bids and offers: 37 tiers of absolute yen amounts (not percentages) keyed to the base price band, e.g. under 100 yen → ±30 yen ... 50,000,000 yen or more → ±10,000,000 yen"
      sources:
        - title: Rules Concerning Price Limits on Bids and Offers（TSE官网英文版PDF）
          url: https://www.jpx.co.jp/english/rules-participants/rules/regulations/tvdivq0000001vyt-att/bids_and_offers_price_limits_20141201.pdf
          accessed: 2026-08-13
      quote: "Less than 100 yen Upward/Downward 30 yen ... Where the price is more than 50,000,000 yen 10,000,000 yen"
      confidence: high
    main_board:
      zh: "见 type 字段的37档完整表；档位随基准价升高而放大，非固定比例"
      en: "See the 37-tier table in the type field; the band widens as the base price rises, not a fixed percentage"
      confidence: medium
    other_boards:
      zh: "Prime/Standard/Growth三板统一适用同一套值幅制限表，未发现分板差异"
      en: "The same price-limit table applies uniformly across the Prime/Standard/Growth boards; no board-specific variation found"
      confidence: medium

  circuit_breaker:
    enum: stock_level
    zh: "无独立的全市场熔断机制（如美股MWCB）；波动控制主要通过「特別気配」（特别行情揭示）机制实现——申报价格超出值幅制限的基准价时，不直接成交，而是显示特别气配指示性价格，上午盘超出即不成交，下午盘则按值幅制限价位处理"
    en: "No separate market-wide circuit breaker (unlike the U.S. MWCB); volatility control operates primarily through the \"special quote\" mechanism — when an order price would exceed the price-limit band around the base price, no trade is executed at that price; instead a special indicative quote is displayed. In the morning session no transaction is effected; in the afternoon session trading is capped at the price limit"
    detail: "本条描述的是个股级机制，是否存在独立于值幅制限之外的全市场级熔断安排未在本次抓取内容中确认，留待后续核实，见 OPEN-QUESTIONS。"
    sources:
      - title: Business Regulations（官网英文版PDF）Rule 12, Paragraph 7
        url: https://www.jpx.co.jp/english/rules-participants/rules/regulations/tvdivq0000001vyt-att/business_regs_20250507.pdf
        accessed: 2026-08-13
    quote: "when the price prescribed in Paragraph 2, Item (3) exceeds a price limit determined by the Exchange based on the last sale price (or a special quote if such quote is posted as prescribed by the Exchange), transactions shall be handled as prescribed for each classification... Morning session: Transactions shall not be effected."
    confidence: high

  volatility_interruption:
    zh: "同 circuit_breaker 所述的「特別気配」机制——本质是值幅制限的执行方式，而非独立的波动性中断层，与港交所VCM那种独立于涨跌停之外的冷静期机制不是同一类设计"
    en: "Same \"special quote\" mechanism described under circuit_breaker — it is the enforcement mechanism of the price-limit system itself, not a separate volatility-interruption layer distinct from price limits (unlike HKEX's VCM, which operates independently of any daily price limit since HKEX has none)"
    confidence: medium

  trading_halt_mechanism:
    zh: "见 circuit_breaker（特別気配）；另有因重大事项披露的停牌未逐条核实"
    en: "See circuit_breaker (special quote mechanism); halts for material disclosure events also exist but were not verified in detail"
    confidence: medium

  intraday_reversal:
    enum: t1
    zh: "现货股票交收前不得卖出（不可当日回转），与结算层面T+2（见 clearing.settlement_cycle）相配套"
    en: "Securities purchased may not be sold before settlement (no same-day round-trip); pairs with the T+2 settlement cycle (see clearing.settlement_cycle)"
    detail: "此为一般性市场惯例的归纳，本次未找到TSE业务规程里逐条禁止当日回转的直接条文，confidence标medium。"
    confidence: medium

  short_selling:
    enum: restricted_uptick
    zh: "卖空须向交易所披露（标记申报），且受价格限制约束（Rule 16「卖空价格限制基准价」），类似报升规则，具体触发比例本次未能在抓取内容中确认"
    en: "Short sales must be flagged/disclosed to the Exchange and are subject to a price restriction (Rule 16, \"Base Prices with Short Selling Price Restriction\"), functionally similar to an uptick rule; the specific trigger percentage was not confirmed in the content fetched this session"
    sources:
      - title: Business Regulations（官网英文版PDF）Rule 14, Rule 16
        url: https://www.jpx.co.jp/english/rules-participants/rules/regulations/tvdivq0000001vyt-att/business_regs_20250507.pdf
        accessed: 2026-08-13
    quote: "If the trading participant intends to execute a short sale... disclosure of that fact / Rule 16. Base Prices with Short Selling Price Restriction"
    confidence: medium

  block_trade:
    zh: ""
    confidence: low

  dark_pool:
    zh: ""
    confidence: low

  market_maker_scheme:
    zh: ""
    confidence: low
    detail: "TSE现货市场撮合系统（arrowhead）为全电子化连续竞价，未确认是否存在类似纽交所DMM式的场内指定做市商角色；部分ETF/权证品种可能另有流动性提供者（Liquidity Provider）安排，未核实细节，留空不猜。"

  connect_schemes:
    zh: ""
    confidence: low

