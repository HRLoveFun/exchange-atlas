# 东京证券交易所 Tokyo Stock Exchange (TSE)
# 抓取来源见 PROJECT/SOURCES.md `jp-jpx` 一节；原始页缓存于 .cache/jp-jpx/
# source_lang: en——按 ADR-013「无中选英」，日本交易所无可靠官方中文原文，英文是溯源锚点，
# zh 是翻译展示。吸取 us-nyse.yml 的教训：本文件从一开始就同时充实填写 zh 与 en，
# 不是只把 en 当简短术语标签。
# group_id: jpx-group——日本交易所集团（JPX）旗下东京证券交易所（TSE，现货股票）、
# 大阪交易所（OSE，衍生品）、东京商品交易所（TOCOM，商品）、Japan Exchange Regulation
# （自律监管）是各自独立的法人实体，本文件只记录 TSE 现货股票市场。

id: jp-jpx
name_zh: 东京证券交易所
name_native: {ja: 東京証券取引所, en: "Tokyo Stock Exchange (TSE)"}
official_languages: [ja]
source_lang: en
group_id: jpx-group
region: apac
tier: standard

