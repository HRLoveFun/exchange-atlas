      name_zh: 主市场
      name_native: "Prime Market（プライム市場）"
      financial_threshold: "股东人数（预计上市时）≥800人；流通股数≥2万单位、流通股市值≥100亿日元、且占已上市股份≥35%；总市值（预计上市时）≥250亿日元；合并净资产≥50亿日元（母公司净资产须为正）；最近两年合计利润≥25亿日元，或二选一满足最近一年销售额≥100亿日元且预计上市时市值≥1000亿日元；另须持续经营满3年"
      target_companies: "面向市值（流动性）达到可作为众多机构投资者投资标的的水平、具备更高治理水准、以与投资者建设性对话为核心持续提升中长期企业价值的企业"
      launched_year: 2022
    - id: jp-jpx-standard
      name_zh: 标准市场
      name_native: "Standard Market（スタンダード市場）"
      financial_threshold: "股东人数（预计上市时）≥400人；流通股数≥2000单位、流通股市值≥10亿日元、且占已上市股份≥25%；持续经营满3年；净资产（预计上市时）为正；最近一年利润≥1亿日元"
      target_companies: "面向市值（流动性）达到可作为公开市场投资标的水平、具备上市公司应有基本治理水准、致力于持续增长与中长期企业价值提升的企业"
      launched_year: 2022
