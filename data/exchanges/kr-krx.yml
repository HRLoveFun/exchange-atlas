    zh: "上市后持续义务主要体现为三类披露义务——定期披露、即时披露、公平披露（见 regulation.disclosure_requirements），以及维持上市标准（审计意见、股权分散、财务维持门槛等）；若不再满足维持标准，将被指定为管理股并可能走向退市（见 delisting_process）。具体条文由KRX按市场分别规定。"
    en: "Continuing obligations are mainly the three categories of disclosure — Periodic, Timely and Fair Disclosure (see regulation.disclosure_requirements) — plus the maintenance of listing standards (audit opinion, share distribution, financial maintenance thresholds, etc.); failure to maintain standards leads to administrative-issue designation and possible delisting (see delisting_process). Detailed rules are set by KRX per market."
    sources:
      - title: Regulation ‧ Stocks ‧ KOSPI Market ‧ Disclosure（KRX官网英文版）
        url: https://global.krx.co.kr/contents/GLB/06/0602/0602010102/GLB0602010102.jsp
