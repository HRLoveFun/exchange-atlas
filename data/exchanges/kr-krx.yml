    zh: "个股停牌情形包括：上市公司披露重大信息后停牌30分钟；被指定为不实披露法人当日停牌；因传闻/报道引发交易量激增，须待澄清公告后方可复牌；公司未按要求答复问询（KOSPI从逾期到披露、KOSDAQ从逾期到披露后再加30分钟）；交易所认为有必要保护投资者时停牌1天；此外还有因退市事由、股票证书变更、结算会员未按期交收等其他停牌情形"
