# 韩国交易所 Korea Exchange (KRX)
# 抓取来源见 PROJECT/SOURCES.md `kr-krx` 一节；原始页缓存于 .cache/kr-krx/
# source_lang: en——按 ADR-013「无中选英」，KRX 官网无官方中文原文（仅韩文版 www.krx.co.kr
# 与英文版 global.krx.co.kr），英文是溯源锚点，zh 是翻译展示；填写时同等充实两个语言字段。
#
# 结构说明（压测点：多板块如何在字段里体现）：KRX 是 2005 年由韩国证券交易所（KSE，1956年
# 前身设立）、KOSDAQ 市场（1996年设立）、韩国期货交易所（KOFEX，1999年设立）依《资本市场与
# 金融投资业法》(FSCMA) 合并而成的单一法人交易所（2008年由"韩国证券期货交易所"更名为"韩国
# 交易所"）。KOSPI（有价证券市场）/KOSDAQ/KONEX（2013年设立，面向中小与创业企业）三者都是
# 这同一法人内部的市场板块（非独立法人），衍生品市场同样由 KRX 本身运营——这与 JPX/NYSE
# Group 那种"衍生品/姊妹市场另设独立法人"的集团结构不同：KRX 本身就是清算业务的中央对手方
# （CCP），不像 JPX 集团要靠 OSE、NYSE 要靠 NSCC/DTCC 那样把清算功能放到另一个法人。因此本
# 文件不设 group_id，三大板块通过 listing.boards 列表体现，而不是拆成多个交易所条目。

id: kr-krx
name_zh: 韩国交易所
name_native: {ko: 한국거래소}
official_languages: [ko]
source_lang: en
region: apac

