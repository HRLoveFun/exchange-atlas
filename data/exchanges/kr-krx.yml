# 十二｜风险与特殊考量
# ═══════════════════════════════════════════════
risks:
  _meta:
    verified: 2026-08-27
    confidence: low

  fx_risk_note:
    zh: "外汇风险：韩元(KRW)为自由兑换货币、资本账户开放（见 capital_controls），但历史上波动较大，外资进出与汇率联动会放大股市波动；非居民需承担以KRW结算的汇率风险，且无专门对冲义务。美元加息/避险情绪升温时韩元易走弱、外资流出，形成股汇双杀风险。"
    en: "FX risk: the Korean won (KRW) is freely convertible with an open capital account (see capital_controls), but has historically been volatile; foreign inflows/outflows and exchange-rate moves are correlated and can amplify equity volatility. Non-residents bear KRW-settlement currency risk with no dedicated hedging obligation. In USD-tightening or risk-off episodes the won tends to weaken and foreigners to exit, creating coincident equity-FX pressure."
    sources:
      - title: Foreign Investor Registration Requirement to be Abolished in Korea（FSC，资本账户开放）
        url: https://www.fsc.go.kr/eng/pr010101/80123
        accessed: 2026-08-27
    quote: ""
    confidence: low

  political_risk_note:
    zh: "政治/政策风险：韩国历任政府频繁调整资本市场税制——2024年底废除「金融投资所得税」(FIIT)、2026年又将证券交易税由免税恢复为0.20%，政策反复增加了税负预期的不确定性；此外「韩国折价」(Korea Discount)部分源于外资对韩股治理、外资持股限制（33只关键行业股有上限）与信息披露透明度（曾阻碍MSCI升级）的担忧。监管改革（如大股东强制卖出、夜盘引入）亦可能短期扰动。"
    en: "Political/policy risk: successive Korean governments have frequently reshuffled capital-markets taxation — the Financial Investment Income Tax (FIIT) was abolished at end-2024, then the securities transaction tax was restored from zero to 0.20% in 2026, and such policy reversals add uncertainty to tax expectations. The 'Korea Discount' also partly stems from foreign investors' concerns over corporate governance, foreign-ownership caps (33 key-industry issues carry limits) and disclosure transparency (which previously blocked an MSCI upgrade). Regulatory reforms (e.g. mandatory major-shareholder sales, night-session introduction) can also cause short-term dislocation."
    sources:
      - title: MSCI maintains S.Korea's emerging-market status（KED Global）
        url: https://www.kedglobal.com/markets/newsView/ked202506250006
        accessed: 2026-08-27
      - title: Gov't announces road map for Seoul's inclusion in global index MSCI（Yonhap）
        url: https://en.yna.co.kr/view/AEN20260109005600320
        accessed: 2026-08-27
    quote: "MSCI has cited Korea’s opaque stock-related rules and foreign ownership limits as \"the Korea discount ,\" or reasons for not raising the country to developed market status"
    confidence: medium

  liquidity_risk_note:
    zh: "流动性风险：韩国市场呈「二八分化」——少数大盘蓝筹（三星电子、SK海力士、KB金融等）成交活跃、深度好，但大量中小盘（尤其KOSDAQ、KONEX）流动性薄弱、买卖价差宽、单笔大额委托易产生显著市场冲击；外资占比虽约三成但持股集中，集中抛售时可能放大波动。2025年3月18日全市场7分钟停牌事件亦暴露了极端情形下的流动性/价格发现中断风险。"
    en: "Liquidity risk: Korea shows a '28 split' — a handful of large-cap blue chips (Samsung Electronics, SK Hynix, KB Financial, etc.) trade actively with good depth, but a large mass of small/mid-caps (especially KOSDAQ, KONEX) are thinly traded with wide spreads and significant market impact for sizeable orders; foreigners (~one third of KOSPI cap) are concentrated, so clustered selling can amplify volatility. The 18 Mar 2025 market-wide 7-minute halt also exposed liquidity/price-discovery-interruption risk in extremes."
    sources:
      - title: One in Four Koreans Is a Shareholder（Asia Business Daily / KSD 投资者结构）
        url: https://www.asiae.co.kr/en/article/2026031809540784827
        accessed: 2026-08-27
      - title: Korea's stock markets halt trading for 7 minutes due to calculation error（Korea Herald）
        url: http://www.koreaherald.com/view.php?ud=20250318000752
        accessed: 2026-08-27
    quote: "individuals held approximately 34.1 billion shares (63.2%)"
    confidence: medium

  regulatory_change_risk_note:
    zh: "KOSPI退市/管理股财务门槛正处于多年分阶段调整期：营收门槛从「2026年底前50亿韩元」逐步提高到「2027年10亿韩元」「2028年200亿韩元」（最终门槛为300亿韩元，2027年起若市值达标可豁免）；市值门槛从「2025年底前50亿韩元」提高到「2026上半年200亿韩元」「2026下半年300亿韩元」（最终门槛为500亿韩元）——这意味着同一份退市规则在不同年份对应的实际数值门槛不同，横向比较或历史数据核对时要注意抓取时点"
    en: "KOSPI's delisting/administrative-issue financial thresholds are in a multi-year phase-in: the sales threshold rises from KRW 5bn (through 2026) to KRW 10bn (2027) to KRW 20bn (2028), with a final KRW 30bn threshold (waivable from 2027 if market cap qualifies); the market-cap threshold rises from KRW 5bn (through 2025) to KRW 20bn (H1 2026) to KRW 30bn (H2 2026), with a final KRW 50bn threshold — meaning the same delisting rule maps to different numeric thresholds depending on the year, which matters for cross-exchange comparison or historical fact-checking depending on when the data was fetched"
    sources:
      - title: Designation of Administrative Issues and Delisting Criteria for the KOSPI Market
        url: https://global.krx.co.kr/contents/GLB/03/0303/0303050500/GLB0303050500.jsp
        accessed: 2026-08-16
    quote: "Not applicable if the average market capitalization for the most recent fiscal year is KRW 100 billion or more (Effective from 2027 onwards). ... However, until 2028, the following thresholds apply based on the submission date of an audit report with an unqualified opinion"
    confidence: high

  enforcement_note:
    zh: "执法与稽查：FSS/KRX对市场操纵、内幕交易、不实披露设有查处与披露机制；近年韩国加强对非法（无券）卖空(naked short selling)的执法——2023–2024年曾全面暂停卖空并对外资行立案调查，2025年6月有条件恢复卖空并引入NS(非同步)制度与更严罚则。上市公司违规可被指定为管理股乃至退市（见 delisting_process）。本次未从一手来源逐项抓取执法统计，建议后续以FSS年报复核。"
    en: "Enforcement: the FSS/KRX have investigation and disclosure mechanisms for market manipulation, insider trading and false disclosure; in recent years Korea stepped up enforcement against illegal (naked) short selling — a full short-selling ban was in place during 2023–2024 with several foreign banks investigated, and short selling was conditionally resumed in June 2025 with an NS (non-synonymous) order system and stricter penalties. Listed-company violations can lead to administrative-issue designation and even delisting (see delisting_process). Enforcement statistics were not fetched from a primary source this session; recommend re-checking against FSS annual reports."
    sources:
      - title: FSS enforcement / short-selling reform（FSS，本次未抓取一手页）
        url: https://www.fss.or.kr/eng/
        accessed: 2026-08-27
    quote: ""
    confidence: low
