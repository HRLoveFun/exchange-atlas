    en: "As the CCP, KRX's default management is built on the FSCMA: it collects a Joint Compensation Fund from members (§394); on a member's default it first appropriates that member's deposits and margins to redeem obligations (§397), and to the extent still uncovered KRX bears the compensation responsibility for the member's default (§399), with claim priority over other creditors of the defaulting member (§400). The loss-absorption order is: the defaulting member's own margin → the Joint Compensation Fund → the Exchange's own capital."
