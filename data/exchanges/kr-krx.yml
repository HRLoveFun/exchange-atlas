  founded_year:
    zh: "1956（其前身「大韩证券交易所」3月3日设立，为韩国证券交易所KSE前身）；现行「韩国交易所」法人于2005年1月27日由KSE、KOSDAQ市场、韩国期货交易所（KOFEX）合并设立，初名「韩国证券期货交易所」，2008年2月4日更名为「韩国交易所」"
    en: "1956 (Mar. 3, the Daehan Stock Exchange, predecessor of the Korea Stock Exchange, established); the present-day Korea Exchange was formed Jan. 27, 2005 by consolidating KSE, the KOSDAQ market and the Korea Futures Exchange (KOFEX), initially named the Korea Stock and Futures Exchange, renamed Korea Exchange on Feb. 4, 2008"
    detail: |
      "Established in 1956" 是 KRX 官方 CEO Message 页给出的成立年份表述，对应的是其前身大韩
      证券交易所/韩国证券交易所（KSE）的设立年份，而不是现行统一法人的设立年份——现行 KRX
      法人实体是 2005 年三方合并的产物，2008 年才改用「韩国交易所」这个名称。这条历史链条与
      现在的多板块结构（KOSPI/KOSDAQ/KONEX）是同一件事的两面，见文件头注释。
    sources:
      - title: CEO Message（KRX官网英文版）
        url: https://global.krx.co.kr/contents/GLB/01/0101/0101000000/GLB0101000000.jsp
        accessed: 2026-08-16
      - title: History（KRX官网英文版年表）
        url: https://global.krx.co.kr/contents/GLB/01/0102/0102040000/GLB0102040000.jsp
        accessed: 2026-08-16
    quote: "Established in 1956, the Korea Exchange (KRX) has contributed to Korea's economic development... / 1956 Mar.3 The Daehan Stock Exchange, the predecessor of the Korea Stock Exchange (KSE), established / 2005 Jan.27 Established the Korea Stock and Futures Exchange through consolidation of KSE, KOSDAQ, KOFEX / 2008 Feb.4 Company name change(Korea Stock and Futures Exchange → Korea Exchange)"
    confidence: high

  history:
    zh: "1956年大韩证券交易所（KSE前身）设立；1974年韩国证券存管院（KSD）设立；1996年KOSDAQ市场设立；1999年韩国期货交易所（KOFEX）设立；2005年1月27日KSE、KOSDAQ、KOFEX三方合并设立「韩国证券期货交易所」；2008年2月4日更名为「韩国交易所」（KRX）；2013年7月1日设立面向中小与创业企业的KONEX市场；2021年4月16日设立KRX清算部门"
    en: "1956 Daehan Stock Exchange (KSE's predecessor) established; 1974 Korea Securities Depository (KSD) established; 1996 KOSDAQ market established; 1999 Korea Futures Exchange (KOFEX) established; Jan. 27, 2005 KSE, KOSDAQ and KOFEX consolidated into the Korea Stock and Futures Exchange; Feb. 4, 2008 renamed Korea Exchange (KRX); Jul. 1, 2013 KONEX market launched for SMEs and startups; Apr. 16, 2021 KRX Clearing division established"
    sources:
      - title: History（KRX官网英文版年表）
        url: https://global.krx.co.kr/contents/GLB/01/0102/0102040000/GLB0102040000.jsp
        accessed: 2026-08-16
    quote: "1974 Dec.6 The Korea Securities Depository (KSD) established / 1996 May 17 The KOSDAQ Stock Market established / 1999 Feb.6 The KOFEX established / 2005 Jan.27 Established the Korea Stock and Futures Exchange through consolidation of KSE, KOSDAQ, KOFEX / 2008 Feb.4 Company name change(Korea Stock and Futures Exchange → Korea Exchange) / 2013 Jul.1 Launched KONEX Market"
    confidence: high

  organization_form:
    enum: demutualized_unlisted
    zh: "公司制（未上市）——依《资本市场与金融投资业法》(FSCMA)，交易所须为《商法》下的股份有限公司；股东名册全部为证券公司等金融机构与政府关联机构，非自身上市公司"
    en: "Demutualized (unlisted) — under the FSCMA, an Exchange must be a stock company under the Commercial Act; its shareholder registry consists entirely of securities firms and other financial/government-linked institutions, not a publicly listed entity"
    detail: "与上交所/深交所的传统会员制不同，KRX 法律形式已是股份有限公司（stock company，见FSCMA第373-2条），但股份未公开上市交易，由证券公司等会员机构持有——介于「会员制」与「公司制上市」之间，取 demutualized_unlisted。股东名册数据截至2019年末，见 self_listed 字段。"
    sources:
      - title: Financial Investment Services and Capital Markets Act（FSCMA，第373-2条）
        url: https://elaw.klri.re.kr/eng_service/lawTwoView.do?hseq=31782
        accessed: 2026-08-16
      - title: Shareholder Status（KRX官网英文版，截至2019年末股东名册）
        url: https://global.krx.co.kr/contents/GLB/01/0104/0104030000/GLB0104030000.jsp
        accessed: 2026-08-16
    quote: "Any entity that wishes to obtain permission for Exchange under paragraph (1) shall satisfy all of the following requirements: 1. It shall be a stock company under the Commercial Act"
    confidence: high

  self_listed:
    enum: "no"
    zh: "否——股东名册（截至2019年末）由KB证券、Meritz证券、NH投资证券等国内证券公司及中小企业振兴公团等机构组成，未见自身股票代码或公开市场交易记录"
    en: "No — the shareholder registry (as of end-2019) is composed of domestic securities firms (KB Securities, Meritz Securities, NH Investment & Securities, etc.) and public agencies such as the Korea SMEs and Startups Agency; no own ticker or public trading record found"
    detail: "该股东名册页面标注日期为2019年末，是本次抓取材料里能找到的最新一份，不排除此后股权结构有变化；「未自身上市」是基于名册全为机构持有、且未在 products/indices 出现自身股票这一间接推断，非交易所官方明文声明「我们未上市」，故 confidence 标 medium。"
    sources:
