  circuit_breaker:
    enum: index_level
    zh: "指数级三阶段熔断（Circuit Breakers）：第一阶段KOSPI（或KOSDAQ）指数较前日下跌8%以上（且持续1分钟），全市场暂停交易20分钟；第二阶段较前日下跌15%以上且较第一触发点再跌1%以上，熔断后以单一价格集合竞价10分钟恢复连续竞价；第三阶段较前日下跌20%以上且较第二触发点再跌1%以上，当日收市，所有申报（含撤单）不可再提交"
    en: "Three-phase index-level circuit breaker: Phase 1 — KOSPI (KOSDAQ) index falls 8% or more from the previous day (lasting one minute), entire market suspended 20 minutes; Phase 2 — falls 15% or more plus an additional 1% fall from the Phase-1 trigger, single-price call auction for 10 minutes after activation then resumes continuous auction; Phase 3 — falls 20% or more plus an additional 1% fall from the Phase-2 trigger, market closes for the day, no quotations (including cancellations) may be submitted"
    spec: {type: index_level, reference: [{index: "KOSPI", exchange: self}, {index: "KOSDAQ", exchange: self}], levels: [{threshold_pct: 8, halt_minutes: 20}, {threshold_pct: 15, halt_minutes: 10}, {threshold_pct: 20, halt_minutes: null, day_end: true}], note: "各阶段跌幅须持续 1 分钟；二、三阶段还须相对前一触发点再跌 ≥1%。二阶段熔断后以 10 分钟单一价格集合竞价恢复连续竞价；三阶段当日收市，所有申报（含撤单）不可再提交"}
    sources:
      - title: Guide to Trading in the Korean Stock Market（KRX官网英文版官方手册PDF）
        url: https://global.krx.co.kr/contents/GLB/01/0109/0109000000/guide_to_trading_in_the_korean_stock_market.pdf
        accessed: 2026-08-16
    quote: "KOSPI (KOSDAQ) index falls by 8% or more compared to the previous day. (The fall lasts for one minute.) The entire market is suspended for 20 minutes. (Only cancellation of quotations is allowed.) KOSPI (KOSDAQ) index falls by 15% or more compared to the previous day. An additional fall by 1% or more follows compared to the first activation point. After CB activation, single price call auction is in operation for 10 minutes, followed by continuous auction. KOSPI (KOSDAQ) index falls by 20% or more compared to the previous day. An additional fall by 1% or more follows compared to the second activation point. The market is closed when the third phase is activated."
    confidence: high

  volatility_interruption:
    spec: {static_pct: 10, dynamic_pct: 3, auction_minutes: 2, note: "个股级；连续竞价阶段触发后转 2 分钟单一价格集合竞价。dynamic_pct：KOSPI200 成份股/ETF 连续时段 ±3%（收盘竞价 ±2%、盘后 ±3%），其他品种 ±6%/±4%/±6%；static_pct：所有时段 ±10%。另有 sidecar（程序化交易挂单暂停 5 分钟），见 detail"}
    zh: "个股级波动性中断（Volatility Interruption, VI），分动态VI与静态VI：连续竞价阶段VI触发后转为2分钟单一价格集合竞价；触发价 = 基准价 ± (基准价 × 触发比率)，KOSPI200成份股/ETF等常规交易时段动态VI比率±3%、静态VI比率±10%，其余品种动态VI比率±6%"
    en: "Individual-issue Volatility Interruption (VI), split into Dynamic VI and Static VI: when triggered during continuous auction, trading switches to a 2-minute single-price call auction; activation price = reference price ± (reference price × activation rate); for KOSPI 200 constituents/ETFs etc. the dynamic VI rate is ±3% and static VI rate ±10% during the regular session, while other issues use a ±6% dynamic rate"
    detail: "此外还有「sidecar」机制（KOSPI200期货价格5分钟内单方向变动达5%，或KOSDAQ150期货价格变动6%以上且KOSDAQ150指数同向变动3%以上时，暂停程序化交易挂单5分钟），是与VI并行的另一套稳定机制，未单独设字段，写在此处备注，不计入zh/en正文（其涉及的具体比例本次未逐一配 quote）。"
    sources:
      - title: Guide to Trading in the Korean Stock Market（KRX官网英文版官方手册PDF）
        url: https://global.krx.co.kr/contents/GLB/01/0109/0109000000/guide_to_trading_in_the_korean_stock_market.pdf
        accessed: 2026-08-16
    quote: "When VI is activated during continuous auction session, continuous auction is switched to single price call auction for two minutes. ... Activation price : reference price ± (reference price x activation price rate) ... KOSPI 200 constituents ... ±3% ... ±10% ... Other issues ... ±6%"
    confidence: high

