        url: https://global.krx.co.kr/contents/GLB/01/0109/0109000000/guide_to_trading_in_the_korean_stock_market.pdf
        accessed: 2026-08-16
    confidence: medium

  delisting_conditions:
    zh: "KOSPI市场设「管理股指定」与「退市」两级：管理股指定情形含未按期提交定期报告、审计意见为「保留/否定/无法表示意见」、资本侵蚀率50%以上、少数股东少于200人或持股比例低于5%、半年平均月成交量低于流通股1%、外部董事人数不足、不实披露累计扣分达10分以上、营收低于300亿韩元（2026年前为50亿、2026年为100亿、2027年为200亿韩元的过渡门槛，2027年起若最近年度平均市值达1000亿韩元以上可豁免）、市值连续30个交易日低于500亿韩元（2025年前为50亿、2026上半年为200亿、2026下半年为300亿韩元的过渡门槛）等；上述情形连续两年未解决或触发即时退市条款（如连续记录修正审计意见、逾期10日未交业务报告）则直接退市"
    en: "The KOSPI market uses a two-tier system — designation as an administrative issue, then delisting. Administrative-issue triggers include failure to submit periodic reports on time, a qualified/adverse/disclaimer audit opinion, a capital impairment ratio of 50% or more, fewer than 200 general shareholders or under 5% shareholding ratio, average monthly trading volume below 1% of free float for a half-year, an insufficient number of outside directors, 10+ accumulated penalty points for disclosure violations, sales below KRW 30 billion (phased-in thresholds of KRW 5bn until 2026, KRW 10bn in 2027, KRW 20bn in 2028), or market capitalization below KRW 50 billion for 30 consecutive trading days (phased-in thresholds of KRW 5bn until 2025, KRW 20bn in H1 2026, KRW 30bn in H2 2026); persistence of these conditions for two consecutive years, or immediate-delisting triggers (e.g. consecutive modified audit opinions, failure to submit a business report within 10 days of the deadline), lead directly to delisting"
    sources:
      - title: Designation of Administrative Issues and Delisting Criteria for the KOSPI Market
        url: https://global.krx.co.kr/contents/GLB/03/0303/0303050500/GLB0303050500.jsp
        accessed: 2026-08-16
    quote: "When market capitalization drops below KRW 50 billion and remains so for 30 consecutive trading days. ... Less than KRW 30 billion at the end of the most recent fiscal year."
    confidence: high

  delisting_process:
    zh: "退市流程：上市公司触发管理股指定标准→被指定为管理股（관리종목）→给予改善期整改→若未在改善期内消除事由，由上市审查委员会审议→KRX作出退市决定→经7个交易日整理卖出后摘牌。2025年改革强化了财务维持标准（市值/营收分三阶段提高，2026年起实施）并缩短改善期、简化程序；因审计意见不符等硬性事由者可被立即退市。"
    en: "Delisting process: an issuer breaches an administrative-issue designation criterion → designated as an administrative issue → granted an improvement period to cure → if not cured, the Listing Review Committee deliberates → KRX decides delisting → after a 7-trading-day liquidation period the stock is removed. The 2025 reform strengthened the financial maintenance thresholds (market-cap/revenue phased in from 2026), shortened the improvement period and streamlined procedures; hard triggers such as a modified audit opinion can lead to immediate delisting."
    sources:
      - title: Reform Plans for IPO and Delisting Rules（FSC）
        url: https://www.fsc.go.kr/eng/pr010101/83926
        accessed: 2026-08-27
      - title: Designation of Administrative Issues and Delisting Criteria for the KOSPI Market（KRX）
        url: https://global.krx.co.kr/contents/GLB/03/0303/0303050500/GLB0303050500.jsp
        accessed: 2026-08-27
    quote: "Currently, once a company is delisted, there is virtually no way for investors to trade the delisted stocks other than a post-delisting liquidation trading period of seven trading days."
    confidence: medium

  delisting_transition_period:
    zh: "退市决定生效后，先有7个交易日的「整理卖出」(liquidation trading)期供投资者退出，之后正式摘牌；在退市决定前，被指定为管理股的发行人有一个「改善期」(improvement period)进行整改，2025年金融委员会退市制度改进方案缩短了改善期并改为技术与实质退市事由并行审查。摘牌后自2026年1月起可进入K-OTC「退市企业指定部」继续交易最多6个月（见 post_delisting_venue）。"
    en: "After a delisting decision becomes effective, there is first a 7-trading-day 'liquidation (clean-up) trading' period for investors to exit before formal delisting; prior to the decision, an issuer designated as an administrative issue is given an 'improvement period' to cure deficiencies. The 2025 FSC delisting-reform plan shortened the improvement period and introduced parallel review of technical and substantive delisting grounds. From January 2026, post-delisting the stock may enter the K-OTC 'Delisted Company Division' for up to six months of continued trading (see post_delisting_venue)."
    sources:
      - title: Reform Plans for IPO and Delisting Rules（FSC）
        url: https://www.fsc.go.kr/eng/pr010101/83926
        accessed: 2026-08-27
    quote: "shortening improvement periods and a parallel review of technical and substantive delisting reasons"
    confidence: medium

  post_delisting_venue:
    zh: "摘牌后，股票自2026年1月2日起可进入韩国金融投资协会(KOFIA)运营的K-OTC市场的「退市企业指定部」(Delisted Company Division)，为符合最低投资者保护要件（无保留/限定范围审计意见、股份可转让、无破产等）的退市股提供最长6个月的交易支持；6个月后若KOFIA认定适当，可转入K-OTC登记·指定企业部继续场外交易。这是对原仅7个交易日整理卖出后基本无法交易的补缺。"
    en: "After delisting, from 2 January 2026 stocks may enter the 'Delisted Company Division' of the K-OTC market operated by the Korea Financial Investment Association (KOFIA), which supports up to six months of trading for delisted issues meeting minimum investor-protection criteria (unqualified/non-scope-limited audit opinion, transferable shares, no bankruptcy, etc.); after six months, if KOFIA deems it appropriate, the stock may be transferred to the K-OTC registered/designated division to continue OTC trading. This remedies the prior situation where, after the 7-day liquidation period, delisted stocks were essentially untradeable."
    sources:
      - title: Reform Plans for IPO and Delisting Rules（FSC）
        url: https://www.fsc.go.kr/eng/pr010101/83926
        accessed: 2026-08-27
      - title: K-OTC 상장폐지지정기업부 운영（KOFIA）
        url: https://www.k-otc.or.kr/public/rule/delistRegistProcess
        accessed: 2026-08-27
    quote: "will be established to support trading of delisted stocks for six months. After the six months of trading, those stocks may be transferred to the K-OTC platform to continue to be traded if KOFIA deems it appropriate. The K-OTC support system for trading delisted stocks will be implemented in three phases starting January 2026."
    confidence: high

