    margin_practice_note:
      zh: "按付款方分两级：客户保证金（投资者→会员）与结算会员保证金（会员→交易所）；引入夜盘后，结算会员保证金由原先每日算一次改为每日算两次（常规、夜盘收盘后各计算一次），缴纳截止时间相应缩短一小时（原T+1日12:00 → 现11:00）；若夜盘重算所得应缴保证金较前一常规时段末的保证金「显著更高」（增幅达120%以上，或增量达500亿韩元以上），须在11:00截止前补缴该重算金额"
      en: "Margin is split by payer into two tiers: customer margin (investor to member) and (clearing) member margin (member to Exchange). With the introduction of the Night-Session, member margin is now calculated twice each trading day (once after the regular session closes and once after the night session closes) instead of once, and the deposit deadline is shortened by one hour (from 12:00 to 11:00 on T+1 day). If the recalculated margin required after the night session is significantly higher than the amount at the end of the prior regular session — by 120% or more, or by KRW 50 billion or more — the account holder must deposit the recalculated amount by the 11:00 deadline"
      sources:
