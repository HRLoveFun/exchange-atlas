    en: "Korea's stock brokerage commissions are freely priced by securities firms with no regulatory ceiling or floor; retail online commissions are extremely low (several internet brokers such as Kiwoom, Mirae Asset and Toss compete with zero or near-zero commissions), while traditional offline rates sit in a negotiable ~0.0x%–0.1% range; institutional and block-trade rates are negotiated separately. Foreign investors trading through local broker accounts face the same commission structure. Derivatives carry separate per-contract exchange/clearing fees (see exchange_fees, clearing_fees)."
    sources:
      - title: Securities firms' 2025 net spikes 39 pct on increased stock turnover（Yonhap，券商竞争格局）
        url: https://en.yna.co.kr/view/AEN20260325006700320
