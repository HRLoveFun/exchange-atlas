# 三｜监管与法律环境
# ═══════════════════════════════════════════════
regulation:
  _meta:
    verified: 2026-08-27
    confidence: high

  regulator:
    zh: "金融委员会（Financial Services Commission, FSC）"
    en: "Financial Services Commission (FSC)"
    detail: "金融监督院（Financial Supervisory Service, FSS）作为FSC的执行/检查机构协同监管，本次未找到单独描述FSS职责边界的官方原文，未展开。"
    sources:
      - title: Financial Investment Services and Capital Markets Act（FSCMA，第373-2条）
        url: https://elaw.klri.re.kr/eng_service/lawTwoView.do?hseq=31782
        accessed: 2026-08-16
    quote: "An entity that wishes to establish or operate a financial investment instruments market shall... obtain permission from the Financial Services Commission for one Exchange"
    confidence: high

  self_regulatory_org:
    zh: "市场监督委员会（Market Oversight Commission）——KRX内设的自律监管机构"
    en: "Market Oversight Commission — an internal self-regulatory body of the KRX"
    sources:
      - title: Market Oversight Commission（KRX官网英文版）
        url: https://global.krx.co.kr/contents/GLB/01/0103/0103020500/GLB0103020500.jsp
        accessed: 2026-08-16
    quote: "The Market Oversight Commission is an internal agency of the KRX pursuant to laws governing the Korea Exchange and performs self-regulation duties on securities and derivatives markets."
    confidence: high

  clearing_regulator:
    zh: "金融委员会（FSC）——与整体市场监管机构相同，交易所本身作为CCP的资质同样源于FSC批准的交易所许可"
    en: "Financial Services Commission (FSC) — same overall regulator; the Exchange's own CCP function is likewise grounded in the FSC-granted Exchange permission"
    detail: "本次未找到单独就「清算监管」职责划分的专门条款原文，是从373-2条整体交易所许可制度推断，故标 medium。"
    sources:
      - title: Financial Investment Services and Capital Markets Act（FSCMA）
        url: https://elaw.klri.re.kr/eng_service/lawTwoView.do?hseq=31782
        accessed: 2026-08-16
    confidence: medium

  core_laws:
    zh: "《资本市场与金融投资业法》（Financial Investment Services and Capital Markets Act, FSCMA）"
    en: "Financial Investment Services and Capital Markets Act (FSCMA)"
    detail: "现行版本编号 No.21448（2026-03-06生效），韩国法制研究院（KLRI）官方英译数据库同页堆叠了该法历年全部修正版本。"
    sources:
      - title: Financial Investment Services and Capital Markets Act（FSCMA，第1条）
        url: https://elaw.klri.re.kr/eng_service/lawTwoView.do?hseq=31782
        accessed: 2026-08-16
    quote: "The purpose of this Act is to contribute to the development of the national economy by facilitating financial innovation and fair competition in the capital market, as well as protecting investors and fostering the development of the financial investment business, thereby heightening the fairness, reliability, and efficiency of the capital market."
    confidence: high

  foreign_ownership_limit:
    zh: "韩国对上市股票不设全市场性的外资持股上限；外资可自由投资韩股，唯一例外是少数具有国家重要性的公司及部分行业（航空、通信、广播等）存在0%至49.99%不等的外资持股上限，具体受限名单由KRX按标的公布。1998年取消普通上市公司外资持股上限后，约2,500家上市公司中仅33只重点行业标的仍受个别上限约束。"
    en: "Korea imposes no economy-wide foreign ownership ceiling on listed equities; foreign investors may invest freely, with the only exceptions being a small number of companies of national importance and some industries (aviation, telecommunications, broadcasting, etc.) where limits ranging from 0% to 49.99% apply, and the restricted list is published by KRX on an issue-by-issue basis. After the 1998 abolition of the general cap, only 33 key-industry issues among ~2,500 listed companies still carry individual foreign-ownership caps."
    sources:
      - title: Foreign Investor Registration Requirement to be Abolished in Korea（FSC）
        url: https://www.fsc.go.kr/eng/pr010101/80123
        accessed: 2026-08-27
      - title: Investment regulation – South Korea（Clearstream Market Coverage）
        url: https://www.clearstream.com/clearstream-en/res-library/market-coverage/investment-regulation-south-korea-1283548
        accessed: 2026-08-27
    quote: "With the abolishment of foreign investors' stock holding limit for ordinary companies in 1998, there currently exist foreign investors' stock holding limits placed on only 33 items in key industries among 2,500 listed companies."
    confidence: medium

  capital_controls:
    zh: "韩国实行开放的资本账户，对证券组合投资不设一般性资本管制：境外投资者可自由买卖韩股（仅受个别行业外资持股上限约束，见 foreign_ownership_limit），且自2023年12月14日起废除外国投资者事前注册(IRC)要求，凭法人识别码(LEI)或个人护照号即可在券商开户交易。唯一剩余的事前管控是对33只重点行业标的外资持股上限的实时监控。"
    en: "Korea operates an open capital account with no general capital controls on portfolio investment: foreign investors may freely trade Korean equities (subject only to individual foreign-ownership caps on certain industries, see foreign_ownership_limit), and since 14 December 2023 the prior foreign-investor registration (IRC) requirement was abolished, so investors can open accounts at securities firms using a Legal Entity Identifier (LEI) or passport number. The only remaining ex-ante control is real-time monitoring of foreign-ownership caps on 33 key-industry issues."
    sources:
      - title: Foreign Investor Registration Requirement to be Abolished in Korea（FSC）
        url: https://www.fsc.go.kr/eng/pr010101/80123
        accessed: 2026-08-27
    quote: "foreign investors will be able to open investment accounts at securities firms without having to go through a prior registration process with the FSS"
    confidence: medium

  disclosure_requirements:
    zh: "官网将上市公司披露义务分为「定期披露」「即时披露」「公平披露」三类（KOSPI/KOSDAQ规则页各自的Disclosure小节均按此三分类组织），具体条文与频率本次未展开抓取"
    en: "The Exchange organizes listed-company disclosure obligations into three categories — Periodic Disclosure, Timely Disclosure and Fair Disclosure (mirrored in both the KOSPI and KOSDAQ regulation sections); specific provisions and frequency were not fetched in detail this session"
    sources:
      - title: Regulation ‧ Stocks ‧ KOSPI Market ‧ Disclosure（KRX官网英文版，栏目导航）
        url: https://global.krx.co.kr/contents/GLB/06/0602/0602010102/GLB0602010102.jsp
        accessed: 2026-08-16
    confidence: medium

  investor_protection:
    zh: "投资者保护以《资本市场与金融投资业法》(FSCMA)为法律基础，要求金融机构对一般投资者履行适合性(appropriateness)与妥当性(suitability)义务、充分说明风险，并禁止不公平交易；客户资产须隔离保管于韩国证券存管院(KSD)。零售投资者进入交易所衍生品市场另受「适格个人投资者」(qualified individual investor) 制度约束（须完成教育、模拟交易并缴纳基本存入金）。韩国没有针对证券交易亏损的普遍性投资者赔偿基金（不同于银行存款的KDIC存款保险）。"
    en: "Investor protection is anchored in the FSCMA, which imposes suitability and appropriateness obligations and risk-disclosure duties on financial firms for general investors and prohibits unfair trading; client assets must be segregated and held at the Korea Securities Depository (KSD). Retail access to the exchange-traded derivatives market is further gated by a 'qualified individual investor' regime (mandatory education, simulated trading and a basic deposit). There is no general securities-investor compensation fund covering trading losses (unlike bank deposits insured by the KDIC)."
    sources:
      - title: Financial Investment Services and Capital Markets Act（FSCMA，第1条）
        url: https://elaw.klri.re.kr/eng_service/lawTwoView.do?hseq=31782
        accessed: 2026-08-27
      - title: 금융투자회사의 영업 및 업무에 관한 규정（KOFIA，适合性/说明义务）
        url: https://law.kofia.or.kr/service/law/lawFullScreenContent.do?historySeq=257&seq=136
        accessed: 2026-08-27
    quote: "The purpose of this Act is to contribute to the development of the national economy by facilitating financial innovation and fair competition in the capital market, as well as protecting investors and fostering the development of the financial investment business, thereby heightening the fairness, reliability, and efficiency of the capital market."
    confidence: medium

