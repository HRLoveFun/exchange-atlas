      en: "Night-session holidays follow the regular session: whether the night session opens is determined by whether the regular session opened on the day the night session begins — if the night session's start date falls on a holiday (weekend, public holiday, etc.), that night's session is cancelled; conversely, night trading proceeds as scheduled as long as the regular session opened that day, even if the regular session is closed the next day"
