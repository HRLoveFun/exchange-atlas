  investor_structure:
    zh: "投资者结构以个人(散户)为主导：截至2025年末上市公司股东数达1,456万，其中个人占99.1%（1,442万）。按持股数计，KOSPI市场公司法人占46.2%、个人35.0%、外资18.8%；KOSDAQ市场个人占63.2%、公司法人30.9%、外资仅5.9%；KONEX外资约2.0%。按市值计外资占KOSPI约30.8%（2025年末，近年升至约三成），散户交易额占比约47%（2026年）。"
    en: "The investor base is retail-dominated: at end-2025 there were 14.56 million listed-company shareholders, of whom individuals accounted for 99.1% (14.42 million). By shares held, the KOSPI market is 46.2% corporations, 35.0% individuals and 18.8% foreigners; the KOSDAQ market is 63.2% individuals, 30.9% corporations and only 5.9% foreigners; KONEX foreigners ~2.0%. By market capitalization foreigners were ~30.8% of KOSPI at end-2025 (rising to about a third in recent years), and retail made up about 47% of trading value in 2026."
    sources:
      - title: One in Four Koreans Is a Shareholder（Asia Business Daily / KSD data）
        url: https://www.asiae.co.kr/en/article/2026031809540784827
        accessed: 2026-08-27
    quote: "In the KOSPI market, corporations held about 28.6 billion shares (46.2%), individuals 21.6 billion shares (35.0%), and foreign investors 11.6 billion shares (18.8%). In the KOSDAQ market, individuals held approximately 34.1 billion shares (63.2%)"
    confidence: medium

  account_opening_requirements:
    zh: "境内居民凭实名（居民登记号）在持牌证券公司开户即可交易；外国人自2023年12月14日起废除事前注册(IRC)要求，凭法人识别码(LEI，机构)或护照号(个人)即可在券商实名开户，无需先向金融监督院(FSS)注册；通过驻韩托管行/券商代理也可直接投资。开户后须开立韩元账户用于结算。"
    en: "Domestic residents open accounts at licensed securities firms under real-name verification (resident registration number) to trade; since 14 December 2023 foreign investors no longer need prior FSS registration (IRC) and may open real-name accounts at securities firms using a Legal Entity Identifier (LEI, for corporations) or passport number (for individuals), without first registering with the FSS; they may also invest directly via a standing proxy/custodian in Korea. A KRW account for settlement must be opened."
    sources:
      - title: Foreign Investor Registration Requirement to be Abolished in Korea（FSC）
        url: https://www.fsc.go.kr/eng/pr010101/80123
        accessed: 2026-08-27
    quote: "foreign investors will be able to open investment accounts at securities firms without having to go through a prior registration process with the FSS. Foreign corporate entities can use their legal entity identifiers (LEIs) and foreign individuals can use their passport numbers to open investment accounts"
    confidence: medium

  suitability_management:
    zh: "对一般投资者，金融机构负有适合性(appropriateness)与妥当性(suitability)义务及风险说明义务（依据《金融投资业法规》）；对交易所衍生品等高风险产品，零售个人须先取得「适格个人投资者」(qualified individual investor)资格——须完成协会/券商教育课程与交易所模拟交易、缴存基本存入金（如KOSPI200期权买入30百万韩元、期货30百万韩元、ELW 15百万韩元），并逐笔/逐产品限制特定委托类型。外国人及专业投资者豁免该适格性要求。"
    en: "For general investors, financial firms owe appropriateness and suitability obligations plus risk-disclosure duties (under the Regulations on Financial Investment Business); for high-risk products such as exchange-traded derivatives, retail individuals must first qualify as 'qualified individual investors' — they must complete association/exchange education and exchange-simulated-trading courses and post a basic deposit (e.g. KRW 30 million for KOSPI 200 option buys and futures, KRW 15 million for ELW), with certain order types restricted per product. Foreigners and professional investors are exempt from the eligibility requirement."
    sources:
      - title: 금융투자회사의 영업 및 업무에 관한 규정（KOFIA，适合性/适格性）
        url: https://law.kofia.or.kr/service/law/lawFullScreenContent.do?historySeq=257&seq=136
        accessed: 2026-08-27
      - title: "Korea's Derivatives Market: A Call for Reconsidering the Basic Deposit Regime（KCMI）"
        url: https://www.kcmi.re.kr/kcmifile/webzine_content/OPINION/5049/webzinepdf_5049.PDF
        accessed: 2026-08-27
    quote: ""
    confidence: medium

  foreign_access_channel:
    zh: "境外投资者没有类似「沪港通/深港通」式的互联互通专门通道，而是通过本地持牌券商（或驻韩全球托管行代理）直接开户交易韩股；自2023年12月废除外国投资者事前注册后，凭LEI/护照即可开户。境外ETF等间接渠道亦可投资韩国市场。场外(OTC)交易原受限，改革后扩大事后报告范围。"
    en: "Foreign investors have no Stock-Connect-style dedicated channel; they trade Korean equities by opening accounts directly at local licensed securities firms (or via a standing proxy/custodian in Korea). Since the Dec-2023 abolition of prior foreign-investor registration, LEI/passport suffices to open an account. Indirect exposure is also available through overseas-listed ETFs. OTC transactions were previously restricted and have been broadened to ex-post reporting under the reform."
    sources:
      - title: Foreign Investor Registration Requirement to be Abolished in Korea（FSC）
        url: https://www.fsc.go.kr/eng/pr010101/80123
        accessed: 2026-08-27
      - title: Guidelines for Trading in Korean Capital Market（KRX）
        url: https://global.krx.co.kr/contents/GLB/01/0109/0109000000/guidelines_for_trading_in_korean_capital_market.pdf
        accessed: 2026-08-27
    quote: "foreign investors will be able to open investment accounts at securities firms without having to go through a prior registration process with the FSS"
    confidence: medium

  membership_structure:
    zh: "持有FSCMA第12(1)条投资交易/投资经纪业务牌照的机构方可申请会员资格；会员按市场范围与产品种类分七类（证券会员/股票证券会员/集合投资证券会员/债务证券会员/衍生品会员/股票衍生品会员/货币利率衍生品会员），并按是否自行承担结算责任分为结算会员与交易会员；财务门槛举例：证券会员+衍生品会员需股本至少400亿韩元且净资本比率100%以上，证券会员+股票衍生品会员需股本至少300亿韩元"
    en: "Entities holding a license for investment trading or investment brokerage business under FSCMA Article 12(1) are eligible to apply for membership; members are classified into seven types by market scope and product coverage (Securities, Equity Securities, Collective Investment Securities, Debt Securities, Derivatives, Equity Derivatives, and Currency-interest Rate Derivatives members), and further split into Settlement Members and Trading Members depending on whether they bear settlement responsibility directly; example financial thresholds: Securities + Derivatives member requires equity capital of at least KRW 40 billion and a net capital ratio of 100%+, while Securities + Equity Derivatives member requires at least KRW 30 billion"
    sources:
      - title: Members（KRX官网英文版）
        url: https://global.krx.co.kr/contents/GLB/01/0102/0102070100/GLB0102070100.jsp
        accessed: 2026-08-16
    quote: "Entities holding licenses for engaging in investment trading or investment brokerage businesses under Article 12(1) of the Financial Investment Services and Capital Markets Act are eligible to join the Exchange ... Equity Capital of 40 billion KRW or more"
    confidence: high

  broker_landscape:
    zh: "韩国证券市场由约61家本土证券公司(securities firms)主导，另有多家外资券商在韩分支机构（如高盛、摩根士丹利、摩根大通、瑞银、法国巴黎银行等）；2025年61家本土券商合计净利润9.65万亿韩元，创纪录。市场高度集中，前十大券商（韩国投资、三星、KB、NH、未来资产等）占据大部分份额，同时亦有Toss Securities等新兴互联网券商。"
    en: "Korea's securities market is dominated by about 61 domestic securities firms, plus several foreign securities branches in Korea (e.g. Goldman Sachs, Morgan Stanley, J.P. Morgan, UBS, BNP Paribas); the 61 domestic securities firms posted a combined net profit of KRW 9.65 trillion in 2025, a record. The market is highly concentrated among the top ten (Korea Investment, Samsung, KB, NH, Mirae Asset, etc.), with newer internet brokers such as Toss Securities also present."
    sources:
      - title: Securities firms' 2025 net spikes 39 pct on increased stock turnover（Yonhap）
        url: https://en.yna.co.kr/view/AEN20260325006700320
        accessed: 2026-08-27
      - title: Investment Companies（FSS，券商名录）
        url: https://fss.or.kr/eng/fncco/engCoreMngmt/fisisInvest.do?menuNo=400117
        accessed: 2026-08-27
    quote: "The combined net profit of 61 domestic securities firms came to 9.65 trillion won (US$6.46 billion) last year, up 38.9 percent from a profit of 6.94 trillion won a year earlier"
    confidence: medium

