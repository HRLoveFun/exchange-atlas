        zh: "FICC类衍生品（利率、货币期货）采用固定比例而非分级：美元期货±4.5%、3年期国债期货±1.5%、10年期国债期货±2.7%（常规与夜盘同一比例，不像股指类衍生品在夜盘收窄）；商品类（黄金、瘦肉猪期货）的涨跌停比例本次未核实"
        en: "FICC derivatives (interest-rate and currency futures) use a fixed percentage rather than a tiered structure: USD Futures ±4.5%, 3-Year KTB Futures ±1.5%, 10-Year KTB Futures ±2.7% (the same in both the regular session and the Night-Session, unlike equity-index derivatives which narrow at night); the price-limit percentages for commodity derivatives (Gold, Lean Hog futures) were not verified this session"
        sources:
          - title: Guide to Night Session in KRX Derivatives Market（PDF，2025年4月，KRX衍生品市场官方发布）
            url: https://global.krx.co.kr/contents/GLB/02/0201/0201041003/Guide_to_Night_Session_in_KRX_Derivatives_Market.pdf
            accessed: 2026-08-18
        quote: "USD Futures 4.5% ⋯ 3-Yr KTB Futures 1.5% ⋯ 10-Yr KTB Futures 2.7% ⋯ Same as regular trading"
