  stamp_duty:
    spec: {type: none, note: "韩国无名为印花税的证券税种；对应流转税为证券交易税 STT（见 financial_transaction_tax）"}
    zh: "韩国对证券转让不征收「印花税」(stamp duty)这一独立税种；本项目横向对比中与该字段对应的、按交易金额课征的流转税是「证券交易税」(Securities Transaction Tax, STT)，其现行税率见 financial_transaction_tax（2026年起KOSPI/KOSDAQ均为0.20%）。韩国税法中并无名为印花税的证券税种。"
    en: "Korea does not impose a stamp duty as a separate tax on securities transfers; the transaction-value turnover tax that corresponds to this field in cross-exchange comparison is the 'Securities Transaction Tax' (STT), whose current rate is in financial_transaction_tax (0.20% for both KOSPI and KOSDAQ from 2026). Korean law has no securities stamp-duty instrument."
    sources:
      - title: Korea enacts 2026 tax reform bill（EY TaxNews，仅论及证券交易税，未见印花税）
        url: https://taxnews.ey.com/news/2026-0126_korea_enacts_2026_tax_reform_bill
        accessed: 2026-08-27
    quote: "the 2026 Tax Reform increases securities transaction tax rates on securities traded on Korea's stock exchange. Enacted rate will be effective for the securities transferred on or after 1 Jan 2026."
    confidence: low

  financial_transaction_tax:
    spec: {rate: 0.2, unit: pct, side: sell, note: "STT 2026 年起 KOSPI/KOSDAQ 均 0.20%（此前 KOSPI 0%、KOSDAQ 0.15%）；ETF/债券通常免征"}
    zh: "证券交易税(STT)：2026年税制改革将韩股交易税恢复并定为 KOSPI市场0.20%、KOSDAQ市场0.20%（此前KOSPI为0%、KOSDAQ为0.15%），自2026年1月1日起对当日或之后转让的证券施行。ETF/债券通常免征。"
    en: "Securities Transaction Tax (STT): the 2026 tax reform restored and set the Korean stock transaction tax to 0.20% for the KOSPI market and 0.20% for the KOSDAQ market (previously 0% for KOSPI and 0.15% for KOSDAQ), effective 1 January 2026 for securities transferred on or after that date. ETFs/bonds are generally exempt."
    sources:
      - title: Korea enacts 2026 tax reform bill（EY TaxNews）
        url: https://taxnews.ey.com/news/2026-0126_korea_enacts_2026_tax_reform_bill
        accessed: 2026-08-27
    quote: ""
    confidence: medium
    detail: "原引用文本（未能从缓存源逐字核实，故降级为 medium）：\"KOSPI Market 0% 0.20% KOSDAQ Market 0.15% 0.20% ... Enacted rate will be effective for the securities transferred on or after 1 Jan 2026.\" 缓存的 EY 页面仅为 JS/登录墙外壳，未含文章正文，无法逐字核验，需重新抓取原始正文或改用官方税法来源坐实 2026 年税率。"

  capital_gains_tax:
    zh: "资本利得税：韩国对个人股票转让（无论持有期）不征一般资本利得税；仅「大股东」(major shareholder，单只股票持股≥50亿韩元)的转让价差按约20%（含10%地方税，约22%）单独计税。2025年税改曾拟将大股东门槛由50亿韩元下调至10亿韩元，但在散户反弹后，政府于2025年9月决定维持50亿韩元门槛不变。"
    en: "Capital gains tax: Korea does not impose a general capital-gains tax on individuals' stock transfers regardless of holding period; only 'major shareholders' (holding ≥ KRW 5 billion in a single stock) are taxed on transfer gains at ~20% (plus 10% local, ≈22%) separately. The 2025 tax reform had proposed lowering the major-shareholder threshold from KRW 5 billion to KRW 1 billion, but after a retail backlash the government decided in Sept 2025 to keep the KRW 5 billion threshold unchanged."
    sources:
      - title: (LEAD) Gov't to leave capital gains tax threshold for stock investment unchanged（Yonhap）
        url: https://en.yna.co.kr/view/AEN20250915001551320
        accessed: 2026-08-27
      - title: "Koo Yooncheol: Stock Transfer Tax Threshold Maintained at 5 Billion Won（Asia Business Daily）"
        url: https://www.asiae.co.kr/en/article/2025091508135490195
        accessed: 2026-08-27
    quote: "keep the threshold for capital gains tax on stock holdings at the current level of 5 billion won"
    confidence: medium

  dividend_withholding_tax:
    zh: "股息预扣税：非居民收到的韩国股息，法定预扣税率22%（20%所得税+10%地方税）；依据税收协定可降至10%或15%（如韩美协定10%）。居民个人可选择分离计税，股息分离税率14%+1.4%≈15.4%（另有并入综合所得申报选项）。本次未从原始来源抓取逐项核实，数值为通用认知，建议以OECD/KRX税制页复核。"
    en: "Dividend withholding tax: non-residents receiving Korean dividends face a statutory withholding of 22% (20% income tax + 10% local surtax); tax treaties reduce this to 10% or 15% (e.g. Korea–US treaty 10%). Resident individuals may elect separate taxation at 14% + 1.4% local ≈ 15.4% (or include in global income). This was not verified from a primary source this session; figures reflect general knowledge and should be re-checked against OECD/KRX tax pages."
    sources:
      - title: Korea — Withholding tax overview（通用税制综述，非一手来源）
        url: https://www.kchipnews.com/
        accessed: 2026-08-27
    quote: ""
    confidence: low

  implicit_costs_note:
    zh: "隐性成本（买卖价差、市场冲击）方面：韩国市场散户主导、个股流动性分化大——大盘蓝筹（三星电子等）价差窄、冲击成本低；大量小盘/创业板(KOSDAQ)个股流动性差、价差宽、冲击成本高。2025年改革引入市价单最低执行比率(skim)等机制以缓解极端波动下的隐性成本。整体隐性成本高于以机构为主的市场。"
    en: "Implicit costs (bid-ask spread, market impact): Korea is retail-dominated with highly fragmented liquidity — large-cap blue chips (e.g. Samsung Electronics) have tight spreads and low impact cost, while many small-cap/KOSDAQ names are illiquid with wide spreads and high impact cost. The 2025 reform introduced mechanisms such as a minimum execution ratio for market orders (skim) to mitigate implicit costs during extreme moves. Overall implicit costs are higher than in institution-dominated markets."
    sources:
      - title: One in Four Koreans Is a Shareholder（Asia Business Daily / KSD 投资者结构）
        url: https://www.asiae.co.kr/en/article/2026031809540784827
        accessed: 2026-08-27
      - title: Reform Plans for IPO and Delisting Rules（FSC，市价单最低执行比率）
        url: https://www.fsc.go.kr/eng/pr010101/83926
        accessed: 2026-08-27
    quote: "In the KOSPI market, corporations held about 28.6 billion shares (46.2%), individuals 21.6 billion shares (35.0%)"
    confidence: medium

