    matching_principle:
      enum: price_time
      zh: "连续交易阶段采用个别竞价、价格优先与时间优先原则：较低卖价优先于较高卖价，较高买价优先于较低买价，同价申报按接收先后排序；但在单一价格集合竞价中，若成交价落在涨跌停价，则不适用时间优先，改按数量优先分配成交（大额申报优先于小额申报，同数量再按时间优先）"
      en: "Continuous trading applies individual auction with price and time priority: a lower ask has priority over a higher ask, a higher bid has priority over a lower bid, and among same-priced orders the one received earlier has priority; however, in a single-price (call) auction, if the determined price is at the daily price limit, time priority is not applied — quantity priority is used instead (larger orders matched before smaller ones, with time priority applied among orders of equal quantity)"
      sources:
        - title: Regulation ‧ Derivatives ‧ Method of Trade Execution（KRX官网英文版）
          url: https://global.krx.co.kr/contents/GLB/06/0603/0603010700/GLB0603010700.jsp
          accessed: 2026-08-18
      quote: "Individual auction has price and time priorities for the orders to execute. That is, a lower ask has the priority over a higher ask and a higher bid has the priority over a lower bid. Among the orders with same prices, the order received earlier has the priority over those received later. However, in case of single price auction, if the price is determined at the upper or lower price limit, the time priority is not applied to those orders at the price limit. Orders are matched based on quantity priority where the larger order has the priority over the smaller order and the execution quantity is allocated from the larger ones to the smaller ones until the whole quantity is matched. Among the orders with same quantity, time priority is applied."
      confidence: high

    order_types:
      zh: "限价申报（指定价格与数量）、市价申报（仅指定数量，以市场最优价成交）、限价转收盘价申报（收盘前连续交易阶段未成交的限价申报转为市价申报并入收盘集合竞价）、即时可执行限价申报（申报时的最优价格即固定为成交价的一种市价类申报，未成交余量按最初最优价挂单排队）；另可附加FOK（Fill or Kill，全部成交或全部取消）、IOC（Immediate or Cancel，部分成交、剩余取消）两种条件"
      en: "Limit order (price and quantity both specified); Market order (only quantity specified, matched at the best available price); Limit-to-market-on-close order (an unexecuted limit order at the end of continuous trading converts to a market order and joins the closing single-price auction); Immediately executable limit order (a market-order variant whose matching price is fixed at the best price at input time, with any unexecuted balance queued in the order book at that initial best price); orders may also carry a Fill-or-Kill (FOK) or Immediate-or-Cancel (IOC) condition"
      sources:
        - title: Regulation ‧ Derivatives ‧ Order Types（KRX官网英文版）
          url: https://global.krx.co.kr/contents/GLB/06/0603/0603010200/GLB0603010200.jsp
          accessed: 2026-08-18
      quote: "The limit order is an order of which the price and quantity are specified. It is matched at prices better than the specified price or at the specified price. The market order is an order placed to buy or sell at the best available price. Whereas the quantity of order is specified, the price is not. The limit-to-market-on-close order is the limit order placed with an instruction to convert it to the market order and include it in the single price auction at the time when the closing price is determined, if the order remains unexecuted until the end of the continuous auction on a given trading day. The immediately executable limit order is the market order in the sense that its price is not specified, but it is different from the market order in that the matching price is fixed at the price that is the best at the time of input. Unexecuted best orders are queued in the order book at the initial best price. Fill or Kill : Orders are that all of the orders are cancelled, if not executed immediately after the enter thereof Immediate or Cancel : Orders are that any of the orders possible to execute is executed and the remaining order are cancelled"
      confidence: high

