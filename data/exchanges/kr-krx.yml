    circuit_breaker:
      enum: index_level
      zh: "衍生品市场本身未单独设立熔断机制，而是与现货市场的三阶段指数熔断（具体档位见顶层 circuit_breaker 字段）联动：现货市场熔断第三阶段（触发全市场收市）当日触发后，包括当晚夜盘在内的全部衍生品交易当天不开展；夜盘期间因标的股指本身不交易、无价格波动，熔断机制在夜盘无法被触发"
      en: "The derivatives market has no independent circuit breaker of its own; it is instead linked to the cash market's three-phase index circuit breaker (see the top-level circuit_breaker field): once the cash market's Phase-3 circuit breaker (market closed for the day) is triggered, all derivatives trading — including that day's Night-Session — is not conducted; during the Night-Session itself, the circuit breaker cannot be triggered at all because the underlying stock index does not trade and therefore has no price movement at night"
      detail: "受控词表 circuit_breaker_type 各选项均以「熔断机制本身独立存在」为设计语境；本字段的真实情况是衍生品市场完全没有自己的熔断判定，只是被动跟随现货市场的指数级熔断结果，这里借用 index_level 仅取「触发基础是指数」的含义，与顶层字段共享同一枚举值，不代表衍生品市场另有一套独立的指数级判定逻辑——这是裁剪后字段集合复用现货枚举时一处不完全贴合，做法参照 hk-hkex.derivatives.circuit_breaker 的既有先例。"
      sources:
        - title: Guide to Night Session in KRX Derivatives Market（PDF，2025年4月，KRX衍生品市场官方发布）
          url: https://global.krx.co.kr/contents/GLB/02/0201/0201041003/Guide_to_Night_Session_in_KRX_Derivatives_Market.pdf
          accessed: 2026-08-18
      quote: "there is no price fluctuation in the stock index during night hours, so circuit breaker (CB) cannot be triggered. However, if trading in the stock market is terminated due to the activation of CB stage 3 during the regular session, night trading for all derivatives that open on the same day, including FICC derivatives, is not conducted."
      confidence: high

    volatility_interruption:
      zh: "实时价格限制（Real-time Price Limits）：约束新成交价相对上一笔成交价的最大偏离幅度（区别于以当日基准价为准的每日涨跌停，见 price_limits），适用于夜盘可交易的10只品种中的8只；夜盘该限制较常规时段放宽一倍：KOSPI200期货/Mini-KOSPI200期货/KOSDAQ150期货及美元期货常规±1.0%、夜盘±2.0%（期货价差同幅度）；3年期国债期货常规±0.5%、夜盘±1.0%；10年期国债期货常规±0.9%、夜盘±1.8%；KOSPI200期权（含周期权）另按《衍生品市场业务规程施行细则》附件25单独规定"
      en: "Real-time Price Limits: constrain how far a new trade price may deviate from the immediately preceding trade price (distinct from the daily price_limits, which are set against the day's base price); applied to 8 of the 10 products tradable in the Night-Session. The night-session limit is doubled versus the regular session: KOSPI 200/Mini-KOSPI 200/KOSDAQ 150 Futures and USD Futures are ±1.0% (regular) / ±2.0% (night) — the same for futures spreads; 3-Year KTB Futures ±0.5% (regular) / ±1.0% (night); 10-Year KTB Futures ±0.9% (regular) / ±1.8% (night); KOSPI 200 Options (including Weekly Options) are separately governed by Annex 25 of the Enforcement Rules of the Derivatives Market Business Regulations"
      sources:
        - title: Guide to Night Session in KRX Derivatives Market（PDF，2025年4月，KRX衍生品市场官方发布）
          url: https://global.krx.co.kr/contents/GLB/02/0201/0201041003/Guide_to_Night_Session_in_KRX_Derivatives_Market.pdf
          accessed: 2026-08-18
      quote: "Real-time price limits are applied to 8 products among the tradable products to night trading ⋯ KOSPI 200 Futures Mini-KOSPI 200 Futures 1.0% 2.0% 1.0% 2.0% ⋯ USD Futures 1.0% 2.0% 1.0% 2.0% ⋯ 3-Yr KTB Futures 0.5% 1.0% 0.5% 1.0% ⋯ 10-Yr KTB Futures 0.9% 1.8% 0.9% 1.8% ⋯ [Annex 25]"
      confidence: high

    trading_halt_mechanism:
      zh: "分强制暂停（Compulsory Suspension）与裁量暂停（Discretionary Suspension）两类：强制暂停即现货市场熔断触发时联动暂停衍生品交易（见 circuit_breaker），夜盘不适用此类暂停；裁量暂停指交易所/会员系统故障或异常交易情形导致的暂停，夜盘同样适用但触发条件因夜盘特性有所调整（如现货系统故障超过10分钟导致指数成分股大量无法交易的情形，因夜盘不计算股指而不适用；单一股票期货期权因标的股票停牌而暂停的情形，因该类产品夜盘本身不交易而不适用；交易所认定存在或可能存在异常交易情形时的裁量暂停则夜盘同样适用）；暂停后恢复交易同样以集合竞价方式确定首笔价格（见 opening_mechanism）"
      en: "Two categories: Compulsory Suspension — triggered in lockstep with the cash market's circuit breaker (see circuit_breaker), and not applicable to the Night-Session; and Discretionary Suspension — for Exchange/member system failures or abnormal trading conditions, which does apply to the Night-Session but with trigger conditions adjusted for the night session's characteristics (e.g. a cash-market system failure lasting over 10 minutes that leaves a large number of an index's constituents untradeable does not apply at night, since the index is not calculated then; a single-stock futures/options halt triggered by suspension of the underlying stock does not apply at night, since those products are not traded at night; Exchange-discretion halts for actual or potential abnormal trading conditions do apply at night). Trading resumes via the same call-auction mechanism used to set the opening/closing price (see opening_mechanism)"
      sources:
        - title: Guide to Night Session in KRX Derivatives Market（PDF，2025年4月，KRX衍生品市场官方发布）
          url: https://global.krx.co.kr/contents/GLB/02/0201/0201041003/Guide_to_Night_Session_in_KRX_Derivatives_Market.pdf
          accessed: 2026-08-18
      quote: "The compulsory suspension refers to cases where the market can be operated but trading is suspended as needed, and does not apply to night trading. This is because there is no price fluctuation in the stock index during night hours, so circuit breaker (CB) cannot be triggered. ⋯ The discretionary suspension refers to suspension due to the impossibility of market operation or trading of a specific product, and includes Exchange and member system failures. The discretionary suspension also applies to night trading, with some exceptions. ⋯ When a system failure occurs in the stock market for more than 10 minutes and trading is not possible for a certain number of stock index constituents"
      confidence: high

    block_trade:
      zh: "协商大宗交易（Negotiated Block Trades）：买卖双方自行协商标的、价格、数量后经会员向交易所申请撮合成交，适用于绝大多数衍生品（例外：KOSPI200波动率指数期货、5年期国债期货、美元期权、瘦肉猪期货及其对应价差交易被排除在外）；另设期货转现货（EFP, Exchange of Futures for Physicals）交易方式，仅美元期货可用，且不适用于夜盘"
      en: "Negotiated Block Trades: counterparties privately negotiate the issue, price and quantity, then file the trade with the Exchange via a member for execution; available for the great majority of derivatives (exclusions: KOSPI 200 Volatility Index futures, 5-Year KTB futures, USD options, Lean Hog futures, and the corresponding spread trades). A separate Exchange of Futures for Physicals (EFP) mechanism also exists, available only for USD Futures and not applicable during the Night-Session"
      sources:
        - title: Regulation ‧ Derivatives ‧ Method of Trade Execution（KRX官网英文版）
          url: https://global.krx.co.kr/contents/GLB/06/0603/0603010700/GLB0603010700.jsp
          accessed: 2026-08-18
      quote: "Negotiated block trading is used for the convenience of the block traders like institutional investors who intend to trade a large amount of securities without any sudden impact on the market price. Trading parties negotiate the transaction details such as the issue, price and quantity and file an application with the exchange via members to execute the block trade. The following derivatives are availiable for negotiated block trading : 1. Equity derivatives trades. Provided that KOSPI 200 volatility index futures trades are excluded; 2. Interest futures trades. Provided that 5-year KTB futures trades are exclueded; 3. Currency derivatives trades. Provided that USD options trades are exclueded; 4. Commodity futures trades. Provided that Lean Hog futures trades are exclueded; 5. Futures spread trades. Provided that KOSPI 200 volatility index futures spread trades, 5-year KTB futures spread trades, Inter-KTB futures spread trades and Lean Hog futures spread trades are excluded ⋯ EFP trading is a method of block trading for the convenience of the block traders like institutional investors who intend to trade a large amount of EFPs avoiding sudden fluctuations in the market price from the large volume. ⋯ EFPs are available for USD futures. * EFPs are not applicable during night session"
      confidence: high
      detail: "未找到协商大宗交易的最低数量/金额门槛具体数值（现货市场对应门槛见顶层 block_trade 字段），本次抓取材料仅确认适用品种范围与交易方式，未展开具体门槛，已记入 PROJECT/OPEN-QUESTIONS.md。"

    market_maker_scheme:
      zh: "夜盘官方指南明确表示，因夜盘可交易品种本身流动性充足，暂不引入做市商制度，未来将视夜盘交易情况评估是否引入——该表述隐含常规时段衍生品市场存在做市商制度作为参照基准，但本次抓取材料未找到衍生品做市商资格/义务/激励条款的独立说明页，具体制度未展开"
      en: "The official Night-Session guide states that, because night-tradable products are already highly liquid, a market-maker system will not be introduced for the Night-Session (KRX will reassess after observing night-session trading trends) — this statement implies a market-maker system exists as the baseline for the regular session, but no dedicated official page describing the derivatives market's own market-maker qualifications/obligations/incentives was located this session; not further explored"
      sources:
