    en: "The most serious incident in two decades: on 18 March 2025 a faulty mid-price quoting in a single stock (Dongyang Steel Pipe) triggered cascading errors in the KOSPI index calculation, and all trading across KOSPI/KOSDAQ/KONEX was halted for seven minutes from 11:37 to 11:44 — the first market-wide halt since the 2005 exchange merger. KRX apologized and began improvements. There have been isolated broker-system glitches causing local halts, but no other market-wide outage of comparable length."
