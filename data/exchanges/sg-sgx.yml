  listing_process_duration:
    zh: "上市全流程通常耗时约 21–23 周（以主板为例：含筹备、保荐人尽职调查、交易所与 MAS 双重审阅、路演与挂牌），其中 MAS 对招股说明书的审阅约需 6–8 周；凯利板因保荐人主导、无量化门槛，流程相对更短但取决于保荐人准备节奏。该时长为行业通行估计，第三方资料（律所上市指引）综合给出，本次未找到 sgx.com 官方给出的固定时长承诺，故标 medium。"
    en: "A full Mainboard IPO typically takes about 21–23 weeks (preparation, sponsor due diligence, dual SGX/MAS review, roadshow and listing), of which the MAS prospectus review is about 6–8 weeks; the Catalist route, being sponsor-led with no quantitative threshold, is relatively quicker but depends on the sponsor's pace. The figure is an industry-wide estimate from third-party listing guides; no fixed official SGX commitment was found, so confidence is medium."
    sources:
      - title: SGX — Listing on SGX (official listing pathway overview)
        url: https://www.sgx.com/ipo/listing-on-sgx
        accessed: 2026-08-27
    confidence: medium

  transfer_between_boards:
    zh: ""
    confidence: low

  continuing_obligations:
    zh: "发行人列入官方名单后须持续遵守持续义务：最核心的是即时披露（重大信息即时通过 SGXNET 公告），另含股本变动、关联方交易、重大交易、通函与年报/中期报告等定期与持续披露义务。"
    en: "Once admitted to the Official List, an issuer must observe continuing obligations: the core is the immediate-disclosure duty (material information announced immediately via SGXNET), supplemented by obligations on changes in capital, interested-person transactions, significant transactions, and periodic reporting (circulars and annual/half-yearly reports)."
    detail: "持续义务以「披露为本」为基调：除即时披露外，发行人须按时发布年报/中期报告并向市场披露重大进展；具体频率与格式由 Chapter 12 与 SGXNET 公告规则规定。"
    sources:
      - title: SGX-ST Rules Chapter 7 — Continuing Obligations (Rule 703)
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-27
    quote: "An issuer must announce any information known to the issuer concerning it or any of its subsidiaries or associated companies which: (a) is necessary to avoid the establishment of a false market in the issuer's securities; or (b) would be likely to materially affect the price or value of its securities."
    confidence: high

  suspension_resumption:
    zh: "SGX-ST 可主动或应发行人请求对证券实施停牌，恢复交易前相关证券须先进入至少 15 分钟的 Adjust 阶段（仅接受报单/改单/撤单，不撮合），结束时以均衡价算法一次性撮合后恢复正常交易；发行人亦可因待披露重大信息申请交易暂停（halt），通常给予一段披露散播时间。"
    en: "SGX-ST may suspend (or restrict) trading in a security on its own initiative or at an issuer's request; before trading resumes the security enters a minimum 15-minute Adjust Phase (order entry/amendment/withdrawal only, no matching), ending with a single Equilibrium-Price match before normal trading resumes; an issuer may also request a trading halt to facilitate disclosure of material information, typically allowing some time for dissemination."
    sources:
      - title: SGX-ST Rules 8.10.6（暂停后复牌的 Adjust 阶段）
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-27
    quote: "Securities or futures contracts subject to suspension will be placed in Adjust Phase for a minimum of 15 minutes before trading recommences."
    confidence: high

  delisting_conditions:
    zh: "交易所可依职权将发行人从官方名单剔除的情形包括：无法/不愿遵守上市规则、维护公平有序透明市场所需、交易所认为适当、已无上市证券，或SPAC触发特定条款；发行人主动申请退市须获至少75%独立股东（按票数，出席并投票）批准"
    en: "The Exchange may remove an issuer from the Official List where the issuer is unable/unwilling to comply with a listing rule, it is necessary for a fair/orderly/transparent market, the Exchange considers it appropriate, the issuer has no listed securities, or (for SPACs) specified triggers occur; a voluntary delisting requires approval by at least 75% of independent shareholders present and voting"
    sources:
      - title: Mainboard Rules 1305, 1307
        url: https://rulebook.sgx.com/rulebook/mainboard-rules
        accessed: 2026-08-14
    quote: "The Exchange may remove an issuer from its Official List (without the agreement of the issuer) if:— (1) the issuer is unable or unwilling to comply with, or contravenes, a listing rule. ... the resolution to delist the issuer has been approved by a majority of at least 75% of the total number of issued shares excluding treasury shares and subsidiary holdings held by the shareholders present and voting, on a poll, either in person or by proxy at the meeting."
    confidence: high

  delisting_process:
    zh: "退市须向股东提出「公平合理」的退出要约，默认含现金选项，并须委任独立财务顾问就要约公平合理性发表意见——2019年7月11日改革后的标准（此前仅要求「合理」，未要求「公平」）"
    en: "Delisting requires an exit offer to shareholders that is fair and reasonable, with a cash alternative as the default, and appointment of an independent financial adviser to opine on fairness and reasonableness — the standard following the 11 July 2019 reform (previously only \"reasonable\" was required, not \"fair\")"
    sources:
      - title: Mainboard Rules 1309
        url: https://rulebook.sgx.com/rulebook/mainboard-rules
        accessed: 2026-08-14
    quote: "an exit offer must be made to the issuer's shareholders and holders of any other classes of listed securities to be delisted. The exit offer must: (a) be fair and reasonable; and (b) include a cash alternative as the default alternative ... Amended on 11 July 2019 11 July 2019 ."
    confidence: high

  delisting_transition_period:
    zh: "SGX 本身不设定固定的「退市过渡期」时长；退市在股东大会批准（自愿退市须至少 75% 独立股东赞成）及「公平合理」退出要约（含现金选项）作出后生效，异议股东仍保留按退出要约被收购的权利。另需注意：2025年10月29日起主板规则中原有的「观察名单」（Watch-List，规则1310–1315）整章被删除，相关持续上市标准安排已变更。该字段为制度归纳，非官方原文逐字，标 medium。"
    en: "SGX does not impose a fixed statutory 'delisting transition period'; a delisting takes effect after shareholder approval (voluntary delisting requires ≥75% of independent-shareholder votes) and a fair-and-reasonable exit offer (with a cash alternative), with dissenting holders retaining their right to be bought out under the offer. Note also that, from 29 October 2025, the Mainboard Rules' former Watch-List (Rules 1310–1315) was deleted in its entirety. This field is a structural summary, not a verbatim rule, so confidence is medium."
    detail: "过渡期维度关注的是「从决定退市到正式摘牌之间是否有强制继续交易的窗口」，SGX 规则侧重退出要约公平性而非固定时长窗口；与停牌后复牌的 3 个月恢复观察期（Rule 8.10）属不同机制，勿混淆。"
    sources:
      - title: Mainboard Rules 1309 (exit offer / delisting)
        url: https://rulebook.sgx.com/rulebook/mainboard-rules
        accessed: 2026-08-27
    confidence: medium

  post_delisting_venue:
    zh: "对同时在境外（如 Nasdaq）上市的证券，SGX 退市后其股份仍可在原境外存管机构（如 Nasdaq 相关存管）继续持有与交易——规则明文允许 CDP 将已退市证券「转移给另一存管机构」以利股东处置；对仅在 SGX 单一上市的证券，退市后证券不进入任何交易所层面的二级交易场所，股东仅能通过与要约方的私有安排（exit offer）处置，新交所不提供退市后交易板。"
    en: "For securities also listed overseas (e.g. on Nasdaq), upon SGX delisting the shares may continue to be held and traded through the foreign depository (the rules expressly allow CDP to transfer delisted securities 'to another depository'); for securities listed solely on SGX, there is no exchange-level secondary trading venue after delisting — holders can only dispose of their shares via private arrangements with the offeror (the exit offer), and SGX provides no post-delisting trading board."
    detail: "本字段回答「退市后股票去哪交易」，核心区分：双重上市→境外存管继续；纯 SGX 上市→无交易所层面承接场所。与 delisting_process（退市程序是否需公平要约）是不同维度。"
    sources:
      - title: SGX-ST Rules Part 4 (Rules 606 / 607 — transfer of securities from CDP to another depository on delisting)
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-27
    quote: "Where the Exchange decides to delist or remove an issuer from the Official List, the depository may transfer securities ... to another depository"
    confidence: medium

