# 新加坡交易所 Singapore Exchange (SGX)
# 抓取来源见 PROJECT/SOURCES.md `sg-sgx` 一节；原始页缓存于 .cache/sg-sgx/
# source_lang: en——按 ADR-013「无中选英」，未找到可核实的官方中文原文，SGX 规则手册/MAS/IRAS/
# 新加坡政府法规官方公布平台（sso.agc.gov.sg）均只有英文版，直接用英文原文取数。
#
# ⚠️ 集团架构说明（本文件 group_id 判断依据，见 SOURCES.md sg-sgx 节同一说明）：
# SGX 集团（Singapore Exchange Limited，母公司）下 SGX-ST（Singapore Exchange Securities Trading
# Limited，现货证券）与 SGX-DT（Singapore Exchange Derivatives Trading Limited，衍生品）是两个
# 独立法人实体（另有 SGX-DC 衍生品清算、CDP 证券清算/存管，均为 SGX 全资子公司，见 CFTC 披露的
# 集团架构图）。但本项目 v1.0 Wave 1/2 名单只规划了一个 `sg-sgx` 条目，并未计划把 SGX-DT 拆成
# 姊妹交易所另行建档——这与 NYSE/JPX/Eurex 设 group_id 的情况不同（那几家集团内确有计划另行
# 收录的姊妹交易所品牌，如 NYSE American、大阪交易所）。故本文件**不设 group_id**，刻意合并成
# 一个条目代表整个可识别的"新交所"品牌，market_structure/clearing 等章节会分别标注现货
# （SGX-ST/CDP）与衍生品（SGX-DT/SGX-DC）两个业务面的差异，不强行只取一面。
#
# ⚠️ listing 章节适用性：与 de-eurex（纯衍生品所，整章按"设计前提不适用"处理）不同，SGX 现货
# 证券业务（SGX-ST）有完整的"公司上市"范式——Mainboard/Catalist/Global Listing Board 三个板块
# 均有明确的上市审核、持续义务、退市规则，因此本章按现货业务正常填写，不做整章留空处理。
id: sg-sgx
name_zh: 新加坡交易所
name_native: {en: "Singapore Exchange Limited (SGX)"}
official_languages: [en]
source_lang: en
region: apac

