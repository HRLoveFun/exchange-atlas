    zh: "前身为1973年从马来西亚证券交易所分立而来的新加坡证券交易所（SES）与1984年成立的新加坡国际金融交易所（SIMEX，商品期货交易所）；1999年12月1日两者与证券结算与电脑服务公司（SCCS）依《交易所（公司化与合并）法》合并公司化，组成新加坡交易所；2000年11月在本所主板挂牌"
    en: "Predecessors: the Stock Exchange of Singapore (SES, split from the Stock Exchange of Malaysia in 1973) and the Singapore International Monetary Exchange (SIMEX, a commodities futures exchange founded in 1984); on 1 December 1999 SES, SIMEX and Securities Clearing and Computer Services (SCCS) merged and demutualised into SGX under the Exchanges (Demutualisation and Merger) Act 1999; SGX itself listed on its own Mainboard in November 2000"
    detail: "1973年分立与2000年11月挂牌两处细节本次未逐条核实官方原文（未找到 sgx.com 历史页的可抓取版本，见 SOURCES.md），仅 1999-12-01 合并日期有 EDMA1999 法律原文直接支持，故整条 confidence 标 medium 而非 high。"
