  fx_risk_note:
    zh: "新加坡不以利率而以汇率为货币政策的中间目标：MAS 设定新加坡元名义有效汇率（S$NEER，贸易加权一篮子货币）的政策区间路径，以实现中期价格稳定。S$NEER 在围绕目标爬行率设定的政策区间内浮动——MAS 明言不实行钉住一篮子货币的爬行钉住，必要时可调整区间宽度与中心水平（MAS《新加坡的货币政策框架》FAQ，见 sources）。对非新元投资者：新元计价资产在兑换回投资者本币时承担新元汇率风险"
    en: "Singapore conducts monetary policy through the exchange rate rather than interest rates: MAS sets a path for the policy band of the Singapore Dollar Nominal Effective Exchange Rate (S$NEER, a trade-weighted basket of currencies) to ensure medium-term price stability. The S$NEER is allowed to float within a policy band set around the targeted crawl rate — MAS does not have a crawling peg to a basket of currencies, and can adjust the width of the band and the level at which it is centred when necessary (MAS, 'Singapore's Monetary Policy Framework' FAQs, see sources). For non-S$ investors: S$-denominated assets carry S$ exchange-rate risk on conversion back to the investor's currency"
    quote: "MAS does not have a crawling peg to a basket of currencies. Instead, the S$NEER is allowed to float within a policy band that is set around the targeted crawl rate. When necessary, MAS can adjust the width of the band, as well as the level at which it is centred."
    sources:
      - title: "Singapore's Monetary Policy Framework — FAQs（MAS 经济政策组官方框架 FAQ PDF；主站处于 Maintenance 壳状态，经 wayback 快照 20251206205550 抓取）"
        url: https://www.mas.gov.sg/-/media/mas-media-library/monetary-policy/singapores-monetary-policy-framework/faqs/mp_faqs.pdf
        accessed: 2026-09-05
    confidence: high
    verified: 2026-09-05

  political_risk_note:
    zh: "新加坡以政治稳定、法治健全、监管透明著称，主权信用评级长期居投资级高位；但作为高度开放的小型经济体，对全球贸易与地缘政治冲击（如主要经济体增长放缓、区域紧张）的敏感度较高。整体政治/制度性风险偏低，外部宏观敏感度偏高。本描述为通用国别风险评估，故标 medium。"
    en: "Singapore is known for political stability, rule of law and regulatory transparency, with a long-standing high investment-grade sovereign rating; however, as a highly open small economy it is sensitive to global trade and geopolitical shocks (e.g. major-economy slowdowns, regional tension). Overall political/institutional risk is low, while external-macro sensitivity is elevated. This is a general country-risk assessment, so confidence is medium."
    sources:
      - title: MAS — About / Monetary & Macroprudential stability
        url: https://www.mas.gov.sg/
        accessed: 2026-08-27
    confidence: medium

  liquidity_risk_note:
    zh: "SGX 整体成交额与上市公司数量远低于香港、东京、纽约等枢纽，现货股票（尤其中小市值与 Catalist）时常出现流动性偏薄、买卖价差较宽的情形；部分证券单日成交稀少，执行大额委托可能面临显著冲击成本或难以即时成交。MAS 的 EQMRG 已将提升市场流动性列为改革重点。本描述为市场结构归纳，故标 medium。"
    en: "SGX's overall turnover and issuer count are well below hubs such as Hong Kong, Tokyo or New York; many listed equities (especially small/mid-cap and Catalist) are thinly traded with wider spreads, and some names see sparse daily volume where large orders may face material impact cost or poor fill. MAS's EQMRG has made liquidity enhancement a reform priority. This is a market-structure summary, so confidence is medium."
    sources:
      - title: MAS — Equity Market Review Group (EQMRG) 报告（流动性相关论述）
        url: https://www.mas.gov.sg/news/speeches/2024/equity-market-review-group-report
        accessed: 2026-08-27
    confidence: medium

  regulatory_change_risk_note:
    zh: "2025年10月29日主板退市观察名单（Watch-List）规则整章被删除；2026年新设Global Listing Board专供Nasdaq双重上市——短期内两项结构性规则变动均发生在本次建档前后，显示上市/退市制度框架处于活跃调整期"
    en: "The Mainboard's delisting Watch-List rules (Part V) were deleted in their entirety on 29 October 2025; a new Global Listing Board for Nasdaq dual listings was introduced in 2026 — both are structural rule changes occurring shortly before this entry was compiled, indicating an actively evolving listing/delisting framework"
