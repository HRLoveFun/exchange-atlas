    en: "SGX has suffered several major outages: the most severe was 14 July 2016, when a software-upgrade defect halted both securities and derivatives trading for a full session (about 7 hours — then its longest shutdown), with phased recovery; separate derivatives and securities-system failures also occurred in November and December 2014. MAS took supervisory action against SGX in 2015 and ordered remediation. Exact dates/actions follow MAS/SGX announcements; third-party media (CNA/Business Times) reported the events, so confidence is medium."
