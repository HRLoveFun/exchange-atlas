  enforcement_note:
    zh: "市场失当与违规由 SGX RegCo（一线监管、可调查并施加纪律处罚）与 MAS（法定监管、可就《证券期货法》项下市场失当行为提起民事/刑事诉讼）双层执法；近年 MAS 多次强调对违规行为「采取坚定行动」（firm actions against wrongdoers），包括市场操纵、内幕交易等。执法强度与确定性为投资者保护的重要维度。本描述为国别执法框架归纳，故标 medium。"
    en: "Market misconduct is enforced on two tiers: SGX RegCo (front-line regulation — may investigate and impose disciplinary sanctions) and MAS (statutory regulator — may bring civil/criminal proceedings under the SFA for market misconduct); in recent years MAS has repeatedly stressed taking 'firm actions against wrongdoers', including for market manipulation and insider trading. Enforcement intensity and predictability are key investor-protection dimensions. This is a jurisdictional enforcement-framework summary, so confidence is medium."
    sources:
      - title: MAS — Taking firm actions against wrongdoers (enforcement statements)
        url: https://www.mas.gov.sg/news/speeches
        accessed: 2026-08-27
    confidence: medium
