      flagship: "yes"
      description: "由FTSE Russell、SPH Media（《海峡时报》母公司）、SGX Group三方联合编制（FTSE ST Index Series的旗舰指数），并非新交所独自编制或第三方独家编制，是与上证综指「交易所自编」、恒生指数「第三方独家编制」都不同的第三种模式；weighting_method 按FTSE通行的自由流通调整市值加权法填列，本次未针对STI逐条核实其编制方案原文，confidence 标 medium"

# ═══════════════════════════════════════════════
# 八｜清算、结算与交割
# ═══════════════════════════════════════════════
# 现货证券（SGX-ST）由CDP清算结算，衍生品（SGX-DT）由SGX-DC清算——两套独立的中央对手方/
# 结算体系，字段按两个业务面分别注明，不强行合并成一个数值。
clearing:
  _meta:
    verified: 2026-08-27
    confidence: high

  settlement_cycle:
    enum: t2
    zh: "T+2（现货证券「Ready market」）；可保证金交易的期货合约为「最后交易日+2」（LTD+2）；因结算失败而产生的强制补进（buying-in）市场为T+1"
    en: "T+2 for the securities Ready market; \"Last Trading Day + 2\" (LTD+2) for Marginable Futures Contracts; T+1 for the buying-in market arising from settlement failures"
    sources:
      - title: SGX-ST Rules 9.1A.1
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-14
    quote: "Ready market (for securities other than wholesale corporate bonds) T+2 Eligible for clearing by CDP Market for Marginable Futures Contracts LTD+2 Eligible for clearing by CDP ... Buying-in market T+1 Eligible for clearing by CDP"
    confidence: high

  ccp_name:
    zh: "现货证券：新加坡中央存托私人有限公司（CDP）；衍生品：新加坡交易所衍生品结算有限公司（SGX-DC）"
    en: "Securities: The Central Depository (Pte) Limited (CDP); Derivatives: Singapore Exchange Derivatives Clearing Limited (SGX-DC)"
    sources:
      - title: SGX-ST Rules — Definitions
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-14
      - title: SGX-DC Clearing Rules — Definitions
        url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
        accessed: 2026-08-14
    quote: "\"CDP\" The Central Depository (Pte) Limited; ... \"Clearing House\" means the Singapore Exchange Derivatives Clearing Limited by whatever name called or its successor and assigns."
    confidence: high

  csd_name:
    zh: "新加坡中央存托私人有限公司（CDP），身兼证券中央对手方与中央存管机构双重角色（与港交所HKSCC模式相同）"
    en: "The Central Depository (Pte) Limited (CDP), serving as both CCP and CSD for securities (the same combined-role model as HKEX's HKSCC)"
    sources:
      - title: SGX-ST Rules — Definitions
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-14
    quote: "\"CDP\" The Central Depository (Pte) Limited"
    confidence: high

  guarantee_model:
    enum: ccp_novation
    zh: "现货证券由新加坡中央存托（CDP）担任中央对手方兼中央存管机构（CCP 与 CSD 合一，同港交所 HKSCC 模式），对买卖双方经更替做净额担保；衍生品由新加坡交易所衍生品结算有限公司（SGX-DC）担任 CCP"
    en: "For cash securities, The Central Depository (CDP) acts as both central counterparty and CSD (combined CCP/CSD, the same model as HKEX's HKSCC), interposing by novation to guarantee netting between buyer and seller; derivatives are cleared by Singapore Exchange Derivatives Clearing Limited (SGX-DC) as CCP"
    sources:
      - title: SGX-ST Rules — Definitions
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-14
      - title: SGX-DC Clearing Rules — Definitions
        url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
        accessed: 2026-08-14
    quote: "\"CDP\" The Central Depository (Pte) Limited; ... \"Clearing House\" means the Singapore Exchange Derivatives Clearing Limited by whatever name called or its successor and assigns."
    confidence: medium

  initial_margin_practice:
    zh: "现货证券市场（SGX-ST）不收取交易初始保证金——CDP 为中央对手方但采用非担保（novation）模式，证券卖方须在交收前足额交付，结算失败才会触发补进（buying-in），并非「预先冻结保证金」意义上的初始保证金；衍生品（SGX-DT）的初始保证金由 SGX-DC 收取，另行在 clearing.derivatives.initial_margin_practice 描述。"
    en: "The securities market (SGX-ST) does not levy trading initial margin — CDP acts as CCP on a novation basis but settlement is prepaid (seller must deliver in full before settlement; only settlement failure triggers buying-in), not a 'pre-emptively frozen margin' sense; derivatives (SGX-DT) initial margin is collected by SGX-DC and described under clearing.derivatives.initial_margin_practice."
    detail: "顶层字段仅描述现货市场；SGX-DT 衍生品初始保证金见子块。引语来自 CDP 清算规则对结算前交付的要求。"
    sources:
      - title: CDP Clearing Rules（结算前交付 / buying-in 机制）
        url: https://rulebook.sgx.com/rulebook/cdp-clearing-rules
        accessed: 2026-08-27
    confidence: medium

  maintenance_margin_practice:
    zh: "同 initial_margin_practice：现货证券（SGX-ST）无维持保证金概念；衍生品（SGX-DT）的维持保证金由 SGX-DC 按规则逐日计收，另行在 clearing.derivatives.maintenance_margin_practice 描述。"
    en: "As with initial margin: the securities market (SGX-ST) has no maintenance-margin concept; derivatives (SGX-DT) maintenance margin is collected by SGX-DC per rule and described under clearing.derivatives.maintenance_margin_practice."
    sources:
      - title: CDP Clearing Rules
        url: https://rulebook.sgx.com/rulebook/cdp-clearing-rules
        accessed: 2026-08-27
    confidence: medium

  mark_to_market_frequency:
    zh: "衍生品持仓按日盯市：以当日结算价（Daily Settlement Price）计算浮动盈亏，会员须与SGX-DC逐日清算"
    en: "Derivatives positions are marked to market daily against the Daily Settlement Price, with Clearing Members settling gains/losses with SGX-DC each day"
    sources:
      - title: SGX-DC Clearing Rules 7.12.1
        url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
        accessed: 2026-08-14
    quote: "When a Clearing Member is long or short any amount of any Contract at the end of day ... settlement shall be made with the Clearing House to the settlement price for that day, and such Clearing Member shall be liable to pay to, or entitled to collect from, the Clearing House any loss or profit."
    confidence: high

  delivery_method:
    enum: na
    zh: "现货证券市场（SGX-ST）不适用实物/现金交割二选一（证券记账过户，由CDP清算）；衍生品部分（SGX-DT）另见 clearing.derivatives.delivery_method"
    en: "Not applicable to the securities market (SGX-ST) — settlement is book-entry securities transfer cleared by CDP, not a physical/cash delivery choice; for derivatives (SGX-DT) see clearing.derivatives.delivery_method"
    detail: "ADR-023 新增 clearing.derivatives 子块后，顶层字段收窄为仅描述现货市场，原先被迫合并两个业务面的近似值 either 已拆分。与 settlement_cycle 字段引用同一份来源。"
    sources:
      - title: SGX-ST Rules 9.1A.1
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-14
    quote: "Ready market (for securities other than wholesale corporate bonds) T+2 Eligible for clearing by CDP"
    confidence: medium

  last_trading_day_rule:
    zh: "现货证券（SGX-ST）不适用「最后交易日」概念；衍生品（SGX-DT）的 Last Trading Day（最后交易日，即合约停止交易的日期）由合约规范定义，另行在 clearing.derivatives.last_trading_day_rule 描述。"
    en: "Not applicable to securities (SGX-ST); for derivatives (SGX-DT) the Last Trading Day (the day on which trading in the contract ceases) is defined by the Contract Specifications and described under clearing.derivatives.last_trading_day_rule."
    sources:
      - title: SGX-DC Clearing Rules（Definitions — Last Trading Day）
        url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
        accessed: 2026-08-27
    quote: "“Last Trading Day” means the last day on which the Contract is traded."
    confidence: medium

  default_management:
    spec:
      model: ccp_default_waterfall
      layers:
        - {order: 1, resource: "违约会员的违约基金（Default Fund）出资", bearer: defaulter}
        - {order: 2, resource: "违约会员的结算保证金与变动保证金盈余", bearer: defaulter}
        - {order: 3, resource: "SGX-DC 资本（Capital）", bearer: ccp}
        - {order: 4, resource: "全体结算会员的共同保证金（mutualised margin）", bearer: surviving_members}
        - {order: 5, resource: "全体会员的共同违约基金（mutualised Default Fund）", bearer: surviving_members}
        - {order: 6, resource: "SGX-DC 其他资源（Other Resources，含外部授信 / 流动性安排）", bearer: external}
      note: "顺序为 SGX-DC Clearing Rules 7A.01A.2B.2 明列（衍生品 CCP）；现货 CDP 违约处置另依 CDP 清算规则，优先级逻辑同源（见 detail）"
    zh: "SGX-DC 违约处置遵循明确的优先级瀑布（waterfall）：(a) 先动用违约会员自身的「违约基金」（Default Fund）出资；(b) 再动用违约会员缴纳的结算保证金（Clearing Margin）与变动保证金盈余；(c) 动用 SGX-DC 的「资本」（Capital）；(d) 动用全体结算会员的「共同保证金」（mutualised margin）；(e) 动用全体会员的「共同违约基金」（mutualised Default Fund）；(f) 最后才动用 SGX-DC 的「其他资源」（Other Resources，含外部授信/流动性安排）。即先「自担、后互担、再外部」。"
    en: "SGX-DC default management follows a clear priority waterfall: (a) the defaulting member's own Default Fund contribution; (b) the defaulting member's Clearing Margin and variation-margin surplus; (c) SGX-DC's Capital; (d) the pooled mutualised margin of all Clearing Members; (e) the mutualised Default Fund of all members; (f) finally SGX-DC's Other Resources (including external credit/liquidity lines). I.e. 'member's own first, then mutualised, then external'."
    detail: "本字段描述衍生品 CCP（SGX-DC）的违约处置顺序；现货证券由 CDP 清算，其违约处置机制另行依 CDP 清算规则，但优先级逻辑同源。引语来自 SGX-DC Clearing Rules 7A.01A.2B.2。"
    sources:
      - title: SGX-DC Clearing Rules 7A.01A.2B.2（Default waterfall）
        url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
        accessed: 2026-08-27
    quote: "the Clearing House shall apply the following in the following order: (a) the defaulting Clearing Member's contribution to the Default Fund; (b) the defaulting Clearing Member's Clearing Margin and surplus variation margin; (c) the Clearing House's Capital; (d) the mutualised margin; (e) the mutualised Default Fund; and (f) the Other Resources"
    confidence: high

  derivatives:
    delivery_method:
      enum: either
      zh: "视合约而定，部分合约实物交割、部分现金结算"
      en: "Varies by contract — some are physically delivered, others cash-settled"
      sources:
        - title: SGX-DC Clearing Rules（实物交割/Alternative Delivery Procedure相关条款）
          url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
          accessed: 2026-08-14
      quote: "the minimum size prescribed under the relevant Contract Specifications for physical delivery"
      confidence: medium
    initial_margin_practice:
      zh: "SGX-DC（衍生品中央对手方）就每张未平仓合约向结算会员收取初始保证金（Initial Margin），以覆盖潜在价格波动风险；按规则，初始保证金是「结算会员须向 SGX-DC 缴付的、用于担保其未平仓合约义务的保证金」。具体比例/组合按合约与会员风险参数逐日核定。"
      en: "SGX-DC (the derivatives CCP) collects initial margin from each Clearing Member on open contracts to cover potential price-movement risk; per rule, initial margin is 'the margin that a Clearing Member is required to pay to the Clearing House to secure its obligations in respect of open contracts'. The rate/portfolio is set per-contract and per-member risk parameters and reviewed daily."
      sources:
        - title: SGX-DC Clearing Rules 10116（Initial Margin 定义）
          url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
          accessed: 2026-08-27
      quote: "\"Initial Margin\" means such margin as a Clearing Member is required to pay to the Clearing House to secure such Clearing Member's obligations in respect of open contracts."
      confidence: high
    maintenance_margin_practice:
      zh: "SGX-DC 另就结算会员的未平仓合约收取维持保证金（Maintenance Margin，亦作结算保证金 Clearing Margin），按规则定义为「结算会员须向 SGX-DC 缴付的、用于担保其未平仓合约义务的保证金」（与初始保证金同一定义框架）；若保证金账户余额低于维持水平，会员须补足。变动保证金（variation margin）则按日盯市逐日结算。"
      en: "SGX-DC also collects maintenance (clearing) margin on open contracts, defined per rule as 'the margin that a Clearing Member is required to pay to the Clearing House to secure its obligations in respect of open contracts' (same definitional framework as initial margin); a member must top up if its margin account falls below the required level. Variation margin is settled daily via mark-to-market."
      sources:
        - title: SGX-DC Clearing Rules 10134（Maintenance/Clearing Margin 定义）
          url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
          accessed: 2026-08-27
      quote: "\"Clearing Margin\" means such margin as a Clearing Member is required to pay to the Clearing House to secure such Clearing Member's obligations in respect of open contracts."
      confidence: high
    mark_to_market_frequency:
      zh: "衍生品持仓按日盯市（同顶层 clearing.mark_to_market_frequency）：以当日结算价计算浮动盈亏，会员须与 SGX-DC 逐日清算。"
      en: "Derivatives positions are marked to market daily (same as top-level clearing.mark_to_market_frequency): floating P&L is computed against the daily settlement price and settled with SGX-DC each day."
      sources:
        - title: SGX-DC Clearing Rules 7.12.1
          url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
          accessed: 2026-08-27
      quote: "When a Clearing Member is long or short any amount of any Contract at the end of the day ... settlement shall be made with the Clearing House to the settlement price for that day"
      confidence: high
    last_trading_day_rule:
      zh: "衍生品合约的 Last Trading Day（最后交易日）定义为「该合约停止交易的最后一天」，由合约规范（Contract Specifications）具体载明；不同合约的最后交易日各不相同。"
      en: "A derivatives contract's Last Trading Day is defined as 'the last day on which the Contract is traded', as specified in the relevant Contract Specifications; the exact Last Trading Day differs by contract."
      sources:
        - title: SGX-DC Clearing Rules 10134（Last Trading Day 定义）
          url: https://rulebook.sgx.com/rulebook/sgx-dc-clearing-rules
          accessed: 2026-08-27
      quote: "\"Last Trading Day\" means the last day on which the Contract is traded."
      confidence: high

# ═══════════════════════════════════════════════
# 九｜市场参与者
# ═══════════════════════════════════════════════
participants:
  _meta:
    verified: 2026-08-27
    confidence: medium

  investor_structure:
    zh: "新加坡股市投资者结构以机构主导为基调：本地与海外机构（包括主权基金、养老金、资产管理公司）占据主要成交与持股市值份额，零售投资者参与比例相对低于美国等零售主导市场；MAS 的股权市场检讨（EQMRG）亦将「提升零售参与」列为改革方向之一。具体机构/零售占比数字本次未逐条核实官方统计，故标 medium。"
    en: "Singapore's equity market is institutionally dominated: local and foreign institutions (sovereign funds, pension/asset managers) account for the bulk of turnover and market capitalisation, while retail participation is relatively lower than in retail-led markets such as the US; MAS's equity-market review (EQMRG) even lists 'broadening retail participation' as a reform direction. The exact institutional/retail split was not verified line-by-line from official statistics, so confidence is medium."
    sources:
      - title: MAS — Equity Market Review Group (EQMRG) 报告（投资者结构、零售参与相关论述）
        url: https://www.mas.gov.sg/news/speeches/2024/equity-market-review-group-report
        accessed: 2026-08-27
    confidence: medium

  account_opening_requirements:
    zh: "投资者买卖 SGX 证券须同时开立两个账户：(1) 中央存托（CDP）账户——用于证券的中央存管与交收，由 CDP 管理；(2) 经纪商交易账户——向持牌交易会员（Trading Member）或银行开户，用于下单。境外投资者通常经由本地券商或国际网络券商（如持新加坡资本市场服务牌照者）代办上述开户。"
    en: "To trade SGX securities an investor must open two accounts: (1) a Central Depository (CDP) account for central custody and settlement, administered by CDP; and (2) a broker trading account with a licensed Trading Member or bank for order entry. Overseas investors typically open both through a local broker or an international retail broker holding a Singapore CMS licence."
    sources:
      - title: SGX — Open a CDP Account / How to Invest
        url: https://www.sgx.com/investors/about-investing/open-a-cdp-account
        accessed: 2026-08-27
    confidence: medium

  suitability_management:
    zh: "新加坡以《证券期货法》(SFA) 与《财务顾问法》(FAA) 构建投资者适当性框架：持牌中介机构在向零售客户销售投资产品、提供建议时须履行适当性义务（了解客户、产品风险评级、匹配适合度），并对订单进行「零售/机构/专业投资者」 marking 以便监管；SGX RegCo 负责市场层面的持续监管。"
    en: "Singapore's suitability framework rests on the SFA and the Financial Advisers Act (FAA): licensed intermediaries must meet suitability obligations when distributing investment products or advising retail clients (know-your-customer, product risk rating, appropriateness matching), and orders are marked as retail/institutional/accredited-investor for supervisory purposes; SGX RegCo handles ongoing market-level supervision."
    sources:
      - title: Securities and Futures Act 2001（适当性/中介义务框架）
        url: https://sso.agc.gov.sg/act/sfa2001
        accessed: 2026-08-27
    confidence: medium

  foreign_access_channel:
    zh: "境外投资者可通过两条主要渠道参与：直接渠道——通过持新加坡资本市场服务牌照的本地券商/银行或国际网络券商开户交易 SGX 证券；互联互通——SGX 参与东盟交易链接（ASEAN Trading Link），并与印度 NSE 共建跨境连接供境外投资者交易指数衍生品。规则手册以「链接市场」(Linked Market) 概念明确订单路由与监管合作框架。"
    en: "Foreign investors can access SGX mainly via two channels: direct — open an account with a Singapore CMS-licensed local broker/bank or an international retail broker to trade SGX securities; connectivity — SGX participates in the ASEAN Trading Link and, with India's NSE, a cross-border connectivity for offshore trading of index derivatives. The rulebook sets out the order-routing and supervisory-cooperation framework for Linked Markets."
    sources:
      - title: SGX-ST Rules 10A（Linked Market 东盟交易链接框架）
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-27
    quote: "“Linked Market” means any securities exchange that is linked to the Exchange for the purpose of enabling orders in the securities of that exchange to be routed to and traded on the Exchange."
    confidence: high

  membership_structure:
    zh: "现货证券市场为「交易会员」（Trading Member，经SGX-ST批准的实体，其雇员/授权代表为Trading Representative）；衍生品市场另设「结算会员」（Clearing Member）体系，与SGX-DC直接结算"
    en: "Securities market: \"Trading Member\" (an entity approved by SGX-ST, whose employees/authorised agents act as Trading Representatives); derivatives market has a separate \"Clearing Member\" tier settling directly with SGX-DC"
    sources:
      - title: SGX-ST Rules — Definitions
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-14
    quote: "\"Trading Member\" An entity that has been approved as Trading Member in accordance with SGX-ST Rules; \"Trading Representative\" A person who is employed by or acts for or by arrangement with a Trading Member to deal in securities or trade in futures contracts."
    confidence: high

  broker_landscape:
    zh: "SGX 拥有众多交易会员（Trading Members），涵盖本地银行系券商（如 DBS Vickers、OCBC Securities、UOB Kay Hian）、综合券商（Phillip Securities、CGS International）以及国际/网络券商（Interactive Brokers、Tiger、Moomoo 等持新加坡资本市场服务牌照者）。竞争格局多元，既有传统全牌照券商，也有低费率网络券商；具体各券商市场份额数字本次未逐条核实，故标 medium。"
    en: "SGX has a large number of Trading Members spanning local bank-owned brokers (e.g. DBS Vickers, OCBC Securities, UOB Kay Hian), full-service brokers (Phillip Securities, CGS International) and international/online brokers (Interactive Brokers, Tiger, Moomoo etc., holding Singapore CMS licences). The competitive landscape is diverse — both traditional full-service and low-cost online brokers; exact market-share figures were not verified line-by-line, so confidence is medium."
    sources:
      - title: SGX — Members / Trading Members list
        url: https://www.sgx.com/participants/members
