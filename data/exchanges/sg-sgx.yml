      zh: "因合约而异，逐合约在 Contract Specifications 中规定；以《Regulatory Notice 4.1.11》附录公布的「一般市场最小报价单位」（Market Tick Size，区别于协商大宗交易适用的更细「NLT Tick Size」）为例：MSCI新加坡指数期货与期权为0.05指数点（合S$5）；日经225指数期货为5指数点（合¥2,500）；澳元/美元期货为US$0.0001（合US$2.50）；10年期日本国债期货为每¥100面值¥0.01（合¥10,000）——该表随监管通告定期更新（本次抓取版本注明适用期为2026年7月20日至8月23日），仅作举例，不代表长期不变或穷尽全部合约"
      en: "Varies by contract, set in each Contract's Contract Specifications; illustrative examples from the standard \"Market Tick Size\" table published as an appendix to Regulatory Notice 4.1.11 (distinct from the finer \"NLT Tick Size\" used for negotiated large trades): MSCI Singapore Index Futures and Options 0.05 index points (S$5); Nikkei 225 Index Futures 5 index points (¥2,500); AUD/USD Futures US$0.0001 (US$2.50); 10-Year Japanese Government Bond Futures ¥0.01 per ¥100 face value (¥10,000) — this table is periodically revised via regulatory notice (the fetched version states it is effective 20 Jul 2026 to 23 Aug 2026); illustrative only, not a stable long-term figure nor an exhaustive list"
      sources:
        - title: Appendix B To Regulatory Notice 4.1.11 — Minimum Tick Schedule for Negotiated Large Trades
          url: https://rulebook.sgx.com/rulebook/futures-trading-rules
          accessed: 2026-08-18
      quote: "MINIMUM TICK SCHEDULE FOR NEGOTIATED LARGE TRADES Contract Market Tick Size NLT Tick Size ... MSCI Singapore Index Futures and Options 0.05 index points (S$5) 0.01 index points (S$1) ... Nikkei 225 Index Futures 5 index points (¥2,500) 0.01 index points (¥5) ... SGX AUD/USD Futures US$0.0001 (US$2.50) US$0.0001 (US$2.50) ... SGX 10-Year Japanese Government Bond Futures ¥0.01 per ¥100 face value (¥10,000) ¥0.01 per ¥100 face value (¥10,000)"
