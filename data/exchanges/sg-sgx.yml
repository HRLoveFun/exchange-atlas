    after_market:
      spec: {start: "17:06", end: "17:16", kind: after_hours_continuous, note: "Trade at Close：仅可按收盘均衡价成交；17:00-17:06 为收盘例行程序；无独立盘后连续竞价"}
      zh: "收盘例行程序（17:00-17:06，Pre-Close+Non-Cancel两阶段单一价格集合竞价计算收盘价）后接十分钟「Trade at Close」阶段（17:06-17:16，仅可按收盘均衡价成交），无独立盘后连续竞价时段"
      en: "Closing Routine (17:00-17:06, Pre-Close + Non-Cancel phases computing the closing price) followed by a ten-minute Trade at Close Phase (17:06-17:16, orders only at the Equilibrium Price); no separate after-hours continuous trading session"
      quote: "The Trade at Close Phase is a ten-minute session that begins after the Closing Routine ends at 17:06 hours (for normal day trading) ... Orders may be entered in this phase only at the Equilibrium Price determined at the end of the Closing Routine."
