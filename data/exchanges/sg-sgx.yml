    detail: "MAS 依《证券期货法》（SFA 2001）核准 SGX-ST、SGX-DT 为「核准交易所」（Approved Exchange），并核准 CDP/SGX-DC 为「核准清算所」（Approved Clearing House）。"
    sources:
