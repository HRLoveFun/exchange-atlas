  price_limits:
    type:
      enum: dynamic_reference
      zh: "动态参考价区间（Circuit Breaker）：非固定每日涨跌停，以滚动参考价±10%为价格带，官方原文明确区别于固定每日涨跌停模式"
      en: "Dynamic reference-price band (Circuit Breaker): not a fixed daily limit — a ±10% band around a rolling reference price; the rule text explicitly distinguishes this from a fixed daily price-limit model"
      sources:
        - title: Regulatory Notice 8.14.1 — Circuit Breaker
          url: https://rulebook.sgx.com/rulebook/regulatory-notice-8141-circuit-breaker
          accessed: 2026-08-14
      quote: "It is not intended to halt price movement. A fundamental role of a capital market is timely and accurate price discovery; as such, the market should be allowed to determine its own prices so long as it remains fair and orderly. ... The upper threshold is 10% above the reference price and the lower threshold is 10% below the reference price."
      confidence: high
    main_board:
      spec: {type: dynamic, band_pct: 10, reference_window_min: 5, note: "非固定每日涨跌停：价格带为滚动参考价 ±10%；参考价取当节开盘价，此后每 5 分钟更新为 5 分钟前成交价；覆盖 STI/MSCI Singapore 成分股及参考价 ≥S$0.50 的股票/REIT/ETF 等，新股首日豁免"}
      zh: "上限为参考价+10%，下限为参考价-10%；参考价在交易阶段开始时取当节开盘价（缺失则取前值），此后每5分钟滚动更新为5分钟前成交价；覆盖 STI/MSCI Singapore 成份股及参考价不低于 S$0.50 的股票/REIT/ETF 等（新股首日豁免）"
      en: "Upper threshold = reference price + 10%; lower threshold = reference price − 10%; the reference price starts as the session's opening price (falling back to prior values), then rolls every 5 minutes to the trade price from 5 minutes earlier"
      quote: "The upper threshold is 10% above the reference price and the lower threshold is 10% below the reference price."
      confidence: high
    other_boards:
      zh: "覆盖范围限于：海峡时报指数/MSCI Singapore Free Index成分股，以及在SGX-ST上市且当日参考价≥S$0.50（或等值外币，日元计价以¥500为界）的股票/REITs/商业信托/ETF/ETN等；新股上市首日豁免适用"
      en: "Coverage limited to: constituents of the Straits Times Index or MSCI Singapore Free Index, and stocks/REITs/business trusts/ETFs/ETNs listed on SGX-ST with a start-of-day reference price of S$0.50 or more (¥500 for yen-denominated instruments); new listings are exempt on their first trading day"
      quote: "have a reference price at the start of the Market Day of 0.50 or more in the underlying currency that Market Day. In the case of Yen-denominated instruments, Circuit Breakers are applied if the reference price at the start of the Market Day is ¥500 (denoted as \"0.50\" in the Trading System) or more that Market Day ... SGX-ST will exempt new listings from the circuit breaker on the first day of trading."
      confidence: high
      sources:
        - title: Regulatory Notice 8.14.1 — Circuit Breaker
          url: https://rulebook.sgx.com/rulebook/regulatory-notice-8141-circuit-breaker
          accessed: 2026-08-30

  circuit_breaker:
    enum: stock_level
    spec: {type: stock_level, note: "个股/期货合约级熔断冷静期（Circuit Breaker / Cooling-Off Period），非全市场级；见 volatility_interruption / price_limits"}
    zh: "个股/期货合约级别的熔断冷静期机制（Circuit Breaker / Cooling-Off Period），非全市场级"
    en: "Circuit Breaker / Cooling-Off Period — applies at the individual security/futures contract level, not market-wide"
    detail: "详细机制见 volatility_interruption 字段与 price_limits。"
    sources:
      - title: Regulatory Notice 8.14.1 — Circuit Breaker
        url: https://rulebook.sgx.com/rulebook/regulatory-notice-8141-circuit-breaker
        accessed: 2026-08-14
    quote: "SGX-ST may prescribe, for certain securities and futures contracts, Circuit Breakers which are designed to temporarily restrict trading in these securities and futures contracts."
    confidence: high

  volatility_interruption:
    spec: {note: "冷静期（Cooling-Off Period）5 分钟：撮合价超出滚动参考价 ±10% 价格带（见 price_limits）的委托被拒，冷静期内仍可在带内交易（非停牌）；结束后价格带按新参考价调整；与午休/收盘前/停牌重叠则提前结束"}
    zh: "冷静期（Cooling-Off Period）持续5分钟：撮合价超出价格带的委托将被拒绝，冷静期内交易仍可在价格带内继续进行（非停牌）；冷静期结束后价格带随新参考价调整；冷静期若与午休/收盘前阶段/停牌/暂停交易重叠则提前结束"
    en: "The Cooling-Off Period lasts 5 minutes: an incoming order that would match outside the band is rejected while trading continues within the band (not a halt); after the period ends the band is recalculated from the new reference price; the period ends early if it coincides with the Mid-Day Break, Pre-Close Phase, a suspension or a trading halt"
    sources:
      - title: Regulatory Notice 8.14.1 — Circuit Breaker
        url: https://rulebook.sgx.com/rulebook/regulatory-notice-8141-circuit-breaker
        accessed: 2026-08-14
    quote: "The duration of the Cooling-Off Period is five minutes. The Cooling-Off Period will cease upon the commencement of any of the following, even if five minutes have not elapsed: (a) Pre-close Phase; (b) Mid-Day Break; (c) Suspension; and (d) Trading Halt."
    confidence: high

  trading_halt_mechanism:
    zh: "暂停交易后恢复时进入15分钟（可延长）的Adjust阶段，可报单改单撤单但不撮合，结束时按均衡价算法一次性撮合后恢复正常交易；一般性停牌权力条款本次未逐条核实"
    en: "Upon lifting a suspension, trading resumes via a 15-minute (extendable) Adjust Phase allowing order entry/amendment/withdrawal without matching, followed by a single Equilibrium-Price match before normal trading resumes; the general suspension-power provisions were not individually verified this session"
    sources:
      - title: Regulatory Notice 8.2.1（2.4 Adjust）
        url: https://rulebook.sgx.com/rulebook/regulatory-notice-821-trading-hours-market-phases-application-market-phases-and-principles
        accessed: 2026-08-14
    quote: "An Adjust Phase operates upon the lifting of a suspension of a security or futures contract pursuant to Rule 8.13.7 ... The Adjust Phase sets in for 15 minutes unless a longer time is specified."
    confidence: medium

  error_trade_rule:
    spec:
      bust_allowed: true
      review_window_min: null
      deviation_threshold_pct: null
      resolution: cancel
      note: "SGX-ST Rules 11.4：SGX-ST 为维护公平有序市场保留复核『错误交易（Error Trade）』的权力，可主动决定作废或维持。无固定价格偏离百分比门槛——裁量时综合考虑成交价与前一成交价之差、市场流动性、若作废 / 不作废的金钱损失、错误订单录入与撮合的时间差、涉及对手方客户数、是否触发 Force Key 等防错提示、对结算的影响等因素。SGX-ST 决定不接受复议"
    zh: "SGX-ST 错误交易规则：为维护公平有序市场，SGX-ST 保留复核『错误交易（Error Trade）』的权力，可决定将其作废或维持有效。没有固定的价格偏离百分比门槛——SGX-ST 裁量时综合考虑成交价与前一成交价之差、当时市场流动性、作废 / 不作废涉及的金钱损失、错误订单录入与撮合之间的时间差、涉及的对手方客户数、录入时是否使用 Force Key 或触发其他防错提示、对结算流程的影响等相关信息。作出决定后 SGX-ST 不再受理任何复议请求"
    en: "Under the SGX-ST Rules, SGX-ST reserves the right to review an Error Trade where necessary for the proper maintenance of a fair and orderly market, and may decide to cancel it or leave it valid. There is no fixed price-deviation threshold — in deciding, SGX-ST may consider the difference between the trade price and the preceding traded price, market liquidity at the time, the monetary loss if the trade is or is not cancelled, the time between entry of the erroneous order and its matching, the number of counterparty customers involved, whether the Force Key or another error-prevention alert was triggered, the impact on settlement, and the reasons given for the error. SGX-ST will not consider any request to review its decision"
    detail: "SGX-ST Rules 11.4.1–11.4.4。与 trading_halt_mechanism（停牌 / Adjust Phase）视角不同。SGX 的错误交易复核是纯裁量式（无 % 阈值），介于欧美的阈值制度与日港的『成交终局』之间。resolution 记 cancel（可作废或维持，无调价）。"
    sources:
      - title: SGX-ST Rules 11.4 — Error Trade Cancellations（SGX Rulebook）
        url: https://rulebook.sgx.com/rulebook/114-error-trade-cancellations
        accessed: 2026-08-30
    quote: "SGX-ST reserves the right to review an Error Trade if SGX-ST deems it necessary for the proper maintenance of a fair and orderly market. ... SGX-ST may consider any relevant information, including but not limited to the following when deciding whether to cancel an Error Trade: (a) the difference between the price at which the trade was done and the preceding traded price of the security or futures contract; ... (d) the monetary loss involved if the trade is or is not cancelled; (e) the difference between the time the erroneous order was entered and the time it was matched; (f) the number of counterparty customers involved ... SGX-ST will not consider any request to review its decision"
    confidence: high

  order_book_transparency:
    zh: "盘前：中央订单簿公开，各价位限价申报的价量向市场披露，连续竞价按价格优先、时间优先撮合。SGX 证券市场不提供冰山 / 隐藏订单类型（订单全数量展示）。盘后 / 大额：大宗交易（married / block trades）单独申报，SGX 无独立暗池。盘后成交披露适用 SGX-ST 规则"
    en: "Pre-trade: the central order book is public — limit-order sizes and prices at each level are disseminated and matched on price-then-time priority. The SGX securities market offers no iceberg or hidden order types (full order quantities are displayed). Post-trade / large orders: married and block trades are reported separately and SGX has no separate dark pool; post-trade publication follows the SGX-ST Rules"
    detail: "字段管本所订单簿内部的（非）展示流动性——SGX 证券订单簿全展示、无非展示订单类型。行情层级 / 收费见第十章 market_data_levels。quote 复用 matching_principle 已核实措辞；盘后披露延迟参数未逐字核实，故整体 confidence: medium。"
    sources:
