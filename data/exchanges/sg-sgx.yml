        accessed: 2026-08-14
    quote: "\"SGX RegCo\" means Singapore Exchange Regulation Pte. Ltd."
    confidence: high

  clearing_regulator:
    zh: "新加坡金融管理局（MAS），依《证券期货法》核准清算所（Approved Clearing House）制度监管"
    en: "Monetary Authority of Singapore (MAS), under the Approved Clearing House regime of the Securities and Futures Act"
    sources:
      - title: Securities and Futures Act 2001（Part 2 Organised Markets, Division 2 — Regulation of Approved Clearing Houses）
        url: https://sso.agc.gov.sg/act/sfa2001
        accessed: 2026-08-14
    detail_note: "原引文「Division 2 — Regulation of Approved Clearing Houses」本次无法逐字核实：缓存的 sso.agc.gov.sg/act/sfa2001 实为 CloudFront 403 错误页（见 .cache/sg-sgx/sso-agc-gov-sg-act-sfa2001-607b3817a2.html），不含正文，故由 high 降为 medium，留待人工提供原文后再升级。"
    confidence: medium

  core_laws:
    zh: "《证券期货法》（Securities and Futures Act 2001）"
    en: "Securities and Futures Act 2001 (SFA)"
    detail: "Part 2「有组织市场」（Organised Markets）章节规范核准交易所（Approved Exchange）与核准清算所（Approved Clearing House）；上市/持续披露另受各板块规则手册（Mainboard/Catalist/Global Listing Board Rules）约束，后者是 SGX-ST 依 SFA 授权自行制定的业务规则。"
    sources:
      - title: Securities and Futures Act 2001（Table of Contents, Part 2 Organised Markets）
        url: https://sso.agc.gov.sg/act/sfa2001
        accessed: 2026-08-14
    detail_note: "原引文「Securities and Futures Act 2001 ... Part 2 ORGANISED MARKETS」本次无法逐字核实：缓存的 sso.agc.gov.sg/act/sfa2001 实为 CloudFront 403 错误页（见 .cache/sg-sgx/sso-agc-gov-sg-act-sfa2001-607b3817a2.html），不含正文，故由 high 降为 medium，留待人工提供原文后再升级。"
    confidence: medium

  foreign_ownership_limit:
    zh: "对 SGX 上市证券本身原则上无外资持股比例上限——外资可自由买卖与持有在新交所上市的股票、REITs、债券等；但新加坡若干行业受法定外资限制（如本地银行单一股东表决权上限 5%，见《银行法》Banking Act；媒体/报业、特定房地产与土地持有、航空等另有专项限制）。这些限制针对发行人所属行业，而非交易所层面。"
    en: "There is in principle no foreign-ownership cap on SGX-listed securities themselves — foreign investors may freely buy and hold SGX-listed stocks, REITs, bonds, etc.; however, certain Singapore sectors are subject to statutory foreign-ownership limits (e.g. a single shareholder's voting power in a local bank is capped at 5% under the Banking Act, with separate restrictions for media/press, certain real estate and land holdings, and aviation). These limits attach to the issuer's sector, not to the exchange level."
    detail: "交易所层面（对「谁可以买卖 SGX 上市证券」）无限制；行业性外资上限（银行 5% 等）依新加坡成文法，属发行人准入层面的限制，非本交易所制度。"
    sources:
      - title: Securities and Futures Act 2001（外资持牌/市场框架，新加坡政府法规平台）
        url: https://sso.agc.gov.sg/act/sfa2001
        accessed: 2026-08-27
    confidence: medium

  capital_controls:
    zh: "新加坡资本账户高度开放，几乎无资本管制：新元（SGD）完全可兑换，利润、资本与特许权使用费可自由以任何货币汇出，无外汇交易税；MAS 以管理浮动汇率制度（让新元在参考一篮子贸易伙伴货币的未披露政策区间内浮动）作为货币政策工具，而非诉诸资本管制。"
    en: "Singapore maintains a highly open capital account with virtually no capital controls: the Singapore dollar (SGD) is fully convertible, profits, capital and royalties may be repatriated freely in any currency, and there is no exchange-transaction tax; the MAS conducts monetary policy through a managed-float exchange-rate regime (letting the SGD fluctuate within an undisclosed policy band against a basket of trading partners' currencies) rather than capital controls."
    detail: "资本管制/外汇管制维度：新加坡以汇率政策而非资本管制管理宏观稳定，故对证券跨境买卖与资金汇出基本无限制；第三方资料（BIS、专业国别手册）亦确认「open capital markets」「SGD fully convertible」。"
    sources:
      - title: MAS — Monetary Policy (exchange-rate-centred framework)
        url: https://www.mas.gov.sg/monetary-policy
        accessed: 2026-08-27
    confidence: medium

  disclosure_requirements:
    zh: "新加坡实行「披露为本」（disclosure-based）监管：发行人获准列入官方名单后须持续履行披露义务——任何可能影响证券价格或导致虚假市场的资料须即时通过 SGXNET 公告；上市时须依《证券期货法》注册招股说明书。披露渠道为 SGXNET，频率为「即时/持续」。"
    en: "Singapore operates a disclosure-based regime: once admitted to the Official List, an issuer must continuously meet disclosure obligations — any information likely to materially affect security prices or create a false market must be announced immediately via SGXNET; a prospectus registered under the SFA is required at listing. The disclosure channel is SGXNET, on an immediate/continuous basis."
    detail: "披露频率与渠道：上市后对「重大信息」须即时公告（Rule 703(1)）；信息披露综合平台为 SGXNET；上市前披露依 SFA 招股说明书制度。"
    sources:
      - title: SGX-ST Rules Chapter 7 — Continuing Obligations (Rule 703)
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-27
    quote: "An issuer must announce any information known to the issuer concerning it or any of its subsidiaries or associated companies which: (a) is necessary to avoid the establishment of a false market in the issuer's securities; or (b) would be likely to materially affect the price or value of its securities."
    confidence: high

  investor_protection:
    zh: "投资者保护由三层构成：(1) 披露为本的前端监管与 SGX RegCo 一线监管；(2) 《证券期货法》(SFA) 下的法定「投资者赔偿计划」(Investor Compensation Scheme)，在中介违约时由违约中介的 fidelity fund 补偿投资者；(3) 对市场失当行为的民事追偿（MAS 于 2025 年提出增强投资者追偿能力的改革，包括指定代表人、资助金制度等）。"
    en: "Investor protection rests on three layers: (1) the disclosure-based front-line regime and SGX RegCo's front-line regulation; (2) the statutory Investor Compensation Scheme under the SFA, which compensates investors from a defaulting intermediary's fidelity fund; (3) civil recourse against market misconduct (in 2025 MAS proposed reforms to strengthen investors' ability to seek civil compensation, including a designated representative and a co-funding grant scheme)."
    detail: "SFA 下设投资者赔偿计划（依各受监管实体的 fidelity fund 运作）；2025 年 MAS 在股权市场检讨小组框架下提出强化投资者追偿的改革。"
    sources:
      - title: Securities and Futures Act 2001（Investor Compensation Scheme 框架）
        url: https://sso.agc.gov.sg/act/sfa2001
        accessed: 2026-08-27
      - title: MAS Consults On Measures To Enhance Investors' Ability To Seek Civil Compensation (2025-10-24)
        url: https://www.mas.gov.sg/news/media-releases/2025/mas-consults-on-measures-to-enhance-investors-ability-to-seek-civil-compensation
        accessed: 2026-08-27
    quote: "An effective investor recourse regime gives investors greater confidence to participate in the securities market."
    confidence: medium

