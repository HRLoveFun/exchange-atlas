  opening_mechanism:
    spec: {type: call_auction, auction_start: "08:30", auction_end: "09:00", note: "开盘例行程序：Pre-Open + Non-Cancel，按最大成交量/最小失衡量确定均衡价"}
    zh: "开盘例行程序：Pre-Open阶段可自由报单/改单/撤单不撮合，Non-Cancel阶段不可再报单改单，按SGX-ST算法计算出成交量最大、失衡量最小的均衡价（Equilibrium Price）作为开盘价"
    en: "Opening Routine: order entry/amendment/withdrawal freely allowed without matching during Pre-Open; no new entry/amendment during Non-Cancel, where an Equilibrium Price (largest tradable volume, lowest imbalance) is computed as the opening price"
    sources:
      - title: Regulatory Notice 8.2.1
        url: https://rulebook.sgx.com/rulebook/regulatory-notice-821-trading-hours-market-phases-application-market-phases-and-principles
        accessed: 2026-08-14
    quote: "The Equilibrium Price is the price that has the largest tradable volume and the lowest imbalance."
    confidence: high

  closing_mechanism:
    spec: {type: call_auction, auction_start: "17:00", auction_end: "17:06", trade_at_close_end: "17:16", note: "收盘例行程序算收盘均衡价；Trade at Close 17:06-17:16 仅按该均衡价撮合"}
    zh: "收盘例行程序（Pre-Close+Non-Cancel，机制与开盘例行程序对称）计算收盘均衡价，随后Trade at Close阶段仅允许按该均衡价继续撮合十分钟"
    en: "Closing Routine (Pre-Close + Non-Cancel, mirroring the Opening Routine) computes the closing Equilibrium Price, followed by a ten-minute Trade at Close Phase where matching continues only at that price"
    quote: "The Closing Routine is designed to reduce the risk of manipulating closing prices with a single transaction at an unusually high or low price, just before the trading session ends."
    confidence: high

  execution_model:
    enum: order_driven
    spec: {electronic: true, dealer_intermediated: false, note: "中央电子限价订单簿、价格优先时间优先连续撮合 + 开收盘均衡价集合竞价；一般股票无做市商。SGX-ST Chapter 6 设指定做市商（Designated Market-Maker）制度，须就获批品种（ETF / 结构性权证 / DLC / 部分股票）持续提供有约束力双边报价，在最大价差与最小数量范围内，属订单驱动之上的补充"}
    zh: "订单驱动：中央电子限价订单簿，连续竞价按价格优先、时间优先撮合，开收盘按均衡价算法；一般股票无做市商。指定做市商（Designated Market-Maker）制度仅覆盖获批品种（ETF / 结构性权证 / DLC 等），须持续提供符合最大价差与最小数量要求的双边报价"
    en: "Order-driven: a central electronic limit order book matching on price-then-time priority in continuous trading and via an Equilibrium Price algorithm at the open and close; ordinary stocks have no market makers. A Designated Market-Maker scheme (SGX-ST Rules Chapter 6) covers only approved instruments (ETFs, structured warrants, DLCs, etc.), whose DMMs must provide continuous binding two-sided quotes within a prescribed maximum spread and minimum quantity"
    detail: "enum 依据既有 matching_principle（价格-时间优先，confidence high）与 market_maker_scheme（DMM 限获批品种，confidence high）综合判定：一般股票为纯订单驱动，DMM 为产品级补充。dealer_intermediated 记 false。"
    sources:
      - title: SGX-ST Rules Chapter 6 — Designated Market-Makers
        url: https://rulebook.sgx.com/rulebook/chapter-6-designated-market-makers
        accessed: 2026-08-14
    quote: "A Designated Market-Maker must provide on the Trading System competitive bid and offer quotations: (i) on a continuous basis or in such other manner as SGX-ST prescribes to provide for an adequately liquid market with suitable disclosure to investors."
    confidence: high

  matching_principle:
    enum: price_time
    zh: "连续竞价阶段按价格优先、时间优先撮合；开收盘及午间例行程序按均衡价算法撮合（见开盘/收盘机制）"
    en: "Continuous Trading Phase matches by price priority then time priority; Opening/Mid-Day/Closing routines match via the Equilibrium Price algorithm (see opening/closing mechanism)"
    quote: "All orders are matched in accordance with price priority, subject to Rule 8.14, followed by time priority."
    confidence: high

  order_types:
    spec:
      market: true
      limit: true
      note: "限价申报为主；交易系统亦支持市价申报（均衡价算法专门处理『市价盘剩余』Market Order Surplus）。止损单、完整有效期类型清单本次未逐条核实——不入 spec。证券市场无冰山 / 隐藏订单类型"
    zh: "限价申报为主；交易系统亦支持市价申报（Market Order），均衡价算法专门处理市价盘造成的「市价盘剩余」情形；完整订单类型清单（如止损单、有效期类型）本次未逐条核实"
    en: "Primarily limit orders; the Trading System also supports Market Orders (the Equilibrium Price algorithm has a dedicated rule for a \"Market Order Surplus\"); a complete order-type/time-in-force enumeration was not individually verified this session"
    sources:
      - title: Regulatory Notice 8.2.1（第4.3节 Market Order Surplus 算法）
        url: https://rulebook.sgx.com/rulebook/regulatory-notice-821-trading-hours-market-phases-application-market-phases-and-principles
        accessed: 2026-08-14
    quote: "If market orders are present and the market order volume on one side exceeds the cumulative order volume on the opposite side there would be a Market Order Surplus."
    confidence: medium

  tick_size:
    spec:
      regime: tiered_by_price
      min_tick: 0.001
      currency: SGD
      ladder:
        - {price_min: 0, price_max: 0.20, tick: 0.001}
        - {price_min: 0.20, price_max: 1.00, tick: 0.005}
        - {price_min: 1.00, price_max: null, tick: 0.01}
      full_table_note: "普通股票 3 档（SGX-ST Rules 8.3.3）；结构性权证门槛为 S$2 而非 S$1；ETF / ETN 为 S$0.01 或 S$0.001（SGX-ST 指定）；债券 / 贷款股 / 优先股统一 S$0.001。港元 / 人民币 / 日元计价证券按港交所 / 日本市场对齐，不适用本表"
      note: "0.20–0.995 档 tick 为 0.005，1.00 及以上为 0.01"
    zh: "分三档：股价<S$0.20 为S$0.001；S$0.20–0.995 为S$0.005；S$1.00以上为S$0.01（结构性权证门槛为S$2而非S$1）；ETF/ETN为S$0.01或S$0.001（由SGX-ST另行指定）；债券/贷款股/优先股统一S$0.001"
    en: "Three tiers: below S$0.20 → S$0.001; S$0.20–0.995 → S$0.005; S$1.00 and above → S$0.01 (structured warrants use a S$2 threshold instead of S$1); ETFs/ETNs at S$0.01 or S$0.001 as SGX-ST determines; debentures/bonds/loan stocks/preference shares uniformly S$0.001"
    detail: "港元/人民币/日元计价的证券另按港交所/日本市场的最小报价单位对齐，不适用本表。"
    sources:
      - title: SGX-ST Rules 8.3.3
        url: https://rulebook.sgx.com/rulebook/sgx-st-rules
        accessed: 2026-08-14
    quote: "Below 0.20 0.001 0.20–0.995 0.005 1.00 and above 0.01 ... Structured warrants Below 0.20 0.001 0.20–1.995 0.005 2.00 and above 0.01"
    confidence: high

  board_lot_size:
    zh: "100股（自2015年1月19日起，由此前的1,000股下调）"
    en: "100 units (since 19 January 2015, reduced from 1,000)"
