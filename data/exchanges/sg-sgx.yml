        accessed: 2026-08-14
    detail_note: "原引文「Markets are licensed by MAS as approved exchanges (AEs) or recognised market operators (RMOs) under the Securities and Futures Act 2001.」本次无法逐字核实：缓存的 sso.agc.gov.sg/act/sfa2001 实为 CloudFront 403 错误页（见 .cache/sg-sgx/sso-agc-gov-sg-act-sfa2001-607b3817a2.html），不含正文，故由 high 降为 medium，留待人工提供原文后再升级。"
