  dividend_withholding_tax:
    zh: "新加坡居民公司在单层企业税制下派发的股息，股东端免税（公司层面已缴纳的税款视为最终税负）"
    en: "Dividends paid by Singapore resident companies under the one-tier corporate tax system are not taxable to shareholders, as the tax paid at the company level is final"
    sources:
      - title: Dividends（IRAS官网，个人所得税「应税/不应税」说明）
        url: https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/what-is-taxable-what-is-not/dividends
