      zh: "午休 12:00-13:00，含 Pre-Open（12:00至12:58/59随机结束）与 Non-Cancel（至13:00）两阶段单一价格集合竞价，计算下午开盘价"
      en: "Mid-Day Break 12:00-13:00, comprising a Pre-Open Phase (12:00 to a random end at 12:58-12:59) and a Non-Cancel Phase (to 13:00), computing the afternoon session's opening price"
