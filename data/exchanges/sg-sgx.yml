  self_regulatory_org:
    zh: "新加坡交易所监管公司（SGX RegCo），SGX 集团下独立子公司，承担前线监管职能"
    en: "Singapore Exchange Regulation Pte. Ltd. (SGX RegCo), a dedicated subsidiary of the SGX Group carrying out front-line regulatory functions"
    detail: "结构上类似 JPX 集团下的 Japan Exchange Regulation：交易所自身设独立法人实体专司监管职能，而非与商业运营部门混同。"
