  boards:
    - id: sgx-mainboard
      name_zh: 主板
      name_native: "Mainboard"
      financial_threshold: "三选一：①最近一年综合税前利润≥S$1,000万且三年经营记录；②最近一年盈利且三年经营记录且市值≥S$1.5亿；③最近一年有营业收入且市值≥S$3亿"
      target_companies: "大中型成熟企业"
    - id: sgx-catalist
      name_zh: 凯利板
      name_native: "Catalist"
      financial_threshold: "无量化门槛，改由保荐人（Sponsor）承担适合性审查主责"
      target_companies: "中小型/成长型企业；前身为SESDAQ二板，2007年前后改制为保荐人监管模式"
    - id: sgx-global-listing-board
      name_zh: 全球上市板
      name_native: "Global Listing Board"
      financial_threshold: "股东≥500名（全球）；市值≥S$20亿；另须满足以美元计的营收（近一年≥US$9,000万）或利润（近三年合计≥US$1,100万，且各年为正、最近一年≥US$220万）二选一测试"
      target_companies: "已在Nasdaq上市、寻求于新交所双重上市的公司——2026年新设的第三板块，规则条文大量出现「Nasdaq」「Nasdaq Listing Rules」定义，专为SGX-Nasdaq双重上市设计"

  review_system:
    enum: mixed_by_board
    zh: "混合制：主板为交易所量化门槛审核（利润/市值三选一测试），凯利板为保荐人主导的披露为本制度（保荐人对适合性负主责），全球上市板锚定Nasdaq上市标准，三板块审核逻辑并不统一"
    en: "Hybrid: Mainboard uses Exchange-vetted quantitative admission tests; Catalist is a disclosure-based, sponsor-supervised regime where the sponsor bears primary responsibility for suitability; the Global Listing Board anchors to Nasdaq listing standards — the three boards do not share one review philosophy"
    detail: "分类判断本身是归纳而非直接引语，故标 medium；三条支撑引语各自 high。"
    sources:
      - title: Mainboard Rules（Quantitative Criteria 条款）
        url: https://rulebook.sgx.com/rulebook/mainboard-rules
        accessed: 2026-08-14
      - title: Catalist Rules（Practice Note — Sponsor's Role）
        url: https://rulebook.sgx.com/rulebook/catalist-rules
        accessed: 2026-08-14
      - title: Global Listing Board Rules
        url: https://rulebook.sgx.com/rulebook/global-listing-board-rules
        accessed: 2026-08-14
    quote: "A sponsor has the primary responsibility for assessing a listing applicant's suitability for listing."
