  odd_lot_handling:
    zh: "设独立「碎股市场」（unit share market），订单可按低于1个board lot的任意数量成交，与整手市场分开撮合"
    en: "A separate unit share market allows orders in any quantity less than 1 board lot, matched apart from the round-lot market"
