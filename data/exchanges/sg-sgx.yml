  implicit_costs_note:
    zh: "相对香港、东京等更大市场，SGX 现货股票（尤其中小市值与 Catalist 板块）流动性偏薄，买卖价差（bid-ask spread）往往更宽，大额订单的冲击成本（market impact）更高；这是「隐性成本」的主要来源。MAS 的股权市场检讨（EQMRG）亦将提升流动性列为改革方向。本描述为市场结构归纳，非逐股实测，故标 medium。"
    en: "Relative to larger markets such as Hong Kong or Tokyo, SGX-listed equities (especially small/mid-cap and Catalist names) tend to be less liquid, with wider bid-ask spreads and higher market-impact cost for large orders — the main source of implicit cost. MAS's equity-market review (EQMRG) likewise lists liquidity enhancement as a reform priority. This is a market-structure summary, not a per-name measurement, so confidence is medium."
    sources:
      - title: MAS — Equity Market Review Group (EQMRG) 报告（流动性/市场广度相关论述）
        url: https://www.mas.gov.sg/news/speeches/2024/equity-market-review-group-report
        accessed: 2026-08-27
    confidence: medium

